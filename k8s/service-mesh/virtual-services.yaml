---
# Virtual Service for API Gateway
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway
  namespace: flamoral
spec:
  hosts:
    - api-gateway
    - api.flamoral.com
  gateways:
    - istio-gateway
  http:
    # Canary deployment - 10% to v2, 90% to v1
    - match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: api-gateway
            subset: v2
          weight: 100
    - route:
        - destination:
            host: api-gateway
            subset: v1
          weight: 90
        - destination:
            host: api-gateway
            subset: v2
          weight: 10
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: 5xx,reset,connect-failure,refused-stream

---
# Virtual Service for Auth Service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: auth-service
  namespace: flamoral
spec:
  hosts:
    - auth-service
  http:
    - route:
        - destination:
            host: auth-service
            port:
              number: 3001
      timeout: 15s
      retries:
        attempts: 2
        perTryTimeout: 5s

---
# Virtual Service for User Service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: user-service
  namespace: flamoral
spec:
  hosts:
    - user-service
  http:
    - route:
        - destination:
            host: user-service
            port:
              number: 3002
      timeout: 20s

---
# Virtual Service for Matching Service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: matching-service
  namespace: flamoral
spec:
  hosts:
    - matching-service
  http:
    - route:
        - destination:
            host: matching-service
            port:
              number: 3003
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s

---
# Virtual Service for Messaging Service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: messaging-service
  namespace: flamoral
spec:
  hosts:
    - messaging-service
  http:
    - route:
        - destination:
            host: messaging-service
            port:
              number: 3004
      timeout: 15s

---
# Virtual Service for Realtime Service (WebSocket)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: realtime-service
  namespace: flamoral
spec:
  hosts:
    - realtime-service
    - api.flamoral.com
  gateways:
    - istio-gateway
  http:
    - match:
        - uri:
            prefix: "/ws"
      route:
        - destination:
            host: realtime-service
            port:
              number: 3007
      timeout: 3600s
      websocketUpgrade: true

---
# Istio Gateway
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-gateway
  namespace: flamoral
spec:
  selector:
    istio: ingressgateway
  servers:
    # HTTP (redirect to HTTPS)
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.flamoral.com"
      tls:
        httpsRedirect: true

    # HTTPS
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "flamoral.com"
        - "www.flamoral.com"
        - "api.flamoral.com"
      tls:
        mode: SIMPLE
        credentialName: flamoral-tls

---
# Destination Rules with Circuit Breaking
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-gateway
  namespace: flamoral
spec:
  host: api-gateway
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1000
      http:
        http1MaxPendingRequests: 1000
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 40
    loadBalancer:
      simple: LEAST_REQUEST
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2

---
# Destination Rule for Auth Service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: auth-service
  namespace: flamoral
spec:
  host: auth-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 500
      http:
        http1MaxPendingRequests: 500
        http2MaxRequests: 500
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 30s
      baseEjectionTime: 30s
    loadBalancer:
      simple: ROUND_ROBIN

---
# Destination Rule for Matching Service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: matching-service
  namespace: flamoral
spec:
  host: matching-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1000
      http:
        http1MaxPendingRequests: 1000
        http2MaxRequests: 1500
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
    loadBalancer:
      consistentHash:
        httpHeaderName: "x-user-id"

---
# Destination Rule for Realtime Service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: realtime-service
  namespace: flamoral
spec:
  host: realtime-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 2000
      http:
        http1MaxPendingRequests: 2000
        http2MaxRequests: 2000
    loadBalancer:
      consistentHash:
        httpHeaderName: "x-user-id"

---
# Fault Injection for Testing (disabled by default)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: fault-injection
  namespace: flamoral
  annotations:
    enabled: "false"
spec:
  hosts:
    - matching-service
  http:
    - match:
        - headers:
            x-test-fault:
              exact: "true"
      fault:
        delay:
          percentage:
            value: 10.0
          fixedDelay: 5s
        abort:
          percentage:
            value: 5.0
          httpStatus: 503
      route:
        - destination:
            host: matching-service

---
# Traffic Mirroring for Testing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: traffic-mirror
  namespace: flamoral
  annotations:
    enabled: "false"
spec:
  hosts:
    - api-gateway
  http:
    - route:
        - destination:
            host: api-gateway
            subset: v1
          weight: 100
      mirror:
        host: api-gateway
        subset: v2
      mirrorPercentage:
        value: 10.0
