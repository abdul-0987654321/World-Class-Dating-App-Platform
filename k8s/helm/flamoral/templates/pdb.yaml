{{/* Pod Disruption Budgets for high-availability services */}}

{{/* API Gateway PDB */}}
{{- if and .Values.apiGateway.enabled (ge (int .Values.apiGateway.replicaCount) 2) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "flamoral.fullname" . }}-api-gateway
  labels:
    {{- include "flamoral.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "flamoral.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-gateway
{{- end }}
