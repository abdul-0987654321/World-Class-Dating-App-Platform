{{- if .Values.secrets.enabled }}
{{- if not .Values.secrets.useAzureKeyVault }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flamoral.fullname" . }}-secrets
  labels:
    {{- include "flamoral.labels" . | nindent 4 }}
type: Opaque
data:
  # These should be populated via CI/CD or external secrets operator
  DATABASE_URL: ""
  REDIS_URL: ""
  JWT_SECRET: ""
  JWT_REFRESH_SECRET: ""
  AZURE_STORAGE_CONNECTION_STRING: ""
  SIGNALR_CONNECTION_STRING: ""
  STRIPE_SECRET_KEY: ""
  SENDGRID_API_KEY: ""
{{- else }}
# Using Azure Key Vault via CSI Driver
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "flamoral.fullname" . }}-secrets
  labels:
    {{- include "flamoral.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    keyvaultName: {{ .Values.secrets.keyVaultName | quote }}
    cloudName: ""
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: storage-connection-string
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: jwt-refresh-secret
          objectType: secret
        - |
          objectName: stripe-secret-key
          objectType: secret
        - |
          objectName: sendgrid-api-key
          objectType: secret
    tenantId: {{ .Values.global.tenantId | default "" | quote }}
  secretObjects:
    - secretName: {{ include "flamoral.fullname" . }}-secrets
      type: Opaque
      data:
        - objectName: postgres-password
          key: DATABASE_PASSWORD
        - objectName: redis-connection-string
          key: REDIS_URL
        - objectName: storage-connection-string
          key: AZURE_STORAGE_CONNECTION_STRING
        - objectName: jwt-secret
          key: JWT_SECRET
        - objectName: jwt-refresh-secret
          key: JWT_REFRESH_SECRET
        - objectName: stripe-secret-key
          key: STRIPE_SECRET_KEY
        - objectName: sendgrid-api-key
          key: SENDGRID_API_KEY
{{- end }}
{{- end }}
