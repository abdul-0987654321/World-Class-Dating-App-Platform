{{/* Auth Service */}}
{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flamoral.fullname" . }}-auth-service
  labels:
    {{- include "flamoral.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  {{- if not .Values.authService.autoscaling.enabled }}
  replicas: {{ .Values.authService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "flamoral.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        {{- include "flamoral.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth-service
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "flamoral.serviceAccountName" . }}
      containers:
        - name: auth-service
          image: "{{ .Values.global.image.registry }}/{{ .Values.authService.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.authService.service.targetPort }}
          livenessProbe:
            {{- toYaml .Values.healthCheck.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.healthCheck.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "flamoral.fullname" . }}-config
            - secretRef:
                name: {{ include "flamoral.fullname" . }}-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    {{- include "flamoral.labels" . | nindent 4 }}
spec:
  type: {{ .Values.authService.service.type }}
  ports:
    - port: {{ .Values.authService.service.port }}
      targetPort: {{ .Values.authService.service.targetPort }}
      name: http
  selector:
    {{- include "flamoral.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
{{- end }}
