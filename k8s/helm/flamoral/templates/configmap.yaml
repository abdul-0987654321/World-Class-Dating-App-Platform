{{- if .Values.configMaps.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flamoral.fullname" . }}-config
  labels:
    {{- include "flamoral.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ if eq .Values.global.environment "production" }}"info"{{ else }}"debug"{{ end }}

  # Service URLs (internal cluster DNS)
  API_GATEWAY_URL: "http://api-gateway"
  AUTH_SERVICE_URL: "http://auth-service"
  USER_SERVICE_URL: "http://user-service"
  MATCHING_SERVICE_URL: "http://matching-service"
  MESSAGING_SERVICE_URL: "http://messaging-service"
  MEDIA_SERVICE_URL: "http://media-service"

  # CORS
  CORS_ORIGINS: {{ if eq .Values.global.environment "production" }}"https://flamoral.com,https://www.flamoral.com"{{ else if eq .Values.global.environment "test" }}"https://test.flamoral.com"{{ else }}"http://localhost:3000,http://localhost:5173"{{ end }}

  # Feature flags
  ENABLE_SWAGGER: {{ if eq .Values.global.environment "production" }}"false"{{ else }}"true"{{ end }}
  ENABLE_DEBUG_ROUTES: {{ if eq .Values.global.environment "production" }}"false"{{ else }}"true"{{ end }}
{{- end }}
