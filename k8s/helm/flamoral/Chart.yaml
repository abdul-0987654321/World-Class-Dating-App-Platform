apiVersion: v2
name: flamoral
description: Flamoral Dating Platform Helm Chart
type: application
version: 1.0.0
appVersion: "1.0.0"
maintainers:
  - name: Flamoral Engineering
    email: engineering@flamoral.com
keywords:
  - dating
  - flamoral
  - microservices
  - kubernetes
dependencies:
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "13.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
