---
# API Gateway Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: flamoral
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
  unhealthyPodEvictionPolicy: AlwaysAllow

