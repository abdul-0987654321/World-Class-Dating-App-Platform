---
# NOTE: This is a template. In production, use Sealed Secrets or External Secrets Operator
# All values here are base64 encoded placeholders and MUST be replaced

apiVersion: v1
kind: Secret
metadata:
  name: flamoral-secrets
  namespace: flamoral
type: Opaque
stringData:
  # Database Credentials
  database-url: "postgresql://postgres:REPLACE_WITH_ACTUAL_PASSWORD@postgres:5432/flamoral"
  db-user: "postgres"
  db-password: "REPLACE_WITH_ACTUAL_PASSWORD"

  # JWT Secrets (minimum 32 characters)
  jwt-secret: "REPLACE_WITH_STRONG_JWT_SECRET_MIN_32_CHARS"
  jwt-access-secret: "REPLACE_WITH_STRONG_ACCESS_SECRET_MIN_32_CHARS"
  jwt-refresh-secret: "REPLACE_WITH_STRONG_REFRESH_SECRET_MIN_32_CHARS"

  # Redis
  redis-host: "redis-master"
  redis-password: "REPLACE_WITH_REDIS_PASSWORD"
  redis-url: "redis://:REPLACE_WITH_REDIS_PASSWORD@redis-master:6379"

  # RabbitMQ
  rabbitmq-url: "amqp://REPLACE_USER:REPLACE_PASSWORD@rabbitmq:5672"
  rabbitmq-user: "admin"
  rabbitmq-password: "REPLACE_WITH_RABBITMQ_PASSWORD"

  # Internal Service Communication
  internal-service-key: "REPLACE_WITH_INTERNAL_SERVICE_KEY"

  # OAuth Providers
  google-client-id: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  google-client-secret: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
  facebook-app-id: "REPLACE_WITH_FACEBOOK_APP_ID"
  facebook-app-secret: "REPLACE_WITH_FACEBOOK_APP_SECRET"

  # Email Service (SendGrid/Mailgun)
  sendgrid-api-key: "REPLACE_WITH_SENDGRID_API_KEY"
  email-from: "noreply@flamoral.com"

  # SMS Service (Twilio)
  twilio-account-sid: "REPLACE_WITH_TWILIO_SID"
  twilio-auth-token: "REPLACE_WITH_TWILIO_TOKEN"
  twilio-phone-number: "REPLACE_WITH_TWILIO_PHONE"

  # Push Notifications (Firebase)
  firebase-server-key: "REPLACE_WITH_FIREBASE_SERVER_KEY"
  firebase-credentials: |
    {
      "type": "service_account",
      "project_id": "flamoral-app",
      "private_key_id": "REPLACE_WITH_PRIVATE_KEY_ID",
      "private_key": "REPLACE_WITH_PRIVATE_KEY",
      "client_email": "firebase-adminsdk@flamoral-app.iam.gserviceaccount.com",
      "client_id": "REPLACE_WITH_CLIENT_ID"
    }

  # AWS/Azure/GCP Credentials
  aws-access-key-id: "REPLACE_WITH_AWS_ACCESS_KEY"
  aws-secret-access-key: "REPLACE_WITH_AWS_SECRET_KEY"
  s3-bucket-name: "flamoral-media-production"

  # Payment Gateway (Stripe)
  stripe-secret-key: "REPLACE_WITH_STRIPE_SECRET_KEY"
  stripe-publishable-key: "REPLACE_WITH_STRIPE_PUBLISHABLE_KEY"
  stripe-webhook-secret: "REPLACE_WITH_STRIPE_WEBHOOK_SECRET"

  # Monitoring & Error Tracking
  sentry-dsn: "REPLACE_WITH_SENTRY_DSN"
  datadog-api-key: "REPLACE_WITH_DATADOG_API_KEY"

  # Video Chat (Agora/Twilio Video)
  agora-app-id: "REPLACE_WITH_AGORA_APP_ID"
  agora-app-certificate: "REPLACE_WITH_AGORA_APP_CERTIFICATE"

  # Encryption Keys
  encryption-key: "REPLACE_WITH_32_BYTE_ENCRYPTION_KEY"
  session-secret: "REPLACE_WITH_SESSION_SECRET"

---
# TLS Secret Template
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-tls
  namespace: flamoral
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_ACTUAL_CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_ACTUAL_PRIVATE_KEY
    -----END PRIVATE KEY-----

---
# Docker Registry Secret
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: flamoral
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "https://index.docker.io/v1/": {
          "username": "REPLACE_WITH_DOCKERHUB_USERNAME",
          "password": "REPLACE_WITH_DOCKERHUB_PASSWORD",
          "email": "REPLACE_WITH_EMAIL",
          "auth": "REPLACE_WITH_BASE64_USERNAME_PASSWORD"
        }
      }
    }
