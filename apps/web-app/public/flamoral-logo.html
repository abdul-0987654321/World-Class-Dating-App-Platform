<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flamoral — Brand Identity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Italiana&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Brand Colors */
            --flame-core: #ff3366;
            --flame-mid: #db2777;
            --flame-outer: #ec4899;
            --coral-warm: #f43f5e;
            --coral-soft: #fb7185;
            --petal-pink: #fda4af;
            --petal-blush: #fce7f3;
            --gold-spark: #fbbf24;
            --gold-warm: #f59e0b;

            /* Background System */
            --bg-deep: #000000;
            --bg-midnight: #0a1628;
            --bg-navy: #1a365d;

            /* Gradients */
            --gradient-midnight: linear-gradient(135deg, #000000 0%, #0a1628 50%, #1a365d 100%);
            --gradient-passion: linear-gradient(135deg, #000000 0%, #1a0a14 40%, #db2777 100%);
            --gradient-aurora: linear-gradient(135deg, #1e3a5f 0%, #3b1a40 35%, #4a1942 50%, #1a3d2e 75%, #0d4a3d 100%);
            --gradient-flame: linear-gradient(180deg, #ff3366 0%, #db2777 40%, #9d174d 100%);
            --gradient-petal: linear-gradient(180deg, #fce7f3 0%, #fda4af 50%, #fb7185 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--gradient-midnight);
            font-family: 'Cormorant Garamond', Georgia, serif;
            overflow-x: hidden;
            color: #fff;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .glow-orb.orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(219, 39, 119, 0.5) 0%, transparent 70%);
            top: -200px;
            left: -100px;
            animation-delay: 0s;
        }

        .glow-orb.orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.4) 0%, transparent 70%);
            bottom: -150px;
            right: -100px;
            animation-delay: -7s;
        }

        .glow-orb.orb-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(251, 113, 133, 0.3) 0%, transparent 70%);
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: -14s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.05); }
            50% { transform: translate(-20px, 30px) scale(0.95); }
            75% { transform: translate(20px, 20px) scale(1.02); }
        }

        /* Sparkle Particles */
        .sparkles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold-spark);
            border-radius: 50%;
            animation: sparkleFloat 8s ease-in-out infinite;
            box-shadow: 0 0 6px var(--gold-warm), 0 0 12px rgba(251, 191, 36, 0.5);
        }

        @keyframes sparkleFloat {
            0%, 100% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 1;
                transform: translateY(80vh) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(10vh) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(0) scale(0);
            }
        }

        /* Main Container */
        .brand-showcase {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .section-title {
            font-family: 'Italiana', serif;
            font-size: 14px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
            padding-left: 4px;
        }

        /* ========== FLAMORAL ICON ========== */
        .flamoral-icon {
            position: relative;
            width: 120px;
            height: 140px;
        }

        .flamoral-icon svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Flame-Floral Combined Shape */
        .flame-petal {
            fill: url(#flameGradient);
            filter: url(#glow);
            transform-origin: center bottom;
            animation: flameFlicker 3s ease-in-out infinite;
        }

        .flame-petal-inner {
            fill: url(#innerGradient);
            animation: flameFlicker 3s ease-in-out infinite;
            animation-delay: -0.5s;
        }

        .petal-accent {
            fill: url(#petalGradient);
            opacity: 0.8;
            animation: petalSway 4s ease-in-out infinite;
        }

        @keyframes flameFlicker {
            0%, 100% {
                transform: scaleY(1) scaleX(1);
                filter: brightness(1);
            }
            25% {
                transform: scaleY(1.02) scaleX(0.98);
                filter: brightness(1.1);
            }
            50% {
                transform: scaleY(0.98) scaleX(1.01);
                filter: brightness(0.95);
            }
            75% {
                transform: scaleY(1.01) scaleX(0.99);
                filter: brightness(1.05);
            }
        }

        @keyframes petalSway {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            50% { transform: rotate(2deg) translateX(2px); }
        }

        /* Icon Glow Pulse */
        .icon-glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(219, 39, 119, 0.3) 0%, transparent 70%);
            animation: glowPulse 4s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes glowPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.3; }
        }

        /* ========== WORDMARK ========== */
        .wordmark {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 500;
            font-style: italic;
            letter-spacing: 0.08em;
            position: relative;
            display: inline-block;
        }

        .wordmark-text {
            color: #ffffff;
            -webkit-text-fill-color: #ffffff;
            text-shadow: 0 0 30px rgba(219, 39, 119, 0.5), 0 0 60px rgba(219, 39, 119, 0.3);
            position: relative;
        }

        .wordmark-shimmer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(253, 164, 175, 0.6) 50%,
                transparent 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerSlide 4s ease-in-out infinite;
            background-size: 200% 100%;
        }

        @keyframes shimmerSlide {
            0%, 100% { background-position: 200% 0; }
            50% { background-position: -200% 0; }
        }

        /* ========== TAGLINE ========== */
        .tagline {
            font-family: 'Italiana', serif;
            font-size: 14px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(253, 164, 175, 0.8);
            margin-top: 12px;
        }

        /* ========== LOGO VARIATIONS ========== */

        /* Primary Vertical */
        .logo-vertical {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 60px 40px;
            background: radial-gradient(ellipse at center, rgba(219, 39, 119, 0.08) 0%, transparent 60%);
            border-radius: 24px;
            animation: fadeInUp 1s ease-out forwards;
        }

        .logo-vertical .wordmark {
            font-size: 56px;
        }

        /* Horizontal Compact */
        .logo-horizontal {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 40px;
            background: radial-gradient(ellipse at center, rgba(219, 39, 119, 0.06) 0%, transparent 60%);
            border-radius: 20px;
            animation: fadeInUp 1s ease-out 0.2s forwards;
            opacity: 0;
        }

        .logo-horizontal .flamoral-icon {
            width: 60px;
            height: 70px;
        }

        .logo-horizontal .wordmark {
            font-size: 36px;
        }

        .logo-horizontal .tagline {
            font-size: 10px;
            margin-top: 6px;
        }

        /* Monogram */
        .logo-monogram {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            animation: fadeInUp 1s ease-out 0.4s forwards;
            opacity: 0;
        }

        .monogram-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .monogram-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid;
            border-color: rgba(219, 39, 119, 0.4);
            border-radius: 50%;
            animation: ringPulse 3s ease-in-out infinite;
        }

        .monogram-ring.ring-2 {
            width: 140px;
            height: 140px;
            border-color: rgba(219, 39, 119, 0.2);
            animation-delay: -1s;
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.3; }
        }

        .monogram-letter {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 72px;
            font-weight: 600;
            font-style: italic;
            background: var(--gradient-flame);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
        }

        /* Light Mode Variant */
        .logo-light-mode {
            background: linear-gradient(135deg, #fefefe 0%, #fce7f3 50%, #fff1f2 100%);
            padding: 60px 40px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeInUp 1s ease-out 0.6s forwards;
            opacity: 0;
        }

        .logo-light-mode .wordmark-text {
            color: #9d174d;
            -webkit-text-fill-color: #9d174d;
            text-shadow: 0 0 20px rgba(219, 39, 119, 0.2);
        }

        .logo-light-mode .tagline {
            color: rgba(157, 23, 77, 0.7);
        }

        .logo-light-mode .icon-glow-ring {
            background: radial-gradient(circle, rgba(219, 39, 119, 0.15) 0%, transparent 70%);
        }

        /* Fade In Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Grid Layout */
        .logo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            margin-top: 60px;
        }

        .logo-grid > div:first-child {
            grid-column: span 2;
        }

        @media (max-width: 900px) {
            .logo-grid {
                grid-template-columns: 1fr;
            }
            .logo-grid > div:first-child {
                grid-column: span 1;
            }
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(219, 39, 119, 0.3) 50%, transparent 100%);
            margin: 80px 0;
        }

        /* Header */
        .brand-header {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .brand-header h1 {
            font-family: 'Italiana', serif;
            font-size: 12px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 16px;
        }

        .brand-header p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-style: italic;
            color: rgba(253, 164, 175, 0.6);
        }

        /* Label Tags */
        .variation-label {
            font-family: 'Italiana', serif;
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 16px;
            text-align: center;
        }

        .logo-light-mode .variation-label {
            color: rgba(26, 10, 20, 0.4);
        }

        /* Color Swatches */
        .color-palette {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .color-swatch {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .color-swatch:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <!-- Ambient Background -->
    <div class="ambient-glow">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <!-- Floating Sparkles -->
    <div class="sparkles-container" id="sparkles"></div>

    <!-- Main Content -->
    <div class="brand-showcase">
        <header class="brand-header">
            <h1>Brand Identity</h1>
            <p>"Speak softly. Look powerful. Connect deeply."</p>
        </header>

        <!-- SVG Definitions -->
        <svg width="0" height="0" style="position: absolute;">
            <defs>
                <!-- Flame Gradient -->
                <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" style="stop-color:#9d174d"/>
                    <stop offset="40%" style="stop-color:#db2777"/>
                    <stop offset="70%" style="stop-color:#f43f5e"/>
                    <stop offset="100%" style="stop-color:#ff6b8a"/>
                </linearGradient>

                <!-- Inner Glow Gradient -->
                <linearGradient id="innerGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" style="stop-color:#db2777"/>
                    <stop offset="50%" style="stop-color:#fb7185"/>
                    <stop offset="100%" style="stop-color:#fda4af"/>
                </linearGradient>

                <!-- Petal Gradient -->
                <linearGradient id="petalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#fce7f3"/>
                    <stop offset="50%" style="stop-color:#fda4af"/>
                    <stop offset="100%" style="stop-color:#fb7185"/>
                </linearGradient>

                <!-- Dark Mode Gradient -->
                <linearGradient id="flameGradientDark" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" style="stop-color:#4a1942"/>
                    <stop offset="40%" style="stop-color:#9d174d"/>
                    <stop offset="70%" style="stop-color:#db2777"/>
                    <stop offset="100%" style="stop-color:#ec4899"/>
                </linearGradient>

                <!-- F Monogram Gradient -->
                <linearGradient id="fGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#9d174d"/>
                    <stop offset="50%" style="stop-color:#db2777"/>
                    <stop offset="100%" style="stop-color:#fb7185"/>
                </linearGradient>

                <!-- Light Mode Gradients -->
                <linearGradient id="flameDark" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" style="stop-color:#7f1d4e"/>
                    <stop offset="40%" style="stop-color:#9d174d"/>
                    <stop offset="70%" style="stop-color:#be185d"/>
                    <stop offset="100%" style="stop-color:#db2777"/>
                </linearGradient>
                <linearGradient id="innerDark" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" style="stop-color:#9d174d"/>
                    <stop offset="50%" style="stop-color:#db2777"/>
                    <stop offset="100%" style="stop-color:#ec4899"/>
                </linearGradient>

                <!-- Glow Filter -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Strong Glow Filter -->
                <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
        </svg>

        <div class="section-title">Logo Variations</div>

        <div class="logo-grid">
            <!-- Primary Vertical Version -->
            <div class="logo-vertical">
                <div class="variation-label">Primary - Vertical</div>
                <div class="flamoral-icon">
                    <div class="icon-glow-ring"></div>
                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                        <!-- Main Flame-Petal Shape -->
                        <path class="flame-petal" d="
                            M50 5
                            C50 5 75 25 78 55
                            C80 75 70 95 50 110
                            C30 95 20 75 22 55
                            C25 25 50 5 50 5
                            Z
                        "/>

                        <!-- Inner Flame Core -->
                        <path class="flame-petal-inner" d="
                            M50 25
                            C50 25 65 40 67 60
                            C68 75 60 90 50 100
                            C40 90 32 75 33 60
                            C35 40 50 25 50 25
                            Z
                        "/>

                        <!-- Left Petal Accent -->
                        <path class="petal-accent" d="
                            M30 50
                            C20 45 10 55 15 70
                            C18 80 28 85 35 80
                            C25 75 25 60 30 50
                            Z
                        " style="animation-delay: -1s;"/>

                        <!-- Right Petal Accent -->
                        <path class="petal-accent" d="
                            M70 50
                            C80 45 90 55 85 70
                            C82 80 72 85 65 80
                            C75 75 75 60 70 50
                            Z
                        " style="animation-delay: -2s;"/>

                        <!-- Center Highlight -->
                        <ellipse cx="50" cy="55" rx="8" ry="15" fill="url(#innerGradient)" opacity="0.6" filter="url(#glow)"/>
                    </svg>
                </div>
                <div class="wordmark">
                    <span class="wordmark-text">Flamoral</span>
                    <span class="wordmark-shimmer">Flamoral</span>
                </div>
                <div class="tagline">Where Hearts Bloom</div>
            </div>

            <!-- Horizontal Compact Version -->
            <div class="logo-horizontal">
                <div style="width: 100%; text-align: center;">
                    <div class="variation-label">Compact - Horizontal</div>
                    <div style="display: flex; align-items: center; justify-content: center; gap: 20px;">
                        <div class="flamoral-icon">
                            <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                                <path class="flame-petal" d="M50 5 C50 5 75 25 78 55 C80 75 70 95 50 110 C30 95 20 75 22 55 C25 25 50 5 50 5 Z"/>
                                <path class="flame-petal-inner" d="M50 25 C50 25 65 40 67 60 C68 75 60 90 50 100 C40 90 32 75 33 60 C35 40 50 25 50 25 Z"/>
                                <ellipse cx="50" cy="55" rx="8" ry="15" fill="url(#innerGradient)" opacity="0.6"/>
                            </svg>
                        </div>
                        <div>
                            <div class="wordmark">
                                <span class="wordmark-text">Flamoral</span>
                                <span class="wordmark-shimmer">Flamoral</span>
                            </div>
                            <div class="tagline">Where Hearts Bloom</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Monogram Version -->
            <div class="logo-monogram">
                <div style="text-align: center;">
                    <div class="variation-label">Monogram - Icon Only</div>
                    <div class="monogram-container">
                        <div class="monogram-ring"></div>
                        <div class="monogram-ring ring-2"></div>
                        <svg width="80" height="100" viewBox="0 0 100 120" style="position: relative; z-index: 1;">
                            <!-- Stylized F with flame-petal integration -->
                            <path fill="url(#fGradient)" filter="url(#glow)" d="
                                M35 110
                                L35 50
                                C35 30 45 15 55 10
                                C60 8 70 10 75 18
                                C78 24 76 32 70 35
                                L55 35
                                L55 50
                                L70 50
                                C75 50 78 55 75 60
                                C72 65 68 65 65 65
                                L55 65
                                L55 110
                                C55 115 50 118 45 115
                                C40 112 35 112 35 110
                                Z
                            ">
                                <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
                            </path>
                            <!-- Flame tip on F -->
                            <path fill="url(#innerGradient)" opacity="0.8" d="
                                M55 10
                                C55 10 65 5 70 15
                                C72 20 68 25 65 22
                                C60 18 55 10 55 10
                                Z
                            ">
                                <animate attributeName="d"
                                    values="M55 10 C55 10 65 5 70 15 C72 20 68 25 65 22 C60 18 55 10 55 10 Z;
                                            M55 10 C55 10 68 3 72 14 C75 20 70 26 66 23 C61 19 55 10 55 10 Z;
                                            M55 10 C55 10 65 5 70 15 C72 20 68 25 65 22 C60 18 55 10 55 10 Z"
                                    dur="2s" repeatCount="indefinite"/>
                            </path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Light Mode Variant -->
            <div class="logo-light-mode">
                <div class="variation-label">Light Mode - Bright Backgrounds</div>
                <div class="flamoral-icon">
                    <div class="icon-glow-ring"></div>
                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                        <path class="flame-petal" fill="url(#flameDark)" d="M50 5 C50 5 75 25 78 55 C80 75 70 95 50 110 C30 95 20 75 22 55 C25 25 50 5 50 5 Z"/>
                        <path class="flame-petal-inner" fill="url(#innerDark)" d="M50 25 C50 25 65 40 67 60 C68 75 60 90 50 100 C40 90 32 75 33 60 C35 40 50 25 50 25 Z"/>
                        <path class="petal-accent" fill="url(#flameDark)" opacity="0.6" d="M30 50 C20 45 10 55 15 70 C18 80 28 85 35 80 C25 75 25 60 30 50 Z" style="animation-delay: -1s;"/>
                        <path class="petal-accent" fill="url(#flameDark)" opacity="0.6" d="M70 50 C80 45 90 55 85 70 C82 80 72 85 65 80 C75 75 75 60 70 50 Z" style="animation-delay: -2s;"/>
                        <ellipse cx="50" cy="55" rx="8" ry="15" fill="url(#innerDark)" opacity="0.5"/>
                    </svg>
                </div>
                <div class="wordmark" style="font-size: 48px;">
                    <span class="wordmark-text">Flamoral</span>
                </div>
                <div class="tagline">Where Hearts Bloom</div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Color Palette Display -->
        <div class="section-title">Brand Colors</div>
        <div class="color-palette">
            <div class="color-swatch" style="background: linear-gradient(180deg, #ff3366 0%, #db2777 40%, #9d174d 100%); box-shadow: 0 4px 20px rgba(219, 39, 119, 0.4);"></div>
            <div class="color-swatch" style="background: #ff3366;"></div>
            <div class="color-swatch" style="background: #db2777;"></div>
            <div class="color-swatch" style="background: #f43f5e;"></div>
            <div class="color-swatch" style="background: #fda4af;"></div>
            <div class="color-swatch" style="background: #fce7f3;"></div>
            <div class="color-swatch" style="background: #fbbf24;"></div>
        </div>
    </div>

    <script>
        // Generate floating sparkles
        const sparklesContainer = document.getElementById('sparkles');
        const sparkleCount = 20;

        for (let i = 0; i < sparkleCount; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = `${Math.random() * 100}%`;
            sparkle.style.animationDelay = `${Math.random() * 8}s`;
            sparkle.style.animationDuration = `${6 + Math.random() * 4}s`;

            // Vary sparkle sizes
            const size = 2 + Math.random() * 4;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;

            sparklesContainer.appendChild(sparkle);
        }
    </script>
</body>
</html>
