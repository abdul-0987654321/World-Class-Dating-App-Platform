<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="flameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="50%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FFB4B4"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#C1121F"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
  </defs>
  <!-- Main flame/flower shape -->
  <path d="M50 15 C35 35, 25 55, 30 70 C35 85, 50 90, 50 90 C50 90, 65 85, 70 70 C75 55, 65 35, 50 15Z" fill="url(#flameGrad)"/>
  <!-- Left petal -->
  <path d="M30 45 C15 55, 20 75, 35 80 C40 72, 38 60, 30 45Z" fill="url(#petalGrad)" opacity="0.8"/>
  <!-- Right petal -->
  <path d="M70 45 C85 55, 80 75, 65 80 C60 72, 62 60, 70 45Z" fill="url(#petalGrad)" opacity="0.8"/>
  <!-- Inner flame -->
  <path d="M50 30 C40 45, 35 60, 40 72 C45 82, 50 85, 50 85 C50 85, 55 82, 60 72 C65 60, 60 45, 50 30Z" fill="url(#flameGrad)" opacity="0.9"/>
  <!-- Core glow -->
  <ellipse cx="50" cy="70" rx="12" ry="15" fill="#FFF5F5" opacity="0.7"/>
  <!-- Center flower detail -->
  <circle cx="50" cy="72" r="4" fill="#FFF5F5" opacity="0.9"/>
  <circle cx="46" cy="68" r="2" fill="#FFB4B4" opacity="0.7"/>
  <circle cx="54" cy="68" r="2" fill="#FFB4B4" opacity="0.7"/>
  <circle cx="50" cy="64" r="2" fill="#FFB4B4" opacity="0.7"/>
</svg>
