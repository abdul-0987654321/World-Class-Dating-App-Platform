<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flamoral-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO and Social Meta Tags -->
    <meta name="description" content="Flamoral - Where Passion Meets Connection. Find meaningful relationships with our premium dating platform." />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="keywords" content="dating, relationships, love, flamoral, premium dating" />
    <meta property="og:title" content="Flamoral - Premium Dating Platform" />
    <meta property="og:description" content="Where Passion Meets Connection" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flamoral.com" />

    <!-- Security Headers -->
    <!-- X-Frame-Options: Prevents clickjacking attacks -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- X-Content-Type-Options: Prevents MIME type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- X-XSS-Protection: Legacy XSS protection for older browsers -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />

    <!-- Referrer Policy: Controls referrer information -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Content Security Policy -->
    <!--
      CSP is set via HTTP headers in vercel.json for production.
      This meta tag is REMOVED to avoid conflicts with the HTTP header.
      The HTTP header CSP in vercel.json includes 'unsafe-inline' and 'unsafe-eval'
      which are required for Vite/React bundled applications.
    -->

    <!-- Permissions Policy: Controls browser features -->
    <meta http-equiv="Permissions-Policy" content="
      camera=(self),
      microphone=(self),
      geolocation=(self),
      payment=(self),
      usb=(),
      magnetometer=(),
      accelerometer=(),
      gyroscope=(),
      ambient-light-sensor=(),
      autoplay=(self),
      fullscreen=(self),
      picture-in-picture=(self),
      display-capture=(),
      document-domain=(),
      encrypted-media=(self),
      midi=(),
      sync-xhr=(),
      interest-cohort=()
    " />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.flamoral.com">

    <!-- Load fonts with integrity check -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    >

    <title>FLAMORAL - Find Your Perfect Connection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
