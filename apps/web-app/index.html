<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/flamoral-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO and Social Meta Tags -->
    <meta name="description" content="Flamoral - Where Passion Meets Connection. Find meaningful relationships with our premium dating platform." />
    <meta name="theme-color" content="#D62839" />
    <meta name="keywords" content="dating, relationships, love, flamoral, premium dating" />
    <meta property="og:title" content="Flamoral - Premium Dating Platform" />
    <meta property="og:description" content="Where Passion Meets Connection" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flamoral.com" />

    <!-- Security Headers -->
    <!-- X-Frame-Options: Prevents clickjacking attacks -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- X-Content-Type-Options: Prevents MIME type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- X-XSS-Protection: Legacy XSS protection for older browsers -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />

    <!-- Referrer Policy: Controls referrer information -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Content Security Policy -->
    <!-- Note: This is a fallback. Primary CSP is set via HTTP headers -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https: blob:;
      font-src 'self' data: https://fonts.gstatic.com;
      connect-src 'self' wss: ws: https://api.flamoral.com;
      media-src 'self' blob: data: https:;
      object-src 'none';
      frame-src 'none';
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
      block-all-mixed-content;
    " />

    <!-- Permissions Policy: Controls browser features -->
    <meta http-equiv="Permissions-Policy" content="
      camera=(self),
      microphone=(self),
      geolocation=(self),
      payment=(self),
      usb=(),
      magnetometer=(),
      accelerometer=(),
      gyroscope=(),
      ambient-light-sensor=(),
      autoplay=(self),
      fullscreen=(self),
      picture-in-picture=(self),
      display-capture=(),
      document-domain=(),
      encrypted-media=(self),
      midi=(),
      sync-xhr=(),
      interest-cohort=()
    " />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.flamoral.com">

    <!-- Load fonts with integrity check -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    >

    <title>Flamoral - Where Passion Meets Connection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
