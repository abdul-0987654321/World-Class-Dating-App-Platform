<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <!-- Background gradient for app icon -->
    <linearGradient id="bgGradient180" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#0A0A0F"/>
    </linearGradient>

    <!-- Primary gradient: Pink to Blue -->
    <linearGradient id="flameGradient180" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>

    <!-- Secondary gradient for inner glow -->
    <linearGradient id="innerGlow180" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>

    <!-- Global connection ring gradient -->
    <linearGradient id="ringGradient180" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="glow180" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer glow for premium feel -->
    <filter id="outerGlow180" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="blur" operator="out"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="url(#bgGradient180)"/>

  <!-- Subtle radial glow in background -->
  <circle cx="90" cy="90" r="70" fill="#EC4899" opacity="0.08"/>

  <!-- Icon centered in the app icon -->
  <g transform="translate(26, 22) scale(2)">
    <!-- Outer global ring -->
    <circle
      cx="32"
      cy="32"
      r="30"
      fill="none"
      stroke="url(#ringGradient180)"
      stroke-width="2"
      stroke-dasharray="8 4"
      opacity="0.5"
    />

    <!-- Main flame-heart shape -->
    <g filter="url(#glow180)">
      <path
        d="M32 56
           C32 56 12 42 12 28
           C12 20 18 14 26 14
           C29 14 31 16 32 18
           C33 16 35 14 38 14
           C46 14 52 20 52 28
           C52 42 32 56 32 56Z"
        fill="url(#flameGradient180)"
      />

      <path
        d="M32 48
           C32 48 22 38 22 30
           C22 26 25 22 29 22
           C30.5 22 31.5 23 32 24.5
           C32.5 23 33.5 22 35 22
           C39 22 42 26 42 30
           C42 38 32 48 32 48Z"
        fill="url(#innerGlow180)"
        opacity="0.7"
      />

      <!-- Central spark -->
      <ellipse
        cx="32"
        cy="28"
        rx="3"
        ry="4"
        fill="white"
        opacity="0.95"
      />

      <!-- Small spark highlights -->
      <circle cx="28" cy="24" r="1.5" fill="white" opacity="0.7"/>
      <circle cx="36" cy="24" r="1" fill="white" opacity="0.5"/>
    </g>

    <!-- Global connection dots -->
    <circle cx="32" cy="3" r="2.5" fill="#EC4899"/>
    <circle cx="57" cy="20" r="2.5" fill="#3B82F6"/>
    <circle cx="57" cy="44" r="2.5" fill="#22C55E"/>
    <circle cx="32" cy="61" r="2.5" fill="#EC4899"/>
    <circle cx="7" cy="44" r="2.5" fill="#3B82F6"/>
    <circle cx="7" cy="20" r="2.5" fill="#22C55E"/>
  </g>
</svg>