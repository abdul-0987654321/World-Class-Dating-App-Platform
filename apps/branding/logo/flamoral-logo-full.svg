<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <!-- Primary gradient: Pink to Blue -->
    <linearGradient id="flameGradientFull" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>

    <!-- Secondary gradient for inner glow -->
    <linearGradient id="innerGlowFull" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>

    <!-- Global connection ring gradient -->
    <linearGradient id="ringGradientFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>

    <!-- Wordmark gradient -->
    <linearGradient id="wordmarkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon Section (scaled to fit 64x64 area, centered at x=8, y=8) -->
  <g transform="translate(8, 8) scale(0.8)">
    <!-- Outer global ring -->
    <circle
      cx="32"
      cy="32"
      r="30"
      fill="none"
      stroke="url(#ringGradientFull)"
      stroke-width="2"
      stroke-dasharray="8 4"
      opacity="0.6"
    />

    <!-- Main flame-heart shape -->
    <g filter="url(#glowFull)">
      <path
        d="M32 56
           C32 56 12 42 12 28
           C12 20 18 14 26 14
           C29 14 31 16 32 18
           C33 16 35 14 38 14
           C46 14 52 20 52 28
           C52 42 32 56 32 56Z"
        fill="url(#flameGradientFull)"
      />

      <path
        d="M32 48
           C32 48 22 38 22 30
           C22 26 25 22 29 22
           C30.5 22 31.5 23 32 24.5
           C32.5 23 33.5 22 35 22
           C39 22 42 26 42 30
           C42 38 32 48 32 48Z"
        fill="url(#innerGlowFull)"
        opacity="0.7"
      />

      <ellipse
        cx="32"
        cy="28"
        rx="3"
        ry="4"
        fill="white"
        opacity="0.9"
      />

      <circle cx="28" cy="24" r="1.5" fill="white" opacity="0.7"/>
      <circle cx="36" cy="24" r="1" fill="white" opacity="0.5"/>
    </g>

    <!-- Global connection dots -->
    <circle cx="32" cy="3" r="2" fill="#EC4899"/>
    <circle cx="57" cy="20" r="2" fill="#3B82F6"/>
    <circle cx="57" cy="44" r="2" fill="#22C55E"/>
    <circle cx="32" cy="61" r="2" fill="#EC4899"/>
    <circle cx="7" cy="44" r="2" fill="#3B82F6"/>
    <circle cx="7" cy="20" r="2" fill="#22C55E"/>
  </g>

  <!-- Wordmark: FLAMORAL -->
  <g transform="translate(85, 40)">
    <!-- Letter F -->
    <text
      x="0"
      y="12"
      font-family="'Playfair Display', Georgia, serif"
      font-size="36"
      font-weight="700"
      fill="url(#wordmarkGradient)"
      letter-spacing="0.02em"
    >FLAMORAL</text>
  </g>

  <!-- Tagline (optional, subtle) -->
  <text
    x="85"
    y="66"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="10"
    font-weight="500"
    fill="#EC4899"
    opacity="0.8"
    letter-spacing="0.15em"
  >IGNITE YOUR CONNECTION</text>
</svg>