<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Primary gradient: Pink to Blue -->
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>

    <!-- Secondary gradient for inner glow -->
    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>

    <!-- Global connection ring gradient -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer global ring representing international connection -->
  <circle
    cx="32"
    cy="32"
    r="30"
    fill="none"
    stroke="url(#ringGradient)"
    stroke-width="2"
    stroke-dasharray="8 4"
    opacity="0.6"
  />

  <!-- Main flame-heart shape -->
  <g filter="url(#glow)">
    <!-- Flame body forming a heart shape -->
    <path
      d="M32 56
         C32 56 12 42 12 28
         C12 20 18 14 26 14
         C29 14 31 16 32 18
         C33 16 35 14 38 14
         C46 14 52 20 52 28
         C52 42 32 56 32 56Z"
      fill="url(#flameGradient)"
    />

    <!-- Inner flame tongue (passion element) -->
    <path
      d="M32 48
         C32 48 22 38 22 30
         C22 26 25 22 29 22
         C30.5 22 31.5 23 32 24.5
         C32.5 23 33.5 22 35 22
         C39 22 42 26 42 30
         C42 38 32 48 32 48Z"
      fill="url(#innerGlow)"
      opacity="0.7"
    />

    <!-- Central spark representing the connection moment -->
    <ellipse
      cx="32"
      cy="28"
      rx="3"
      ry="4"
      fill="white"
      opacity="0.9"
    />

    <!-- Small spark highlights -->
    <circle cx="28" cy="24" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="36" cy="24" r="1" fill="white" opacity="0.5"/>
  </g>

  <!-- Global connection dots around the ring -->
  <circle cx="32" cy="3" r="2" fill="#EC4899"/>
  <circle cx="57" cy="20" r="2" fill="#3B82F6"/>
  <circle cx="57" cy="44" r="2" fill="#22C55E"/>
  <circle cx="32" cy="61" r="2" fill="#EC4899"/>
  <circle cx="7" cy="44" r="2" fill="#3B82F6"/>
  <circle cx="7" cy="20" r="2" fill="#22C55E"/>
</svg>