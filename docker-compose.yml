      timeout: 10s
      retries: 3
      start_period: 30s
    <<: *resource-limits

# =============================================================================
# Networks
# =============================================================================

networks:
  flamoral-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  localstack-data:
    driver: local
  api-gateway-modules:
    driver: local
  auth-service-modules:
    driver: local
  user-service-modules:
    driver: local
  matching-service-modules:
    driver: local
  messaging-service-modules:
    driver: local
  payment-service-modules:
    driver: local
  analytics-service-modules:
