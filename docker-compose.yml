      - NODE_ENV=development
      - PORT=3003
      - JWT_ACCESS_SECRET=your-access-secret-key-min-32-chars
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=flamoral
      - DB_USER=postgres
      - DB_PASSWORD=postgres_dev_password
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SERVICE_KEY=internal-service-key
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - flamoral-network

  # Messaging Service
  messaging-service:
