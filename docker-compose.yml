version: '3.8'

services:
  # ==================== Infrastructure ====================

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: flamoral-postgres
    environment:
      POSTGRES_DB: flamoral
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flamoral-network

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: flamoral-mongodb
    environment:
      MONGO_INITDB_DATABASE: flamoral
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flamoral-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: flamoral-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flamoral-network

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: flamoral-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - flamoral-network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: flamoral-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flamoral-network

  # ==================== Backend Services ====================

  # API Gateway
  api-gateway:
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    container_name: flamoral-api-gateway
    environment:
      - NODE_ENV=development
      - PORT=4000
      - JWT_SECRET=your-jwt-secret-key-min-32-chars-long
      - JWT_ACCESS_SECRET=your-access-secret-key-min-32-chars
      - JWT_REFRESH_SECRET=your-refresh-secret-key-min-32-chars
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - MATCHING_SERVICE_URL=http://matching-service:3003
      - MESSAGING_SERVICE_URL=http://messaging-service:3004
      - MEDIA_SERVICE_URL=http://media-service:3006
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INTERNAL_SERVICE_KEY=internal-service-key
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flamoral-network

  # Auth Service
  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: Dockerfile
    container_name: flamoral-auth-service
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_ACCESS_SECRET=your-access-secret-key-min-32-chars
      - JWT_REFRESH_SECRET=your-refresh-secret-key-min-32-chars
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=flamoral
      - DB_USER=postgres
      - DB_PASSWORD=postgres_dev_password
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SERVICE_KEY=internal-service-key
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - flamoral-network

  # User Service
  user-service:
    build:
      context: ./backend
      dockerfile: services/user-service/Dockerfile
    container_name: flamoral-user-service
    environment:
      - NODE_ENV=development
      - PORT=3002
      - JWT_ACCESS_SECRET=your-access-secret-key-min-32-chars
      - JWT_REFRESH_SECRET=your-refresh-secret-key-min-32-chars
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=flamoral
      - DB_USER=postgres
      - DB_PASSWORD=postgres_dev_password
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SERVICE_KEY=internal-service-key
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - flamoral-network

  # Matching Service
  matching-service:
    build:
