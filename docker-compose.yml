# =============================================================================
# Flamoral Docker Compose - Local Development Environment
# =============================================================================
# Production-like local environment with all services
# Usage: docker-compose up -d
#
# Service Port Mapping (aligned with Terraform ECS configs):
# - API Gateway: 3000        - Auth Service: 3001
# - User Service: 3002       - Profile Service: 3003
# - Matching Service: 3004   - Messaging Service: 3005
# - Notification Service: 3006 - Payment Service: 3007
# - Subscription Service: 3008 - Media Service: 3009
# - Moderation Service: 3010 - Analytics Service: 3011
# - Recommendation Service: 3012 - Search Service: 3013
# - Location Service: 3014   - Verification Service: 3015
# - Report Service: 3016     - Admin Service: 3017
# - Webhook Service: 3018    - Scheduler Service: 3019
# - Worker Service: 3020     - Email Service: 3021
# - Realtime Service: 3022   - Workflow Engine: 3023
# - Automation Service: 3024 - Advertising Service: 3025
# - Partnership Service: 3026
# =============================================================================

version: "3.9"

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: backend/Dockerfile.dev
  env_file:
    - .env
  networks:
    - flamoral-network
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-resource-limits: &resource-limits
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
      reservations:
        cpus: "0.25"
        memory: 128M

services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: flamoral-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flamoral}
      POSTGRES_MULTIPLE_DATABASES: flamoral,flamoral_test
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      - flamoral-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flamoral}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *resource-limits

  redis:
    image: redis:7-alpine
    container_name: flamoral-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - flamoral-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *resource-limits

  localstack:
    image: localstack/localstack:3.0
    container_name: flamoral-localstack
    ports:
      - "4566:4566"           # LocalStack Gateway
      - "4510-4559:4510-4559" # External services range
    environment:
      - SERVICES=s3,sqs,sns,ses
      - DEBUG=${DEBUG:-0}
      - DATA_DIR=/var/lib/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infrastructure/docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    networks:
      - flamoral-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ===========================================================================
  # Nginx Reverse Proxy
  # ===========================================================================

  nginx:
    image: nginx:alpine
    container_name: flamoral-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - flamoral-network
    depends_on:
      - web-app
      - api-gateway
      - auth-service
      - user-service
      - matching-service
      - messaging-service
      - payment-service
      - analytics-service
      - notification-service
      - media-service
      - admin-service
      - advertising-service
      - moderation-service
      - automation-service
      - partnership-service
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    <<: *resource-limits

  # ===========================================================================
  # Backend Microservices (Port Mapping per README.md)
  # ===========================================================================

  # API Gateway - Port 3000
  api-gateway:
    <<: *backend-common
    container_name: flamoral-api-gateway
    working_dir: /app/backend/services/api-gateway
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - SERVICE_NAME=api-gateway
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - PROFILE_SERVICE_URL=http://profile-service:3003
      - MATCHING_SERVICE_URL=http://matching-service:3004
      - MESSAGING_SERVICE_URL=http://messaging-service:3005
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - PAYMENT_SERVICE_URL=http://payment-service:3007
      - SUBSCRIPTION_SERVICE_URL=http://subscription-service:3008
      - MEDIA_SERVICE_URL=http://media-service:3009
      - MODERATION_SERVICE_URL=http://moderation-service:3010
      - ANALYTICS_SERVICE_URL=http://analytics-service:3011
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:3012
      - SEARCH_SERVICE_URL=http://search-service:3013
      - LOCATION_SERVICE_URL=http://location-service:3014
      - VERIFICATION_SERVICE_URL=http://verification-service:3015
      - REPORT_SERVICE_URL=http://report-service:3016
      - ADMIN_SERVICE_URL=http://admin-service:3017
      - WEBHOOK_SERVICE_URL=http://webhook-service:3018
      - SCHEDULER_SERVICE_URL=http://scheduler-service:3019
      - WORKER_SERVICE_URL=http://worker-service:3020
      - EMAIL_SERVICE_URL=http://email-service:3021
      - REALTIME_SERVICE_URL=http://realtime-service:3022
      - WORKFLOW_SERVICE_URL=http://workflow-engine:3023
      - AUTOMATION_SERVICE_URL=http://automation-service:3024
      - ADVERTISING_SERVICE_URL=http://advertising-service:3025
      - PARTNERSHIP_SERVICE_URL=http://partnership-service:3026
    volumes:
      - ./backend:/app/backend
      - api-gateway-modules:/app/backend/services/api-gateway/node_modules
      - shared-modules:/app/backend/shared/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    <<: *resource-limits

  # Auth Service - Port 3001
