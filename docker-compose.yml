      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - flamoral-network

  # Media Service
  media-service:
    build:
      context: ./backend
      dockerfile: services/media-service/Dockerfile
    container_name: flamoral-media-service
    environment:
      - NODE_ENV=development
      - PORT=3006
