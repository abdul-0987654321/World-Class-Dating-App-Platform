      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=flamoral
      - DB_USER=postgres
      - DB_PASSWORD=postgres_dev_password
      - INTERNAL_SERVICE_KEY=internal-service-key
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
