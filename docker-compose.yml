      retries: 3
    networks:
      - flamoral-network

  # Speed Dating Service
  speed-dating-service:
    build:
      context: ./backend
      dockerfile: services/speed-dating-service/Dockerfile
    container_name: flamoral-speed-dating-service
    environment:
      - NODE_ENV=development
      - PORT=3010
      - JWT_ACCESS_SECRET=your-access-secret-key-min-32-chars
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=flamoral
      - DB_USER=postgres
      - DB_PASSWORD=postgres_dev_password
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - INTERNAL_SERVICE_KEY=internal-service-key
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
