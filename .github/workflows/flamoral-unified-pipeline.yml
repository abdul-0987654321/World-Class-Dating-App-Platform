# ============================================================================
# FLAMORAL UNIFIED PIPELINE - SINGLE SOURCE OF TRUTH
# ============================================================================
# This workflow consolidates ALL CI/CD operations for the Flamoral platform:
#   - PR Quality Gates (validation on pull requests)
#   - Build & Test (code quality and compilation)
#   - Terraform Guard (IaC security and AWS ECS-only enforcement)
#   - Terraform Deploy (infrastructure deployment with approval gates)
#   - Docker Build (container images to ECR with immutable digests)
#   - Application Deployment (ECS Fargate with task definition updates)
#   - Scheduled Operations (drift detection, identity audit, lifecycle checks)
#   - Mobile App Builds (Expo EAS for iOS/Android)
#
# SECRETS REQUIRED FOR MOBILE BUILDS:
#   - EAS_TOKEN: Expo Application Services authentication token
#   - EXPO_APPLE_ID: Apple ID for iOS App Store submissions
#   - EXPO_APPLE_APP_SPECIFIC_PASSWORD: App-specific password for Apple ID
#
# INFRASTRUCTURE: AWS ECS Fargate ONLY
#   - NO Kubernetes/EKS
#   - NO Helm charts
#   - NO kubectl commands
#
# DEPRECATED WORKFLOWS (replaced by this file):
#   - aws-unified-pipeline.yml
#   - identity-audit.yaml
#   - lifecycle-agent.yml
#   - pr-quality-gate.yml
#   - terraform-dev-prod-gated.yml
#   - terraform-drift-detection.yml
#   - terraform-guard.yml
# ============================================================================

name: Flamoral Unified Pipeline

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

  push:
    branches: [main, develop]

  schedule:
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
    - cron: '0 6 * * 1'
    - cron: '0 2 * * *'
    - cron: '0 3 7 1 *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'build-only'
        type: choice
        options:
          - build-only
          - build-deploy
          - terraform-plan
          - terraform-apply
          - terraform-auto-fix
          - drift-check
          - identity-audit
          - lifecycle-check
          - release
          - rollback
          - mobile
      mobile_build_profile:
        description: 'Mobile build profile (for mobile action)'
        required: false
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production
      mobile_platform:
        description: 'Mobile platform to build (for mobile action)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      mobile_submit:
        description: 'Submit to app stores after build (production only)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production
      version:
        description: 'Release version (for release action)'
        required: false
        type: string
      rollback_to:
        description: 'Rollback to version'
        required: false
        type: string
      full_reconciliation:
        description: 'Run full identity reconciliation'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_IMAGE_PREFIX: flamoral
  TERRAFORM_VERSION: '1.7.0'

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
  security-events: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ==========================================================================
  # SECTION 1: PR QUALITY GATES
  # ==========================================================================

  pr-legal-pages-guard:
    name: '[PR] Legal Pages Availability'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Legal Page Components
        run: |
          echo "Verifying required legal page components exist..."
          REQUIRED_PAGES=("TermsOfService" "PrivacyPolicy" "CookiePolicy" "CommunityGuidelines" "SafetyTips" "ContactUs")
          MISSING_PAGES=()
          for page in "${REQUIRED_PAGES[@]}"; do
            if ! find apps/web-app/src -name "${page}*" -type f | grep -q .; then
              MISSING_PAGES+=("$page")
            fi
          done
          if [ ${#MISSING_PAGES[@]} -gt 0 ]; then
            echo "::error::Missing legal pages: ${MISSING_PAGES[*]}"
            exit 1
          fi
          echo "All required legal pages found."

  pr-api-route-guard:
    name: '[PR] API Route Verification'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify API Gateway Routes
        run: |
          echo "Checking API Gateway route definitions..."
          if ! grep -r "registerRoutes\|router\." backend/services/api-gateway/src/; then
            echo "::warning::No route registrations found in API Gateway"
          fi
          echo "API route verification completed."

  pr-security-guard:
    name: '[PR] Security Check'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for .env file commits
        run: |
          if git diff --cached --name-only origin/main | grep -E "\.env$|\.env\.local$|\.env\.production$"; then
            echo "::error::Attempted to commit .env files!"
            exit 1
          fi

      - name: Secret pattern detection
        run: |
          SECRET_PATTERNS=(
            "AKIA[0-9A-Z]{16}"
            "sk_live_[0-9a-zA-Z]{24}"
            "-----BEGIN.*PRIVATE KEY-----"
          )
          FOUND=false
          for pattern in "${SECRET_PATTERNS[@]}"; do
            if grep -rE "$pattern" --include="*.ts" --include="*.js" --include="*.json" . 2>/dev/null | grep -v node_modules; then
              echo "::error::Potential secret detected: $pattern"
              FOUND=true
            fi
          done
          if [ "$FOUND" = true ]; then
            exit 1
          fi

  pr-performance-guard:
    name: '[PR] Performance Check'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for large assets
        run: |
          LARGE_FILES=$(find . -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.gif" -o -name "*.mp4" \) -size +500k 2>/dev/null | grep -v node_modules || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "::warning::Large assets detected (>500KB):"
            echo "$LARGE_FILES"
          fi

  pr-quality-summary:
    name: '[PR] Quality Gate Summary'
    runs-on: ubuntu-latest
    needs: [pr-legal-pages-guard, pr-api-route-guard, pr-security-guard, pr-performance-guard]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Generate summary
        run: |
          echo "## PR Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Legal Pages | ${{ needs.pr-legal-pages-guard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Routes | ${{ needs.pr-api-route-guard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.pr-security-guard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.pr-performance-guard.result }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # SECTION 2: BUILD & TEST
  # ==========================================================================

  sast-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["build-only", "build-deploy", "release"]'), github.event.inputs.action))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep SAST scan
        run: |
          pip3 install semgrep
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/nodejs \
            --sarif --output semgrep.sarif \
            --error || true
          if [ -f semgrep.sarif ]; then
            echo "SARIF file generated successfully"
          else
            echo '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[]}' > semgrep.sarif
          fi

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()
        continue-on-error: true

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        continue-on-error: true

      - name: Ensure Trivy SARIF exists
        run: |
          if [ ! -f trivy-fs-results.sarif ]; then
            echo '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[]}' > trivy-fs-results.sarif
          fi

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs-results.sarif'
        if: always()
        continue-on-error: true

      - name: Run secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["build-only", "build-deploy", "release"]'), github.event.inputs.action))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Snyk security scan
        uses: snyk/actions/node@0.4.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Generate dependency audit report
        if: always()
        run: |
          echo "=== Dependency Security Audit Report ===" > audit-report.txt
          echo "Generated: $(date -u)" >> audit-report.txt
          echo "" >> audit-report.txt
          echo "=== NPM Audit ===" >> audit-report.txt
          npm audit --audit-level=moderate 2>&1 >> audit-report.txt || true
          echo "" >> audit-report.txt
          echo "=== Yarn Audit ===" >> audit-report.txt
          yarn audit --level moderate 2>&1 >> audit-report.txt || true

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-report.txt
        if: always()
        continue-on-error: true

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["build-only", "build-deploy", "release"]'), github.event.inputs.action))
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=$GIT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript compilation check
        run: yarn tsc --noEmit
        # TypeScript errors will fail the build

      - name: Build all packages
        run: yarn build:all

      - name: Run linting
        run: yarn lint:all
        continue-on-error: true  # Temporarily allow lint errors while fixing pre-existing issues

      - name: Run unit tests
        run: |
          yarn test:unit --coverage --ci --reporters=default --reporters=jest-junit || yarn test --coverage --ci --reporters=default --reporters=jest-junit
        env:
          CI: true
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml
        continue-on-error: true

      - name: Ensure test-results and coverage directories exist
        if: always()
        run: |
          mkdir -p test-results coverage
          # Create placeholder files if directories are empty to ensure artifact upload succeeds
          if [ ! -f test-results/junit.xml ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><testsuites><testsuite name="placeholder" tests="0" failures="0" errors="0" time="0"></testsuite></testsuites>' > test-results/junit.xml
          fi
          if [ ! -f coverage/lcov.info ]; then
            echo "TN:" > coverage/lcov.info
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info,./coverage/clover.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Test coverage summary
        if: always()
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(jq -r '.total.lines.pct // "N/A"' coverage/coverage-summary.json)
            BRANCHES=$(jq -r '.total.branches.pct // "N/A"' coverage/coverage-summary.json)
            FUNCTIONS=$(jq -r '.total.functions.pct // "N/A"' coverage/coverage-summary.json)
            STATEMENTS=$(jq -r '.total.statements.pct // "N/A"' coverage/coverage-summary.json)
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${LINES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${BRANCHES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${FUNCTIONS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${STATEMENTS}% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Security audit
        run: npm audit --audit-level=critical 2>&1 | tee audit-report.txt || true
        continue-on-error: true

      - name: Check deployment conditions
        id: check
        env:
          INPUT_ACTION: ${{ github.event.inputs.action }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SHOULD_DEPLOY="false"
          if [ "$EVENT_NAME" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            SHOULD_DEPLOY="true"
          elif [ "$INPUT_ACTION" = "build-deploy" ] || [ "$INPUT_ACTION" = "release" ]; then
            SHOULD_DEPLOY="true"
          fi
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/shared/*/dist/
            backend/shared/dist/

  # ==========================================================================
  # SECTION 3: TERRAFORM GUARD
  # IaC security and AWS ECS-only enforcement (NO Kubernetes/EKS/Helm)
  # ==========================================================================

  terraform-provider-guard:
    name: '[TF] Block Forbidden Providers'
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'infrastructure/terraform/')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files, 'infrastructure/terraform/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Block Azure providers
        run: |
          echo "Checking for forbidden Azure providers..."
          AZURE_PATTERNS=(
            'provider.*"azurerm"'
            'provider.*"azuread"'
            'source.*=.*"hashicorp/azurerm"'
            'source.*=.*"hashicorp/azuread"'
          )
          FOUND=false
          for pattern in "${AZURE_PATTERNS[@]}"; do
            if grep -rE "$pattern" infrastructure/terraform/ 2>/dev/null; then
              echo "::error::Forbidden Azure provider detected: $pattern"
              FOUND=true
            fi
          done
          if [ "$FOUND" = true ]; then
            echo "::error::Azure providers are forbidden. This is an AWS-only infrastructure."
            exit 1
          fi
          echo "No Azure providers found."

      - name: Block Kubernetes/EKS/Helm providers (ECS-only enforcement)
        run: |
          echo "Checking for forbidden Kubernetes/EKS/Helm providers..."
          echo "This infrastructure uses ECS Fargate ONLY - no Kubernetes allowed."
          K8S_PATTERNS=(
            'provider.*"kubernetes"'
            'provider.*"helm"'
            'source.*=.*"hashicorp/kubernetes"'
            'source.*=.*"hashicorp/helm"'
            'resource.*"kubernetes_'
            'resource.*"helm_'
            'data.*"kubernetes_'
            'module.*eks'
            'aws_eks_cluster'
            'aws_eks_node_group'
            'aws_eks_fargate_profile'
            'aws_eks_addon'
            'aws_eks_identity_provider_config'
          )
          FOUND=false
          for pattern in "${K8S_PATTERNS[@]}"; do
            MATCHES=$(grep -rE "$pattern" infrastructure/terraform/ 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Forbidden Kubernetes/EKS/Helm resource detected:"
              echo "$MATCHES"
              FOUND=true
            fi
          done
          if [ "$FOUND" = true ]; then
            echo "::error::KUBERNETES/EKS/HELM PROVIDERS ARE FORBIDDEN"
            echo "::error::This infrastructure uses AWS ECS Fargate ONLY."
            exit 1
          fi
          echo "No Kubernetes/EKS/Helm providers found. ECS-only enforcement passed."

      - name: Verify ECS-only architecture
        run: |
          echo "Verifying ECS Fargate architecture..."
          if grep -rE "aws_ecs_cluster|aws_ecs_service|aws_ecs_task_definition" infrastructure/terraform/ 2>/dev/null; then
            echo "ECS resources found - architecture verified."
          else
            echo "::warning::No ECS resources found in Terraform."
          fi
          if grep -rE "kubectl|helm " infrastructure/ 2>/dev/null; then
            echo "::error::kubectl or helm commands found in infrastructure!"
            exit 1
          fi
          echo "ECS-only architecture verification passed."

  terraform-iac-security:
    name: '[TF] IaC Security Scan'
    runs-on: ubuntu-latest
    needs: terraform-provider-guard
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'infrastructure/terraform/')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files, 'infrastructure/terraform/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform
          format: sarif
          soft_fail: true

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: true

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: 'infrastructure/terraform'
          format: 'sarif'
          output: 'trivy-iac.sarif'
        continue-on-error: true

  # ==========================================================================
  # SECTION 4: TERRAFORM DEPLOYMENT (AWS ECS Fargate only - NO AZURE)
  # ==========================================================================
  # Terraform Plan: Dev and Staging environments only
  # Terraform Apply: Production environment only (requires approval gate)
  # ==========================================================================

  terraform-dev-plan:
    name: '[TF] Dev Plan'
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.modified, 'infrastructure/terraform/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'terraform-plan' && github.event.inputs.environment == 'dev')
    environment: dev-validation
    outputs:
      validation_passed: ${{ steps.validate.outputs.passed }}
      plan_checksum: ${{ steps.plan.outputs.checksum }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (AWS provider only)
        run: |
          terraform -chdir=infrastructure/terraform/environments/dev init -backend=false
          # Verify no forbidden providers (Azure, Kubernetes, Helm)
          if [ -d "infrastructure/terraform/environments/dev/.terraform/providers" ]; then
            if find infrastructure/terraform/environments/dev/.terraform/providers -name "*azure*" -o -name "*kubernetes*" -o -name "*helm*" 2>/dev/null | grep -q .; then
              echo "::error::Forbidden providers detected (Azure/Kubernetes/Helm) - AWS only!"
              exit 1
            fi
          fi
          echo "Terraform initialized with AWS provider only."

      - name: Terraform Validate
        id: validate
        run: |
          terraform -chdir=infrastructure/terraform/environments/dev validate
          echo "passed=true" >> $GITHUB_OUTPUT

      - name: Run TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Check
        run: |
          cd infrastructure/terraform
          tflint --init
          tflint --recursive
        continue-on-error: true

      - name: Create plan (verify AWS-only resources)
        id: plan
        run: |
          terraform -chdir=infrastructure/terraform/environments/dev plan -out=tfplan -no-color 2>&1 | tee plan.txt
          # Block any EKS/Kubernetes/Helm resources
          if grep -E "aws_eks_|kubernetes_|helm_" plan.txt; then
            echo "::error::Plan contains EKS/Kubernetes/Helm resources - not allowed!"
            exit 1
          fi
          CHECKSUM=$(sha256sum infrastructure/terraform/environments/dev/tfplan | cut -d' ' -f1)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: infrastructure/terraform/environments/dev/tfplan

      - name: Plan Summary
        run: |
          echo "## Terraform Dev Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Environment: dev" >> $GITHUB_STEP_SUMMARY
          echo "Provider: AWS only (Azure forbidden)" >> $GITHUB_STEP_SUMMARY
          echo "Plan checksum: ${{ steps.plan.outputs.checksum }}" >> $GITHUB_STEP_SUMMARY

  terraform-staging-plan:
    name: '[TF] Staging Plan'
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.modified, 'infrastructure/terraform/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'terraform-plan' && github.event.inputs.environment == 'staging')
    environment: staging-validation
    outputs:
      validation_passed: ${{ steps.validate.outputs.passed }}
      plan_checksum: ${{ steps.plan.outputs.checksum }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (AWS provider only)
        run: |
          terraform -chdir=infrastructure/terraform/environments/staging init -backend=false
          # Verify no forbidden providers (Azure, Kubernetes, Helm)
          if [ -d "infrastructure/terraform/environments/staging/.terraform/providers" ]; then
            if find infrastructure/terraform/environments/staging/.terraform/providers -name "*azure*" -o -name "*kubernetes*" -o -name "*helm*" 2>/dev/null | grep -q .; then
              echo "::error::Forbidden providers detected (Azure/Kubernetes/Helm) - AWS only!"
              exit 1
            fi
          fi
          echo "Terraform initialized with AWS provider only."

      - name: Terraform Validate
        id: validate
        run: |
          terraform -chdir=infrastructure/terraform/environments/staging validate
          echo "passed=true" >> $GITHUB_OUTPUT

      - name: Run TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Check
        run: |
          cd infrastructure/terraform
          tflint --init
          tflint --recursive
        continue-on-error: true

      - name: Create plan (verify AWS-only resources)
        id: plan
        run: |
          terraform -chdir=infrastructure/terraform/environments/staging plan -out=tfplan -no-color 2>&1 | tee plan.txt
          # Block any EKS/Kubernetes/Helm resources
          if grep -E "aws_eks_|kubernetes_|helm_" plan.txt; then
            echo "::error::Plan contains EKS/Kubernetes/Helm resources - not allowed!"
            exit 1
          fi
          CHECKSUM=$(sha256sum infrastructure/terraform/environments/staging/tfplan | cut -d' ' -f1)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-staging
          path: infrastructure/terraform/environments/staging/tfplan

      - name: Plan Summary
        run: |
          echo "## Terraform Staging Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Environment: staging" >> $GITHUB_STEP_SUMMARY
          echo "Provider: AWS only (Azure forbidden)" >> $GITHUB_STEP_SUMMARY
          echo "Plan checksum: ${{ steps.plan.outputs.checksum }}" >> $GITHUB_STEP_SUMMARY

  terraform-production-gate:
    name: '[TF] Production Gate'
    runs-on: ubuntu-latest
    needs: [terraform-dev-plan, terraform-staging-plan]
    if: |
      always() &&
      (needs.terraform-dev-plan.outputs.validation_passed == 'true' || needs.terraform-staging-plan.outputs.validation_passed == 'true') &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'terraform-apply' && github.event.inputs.environment == 'production')
    environment: production-gate
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - name: Production gate authorization
        id: gate
        run: |
          echo "Production deployment authorized via environment approval"
          echo "authorized=true" >> $GITHUB_OUTPUT

  terraform-production-apply:
    name: '[TF] Production Apply (AWS Only)'
    runs-on: ubuntu-latest
    needs: terraform-production-gate
    if: needs.terraform-production-gate.outputs.authorized == 'true'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init (AWS provider only)
        run: |
          terraform -chdir=infrastructure/terraform/environments/prod init
          # Verify no forbidden providers
          if [ -d "infrastructure/terraform/environments/prod/.terraform/providers" ]; then
            if find infrastructure/terraform/environments/prod/.terraform/providers -name "*azure*" 2>/dev/null | grep -q .; then
              echo "::error::Azure providers detected - AWS only!"
              exit 1
            fi
          fi

      - name: Terraform Apply (AWS ECS Fargate only)
        run: |
          terraform -chdir=infrastructure/terraform/environments/prod plan -no-color 2>&1 | tee pre-apply-plan.txt
          # Block any Azure/EKS/Kubernetes/Helm resources
          if grep -E "azurerm_|azuread_|aws_eks_|kubernetes_|helm_" pre-apply-plan.txt; then
            echo "::error::Plan contains forbidden resources (Azure/EKS/Kubernetes/Helm) - aborting!"
            exit 1
          fi
          terraform -chdir=infrastructure/terraform/environments/prod apply -auto-approve

      - name: Apply Summary
        run: |
          echo "## Terraform Production Apply Complete" >> $GITHUB_STEP_SUMMARY
          echo "Environment: production" >> $GITHUB_STEP_SUMMARY
          echo "Provider: AWS only" >> $GITHUB_STEP_SUMMARY
          echo "Status: Applied successfully" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # SECTION 5: DOCKER BUILD (ECR with immutable digests)
  # ==========================================================================

  # Build asset-branding FIRST as base image for other services
  build-asset-branding:
    name: Build Asset Branding (Base Image)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["build-only", "build-deploy", "release"]'), github.event.inputs.action))
    outputs:
      image_uri: ${{ steps.push_image.outputs.image_uri }}
      image_digest: ${{ steps.push_image.outputs.image_digest }}
      exists: ${{ steps.dockerfile.outputs.exists }}
      semver: ${{ steps.semver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Dockerfile exists
        id: dockerfile
        run: |
          DOCKERFILE="packages/asset-branding/Dockerfile"
          if [ -f "$DOCKERFILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=$DOCKERFILE" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::asset-branding Dockerfile not yet created at $DOCKERFILE"
          fi

      - name: Generate semantic version
        id: semver
        env:
          BUILD_VERSION: ${{ needs.build-and-test.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            SEMVER="$BUILD_VERSION"
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
            SHORT_SHA=$(echo "$GIT_SHA" | cut -c1-7)
            SEMVER="1.0.${COMMIT_COUNT}-${SHORT_SHA}"
          fi
          echo "version=$SEMVER" >> $GITHUB_OUTPUT
          echo "Generated semantic version: $SEMVER"

      - name: Configure AWS credentials
        id: aws_creds
        if: steps.dockerfile.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Login to Amazon ECR
        id: ecr_login
        if: steps.dockerfile.outputs.exists == 'true' && steps.aws_creds.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true' && steps.ecr_login.outcome == 'success'
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        if: steps.dockerfile.outputs.exists == 'true' && steps.ecr_login.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-asset-branding-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-asset-branding-
            ${{ runner.os }}-buildx-

      - name: Build Docker image with semantic version
        if: steps.dockerfile.outputs.exists == 'true' && steps.ecr_login.outcome == 'success'
        id: docker_build
        env:
          SEMVER: ${{ steps.semver.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_IMAGE_PREFIX }}/asset-branding"
          docker buildx build \
            --tag ${FULL_IMAGE}:${SEMVER} \
            --tag ${FULL_IMAGE}:${GIT_SHA} \
            --label "org.opencontainers.image.version=${SEMVER}" \
            --label "org.opencontainers.image.revision=${GIT_SHA}" \
            --build-arg BUILD_VERSION=${SEMVER} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -f packages/asset-branding/Dockerfile \
            packages/asset-branding
          echo "full_image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "local_tag=${FULL_IMAGE}:${SEMVER}" >> $GITHUB_OUTPUT

      - name: Move Docker cache
        if: steps.docker_build.outcome == 'success'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true

      - name: Scan Docker image
        if: steps.docker_build.outcome == 'success'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.docker_build.outputs.local_tag }}
          format: 'sarif'
          output: 'trivy-image-asset-branding.sarif'
        continue-on-error: true

      - name: Ensure ECR repository exists
        if: steps.docker_build.outcome == 'success'
        id: ecr_repo
        run: |
          REPO_NAME="${{ env.ECR_IMAGE_PREFIX }}/asset-branding"
          if aws ecr describe-repositories --repository-names "${REPO_NAME}" 2>/dev/null; then
            echo "ECR repository exists: ${REPO_NAME}"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::ECR repository does not exist: ${REPO_NAME}"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Push Docker image with immutable tag and capture digest
        if: steps.docker_build.outcome == 'success' && steps.ecr_repo.outputs.exists == 'true'
        id: push_image
        env:
          FULL_IMAGE: ${{ steps.docker_build.outputs.full_image }}
          SEMVER: ${{ steps.semver.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          REPO_NAME="${{ env.ECR_IMAGE_PREFIX }}/asset-branding"
          EXISTING_DIGEST=$(aws ecr describe-images --repository-name "${REPO_NAME}" --image-ids imageTag="${GIT_SHA}" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")
          if [ -n "$EXISTING_DIGEST" ] && [ "$EXISTING_DIGEST" != "None" ]; then
            echo "Image already exists with digest ${EXISTING_DIGEST} (immutable tags)"
            echo "image_digest=${EXISTING_DIGEST}" >> $GITHUB_OUTPUT
            echo "image_uri=${FULL_IMAGE}@${EXISTING_DIGEST}" >> $GITHUB_OUTPUT
          else
            docker push ${FULL_IMAGE}:${SEMVER}
            docker push ${FULL_IMAGE}:${GIT_SHA}
            IMAGE_DIGEST=$(aws ecr describe-images --repository-name "${REPO_NAME}" --image-ids imageTag="${GIT_SHA}" --query 'imageDetails[0].imageDigest' --output text)
            echo "Pushed with immutable digest: ${IMAGE_DIGEST}"
            echo "image_digest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
            echo "image_uri=${FULL_IMAGE}@${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
          fi

      - name: Save image digest artifact
        if: steps.push_image.outcome == 'success'
        env:
          IMAGE_URI: ${{ steps.push_image.outputs.image_uri }}
        run: |
          mkdir -p /tmp/image-digests
          echo "${IMAGE_URI}" > /tmp/image-digests/asset-branding.txt

      - name: Upload image digest artifact
        if: steps.push_image.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-asset-branding
          path: /tmp/image-digests/asset-branding.txt


  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, build-asset-branding]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["build-only", "build-deploy", "release"]'), github.event.inputs.action))
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - matching-service
          - messaging-service
          - media-service
          - payment-service
          - notification-service
          - moderation-service
          - analytics-service
          - automation-service
          - partnership-service
          - advertising-service
          - admin-service
          - realtime-service
          - workflow-engine
          - email-service
          - location-service
          - profile-service
          - recommendation-service
          - report-service
          - scheduler-service
          - subscription-service
          - verification-service
          - webhook-service
          - worker-service
          - search-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: dockerfile
        run: |
          DOCKERFILE="backend/services/${{ matrix.service }}/Dockerfile"
          if [ -f "$DOCKERFILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=$DOCKERFILE" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        id: aws_creds
        if: steps.dockerfile.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Login to Amazon ECR
        id: ecr_login
        if: steps.dockerfile.outputs.exists == 'true' && steps.aws_creds.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true' && steps.ecr_login.outcome == 'success'
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        if: steps.dockerfile.outputs.exists == 'true' && steps.ecr_login.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.service }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service }}-
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        if: steps.dockerfile.outputs.exists == 'true' && steps.ecr_login.outcome == 'success'
        id: docker_build
        env:
          SERVICE: ${{ matrix.service }}
          BUILD_VERSION: ${{ needs.build-and-test.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_IMAGE_PREFIX }}/${SERVICE}"
          docker buildx build \
            --tag ${FULL_IMAGE}:${BUILD_VERSION} \
            --tag ${FULL_IMAGE}:${GIT_SHA} \
            --build-arg BUILD_VERSION=${BUILD_VERSION} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -f backend/services/${SERVICE}/Dockerfile \
            .
          echo "full_image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "local_tag=${FULL_IMAGE}:${BUILD_VERSION}" >> $GITHUB_OUTPUT

      - name: Move Docker cache
        if: steps.docker_build.outcome == 'success'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true

      - name: Scan Docker image
        if: steps.docker_build.outcome == 'success'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.docker_build.outputs.local_tag }}
          format: 'sarif'
          output: 'trivy-image-${{ matrix.service }}.sarif'
        continue-on-error: true

      - name: Ensure ECR repository exists
        if: steps.docker_build.outcome == 'success'
        id: ecr_repo
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          REPO_NAME="${{ env.ECR_IMAGE_PREFIX }}/${SERVICE}"
          if aws ecr describe-repositories --repository-names "${REPO_NAME}" 2>/dev/null; then
            echo "ECR repository exists: ${REPO_NAME}"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::ECR repository does not exist: ${REPO_NAME}"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Push Docker image and capture immutable digest
        if: steps.docker_build.outcome == 'success' && steps.ecr_repo.outputs.exists == 'true'
        id: push_image
        env:
          FULL_IMAGE: ${{ steps.docker_build.outputs.full_image }}
          BUILD_VERSION: ${{ needs.build-and-test.outputs.version }}
          GIT_SHA: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          REPO_NAME="${{ env.ECR_IMAGE_PREFIX }}/${SERVICE}"
          EXISTING_DIGEST=$(aws ecr describe-images --repository-name "${REPO_NAME}" --image-ids imageTag="${GIT_SHA}" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")
          if [ -n "$EXISTING_DIGEST" ] && [ "$EXISTING_DIGEST" != "None" ]; then
            echo "Image already exists with digest ${EXISTING_DIGEST} (immutable tags)"
            echo "image_digest=${EXISTING_DIGEST}" >> $GITHUB_OUTPUT
            echo "image_uri=${FULL_IMAGE}@${EXISTING_DIGEST}" >> $GITHUB_OUTPUT
          else
            docker push ${FULL_IMAGE}:${BUILD_VERSION}
            docker push ${FULL_IMAGE}:${GIT_SHA}
            IMAGE_DIGEST=$(aws ecr describe-images --repository-name "${REPO_NAME}" --image-ids imageTag="${GIT_SHA}" --query 'imageDetails[0].imageDigest' --output text)
            echo "Pushed with immutable digest: ${IMAGE_DIGEST}"
            echo "image_digest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
            echo "image_uri=${FULL_IMAGE}@${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
          fi

      - name: Save image digest artifact
        if: steps.push_image.outcome == 'success'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_URI: ${{ steps.push_image.outputs.image_uri }}
        run: |
          mkdir -p /tmp/image-digests
          echo "${IMAGE_URI}" > /tmp/image-digests/${SERVICE}.txt

      - name: Upload image digest artifact
        if: steps.push_image.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.service }}
          path: /tmp/image-digests/${{ matrix.service }}.txt

  collect-image-digests:
    name: Collect Image Digests
    runs-on: ubuntu-latest
    needs: [build-asset-branding, build-docker-images]
    if: always() && needs.build-docker-images.result == 'success'
    outputs:
      digests_json: ${{ steps.collect.outputs.digests_json }}
    steps:
      - name: Download all digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: /tmp/all-digests
          merge-multiple: true

      - name: Collect all digests
        id: collect
        run: |
          DIGESTS_JSON="{}"
          for file in /tmp/all-digests/*.txt; do
            if [ -f "$file" ]; then
              SERVICE=$(basename "$file" .txt)
              IMAGE_URI=$(cat "$file")
              DIGESTS_JSON=$(echo "$DIGESTS_JSON" | jq --arg s "$SERVICE" --arg u "$IMAGE_URI" '. + {($s): $u}')
            fi
          done
          echo "digests_json=$(echo "$DIGESTS_JSON" | jq -c .)" >> $GITHUB_OUTPUT

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: build-and-test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["build-only", "build-deploy", "release"]'), github.event.inputs.action))
    outputs:
      image_uri: ${{ steps.push_frontend.outputs.image_uri }}
      image_digest: ${{ steps.push_frontend.outputs.image_digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build:web

      - name: Configure AWS credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Login to Amazon ECR
        id: ecr_login
        if: steps.aws_creds.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: Set up Docker Buildx
        if: steps.ecr_login.outcome == 'success'
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        if: steps.ecr_login.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-web-app-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-web-app-
            ${{ runner.os }}-buildx-

      - name: Build and push frontend with immutable digest
        id: push_frontend
        if: steps.ecr_login.outcome == 'success'
        env:
          BUILD_VERSION: ${{ needs.build-and-test.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_IMAGE_PREFIX }}/web-app"
          REPO_NAME="${{ env.ECR_IMAGE_PREFIX }}/web-app"
          EXISTING_DIGEST=$(aws ecr describe-images --repository-name "${REPO_NAME}" --image-ids imageTag="${GIT_SHA}" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")
          if [ -n "$EXISTING_DIGEST" ] && [ "$EXISTING_DIGEST" != "None" ]; then
            echo "Image already exists (immutable)"
            echo "image_digest=${EXISTING_DIGEST}" >> $GITHUB_OUTPUT
            echo "image_uri=${FULL_IMAGE}@${EXISTING_DIGEST}" >> $GITHUB_OUTPUT
          else
            docker buildx build \
              --tag ${FULL_IMAGE}:${BUILD_VERSION} \
              --tag ${FULL_IMAGE}:${GIT_SHA} \
              --cache-from type=local,src=/tmp/.buildx-cache \
              --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
              --load \
              -f apps/web-app/Dockerfile \
              apps/web-app
            docker push ${FULL_IMAGE}:${BUILD_VERSION}
            docker push ${FULL_IMAGE}:${GIT_SHA}
            IMAGE_DIGEST=$(aws ecr describe-images --repository-name "${REPO_NAME}" --image-ids imageTag="${GIT_SHA}" --query 'imageDetails[0].imageDigest' --output text)
            echo "image_digest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
            echo "image_uri=${FULL_IMAGE}@${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
          fi

      - name: Move Docker cache
        if: steps.push_frontend.outcome == 'success'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true

  # ==========================================================================
  # SECTION 6: ECS FARGATE DEPLOYMENT (with task definition updates)
  # ==========================================================================

  deploy-staging:
    name: Deploy to Staging (ECS Fargate)
    runs-on: ubuntu-latest
    needs: [build-and-test, build-asset-branding, build-docker-images, build-frontend, collect-image-digests, sast-scan, dependency-scan]
    if: |
      needs.build-and-test.outputs.should_deploy == 'true' &&
      (github.event_name == 'push' || github.event.inputs.action == 'build-deploy')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: /tmp/image-digests
          merge-multiple: true
        continue-on-error: true

      - name: Check ECS cluster exists
        id: ecs_check
        if: steps.aws_creds.outcome == 'success'
        run: |
          CLUSTER_NAME="flamoral-staging-cluster"
          if aws ecs describe-clusters --clusters "$CLUSTER_NAME" --query 'clusters[0].status' --output text 2>/dev/null | grep -q "ACTIVE"; then
            echo "cluster_exists=true" >> $GITHUB_OUTPUT
            echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          else
            echo "cluster_exists=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Deploy to ECS with task definition updates using immutable digests
        if: steps.aws_creds.outcome == 'success' && steps.ecs_check.outputs.cluster_exists == 'true'
        env:
          BUILD_VERSION: ${{ needs.build-and-test.outputs.version }}
          CLUSTER_NAME: ${{ steps.ecs_check.outputs.cluster_name }}
        run: |
          SERVICES=("asset-branding" "api-gateway" "auth-service" "user-service" "matching-service" "messaging-service" "media-service" "payment-service" "notification-service" "moderation-service" "analytics-service" "automation-service" "partnership-service" "advertising-service" "admin-service" "realtime-service" "workflow-engine" "email-service" "location-service" "profile-service" "recommendation-service" "report-service" "scheduler-service" "subscription-service" "verification-service" "webhook-service" "worker-service" "search-service")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Deploying $SERVICE..."
            SERVICE_STATUS=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE" --query 'services[0].status' --output text 2>/dev/null || echo "NOT_FOUND")
            if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
              DIGEST_FILE="/tmp/image-digests/${SERVICE}.txt"
              if [ -f "$DIGEST_FILE" ]; then
                NEW_IMAGE_URI=$(cat "$DIGEST_FILE")
                echo "Using immutable image: $NEW_IMAGE_URI"
                CURRENT_TD=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
                TD_JSON=$(aws ecs describe-task-definition --task-definition "$CURRENT_TD" --query 'taskDefinition')
                NEW_TD_JSON=$(echo "$TD_JSON" | jq --arg img "$NEW_IMAGE_URI" '.containerDefinitions[0].image = $img | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
                NEW_TD_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TD_JSON" --query 'taskDefinition.taskDefinitionArn' --output text)
                aws ecs update-service --cluster "$CLUSTER_NAME" --service "$SERVICE" --task-definition "$NEW_TD_ARN" --no-cli-pager || echo "::warning::Failed to deploy $SERVICE"
              else
                aws ecs update-service --cluster "$CLUSTER_NAME" --service "$SERVICE" --force-new-deployment --no-cli-pager || echo "::warning::Failed to deploy $SERVICE"
              fi
            fi
          done

      - name: Wait for deployments
        if: steps.aws_creds.outcome == 'success' && steps.ecs_check.outputs.cluster_exists == 'true'
        env:
          CLUSTER_NAME: ${{ steps.ecs_check.outputs.cluster_name }}
        run: |
          for SERVICE in api-gateway auth-service user-service; do
            aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "$SERVICE" --no-cli-pager 2>/dev/null || echo "::warning::$SERVICE did not stabilize"
          done


  # ==========================================================================
  # SECTION 6.5: E2E CONNECTIVITY TESTS
  # ==========================================================================

  e2e-connectivity-tests:
    name: E2E Connectivity Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: needs.deploy-staging.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Configure AWS credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Get staging ALB URL
        id: staging_url
        if: steps.aws_creds.outcome == 'success'
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "flamoral-staging-alb" --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || echo "")
          if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "None" ]; then
            echo "api_url=https://${ALB_DNS}" >> $GITHUB_OUTPUT
            echo "frontend_url=https://${ALB_DNS}" >> $GITHUB_OUTPUT
          else
            echo "api_url=${{ secrets.STAGING_API_URL || 'https://staging-api.flamoral.com' }}" >> $GITHUB_OUTPUT
            echo "frontend_url=${{ secrets.STAGING_URL || 'https://staging.flamoral.com' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run API Health Checks
        id: health_checks
        env:
          API_URL: ${{ steps.staging_url.outputs.api_url }}
        run: |
          echo "Testing API Gateway health..."
          curl -sf "${API_URL}/api/health" || echo "::warning::Health check failed"
          echo "Testing services health..."
          curl -sf "${API_URL}/api/health/services" || echo "::warning::Services health check failed"
        continue-on-error: true

      - name: Run Backend Connectivity Smoke Tests
        id: smoke_tests
        env:
          API_URL: ${{ steps.staging_url.outputs.api_url }}
        run: |
          chmod +x scripts/smoke-test.sh 2>/dev/null || true
          if [ -f scripts/smoke-test.sh ]; then
            ./scripts/smoke-test.sh "${API_URL}/api" || echo "::warning::Some smoke tests failed"
          fi
        continue-on-error: true

      - name: Run E2E Tests (Critical Paths)
        id: e2e_tests
        env:
          BASE_URL: ${{ steps.staging_url.outputs.frontend_url }}
          API_URL: ${{ steps.staging_url.outputs.api_url }}
        run: |
          if [ -f playwright.config.ts ]; then
            npx playwright test tests/e2e/auth.spec.ts --project=chromium --reporter=list || echo "::warning::Some E2E tests failed"
          fi
        continue-on-error: true

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
        continue-on-error: true

      - name: E2E Test Summary
        if: always()
        run: |
          echo "## E2E Connectivity Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Health Checks | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | Completed |" >> $GITHUB_STEP_SUMMARY

  production-approval:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: |
      needs.deploy-staging.result == 'success' &&
      (github.event.inputs.action == 'build-deploy' || github.event.inputs.action == 'release')
    environment: production-approval
    steps:
      - name: Request production approval
        run: echo "Awaiting production approval..."

  deploy-production:
    name: Deploy to Production (ECS Fargate)
    runs-on: ubuntu-latest
    needs: [build-and-test, build-asset-branding, build-docker-images, build-frontend, collect-image-digests, deploy-staging, production-approval]
    if: needs.production-approval.result == 'success'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: /tmp/image-digests
          merge-multiple: true
        continue-on-error: true

      - name: Check ECS cluster exists
        id: ecs_check
        if: steps.aws_creds.outcome == 'success'
        run: |
          CLUSTER_NAME="flamoral-prod-cluster"
          if aws ecs describe-clusters --clusters "$CLUSTER_NAME" --query 'clusters[0].status' --output text 2>/dev/null | grep -q "ACTIVE"; then
            echo "cluster_exists=true" >> $GITHUB_OUTPUT
            echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          else
            echo "cluster_exists=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Deploy to Production ECS with immutable digests
        if: steps.aws_creds.outcome == 'success' && steps.ecs_check.outputs.cluster_exists == 'true'
        env:
          CLUSTER_NAME: ${{ steps.ecs_check.outputs.cluster_name }}
        run: |
          SERVICES=("asset-branding" "api-gateway" "auth-service" "user-service" "matching-service" "messaging-service" "media-service" "payment-service" "notification-service" "moderation-service" "analytics-service" "automation-service" "partnership-service" "advertising-service" "admin-service" "realtime-service" "workflow-engine" "email-service" "location-service" "profile-service" "recommendation-service" "report-service" "scheduler-service" "subscription-service" "verification-service" "webhook-service" "worker-service" "search-service")
          FAILED=()
          for SERVICE in "${SERVICES[@]}"; do
            SERVICE_STATUS=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE" --query 'services[0].status' --output text 2>/dev/null || echo "NOT_FOUND")
            if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
              DIGEST_FILE="/tmp/image-digests/${SERVICE}.txt"
              if [ -f "$DIGEST_FILE" ]; then
                NEW_IMAGE_URI=$(cat "$DIGEST_FILE")
                CURRENT_TD=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
                TD_JSON=$(aws ecs describe-task-definition --task-definition "$CURRENT_TD" --query 'taskDefinition')
                NEW_TD_JSON=$(echo "$TD_JSON" | jq --arg img "$NEW_IMAGE_URI" '.containerDefinitions[0].image = $img | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
                NEW_TD_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TD_JSON" --query 'taskDefinition.taskDefinitionArn' --output text)
                if ! aws ecs update-service --cluster "$CLUSTER_NAME" --service "$SERVICE" --task-definition "$NEW_TD_ARN" --no-cli-pager; then
                  FAILED+=("$SERVICE")
                fi
              else
                if ! aws ecs update-service --cluster "$CLUSTER_NAME" --service "$SERVICE" --force-new-deployment --no-cli-pager; then
                  FAILED+=("$SERVICE")
                fi
              fi
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed: ${FAILED[*]}"
            exit 1
          fi

      - name: Wait for production deployments
        if: steps.aws_creds.outcome == 'success' && steps.ecs_check.outputs.cluster_exists == 'true'
        env:
          CLUSTER_NAME: ${{ steps.ecs_check.outputs.cluster_name }}
        run: |
          for SERVICE in api-gateway auth-service user-service; do
            aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "$SERVICE" --no-cli-pager || true
          done

      - name: Notify success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: 'Production ECS Fargate deployment successful!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: steps.ecs_check.outputs.cluster_exists == 'true'

  # ==========================================================================
  # SECTION 7: SCHEDULED OPERATIONS
  # ==========================================================================

  scheduled-drift-detection:
    name: '[Scheduled] Drift Detection'
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'drift-check')
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Check drift (ECS resources only)
        id: drift
        run: |
          cd infrastructure/terraform/environments/${{ matrix.environment }}
          terraform init
          DRIFT_OUTPUT=$(terraform plan -detailed-exitcode -no-color 2>&1) || EXIT_CODE=$?
          if [ "$EXIT_CODE" = "2" ]; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "$DRIFT_OUTPUT" > drift-report-${{ matrix.environment }}.txt
            if echo "$DRIFT_OUTPUT" | grep -E "aws_eks_|kubernetes_|helm_"; then
              echo "::error::EKS/K8s resources in drift - should not exist!"
            fi
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload drift report
        if: steps.drift.outputs.drift_detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ matrix.environment }}
          path: infrastructure/terraform/environments/${{ matrix.environment }}/drift-report-*.txt

  scheduled-identity-audit:
    name: '[Scheduled] Identity Audit'
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'identity-audit')
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Cognito groups
        env:
          USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
        run: |
          GROUPS=$(aws cognito-idp list-groups --user-pool-id "$USER_POOL_ID" --query 'Groups[].GroupName' --output text)
          REQUIRED="saas-free saas-standard saas-premium saas-verified saas-moderator saas-operator saas-admin banned"
          for group in $REQUIRED; do
            if echo "$GROUPS" | grep -q "$group"; then
              echo "Group $group exists"
            else
              echo "::error::Group $group NOT FOUND"
              exit 1
            fi
          done

  scheduled-lifecycle-check:
    name: '[Scheduled] Lifecycle Check'
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'lifecycle-check')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ECS Fargate services (no EKS)
        run: |
          echo "Infrastructure: AWS ECS Fargate ONLY (no EKS/Kubernetes)"
          aws ecs describe-clusters --clusters flamoral-prod-cluster --query 'clusters[0].{Name:clusterName,Status:status,Tasks:runningTasksCount}' --output table || true
          aws rds describe-db-clusters --query 'DBClusters[?contains(DBClusterIdentifier, `flamoral`)].EngineVersion' --output text || true
          aws elasticache describe-cache-clusters --query 'CacheClusters[?contains(CacheClusterId, `flamoral`)].EngineVersion' --output text || true

      - name: Run npm audit
        run: npm audit --audit-level=high 2>&1 | tee npm-audit.txt || true

      - name: Upload lifecycle report
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-report
          path: npm-audit.txt

  # ==========================================================================
  # SECTION 8: AUXILIARY OPERATIONS
  # ==========================================================================

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: deploy-production
    if: |
      needs.deploy-production.result == 'success' &&
      github.event.inputs.action == 'release' &&
      github.event.inputs.version != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rollback-deployment:
    name: Rollback ECS Deployment
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'rollback' && github.event.inputs.rollback_to != ''
    environment: production-rollback
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Check ECS cluster
        id: ecs_check
        if: steps.aws_creds.outcome == 'success'
        run: |
          CLUSTER_NAME="flamoral-prod-cluster"
          if aws ecs describe-clusters --clusters "$CLUSTER_NAME" --query 'clusters[0].status' --output text 2>/dev/null | grep -q "ACTIVE"; then
            echo "cluster_exists=true" >> $GITHUB_OUTPUT
            echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          else
            echo "cluster_exists=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Rollback ECS task definitions (no kubectl/helm)
        if: steps.aws_creds.outcome == 'success' && steps.ecs_check.outputs.cluster_exists == 'true'
        env:
          CLUSTER_NAME: ${{ steps.ecs_check.outputs.cluster_name }}
        run: |
          echo "Rolling back ECS services (ECS Fargate only - no kubectl/helm)"
          SERVICES=("asset-branding" "api-gateway" "auth-service" "user-service" "matching-service" "messaging-service" "media-service" "payment-service" "notification-service" "moderation-service" "analytics-service" "automation-service" "partnership-service" "advertising-service" "admin-service" "realtime-service" "workflow-engine" "email-service" "location-service" "profile-service" "recommendation-service" "report-service" "scheduler-service" "subscription-service" "verification-service" "webhook-service" "worker-service" "search-service")
          for SERVICE in "${SERVICES[@]}"; do
            CURRENT_TD=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE" --query 'services[0].taskDefinition' --output text 2>/dev/null)
            if [ -n "$CURRENT_TD" ]; then
              FAMILY=$(echo "$CURRENT_TD" | cut -d'/' -f2 | cut -d':' -f1)
              CURRENT_REV=$(echo "$CURRENT_TD" | cut -d':' -f2)
              PREV_REV=$((CURRENT_REV - 1))
              if [ $PREV_REV -gt 0 ]; then
                aws ecs update-service --cluster "$CLUSTER_NAME" --service "$SERVICE" --task-definition "${FAMILY}:${PREV_REV}" --no-cli-pager || true
              fi
            fi
          done

      - name: Wait for rollback
        if: steps.ecs_check.outputs.cluster_exists == 'true'
        env:
          CLUSTER_NAME: ${{ steps.ecs_check.outputs.cluster_name }}
        run: aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "api-gateway" --no-cli-pager || true

  # ==========================================================================
  # SECTION 8.5: MOBILE APP E2E TESTS & EXPO EAS BUILDS
  # ==========================================================================

  mobile-e2e-test:
    name: Mobile E2E Tests
    runs-on: macos-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'mobile') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.modified, 'apps/mobile-app/'))
    outputs:
      tests_passed: ${{ steps.e2e_result.outputs.passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install root dependencies
        run: yarn install

      - name: Install mobile app dependencies
        run: |
          cd apps/mobile-app
          yarn install

      - name: Setup Java (for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Create Expo development build for testing
        run: |
          cd apps/mobile-app
          npx expo prebuild --clean --platform ios
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Build iOS Simulator app for E2E tests
        run: |
          cd apps/mobile-app/ios
          xcodebuild -workspace *.xcworkspace \
            -scheme "flamoral" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -derivedDataPath build \
            build || echo "::warning::iOS build for simulator failed"

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15" 2>/dev/null || true
          xcrun simctl bootstatus "iPhone 15" -b

      - name: Install app on Simulator
        run: |
          APP_PATH=$(find apps/mobile-app/ios/build -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            xcrun simctl install booted "$APP_PATH"
          else
            echo "::warning::No .app bundle found for installation"
          fi
        continue-on-error: true

      - name: Run Maestro E2E Tests - App Launch
        id: test_launch
        run: |
          cd apps/mobile-app
          if [ -d ".maestro" ] || [ -d "e2e" ]; then
            maestro test .maestro/app_launch.yaml || maestro test e2e/app_launch.yaml || echo "::warning::App launch test not found or failed"
          else
            echo "Creating basic launch test..."
            mkdir -p .maestro
            cat > .maestro/app_launch.yaml << 'EOF'
          appId: com.flamoral.app
          ---
          - launchApp
          - assertVisible: ".*"
          EOF
            maestro test .maestro/app_launch.yaml || true
          fi
        continue-on-error: true

      - name: Run Maestro E2E Tests - Login Flow
        id: test_login
        run: |
          cd apps/mobile-app
          if [ -f ".maestro/login_flow.yaml" ] || [ -f "e2e/login_flow.yaml" ]; then
            maestro test .maestro/login_flow.yaml || maestro test e2e/login_flow.yaml || echo "::warning::Login flow test failed"
          else
            echo "::notice::Login flow test not configured"
          fi
        continue-on-error: true

      - name: Run Maestro E2E Tests - Navigation
        id: test_navigation
        run: |
          cd apps/mobile-app
          if [ -f ".maestro/navigation.yaml" ] || [ -f "e2e/navigation.yaml" ]; then
            maestro test .maestro/navigation.yaml || maestro test e2e/navigation.yaml || echo "::warning::Navigation test failed"
          else
            echo "::notice::Navigation test not configured"
          fi
        continue-on-error: true

      - name: Run Maestro E2E Tests - Offline Handling
        id: test_offline
        run: |
          cd apps/mobile-app
          if [ -f ".maestro/offline_handling.yaml" ] || [ -f "e2e/offline_handling.yaml" ]; then
            maestro test .maestro/offline_handling.yaml || maestro test e2e/offline_handling.yaml || echo "::warning::Offline handling test failed"
          else
            echo "::notice::Offline handling test not configured"
          fi
        continue-on-error: true

      - name: Evaluate E2E Test Results
        id: e2e_result
        run: |
          LAUNCH_RESULT="${{ steps.test_launch.outcome }}"
          LOGIN_RESULT="${{ steps.test_login.outcome }}"
          NAV_RESULT="${{ steps.test_navigation.outcome }}"
          OFFLINE_RESULT="${{ steps.test_offline.outcome }}"

          # App launch is critical - must pass
          if [ "$LAUNCH_RESULT" = "failure" ]; then
            echo "::error::Critical test failed: App Launch"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Count failures for other tests
          FAILURES=0
          [ "$LOGIN_RESULT" = "failure" ] && FAILURES=$((FAILURES + 1))
          [ "$NAV_RESULT" = "failure" ] && FAILURES=$((FAILURES + 1))
          [ "$OFFLINE_RESULT" = "failure" ] && FAILURES=$((FAILURES + 1))

          if [ $FAILURES -gt 1 ]; then
            echo "::error::Multiple E2E tests failed ($FAILURES failures)"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "passed=true" >> $GITHUB_OUTPUT
          echo "E2E tests passed (or within acceptable failure threshold)"

      - name: Upload E2E Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-results
          path: |
            apps/mobile-app/.maestro/
            apps/mobile-app/e2e/
            ~/.maestro/tests/
          retention-days: 7
        continue-on-error: true

      - name: E2E Test Summary
        if: always()
        run: |
          echo "## Mobile E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| App Launch | ${{ steps.test_launch.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Login Flow | ${{ steps.test_login.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Navigation | ${{ steps.test_navigation.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Offline Handling | ${{ steps.test_offline.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Result:** ${{ steps.e2e_result.outputs.passed == 'true' && 'PASSED' || 'FAILED' }}" >> $GITHUB_STEP_SUMMARY

  mobile-build-expo:
    name: Build Mobile Apps (Expo EAS)
    runs-on: ubuntu-latest
    # TODO: Re-enable E2E test dependency once local build issues are resolved
    # needs: mobile-e2e-test
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'mobile') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.modified, 'apps/mobile-app/'))
    outputs:
      android_build_id: ${{ steps.eas_build_android.outputs.build_id }}
      ios_build_id: ${{ steps.eas_build_ios.outputs.build_id }}
      build_profile: ${{ steps.build_config.outputs.profile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install root dependencies
        run: yarn install

      - name: Install mobile app dependencies
        run: |
          cd apps/mobile-app
          yarn install

      - name: Setup Expo CLI and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Login to Expo
        run: |
          echo "Verifying Expo authentication..."
          eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Initialize and Validate EAS Project
        id: eas_init
        run: |
          cd apps/mobile-app

          # First, try to get project info
          echo "Checking EAS project status..."
          PROJECT_INFO=$(eas project:info 2>&1) || true

          if echo "$PROJECT_INFO" | grep -q "fullName"; then
            echo "EAS project already linked"
            # Extract project ID from output line like "ID        7830bf9b-..."
            PROJECT_ID=$(echo "$PROJECT_INFO" | grep "^ID" | awk '{print $2}')
            echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
            echo "Project ID extracted: $PROJECT_ID"
          else
            echo "Linking existing EAS project..."
            # Use --force to link existing project
            eas init --non-interactive --force

            # Verify the project was linked
            PROJECT_INFO=$(eas project:info 2>&1)
            if ! echo "$PROJECT_INFO" | grep -q "fullName"; then
              echo "::error::Failed to link EAS project"
              echo "Output: $PROJECT_INFO"
              exit 1
            fi

            PROJECT_ID=$(echo "$PROJECT_INFO" | grep "^ID" | awk '{print $2}')
            echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          fi

          # Display project info for debugging
          echo "EAS Project ID: $PROJECT_ID"
          eas whoami

          # Verify eas.json exists
          if [ ! -f eas.json ]; then
            echo "::error::eas.json not found"
            exit 1
          fi

          echo "EAS Project linked and validated successfully"
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}

      - name: Determine build configuration
        id: build_config
        run: |
          PROFILE="${{ github.event.inputs.mobile_build_profile || 'development' }}"
          PLATFORM="${{ github.event.inputs.mobile_platform || 'all' }}"
          SUBMIT="${{ github.event.inputs.mobile_submit || 'false' }}"

          # For push events, use development profile
          if [ "${{ github.event_name }}" = "push" ]; then
            PROFILE="development"
            SUBMIT="false"
          fi

          echo "profile=$PROFILE" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "submit=$SUBMIT" >> $GITHUB_OUTPUT

          echo "Build Configuration:"
          echo "  Profile: $PROFILE"
          echo "  Platform: $PLATFORM"
          echo "  Submit to stores: $SUBMIT"

      - name: Run EAS Build - Android
        id: eas_build_android
        if: steps.build_config.outputs.platform == 'all' || steps.build_config.outputs.platform == 'android'
        run: |
          set +e  # Don't exit on error
          cd apps/mobile-app

          echo "Starting Android build..."
          echo "Profile: ${{ steps.build_config.outputs.profile }}"

          # Run build and capture output
          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile ${{ steps.build_config.outputs.profile }} \
            --non-interactive \
            --no-wait \
            --json 2>&1)
          BUILD_EXIT_CODE=$?

          echo "EAS build command exit code: $BUILD_EXIT_CODE"
          echo "Raw output:"
          echo "$BUILD_OUTPUT"

          # Check if command succeeded (exit code 0 means success)
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "::error::EAS Android build command failed with exit code $BUILD_EXIT_CODE"
            exit 1
          fi

          # Extract JSON from output (EAS includes text before JSON array)
          # Look for the JSON array which starts with [
          JSON_OUTPUT=$(echo "$BUILD_OUTPUT" | sed -n '/^\[$/,/^\]$/p')

          if [ -z "$JSON_OUTPUT" ]; then
            echo "Could not find JSON array in output, trying to extract from logs URL..."
            # Try to extract build ID from the logs URL
            BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oP 'builds/\K[0-9a-f-]+' | head -1)
          else
            echo "Extracted JSON:"
            echo "$JSON_OUTPUT"

            # Extract build ID from JSON
            BUILD_ID=$(echo "$JSON_OUTPUT" | jq -r '.[0].id // empty')
          fi

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Could not extract Android build ID from response"
            exit 1
          fi

          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Android build queued with ID: $BUILD_ID"
          echo "View at: https://expo.dev/accounts/flamoral/projects/flamoral/builds/$BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ steps.eas_init.outputs.project_id }}

      - name: Run EAS Build - iOS
        id: eas_build_ios
        if: steps.build_config.outputs.platform == 'all' || steps.build_config.outputs.platform == 'ios'
        run: |
          set +e  # Don't exit on error
          cd apps/mobile-app

          echo "Starting iOS build..."
          echo "Profile: ${{ steps.build_config.outputs.profile }}"

          # Run build and capture output
          BUILD_OUTPUT=$(eas build \
            --platform ios \
            --profile ${{ steps.build_config.outputs.profile }} \
            --non-interactive \
            --no-wait \
            --json 2>&1)
          BUILD_EXIT_CODE=$?

          echo "EAS build command exit code: $BUILD_EXIT_CODE"
          echo "Raw output:"
          echo "$BUILD_OUTPUT"

          # Check if command succeeded (exit code 0 means success)
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "::error::EAS iOS build command failed with exit code $BUILD_EXIT_CODE"
            exit 1
          fi

          # Extract JSON from output (EAS includes text before JSON array)
          # Look for the JSON array which starts with [
          JSON_OUTPUT=$(echo "$BUILD_OUTPUT" | sed -n '/^\[$/,/^\]$/p')

          if [ -z "$JSON_OUTPUT" ]; then
            echo "Could not find JSON array in output, trying to extract from logs URL..."
            # Try to extract build ID from the logs URL
            BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oP 'builds/\K[0-9a-f-]+' | head -1)
          else
            echo "Extracted JSON:"
            echo "$JSON_OUTPUT"

            # Extract build ID from JSON
            BUILD_ID=$(echo "$JSON_OUTPUT" | jq -r '.[0].id // empty')
          fi

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Could not extract iOS build ID from response"
            exit 1
          fi

          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "iOS build queued with ID: $BUILD_ID"
          echo "View at: https://expo.dev/accounts/flamoral/projects/flamoral/builds/$BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ steps.eas_init.outputs.project_id }}

      - name: Wait for Android build completion
        id: android_build_status
        if: steps.eas_build_android.outputs.build_id != ''
        run: |
          cd apps/mobile-app
          BUILD_ID="${{ steps.eas_build_android.outputs.build_id }}"
          echo "Waiting for Android build $BUILD_ID to complete..."

          # Poll for build status
          MAX_ATTEMPTS=120  # 60 minutes with 30s intervals
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS_OUTPUT=$(eas build:view "$BUILD_ID" --json 2>&1)
            STATUS=$(echo "$STATUS_OUTPUT" | jq -r '.status // "unknown"')

            echo "Build status: $STATUS (attempt $((ATTEMPT+1))/$MAX_ATTEMPTS)"

            case "$STATUS" in
              "finished")
                echo "build_status=success" >> $GITHUB_OUTPUT
                echo "Android build completed successfully!"
                exit 0
                ;;
              "errored"|"canceled")
                echo "build_status=failed" >> $GITHUB_OUTPUT
                echo "::error::Android build failed with status: $STATUS"
                exit 1
                ;;
              "in-queue"|"in-progress")
                sleep 30
                ATTEMPT=$((ATTEMPT+1))
                ;;
              *)
                echo "Unknown status: $STATUS"
                sleep 30
                ATTEMPT=$((ATTEMPT+1))
                ;;
            esac
          done

          echo "::warning::Build timed out waiting for completion"
          echo "build_status=timeout" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        timeout-minutes: 65
        continue-on-error: true

      - name: Wait for iOS build completion
        id: ios_build_status
        if: steps.eas_build_ios.outputs.build_id != ''
        run: |
          cd apps/mobile-app
          BUILD_ID="${{ steps.eas_build_ios.outputs.build_id }}"
          echo "Waiting for iOS build $BUILD_ID to complete..."

          # Poll for build status
          MAX_ATTEMPTS=180  # 90 minutes with 30s intervals
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS_OUTPUT=$(eas build:view "$BUILD_ID" --json 2>&1)
            STATUS=$(echo "$STATUS_OUTPUT" | jq -r '.status // "unknown"')

            echo "Build status: $STATUS (attempt $((ATTEMPT+1))/$MAX_ATTEMPTS)"

            case "$STATUS" in
              "finished")
                echo "build_status=success" >> $GITHUB_OUTPUT
                echo "iOS build completed successfully!"
                exit 0
                ;;
              "errored"|"canceled")
                echo "build_status=failed" >> $GITHUB_OUTPUT
                echo "::error::iOS build failed with status: $STATUS"
                exit 1
                ;;
              "in-queue"|"in-progress")
                sleep 30
                ATTEMPT=$((ATTEMPT+1))
                ;;
              *)
                echo "Unknown status: $STATUS"
                sleep 30
                ATTEMPT=$((ATTEMPT+1))
                ;;
            esac
          done

          echo "::warning::Build timed out waiting for completion"
          echo "build_status=timeout" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        timeout-minutes: 95
        continue-on-error: true

      - name: Submit to Google Play Store
        if: |
          steps.build_config.outputs.profile == 'production' &&
          steps.build_config.outputs.submit == 'true' &&
          steps.eas_build_android.outputs.build_id != ''
        run: |
          cd apps/mobile-app
          echo "Submitting Android build to Google Play Store..."
          eas submit \
            --platform android \
            --latest \
            --non-interactive || echo "::warning::Android submission failed"
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Submit to Apple App Store
        if: |
          steps.build_config.outputs.profile == 'production' &&
          steps.build_config.outputs.submit == 'true' &&
          steps.eas_build_ios.outputs.build_id != ''
        run: |
          cd apps/mobile-app
          echo "Submitting iOS build to Apple App Store..."
          eas submit \
            --platform ios \
            --latest \
            --non-interactive || echo "::warning::iOS submission failed"
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Mobile Build Summary
        if: always()
        run: |
          echo "## Mobile Build Results (Expo EAS)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Profile:** ${{ steps.build_config.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "**E2E Tests:** Skipped (pending local build fixes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Build ID | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.eas_build_android.outputs.build_id }}" ]; then
            echo "| Android | ${{ steps.eas_build_android.outputs.build_id }} | Started |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Android | - | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ steps.eas_build_ios.outputs.build_id }}" ]; then
            echo "| iOS | ${{ steps.eas_build_ios.outputs.build_id }} | Started |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| iOS | - | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build_config.outputs.submit }}" = "true" ] && [ "${{ steps.build_config.outputs.profile }}" = "production" ]; then
            echo "**Store Submission:** Enabled (production builds submitted to stores)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Store Submission:** Disabled" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # SECTION 9: PIPELINE SUMMARY
  # ==========================================================================

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      - pr-quality-summary
      - sast-scan
      - dependency-scan
      - build-and-test
      - build-asset-branding
      - build-docker-images
      - build-frontend
      - deploy-staging
      - deploy-production
      - scheduled-drift-detection
      - scheduled-identity-audit
      - scheduled-lifecycle-check
      - mobile-e2e-test
      - mobile-build-expo
    if: always()
    steps:
      - name: Generate pipeline summary
        run: |
          echo "# Flamoral Unified Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Infrastructure:** AWS ECS Fargate (NO Kubernetes/EKS)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PR Quality | ${{ needs.pr-quality-summary.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Scan | ${{ needs.sast-scan.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Asset Branding | ${{ needs.build-asset-branding.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.build-docker-images.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Staging | ${{ needs.deploy-staging.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Production | ${{ needs.deploy-production.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile E2E Tests | ${{ needs.mobile-e2e-test.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Build (EAS) | ${{ needs.mobile-build-expo.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: 'Pipeline failed!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
