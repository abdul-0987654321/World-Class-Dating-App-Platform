name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      auto_approve:
        description: 'Auto approve apply (use with caution)'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

jobs:
  terraform-apply:
    name: Apply - ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: ./infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file="envs/${{ github.event.inputs.environment }}.tfvars" -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.auto_approve == 'true'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Apply (Manual Approval)
        if: github.event.inputs.auto_approve != 'true'
        run: terraform apply tfplan

      - name: Get Outputs
        id: outputs
        run: |
          echo "aks_name=$(terraform output -raw aks_name)" >> $GITHUB_OUTPUT
          echo "postgres_fqdn=$(terraform output -raw postgres_fqdn)" >> $GITHUB_OUTPUT
          echo "redis_hostname=$(terraform output -raw redis_hostname)" >> $GITHUB_OUTPUT

      - name: Comment deployment status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Apply - ${{ github.event.inputs.environment }} ✅

            Infrastructure has been successfully deployed to **${{ github.event.inputs.environment }}** environment.

            **AKS Cluster:** ${{ steps.outputs.outputs.aks_name }}
            **PostgreSQL FQDN:** ${{ steps.outputs.outputs.postgres_fqdn }}
            **Redis Hostname:** ${{ steps.outputs.outputs.redis_hostname }}

            Next steps: Deploy application using Helm charts.`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: output
            })
