# =============================================================================
# FLAMORAL SELF-HEALING MONITOR
# Continuous automated health checks and remediation
# =============================================================================
# Runs every 15 minutes to detect and remediate issues automatically
# Integrates with Prometheus alerts and Kubernetes for automated recovery
# =============================================================================

name: Self-Healing Monitor

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'health-check'
        options:
          - health-check
          - remediate
          - full-audit
      environment:
        description: 'Target environment'
        required: false
        type: choice
        default: 'production'
        options:
          - development
          - staging
          - production
      dry_run:
        description: 'Dry run (no actual remediation)'
        required: false
        type: boolean
        default: false

concurrency:
  group: self-healing-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false  # Never cancel ongoing health checks

env:
  NODE_VERSION: '20'
  DOMAIN: flamoral.com
  API_ENDPOINT: https://api.flamoral.com
  B2C_TENANT: flamoralb2c

permissions:
  contents: read
  id-token: write

jobs:
  # ===========================================================================
  # HEALTH CHECK - Core health validation
  # ===========================================================================
  health-check:
    name: Run Health Checks
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    outputs:
      health_status: ${{ steps.check.outputs.status }}
      issues_found: ${{ steps.check.outputs.issues_found }}
      issues_json: ${{ steps.check.outputs.issues_json }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          npm install -g ts-node typescript

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        id: aks
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          case $ENV in
            production)
              az aks get-credentials --resource-group flamoral-prod-rg --name flamoral-prod-aks --overwrite-existing
              NAMESPACE="flamoral-prod"
              ;;
            staging)
              az aks get-credentials --resource-group flamoral-staging-rg --name flamoral-staging-aks --overwrite-existing
              NAMESPACE="flamoral-staging"
              ;;
            development)
              az aks get-credentials --resource-group flamoral-dev-rg --name flamoral-dev-aks --overwrite-existing
              NAMESPACE="flamoral-dev"
              ;;
          esac
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT

      - name: Run health checks
        id: check
        run: |
          ts-node scripts/health-check.ts 2>&1 | tee health-report.txt
          EXIT_CODE=${PIPESTATUS[0]}

          # Parse results
          if grep -q "CRITICAL" health-report.txt; then
            echo "status=critical" >> $GITHUB_OUTPUT
            echo "issues_found=true" >> $GITHUB_OUTPUT
          elif grep -q "WARNING" health-report.txt; then
            echo "status=warning" >> $GITHUB_OUTPUT
            echo "issues_found=true" >> $GITHUB_OUTPUT
          else
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "issues_found=false" >> $GITHUB_OUTPUT
          fi

          # Extract issues as JSON
          ISSUES=$(grep -E "(CRITICAL|WARNING)" health-report.txt | head -20 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "issues_json=$ISSUES" >> $GITHUB_OUTPUT

          exit $EXIT_CODE
        env:
          DOMAIN: ${{ env.DOMAIN }}
          API_ENDPOINT: ${{ env.API_ENDPOINT }}
          B2C_TENANT: ${{ env.B2C_TENANT }}
          KUBERNETES_NAMESPACE: ${{ steps.aks.outputs.namespace }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
        continue-on-error: true

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: health-report.txt
          retention-days: 30

      - name: Generate health summary
        run: |
          echo "# Self-Healing Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.check.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Health Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat health-report.txt | head -100 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # KUBERNETES HEALTH - Check pod and cluster health
  # ===========================================================================
  kubernetes-health:
    name: Kubernetes Health Check
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    outputs:
      unhealthy_pods: ${{ steps.k8s-check.outputs.unhealthy_pods }}
      restart_candidates: ${{ steps.k8s-check.outputs.restart_candidates }}
      memory_pressure: ${{ steps.k8s-check.outputs.memory_pressure }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        id: aks
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          case $ENV in
            production)
              az aks get-credentials --resource-group flamoral-prod-rg --name flamoral-prod-aks --overwrite-existing
              NAMESPACE="flamoral-prod"
              ;;
            staging)
              az aks get-credentials --resource-group flamoral-staging-rg --name flamoral-staging-aks --overwrite-existing
              NAMESPACE="flamoral-staging"
              ;;
            development)
              az aks get-credentials --resource-group flamoral-dev-rg --name flamoral-dev-aks --overwrite-existing
              NAMESPACE="flamoral-dev"
              ;;
          esac
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT

      - name: Check Kubernetes health
        id: k8s-check
        run: |
          NAMESPACE="${{ steps.aks.outputs.namespace }}"

          # Check for unhealthy pods
          UNHEALTHY=$(kubectl get pods -n $NAMESPACE --no-headers 2>/dev/null | grep -v "Running\|Completed" | wc -l || echo "0")
          echo "unhealthy_pods=$UNHEALTHY" >> $GITHUB_OUTPUT

          # Check for pods in CrashLoopBackOff
          CRASHLOOP=$(kubectl get pods -n $NAMESPACE --no-headers 2>/dev/null | grep "CrashLoopBackOff" | awk '{print $1}' | tr '\n' ',' | sed 's/,$//')
          echo "restart_candidates=$CRASHLOOP" >> $GITHUB_OUTPUT

          # Check node memory pressure
          MEMORY_PRESSURE=$(kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="MemoryPressure")].status}' | grep -c "True" || echo "0")
          echo "memory_pressure=$MEMORY_PRESSURE" >> $GITHUB_OUTPUT

          # Generate pod status report
          echo "## Pod Status" >> pod-status.txt
          kubectl get pods -n $NAMESPACE -o wide >> pod-status.txt

          echo "## Resource Usage" >> pod-status.txt
          kubectl top pods -n $NAMESPACE 2>/dev/null >> pod-status.txt || echo "Metrics not available" >> pod-status.txt

          echo "## Events (last 30 minutes)" >> pod-status.txt
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>/dev/null | tail -30 >> pod-status.txt

      - name: Check HPA status
        run: |
          NAMESPACE="${{ steps.aks.outputs.namespace }}"
          echo "## HPA Status" >> hpa-status.txt
          kubectl get hpa -n $NAMESPACE -o wide 2>/dev/null >> hpa-status.txt || echo "No HPAs configured" >> hpa-status.txt

          # Check if any HPA is at max replicas
          MAX_REPLICAS=$(kubectl get hpa -n $NAMESPACE -o json 2>/dev/null | jq '[.items[] | select(.status.currentReplicas >= .spec.maxReplicas)] | length')
          if [ "$MAX_REPLICAS" != "0" ] && [ -n "$MAX_REPLICAS" ]; then
            echo "::warning::$MAX_REPLICAS HPAs at max replicas - consider scaling up"
          fi

      - name: Upload kubernetes report
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-report-${{ github.run_id }}
          path: |
            pod-status.txt
            hpa-status.txt
          retention-days: 30

  # ===========================================================================
  # REMEDIATION - Auto-fix detected issues
  # ===========================================================================
  remediate:
    name: Auto-Remediate Issues
    needs: [health-check, kubernetes-health]
    runs-on: ubuntu-latest
    if: |
      (needs.health-check.outputs.issues_found == 'true' ||
       needs.kubernetes-health.outputs.unhealthy_pods != '0') &&
      (github.event_name == 'schedule' ||
       github.event.inputs.action == 'remediate' ||
       github.event.inputs.action == 'full-audit')
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          npm install -g ts-node typescript

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        id: aks
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          case $ENV in
            production)
              az aks get-credentials --resource-group flamoral-prod-rg --name flamoral-prod-aks --overwrite-existing
              NAMESPACE="flamoral-prod"
              ;;
            staging)
              az aks get-credentials --resource-group flamoral-staging-rg --name flamoral-staging-aks --overwrite-existing
              NAMESPACE="flamoral-staging"
              ;;
            development)
              az aks get-credentials --resource-group flamoral-dev-rg --name flamoral-dev-aks --overwrite-existing
              NAMESPACE="flamoral-dev"
              ;;
          esac
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT

      - name: Run remediation
        id: remediate
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          ts-node scripts/remediation.ts \
            --namespace=${{ steps.aks.outputs.namespace }} \
            --issues='${{ needs.health-check.outputs.issues_json }}' \
            --unhealthy-pods=${{ needs.kubernetes-health.outputs.unhealthy_pods }} \
            --restart-candidates="${{ needs.kubernetes-health.outputs.restart_candidates }}" \
            --memory-pressure=${{ needs.kubernetes-health.outputs.memory_pressure }} \
            --dry-run=$DRY_RUN \
            2>&1 | tee remediation-report.txt
        env:
          KUBERNETES_NAMESPACE: ${{ steps.aks.outputs.namespace }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

      - name: Upload remediation report
        uses: actions/upload-artifact@v4
        with:
          name: remediation-report-${{ github.run_id }}
          path: remediation-report.txt
          retention-days: 30

      - name: Generate remediation summary
        run: |
          echo "## Remediation Actions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat remediation-report.txt | head -50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # POST-REMEDIATION VALIDATION
  # ===========================================================================
  validate-remediation:
    name: Validate Remediation
    needs: [remediate]
    runs-on: ubuntu-latest
    if: needs.remediate.result == 'success'
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          case $ENV in
            production)
              az aks get-credentials --resource-group flamoral-prod-rg --name flamoral-prod-aks --overwrite-existing
              ;;
            staging)
              az aks get-credentials --resource-group flamoral-staging-rg --name flamoral-staging-aks --overwrite-existing
              ;;
            development)
              az aks get-credentials --resource-group flamoral-dev-rg --name flamoral-dev-aks --overwrite-existing
              ;;
          esac

      - name: Wait for stabilization
        run: sleep 60

      - name: Re-run health checks
        run: |
          chmod +x scripts/self-healing-checks.sh
          ./scripts/self-healing-checks.sh
        env:
          DOMAIN: ${{ env.DOMAIN }}
          API_ENDPOINT: ${{ env.API_ENDPOINT }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

  # ===========================================================================
  # ALERTING - Notify on critical issues
  # ===========================================================================
  alert:
    name: Send Alerts
    needs: [health-check, kubernetes-health, remediate]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.health-check.outputs.health_status == 'critical' ||
       needs.remediate.result == 'failure')

    steps:
      - name: Send Slack Alert
        uses: 8398a7/action-slack@v3
        with:
          status: 'custom'
          custom_payload: |
            {
              "channel": "#alerts",
              "attachments": [
                {
                  "color": "danger",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "Self-Healing Alert - Flamoral Platform"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Environment:*\n${{ github.event.inputs.environment || 'production' }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Health Status:*\n${{ needs.health-check.outputs.health_status }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Unhealthy Pods:*\n${{ needs.kubernetes-health.outputs.unhealthy_pods }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Remediation:*\n${{ needs.remediate.result }}"
                        }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Send PagerDuty Alert
        if: needs.health-check.outputs.health_status == 'critical'
        run: |
          curl -X POST https://events.pagerduty.com/v2/enqueue \
            -H 'Content-Type: application/json' \
            -d '{
              "routing_key": "${{ secrets.PAGERDUTY_ROUTING_KEY }}",
              "event_action": "trigger",
              "dedup_key": "flamoral-self-healing-${{ github.run_id }}",
              "payload": {
                "summary": "Flamoral Platform Critical Issue Detected",
                "severity": "critical",
                "source": "GitHub Actions Self-Healing",
                "custom_details": {
                  "environment": "${{ github.event.inputs.environment || '\''production'\'' }}",
                  "health_status": "${{ needs.health-check.outputs.health_status }}",
                  "workflow_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              }
            }'
        continue-on-error: true

  # ===========================================================================
  # METRICS - Report to monitoring
  # ===========================================================================
  report-metrics:
    name: Report Metrics
    needs: [health-check, kubernetes-health, remediate, validate-remediation]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Push metrics to Prometheus Pushgateway
        run: |
          # Push health check metrics
          cat <<EOF | curl --data-binary @- ${{ secrets.PROMETHEUS_PUSHGATEWAY_URL }}/metrics/job/self_healing/instance/github_actions
          # HELP flamoral_self_healing_run_total Total self-healing runs
          # TYPE flamoral_self_healing_run_total counter
          flamoral_self_healing_run_total{environment="${{ github.event.inputs.environment || 'production' }}"} 1

          # HELP flamoral_health_check_status Health check status (0=healthy, 1=warning, 2=critical)
          # TYPE flamoral_health_check_status gauge
          flamoral_health_check_status{environment="${{ github.event.inputs.environment || 'production' }}"} ${{ needs.health-check.outputs.health_status == 'healthy' && '0' || needs.health-check.outputs.health_status == 'warning' && '1' || '2' }}

          # HELP flamoral_unhealthy_pods_total Total unhealthy pods
          # TYPE flamoral_unhealthy_pods_total gauge
          flamoral_unhealthy_pods_total{environment="${{ github.event.inputs.environment || 'production' }}"} ${{ needs.kubernetes-health.outputs.unhealthy_pods || '0' }}

          # HELP flamoral_remediation_executed Whether remediation was executed
          # TYPE flamoral_remediation_executed gauge
          flamoral_remediation_executed{environment="${{ github.event.inputs.environment || 'production' }}"} ${{ needs.remediate.result == 'success' && '1' || '0' }}
          EOF
        continue-on-error: true

      - name: Generate final summary
        run: |
          echo "# Self-Healing Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.health-check.outputs.health_status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unhealthy Pods | ${{ needs.kubernetes-health.outputs.unhealthy_pods }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory Pressure | ${{ needs.kubernetes-health.outputs.memory_pressure }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Remediation | ${{ needs.remediate.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate-remediation.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
