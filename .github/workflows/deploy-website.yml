# Flamoral Static Website - GitHub Pages Deployment
# Deploys static website to GitHub Pages on push to main

name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'docs/website/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/website'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          SITE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Website deployed to: $SITE_URL"

          # Wait for deployment to propagate
          echo "Waiting for deployment to propagate..."
          sleep 30

          # Track verification results
          HOMEPAGE_OK=false
          PRIVACY_OK=false
          TERMS_OK=false
          GUIDELINES_OK=false

          # Verify pages are accessible (with timeout and retries)
          for i in 1 2 3; do
            echo "Verification attempt $i..."

            if curl -sf --max-time 10 "$SITE_URL" > /dev/null 2>&1; then
              HOMEPAGE_OK=true
            fi
            if curl -sf --max-time 10 "${SITE_URL}privacy/" > /dev/null 2>&1; then
              PRIVACY_OK=true
            fi
            if curl -sf --max-time 10 "${SITE_URL}terms/" > /dev/null 2>&1; then
              TERMS_OK=true
            fi
            if curl -sf --max-time 10 "${SITE_URL}guidelines/" > /dev/null 2>&1; then
              GUIDELINES_OK=true
            fi

            # If all passed, break
            if [ "$HOMEPAGE_OK" = true ] && [ "$PRIVACY_OK" = true ] && [ "$TERMS_OK" = true ] && [ "$GUIDELINES_OK" = true ]; then
              break
            fi

            # Wait before retry
            [ $i -lt 3 ] && sleep 15
          done

          # Report results
          echo ""
          echo "=== Deployment Verification Results ==="
          echo "Homepage: $HOMEPAGE_OK"
          echo "Privacy Page: $PRIVACY_OK"
          echo "Terms Page: $TERMS_OK"
          echo "Guidelines Page: $GUIDELINES_OK"

          # Generate summary
          echo "## Website Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment URL:** $SITE_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Page | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Homepage | $HOMEPAGE_OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Privacy | $PRIVACY_OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Terms | $TERMS_OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Guidelines | $GUIDELINES_OK |" >> $GITHUB_STEP_SUMMARY

          # Warn if any page failed (but don't fail the workflow - propagation can take time)
          if [ "$HOMEPAGE_OK" = false ]; then
            echo "::warning::Homepage not accessible yet - may need more time to propagate"
          fi
