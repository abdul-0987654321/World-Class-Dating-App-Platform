# =============================================================================
# MOBILE APP CI/CD PIPELINE - iOS & Android
# =============================================================================
# Automated builds and deployments to TestFlight and Play Store
# Includes code signing, testing, and store submission automation
# =============================================================================

name: Mobile App CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'apps/mobile-app/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile-app/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - both
          - ios
          - android
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: 'development'
        options:
          - development
          - staging
          - production
      deploy_to_store:
        description: 'Deploy to app stores (production only)'
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  JAVA_VERSION: '17'
  XCODE_VERSION: '15.0'

jobs:
  # ===========================================================================
  # Detect Changes & Setup
  # ===========================================================================
  setup:
    name: Setup & Change Detection
    runs-on: ubuntu-latest
    outputs:
      should_build_ios: ${{ steps.check.outputs.build_ios }}
      should_build_android: ${{ steps.check.outputs.build_android }}
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ] || [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: Check what to build
        id: check
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'both' }}"
          if [ "$PLATFORM" == "both" ] || [ "$PLATFORM" == "ios" ]; then
            echo "build_ios=true" >> $GITHUB_OUTPUT
          else
            echo "build_ios=false" >> $GITHUB_OUTPUT
          fi
          if [ "$PLATFORM" == "both" ] || [ "$PLATFORM" == "android" ]; then
            echo "build_android=true" >> $GITHUB_OUTPUT
          else
            echo "build_android=false" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # Code Quality & Tests
  # ===========================================================================
  quality-tests:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    needs: setup

    defaults:
      run:
        working-directory: apps/mobile-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: apps/mobile-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test --coverage --ci
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/mobile-app/coverage/lcov.info
          flags: mobile-app
          name: mobile-app
          token: ${{ secrets.CODECOV_TOKEN }}

  # ===========================================================================
  # Android Build
  # ===========================================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [setup, quality-tests]
    if: needs.setup.outputs.should_build_android == 'true'

    defaults:
      run:
        working-directory: apps/mobile-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: apps/mobile-app/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile-app/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
        if: needs.setup.outputs.environment == 'production'

      - name: Create signing config
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF
        if: needs.setup.outputs.environment == 'production'

      - name: Build Android App Bundle (Production)
        if: needs.setup.outputs.environment == 'production'
        run: |
          cd android
          ./gradlew bundleRelease
          cd ..

      - name: Build Android APK (Development/Staging)
        if: needs.setup.outputs.environment != 'production'
        run: |
          eas build --platform android --profile ${{ needs.setup.outputs.environment }} --non-interactive --local

      - name: Sign APK
        if: needs.setup.outputs.environment == 'production'
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android/app/release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.setup.outputs.environment }}
          path: |
            apps/mobile-app/android/app/build/outputs/bundle/release/*.aab
            apps/mobile-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # ===========================================================================
  # iOS Build
  # ===========================================================================
  build-ios:
    name: Build iOS
    runs-on: macos-14
    needs: [setup, quality-tests]
    if: needs.setup.outputs.should_build_ios == 'true'

    defaults:
      run:
        working-directory: apps/mobile-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: apps/mobile-app/pnpm-lock.yaml

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/mobile-app/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Import certificates and provisioning profiles
        if: needs.setup.outputs.environment == 'production'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Import provisioning profile
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS App (Production)
        if: needs.setup.outputs.environment == 'production'
        run: |
          eas build --platform ios --profile production --non-interactive

      - name: Build iOS App (Development/Staging)
        if: needs.setup.outputs.environment != 'production'
        run: |
          eas build --platform ios --profile ${{ needs.setup.outputs.environment }} --non-interactive

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.setup.outputs.environment }}
          path: apps/mobile-app/ios/build/*.ipa
          retention-days: 30

  # ===========================================================================
  # Deploy to TestFlight
  # ===========================================================================
  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-14
    needs: [setup, build-ios]
    if: |
      needs.setup.outputs.environment == 'production' &&
      (github.event.inputs.deploy_to_store == 'true' || github.ref == 'refs/heads/main')
    environment: ios-testflight

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-${{ needs.setup.outputs.environment }}

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Upload to TestFlight
        working-directory: apps/mobile-app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          eas submit --platform ios --latest --non-interactive

      - name: Notify TestFlight deployment
        run: |
          echo "## TestFlight Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "iOS app has been uploaded to TestFlight" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Deploy to Google Play Store
  # ===========================================================================
  deploy-play-store:
    name: Deploy to Play Store
    runs-on: ubuntu-latest
    needs: [setup, build-android]
    if: |
      needs.setup.outputs.environment == 'production' &&
      (github.event.inputs.deploy_to_store == 'true' || github.ref == 'refs/heads/main')
    environment: android-play-store

    defaults:
      run:
        working-directory: apps/mobile-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.setup.outputs.environment }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create Google Play service account key
        run: |
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" > google-play-key.json

      - name: Upload to Play Store (Internal Testing)
        run: |
          eas submit --platform android --latest --non-interactive
        env:
          GOOGLE_SERVICES_KEY: google-play-key.json

      - name: Notify Play Store deployment
        run: |
          echo "## Play Store Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "Android app has been uploaded to Google Play (Internal Testing)" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Notifications & Summary
  # ===========================================================================
  notify:
    name: Deployment Notifications
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, deploy-testflight, deploy-play-store]
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "# Mobile App Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.build-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Store Deployments" >> $GITHUB_STEP_SUMMARY
          echo "| Store | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TestFlight | ${{ needs.deploy-testflight.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Play Store | ${{ needs.deploy-play-store.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          channel: '#mobile-deployments'
          custom_payload: |
            {
              "text": "Mobile App Build Complete",
              "attachments": [{
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                "fields": [
                  {
                    "title": "Android Build",
                    "value": "${{ needs.build-android.result }}",
                    "short": true
                  },
                  {
                    "title": "iOS Build",
                    "value": "${{ needs.build-ios.result }}",
                    "short": true
                  },
                  {
                    "title": "Branch",
                    "value": "${{ github.ref_name }}",
                    "short": true
                  },
                  {
                    "title": "Commit",
                    "value": "${{ github.sha }}",
                    "short": true
                  }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
