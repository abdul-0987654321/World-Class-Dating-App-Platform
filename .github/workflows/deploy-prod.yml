# =============================================================================
# Flamoral Dating Platform - Production Environment CI/CD Pipeline
# =============================================================================
# Triggers: Push to 'main' branch (with manual approval)
# Environment: Production (Public AKS cluster, flamoral.com)
# =============================================================================

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (must exist in ACR)'
        required: true
      skip_tests:
        description: 'Skip pre-deployment tests'
        type: boolean
        default: false

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AKS_CLUSTER_NAME: flamoral-prod-aks
  AKS_RESOURCE_GROUP: flamoral-prod-rg
  ENVIRONMENT: prod
  DOMAIN: flamoral.com

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  # =============================================================================
  # Pre-deployment Validation
  # =============================================================================
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.determine-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Determine image tag
        id: determine-tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="prod-$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Validate image exists in ACR
        if: github.event.inputs.image_tag != ''
        run: |
          az acr repository show-tags \
            --name ${{ env.ACR_NAME }} \
            --repository flamoral/api-gateway \
            --query "[?@=='${{ github.event.inputs.image_tag }}']" \
            --output tsv || (echo "Image tag not found in ACR" && exit 1)

      - name: Run security scan
        run: |
          echo "Running security vulnerability scan..."
          # Add Trivy or similar security scanning here

  # =============================================================================
  # Build Production Images
  # =============================================================================
  build:
    name: Build Production Images
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.inputs.image_tag == ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/api-gateway:${{ needs.validate.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/api-gateway:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/auth/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/auth-service:${{ needs.validate.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/auth-service:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/user/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/user-service:${{ needs.validate.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/user-service:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Matching Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/matching/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/matching-service:${{ needs.validate.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/matching-service:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Messaging Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/messaging/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/messaging-service:${{ needs.validate.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/messaging-service:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Media Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/media/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/media-service:${{ needs.validate.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/media-service:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/web:${{ needs.validate.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/web:prod-latest
          build-args: |
            VITE_API_URL=https://api.flamoral.com
            VITE_ENVIRONMENT=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Deploy to Production AKS
  # =============================================================================
  deploy:
    name: Deploy to Production AKS
    needs: [validate, build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://flamoral.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Create/Update Kubernetes namespace
        run: |
          kubectl create namespace flamoral-prod --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry acr-secret \
            --docker-server=${{ env.ACR_LOGIN_SERVER }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --namespace=flamoral-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create TLS secret from Key Vault
        run: |
          # Get certificates from Key Vault
          az keyvault secret download \
            --vault-name flamoral-prod-kv \
            --name tls-cert \
            --file tls.crt

          az keyvault secret download \
            --vault-name flamoral-prod-kv \
            --name tls-key \
            --file tls.key

          kubectl create secret tls flamoral-tls \
            --cert=tls.crt \
            --key=tls.key \
            --namespace=flamoral-prod \
            --dry-run=client -o yaml | kubectl apply -f -

          rm -f tls.crt tls.key

      - name: Deploy services using Helm (Blue-Green)
        run: |
          DEPLOY_TAG=${{ needs.validate.outputs.image_tag }}

          helm upgrade --install flamoral-prod ./k8s/helm/flamoral \
            --namespace flamoral-prod \
            --set global.image.tag=${DEPLOY_TAG} \
            --set global.image.registry=${{ env.ACR_LOGIN_SERVER }} \
            --set global.environment=production \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set ingress.hosts[0].host=${{ env.DOMAIN }} \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            --set ingress.hosts[1].host=www.${{ env.DOMAIN }} \
            --set ingress.hosts[1].paths[0].path=/ \
            --set ingress.hosts[1].paths[0].pathType=Prefix \
            --set ingress.hosts[2].host=api.${{ env.DOMAIN }} \
            --set ingress.hosts[2].paths[0].path=/ \
            --set ingress.hosts[2].paths[0].pathType=Prefix \
            --set ingress.tls[0].secretName=flamoral-tls \
            --set ingress.tls[0].hosts[0]=${{ env.DOMAIN }} \
            --set ingress.tls[0].hosts[1]=www.${{ env.DOMAIN }} \
            --set ingress.tls[0].hosts[2]=api.${{ env.DOMAIN }} \
            --set ingress.annotations."cert-manager\.io/cluster-issuer"=letsencrypt-prod \
            --set ingress.annotations."nginx\.ingress\.kubernetes\.io/ssl-redirect"="true" \
            --values ./k8s/helm/flamoral/values-prod.yaml \
            --wait \
            --timeout 15m

      - name: Verify deployment
        run: |
          echo "Checking deployment status..."
          kubectl rollout status deployment -n flamoral-prod --timeout=10m
          echo ""
          echo "Pod status:"
          kubectl get pods -n flamoral-prod
          echo ""
          echo "Services:"
          kubectl get svc -n flamoral-prod
          echo ""
          echo "Ingress:"
          kubectl get ingress -n flamoral-prod

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."

          # Test HTTPS endpoints
          curl -sS -o /dev/null -w "%{http_code}" https://${{ env.DOMAIN }}/health | grep -q "200" || exit 1
          curl -sS -o /dev/null -w "%{http_code}" https://api.${{ env.DOMAIN }}/health | grep -q "200" || exit 1

          echo "✅ All smoke tests passed!"

  # =============================================================================
  # Post-deployment Verification
  # =============================================================================
  verify:
    name: Post-deployment Verification
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run synthetic monitoring tests
        run: |
          echo "Running synthetic monitoring tests..."

          # Test main pages
          curl -sS -o /dev/null -w "%{http_code}" https://flamoral.com | grep -q "200"
          curl -sS -o /dev/null -w "%{http_code}" https://www.flamoral.com | grep -q "200"
          curl -sS -o /dev/null -w "%{http_code}" https://api.flamoral.com/health | grep -q "200"

          # Test critical API endpoints
          curl -sS -o /dev/null -w "%{http_code}" https://api.flamoral.com/api/v1/status | grep -q "200"

          echo "✅ Synthetic monitoring tests passed!"

      - name: Check SSL certificates
        run: |
          echo "Checking SSL certificates..."
          echo | openssl s_client -servername flamoral.com -connect flamoral.com:443 2>/dev/null | openssl x509 -noout -dates
          echo "✅ SSL certificates valid!"

  # =============================================================================
  # Rollback on Failure
  # =============================================================================
  rollback:
    name: Rollback on Failure
    needs: [deploy, verify]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Rollback deployment
        run: |
          echo "⚠️ Deployment failed! Rolling back..."
          helm rollback flamoral-prod 0 --namespace flamoral-prod --wait
          echo "✅ Rollback completed!"

  # =============================================================================
  # Notify on completion
  # =============================================================================
  notify:
    name: Send Notification
    needs: [deploy, verify]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send success notification
        if: ${{ needs.verify.result == 'success' }}
        run: |
          echo "✅ Production deployment successful!"
          echo "URL: https://flamoral.com"
          echo "API: https://api.flamoral.com"
          # Add Slack/Teams notification here

      - name: Send failure notification
        if: ${{ needs.deploy.result == 'failure' || needs.verify.result == 'failure' }}
        run: |
          echo "❌ Production deployment failed!"
          echo "Rollback initiated."
          # Add PagerDuty/Slack notification here
