# =============================================================================
# Flamoral Dating Platform - Terraform Infrastructure Pipeline
# =============================================================================
# Manages infrastructure deployment across dev, test, and prod environments
# =============================================================================

name: Terraform Infrastructure

on:
  push:
    branches:
      - main
      - dev
      - test
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: '1.6.0'
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # =============================================================================
  # Determine Environment
  # =============================================================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      tf_dir: ${{ steps.set-env.outputs.tf_dir }}

    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="prod"
          elif [ "${{ github.ref }}" == "refs/heads/test" ]; then
            ENV="test"
          else
            ENV="dev"
          fi

          if [ "$ENV" == "dev" ]; then
            TF_DIR="infrastructure/terraform/environments/dating-dev"
          else
            TF_DIR="infrastructure/terraform/environments/${ENV}"
          fi

          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "tf_dir=${TF_DIR}" >> $GITHUB_OUTPUT

  # =============================================================================
  # Terraform Plan
  # =============================================================================
  plan:
    name: Terraform Plan
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        continue-on-error: true

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        env:
          ARM_USE_OIDC: true

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ needs.setup.outputs.tf_dir }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -out=tfplan \
            -detailed-exitcode \
            -no-color
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        env:
          ARM_USE_OIDC: true
        continue-on-error: true

      - name: Upload Plan
        uses: actions/upload-artifact@v3
        with:
          name: tfplan-${{ needs.setup.outputs.environment }}
          path: ${{ needs.setup.outputs.tf_dir }}/tfplan

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan - ${{ needs.setup.outputs.environment }} 📖

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # =============================================================================
  # Terraform Apply
  # =============================================================================
  apply:
    name: Terraform Apply
    needs: [setup, plan]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/test') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan-${{ needs.setup.outputs.environment }}
          path: ${{ needs.setup.outputs.tf_dir }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        env:
          ARM_USE_OIDC: true

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        env:
          ARM_USE_OIDC: true

      - name: Terraform Outputs
        id: outputs
        run: terraform output -json > outputs.json
        working-directory: ${{ needs.setup.outputs.tf_dir }}

      - name: Upload Outputs
        uses: actions/upload-artifact@v3
        with:
          name: terraform-outputs-${{ needs.setup.outputs.environment }}
          path: ${{ needs.setup.outputs.tf_dir }}/outputs.json

  # =============================================================================
  # Terraform Destroy (Manual Only)
  # =============================================================================
  destroy:
    name: Terraform Destroy
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        env:
          ARM_USE_OIDC: true

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var-file=terraform.tfvars \
            -auto-approve
        working-directory: ${{ needs.setup.outputs.tf_dir }}
        env:
          ARM_USE_OIDC: true
