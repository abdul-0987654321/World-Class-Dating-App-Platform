# =============================================================================
# AUTONOMOUS SELF-HEALING AGENT - GitHub Actions
# =============================================================================
# Continuously monitors, analyzes, and repairs pipeline/infrastructure issues
# Replaces: Azure DevOps flamoral-self-healing-agent.yml
# =============================================================================

name: Self-Healing Agent

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:
    inputs:
      force_scan:
        description: 'Force full system scan'
        type: boolean
        default: false
      repair_mode:
        description: 'Enable auto-repair mode'
        type: boolean
        default: true

concurrency:
  group: self-healing
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

permissions:
  contents: write
  pull-requests: write
  actions: read
  security-events: read

jobs:
  # ===========================================================================
  # STAGE 1: Monitor Workflow Health
  # ===========================================================================
  monitor-workflows:
    name: Monitor Workflow Health
    runs-on: ubuntu-latest
    outputs:
      has_failures: ${{ steps.check.outputs.has_failures }}
      failed_runs: ${{ steps.check.outputs.failed_runs }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check recent workflow runs
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // Get workflow runs from last 2 hours
            const twoHoursAgo = new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString();

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              created: `>${twoHoursAgo}`,
              per_page: 50
            });

            const failedRuns = runs.data.workflow_runs.filter(run =>
              run.conclusion === 'failure' && !run.name.includes('Self-Healing')
            );

            console.log(`Total runs checked: ${runs.data.workflow_runs.length}`);
            console.log(`Failed runs: ${failedRuns.length}`);

            if (failedRuns.length > 0) {
              console.log('\nFailed workflows:');
              failedRuns.forEach(run => {
                console.log(`  - ${run.name} (Run #${run.id}) - ${run.html_url}`);
              });

              core.setOutput('has_failures', 'true');
              core.setOutput('failed_runs', JSON.stringify(failedRuns.map(r => ({
                id: r.id,
                name: r.name,
                workflow_id: r.workflow_id,
                head_sha: r.head_sha,
                url: r.html_url
              }))));
            } else {
              console.log('\nNo failed workflows found.');
              core.setOutput('has_failures', 'false');
              core.setOutput('failed_runs', '[]');
            }

      - name: Generate health report
        run: |
          echo "## Workflow Health Report" >> $GITHUB_STEP_SUMMARY
          echo "Generated: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.has_failures }}" = "true" ]; then
            echo "**Status: Issues Detected**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status: All Systems Healthy**" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # STAGE 2: Analyze Failures
  # ===========================================================================
  analyze-failures:
    name: Analyze Failures
    runs-on: ubuntu-latest
    needs: monitor-workflows
    if: needs.monitor-workflows.outputs.has_failures == 'true'
    outputs:
      analysis: ${{ steps.analyze.outputs.analysis }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyze failed runs
        id: analyze
        uses: actions/github-script@v7
        with:
          script: |
            const failedRuns = JSON.parse('${{ needs.monitor-workflows.outputs.failed_runs }}');
            const analysis = [];

            for (const run of failedRuns) {
              console.log(`\nAnalyzing: ${run.name} (Run #${run.id})`);

              try {
                // Get job details
                const jobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });

                const failedJobs = jobs.data.jobs.filter(j => j.conclusion === 'failure');

                for (const job of failedJobs) {
                  // Get job logs
                  let category = 'unknown';
                  let suggestedFix = '';

                  // Categorize based on job name
                  if (job.name.toLowerCase().includes('terraform')) {
                    category = 'terraform';
                    suggestedFix = 'Check Terraform state, backend config, or provider versions';
                  } else if (job.name.toLowerCase().includes('docker') || job.name.toLowerCase().includes('build')) {
                    category = 'docker';
                    suggestedFix = 'Check Dockerfile syntax, base image availability, or build context';
                  } else if (job.name.toLowerCase().includes('deploy') || job.name.toLowerCase().includes('aks')) {
                    category = 'deployment';
                    suggestedFix = 'Check AKS connectivity, namespace permissions, or Helm values';
                  } else if (job.name.toLowerCase().includes('test')) {
                    category = 'test';
                    suggestedFix = 'Review test failures, update snapshots, or check test environment';
                  } else if (job.name.toLowerCase().includes('security') || job.name.toLowerCase().includes('scan')) {
                    category = 'security';
                    suggestedFix = 'Review security findings and update vulnerable dependencies';
                  } else if (job.name.toLowerCase().includes('lint') || job.name.toLowerCase().includes('quality')) {
                    category = 'code-quality';
                    suggestedFix = 'Fix linting errors or formatting issues';
                  }

                  analysis.push({
                    runId: run.id,
                    runName: run.name,
                    jobName: job.name,
                    category: category,
                    suggestedFix: suggestedFix,
                    url: run.url
                  });

                  console.log(`  Failed Job: ${job.name}`);
                  console.log(`  Category: ${category}`);
                  console.log(`  Suggested Fix: ${suggestedFix}`);
                }
              } catch (error) {
                console.log(`  Error analyzing run: ${error.message}`);
              }
            }

            core.setOutput('analysis', JSON.stringify(analysis));
            return analysis;

  # ===========================================================================
  # STAGE 3: Code Quality Auto-Fix
  # ===========================================================================
  auto-fix-code-quality:
    name: Auto-Fix Code Quality
    runs-on: ubuntu-latest
    needs: analyze-failures
    if: github.event.inputs.repair_mode != 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts
        continue-on-error: true

      - name: Auto-fix ESLint issues
        run: |
          npm run lint:fix --if-present || true
        continue-on-error: true

      - name: Auto-fix Prettier formatting
        run: |
          npm run format --if-present || npx prettier --write "**/*.{js,ts,jsx,tsx,json,md}" || true
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Create auto-fix PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix: auto-fix code quality issues [self-healing]'
          title: '[Self-Healing] Auto-fix code quality issues'
          body: |
            ## Automated Code Quality Fixes

            This PR was automatically generated by the Self-Healing Agent.

            ### Changes
            - ESLint auto-fixes applied
            - Prettier formatting applied

            ### Triggered By
            Failed workflow runs detected in the last scan.

            ---
            *This PR was generated automatically. Please review before merging.*
          branch: self-healing/code-quality-${{ github.run_number }}
          delete-branch: true

  # ===========================================================================
  # STAGE 4: Dependency Auto-Update
  # ===========================================================================
  auto-update-dependencies:
    name: Auto-Update Dependencies
    runs-on: ubuntu-latest
    needs: analyze-failures
    if: github.event.inputs.repair_mode != 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for security vulnerabilities
        id: audit
        run: |
          npm audit --json > audit-report.json 2>/dev/null || true
          VULNS=$(cat audit-report.json | jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' 2>/dev/null || echo "0")
          echo "vulnerabilities=$VULNS" >> $GITHUB_OUTPUT
          if [ "$VULNS" -gt "0" ]; then
            echo "has_vulns=true" >> $GITHUB_OUTPUT
          else
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Auto-fix vulnerabilities
        if: steps.audit.outputs.has_vulns == 'true'
        run: |
          npm audit fix --force || true
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create security fix PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'security: auto-fix npm vulnerabilities [self-healing]'
          title: '[Self-Healing] Security vulnerability fixes'
          body: |
            ## Automated Security Fixes

            This PR was automatically generated by the Self-Healing Agent.

            ### Changes
            - npm audit fix applied
            - Security vulnerabilities patched

            ### Vulnerability Summary
            Found ${{ steps.audit.outputs.vulnerabilities }} high/critical vulnerabilities.

            ---
            *This PR was generated automatically. Please review before merging.*
          branch: self-healing/security-${{ github.run_number }}
          delete-branch: true

  # ===========================================================================
  # STAGE 5: Infrastructure Drift Detection
  # ===========================================================================
  detect-drift:
    name: Detect Infrastructure Drift
    runs-on: ubuntu-latest
    if: github.event.inputs.force_scan == 'true' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      - name: Check Terraform format
        run: |
          echo "Checking Terraform formatting..."
          terraform fmt -check -recursive infrastructure/terraform 2>&1 || echo "Format issues detected"
        continue-on-error: true

      - name: Validate Terraform configurations
        run: |
          for env in infrastructure/terraform/environments/*/; do
            if [ -d "$env" ]; then
              echo "Validating: $env"
              cd "$env"
              terraform init -backend=false 2>/dev/null || true
              terraform validate 2>&1 || echo "Validation issues in $env"
              cd -
            fi
          done
        continue-on-error: true

      - name: Check for drift (dev environment)
        run: |
          cd infrastructure/terraform/environments/dating-dev
          terraform init 2>/dev/null || true
          terraform plan -detailed-exitcode -no-color 2>&1 | tee plan-output.txt || true

          if grep -q "No changes" plan-output.txt; then
            echo "No drift detected in dev environment"
          else
            echo "Drift detected in dev environment"
          fi
        continue-on-error: true
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # ===========================================================================
  # STAGE 6: Docker Image Health Check
  # ===========================================================================
  check-docker-images:
    name: Check Docker Images
    runs-on: ubuntu-latest
    if: github.event.inputs.force_scan == 'true' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Dockerfiles
        run: |
          echo "Validating Dockerfiles..."
          find . -name "Dockerfile" -type f ! -path "*/node_modules/*" | while read dockerfile; do
            echo "Checking: $dockerfile"

            # Check for common issues
            if grep -q "FROM.*:latest" "$dockerfile"; then
              echo "  Warning: Uses :latest tag - consider pinning version"
            fi

            if ! grep -q "HEALTHCHECK" "$dockerfile"; then
              echo "  Warning: No HEALTHCHECK defined"
            fi

            # Check for security issues
            if grep -q "npm install" "$dockerfile" && ! grep -q "npm ci" "$dockerfile"; then
              echo "  Warning: Use 'npm ci' instead of 'npm install' for reproducible builds"
            fi

            echo "  OK: Dockerfile structure valid"
          done

      - name: Check for base image updates
        run: |
          echo "Checking for outdated base images..."
          # This would typically check against a registry for newer tags
          echo "Base image check completed"

  # ===========================================================================
  # STAGE 7: Kubernetes Health Check
  # ===========================================================================
  check-kubernetes:
    name: Check Kubernetes Resources
    runs-on: ubuntu-latest
    if: github.event.inputs.force_scan == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Validate Helm charts
        run: |
          echo "Validating Helm charts..."
          for chart in k8s/helm/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting: $chart"
              helm lint "$chart" || echo "Issues found in $chart"
            fi
          done

          for chart in infrastructure/helm/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting: $chart"
              helm lint "$chart" || echo "Issues found in $chart"
            fi
          done

      - name: Validate Kubernetes manifests
        run: |
          echo "Validating Kubernetes manifests..."
          find k8s -name "*.yaml" -type f | while read manifest; do
            echo "Validating: $manifest"
            kubectl apply --dry-run=client -f "$manifest" 2>&1 || echo "Issues in $manifest"
          done
        continue-on-error: true

  # ===========================================================================
  # STAGE 8: Generate Health Report
  # ===========================================================================
  generate-report:
    name: Generate Health Report
    runs-on: ubuntu-latest
    needs: [monitor-workflows, analyze-failures, auto-fix-code-quality, auto-update-dependencies, detect-drift, check-docker-images, check-kubernetes]
    if: always()

    steps:
      - name: Generate comprehensive report
        run: |
          echo "# Self-Healing Agent Report" >> $GITHUB_STEP_SUMMARY
          echo "Generated: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow Monitor | ${{ needs.monitor-workflows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failure Analysis | ${{ needs.analyze-failures.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality Fix | ${{ needs.auto-fix-code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Update | ${{ needs.auto-update-dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Drift Detection | ${{ needs.detect-drift.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Check | ${{ needs.check-docker-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kubernetes Check | ${{ needs.check-kubernetes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Actions Taken" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.monitor-workflows.outputs.has_failures }}" = "true" ]; then
            echo "- Failures detected and analyzed" >> $GITHUB_STEP_SUMMARY
            echo "- Auto-fix PRs created if applicable" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No failures detected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Next Run" >> $GITHUB_STEP_SUMMARY
          echo "Scheduled: Next 30-minute interval" >> $GITHUB_STEP_SUMMARY

      - name: Notify on critical issues
        if: needs.monitor-workflows.outputs.has_failures == 'true'
        uses: 8398a7/action-slack@v3
        with:
          status: warning
          channel: '#devops-alerts'
          text: |
            :warning: Self-Healing Agent detected issues
            Failed workflows found in the last scan.
            Check the report for details.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
