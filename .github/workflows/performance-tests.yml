name: Performance Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # Load Testing with k6
  # ===========================================
  load-tests:
    name: Load Tests (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run API Load Tests
        run: |
          k6 run --out json=results.json backend/tests/performance/k6/api-load-test.js
        env:
          K6_BASE_URL: ${{ secrets.STAGING_API_URL }}
          K6_VUS: 50
          K6_DURATION: '5m'

      - name: Run Stress Tests
        run: |
          k6 run --out json=stress-results.json backend/tests/performance/k6/stress-test.js
        env:
          K6_BASE_URL: ${{ secrets.STAGING_API_URL }}

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            results.json
            stress-results.json
          retention-days: 30

      - name: Check Performance Thresholds
        run: |
          # Parse results and check against thresholds
          echo "Checking performance thresholds..."
          # p95 response time < 500ms
          # Error rate < 1%
          # Throughput > 100 rps

  # ===========================================
  # Spike Testing
  # ===========================================
  spike-tests:
    name: Spike Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: load-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run Spike Tests
        run: |
          k6 run --out json=spike-results.json backend/tests/performance/k6/spike-test.js
        env:
          K6_BASE_URL: ${{ secrets.STAGING_API_URL }}

      - name: Upload spike test results
        uses: actions/upload-artifact@v4
        with:
          name: spike-test-results
          path: spike-results.json
          retention-days: 30

  # ===========================================
  # Frontend Performance (Lighthouse)
  # ===========================================
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ secrets.STAGING_URL }}
            ${{ secrets.STAGING_URL }}/login
            ${{ secrets.STAGING_URL }}/discover
            ${{ secrets.STAGING_URL }}/messages
            ${{ secrets.STAGING_URL }}/profile
          budgetPath: ./apps/web-app/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Check Lighthouse thresholds
        run: |
          echo "Performance thresholds:"
          echo "- Performance: >= 90"
          echo "- Accessibility: >= 95"
          echo "- Best Practices: >= 90"
          echo "- SEO: >= 90"

  # ===========================================
  # Database Performance Tests
  # ===========================================
  db-performance:
    name: Database Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dating_perf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run database migrations
        run: npm run db:migrate
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/dating_perf_test

      - name: Seed test data
        run: npm run db:seed:perf
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/dating_perf_test

      - name: Run query performance tests
        run: npm run test:db:performance
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/dating_perf_test

      - name: Analyze query plans
        run: npm run db:analyze
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/dating_perf_test

  # ===========================================
  # Memory & CPU Profiling
  # ===========================================
  profiling:
    name: Memory & CPU Profiling
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run memory profiling tests
        run: |
          node --expose-gc --max-old-space-size=512 backend/tests/performance/memory-test.js
        env:
          NODE_ENV: test

      - name: Run CPU profiling
        run: |
          node --prof backend/tests/performance/cpu-test.js
          node --prof-process isolate-*.log > cpu-profile.txt
        env:
          NODE_ENV: test

      - name: Upload profiling results
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results
          path: |
            cpu-profile.txt
            heap-*.heapsnapshot
          retention-days: 7

  # ===========================================
  # Summary Report
  # ===========================================
  performance-report:
    name: Generate Performance Report
    runs-on: ubuntu-latest
    needs: [load-tests, spike-tests, lighthouse, db-performance, profiling]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: performance-artifacts

      - name: Generate consolidated report
        run: |
          echo "# Performance Test Results" > performance-report.md
          echo "Date: $(date)" >> performance-report.md
          echo "" >> performance-report.md
          echo "## Summary" >> performance-report.md
          echo "- Load Tests: ${{ needs.load-tests.result }}" >> performance-report.md
          echo "- Spike Tests: ${{ needs.spike-tests.result }}" >> performance-report.md
          echo "- Lighthouse: ${{ needs.lighthouse.result }}" >> performance-report.md
          echo "- Database: ${{ needs.db-performance.result }}" >> performance-report.md
          echo "- Profiling: ${{ needs.profiling.result }}" >> performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.md
          retention-days: 90

      - name: Notify on Slack
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          channel: '#performance-alerts'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
