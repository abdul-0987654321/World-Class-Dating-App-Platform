name: Test Azure Login

on:
  workflow_dispatch:

jobs:
  test-login:
    name: Test Azure Login
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Test ACR Access
        run: |
          echo "Testing ACR login..."
          az acr login --name flamoraldevacr
          echo "ACR login successful!"
          az acr list -o table
