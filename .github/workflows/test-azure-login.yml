name: Test Azure Login

on:
  workflow_dispatch:

jobs:
  test-login:
    name: Test Azure Login
    runs-on: ubuntu-latest

    steps:
      - name: Simple Test
        run: echo "Hello World"

      - name: Check Secrets Available
        run: |
          echo "Checking if secrets exist..."
          if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "AZURE_CREDENTIALS is set"
          else
            echo "AZURE_CREDENTIALS is NOT set"
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Test ACR Access
        run: |
          echo "Testing ACR login..."
          az acr login --name flamoraldevacr
          echo "ACR login successful!"
          az acr list -o table
