name: E2E Tests

# 🔒 LOCKDOWN: Original triggers disabled
# on:
#   workflow_dispatch:
#     inputs:
#       environment:
#         description: 'Environment to test'
#         required: true
#         default: 'staging'
#         type: choice
#         options:
#           - dev
#           - staging
#           - production
#   deployment_status:
#   schedule:
#     - cron: '0 6 * * *'  # Daily at 6 AM UTC

# 🔒 LOCKDOWN: Manual trigger only with unlock code required
on:
  workflow_dispatch:
    inputs:
      unlock_code:
        description: 'Enter unlock code to run'
        required: true
        type: string

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # Web E2E Tests - Playwright (Critical Paths)
  # ===========================================
  e2e-web:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web-app

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: ./apps/web-app

      - name: Run Playwright E2E tests
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3
        working-directory: ./apps/web-app
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: apps/web-app/playwright-report/
          retention-days: 30

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: apps/web-app/test-results/
          retention-days: 7

  # ===========================================
  # Visual Regression Tests
  # ===========================================
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: e2e-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web-app

      - name: Install Playwright
        run: npx playwright install chromium
        working-directory: ./apps/web-app

      - name: Run Visual Regression Tests
        run: npx playwright test --project=visual
        working-directory: ./apps/web-app
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-results
          path: apps/web-app/tests/visual/__snapshots__/
          retention-days: 30

  # ===========================================
  # Accessibility Tests - WCAG 2.1 AA
  # ===========================================
  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web-app

      - name: Install Playwright
        run: npx playwright install chromium
        working-directory: ./apps/web-app

      - name: Run Accessibility Tests (axe-core)
        run: npx playwright test --project=accessibility
        working-directory: ./apps/web-app
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: apps/web-app/accessibility-report/
          retention-days: 30

  # ===========================================
  # Mobile E2E Tests - Detox
  # ===========================================
  e2e-mobile-ios:
    name: Mobile E2E Tests (iOS)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/mobile-app

      - name: Install CocoaPods
        run: |
          cd ios && pod install
        working-directory: ./apps/mobile-app

      - name: Build iOS app for testing
        run: npx detox build --configuration ios.sim.release
        working-directory: ./apps/mobile-app

      - name: Run Detox tests (iOS)
        run: npx detox test --configuration ios.sim.release --headless --record-logs all
        working-directory: ./apps/mobile-app
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload iOS test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detox-ios-artifacts
          path: apps/mobile-app/artifacts/
          retention-days: 7

  e2e-mobile-android:
    name: Mobile E2E Tests (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/mobile-app

      - name: Setup Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            cd apps/mobile-app
            npx detox build --configuration android.emu.release
            npx detox test --configuration android.emu.release --headless --record-logs all
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload Android test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detox-android-artifacts
          path: apps/mobile-app/artifacts/
          retention-days: 7

  # ===========================================
  # API Contract Tests
  # ===========================================
  contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      pact-broker:
        image: pactfoundation/pact-broker:latest
        ports:
          - 9292:9292
        env:
          PACT_BROKER_DATABASE_ADAPTER: sqlite

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run Consumer Contract Tests
        run: npm run test:contract:consumer
        working-directory: ./backend

      - name: Publish Pacts
        run: npm run pact:publish
        working-directory: ./backend
        env:
          PACT_BROKER_BASE_URL: http://localhost:9292

      - name: Run Provider Verification
        run: npm run test:contract:provider
        working-directory: ./backend
        env:
          PACT_BROKER_BASE_URL: http://localhost:9292

  # ===========================================
  # Summary & Notification
  # ===========================================
  e2e-summary:
    name: E2E Tests Summary
    runs-on: ubuntu-latest
    needs: [e2e-web, visual-regression, accessibility, contract-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "E2E Test Results Summary"
          echo "========================"
          echo "Web E2E: ${{ needs.e2e-web.result }}"
          echo "Visual Regression: ${{ needs.visual-regression.result }}"
          echo "Accessibility: ${{ needs.accessibility.result }}"
          echo "Contract Tests: ${{ needs.contract-tests.result }}"

      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          channel: '#e2e-test-results'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
