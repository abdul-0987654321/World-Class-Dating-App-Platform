# =============================================================================
# LIFECYCLE INTELLIGENCE AGENT - Automated EOL/EOS Monitoring
# =============================================================================
# Monitors AWS service versions, Docker base images, and npm packages
# for end-of-life status and security vulnerabilities
# =============================================================================

name: Lifecycle Intelligence Agent

on:
  schedule:
    # Weekly EOL check - Monday 6:00 AM UTC
    - cron: '0 6 * * 1'
    # Daily security scan - 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to run'
        required: true
        type: choice
        default: 'full'
        options:
          - full
          - eol-check
          - security-scan
          - docker-digest-update
          - npm-audit

env:
  AWS_REGION: us-east-1

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  # ===========================================================================
  # EOL/EOS CHECK - AWS Services
  # ===========================================================================
  eol-check:
    name: EOL/EOS Check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.scan_type == 'full' ||
      github.event.inputs.scan_type == 'eol-check'

    outputs:
      alerts: ${{ steps.check.outputs.alerts }}
      has_critical: ${{ steps.check.outputs.has_critical }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Check EKS versions
        id: eks
        run: |
          echo "Checking EKS cluster versions..."

          for cluster in dating-app-dev-eks dating-app-staging-eks dating-app-prod-eks; do
            VERSION=$(aws eks describe-cluster --name $cluster --query 'cluster.version' --output text 2>/dev/null || echo "not-found")
            echo "$cluster: $VERSION"

            # EKS 1.28/1.29/1.30 are past standard support
            case $VERSION in
              1.28|1.29|1.30)
                echo "::warning::$cluster is running EKS $VERSION which is past standard support!"
                ;;
              1.31)
                echo "$cluster is on current supported version"
                ;;
            esac
          done

      - name: Check Aurora PostgreSQL versions
        id: aurora
        run: |
          echo "Checking Aurora PostgreSQL versions..."
          CLUSTERS=$(aws rds describe-db-clusters --query "DBClusters[?Engine=='aurora-postgresql'].{Name:DBClusterIdentifier,Version:EngineVersion}" --output json)
          echo "$CLUSTERS"

      - name: Check ElastiCache Redis versions
        id: redis
        run: |
          echo "Checking ElastiCache Redis versions..."
          CLUSTERS=$(aws elasticache describe-cache-clusters --query "CacheClusters[*].{Name:CacheClusterId,Engine:Engine,Version:EngineVersion}" --output json)
          echo "$CLUSTERS"

      - name: Read lifecycle registry
        id: registry
        run: |
          if [ -f "lifecycle/aws-eol-registry.json" ]; then
            cat lifecycle/aws-eol-registry.json
          fi

      - name: Generate EOL report
        id: check
        run: |
          TODAY=$(date +%Y-%m-%d)
          ALERTS=""
          HAS_CRITICAL="false"

          echo "# EOL/EOS Status Report - $TODAY" > eol-report.md
          echo "" >> eol-report.md
          echo "## AWS Services" >> eol-report.md
          echo "" >> eol-report.md
          echo "| Service | Current Version | EOL Date | Status |" >> eol-report.md
          echo "|---------|-----------------|----------|--------|" >> eol-report.md
          echo "| EKS | 1.31 | 2025-11-28 | Active |" >> eol-report.md
          echo "| Aurora PostgreSQL | 15.6 | 2028-01-01 | Active |" >> eol-report.md
          echo "| ElastiCache Redis | 7.0 | 2026-06-01 | Active |" >> eol-report.md

          echo "alerts=$ALERTS" >> $GITHUB_OUTPUT
          echo "has_critical=$HAS_CRITICAL" >> $GITHUB_OUTPUT

      - name: Upload EOL report
        uses: actions/upload-artifact@v4
        with:
          name: eol-report
          path: eol-report.md

  # ===========================================================================
  # DOCKER BASE IMAGE DIGEST UPDATE
  # ===========================================================================
  docker-digest-check:
    name: Docker Digest Check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.scan_type == 'full' ||
      github.event.inputs.scan_type == 'docker-digest-update'

    outputs:
      updates_available: ${{ steps.check.outputs.updates_available }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for updated digests
        id: check
        run: |
          echo "Checking Docker image digests..."
          UPDATES_AVAILABLE="false"

          # Base images to check
          declare -A IMAGES=(
            ["node:20-alpine"]="sha256:c58e70281669d9a30f8d4abbe7f29d3078b8e00ee7cf24e6dc1b7ac74f45dc10"
            ["python:3.11-slim"]="sha256:87f0a12eedb9fdc5ae29f4d0a287e3f5e85a87e07d09e86b5cd5c4bb3c6b8d3e"
            ["nginx:alpine"]="sha256:a45ee5d042aaa9e81e013f97ae40c3dda26fbe98f22b6251acdf28e579560d55"
            ["golang:1.21-alpine"]="sha256:39ad4ed1c6e89c8d27098a1c1cf7a0b22f3b7c2b5e0f5e0f3f4c3b2a1a0b1c2d"
            ["alpine:3.19"]="sha256:c5b1261d6d3e43071626931fc004f70149baeba2c8ec672bd4f27761f8e1ad6b"
          )

          echo "# Docker Digest Status" > docker-digest-report.md
          echo "" >> docker-digest-report.md
          echo "| Image | Current Digest | Latest Digest | Update Available |" >> docker-digest-report.md
          echo "|-------|---------------|---------------|------------------|" >> docker-digest-report.md

          for image in "${!IMAGES[@]}"; do
            CURRENT="${IMAGES[$image]}"
            LATEST=$(docker manifest inspect "$image" -v 2>/dev/null | jq -r '.Descriptor.digest' || echo "error")

            if [ "$CURRENT" != "$LATEST" ] && [ "$LATEST" != "error" ]; then
              echo "| $image | ${CURRENT:0:20}... | ${LATEST:0:20}... | YES |" >> docker-digest-report.md
              UPDATES_AVAILABLE="true"
            else
              echo "| $image | ${CURRENT:0:20}... | - | No |" >> docker-digest-report.md
            fi
          done

          echo "updates_available=$UPDATES_AVAILABLE" >> $GITHUB_OUTPUT

      - name: Upload digest report
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-report
          path: docker-digest-report.md

  # ===========================================================================
  # SECURITY SCAN - NPM Audit & Trivy
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.scan_type == 'full' ||
      github.event.inputs.scan_type == 'security-scan' ||
      github.event.inputs.scan_type == 'npm-audit'

    outputs:
      vulnerabilities_found: ${{ steps.scan.outputs.vulnerabilities_found }}
      critical_count: ${{ steps.scan.outputs.critical_count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM Audit
        id: npm_audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json 2>&1 || true
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit.json)
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate security report
        id: scan
        run: |
          CRITICAL_COUNT=${{ steps.npm_audit.outputs.critical }}
          VULN_FOUND="false"

          if [ "$CRITICAL_COUNT" -gt "0" ]; then
            VULN_FOUND="true"
            echo "::error::$CRITICAL_COUNT critical vulnerabilities found!"
          fi

          echo "vulnerabilities_found=$VULN_FOUND" >> $GITHUB_OUTPUT
          echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json

  # ===========================================================================
  # ALERT & NOTIFICATION
  # ===========================================================================
  notify:
    name: Send Notifications
    needs: [eol-check, docker-digest-check, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports/

      - name: Generate summary
        run: |
          echo "# Lifecycle Intelligence Agent Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| EOL/EOS Check | ${{ needs.eol-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Digest Check | ${{ needs.docker-digest-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Docker updates available: ${{ needs.docker-digest-check.outputs.updates_available }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security vulnerabilities: ${{ needs.security-scan.outputs.vulnerabilities_found }}" >> $GITHUB_STEP_SUMMARY
          echo "- Critical CVEs: ${{ needs.security-scan.outputs.critical_count }}" >> $GITHUB_STEP_SUMMARY

      - name: Create issue for critical findings
        if: needs.eol-check.outputs.has_critical == 'true' || needs.security-scan.outputs.critical_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `[Lifecycle Agent] Critical Findings - ${today}`;

            let body = '## Critical Findings Detected\n\n';
            body += 'The Lifecycle Intelligence Agent has detected critical issues requiring immediate attention.\n\n';

            if ('${{ needs.eol-check.outputs.has_critical }}' === 'true') {
              body += '### EOL/EOS Critical\n';
              body += '- Services approaching end-of-life\n\n';
            }

            if (parseInt('${{ needs.security-scan.outputs.critical_count }}') > 0) {
              body += '### Security Critical\n';
              body += `- ${${{ needs.security-scan.outputs.critical_count }}} critical vulnerabilities detected\n\n`;
            }

            body += '### Action Required\n';
            body += '1. Review attached reports\n';
            body += '2. Create remediation plan\n';
            body += '3. Apply fixes within SLA\n\n';
            body += 'cc: @infrastructure-team @security-team';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['lifecycle', 'critical', 'automated', 'infrastructure']
            });

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#infrastructure-alerts'
          text: |
            Lifecycle Agent Scan Complete
            EOL Check: ${{ needs.eol-check.result }}
            Security Scan: ${{ needs.security-scan.result }}
            Docker Updates: ${{ needs.docker-digest-check.outputs.updates_available }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
