name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME_STAGING }}
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP_STAGING }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker images
        run: |
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

          services=("user-service" "matching-service" "messaging-service" "media-service" "payment-service" "notification-service" "moderation-service" "analytics-service" "api-gateway")

          for service in "${services[@]}"; do
            docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flamoral/$service:${{ github.sha }} \
              -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flamoral/$service:latest \
              ./backend/services/$service

            docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flamoral/$service:${{ github.sha }}
            docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flamoral/$service:latest
          done

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}

      - name: Deploy to AKS
        run: |
          kubectl apply -f infrastructure/kubernetes/base/
          kubectl apply -f infrastructure/kubernetes/services/

          kubectl set image deployment/user-service user-service=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flamoral/user-service:${{ github.sha }} -n flamoral
          kubectl set image deployment/matching-service matching-service=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flamoral/matching-service:${{ github.sha }} -n flamoral
          kubectl set image deployment/messaging-service messaging-service=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flamoral/messaging-service:${{ github.sha }} -n flamoral
          kubectl set image deployment/media-service media-service=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flamoral/media-service:${{ github.sha }} -n flamoral
          kubectl set image deployment/payment-service payment-service=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flamoral/payment-service:${{ github.sha }} -n flamoral
          kubectl set image deployment/api-gateway api-gateway=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flamoral/api-gateway:${{ github.sha }} -n flamoral

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/user-service -n flamoral
          kubectl rollout status deployment/matching-service -n flamoral
          kubectl rollout status deployment/messaging-service -n flamoral
          kubectl rollout status deployment/api-gateway -n flamoral
