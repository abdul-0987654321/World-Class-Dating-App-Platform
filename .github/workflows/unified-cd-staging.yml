# =============================================================================
# UNIFIED CD PIPELINE - STAGING ENVIRONMENT
# =============================================================================
# Continuous deployment to staging environment with full testing
# Triggers: Push to staging branch or manual promotion from dev
# =============================================================================

name: CD - Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest from develop)'
        type: string
        required: false

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  TERRAFORM_VERSION: '1.6.0'
  ENVIRONMENT: staging
  AZURE_RESOURCE_GROUP: flamoral-staging-rg
  AKS_CLUSTER_NAME: flamoral-staging-aks
  ACR_NAME: flamoralstagingacr
  HELM_RELEASE_NAME: flamoral-staging

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # STAGE 1: Determine Image Tag
  # ===========================================================================
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # STAGE 2: Build and Push Images to ACR
  # ===========================================================================
  build-push-acr:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      fail-fast: true
      matrix:
        service:
          - name: api-gateway
            path: backend/services/api-gateway
          - name: user-service
            path: backend/services/user-service
          - name: auth-service
            path: backend/services/auth-service
          - name: matching-service
            path: backend/services/matching-service
          - name: messaging-service
            path: backend/services/messaging-service
          - name: media-service
            path: backend/services/media-service
          - name: notification-service
            path: backend/services/notification-service
          - name: payment-service
            path: backend/services/payment-service
          - name: analytics-service
            path: backend/services/analytics-service
          - name: moderation-service
            path: backend/services/moderation-service
          - name: realtime-service
            path: backend/services/realtime-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Check if Dockerfile exists
        id: dockerfile
        run: |
          if [ -f "${{ matrix.service.path }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ACR
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/flamoral/${{ matrix.service.name }}:${{ needs.setup.outputs.image_tag }}
            ${{ env.ACR_NAME }}.azurecr.io/flamoral/${{ matrix.service.name }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging
            BUILD_VERSION=${{ needs.setup.outputs.image_tag }}

  # ===========================================================================
  # STAGE 3: Terraform Infrastructure
  # ===========================================================================
  terraform-deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [setup, build-push-acr]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform/environments/test
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -out=tfplan \
            -no-color
        working-directory: infrastructure/terraform/environments/test
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/terraform/environments/test
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # ===========================================================================
  # STAGE 4: Blue-Green Deployment to AKS
  # ===========================================================================
  deploy-aks:
    name: Blue-Green Deploy to AKS
    runs-on: ubuntu-latest
    needs: [setup, terraform-deploy]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Create namespace
        run: |
          kubectl create namespace flamoral-staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Determine active slot
        id: slot
        run: |
          CURRENT_SLOT=$(kubectl get configmap deployment-slot -n flamoral-staging -o jsonpath='{.data.active}' 2>/dev/null || echo "blue")
          if [ "$CURRENT_SLOT" = "blue" ]; then
            echo "deploy_slot=green" >> $GITHUB_OUTPUT
            echo "active_slot=blue" >> $GITHUB_OUTPUT
          else
            echo "deploy_slot=blue" >> $GITHUB_OUTPUT
            echo "active_slot=green" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to inactive slot
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }}-${{ steps.slot.outputs.deploy_slot }} ./k8s/helm/flamoral \
            --namespace flamoral-staging \
            --values ./k8s/helm/flamoral/values-test.yaml \
            --set global.image.tag=${{ needs.setup.outputs.image_tag }} \
            --set global.image.registry=${{ env.ACR_NAME }}.azurecr.io \
            --set global.environment=staging \
            --set global.slot=${{ steps.slot.outputs.deploy_slot }} \
            --wait \
            --timeout 15m

      - name: Run pre-switch validation
        run: |
          # Test the new deployment before switching traffic
          NEW_SLOT_SVC=$(kubectl get svc -n flamoral-staging -l slot=${{ steps.slot.outputs.deploy_slot }} -o name | head -1)
          kubectl port-forward $NEW_SLOT_SVC 8080:80 -n flamoral-staging &
          sleep 5
          curl -sf http://localhost:8080/health || exit 1
          kill %1
        continue-on-error: true

      - name: Switch traffic to new slot
        run: |
          # Update ingress or service selector to point to new slot
          kubectl patch configmap deployment-slot -n flamoral-staging \
            --type merge -p '{"data":{"active":"${{ steps.slot.outputs.deploy_slot }}"}}'

          # Update service selectors
          kubectl patch svc flamoral-api -n flamoral-staging \
            --type=json \
            -p='[{"op": "replace", "path": "/spec/selector/slot", "value": "${{ steps.slot.outputs.deploy_slot }}"}]' || true

      - name: Verify deployment
        run: |
          kubectl rollout status deployment -n flamoral-staging --timeout=5m
          kubectl get pods -n flamoral-staging
          echo "Active slot: ${{ steps.slot.outputs.deploy_slot }}"

  # ===========================================================================
  # STAGE 5: Database Migrations
  # ===========================================================================
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [setup, deploy-aks]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Run migrations
        run: |
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migration-staging-${{ github.run_number }}
            namespace: flamoral-staging
          spec:
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                containers:
                - name: migration
                  image: ${{ env.ACR_NAME }}.azurecr.io/flamoral/user-service:${{ needs.setup.outputs.image_tag }}
                  command: ["npm", "run", "migrate"]
                  envFrom:
                  - secretRef:
                      name: flamoral-db-secrets
                restartPolicy: Never
            backoffLimit: 3
          EOF

      - name: Wait for migration
        run: |
          kubectl wait --for=condition=complete \
            job/db-migration-staging-${{ github.run_number }} \
            -n flamoral-staging --timeout=600s
        continue-on-error: true

  # ===========================================================================
  # STAGE 6: Integration Tests
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [run-migrations]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Run integration tests
        run: npm run test:integration
        working-directory: tests
        env:
          API_BASE_URL: ${{ secrets.STAGING_API_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        continue-on-error: true

      - name: Run E2E tests
        run: |
          npx playwright install chromium
          npm run test:e2e
        working-directory: apps/web-app
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-test-results
          path: |
            tests/results/
            apps/web-app/playwright-report/
          retention-days: 30

  # ===========================================================================
  # STAGE 7: DAST Security Testing
  # ===========================================================================
  dast-scan:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    needs: [integration-tests]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: ${{ secrets.STAGING_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-staging-report
          path: report_html.html
          retention-days: 30

  # ===========================================================================
  # STAGE 8: Performance Tests
  # ===========================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests
        run: |
          k6 run \
            --out json=k6-results.json \
            tests/performance/load-test.js
        env:
          K6_API_BASE_URL: ${{ secrets.STAGING_API_URL }}
        continue-on-error: true

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: k6-results.json
          retention-days: 30

  # ===========================================================================
  # STAGE 9: Create Release Candidate
  # ===========================================================================
  create-rc:
    name: Create Release Candidate
    runs-on: ubuntu-latest
    needs: [integration-tests, dast-scan, performance-tests]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create RC tag
        run: |
          RC_TAG="rc-${{ github.sha }}"
          git tag $RC_TAG
          git push origin $RC_TAG

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: rc-${{ github.sha }}
          name: Release Candidate rc-${{ github.sha }}
          body: |
            ## Release Candidate

            **Commit:** ${{ github.sha }}
            **Staging URL:** ${{ secrets.STAGING_URL }}

            ### Tests Passed
            - Integration Tests: ${{ needs.integration-tests.result }}
            - DAST Security Scan: ${{ needs.dast-scan.result }}
            - Performance Tests: ${{ needs.performance-tests.result }}

            ### Ready for Production
            Use this RC tag to deploy to production.
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # NOTIFICATION
  # ===========================================================================
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [create-rc]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## STAGING Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-push-acr.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.terraform-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AKS Deploy | ${{ needs.deploy-aks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ needs.run-migrations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST Scan | ${{ needs.dast-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Candidate | ${{ needs.create-rc.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ needs.setup.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ secrets.STAGING_URL }}" >> $GITHUB_STEP_SUMMARY

      - name: Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            STAGING Deployment: ${{ job.status }}
            RC Tag: rc-${{ github.sha }}
            URL: ${{ secrets.STAGING_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
