# =============================================================================
# Flamoral Dating Platform - Test Environment CI/CD Pipeline
# =============================================================================
# Triggers: Push to 'test' branch
# Environment: Test (Private AKS cluster)
# =============================================================================

name: Deploy to Test

on:
  push:
    branches:
      - test
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (leave empty for latest from test branch)'
        required: false
        default: ''

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AKS_CLUSTER_NAME: flamoral-test-aks
  AKS_RESOURCE_GROUP: flamoral-test-rg
  ENVIRONMENT: test

permissions:
  id-token: write
  contents: read

jobs:
  # =============================================================================
  # Run Tests
  # =============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: coverage/

  # =============================================================================
  # Build and Push Docker Images
  # =============================================================================
  build:
    name: Build and Push Images
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Generate image metadata
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "version=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=test-$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/api-gateway:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/api-gateway:test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/auth/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/auth-service:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/auth-service:test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/user/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/user-service:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/user-service:test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Matching Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/matching/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/matching-service:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/matching-service:test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Messaging Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/messaging/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/messaging-service:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/messaging-service:test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Media Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/media/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/media-service:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/media-service:test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/web:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/web:test-latest
          build-args: |
            VITE_API_URL=https://test-api.flamoral.com
            VITE_ENVIRONMENT=test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Deploy to Test AKS
  # =============================================================================
  deploy:
    name: Deploy to Test AKS
    needs: build
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Create/Update Kubernetes namespace
        run: |
          kubectl create namespace flamoral-test --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry acr-secret \
            --docker-server=${{ env.ACR_LOGIN_SERVER }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --namespace=flamoral-test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy services using Helm
        run: |
          helm upgrade --install flamoral-test ./k8s/helm/flamoral \
            --namespace flamoral-test \
            --set global.image.tag=${{ needs.build.outputs.image_tag }} \
            --set global.image.registry=${{ env.ACR_LOGIN_SERVER }} \
            --set global.environment=test \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set ingress.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-internal"="true" \
            --values ./k8s/helm/flamoral/values-test.yaml \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          echo "Checking deployment status..."
          kubectl rollout status deployment -n flamoral-test --timeout=5m
          echo ""
          echo "Pod status:"
          kubectl get pods -n flamoral-test
          echo ""
          echo "Services:"
          kubectl get svc -n flamoral-test

  # =============================================================================
  # Run E2E Tests
  # =============================================================================
  e2e-tests:
    name: Run E2E Tests
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run E2E tests
        run: |
          # Port-forward to access internal services
          kubectl port-forward svc/api-gateway -n flamoral-test 8080:80 &
          sleep 10

          # Run tests
          npm run test:e2e -- --reporter=html
        env:
          TEST_API_URL: http://localhost:8080

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-results
          path: playwright-report/

  # =============================================================================
  # Notify on completion
  # =============================================================================
  notify:
    name: Send Notification
    needs: [build, deploy, e2e-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send success notification
        if: ${{ needs.e2e-tests.result == 'success' }}
        run: |
          echo "✅ Test deployment and E2E tests successful!"
          echo "Image tag: ${{ needs.build.outputs.image_tag }}"

      - name: Send failure notification
        if: ${{ needs.deploy.result == 'failure' || needs.e2e-tests.result == 'failure' }}
        run: |
          echo "❌ Test deployment or E2E tests failed!"
          echo "Check the workflow logs for details."
          exit 1
