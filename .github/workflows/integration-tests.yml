# GitHub Actions Workflow for Integration and E2E Tests
# This is an alternative to Azure DevOps for GitHub repositories
# 🔒 LOCKDOWN MODE: All automatic triggers disabled until further notice
# 🔒 Locked by: Claude Code on 2025-12-17

name: Integration & E2E Tests

# 🔒 LOCKDOWN: Original triggers disabled
# on:
#   push:
#     branches: [ main, develop ]
#   pull_request:
#     branches: [ main, develop ]
#   workflow_dispatch:

# 🔒 LOCKDOWN: Manual trigger only with unlock code required
on:
  workflow_dispatch:
    inputs:
      unlock_code:
        description: 'Enter unlock code to run'
        required: true
        type: string

env:
  NODE_VERSION: '20.x'
  PLAYWRIGHT_VERSION: '1.40.0'

jobs:
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flamoral_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          sleep 5
          echo "Services ready"

      - name: Run integration tests
        run: npm run test:integration:coverage
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_NAME: flamoral_test
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: test_password
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6380
          NODE_ENV: test
          USE_DOCKER_COMPOSE: false

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/integration/coverage-final.json
          flags: integration
          name: integration-coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/coverage/integration/

  backend-e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start test environment
        run: npm run docker:test:up

      - name: Wait for services
        run: |
          echo "Waiting for services to be ready..."
          sleep 30
          docker-compose -f docker-compose.test.yml ps

      - name: Run E2E tests
        run: npm run test:backend:e2e
        env:
          NODE_ENV: test

      - name: Stop test environment
        if: always()
        run: npm run docker:test:down

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-results
          path: backend/coverage/e2e/

  web-app-e2e-tests:
    name: Web App E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start backend services
        run: npm run docker:test:up

      - name: Wait for backend
        run: |
          echo "Waiting for backend services..."
          sleep 30

      - name: Build web app
        run: |
          cd apps/web-app
          npm run build

      - name: Run Playwright tests
        run: npm run test:e2e:${{ matrix.browser }}
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_GATEWAY_URL: http://localhost:4000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/

      - name: Stop services
        if: always()
        run: npm run docker:test:down

  websocket-tests:
    name: WebSocket Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start test environment
        run: npm run docker:test:up

      - name: Wait for services
        run: sleep 20

      - name: Run WebSocket tests
        run: |
          cd backend/tests/integration
          npm test -- --testPathPattern=websocket
        env:
          NODE_ENV: test
          MESSAGING_SERVICE_URL: http://localhost:3004

      - name: Stop test environment
        if: always()
        run: npm run docker:test:down

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-integration-tests, backend-e2e-tests, web-app-e2e-tests, websocket-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "======================================"
          echo "Test Results Summary"
          echo "======================================"
          echo "Backend Integration: ${{ needs.backend-integration-tests.result }}"
          echo "Backend E2E: ${{ needs.backend-e2e-tests.result }}"
          echo "Web App E2E: ${{ needs.web-app-e2e-tests.result }}"
          echo "WebSocket: ${{ needs.websocket-tests.result }}"
          echo "======================================"

      - name: Fail if any test failed
        if: |
          needs.backend-integration-tests.result == 'failure' ||
          needs.backend-e2e-tests.result == 'failure' ||
          needs.web-app-e2e-tests.result == 'failure' ||
          needs.websocket-tests.result == 'failure'
        run: exit 1
