# =============================================================================
# UNIFIED CI PIPELINE - Flamoral Dating Platform
# =============================================================================
# Consolidated continuous integration for all components
# Replaces: ci.yml, backend-ci.yml, frontend-ci.yml, security-tests.yml
# =============================================================================

name: Unified CI Pipeline

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Run all tests including slow ones'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ===========================================================================
  # STAGE 1: Code Quality & Static Analysis
  # ===========================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend }}
      frontend_changed: ${{ steps.changes.outputs.frontend }}
      infra_changed: ${{ steps.changes.outputs.infrastructure }}
      mobile_changed: ${{ steps.changes.outputs.mobile }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'apps/web-app/**'
            infrastructure:
              - 'infrastructure/**'
              - 'terraform/**'
              - 'k8s/**'
            mobile:
              - 'apps/mobile/**'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run ESLint
        run: npm run lint --if-present || true
        continue-on-error: true

      - name: Run Prettier check
        run: npm run format:check --if-present || true
        continue-on-error: true

  # ===========================================================================
  # STAGE 2: Backend Services Testing
  # ===========================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: code-quality
    if: needs.code-quality.outputs.backend_changed == 'true' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - messaging-service
          - matching-service
          - media-service
          - api-gateway
          - payment-service
          - notification-service
          - analytics-service
          - moderation-service
          - realtime-service
          - advertising-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check if service exists
        id: check_service
        run: |
          if [ -d "backend/services/${{ matrix.service }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install shared dependencies
        if: steps.check_service.outputs.exists == 'true'
        working-directory: backend/shared
        run: npm ci || npm install || true
        continue-on-error: true

      - name: Install service dependencies
        if: steps.check_service.outputs.exists == 'true'
        working-directory: backend/services/${{ matrix.service }}
        run: npm ci || npm install

      - name: Run TypeScript check
        if: steps.check_service.outputs.exists == 'true'
        working-directory: backend/services/${{ matrix.service }}
        run: npx tsc --noEmit || true
        continue-on-error: true

      - name: Run unit tests
        if: steps.check_service.outputs.exists == 'true'
        working-directory: backend/services/${{ matrix.service }}
        run: npm test -- --coverage --ci || true
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_key_for_ci_only

      - name: Upload coverage
        if: steps.check_service.outputs.exists == 'true'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # ===========================================================================
  # STAGE 3: Frontend Testing
  # ===========================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: code-quality
    if: needs.code-quality.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean install
        working-directory: apps/web-app
        run: |
          rm -rf node_modules package-lock.json || true
          npm install

      - name: Run ESLint
        working-directory: apps/web-app
        run: npm run lint || true
        continue-on-error: true

      - name: Run TypeScript check
        working-directory: apps/web-app
        run: npm run type-check || npx tsc --noEmit || true

      - name: Run unit tests
        working-directory: apps/web-app
        run: npm test -- --coverage --ci || true
        continue-on-error: true

      - name: Build production bundle
        working-directory: apps/web-app
        env:
          NODE_ENV: production
        run: npm run build

      - name: Check bundle size
        working-directory: apps/web-app
        run: |
          echo "Bundle size analysis:"
          du -sh dist/ || true
          find dist -name "*.js" -exec du -h {} \; | sort -h | tail -10 || true

  # ===========================================================================
  # STAGE 4: Security Scanning
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'
        continue-on-error: true

      - name: Secret detection with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
        continue-on-error: true

  # ===========================================================================
  # STAGE 5: Infrastructure Validation
  # ===========================================================================
  infrastructure-validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    needs: code-quality
    if: needs.code-quality.outputs.infra_changed == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform
        continue-on-error: true

      - name: Validate Terraform (Dev)
        run: |
          cd infrastructure/terraform/environments/dating-dev
          terraform init -backend=false
          terraform validate
        continue-on-error: true

      - name: Run Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: 'checkov-terraform'
        continue-on-error: true

      - name: Validate Helm charts
        run: |
          for chart in infrastructure/helm/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Validating $chart"
              helm lint "$chart" || true
            fi
          done

  # ===========================================================================
  # STAGE 6: Docker Build Test
  # ===========================================================================
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always() && (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - messaging-service
          - matching-service
          - media-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f "backend/services/${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: backend/services/${{ matrix.service }}
          push: false
          tags: flamoral/${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # STAGE 7: Generate SBOM
  # ===========================================================================
  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [docker-build-test]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: sbom-${{ github.sha }}.spdx.json
          output-file: ./sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

  # ===========================================================================
  # SUMMARY
  # ===========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, backend-tests, frontend-tests, security-scan, infrastructure-validation, docker-build-test]
    if: always()

    steps:
      - name: CI Pipeline Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.infrastructure-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

      - name: Check overall status
        run: |
          if [[ "${{ needs.code-quality.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-tests.result }}" == "failure" ]]; then
            echo "CI Pipeline has failures"
            exit 1
          fi
          echo "CI Pipeline completed successfully"
