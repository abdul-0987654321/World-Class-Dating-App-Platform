# =============================================================================
# Flamoral Dating Platform - Dev Environment CI/CD Pipeline
# =============================================================================
# Triggers: Push to 'dev' branch
# Environment: Dev (Private AKS cluster)
# =============================================================================

name: Deploy to Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      deploy_services:
        description: 'Services to deploy (comma-separated or "all")'
        required: false
        default: 'all'

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AKS_CLUSTER_NAME: flamoral-dev-aks
  AKS_RESOURCE_GROUP: Dating-dev-rg
  ENVIRONMENT: dev

permissions:
  id-token: write
  contents: read

jobs:
  # =============================================================================
  # Build and Push Docker Images
  # =============================================================================
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Generate image metadata
        id: meta
        run: |
          echo "version=dev-$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/api-gateway:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/api-gateway:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/auth/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/auth-service:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/auth-service:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/user/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/user-service:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/user-service:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Matching Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/matching/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/matching-service:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/matching-service:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Messaging Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/messaging/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/messaging-service:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/messaging-service:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Media Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/media/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/media-service:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/media-service:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/web:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/web:dev-latest
          build-args: |
            VITE_API_URL=https://dev-api.flamoral.com
            VITE_ENVIRONMENT=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Deploy to Dev AKS
  # =============================================================================
  deploy:
    name: Deploy to Dev AKS
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Create/Update Kubernetes namespace
        run: |
          kubectl create namespace flamoral-dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry acr-secret \
            --docker-server=${{ env.ACR_LOGIN_SERVER }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --namespace=flamoral-dev \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy services using Helm
        run: |
          helm upgrade --install flamoral-dev ./k8s/helm/flamoral \
            --namespace flamoral-dev \
            --set global.image.tag=${{ needs.build.outputs.image_tag }} \
            --set global.image.registry=${{ env.ACR_LOGIN_SERVER }} \
            --set global.environment=dev \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set ingress.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-internal"="true" \
            --values ./k8s/helm/flamoral/values-dev.yaml \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          echo "Checking deployment status..."
          kubectl rollout status deployment -n flamoral-dev --timeout=5m
          echo ""
          echo "Pod status:"
          kubectl get pods -n flamoral-dev
          echo ""
          echo "Services:"
          kubectl get svc -n flamoral-dev

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Wait for services to be ready
          sleep 30

          # Get internal service IPs
          API_IP=$(kubectl get svc api-gateway -n flamoral-dev -o jsonpath='{.spec.clusterIP}')

          # Run basic health checks
          kubectl run curl-test --rm -i --restart=Never --image=curlimages/curl -- \
            curl -s -o /dev/null -w "%{http_code}" http://${API_IP}/health || true

          echo "Smoke tests completed"

  # =============================================================================
  # Notify on completion
  # =============================================================================
  notify:
    name: Send Notification
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send success notification
        if: ${{ needs.deploy.result == 'success' }}
        run: |
          echo "✅ Dev deployment successful!"
          echo "Image tag: ${{ needs.build.outputs.image_tag }}"

      - name: Send failure notification
        if: ${{ needs.deploy.result == 'failure' }}
        run: |
          echo "❌ Dev deployment failed!"
          echo "Check the workflow logs for details."
          exit 1
