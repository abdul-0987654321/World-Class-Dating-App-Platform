# =============================================================================
# UNIFIED CI/CD PIPELINE - Flamoral Dating Platform
# =============================================================================
# Single source of truth for all CI/CD operations
# Combines: Build, Test, Deploy, Release, and Rollback capabilities
# =============================================================================

name: Unified Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'build-deploy'
        options:
          - build-only
          - build-deploy
          - release
          - rollback
          - infrastructure
          - mobile
      environment:
        description: 'Target environment'
        required: false
        type: choice
        default: 'production'
        options:
          - development
          - staging
          - production
      version:
        description: 'Version for release (e.g., 1.2.3)'
        required: false
        type: string
      rollback_to:
        description: 'Version to rollback to (leave empty for previous)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AZURE_CONTAINER_REGISTRY: flamoralprodacr.azurecr.io
  RESOURCE_GROUP: flamoral-prod-rg
  NODE_VERSION: '20'
  TERRAFORM_VERSION: '1.6.0'

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
  security-events: write

# =============================================================================
# JOBS
# =============================================================================
jobs:
  # ===========================================================================
  # BUILD & TEST - Core CI
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.action == 'build-only' ||
      github.event.inputs.action == 'build-deploy' ||
      github.event.inputs.action == 'release'
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_deploy: ${{ steps.check.outputs.should_deploy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build:all

      - name: Run linting
        run: yarn lint:all
        continue-on-error: true  # Linting warnings don't block deploy

      - name: Run layout regression check
        run: |
          cd apps/web-app
          node scripts/layout-regression-check.cjs

      # SECURITY: Audit failures are logged as warnings but critical vulnerabilities fail the build
      - name: Security audit
        run: |
          npm audit --audit-level=critical 2>&1 | tee audit-report.txt
          if grep -q "critical" audit-report.txt; then
            echo "::error::Critical security vulnerabilities detected!"
            exit 1
          fi
        continue-on-error: false

      - name: Run security abuse tests
        run: yarn test:security:abuse

      # SECURITY: Production deploys require manual trigger (workflow_dispatch only)
      # Push to main only triggers build/test, not deploy
      - name: Check deployment conditions
        id: check
        run: |
          # Only deploy if manually triggered with build-deploy action
          # Push to main builds but does NOT auto-deploy to production
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && \
             ([ "${{ github.event.inputs.action }}" == "build-deploy" ] || [ "${{ github.event.inputs.action }}" == "release" ]); then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "::notice::Manual deployment triggered for ${{ github.event.inputs.environment || 'production' }}"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "::notice::Build only - deployment requires manual trigger via workflow_dispatch"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/web-app/dist
            backend/**/dist
          retention-days: 7

  # ===========================================================================
  # DOCKER BUILD - Build and Push Images
  # ===========================================================================
  build-docker-images:
    name: Build Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest
    if: needs.build-and-test.outputs.should_deploy == 'true'

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - matching-service
          - messaging-service
          - media-service
          - payment-service
          - notification-service
          - analytics-service
          - moderation-service
          - admin-service
          - automation-service
          - advertising-service
          - workflow-engine
          - realtime-service
        include:
          # AI Services (separate directory structure)
          - service: ai-services/recommendation-service
            dockerfile_path: backend/services/ai-services/recommendation-service/Dockerfile
          - service: ai-services/dating-coach-service
            dockerfile_path: backend/services/ai-services/dating-coach-service/Dockerfile
          - service: ai-services/fraud-detection
            dockerfile_path: backend/services/ai-services/fraud-detection/Dockerfile
          - service: ai-services/nlp-service
            dockerfile_path: backend/services/ai-services/nlp-service/Dockerfile
          - service: ai-services/photo-analysis
            dockerfile_path: backend/services/ai-services/photo-analysis/Dockerfile
          - service: ai-services/content-generator
            dockerfile_path: backend/services/ai-services/content-generator/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Dockerfile path
        id: dockerfile
        run: |
          # Use custom path if specified, otherwise default path
          if [ -n "${{ matrix.dockerfile_path }}" ]; then
            DOCKERFILE="${{ matrix.dockerfile_path }}"
          else
            DOCKERFILE="backend/services/${{ matrix.service }}/Dockerfile"
          fi
          echo "path=$DOCKERFILE" >> $GITHUB_OUTPUT

          if [ -f "$DOCKERFILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

          # Extract service name for image tag (remove ai-services/ prefix if present)
          IMAGE_NAME=$(echo "${{ matrix.service }}" | sed 's|ai-services/||')
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        if: steps.dockerfile.outputs.exists == 'true'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        if: steps.dockerfile.outputs.exists == 'true'
        id: docker_build
        run: |
          VERSION="${{ needs.build-and-test.outputs.version }}"
          IMAGE_NAME="${{ steps.dockerfile.outputs.image_name }}"
          docker build \
            -t ${{ env.AZURE_CONTAINER_REGISTRY }}/${IMAGE_NAME}:${VERSION} \
            -t ${{ env.AZURE_CONTAINER_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }} \
            -f ${{ steps.dockerfile.outputs.path }} \
            --build-arg VERSION=${VERSION} \
            .
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}/${IMAGE_NAME}:${VERSION}
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}

          # SECURITY: Capture image digest for immutable deployment
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.AZURE_CONTAINER_REGISTRY }}/${IMAGE_NAME}:${VERSION} | cut -d'@' -f2)
          echo "Image digest: $DIGEST"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      # SECURITY: Sign container image with cosign (keyless via GitHub OIDC/Sigstore)
      - name: Install cosign
        if: steps.dockerfile.outputs.exists == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign container image with cosign
        if: steps.dockerfile.outputs.exists == 'true'
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE_NAME="${{ steps.dockerfile.outputs.image_name }}"
          DIGEST="${{ steps.docker_build.outputs.digest }}"
          echo "Signing image: ${{ env.AZURE_CONTAINER_REGISTRY }}/${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes ${{ env.AZURE_CONTAINER_REGISTRY }}/${IMAGE_NAME}@${DIGEST}

      # SECURITY: Generate Software Bill of Materials (SBOM) for supply chain security
      - name: Generate SBOM
        if: steps.dockerfile.outputs.exists == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ steps.dockerfile.outputs.image_name }}:${{ needs.build-and-test.outputs.version }}
          artifact-name: sbom-${{ steps.dockerfile.outputs.image_name }}
          output-file: sbom-${{ steps.dockerfile.outputs.image_name }}.spdx.json

      - name: Upload SBOM
        if: steps.dockerfile.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.dockerfile.outputs.image_name }}
          path: sbom-${{ steps.dockerfile.outputs.image_name }}.spdx.json

  # ===========================================================================
  # FRONTEND BUILD
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    needs: build-and-test
    runs-on: ubuntu-latest
    if: needs.build-and-test.outputs.should_deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend
        id: frontend_build
        run: |
          VERSION="${{ needs.build-and-test.outputs.version }}"
          ENV="${{ github.event.inputs.environment || 'production' }}"

          # Set API URL based on environment
          case $ENV in
            production)
              API_URL="https://api.flamoral.com"
              WS_URL="wss://api.flamoral.com"
              ;;
            staging)
              API_URL="https://api.staging.flamoral.com"
              WS_URL="wss://api.staging.flamoral.com"
              ;;
            development)
              API_URL="https://api.dev.flamoral.com"
              WS_URL="wss://api.dev.flamoral.com"
              ;;
            *)
              API_URL="https://api.flamoral.com"
              WS_URL="wss://api.flamoral.com"
              ;;
          esac

          cd apps/web-app
          # SECURITY: Only push immutable tags (version + SHA). Never push :latest
          # CRITICAL: Pass VITE_* environment variables at build time (Vite inlines them)
          docker build \
            -t ${{ env.AZURE_CONTAINER_REGISTRY }}/web-app:${VERSION} \
            -t ${{ env.AZURE_CONTAINER_REGISTRY }}/web-app:${{ github.sha }} \
            --build-arg CACHE_BUST=$(date +%s) \
            --build-arg VITE_API_URL=${API_URL} \
            --build-arg VITE_WS_URL=${WS_URL} \
            --build-arg VITE_APP_ENV=${ENV} \
            .
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}/web-app:${VERSION}
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}/web-app:${{ github.sha }}

          # Capture digest for immutable deployment
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.AZURE_CONTAINER_REGISTRY }}/web-app:${VERSION} | cut -d'@' -f2)
          echo "Frontend image digest: $DIGEST"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      # SECURITY: Sign frontend container image with cosign (keyless via GitHub OIDC/Sigstore)
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign frontend container image with cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          DIGEST="${{ steps.frontend_build.outputs.digest }}"
          echo "Signing image: ${{ env.AZURE_CONTAINER_REGISTRY }}/web-app@${DIGEST}"
          cosign sign --yes ${{ env.AZURE_CONTAINER_REGISTRY }}/web-app@${DIGEST}

      # SECURITY: Generate Software Bill of Materials (SBOM) for supply chain security
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.AZURE_CONTAINER_REGISTRY }}/web-app:${{ needs.build-and-test.outputs.version }}
          artifact-name: sbom-web-app
          output-file: sbom-web-app.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-web-app
          path: sbom-web-app.spdx.json

  # ===========================================================================
  # DEPLOY TO PRODUCTION
  # ===========================================================================
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    needs: [build-and-test, build-docker-images, build-frontend]
    runs-on: ubuntu-latest
    if: needs.build-and-test.outputs.should_deploy == 'true'
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Get AKS credentials
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          case $ENV in
            production)
              az aks get-credentials --resource-group flamoral-prod-rg --name flamoral-prod-aks
              NAMESPACE="flamoral-prod"
              ;;
            staging)
              az aks get-credentials --resource-group flamoral-staging-rg --name flamoral-staging-aks
              NAMESPACE="flamoral-staging"
              ;;
            development)
              az aks get-credentials --resource-group flamoral-dev-rg --name flamoral-dev-aks
              NAMESPACE="flamoral-dev"
              ;;
          esac
          echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV

      - name: Deploy via Helm
        run: |
          VERSION="${{ needs.build-and-test.outputs.version }}"
          ENV="${{ github.event.inputs.environment || 'production' }}"

          # Map environment name to values file suffix
          case $ENV in
            production) VALUES_FILE="values-prod.yaml" ;;
            staging) VALUES_FILE="values-staging.yaml" ;;
            development) VALUES_FILE="values-dev.yaml" ;;
            *) VALUES_FILE="values.yaml" ;;
          esac

          helm upgrade --install flamoral-platform ./infrastructure/helm/flamoral-platform \
            --namespace $NAMESPACE \
            --create-namespace \
            --set global.image.tag=${VERSION} \
            --set global.imageRegistry=${{ env.AZURE_CONTAINER_REGISTRY }} \
            --set global.environment=${ENV} \
            --values ./infrastructure/helm/flamoral-platform/${VALUES_FILE} \
            --wait \
            --timeout 15m \
            --atomic

      - name: Verify deployment
        run: |
          kubectl rollout status deployment --all -n $NAMESPACE --timeout=600s
          kubectl get pods -n $NAMESPACE

      - name: Health check
        run: |
          sleep 30
          kubectl get ingress -n $NAMESPACE -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}' || true

  # ===========================================================================
  # RELEASE (Manual trigger)
  # ===========================================================================
  release:
    name: Create Release
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'release' && github.event.inputs.version != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          {
            echo "CHANGELOG<<EOF"
            echo "## What's Changed"
            echo ""
            git log $RANGE --pretty=format:"- %s (@%an)" --no-merges | head -30
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # ROLLBACK (Manual trigger)
  # ===========================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'rollback'
    environment: ${{ github.event.inputs.environment || 'production' }}-rollback

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Get AKS credentials
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          case $ENV in
            production)
              az aks get-credentials --resource-group flamoral-prod-rg --name flamoral-prod-aks
              NAMESPACE="flamoral-prod"
              RELEASE="flamoral-platform"
              ;;
            staging)
              az aks get-credentials --resource-group flamoral-staging-rg --name flamoral-staging-aks
              NAMESPACE="flamoral-staging"
              RELEASE="flamoral-platform"
              ;;
            development)
              az aks get-credentials --resource-group flamoral-dev-rg --name flamoral-dev-aks
              NAMESPACE="flamoral-dev"
              RELEASE="flamoral-platform"
              ;;
          esac
          echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV

      - name: Backup current state
        run: |
          kubectl get all -n $NAMESPACE -o yaml > backup-${{ github.run_id }}.yaml
          helm history $RELEASE -n $NAMESPACE

      - name: Perform rollback
        run: |
          if [ -n "${{ github.event.inputs.rollback_to }}" ]; then
            TARGET_REV=$(helm history $RELEASE -n $NAMESPACE -o json | \
              jq -r ".[] | select(.app_version==\"${{ github.event.inputs.rollback_to }}\") | .revision" | head -1)
            helm rollback $RELEASE $TARGET_REV -n $NAMESPACE --wait
          else
            helm rollback $RELEASE -n $NAMESPACE --wait
          fi

      - name: Verify rollback
        run: |
          kubectl rollout status deployment --all -n $NAMESPACE --timeout=600s
          kubectl get pods -n $NAMESPACE

  # ===========================================================================
  # INFRASTRUCTURE (Manual trigger)
  # ===========================================================================
  infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'infrastructure'
    environment: ${{ github.event.inputs.environment || 'production' }}-infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'prod' }}
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Plan
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'prod' }}
        run: terraform plan -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Apply
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'prod' }}
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # ===========================================================================
  # MOBILE BUILD (Manual trigger)
  # ===========================================================================
  mobile:
    name: Build Mobile Apps
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'mobile'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: Build Android
        working-directory: apps/mobile-app
        run: eas build --platform android --profile ${{ github.event.inputs.environment || 'production' }} --non-interactive

      - name: Build iOS
        working-directory: apps/mobile-app
        run: eas build --platform ios --profile ${{ github.event.inputs.environment || 'production' }} --non-interactive

  # ===========================================================================
  # DEPLOY PRODUCTION (Manual approval required)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    needs: [build-and-test, build-docker-images, build-frontend]
    runs-on: ubuntu-latest
    if: |
      needs.build-and-test.outputs.should_deploy == 'true' &&
      github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://flamoral.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Install envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group flamoral-prod-rg \
            --name flamoral-prod-aks \
            --overwrite-existing

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace if not exists
        run: |
          kubectl create namespace flamoral --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kyverno policies
        run: |
          echo "Applying Kyverno policies..."
          for policy in infrastructure/kubernetes/policies/*.yaml; do
            if [ -f "$policy" ]; then
              echo "Applying: $policy"
              kubectl apply -f "$policy" || echo "Warning: Failed to apply $policy"
            fi
          done

      - name: Deploy services via scripts
        env:
          IMAGE_TAG: ${{ needs.build-and-test.outputs.version }}
          REGISTRY: flamoralprodacr.azurecr.io
          NAMESPACE: flamoral
        run: |
          chmod +x scripts/deploy-production.sh
          ./scripts/deploy-production.sh "$IMAGE_TAG"

      - name: Verify deployment
        env:
          NAMESPACE: flamoral
        run: |
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh "$NAMESPACE"

      - name: Run smoke tests
        env:
          NAMESPACE: flamoral
        run: |
          chmod +x scripts/smoke-test.sh
          # Get the API Gateway service IP
          API_URL=$(kubectl get service api-gateway -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -n "$API_URL" ]; then
            ./scripts/smoke-test.sh "http://$API_URL:4000/api" || echo "Warning: Smoke tests had failures"
          else
            echo "Warning: Could not determine API Gateway IP, skipping external smoke tests"
            # Run internal smoke test
            ./scripts/smoke-test.sh "http://api-gateway.$NAMESPACE.svc.cluster.local:4000/api" || echo "Warning: Internal smoke tests had failures"
          fi

      - name: Deployment summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | flamoral-prod-aks |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | flamoral |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ needs.build-and-test.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +"%Y-%m-%dT%H:%M:%SZ") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pod Status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n flamoral --no-headers | head -20 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "Production deployment successful!",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Environment", "value": "Production", "short": true},
                  {"title": "Version", "value": "${{ needs.build-and-test.outputs.version }}", "short": true},
                  {"title": "Deployed By", "value": "${{ github.actor }}", "short": true},
                  {"title": "Repository", "value": "${{ github.repository }}", "short": true}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "Production deployment FAILED!",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Environment", "value": "Production", "short": true},
                  {"title": "Version", "value": "${{ needs.build-and-test.outputs.version }}", "short": true},
                  {"title": "Deployed By", "value": "${{ github.actor }}", "short": true},
                  {"title": "Run URL", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ===========================================================================
  # SUMMARY
  # ===========================================================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, build-docker-images, build-frontend, deploy, deploy-production, release, rollback, infrastructure, mobile]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# Unified Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Execution Details" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Images | ${{ needs.build-docker-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Production | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback | ${{ needs.rollback.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.infrastructure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile | ${{ needs.mobile.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Metadata" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            Pipeline completed: ${{ github.workflow }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
