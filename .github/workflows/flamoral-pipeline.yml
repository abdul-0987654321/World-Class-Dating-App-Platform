# =============================================================================
# FLAMORAL MASTER PIPELINE - flamoral.com
# =============================================================================
# Unified CI/CD for Development, Staging, and Production
# Environment: Azure AKS + Azure Front Door
# =============================================================================

name: Flamoral CI/CD Pipeline

on:
  # DISABLED: Using ci-cd.yml as the unified pipeline
  # push:
  #   branches:
  #     - main           # Production deployment
  #     - develop        # Development deployment
  #     - 'release/*'    # Staging deployment
  # pull_request:
  #   branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - staging
          - production
        required: true
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false
      debug_mode:
        description: 'Enable debug logging'
        type: boolean
        default: false

concurrency:
  group: flamoral-${{ github.ref }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: flamoral-prod-rg
  ACR_NAME: flamoralprodacr
  AKS_CLUSTER: flamoral-prod-aks
  NODE_VERSION: '20'
  REGISTRY: flamoralprodacr.azurecr.io

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

# =============================================================================
# JOB 1: DETERMINE ENVIRONMENT AND CHANGES
# =============================================================================
jobs:
  setup:
    name: Setup & Detect Changes
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      backend_changed: ${{ steps.changes.outputs.backend }}
      frontend_changed: ${{ steps.changes.outputs.frontend }}
      mobile_changed: ${{ steps.changes.outputs.mobile }}
      infra_changed: ${{ steps.changes.outputs.infra }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect Changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'packages/**'
            frontend:
              - 'apps/web-app/**'
            mobile:
              - 'apps/mobile-app/**'
            infra:
              - 'infrastructure/**'
              - '.github/workflows/**'

      - name: Debug Info
        if: ${{ github.event.inputs.debug_mode == 'true' }}
        run: |
          echo "Environment: ${{ steps.env.outputs.environment }}"
          echo "Backend changed: ${{ steps.changes.outputs.backend }}"
          echo "Frontend changed: ${{ steps.changes.outputs.frontend }}"
          echo "Should deploy: ${{ steps.env.outputs.should_deploy }}"

# =============================================================================
# JOB 2: CODE QUALITY & LINTING
# =============================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run Linting
        run: npm run lint --if-present
        continue-on-error: true

      - name: TypeScript Check
        run: npm run typecheck --if-present
        continue-on-error: true

# =============================================================================
# JOB 3: SECURITY SCANNING
# =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities, just report

      - name: Run Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

# =============================================================================
# JOB 4: UNIT TESTS
# =============================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [setup, quality]
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run Backend Tests
        if: needs.setup.outputs.backend_changed == 'true' || github.ref == 'refs/heads/main'
        run: |
          cd backend
          npm test --if-present || echo "No backend tests configured"
        continue-on-error: true

      - name: Run Frontend Tests
        if: needs.setup.outputs.frontend_changed == 'true' || github.ref == 'refs/heads/main'
        run: |
          cd apps/web-app
          npm test --if-present || echo "No frontend tests configured"
        continue-on-error: true

# =============================================================================
# JOB 5: BUILD DOCKER IMAGES
# =============================================================================
  build:
    name: Build (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup, test, security]
    if: needs.setup.outputs.should_deploy == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Set Image Tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          ENV=${{ needs.setup.outputs.environment }}
          echo "tag=${ENV}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "full_tag=${{ env.REGISTRY }}/flamoral:${ENV}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build & Push API Gateway
        if: needs.setup.outputs.backend_changed == 'true' || github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.REGISTRY }}/api-gateway:${{ steps.tag.outputs.tag }} \
            -f backend/services/api-gateway/Dockerfile backend/
          docker push ${{ env.REGISTRY }}/api-gateway:${{ steps.tag.outputs.tag }}

      - name: Build & Push Web App
        if: needs.setup.outputs.frontend_changed == 'true' || github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.REGISTRY }}/web-app:${{ steps.tag.outputs.tag }} \
            -f apps/web-app/Dockerfile apps/web-app/
          docker push ${{ env.REGISTRY }}/web-app:${{ steps.tag.outputs.tag }}

      - name: Save Image Tag
        run: echo "${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY

# =============================================================================
# JOB 6: DEPLOY TO ENVIRONMENT
# =============================================================================
  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.should_deploy == 'true'
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      - name: Set Image Tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          ENV=${{ needs.setup.outputs.environment }}
          echo "tag=${ENV}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Deploy to Kubernetes
        run: |
          ENV=${{ needs.setup.outputs.environment }}
          TAG=${{ steps.tag.outputs.tag }}
          NAMESPACE="flamoral"

          # Create namespace if not exists
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          # Update image tags in deployments
          kubectl set image deployment/api-gateway \
            api-gateway=${{ env.REGISTRY }}/api-gateway:${TAG} \
            -n ${NAMESPACE} || true

          kubectl set image deployment/web-app \
            web-app=${{ env.REGISTRY }}/web-app:${TAG} \
            -n ${NAMESPACE} || true

          # Wait for rollout
          kubectl rollout status deployment/api-gateway -n ${NAMESPACE} --timeout=300s || true
          kubectl rollout status deployment/web-app -n ${NAMESPACE} --timeout=300s || true

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

# =============================================================================
# JOB 7: POST-DEPLOYMENT VERIFICATION
# =============================================================================
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: needs.setup.outputs.should_deploy == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Determine API URL
        id: api
        run: |
          ENV=${{ needs.setup.outputs.environment }}
          case $ENV in
            dev)
              echo "url=https://dev.flamoral.com/api" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "url=https://staging.flamoral.com/api" >> $GITHUB_OUTPUT
              ;;
            production)
              echo "url=https://api.flamoral.com" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Health Check
        run: |
          ENV=${{ needs.setup.outputs.environment }}
          URL="${{ steps.api.outputs.url }}/health"

          echo "Checking health at: $URL"

          for i in {1..5}; do
            if curl -sf "$URL" > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done

          echo "Health check failed after 5 attempts"
          exit 1

      - name: Run Smoke Tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh "${{ steps.api.outputs.url }}"
        env:
          TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}

      - name: Smoke Test Summary
        if: always()
        run: |
          echo "## Deployment Verification - ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL:** ${{ steps.api.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Tests:** Completed" >> $GITHUB_STEP_SUMMARY

# =============================================================================
# JOB 8: ROLLBACK (Manual Trigger Only)
# =============================================================================
  rollback:
    name: Rollback (if needed)
    runs-on: ubuntu-latest
    needs: [setup, verify]
    if: failure() && needs.setup.outputs.should_deploy == 'true'

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      - name: Rollback Deployment
        run: |
          NAMESPACE="flamoral"

          echo "Rolling back deployments in ${NAMESPACE}..."
          kubectl rollout undo deployment/api-gateway -n ${NAMESPACE} || true
          kubectl rollout undo deployment/web-app -n ${NAMESPACE} || true

          echo "## Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "Previous deployment restored due to health check failure" >> $GITHUB_STEP_SUMMARY
