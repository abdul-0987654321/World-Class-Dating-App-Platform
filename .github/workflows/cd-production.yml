name: CD - Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release candidate tag to deploy (e.g., rc-abc123)'
        required: true
      deployment_type:
        description: 'Deployment strategy'
        required: true
        default: 'canary'
        type: choice
        options:
          - canary
          - blue-green
          - rolling

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'
  AZURE_AKS_CLUSTER: dating-app-prod-aks
  AZURE_RESOURCE_GROUP: dating-app-prod-rg

jobs:
  # ===========================================
  # Pre-deployment Validation
  # ===========================================
  pre-deploy-validation:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    environment: production-approval

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Validate release tag
        run: |
          if ! git tag -l | grep -q "${{ github.event.inputs.release_tag }}"; then
            echo "Release tag not found!"
            exit 1
          fi

      - name: Check staging tests passed
        run: |
          echo "Verifying all staging tests passed for ${{ github.event.inputs.release_tag }}"
          # Add API call to check test status

      - name: Security scan verification
        run: |
          echo "Verifying security scans passed"
          # Add verification logic

  # ===========================================
  # Backup Current State
  # ===========================================
  backup:
    name: Backup Current State
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation]

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Backup database
        run: |
          az postgres flexible-server backup create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name dating-app-prod-db \
            --backup-name "pre-deploy-${{ github.run_id }}"

      - name: Save current deployment state
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

          kubectl get deployment -n production -o yaml > current-deployments.yaml

      - name: Upload backup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}
          path: current-deployments.yaml
          retention-days: 30

  # ===========================================
  # Deploy Infrastructure (if needed)
  # ===========================================
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [backup]
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=production.tfstate"
        working-directory: infrastructure/terraform/environments/production

      - name: Terraform Plan
        run: terraform plan -out=tfplan -detailed-exitcode
        working-directory: infrastructure/terraform/environments/production
        continue-on-error: true
        id: plan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == 2
        run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/terraform/environments/production

  # ===========================================
  # Canary Deployment
  # ===========================================
  canary-deploy:
    name: Canary Deployment (10%)
    runs-on: ubuntu-latest
    needs: [deploy-infra]
    if: github.event.inputs.deployment_type == 'canary'
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Deploy canary (10% traffic)
        run: |
          for service in api-gateway user-service matching-service messaging-service; do
            helm upgrade --install $service-canary ./infrastructure/helm/dating-api \
              --namespace production \
              --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$service \
              --set image.tag=${{ github.event.inputs.release_tag }} \
              --set replicaCount=1 \
              --set canary.enabled=true \
              --set canary.weight=10 \
              --values ./infrastructure/helm/dating-api/values/production.yaml \
              --wait --timeout 10m
          done

      - name: Wait for canary stabilization
        run: sleep 300  # 5 minutes

  # ===========================================
  # Canary Validation
  # ===========================================
  canary-validation:
    name: Canary Validation
    runs-on: ubuntu-latest
    needs: [canary-deploy]
    if: github.event.inputs.deployment_type == 'canary'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Check error rates
        run: |
          echo "Checking canary error rates..."
          # Query Azure Monitor / App Insights
          # Fail if error rate > 1%

      - name: Check latency
        run: |
          echo "Checking canary latency..."
          # Query Azure Monitor
          # Fail if p95 latency > baseline + 20%

      - name: Run smoke tests against canary
        run: |
          curl -f ${{ secrets.PROD_CANARY_URL }}/health || exit 1

  # ===========================================
  # Progressive Rollout
  # ===========================================
  progressive-rollout:
    name: Progressive Rollout
    runs-on: ubuntu-latest
    needs: [canary-validation]
    if: github.event.inputs.deployment_type == 'canary'
    environment: production

    strategy:
      max-parallel: 1
      matrix:
        weight: [25, 50, 75, 100]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

      - name: Update traffic weight to ${{ matrix.weight }}%
        run: |
          kubectl patch virtualservice dating-app-vs -n production \
            --type=json \
            -p='[{"op": "replace", "path": "/spec/http/0/route/1/weight", "value": ${{ matrix.weight }}}]'

      - name: Wait and validate
        run: |
          sleep 180  # 3 minutes
          echo "Validating metrics at ${{ matrix.weight }}% traffic..."

      - name: Check metrics
        run: |
          # Verify error rate and latency are within thresholds
          echo "Metrics validation passed"

  # ===========================================
  # Blue-Green Deployment
  # ===========================================
  blue-green-deploy:
    name: Blue-Green Deployment
    runs-on: ubuntu-latest
    needs: [deploy-infra]
    if: github.event.inputs.deployment_type == 'blue-green'
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Deploy to green environment
        run: |
          for service in api-gateway user-service matching-service messaging-service media-service notification-service payment-service moderation-service analytics-service; do
            helm upgrade --install $service-green ./infrastructure/helm/dating-api \
              --namespace production-green \
              --create-namespace \
              --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$service \
              --set image.tag=${{ github.event.inputs.release_tag }} \
              --values ./infrastructure/helm/dating-api/values/production.yaml \
              --wait --timeout 15m
          done

      - name: Validate green deployment
        run: |
          kubectl wait --for=condition=available deployment --all -n production-green --timeout=600s

      - name: Switch traffic to green
        run: |
          kubectl patch service dating-app-lb -n production \
            --type=json \
            -p='[{"op": "replace", "path": "/spec/selector/version", "value": "green"}]'

  # ===========================================
  # Rolling Deployment
  # ===========================================
  rolling-deploy:
    name: Rolling Deployment
    runs-on: ubuntu-latest
    needs: [deploy-infra]
    if: github.event.inputs.deployment_type == 'rolling'
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Rolling update
        run: |
          for service in api-gateway user-service matching-service messaging-service media-service notification-service payment-service moderation-service analytics-service; do
            helm upgrade --install $service ./infrastructure/helm/dating-api \
              --namespace production \
              --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$service \
              --set image.tag=${{ github.event.inputs.release_tag }} \
              --set strategy.type=RollingUpdate \
              --set strategy.rollingUpdate.maxUnavailable=0 \
              --set strategy.rollingUpdate.maxSurge=1 \
              --values ./infrastructure/helm/dating-api/values/production.yaml \
              --wait --timeout 15m
          done

  # ===========================================
  # Database Migrations
  # ===========================================
  run-migrations:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: [canary-deploy, blue-green-deploy, rolling-deploy]
    if: always() && (needs.canary-deploy.result == 'success' || needs.blue-green-deploy.result == 'success' || needs.rolling-deploy.result == 'success')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

      - name: Run migrations
        run: |
          kubectl apply -f infrastructure/kubernetes/jobs/migration-job.yaml -n production
          kubectl wait --for=condition=complete job/db-migration -n production --timeout=900s

  # ===========================================
  # Post-deployment Validation
  # ===========================================
  post-deploy-validation:
    name: Post-deployment Validation
    runs-on: ubuntu-latest
    needs: [run-migrations]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web-app

      - name: Install Playwright
        run: npx playwright install chromium
        working-directory: ./apps/web-app

      - name: Run production smoke tests
        run: npx playwright test --project=smoke-production
        working-directory: ./apps/web-app
        env:
          BASE_URL: ${{ secrets.PROD_URL }}

      - name: Verify all services healthy
        run: |
          services=("api-gateway" "user-service" "matching-service" "messaging-service")
          for service in "${services[@]}"; do
            curl -f ${{ secrets.PROD_API_URL }}/$service/health || exit 1
          done

  # ===========================================
  # Create Release
  # ===========================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [post-deploy-validation]
    if: success()

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Production Release v${{ github.run_number }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Deployment Info
            - Release Tag: ${{ github.event.inputs.release_tag }}
            - Deployment Type: ${{ github.event.inputs.deployment_type }}
            - Deployed at: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

  # ===========================================
  # Notify
  # ===========================================
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always()

    steps:
      - name: Success Notification
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#production-deployments'
          text: ':white_check_mark: Production deployment successful!'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Failure Notification
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#production-deployments'
          text: ':x: Production deployment FAILED! Rollback may be required.'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # Rollback (Manual Trigger)
  # ===========================================
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: failure()
    needs: [post-deploy-validation]
    environment: production-rollback

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

      - name: Download backup
        uses: actions/download-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}

      - name: Rollback deployments
        run: |
          kubectl apply -f current-deployments.yaml -n production

      - name: Verify rollback
        run: |
          kubectl rollout status deployment --all -n production --timeout=600s

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: warning
          channel: '#production-deployments'
          text: ':warning: Production rollback executed!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
