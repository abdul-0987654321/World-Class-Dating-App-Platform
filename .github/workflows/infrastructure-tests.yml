name: Infrastructure Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'infrastructure/terraform/**'
      - 'infrastructure/kubernetes/**'
      - 'infrastructure/helm/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - 'infrastructure/kubernetes/**'
      - 'infrastructure/helm/**'
  workflow_dispatch:

env:
  TF_VERSION: '1.6.0'
  GO_VERSION: '1.21'
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  # ===========================================
  # Terraform Validation & Format
  # ===========================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        environment: [dev, staging, production]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}

  # ===========================================
  # Terraform Plan (Per Environment)
  # ===========================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate
    timeout-minutes: 15

    strategy:
      matrix:
        environment: [dev, staging]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ matrix.environment }}.tfstate"
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}

      - name: Select Workspace
        run: terraform workspace select ${{ matrix.environment }} || terraform workspace new ${{ matrix.environment }}
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: infrastructure/terraform/environments/${{ matrix.environment }}/tfplan
          retention-days: 7

  # ===========================================
  # Terratest - Infrastructure Unit Tests
  # ===========================================
  terratest:
    name: Terratest
    runs-on: ubuntu-latest
    needs: terraform-validate
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Run Terratest
        run: |
          cd infrastructure/tests/terratest
          go mod download
          go test -v -timeout 30m ./...
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ===========================================
  # Kubernetes Manifest Validation
  # ===========================================
  k8s-validate:
    name: Kubernetes Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.28.0 \
            infrastructure/kubernetes/base/

      - name: Validate Kustomize overlays
        run: |
          for overlay in infrastructure/kubernetes/overlays/*/; do
            echo "Validating $overlay"
            kubectl kustomize $overlay | kubeconform -strict -summary
          done

  # ===========================================
  # Helm Chart Validation
  # ===========================================
  helm-validate:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Lint Helm Charts
        run: |
          for chart in infrastructure/helm/*/; do
            echo "Linting $chart"
            helm lint $chart
          done

      - name: Template Helm Charts
        run: |
          for chart in infrastructure/helm/*/; do
            echo "Templating $chart"
            helm template test $chart > /dev/null
          done

      - name: Helm Unit Tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git || true
          for chart in infrastructure/helm/*/; do
            if [ -d "$chart/tests" ]; then
              echo "Testing $chart"
              helm unittest $chart
            fi
          done

  # ===========================================
  # Policy Tests (OPA/Conftest)
  # ===========================================
  policy-tests:
    name: Policy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Conftest
        run: |
          curl -L -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_0.48.0_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Test Terraform policies
        run: |
          conftest test infrastructure/terraform/environments/*/main.tf \
            --policy infrastructure/policies/terraform/

      - name: Test Kubernetes policies
        run: |
          conftest test infrastructure/kubernetes/base/*.yaml \
            --policy infrastructure/policies/kubernetes/

      - name: Test Dockerfile policies
        run: |
          find . -name "Dockerfile" -exec conftest test {} --policy infrastructure/policies/docker/ \;

  # ===========================================
  # Cost Estimation
  # ===========================================
  cost-estimation:
    name: Infrastructure Cost Estimation
    runs-on: ubuntu-latest
    needs: terraform-plan
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost breakdown
        run: |
          infracost breakdown --path infrastructure/terraform/environments/staging \
            --format json --out-file /tmp/infracost.json

      - name: Post Infracost comment
        uses: infracost/actions/comment@v1
        with:
          path: /tmp/infracost.json
          behavior: update

  # ===========================================
  # Summary
  # ===========================================
  infra-summary:
    name: Infrastructure Tests Summary
    runs-on: ubuntu-latest
    needs: [terraform-validate, terraform-plan, terratest, k8s-validate, helm-validate, policy-tests]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Infrastructure Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Validate | ${{ needs.terraform-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Plan | ${{ needs.terraform-plan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terratest | ${{ needs.terratest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| K8s Validate | ${{ needs.k8s-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helm Validate | ${{ needs.helm-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Policy Tests | ${{ needs.policy-tests.result }} |" >> $GITHUB_STEP_SUMMARY
