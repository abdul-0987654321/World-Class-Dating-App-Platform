# Flamoral Platform - Nightly Health Check Pipeline
# Runs automated health checks every night at 2 AM UTC

name: Nightly Health Check

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

jobs:
  infrastructure-health:
    name: Infrastructure Health Check
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    outputs:
      aks-status: ${{ steps.aks-check.outputs.status }}
      postgres-status: ${{ steps.postgres-check.outputs.status }}
      redis-status: ${{ steps.redis-check.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Check AKS Cluster Status
        id: aks-check
        run: |
          CLUSTER_NAME="${{ vars.AKS_CLUSTER_NAME || 'flamoral-prod-aks' }}"
          RESOURCE_GROUP="${{ vars.RESOURCE_GROUP || 'flamoral-prod-rg' }}"

          echo "Checking AKS cluster: $CLUSTER_NAME"

          STATUS=$(az aks show \
            --name "$CLUSTER_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "powerState.code" \
            --output tsv 2>/dev/null || echo "Unknown")

          echo "AKS Status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT

          if [ "$STATUS" != "Running" ]; then
            echo "::warning::AKS cluster is not running: $STATUS"
          fi

      - name: Check PostgreSQL Status
        id: postgres-check
        run: |
          SERVER_NAME="${{ vars.POSTGRES_SERVER || 'flamoral-prod-postgres' }}"
          RESOURCE_GROUP="${{ vars.RESOURCE_GROUP || 'flamoral-prod-rg' }}"

          echo "Checking PostgreSQL server: $SERVER_NAME"

          STATUS=$(az postgres flexible-server show \
            --name "$SERVER_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "state" \
            --output tsv 2>/dev/null || echo "Unknown")

          echo "PostgreSQL Status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT

          if [ "$STATUS" != "Ready" ]; then
            echo "::warning::PostgreSQL is not ready: $STATUS"
          fi

      - name: Check Redis Status
        id: redis-check
        run: |
          REDIS_NAME="${{ vars.REDIS_NAME || 'flamoral-prod-redis' }}"
          RESOURCE_GROUP="${{ vars.RESOURCE_GROUP || 'flamoral-prod-rg' }}"

          echo "Checking Redis cache: $REDIS_NAME"

          STATUS=$(az redis show \
            --name "$REDIS_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "provisioningState" \
            --output tsv 2>/dev/null || echo "Unknown")

          echo "Redis Status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT

  service-health:
    name: Service Health Check
    runs-on: ubuntu-latest
    needs: infrastructure-health
    if: needs.infrastructure-health.outputs.aks-status == 'Running'
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --name "${{ vars.AKS_CLUSTER_NAME || 'flamoral-prod-aks' }}" \
            --resource-group "${{ vars.RESOURCE_GROUP || 'flamoral-prod-rg' }}" \
            --overwrite-existing

      - name: Check Pod Health
        run: |
          echo "Checking pod status in flamoral namespace..."

          kubectl get pods -n flamoral -o wide

          # Count ready pods
          READY_PODS=$(kubectl get pods -n flamoral --field-selector=status.phase=Running -o name | wc -l)
          TOTAL_PODS=$(kubectl get pods -n flamoral -o name | wc -l)

          echo "Ready pods: $READY_PODS / $TOTAL_PODS"

          if [ "$READY_PODS" -lt "$TOTAL_PODS" ]; then
            echo "::warning::Some pods are not ready"
            kubectl get pods -n flamoral | grep -v Running | grep -v Completed || true
          fi

      - name: Check Service Endpoints
        run: |
          echo "Checking service endpoints..."

          SERVICES=("auth-service" "user-service" "matching-service" "messaging-service" "payment-service")

          for SVC in "${SERVICES[@]}"; do
            ENDPOINTS=$(kubectl get endpoints "$SVC" -n flamoral -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || echo "")

            if [ -n "$ENDPOINTS" ]; then
              echo "✓ $SVC has endpoints: $ENDPOINTS"
            else
              echo "::warning::$SVC has no ready endpoints"
            fi
          done

      - name: Check Deployment Replicas
        run: |
          echo "Checking deployment replicas..."

          kubectl get deployments -n flamoral -o custom-columns=NAME:.metadata.name,DESIRED:.spec.replicas,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas

          # Check for any deployments with 0 ready replicas
          UNHEALTHY=$(kubectl get deployments -n flamoral -o json | jq '[.items[] | select(.status.readyReplicas == 0 or .status.readyReplicas == null)] | length')

          if [ "$UNHEALTHY" -gt 0 ]; then
            echo "::error::$UNHEALTHY deployments have no ready replicas"
            exit 1
          fi

  api-health:
    name: API Health Check
    runs-on: ubuntu-latest
    needs: service-health
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check API Gateway Health
        run: |
          API_URL="${{ vars.API_URL || 'https://api.flamoral.com' }}"

          echo "Checking API Gateway at $API_URL"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "$API_URL/health" || echo "000")

          if [ "$RESPONSE" = "200" ]; then
            echo "✓ API Gateway is healthy"
          else
            echo "::error::API Gateway health check failed: HTTP $RESPONSE"
            exit 1
          fi

      - name: Check Auth Endpoints
        run: |
          API_URL="${{ vars.API_URL || 'https://api.flamoral.com' }}"

          # Test login endpoint (should return 400 for invalid input)
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"test@test.com","password":"invalid"}' \
            "$API_URL/api/auth/login" || echo "000")

          if [ "$RESPONSE" = "401" ] || [ "$RESPONSE" = "400" ]; then
            echo "✓ Auth endpoint is responding"
          else
            echo "::warning::Auth endpoint returned unexpected response: HTTP $RESPONSE"
          fi

      - name: Check Rate Limiting
        run: |
          API_URL="${{ vars.API_URL || 'https://api.flamoral.com' }}"

          # Check rate limit headers are present
          HEADERS=$(curl -s -I "$API_URL/health" 2>/dev/null || echo "")

          if echo "$HEADERS" | grep -qi "x-ratelimit"; then
            echo "✓ Rate limiting headers present"
          else
            echo "::warning::Rate limiting headers not found"
          fi

  database-health:
    name: Database Health Check
    runs-on: ubuntu-latest
    needs: infrastructure-health
    if: needs.infrastructure-health.outputs.postgres-status == 'Ready'
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Check Database Connectivity
        run: |
          echo "Database health check would connect to:"
          echo "  Server: ${{ vars.POSTGRES_SERVER || 'flamoral-prod-postgres' }}.postgres.database.azure.com"
          echo "  Database: flamoral"

          # Note: Actual connection test requires credentials and network access
          echo "::notice::Database connectivity test requires secure credential access"

      - name: Check Connection Pool Status
        run: |
          echo "Connection pool health check..."
          echo "::notice::This check runs from within the Kubernetes cluster"

  security-check:
    name: Security Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run npm audit
        run: |
          cd backend
          npm audit --audit-level=high || echo "::warning::Security vulnerabilities detected"

      - name: Check for exposed secrets
        run: |
          # Basic check for hardcoded secrets
          if grep -rE "(password|secret|api_key)\s*=\s*['\"][^'\"]{8,}['\"]" \
            --include="*.ts" --include="*.js" \
            backend/ 2>/dev/null | grep -v node_modules | grep -v ".env" | head -5; then
            echo "::warning::Potential hardcoded secrets found"
          else
            echo "✓ No obvious hardcoded secrets detected"
          fi

  generate-report:
    name: Generate Health Report
    runs-on: ubuntu-latest
    needs: [infrastructure-health, service-health, api-health, security-check]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Report
        run: |
          mkdir -p reports

          cat > reports/health-report-$(date +%Y%m%d).json << EOF
          {
            "timestamp": "$(date -Iseconds)",
            "environment": "${{ github.event.inputs.environment || 'staging' }}",
            "infrastructure": {
              "aks": "${{ needs.infrastructure-health.outputs.aks-status }}",
              "postgres": "${{ needs.infrastructure-health.outputs.postgres-status }}",
              "redis": "${{ needs.infrastructure-health.outputs.redis-status }}"
            },
            "workflow": {
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "triggered_by": "${{ github.actor }}"
            }
          }
          EOF

          cat reports/health-report-$(date +%Y%m%d).json

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Send Slack Notification
        if: failure()
        run: |
          # Slack notification would go here
          echo "::notice::Health check failures detected. Slack notification would be sent."

      - name: Summary
        run: |
          echo "## Nightly Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure Status" >> $GITHUB_STEP_SUMMARY
          echo "- AKS: ${{ needs.infrastructure-health.outputs.aks-status }}" >> $GITHUB_STEP_SUMMARY
          echo "- PostgreSQL: ${{ needs.infrastructure-health.outputs.postgres-status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Redis: ${{ needs.infrastructure-health.outputs.redis-status }}" >> $GITHUB_STEP_SUMMARY
