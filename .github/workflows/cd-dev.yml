name: CD - Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'
  AZURE_AKS_CLUSTER: dating-app-dev-aks
  AZURE_RESOURCE_GROUP: dating-app-dev-rg

jobs:
  # ===========================================
  # Build & Push Images
  # ===========================================
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - matching-service
          - messaging-service
          - media-service
          - notification-service
          - payment-service
          - moderation-service
          - analytics-service

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=dev-
            type=ref,event=branch
            type=raw,value=dev-latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=development

  # ===========================================
  # Build Web App
  # ===========================================
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web-app

      - name: Build
        run: npm run build
        working-directory: ./apps/web-app
        env:
          NODE_ENV: development
          NEXT_PUBLIC_API_URL: ${{ secrets.DEV_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.DEV_WS_URL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-dev-build
          path: apps/web-app/dist/
          retention-days: 7

  # ===========================================
  # Deploy Infrastructure (if changed)
  # ===========================================
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'infrastructure/')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev.tfstate"
        working-directory: infrastructure/terraform/environments/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: infrastructure/terraform/environments/dev
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ===========================================
  # Deploy to AKS
  # ===========================================
  deploy-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Deploy services via Helm
        run: |
          for service in api-gateway user-service matching-service messaging-service media-service notification-service payment-service moderation-service analytics-service; do
            helm upgrade --install $service ./infrastructure/helm/dating-api \
              --namespace dev \
              --create-namespace \
              --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$service \
              --set image.tag=dev-${{ github.sha }} \
              --set environment=development \
              --values ./infrastructure/helm/dating-api/values/dev.yaml \
              --wait --timeout 5m
          done

      - name: Deploy web app
        run: |
          helm upgrade --install web-app ./infrastructure/helm/web-app \
            --namespace dev \
            --set image.tag=dev-${{ github.sha }} \
            --values ./infrastructure/helm/web-app/values/dev.yaml \
            --wait --timeout 5m

  # ===========================================
  # Run Database Migrations
  # ===========================================
  run-migrations:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: [deploy-aks]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

      - name: Run migrations job
        run: |
          kubectl apply -f infrastructure/kubernetes/jobs/migration-job.yaml -n dev
          kubectl wait --for=condition=complete job/db-migration -n dev --timeout=300s

  # ===========================================
  # Smoke Tests
  # ===========================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-aks, run-migrations]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web-app

      - name: Install Playwright
        run: npx playwright install chromium
        working-directory: ./apps/web-app

      - name: Run smoke tests
        run: npx playwright test --project=smoke
        working-directory: ./apps/web-app
        env:
          BASE_URL: ${{ secrets.DEV_URL }}

      - name: Health check all services
        run: |
          curl -f ${{ secrets.DEV_API_URL }}/health || exit 1
          curl -f ${{ secrets.DEV_URL }} || exit 1

  # ===========================================
  # Notify
  # ===========================================
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: always()

    steps:
      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'Development deployment ${{ job.status }}'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
