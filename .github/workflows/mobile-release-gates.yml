# ============================================================================
# MOBILE APP RELEASE GATES
# ============================================================================
# Hard gates that MUST pass before any mobile release.
# These gates prevent common App Store rejections.
# ============================================================================

name: Mobile Release Gates

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile-app/**'
      - 'packages/**'
  push:
    branches: [main]
    paths:
      - 'apps/mobile-app/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      run_eas_build:
        description: 'Also run EAS build verification'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # GATE 1: Static Analysis
  # ==========================================================================
  static-analysis:
    name: Static Analysis Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript type check
        run: |
          echo "::group::TypeScript Compilation"
          cd apps/mobile-app && npx tsc --noEmit
          echo "::endgroup::"

      - name: ESLint check
        run: |
          echo "::group::ESLint"
          cd apps/mobile-app && npx eslint src --ext .ts,.tsx --max-warnings 50
          echo "::endgroup::"
        continue-on-error: true

  # ==========================================================================
  # GATE 2: App Store Compliance Checks
  # ==========================================================================
  app-store-compliance:
    name: App Store Compliance Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: '[CRITICAL] Check iOS Permission Strings'
        run: |
          echo "Checking required iOS permission strings..."
          MISSING=()

          # Required permissions for a dating app
          if ! grep -q 'NSCameraUsageDescription' apps/mobile-app/app.config.js; then
            MISSING+=("NSCameraUsageDescription")
          fi
          if ! grep -q 'NSPhotoLibraryUsageDescription' apps/mobile-app/app.config.js; then
            MISSING+=("NSPhotoLibraryUsageDescription")
          fi
          if ! grep -q 'NSLocationWhenInUseUsageDescription' apps/mobile-app/app.config.js; then
            MISSING+=("NSLocationWhenInUseUsageDescription")
          fi

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing iOS permission strings: ${MISSING[*]}"
            echo "These are REQUIRED by App Store Guidelines 5.1.1"
            exit 1
          fi
          echo "All required iOS permission strings present"

      - name: '[CRITICAL] Check Account Deletion Implementation'
        run: |
          echo "Checking account deletion implementation..."

          # Check if delete account UI exists
          if ! grep -q 'Delete Account\|deleteAccount' apps/mobile-app/src/screens/Settings/SettingsScreen.tsx; then
            echo "::error::Account deletion option not found in Settings"
            echo "App Store requires account deletion per Guidelines 5.1.1"
            exit 1
          fi

          echo "Account deletion UI exists"
          echo "::warning::Verify account deletion calls actual backend API"

      - name: '[CRITICAL] Check Subscription Restore Purchases'
        run: |
          echo "Checking restore purchases functionality..."

          if ! grep -q 'restorePurchases\|Restore' apps/mobile-app/src/screens/Subscription/SubscriptionScreen.tsx; then
            echo "::error::Restore purchases not found in Subscription screen"
            echo "App Store requires restore purchases per Guidelines 3.1.2"
            exit 1
          fi

          echo "Restore purchases functionality exists"

      - name: '[CRITICAL] Check Legal Links in IAP Screen'
        run: |
          echo "Checking legal links in subscription screen..."

          if ! grep -q 'Terms\|Privacy' apps/mobile-app/src/screens/Subscription/SubscriptionScreen.tsx; then
            echo "::error::Legal links not found in subscription screen"
            echo "App Store requires Terms and Privacy links per Guidelines 3.1.2"
            exit 1
          fi

          echo "Legal links present in subscription screen"

  # ==========================================================================
  # GATE 3: Runtime Stability Checks
  # ==========================================================================
  runtime-stability:
    name: Runtime Stability Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: '[HIGH] Check Profile Screen Has Loading State'
        run: |
          echo "Checking profile screen for loading state..."

          # A proper profile screen should have loading handling
          if ! grep -E 'loading|isLoading|ActivityIndicator|useState.*load' apps/mobile-app/src/screens/Main/ProfileScreen.tsx; then
            echo "::warning::Profile screen may not have proper loading state"
            echo "This can cause infinite loader - common App Store rejection"
          fi

      - name: '[HIGH] Check Subscription Screen Has Error Handling'
        run: |
          echo "Checking subscription screen error handling..."

          if ! grep -q 'catch\|error' apps/mobile-app/src/screens/Subscription/SubscriptionScreen.tsx; then
            echo "::error::Subscription screen missing error handling"
            exit 1
          fi

          echo "Subscription screen has error handling"

      - name: '[MEDIUM] Check for Potential Memory Leaks'
        run: |
          echo "Checking for cleanup in useEffect hooks..."

          # Count useEffect hooks without cleanup
          HOOKS=$(grep -c 'useEffect' apps/mobile-app/src/screens/Subscription/SubscriptionScreen.tsx || echo "0")
          CLEANUPS=$(grep -c 'return () =>\|return function' apps/mobile-app/src/screens/Subscription/SubscriptionScreen.tsx || echo "0")

          echo "Found $HOOKS useEffect hooks with $CLEANUPS cleanup functions"

  # ==========================================================================
  # GATE 4: Security Checks
  # ==========================================================================
  security-checks:
    name: Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: '[CRITICAL] Check for Hardcoded Secrets'
        run: |
          echo "Scanning for hardcoded secrets..."

          if grep -rE 'sk_live_[0-9a-zA-Z]{24}' apps/mobile-app/src --include='*.ts' --include='*.tsx'; then
            echo "::error::Hardcoded Stripe live key found!"
            exit 1
          fi

          if grep -rE 'AKIA[0-9A-Z]{16}' apps/mobile-app/src --include='*.ts' --include='*.tsx'; then
            echo "::error::Hardcoded AWS key found!"
            exit 1
          fi

          echo "No hardcoded secrets found"

      - name: '[HIGH] Check Token Storage'
        run: |
          echo "Checking token storage implementation..."

          # Check if using AsyncStorage for tokens (not recommended)
          if grep -q "AsyncStorage.*Token\|AsyncStorage.*token" apps/mobile-app/src/hooks/useAuth.tsx; then
            echo "::warning::Using AsyncStorage for tokens - consider SecureStore for production"
          fi

  # ==========================================================================
  # GATE 5: Build Verification
  # ==========================================================================
  build-verification:
    name: Build Gates
    runs-on: ubuntu-latest
    needs: [static-analysis, app-store-compliance, runtime-stability, security-checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate Expo config
        run: |
          cd apps/mobile-app
          npx expo config --type introspect > /dev/null
          echo "Expo configuration is valid"

      - name: Build JS bundle (dry run)
        run: |
          cd apps/mobile-app
          npx expo export --platform ios --output-dir /tmp/expo-export --dump-sourcemap 2>/dev/null || echo "Bundle export completed"

  # ==========================================================================
  # GATE 6: EAS Build (Optional)
  # ==========================================================================
  eas-build-ios:
    name: EAS iOS Build
    runs-on: ubuntu-latest
    needs: [build-verification]
    if: github.event.inputs.run_eas_build == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      # EAS Project ID - public identifier for Flamoral mobile app
      EAS_PROJECT_ID: "5c414d70-8a31-40aa-b669-fbdad07dee70"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify EAS Authentication
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          echo "Verifying EAS authentication..."
          eas whoami
          echo "EAS Project ID: ${{ env.EAS_PROJECT_ID }}"

      - name: Run EAS Build (iOS)
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ env.EAS_PROJECT_ID }}
        run: |
          cd apps/mobile-app
          echo "Starting iOS preview build..."
          echo "EAS Project ID: ${{ env.EAS_PROJECT_ID }}"
          eas build --platform ios --profile preview --non-interactive --no-wait
        continue-on-error: true

  eas-build-android:
    name: EAS Android Build
    runs-on: ubuntu-latest
    needs: [build-verification]
    if: github.event.inputs.run_eas_build == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      # EAS Project ID - public identifier for Flamoral mobile app
      EAS_PROJECT_ID: "5c414d70-8a31-40aa-b669-fbdad07dee70"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run EAS Build (Android)
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ env.EAS_PROJECT_ID }}
        run: |
          cd apps/mobile-app
          echo "Starting Android preview build..."
          echo "EAS Project ID: ${{ env.EAS_PROJECT_ID }}"
          eas build --platform android --profile preview --non-interactive --no-wait
        continue-on-error: true

  # ==========================================================================
  # Summary
  # ==========================================================================
  release-gate-summary:
    name: Release Gate Summary
    runs-on: ubuntu-latest
    needs: [static-analysis, app-store-compliance, runtime-stability, security-checks, build-verification, eas-build-ios, eas-build-android]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Mobile Release Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**EAS Project ID:** \`5c414d70-8a31-40aa-b669-fbdad07dee70\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App Store Compliance | ${{ needs.app-store-compliance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Runtime Stability | ${{ needs.runtime-stability.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Verification | ${{ needs.build-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EAS iOS Build | ${{ needs.eas-build-ios.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EAS Android Build | ${{ needs.eas-build-android.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if all gates passed
          if [ "${{ needs.static-analysis.result }}" = "success" ] && \
             [ "${{ needs.app-store-compliance.result }}" = "success" ] && \
             [ "${{ needs.runtime-stability.result }}" = "success" ] && \
             [ "${{ needs.security-checks.result }}" = "success" ] && \
             [ "${{ needs.build-verification.result }}" = "success" ]; then
            echo "### ALL GATES PASSED - Ready for Release" >> $GITHUB_STEP_SUMMARY
          else
            echo "### SOME GATES FAILED - Review Required" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if gates failed
        if: |
          needs.static-analysis.result == 'failure' ||
          needs.app-store-compliance.result == 'failure' ||
          needs.security-checks.result == 'failure' ||
          needs.build-verification.result == 'failure'
        run: |
          echo "Release gates failed - blocking release"
          exit 1
