name: CD - Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'
  AZURE_AKS_CLUSTER: dating-app-staging-aks
  AZURE_RESOURCE_GROUP: dating-app-staging-rg

jobs:
  # ===========================================
  # Build & Push Images
  # ===========================================
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - matching-service
          - messaging-service
          - media-service
          - notification-service
          - payment-service
          - moderation-service
          - analytics-service

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging

  # ===========================================
  # Build Web App
  # ===========================================
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web-app

      - name: Build
        run: npm run build
        working-directory: ./apps/web-app
        env:
          NODE_ENV: staging
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.STAGING_WS_URL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-staging-build
          path: apps/web-app/dist/
          retention-days: 30

  # ===========================================
  # Deploy Infrastructure
  # ===========================================
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=staging.tfstate"
        working-directory: infrastructure/terraform/environments/staging

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: infrastructure/terraform/environments/staging
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/terraform/environments/staging

  # ===========================================
  # Deploy to AKS
  # ===========================================
  deploy-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [build-push, deploy-infra]
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Deploy services via Helm
        run: |
          for service in api-gateway user-service matching-service messaging-service media-service notification-service payment-service moderation-service analytics-service; do
            helm upgrade --install $service ./infrastructure/helm/dating-api \
              --namespace staging \
              --create-namespace \
              --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$service \
              --set image.tag=staging-${{ github.sha }} \
              --set environment=staging \
              --values ./infrastructure/helm/dating-api/values/staging.yaml \
              --wait --timeout 10m
          done

  # ===========================================
  # Run Database Migrations
  # ===========================================
  run-migrations:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: [deploy-aks]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_AKS_CLUSTER }}

      - name: Run migrations
        run: |
          kubectl apply -f infrastructure/kubernetes/jobs/migration-job.yaml -n staging
          kubectl wait --for=condition=complete job/db-migration -n staging --timeout=600s

  # ===========================================
  # Full E2E Test Suite
  # ===========================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-aks, run-migrations]
    timeout-minutes: 45

    strategy:
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web-app

      - name: Install Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: ./apps/web-app

      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.browser }}
        working-directory: ./apps/web-app
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.browser }}
          path: apps/web-app/playwright-report/
          retention-days: 30

  # ===========================================
  # Performance Tests
  # ===========================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [deploy-aks, run-migrations]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests
        run: k6 run --out json=results.json backend/tests/performance/k6/staging-load-test.js
        env:
          K6_BASE_URL: ${{ secrets.STAGING_API_URL }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: k6-staging-results
          path: results.json
          retention-days: 30

  # ===========================================
  # Security Scan
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [deploy-aks]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: ${{ secrets.STAGING_URL }}
          rules_file_name: '.zap/rules.tsv'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-staging-report
          path: report_html.html
          retention-days: 30

  # ===========================================
  # Create Release Candidate Tag
  # ===========================================
  create-rc-tag:
    name: Create RC Tag
    runs-on: ubuntu-latest
    needs: [e2e-tests, performance-tests, security-scan]
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Create RC Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "rc-${{ github.sha }}" -m "Release Candidate from ${{ github.sha }}"
          git push origin "rc-${{ github.sha }}"

  # ===========================================
  # Notify
  # ===========================================
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [create-rc-tag]
    if: always()

    steps:
      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'Staging deployment completed. RC tag: rc-${{ github.sha }}'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
