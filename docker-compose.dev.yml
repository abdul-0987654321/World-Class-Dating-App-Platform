version: '3.8'

# Development-specific docker-compose configuration
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # User Service
  user-service:
    build:
      context: ./backend/services/user-service
      dockerfile: Dockerfile
    container_name: flamoral-user-service
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "3001:3001"
    volumes:
      - ./backend/services/user-service:/app
      - /app/node_modules
    networks:
      - flamoral-network
    depends_on:
      - postgres
      - redis
    command: npm run dev

  # Matching Service
  matching-service:
    build:
      context: ./backend/services/matching-service
      dockerfile: Dockerfile
    container_name: flamoral-matching-service
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "3002:3002"
    volumes:
      - ./backend/services/matching-service:/app
      - /app/node_modules
    networks:
      - flamoral-network
    depends_on:
      - postgres
      - redis
    command: npm run dev

  # Messaging Service
  messaging-service:
    build:
      context: ./backend/services/messaging-service
      dockerfile: Dockerfile
    container_name: flamoral-messaging-service
    environment:
      - NODE_ENV=development
      - PORT=3003
      - REDIS_HOST=redis
    ports:
      - "3003:3003"
    volumes:
      - ./backend/services/messaging-service:/app
      - /app/node_modules
    networks:
      - flamoral-network
    depends_on:
      - redis
    command: npm run dev

  # Media Service
  media-service:
    build:
      context: ./backend/services/media-service
      dockerfile: Dockerfile
    container_name: flamoral-media-service
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-UseDevelopmentStorage=true}
      - AZURE_FACE_API_KEY=${AZURE_FACE_API_KEY}
      - AZURE_FACE_ENDPOINT=${AZURE_FACE_ENDPOINT}
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.7}
      - LIVENESS_THRESHOLD=${LIVENESS_THRESHOLD:-0.6}
      - QUALITY_THRESHOLD=${QUALITY_THRESHOLD:-0.5}
    ports:
      - "3004:3004"
    volumes:
      - ./backend/services/media-service:/app
      - /app/node_modules
    networks:
      - flamoral-network
    depends_on:
      - postgres
      - redis
      - azurite
    command: npm run dev

  # API Gateway
  api-gateway:
    build:
      context: ./backend/services/api-gateway
      dockerfile: Dockerfile
    container_name: flamoral-api-gateway
    environment:
      - NODE_ENV=development
      - PORT=4000
      - REDIS_HOST=redis
      - USER_SERVICE_URL=http://user-service:3001
      - MATCHING_SERVICE_URL=http://matching-service:3002
      - MESSAGING_SERVICE_URL=http://messaging-service:3003
      - MEDIA_SERVICE_URL=http://media-service:3004
    ports:
      - "4000:4000"
    volumes:
      - ./backend/services/api-gateway:/app
      - /app/node_modules
    networks:
      - flamoral-network
    depends_on:
      - user-service
      - matching-service
      - messaging-service
      - media-service
    command: npm run dev

networks:
  flamoral-network:
    external: true
