# =============================================================================
# Flamoral Dating Platform - Infrastructure Pipeline
# =============================================================================
# Organization: citadelcloudmanagement
# Project: DatingPlatform
# URL: https://dev.azure.com/citadelcloudmanagement/DatingPlatform/_build
# =============================================================================
# This pipeline manages all Terraform infrastructure deployments.
# Uses script-based Terraform installation (no marketplace extension required)
# =============================================================================

name: Infrastructure-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - infrastructure/terraform/**
      - infrastructure/helm/**
      - infrastructure/kubernetes/**

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - infrastructure/terraform/**

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - test
      - prod

  - name: terraformAction
    displayName: 'Terraform Action'
    type: string
    default: 'plan'
    values:
      - plan
      - apply
      - destroy

  - name: autoApprove
    displayName: 'Auto-approve (Non-Prod Only)'
    type: boolean
    default: false

variables:
  - template: templates/variables-common.yml
  - group: datingplatform-terraform-common
  - name: workingDirectory
    value: 'infrastructure/terraform'
  - name: TF_VERSION
    value: '1.6.0'

pool:
  vmImage: 'ubuntu-latest'  # Microsoft-hosted agent

stages:
  # ============================================================================
  # STAGE 1: TERRAFORM VALIDATION
  # ============================================================================
  - stage: TerraformValidation
    displayName: 'Terraform Validation'
    jobs:
      - job: Validate
        displayName: 'Validate Terraform Configuration'
        steps:
          - checkout: self
            fetchDepth: 1

          # Install Terraform via script (no marketplace extension needed)
          - script: |
              echo "Installing Terraform $(TF_VERSION)..."

              # Check if terraform is already installed with correct version
              if command -v terraform &> /dev/null; then
                INSTALLED_VERSION=$(terraform version -json 2>/dev/null | grep -o '"terraform_version":"[^"]*"' | cut -d'"' -f4 || echo "0.0.0")
                if [ "$INSTALLED_VERSION" = "$(TF_VERSION)" ]; then
                  echo "Terraform $(TF_VERSION) already installed"
                  terraform version
                  exit 0
                fi
              fi

              # Download and install Terraform
              cd /tmp
              wget -q "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip" -O terraform.zip
              unzip -o terraform.zip
              sudo mv terraform /usr/local/bin/
              rm terraform.zip

              echo "Terraform installed successfully"
              terraform version
            displayName: 'Install Terraform $(TF_VERSION)'

          - script: |
              echo "Terraform Version:"
              terraform version

              echo "Formatting check..."
              terraform fmt -check -recursive $(workingDirectory) || echo "Format issues found"
            displayName: 'Terraform Version & Format Check'
            continueOnError: true

          - script: |
              echo "Setting up Azure authentication..."

              # Export ARM variables for Terraform
              export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
              export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
              export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
              export ARM_TENANT_ID=$(ARM_TENANT_ID)

              echo "====================================="
              echo "Bootstrapping Terraform Backend"
              echo "====================================="

              # Handle case where Azure DevOps variables are not resolved (still contain $())
              if [[ "$TF_STATE_RG" == *'$('* ]] || [[ -z "$TF_STATE_RG" ]]; then
                RESOURCE_GROUP="flamoral-rg"
              else
                RESOURCE_GROUP="$TF_STATE_RG"
              fi

              if [[ "$TF_STATE_SA" == *'$('* ]] || [[ -z "$TF_STATE_SA" ]]; then
                STORAGE_ACCOUNT="flamoralstate"
              else
                STORAGE_ACCOUNT="$TF_STATE_SA"
              fi

              if [[ "$TF_STATE_CONTAINER" == *'$('* ]] || [[ -z "$TF_STATE_CONTAINER" ]]; then
                CONTAINER="tfstate"
              else
                CONTAINER="$TF_STATE_CONTAINER"
              fi

              LOCATION="eastus"

              echo "Backend Configuration:"
              echo "  Resource Group: $RESOURCE_GROUP"
              echo "  Storage Account: $STORAGE_ACCOUNT"
              echo "  Container: $CONTAINER"

              # Check and create resource group
              if ! az group show --name "$RESOURCE_GROUP" &> /dev/null; then
                echo "Creating resource group..."
                az group create --name "$RESOURCE_GROUP" --location "$LOCATION" \
                  --tags "Purpose=TerraformState" "ManagedBy=Pipeline" "Project=Flamoral"
              else
                echo "Resource group exists"
              fi

              # Check and create storage account
              if ! az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" &> /dev/null; then
                echo "Creating storage account..."
                az storage account create \
                  --name "$STORAGE_ACCOUNT" \
                  --resource-group "$RESOURCE_GROUP" \
                  --location "$LOCATION" \
                  --sku Standard_LRS \
                  --https-only true \
                  --min-tls-version TLS1_2 \
                  --allow-blob-public-access false
              else
                echo "Storage account exists"
              fi

              # Get storage key and create container
              STORAGE_KEY=$(az storage account keys list --resource-group "$RESOURCE_GROUP" \
                --account-name "$STORAGE_ACCOUNT" --query '[0].value' -o tsv)

              if ! az storage container show --name "$CONTAINER" \
                --account-name "$STORAGE_ACCOUNT" --account-key "$STORAGE_KEY" &> /dev/null; then
                echo "Creating container..."
                az storage container create --name "$CONTAINER" \
                  --account-name "$STORAGE_ACCOUNT" --account-key "$STORAGE_KEY"
              else
                echo "Container exists"
              fi

              cd $(workingDirectory)

              echo "====================================="
              echo "Terraform Init for ${{ parameters.environment }}"
              echo "====================================="

              if terraform init \
                -backend-config="resource_group_name=$RESOURCE_GROUP" \
                -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
                -backend-config="container_name=$CONTAINER" \
                -backend-config="key=flamoral-${{ parameters.environment }}.tfstate" \
                -reconfigure \
                -upgrade; then
                echo "Terraform init successful with remote backend"
              else
                echo "Backend init failed, trying without backend to download providers..."
                terraform init -backend=false -upgrade || {
                  echo "Failed to initialize Terraform"
                  exit 1
                }
              fi

              echo "====================================="
              echo "Terraform Validate"
              echo "====================================="
              terraform validate
            displayName: 'Bootstrap Backend & Terraform Init'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              TF_STATE_RG: $(tfStateResourceGroup)
              TF_STATE_SA: $(tfStateStorageAccount)
              TF_STATE_CONTAINER: $(tfStateContainer)

          - script: |
              echo "Installing tflint..."
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash || echo "tflint installation skipped"

              cd $(workingDirectory)
              if command -v tflint &> /dev/null; then
                tflint --init || true
                tflint || true
              fi
            displayName: 'Terraform Lint (tflint)'
            continueOnError: true

  # ============================================================================
  # STAGE 2: TERRAFORM PLAN
  # ============================================================================
  - stage: TerraformPlan
    displayName: 'Terraform Plan (${{ parameters.environment }})'
    dependsOn: TerraformValidation
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: 'Generate Terraform Plan'
        steps:
          - checkout: self

          - script: |
              echo "Installing Terraform $(TF_VERSION)..."
              if ! command -v terraform &> /dev/null || [ "$(terraform version -json 2>/dev/null | grep -o '"terraform_version":"[^"]*"' | cut -d'"' -f4)" != "$(TF_VERSION)" ]; then
                cd /tmp
                wget -q "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip" -O terraform.zip
                unzip -o terraform.zip
                sudo mv terraform /usr/local/bin/
                rm terraform.zip
              fi
              terraform version
            displayName: 'Install Terraform'

          - script: |
              export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
              export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
              export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
              export ARM_TENANT_ID=$(ARM_TENANT_ID)

              cd $(workingDirectory)

              # Handle case where Azure DevOps variables are not resolved
              if [[ "$TF_STATE_RG" == *'$('* ]] || [[ -z "$TF_STATE_RG" ]]; then
                RESOURCE_GROUP="flamoral-rg"
              else
                RESOURCE_GROUP="$TF_STATE_RG"
              fi

              if [[ "$TF_STATE_SA" == *'$('* ]] || [[ -z "$TF_STATE_SA" ]]; then
                STORAGE_ACCOUNT="flamoralstate"
              else
                STORAGE_ACCOUNT="$TF_STATE_SA"
              fi

              if [[ "$TF_STATE_CONTAINER" == *'$('* ]] || [[ -z "$TF_STATE_CONTAINER" ]]; then
                CONTAINER="tfstate"
              else
                CONTAINER="$TF_STATE_CONTAINER"
              fi

              terraform init \
                -backend-config="resource_group_name=$RESOURCE_GROUP" \
                -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
                -backend-config="container_name=$CONTAINER" \
                -backend-config="key=flamoral-${{ parameters.environment }}.tfstate" \
                -reconfigure

              echo "====================================="
              echo "Terraform Plan for ${{ parameters.environment }}"
              echo "====================================="

              PLAN_EXIT_CODE=0
              terraform plan \
                -var="environment=${{ parameters.environment }}" \
                -out=tfplan-${{ parameters.environment }} \
                -detailed-exitcode || PLAN_EXIT_CODE=$?

              # Handle exit codes
              case $PLAN_EXIT_CODE in
                0) echo "No changes detected" ;;
                2) echo "Changes detected in plan" ;;
                *) echo "Plan failed"; exit $PLAN_EXIT_CODE ;;
              esac

              echo "====================================="
              echo "Plan Summary"
              echo "====================================="
              terraform show tfplan-${{ parameters.environment }}
              terraform show -json tfplan-${{ parameters.environment }} > tfplan-${{ parameters.environment }}.json
            displayName: 'Terraform Plan'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              TF_STATE_RG: $(tfStateResourceGroup)
              TF_STATE_SA: $(tfStateStorageAccount)
              TF_STATE_CONTAINER: $(tfStateContainer)

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(workingDirectory)/tfplan-${{ parameters.environment }}'
              artifact: 'terraform-plan-${{ parameters.environment }}'
              publishLocation: 'pipeline'
            displayName: 'Publish Terraform Plan'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(workingDirectory)/tfplan-${{ parameters.environment }}.json'
              artifact: 'terraform-plan-json-${{ parameters.environment }}'
              publishLocation: 'pipeline'
            displayName: 'Publish Plan JSON'
            condition: succeededOrFailed()

  # ============================================================================
  # STAGE 3: TERRAFORM APPLY - DEV
  # ============================================================================
  - stage: TerraformApplyDev
    displayName: 'Apply to Dev'
    dependsOn: TerraformPlan
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.environment }}', 'dev'),
        eq('${{ parameters.terraformAction }}', 'apply')
      )
    jobs:
      - job: ApplyDev
        displayName: 'Apply Infrastructure to Dev'
        steps:
          - checkout: self

          - script: |
              echo "Installing Terraform $(TF_VERSION)..."
              if ! command -v terraform &> /dev/null; then
                cd /tmp
                wget -q "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip" -O terraform.zip
                unzip -o terraform.zip
                sudo mv terraform /usr/local/bin/
                rm terraform.zip
              fi
              terraform version
            displayName: 'Install Terraform'

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'terraform-plan-dev'
              path: '$(workingDirectory)'
            displayName: 'Download Terraform Plan'

          - script: |
              export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
              export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
              export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
              export ARM_TENANT_ID=$(ARM_TENANT_ID)

              cd $(workingDirectory)

              terraform init \
                -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=flamoral-dev.tfstate"

              echo "====================================="
              echo "Applying Terraform Plan to Dev"
              echo "====================================="
              terraform apply -auto-approve tfplan-dev

              echo "====================================="
              echo "Terraform Outputs"
              echo "====================================="
              terraform output -json > outputs-dev.json
              terraform output
            displayName: 'Terraform Apply'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              TF_STATE_RG: $(tfStateResourceGroup)
              TF_STATE_SA: $(tfStateStorageAccount)
              TF_STATE_CONTAINER: $(tfStateContainer)

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(workingDirectory)/outputs-dev.json'
              artifact: 'terraform-outputs-dev'
              publishLocation: 'pipeline'
            displayName: 'Publish Terraform Outputs'
            condition: succeededOrFailed()

  # ============================================================================
  # STAGE 4: TERRAFORM APPLY - TEST
  # ============================================================================
  - stage: TerraformApplyTest
    displayName: 'Apply to Test'
    dependsOn: TerraformPlan
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.environment }}', 'test'),
        eq('${{ parameters.terraformAction }}', 'apply')
      )
    jobs:
      - job: ApplyTest
        displayName: 'Apply Infrastructure to Test'
        steps:
          - checkout: self

          - script: |
              echo "Installing Terraform $(TF_VERSION)..."
              if ! command -v terraform &> /dev/null; then
                cd /tmp
                wget -q "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip" -O terraform.zip
                unzip -o terraform.zip
                sudo mv terraform /usr/local/bin/
                rm terraform.zip
              fi
              terraform version
            displayName: 'Install Terraform'

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'terraform-plan-test'
              path: '$(workingDirectory)'
            displayName: 'Download Terraform Plan'

          - script: |
              export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
              export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
              export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
              export ARM_TENANT_ID=$(ARM_TENANT_ID)

              cd $(workingDirectory)

              terraform init \
                -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=flamoral-test.tfstate"

              echo "====================================="
              echo "Applying Terraform Plan to Test"
              echo "====================================="
              terraform apply -auto-approve tfplan-test

              terraform output -json > outputs-test.json
              terraform output
            displayName: 'Terraform Apply'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              TF_STATE_RG: $(tfStateResourceGroup)
              TF_STATE_SA: $(tfStateStorageAccount)
              TF_STATE_CONTAINER: $(tfStateContainer)

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(workingDirectory)/outputs-test.json'
              artifact: 'terraform-outputs-test'
              publishLocation: 'pipeline'
            displayName: 'Publish Terraform Outputs'
            condition: succeededOrFailed()

  # ============================================================================
  # STAGE 5: TERRAFORM APPLY - PRODUCTION (Manual trigger required)
  # ============================================================================
  - stage: TerraformApplyProd
    displayName: 'Apply to Production'
    dependsOn: TerraformPlan
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.environment }}', 'prod'),
        eq('${{ parameters.terraformAction }}', 'apply'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - job: WaitForApproval
        displayName: 'Manual Approval Required'
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: ''
              instructions: |
                =====================================
                PRODUCTION INFRASTRUCTURE CHANGE
                =====================================

                Environment: Production
                Build: $(Build.BuildNumber)
                Branch: $(Build.SourceBranch)

                Please review the Terraform plan artifact and approve
                this production infrastructure change.

                WARNING: This will modify production infrastructure!
              onTimeout: 'reject'
            timeoutInMinutes: 1440

      - job: ApplyProduction
        displayName: 'Apply Infrastructure to Production'
        dependsOn: WaitForApproval
        steps:
          - checkout: self

          - script: |
              echo "Installing Terraform $(TF_VERSION)..."
              if ! command -v terraform &> /dev/null; then
                cd /tmp
                wget -q "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip" -O terraform.zip
                unzip -o terraform.zip
                sudo mv terraform /usr/local/bin/
                rm terraform.zip
              fi
              terraform version
            displayName: 'Install Terraform'

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'terraform-plan-prod'
              path: '$(workingDirectory)'
            displayName: 'Download Terraform Plan'

          - script: |
              export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
              export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
              export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
              export ARM_TENANT_ID=$(ARM_TENANT_ID)

              cd $(workingDirectory)

              terraform init \
                -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=flamoral-prod.tfstate"

              echo "====================================="
              echo "PRODUCTION DEPLOYMENT STARTING"
              echo "====================================="
              echo "Build: $(Build.BuildNumber)"
              echo "Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              echo "====================================="

              terraform apply -auto-approve tfplan-prod

              echo "====================================="
              echo "PRODUCTION DEPLOYMENT COMPLETE"
              echo "====================================="
              terraform output -json > outputs-prod.json
              terraform output
            displayName: 'Terraform Apply to Production'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              TF_STATE_RG: $(tfStateResourceGroup)
              TF_STATE_SA: $(tfStateStorageAccount)
              TF_STATE_CONTAINER: $(tfStateContainer)

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(workingDirectory)/outputs-prod.json'
              artifact: 'terraform-outputs-prod'
              publishLocation: 'pipeline'
            displayName: 'Publish Production Outputs'
            condition: succeededOrFailed()

  # ============================================================================
  # STAGE 6: TERRAFORM DESTROY (MANUAL ONLY - NON-PROD)
  # ============================================================================
  - stage: TerraformDestroy
    displayName: 'Terraform Destroy (${{ parameters.environment }})'
    dependsOn: TerraformValidation
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.terraformAction }}', 'destroy'),
        ne('${{ parameters.environment }}', 'prod')
      )
    jobs:
      - job: ConfirmDestroy
        displayName: 'Confirm Destruction'
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: ''
              instructions: |
                =====================================
                INFRASTRUCTURE DESTRUCTION WARNING
                =====================================

                Environment: ${{ parameters.environment }}

                WARNING: This will DESTROY all infrastructure!

                This action is IRREVERSIBLE. Are you sure?
              onTimeout: 'reject'
            timeoutInMinutes: 60

      - job: Destroy
        displayName: 'Destroy Infrastructure'
        dependsOn: ConfirmDestroy
        steps:
          - checkout: self

          - script: |
              echo "Installing Terraform $(TF_VERSION)..."
              if ! command -v terraform &> /dev/null; then
                cd /tmp
                wget -q "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip" -O terraform.zip
                unzip -o terraform.zip
                sudo mv terraform /usr/local/bin/
                rm terraform.zip
              fi
              terraform version
            displayName: 'Install Terraform'

          - script: |
              export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
              export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
              export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
              export ARM_TENANT_ID=$(ARM_TENANT_ID)

              cd $(workingDirectory)

              # Handle case where Azure DevOps variables are not resolved
              if [[ "$TF_STATE_RG" == *'$('* ]] || [[ -z "$TF_STATE_RG" ]]; then
                RESOURCE_GROUP="flamoral-rg"
              else
                RESOURCE_GROUP="$TF_STATE_RG"
              fi

              if [[ "$TF_STATE_SA" == *'$('* ]] || [[ -z "$TF_STATE_SA" ]]; then
                STORAGE_ACCOUNT="flamoralstate"
              else
                STORAGE_ACCOUNT="$TF_STATE_SA"
              fi

              if [[ "$TF_STATE_CONTAINER" == *'$('* ]] || [[ -z "$TF_STATE_CONTAINER" ]]; then
                CONTAINER="tfstate"
              else
                CONTAINER="$TF_STATE_CONTAINER"
              fi

              terraform init \
                -backend-config="resource_group_name=$RESOURCE_GROUP" \
                -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
                -backend-config="container_name=$CONTAINER" \
                -backend-config="key=flamoral-${{ parameters.environment }}.tfstate" \
                -reconfigure

              echo "====================================="
              echo "DESTROYING INFRASTRUCTURE"
              echo "====================================="
              terraform destroy -auto-approve \
                -var="environment=${{ parameters.environment }}"

              echo "====================================="
              echo "INFRASTRUCTURE DESTROYED"
              echo "====================================="
            displayName: 'Terraform Destroy'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              TF_STATE_RG: $(tfStateResourceGroup)
              TF_STATE_SA: $(tfStateStorageAccount)
              TF_STATE_CONTAINER: $(tfStateContainer)

  # ============================================================================
  # STAGE 7: INFRASTRUCTURE VERIFICATION
  # ============================================================================
  - stage: VerifyInfrastructure
    displayName: 'Verify Infrastructure'
    dependsOn:
      - TerraformApplyDev
      - TerraformApplyTest
      - TerraformApplyProd
    condition: |
      or(
        succeeded('TerraformApplyDev'),
        succeeded('TerraformApplyTest'),
        succeeded('TerraformApplyProd')
      )
    jobs:
      - job: VerifyResources
        displayName: 'Verify Azure Resources'
        steps:
          - script: |
              echo "====================================="
              echo "Verifying Infrastructure - ${{ parameters.environment }}"
              echo "====================================="

              # Login to Azure
              az login --service-principal \
                -u $(ARM_CLIENT_ID) \
                -p $(ARM_CLIENT_SECRET) \
                --tenant $(ARM_TENANT_ID)

              az account set --subscription $(ARM_SUBSCRIPTION_ID)

              # Check Resource Group
              echo "Checking Resource Group..."
              az group show --name flamoral-${{ parameters.environment }}-rg || echo "Resource group check failed"

              # Check AKS Cluster
              echo "Checking AKS Cluster..."
              az aks show \
                --resource-group flamoral-${{ parameters.environment }}-rg \
                --name flamoral-${{ parameters.environment }}-aks \
                --query "powerState" || echo "AKS check failed"

              echo "====================================="
              echo "Infrastructure Verification Complete"
              echo "====================================="
            displayName: 'Verify Azure Resources'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
