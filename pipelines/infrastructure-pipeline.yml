# =============================================================================
# Flamoral Dating Platform - Infrastructure Pipeline
# =============================================================================
# Organization: citadelcloudmanagement
# Project: DatingPlatform
# URL: https://dev.azure.com/citadelcloudmanagement/DatingPlatform/_build
# =============================================================================
# This pipeline manages all Terraform infrastructure deployments.
# Includes: Validation, Planning, Apply with approval gates
# Environments: Dev -> Test -> Production
# =============================================================================

name: Infrastructure-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - infrastructure/terraform/**
      - infrastructure/helm/**
      - infrastructure/kubernetes/**

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - infrastructure/terraform/**

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - test
      - prod

  - name: terraformAction
    displayName: 'Terraform Action'
    type: string
    default: 'plan'
    values:
      - plan
      - apply
      - destroy

  - name: autoApprove
    displayName: 'Auto-approve (Non-Prod Only)'
    type: boolean
    default: false

variables:
  - template: templates/variables-common.yml
  - group: flamoral-terraform-vars
  - name: workingDirectory
    value: 'infrastructure/terraform'

pool:
  vmImage: $(vmImageName)

stages:
  # ============================================================================
  # STAGE 1: TERRAFORM VALIDATION
  # ============================================================================
  - stage: TerraformValidation
    displayName: 'Terraform Validation'
    jobs:
      - job: Validate
        displayName: 'Validate Terraform Configuration'
        steps:
          - checkout: self
            fetchDepth: 1

          - task: TerraformInstaller@0
            inputs:
              terraformVersion: $(terraformVersion)
            displayName: 'Install Terraform $(terraformVersion)'

          - script: |
              echo "Terraform Version:"
              terraform version

              echo "Formatting check..."
              terraform fmt -check -recursive $(workingDirectory) || echo "Format issues found"
            displayName: 'Terraform Version & Format Check'
            continueOnError: true

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export ARM_TENANT_ID=$tenantId

                cd $(workingDirectory)

                echo "====================================="
                echo "Terraform Init for ${{ parameters.environment }}"
                echo "====================================="
                terraform init \
                  -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                  -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                  -backend-config="container_name=$(tfStateContainer)" \
                  -backend-config="key=flamoral-${{ parameters.environment }}.tfstate"

                echo "====================================="
                echo "Terraform Validate"
                echo "====================================="
                terraform validate
            displayName: 'Terraform Init & Validate'

          - script: |
              echo "Installing tflint..."
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

              cd $(workingDirectory)
              tflint --init
              tflint || true
            displayName: 'Terraform Lint (tflint)'
            continueOnError: true

          - script: |
              echo "Installing tfsec..."
              wget -q https://github.com/aquasecurity/tfsec/releases/download/v1.28.1/tfsec-linux-amd64
              chmod +x tfsec-linux-amd64
              sudo mv tfsec-linux-amd64 /usr/local/bin/tfsec

              cd $(workingDirectory)
              tfsec . --format json > tfsec-results.json || true
              tfsec . || true
            displayName: 'Security Scan (tfsec)'
            continueOnError: true

          - task: PublishBuildArtifacts@1
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(workingDirectory)/tfsec-results.json'
              ArtifactName: 'tfsec-results'
            displayName: 'Publish Security Scan Results'

  # ============================================================================
  # STAGE 2: TERRAFORM PLAN
  # ============================================================================
  - stage: TerraformPlan
    displayName: 'Terraform Plan (${{ parameters.environment }})'
    dependsOn: TerraformValidation
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: 'Generate Terraform Plan'
        steps:
          - checkout: self

          - task: TerraformInstaller@0
            inputs:
              terraformVersion: $(terraformVersion)
            displayName: 'Install Terraform'

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export ARM_TENANT_ID=$tenantId

                cd $(workingDirectory)

                terraform init \
                  -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                  -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                  -backend-config="container_name=$(tfStateContainer)" \
                  -backend-config="key=flamoral-${{ parameters.environment }}.tfstate"

                echo "====================================="
                echo "Terraform Plan for ${{ parameters.environment }}"
                echo "====================================="
                terraform plan \
                  -var="environment=${{ parameters.environment }}" \
                  -out=tfplan-${{ parameters.environment }} \
                  -detailed-exitcode || PLAN_EXIT_CODE=$?

                # Handle exit codes
                case $PLAN_EXIT_CODE in
                  0) echo "No changes detected" ;;
                  2) echo "Changes detected in plan" ;;
                  *) echo "Plan failed"; exit $PLAN_EXIT_CODE ;;
                esac

                echo "====================================="
                echo "Plan Summary"
                echo "====================================="
                terraform show tfplan-${{ parameters.environment }}
                terraform show -json tfplan-${{ parameters.environment }} > tfplan-${{ parameters.environment }}.json
            displayName: 'Terraform Plan'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(workingDirectory)/tfplan-${{ parameters.environment }}'
              artifact: 'terraform-plan-${{ parameters.environment }}'
              publishLocation: 'pipeline'
            displayName: 'Publish Terraform Plan'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(workingDirectory)/tfplan-${{ parameters.environment }}.json'
              artifact: 'terraform-plan-json-${{ parameters.environment }}'
              publishLocation: 'pipeline'
            displayName: 'Publish Plan JSON'

          # Cost Estimation (optional)
          - script: |
              curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh || true

              cd $(workingDirectory)
              if [ -f "tfplan-${{ parameters.environment }}.json" ]; then
                infracost breakdown --path tfplan-${{ parameters.environment }}.json \
                  --format table \
                  --out-file infracost-report.txt || echo "Infracost estimation skipped"

                if [ -f "infracost-report.txt" ]; then
                  cat infracost-report.txt
                fi
              fi
            displayName: 'Cost Estimation (Infracost)'
            continueOnError: true
            condition: ne(variables['INFRACOST_API_KEY'], '')
            env:
              INFRACOST_API_KEY: $(INFRACOST_API_KEY)

  # ============================================================================
  # STAGE 3: TERRAFORM APPLY - DEV
  # ============================================================================
  - stage: TerraformApplyDev
    displayName: 'Apply to Dev'
    dependsOn: TerraformPlan
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.environment }}', 'dev'),
        eq('${{ parameters.terraformAction }}', 'apply')
      )
    jobs:
      - deployment: ApplyDev
        displayName: 'Apply Infrastructure to Dev'
        environment: 'terraform-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@0
                  inputs:
                    terraformVersion: $(terraformVersion)
                  displayName: 'Install Terraform'

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: 'terraform-plan-dev'
                    path: '$(workingDirectory)'
                  displayName: 'Download Terraform Plan'

                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      export ARM_TENANT_ID=$tenantId

                      cd $(workingDirectory)

                      terraform init \
                        -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                        -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                        -backend-config="container_name=$(tfStateContainer)" \
                        -backend-config="key=flamoral-dev.tfstate"

                      echo "====================================="
                      echo "Applying Terraform Plan to Dev"
                      echo "====================================="
                      terraform apply -auto-approve tfplan-dev

                      echo "====================================="
                      echo "Terraform Outputs"
                      echo "====================================="
                      terraform output -json > outputs-dev.json
                      terraform output
                  displayName: 'Terraform Apply'

                - task: PublishPipelineArtifact@1
                  inputs:
                    targetPath: '$(workingDirectory)/outputs-dev.json'
                    artifact: 'terraform-outputs-dev'
                    publishLocation: 'pipeline'
                  displayName: 'Publish Terraform Outputs'

  # ============================================================================
  # STAGE 4: TERRAFORM APPLY - TEST
  # ============================================================================
  - stage: TerraformApplyTest
    displayName: 'Apply to Test'
    dependsOn: TerraformPlan
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.environment }}', 'test'),
        eq('${{ parameters.terraformAction }}', 'apply')
      )
    jobs:
      - deployment: ApplyTest
        displayName: 'Apply Infrastructure to Test'
        environment: 'terraform-test'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@0
                  inputs:
                    terraformVersion: $(terraformVersion)
                  displayName: 'Install Terraform'

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: 'terraform-plan-test'
                    path: '$(workingDirectory)'
                  displayName: 'Download Terraform Plan'

                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      export ARM_TENANT_ID=$tenantId

                      cd $(workingDirectory)

                      terraform init \
                        -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                        -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                        -backend-config="container_name=$(tfStateContainer)" \
                        -backend-config="key=flamoral-test.tfstate"

                      echo "====================================="
                      echo "Applying Terraform Plan to Test"
                      echo "====================================="
                      terraform apply -auto-approve tfplan-test

                      terraform output -json > outputs-test.json
                      terraform output
                  displayName: 'Terraform Apply'

                - task: PublishPipelineArtifact@1
                  inputs:
                    targetPath: '$(workingDirectory)/outputs-test.json'
                    artifact: 'terraform-outputs-test'
                    publishLocation: 'pipeline'
                  displayName: 'Publish Terraform Outputs'

  # ============================================================================
  # STAGE 5: TERRAFORM APPLY - PRODUCTION (WITH APPROVAL)
  # ============================================================================
  - stage: TerraformApplyProd
    displayName: 'Apply to Production'
    dependsOn: TerraformPlan
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.environment }}', 'prod'),
        eq('${{ parameters.terraformAction }}', 'apply'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - deployment: ApplyProduction
        displayName: 'Apply Infrastructure to Production'
        environment: 'terraform-production'
        strategy:
          runOnce:
            preDeploy:
              steps:
                - task: ManualValidation@0
                  inputs:
                    notifyUsers: |
                      infrastructure-team@flamoral.com
                      cto@flamoral.com
                      devops@flamoral.com
                    instructions: |
                      =====================================
                      PRODUCTION INFRASTRUCTURE CHANGE
                      =====================================

                      Environment: Production
                      Build: $(Build.BuildNumber)
                      Branch: $(Build.SourceBranch)
                      Requested By: $(Build.RequestedFor)

                      Please review the Terraform plan artifact and approve
                      this production infrastructure change.

                      WARNING: This will modify production infrastructure!

                      Checklist:
                      - [ ] Reviewed Terraform plan output
                      - [ ] Verified no destructive changes
                      - [ ] Rollback plan is ready
                      - [ ] Notified relevant stakeholders
                    onTimeout: 'reject'
                  displayName: 'Manual Approval Required'
                  timeoutInMinutes: 1440  # 24 hours

            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@0
                  inputs:
                    terraformVersion: $(terraformVersion)
                  displayName: 'Install Terraform'

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: 'terraform-plan-prod'
                    path: '$(workingDirectory)'
                  displayName: 'Download Terraform Plan'

                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      export ARM_TENANT_ID=$tenantId

                      cd $(workingDirectory)

                      terraform init \
                        -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                        -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                        -backend-config="container_name=$(tfStateContainer)" \
                        -backend-config="key=flamoral-prod.tfstate"

                      echo "====================================="
                      echo "PRODUCTION DEPLOYMENT STARTING"
                      echo "====================================="
                      echo "Build: $(Build.BuildNumber)"
                      echo "Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
                      echo "====================================="

                      terraform apply tfplan-prod

                      echo "====================================="
                      echo "PRODUCTION DEPLOYMENT COMPLETE"
                      echo "====================================="
                      terraform output -json > outputs-prod.json
                      terraform output
                  displayName: 'Terraform Apply to Production'

                - task: PublishPipelineArtifact@1
                  inputs:
                    targetPath: '$(workingDirectory)/outputs-prod.json'
                    artifact: 'terraform-outputs-prod'
                    publishLocation: 'pipeline'
                  displayName: 'Publish Production Outputs'

                - script: |
                    echo "Production infrastructure deployment completed"
                    echo "Build: $(Build.BuildNumber)"
                    echo "Deployed by: $(Build.RequestedFor)"
                    echo "Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
                  displayName: 'Post-Deployment Summary'

  # ============================================================================
  # STAGE 6: TERRAFORM DESTROY (MANUAL ONLY - NON-PROD)
  # ============================================================================
  - stage: TerraformDestroy
    displayName: 'Terraform Destroy (${{ parameters.environment }})'
    dependsOn: TerraformValidation
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.terraformAction }}', 'destroy'),
        ne('${{ parameters.environment }}', 'prod')
      )
    jobs:
      - deployment: Destroy
        displayName: 'Destroy Infrastructure'
        environment: 'terraform-${{ parameters.environment }}-destroy'
        strategy:
          runOnce:
            preDeploy:
              steps:
                - task: ManualValidation@0
                  inputs:
                    notifyUsers: infrastructure-team@flamoral.com
                    instructions: |
                      =====================================
                      INFRASTRUCTURE DESTRUCTION WARNING
                      =====================================

                      Environment: ${{ parameters.environment }}

                      WARNING: This will DESTROY all infrastructure!

                      This action is IRREVERSIBLE. Are you sure?
                    onTimeout: 'reject'
                  displayName: 'Confirm Destroy'

            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@0
                  inputs:
                    terraformVersion: $(terraformVersion)
                  displayName: 'Install Terraform'

                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      export ARM_TENANT_ID=$tenantId

                      cd $(workingDirectory)

                      terraform init \
                        -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                        -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                        -backend-config="container_name=$(tfStateContainer)" \
                        -backend-config="key=flamoral-${{ parameters.environment }}.tfstate"

                      echo "====================================="
                      echo "DESTROYING INFRASTRUCTURE"
                      echo "====================================="
                      terraform destroy -auto-approve \
                        -var="environment=${{ parameters.environment }}"

                      echo "====================================="
                      echo "INFRASTRUCTURE DESTROYED"
                      echo "====================================="
                  displayName: 'Terraform Destroy'

  # ============================================================================
  # STAGE 7: INFRASTRUCTURE VERIFICATION
  # ============================================================================
  - stage: VerifyInfrastructure
    displayName: 'Verify Infrastructure'
    dependsOn:
      - TerraformApplyDev
      - TerraformApplyTest
      - TerraformApplyProd
    condition: |
      or(
        succeeded('TerraformApplyDev'),
        succeeded('TerraformApplyTest'),
        succeeded('TerraformApplyProd')
      )
    jobs:
      - job: VerifyResources
        displayName: 'Verify Azure Resources'
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "====================================="
                echo "Verifying Infrastructure - ${{ parameters.environment }}"
                echo "====================================="

                # Check Resource Group
                echo "Checking Resource Group..."
                az group show --name flamoral-${{ parameters.environment }}-rg || echo "Resource group check failed"

                # Check AKS Cluster
                echo "Checking AKS Cluster..."
                az aks show \
                  --resource-group flamoral-${{ parameters.environment }}-rg \
                  --name flamoral-${{ parameters.environment }}-aks \
                  --query "powerState" || echo "AKS check failed"

                # Check ACR
                echo "Checking Container Registry..."
                az acr show --name flamoralacr || echo "ACR check failed"

                echo "====================================="
                echo "Infrastructure Verification Complete"
                echo "====================================="
            displayName: 'Verify Azure Resources'
