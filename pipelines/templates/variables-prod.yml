# =============================================================================
# Flamoral Dating Platform - Production Environment Variables
# =============================================================================

variables:
  - name: environment
    value: 'production'
  - name: namespace
    value: 'flamoral-prod'
  - name: ingressHost
    value: 'flamoral.app'
  - name: apiHost
    value: 'api.flamoral.app'
  - name: replicaCount
    value: '5'
  - name: autoscalingEnabled
    value: 'true'
  - name: autoscalingMinReplicas
    value: '5'
  - name: autoscalingMaxReplicas
    value: '50'
  - name: targetCPUUtilization
    value: '70'
  - name: keyVaultName
    value: 'flamoral-prod-kv'
  - name: environmentApprovalRequired
    value: 'true'

  # Production Resource Limits
  - name: resourceRequestMemory
    value: '1Gi'
  - name: resourceRequestCpu
    value: '1000m'
  - name: resourceLimitMemory
    value: '2Gi'
  - name: resourceLimitCpu
    value: '2000m'
