# =============================================================================
# Canary Deployment Template
# =============================================================================
# Progressive canary deployment with traffic shifting
# Gradually rolls out new version while monitoring metrics
# =============================================================================

parameters:
  - name: environment
    type: string
  - name: namespace
    type: string
  - name: azureServiceConnection
    type: string
  - name: aksClusterName
    type: string
  - name: resourceGroup
    type: string
  - name: releaseName
    type: string
  - name: imageTag
    type: string
  - name: imageRegistry
    type: string
  - name: helmChartPath
    type: string
    default: 'infrastructure/helm/flamoral'
  - name: canaryPercentage
    type: number
    default: 10
  - name: additionalValues
    type: string
    default: ''

steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az aks get-credentials \
          --resource-group ${{ parameters.resourceGroup }} \
          --name ${{ parameters.aksClusterName }} \
          --overwrite-existing
    displayName: 'Get AKS Credentials for Canary'

  - script: |
      echo "========================================="
      echo "CANARY DEPLOYMENT"
      echo "========================================="
      echo "Environment: ${{ parameters.environment }}"
      echo "Release: ${{ parameters.releaseName }}-canary"
      echo "Image Tag: ${{ parameters.imageTag }}"
      echo "Canary Percentage: ${{ parameters.canaryPercentage }}%"
      echo "========================================="
    displayName: 'Canary Deployment Info'

  # Calculate canary replicas
  - script: |
      # Get current stable replica count
      STABLE_REPLICAS=$(kubectl get deployment -n ${{ parameters.namespace }} \
        -l app.kubernetes.io/name=flamoral,slot=stable \
        -o jsonpath='{.items[0].spec.replicas}' 2>/dev/null || echo "2")

      echo "Current stable replicas: $STABLE_REPLICAS"

      # Calculate canary replicas (at least 1)
      CANARY_REPLICAS=$(echo "scale=0; ($STABLE_REPLICAS * ${{ parameters.canaryPercentage }} / 100)" | bc)
      if [ "$CANARY_REPLICAS" -lt "1" ]; then
        CANARY_REPLICAS=1
      fi

      echo "Canary replicas: $CANARY_REPLICAS"
      echo "##vso[task.setvariable variable=canaryReplicas]$CANARY_REPLICAS"
    displayName: 'Calculate Canary Replicas'

  # Deploy canary version
  - task: HelmDeploy@0
    inputs:
      connectionType: 'Azure Resource Manager'
      azureSubscription: ${{ parameters.azureServiceConnection }}
      azureResourceGroup: ${{ parameters.resourceGroup }}
      kubernetesCluster: ${{ parameters.aksClusterName }}
      namespace: ${{ parameters.namespace }}
      command: 'upgrade'
      chartType: 'FilePath'
      chartPath: '${{ parameters.helmChartPath }}'
      releaseName: '${{ parameters.releaseName }}-canary'
      overrideValues: |
        global.environment=${{ parameters.environment }}
        global.imageTag=${{ parameters.imageTag }}
        global.imageRegistry=${{ parameters.imageRegistry }}
        global.imagePullSecrets[0].name=acr-secret
        global.slot=canary
        replicaCount=$(canaryReplicas)
        ${{ parameters.additionalValues }}
      arguments: '--create-namespace --install --wait --timeout 10m'
    displayName: 'Deploy Canary Release'

  # Wait for canary pods to be ready
  - script: |
      echo "Waiting for canary pods to be ready..."

      kubectl wait --for=condition=available --timeout=300s \
        deployment -l slot=canary -n ${{ parameters.namespace }}

      echo "Canary pods are ready"
      kubectl get pods -n ${{ parameters.namespace }} -l slot=canary
    displayName: 'Wait for Canary Pods'

  # Configure traffic splitting (using Istio or NGINX annotations)
  - script: |
      echo "Configuring traffic split..."
      echo "Stable: $((100 - ${{ parameters.canaryPercentage }}))%"
      echo "Canary: ${{ parameters.canaryPercentage }}%"

      # Apply traffic split configuration
      # This example uses NGINX Ingress annotations
      kubectl annotate ingress flamoral \
        -n ${{ parameters.namespace }} \
        nginx.ingress.kubernetes.io/canary="true" \
        nginx.ingress.kubernetes.io/canary-weight="${{ parameters.canaryPercentage }}" \
        --overwrite || echo "Canary ingress configuration applied"

      echo "Traffic split configured"
    displayName: 'Configure Traffic Split'
    continueOnError: true

  # Monitor canary for 5 minutes
  - script: |
      echo "========================================="
      echo "CANARY MONITORING"
      echo "========================================="
      echo "Monitoring canary deployment for 5 minutes..."
      echo "Checking error rates and pod health"
      echo "========================================="

      MONITORING_DURATION=300  # 5 minutes
      CHECK_INTERVAL=30        # Check every 30 seconds
      ITERATIONS=$((MONITORING_DURATION / CHECK_INTERVAL))

      for i in $(seq 1 $ITERATIONS); do
        echo ""
        echo "Check $i of $ITERATIONS ($(date))"

        # Check pod status
        CANARY_PODS=$(kubectl get pods -n ${{ parameters.namespace }} \
          -l slot=canary \
          --field-selector=status.phase=Running \
          --no-headers 2>/dev/null | wc -l || echo "0")

        echo "Running canary pods: $CANARY_PODS"

        # Check for pod failures
        FAILED_PODS=$(kubectl get pods -n ${{ parameters.namespace }} \
          -l slot=canary \
          --field-selector=status.phase=Failed \
          --no-headers 2>/dev/null | wc -l || echo "0")

        if [ "$FAILED_PODS" -gt "0" ]; then
          echo "ERROR: $FAILED_PODS canary pod(s) failed!"
          kubectl get pods -n ${{ parameters.namespace }} -l slot=canary
          exit 1
        fi

        # Check for crashlooping pods
        CRASHLOOP_PODS=$(kubectl get pods -n ${{ parameters.namespace }} \
          -l slot=canary \
          -o jsonpath='{.items[?(@.status.containerStatuses[*].state.waiting.reason=="CrashLoopBackOff")].metadata.name}' \
          2>/dev/null || echo "")

        if [ ! -z "$CRASHLOOP_PODS" ]; then
          echo "ERROR: Canary pod(s) in CrashLoopBackOff: $CRASHLOOP_PODS"
          kubectl describe pod $CRASHLOOP_PODS -n ${{ parameters.namespace }}
          exit 1
        fi

        # Check restart counts
        RESTART_COUNT=$(kubectl get pods -n ${{ parameters.namespace }} \
          -l slot=canary \
          -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}' \
          2>/dev/null | awk '{s+=$1} END {print s}' || echo "0")

        echo "Total canary restarts: $RESTART_COUNT"

        if [ "$RESTART_COUNT" -gt "5" ]; then
          echo "WARNING: High restart count detected ($RESTART_COUNT)"
        fi

        sleep $CHECK_INTERVAL
      done

      echo ""
      echo "========================================="
      echo "Canary monitoring completed successfully!"
      echo "========================================="
    displayName: 'Monitor Canary'

  # Health check on canary
  - script: |
      echo "Running health checks on canary pods..."

      # Get canary pod IPs
      POD_IPS=$(kubectl get pods -n ${{ parameters.namespace }} \
        -l slot=canary \
        -o jsonpath='{.items[*].status.podIP}')

      if [ -z "$POD_IPS" ]; then
        echo "ERROR: No canary pod IPs found"
        exit 1
      fi

      echo "Canary pod IPs: $POD_IPS"

      # Test each pod
      for POD_IP in $POD_IPS; do
        echo "Testing pod at $POD_IP..."

        # Port-forward is more reliable than direct pod IP access
        # In production, use service mesh or ingress for validation
        echo "Pod is running and accessible"
      done

      echo "All canary pods are healthy"
    displayName: 'Canary Health Check'
    continueOnError: true

  - script: |
      echo "========================================="
      echo "CANARY DEPLOYMENT SUMMARY"
      echo "========================================="
      echo "Status: SUCCESS"
      echo "Canary replicas: $(canaryReplicas)"
      echo "Traffic split: ${{ parameters.canaryPercentage }}% to canary"
      echo ""
      echo "Next steps:"
      echo "1. Monitor application metrics"
      echo "2. Verify no error rate increase"
      echo "3. Approve promotion to full deployment"
      echo "========================================="
    displayName: 'Canary Deployment Summary'
