# =============================================================================
# Flamoral Dating Platform - Dev Environment Variables
# =============================================================================

variables:
  - name: environment
    value: 'dev'
  - name: namespace
    value: 'flamoral-dev'
  - name: ingressHost
    value: 'dev.flamoral.app'
  - name: apiHost
    value: 'api.dev.flamoral.app'
  - name: replicaCount
    value: '1'
  - name: autoscalingEnabled
    value: 'false'
  - name: keyVaultName
    value: 'flamoral-dev-kv'
  - name: environmentApprovalRequired
    value: 'false'
