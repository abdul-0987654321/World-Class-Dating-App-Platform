# =============================================================================
# Flamoral Dating Platform - Test Environment Variables
# =============================================================================

variables:
  - name: environment
    value: 'test'
  - name: namespace
    value: 'flamoral-test'
  - name: ingressHost
    value: 'test.flamoral.app'
  - name: apiHost
    value: 'api.test.flamoral.app'
  - name: replicaCount
    value: '2'
  - name: autoscalingEnabled
    value: 'true'
  - name: autoscalingMinReplicas
    value: '2'
  - name: autoscalingMaxReplicas
    value: '5'
  - name: keyVaultName
    value: 'flamoral-test-kv'
  - name: environmentApprovalRequired
    value: 'false'
