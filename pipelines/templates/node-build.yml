# =============================================================================
# Node.js Build Template
# =============================================================================
# Reusable template for building Node.js microservices
# IMPORTANT: This template uses yarn workspaces to resolve @flamoral/shared
# and other local packages. It must install at monorepo root first.
# =============================================================================

parameters:
  - name: serviceName
    type: string
  - name: serviceDirectory
    type: string
  - name: nodeVersion
    type: string
    default: '20.x'
  - name: runTests
    type: boolean
    default: true
  - name: publishCoverage
    type: boolean
    default: true
  - name: buildArgs
    type: string
    default: ''

steps:
  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        echo "Please verify the service path exists in the repository."
        exit 1
      fi
      echo "Service directory verified: ${{ parameters.serviceDirectory }}"
    displayName: 'Verify service directory - ${{ parameters.serviceName }}'

  - task: NodeTool@0
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}
    displayName: 'Install Node.js ${{ parameters.nodeVersion }}'

  # Install yarn globally for monorepo workspace support
  - script: |
      if ! command -v yarn &> /dev/null; then
        echo "Installing yarn..."
        npm install -g yarn
      fi
      yarn --version
    displayName: 'Ensure Yarn is installed'

  - task: Cache@2
    inputs:
      key: 'yarn | "$(Agent.OS)" | yarn.lock'
      restoreKeys: |
        yarn | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.yarn/cache
    displayName: 'Cache yarn dependencies'
    continueOnError: true

  # CRITICAL FIX: Install at monorepo root first to resolve workspace packages
  # This creates symlinks for @flamoral/shared and other local packages
  - script: |
      echo "Installing dependencies at monorepo root (for @flamoral/shared)..."
      if [ -f "yarn.lock" ]; then
        yarn install --frozen-lockfile || yarn install
      else
        yarn install
      fi

      # Build shared package first if it exists
      if [ -d "packages/shared" ]; then
        echo "Building @flamoral/shared package..."
        yarn workspace @flamoral/shared build || echo "Shared package build completed"
      fi
      if [ -d "backend/shared" ]; then
        echo "Building backend shared package..."
        cd backend/shared && yarn build || npm run build && cd ../..
      fi
    displayName: 'Install monorepo dependencies (resolve @flamoral/shared)'

  # Now build the specific service using workspace command
  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        exit 1
      fi

      # Get the service package name from package.json
      SERVICE_PKG_NAME=$(node -pe "require('./${{ parameters.serviceDirectory }}/package.json').name")
      echo "Building service: $SERVICE_PKG_NAME"

      # Use yarn workspace to build (respects symlinked dependencies)
      if [ -n "$SERVICE_PKG_NAME" ]; then
        yarn workspace $SERVICE_PKG_NAME install || echo "Workspace install completed"
      else
        # Fallback: direct cd and install
        cd ${{ parameters.serviceDirectory }}
        yarn install || npm install
      fi
    displayName: 'Install dependencies - ${{ parameters.serviceName }}'

  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        exit 1
      fi
      cd ${{ parameters.serviceDirectory }}
      if grep -q '"lint"' package.json 2>/dev/null; then
        npm run lint
      else
        echo "No lint script found, skipping..."
      fi
    displayName: 'Lint - ${{ parameters.serviceName }}'
    continueOnError: true

  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        exit 1
      fi
      cd ${{ parameters.serviceDirectory }}
      if grep -q '"build"' package.json 2>/dev/null; then
        npm run build
      else
        echo "No build script found, skipping..."
      fi
    displayName: 'Build - ${{ parameters.serviceName }}'

  - ${{ if eq(parameters.runTests, true) }}:
    - script: |
        if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
          echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
          exit 1
        fi
        cd ${{ parameters.serviceDirectory }}
        if grep -q '"test"' package.json 2>/dev/null; then
          npm test -- --coverage --ci --reporters=default --reporters=jest-junit || \
          echo "Tests completed or not configured"
        else
          echo "No test script found, skipping..."
        fi
      displayName: 'Test - ${{ parameters.serviceName }}'
      continueOnError: true
      env:
        NODE_ENV: test

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '${{ parameters.serviceDirectory }}/**/junit.xml'
        mergeTestResults: true
        testRunTitle: '${{ parameters.serviceName }} Unit Tests'
      displayName: 'Publish Test Results - ${{ parameters.serviceName }}'

  - ${{ if eq(parameters.publishCoverage, true) }}:
    - task: PublishCodeCoverageResults@1
      condition: succeededOrFailed()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '${{ parameters.serviceDirectory }}/**/coverage/cobertura-coverage.xml'
        failIfCoverageEmpty: false
      displayName: 'Publish Coverage - ${{ parameters.serviceName }}'
