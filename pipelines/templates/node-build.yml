# =============================================================================
# Node.js Build Template
# =============================================================================
# Reusable template for building Node.js microservices
# CRITICAL: Services depend on @flamoral/shared which is a LOCAL workspace package
# We MUST install at monorepo root first to create proper symlinks
# =============================================================================

parameters:
  - name: serviceName
    type: string
  - name: serviceDirectory
    type: string
  - name: nodeVersion
    type: string
    default: '20.x'
  - name: runTests
    type: boolean
    default: true
  - name: publishCoverage
    type: boolean
    default: true
  - name: buildArgs
    type: string
    default: ''

steps:
  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        echo "Please verify the service path exists in the repository."
        exit 1
      fi
      echo "Service directory verified: ${{ parameters.serviceDirectory }}"
    displayName: 'Verify service directory - ${{ parameters.serviceName }}'

  - task: NodeTool@0
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}
    displayName: 'Install Node.js ${{ parameters.nodeVersion }}'

  # Install yarn globally for monorepo workspace support
  - script: |
      if ! command -v yarn &> /dev/null; then
        echo "Installing yarn..."
        npm install -g yarn
      fi
      yarn --version
    displayName: 'Ensure Yarn is installed'

  # Cache at monorepo level (yarn.lock is at root)
  - task: Cache@2
    inputs:
      key: 'yarn | "$(Agent.OS)" | yarn.lock'
      restoreKeys: |
        yarn | "$(Agent.OS)"
      path: node_modules
    displayName: 'Cache yarn dependencies'
    continueOnError: true

  # Cache npm for service-level node_modules
  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | ${{ parameters.serviceDirectory }}/package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)" | ${{ parameters.serviceDirectory }}
        npm | "$(Agent.OS)"
      path: ${{ parameters.serviceDirectory }}/node_modules
    displayName: 'Cache npm dependencies - ${{ parameters.serviceName }}'
    continueOnError: true

  # CRITICAL FIX: Build @flamoral/shared first, then install deps, then link
  # Step 1: Build the shared package that services depend on
  - script: |
      echo "=========================================="
      echo "Building @flamoral/shared package first"
      echo "=========================================="

      # Build backend/shared first (this is what services import)
      if [ -d "backend/shared" ]; then
        echo "Building backend/shared..."
        cd backend/shared
        npm install --prefer-offline --no-audit || npm install
        npm run build || echo "Build script not found or completed"
        cd ../..
        echo "✓ backend/shared built successfully"
      fi

      # Also build packages/shared if it exists
      if [ -d "packages/shared" ]; then
        echo "Building packages/shared..."
        cd packages/shared
        npm install --prefer-offline --no-audit || npm install
        npm run build || echo "Build script not found or completed"
        cd ../..
        echo "✓ packages/shared built successfully"
      fi
    displayName: 'Build @flamoral/shared package'

  # Step 2: Pre-link @flamoral/shared BEFORE npm install
  # This ensures the package exists when npm tries to resolve it
  - script: |
      echo "=========================================="
      echo "Pre-linking @flamoral/shared for ${{ parameters.serviceName }}"
      echo "=========================================="

      SERVICE_DIR="${{ parameters.serviceDirectory }}"

      # Create node_modules/@flamoral directory
      mkdir -p "$SERVICE_DIR/node_modules/@flamoral"

      # Link backend/shared as @flamoral/shared BEFORE npm install
      if [ -d "backend/shared" ]; then
        echo "Linking backend/shared -> $SERVICE_DIR/node_modules/@flamoral/shared"
        rm -rf "$SERVICE_DIR/node_modules/@flamoral/shared"
        cp -r backend/shared "$SERVICE_DIR/node_modules/@flamoral/shared"
        echo "✓ @flamoral/shared pre-linked successfully"
      fi
    displayName: 'Pre-link @flamoral/shared - ${{ parameters.serviceName }}'

  # Step 3: Install service dependencies
  # CRITICAL: @flamoral/shared is a LOCAL package, NOT on npm registry
  # We must ensure it's pre-linked before AND after npm install
  - script: |
      echo "=========================================="
      echo "Installing dependencies for ${{ parameters.serviceName }}"
      echo "=========================================="

      SERVICE_DIR="${{ parameters.serviceDirectory }}"
      cd "$SERVICE_DIR"

      # First, ensure @flamoral/shared exists before npm tries to resolve it
      # This prevents npm from trying to fetch it from the registry
      mkdir -p "node_modules/@flamoral"
      if [ -d "$(pwd)/../../shared" ]; then
        echo "Pre-linking @flamoral/shared from backend/shared..."
        rm -rf "node_modules/@flamoral/shared"
        cp -r "$(pwd)/../../shared" "node_modules/@flamoral/shared"
      fi

      # Create a temporary modified package.json without @flamoral/shared
      # This prevents npm from trying to fetch it from the registry
      echo "Creating temporary package.json without @flamoral/shared..."
      cp package.json package.json.bak

      # Remove @flamoral/shared from dependencies using sed
      sed -i 's/"@flamoral\/shared"[^,}]*,\?//g' package.json
      # Clean up any trailing commas or empty objects
      sed -i 's/,\s*}/}/g' package.json
      sed -i 's/{\s*,/{/g' package.json

      # Install dependencies (without @flamoral/shared)
      echo "Running npm install (without @flamoral/shared)..."
      npm install --prefer-offline --no-audit 2>&1 || {
        echo "npm install with prefer-offline failed, retrying..."
        npm install --no-audit 2>&1 || {
          echo "npm install failed, but continuing..."
        }
      }

      # Restore original package.json
      mv package.json.bak package.json

      # Re-link @flamoral/shared after npm install
      echo "Re-linking @flamoral/shared..."
      mkdir -p "node_modules/@flamoral"
      if [ -d "$(pwd)/../../shared" ]; then
        rm -rf "node_modules/@flamoral/shared"
        cp -r "$(pwd)/../../shared" "node_modules/@flamoral/shared"
        echo "✓ @flamoral/shared linked successfully"
      fi

      # Verify critical devDependencies are installed
      echo "Verifying dependencies..."
      if [ ! -d "node_modules/@types/node" ]; then
        echo "WARNING: @types/node not found, installing explicitly..."
        npm install --save-dev @types/node --no-audit
      fi
      if [ ! -f "node_modules/.bin/tsc" ] && [ ! -f "node_modules/typescript/bin/tsc" ]; then
        echo "WARNING: typescript not found, installing explicitly..."
        npm install --save-dev typescript --no-audit
      fi

      echo "✓ Dependencies installed for ${{ parameters.serviceName }}"
    displayName: 'Install dependencies - ${{ parameters.serviceName }}'

  # Step 4: Re-link @flamoral/shared AFTER npm install (in case it was overwritten)
  - script: |
      echo "=========================================="
      echo "Re-linking @flamoral/shared for ${{ parameters.serviceName }}"
      echo "=========================================="

      SERVICE_DIR="${{ parameters.serviceDirectory }}"

      # Ensure @flamoral/shared is still properly linked after npm install
      if [ -d "backend/shared" ]; then
        echo "Re-linking backend/shared -> $SERVICE_DIR/node_modules/@flamoral/shared"
        rm -rf "$SERVICE_DIR/node_modules/@flamoral/shared"
        cp -r backend/shared "$SERVICE_DIR/node_modules/@flamoral/shared"
        echo "✓ @flamoral/shared re-linked successfully"

        # Verify the link
        if [ -f "$SERVICE_DIR/node_modules/@flamoral/shared/package.json" ]; then
          echo "✓ Verified: @flamoral/shared package.json exists"
        else
          echo "WARNING: @flamoral/shared link may have failed"
        fi
      fi

      # List what's in node_modules/@flamoral for debugging
      echo "Contents of $SERVICE_DIR/node_modules/@flamoral:"
      ls -la "$SERVICE_DIR/node_modules/@flamoral/" || echo "Directory empty or not found"
    displayName: 'Re-link @flamoral/shared - ${{ parameters.serviceName }}'

  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        exit 1
      fi
      cd ${{ parameters.serviceDirectory }}
      if grep -q '"lint"' package.json 2>/dev/null; then
        npm run lint
      else
        echo "No lint script found, skipping..."
      fi
    displayName: 'Lint - ${{ parameters.serviceName }}'
    continueOnError: true

  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        exit 1
      fi
      cd ${{ parameters.serviceDirectory }}
      if grep -q '"build"' package.json 2>/dev/null; then
        npm run build
      else
        echo "No build script found, skipping..."
      fi
    displayName: 'Build - ${{ parameters.serviceName }}'

  - ${{ if eq(parameters.runTests, true) }}:
    - script: |
        if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
          echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
          exit 1
        fi
        cd ${{ parameters.serviceDirectory }}
        if grep -q '"test"' package.json 2>/dev/null; then
          npm test -- --coverage --ci --reporters=default --reporters=jest-junit || \
          echo "Tests completed or not configured"
        else
          echo "No test script found, skipping..."
        fi
      displayName: 'Test - ${{ parameters.serviceName }}'
      continueOnError: true
      env:
        NODE_ENV: test

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '${{ parameters.serviceDirectory }}/**/junit.xml'
        mergeTestResults: true
        testRunTitle: '${{ parameters.serviceName }} Unit Tests'
      displayName: 'Publish Test Results - ${{ parameters.serviceName }}'

  - ${{ if eq(parameters.publishCoverage, true) }}:
    - task: PublishCodeCoverageResults@1
      condition: succeededOrFailed()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '${{ parameters.serviceDirectory }}/**/coverage/cobertura-coverage.xml'
        failIfCoverageEmpty: false
      displayName: 'Publish Coverage - ${{ parameters.serviceName }}'
