# =============================================================================
# Node.js Build Template
# =============================================================================
# Reusable template for building Node.js microservices
# =============================================================================

parameters:
  - name: serviceName
    type: string
  - name: serviceDirectory
    type: string
  - name: nodeVersion
    type: string
    default: '20.x'
  - name: runTests
    type: boolean
    default: true
  - name: publishCoverage
    type: boolean
    default: true
  - name: buildArgs
    type: string
    default: ''

steps:
  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        echo "Please verify the service path exists in the repository."
        exit 1
      fi
      echo "Service directory verified: ${{ parameters.serviceDirectory }}"
    displayName: 'Verify service directory - ${{ parameters.serviceName }}'

  - task: NodeTool@0
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}
    displayName: 'Install Node.js ${{ parameters.nodeVersion }}'

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | ${{ parameters.serviceDirectory }}/package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)" | ${{ parameters.serviceDirectory }}
        npm | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.npm
    displayName: 'Cache npm dependencies'
    continueOnError: true

  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        exit 1
      fi
      cd ${{ parameters.serviceDirectory }}
      if [ -f "package-lock.json" ]; then
        npm ci
      else
        npm install
      fi
    displayName: 'Install dependencies - ${{ parameters.serviceName }}'

  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        exit 1
      fi
      cd ${{ parameters.serviceDirectory }}
      if grep -q '"lint"' package.json 2>/dev/null; then
        npm run lint
      else
        echo "No lint script found, skipping..."
      fi
    displayName: 'Lint - ${{ parameters.serviceName }}'
    continueOnError: true

  - script: |
      if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
        echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
        exit 1
      fi
      cd ${{ parameters.serviceDirectory }}
      if grep -q '"build"' package.json 2>/dev/null; then
        npm run build
      else
        echo "No build script found, skipping..."
      fi
    displayName: 'Build - ${{ parameters.serviceName }}'

  - ${{ if eq(parameters.runTests, true) }}:
    - script: |
        if [ ! -d "${{ parameters.serviceDirectory }}" ]; then
          echo "ERROR: Service directory not found: ${{ parameters.serviceDirectory }}"
          exit 1
        fi
        cd ${{ parameters.serviceDirectory }}
        if grep -q '"test"' package.json 2>/dev/null; then
          npm test -- --coverage --ci --reporters=default --reporters=jest-junit || \
          echo "Tests completed or not configured"
        else
          echo "No test script found, skipping..."
        fi
      displayName: 'Test - ${{ parameters.serviceName }}'
      continueOnError: true
      env:
        NODE_ENV: test

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '${{ parameters.serviceDirectory }}/**/junit.xml'
        mergeTestResults: true
        testRunTitle: '${{ parameters.serviceName }} Unit Tests'
      displayName: 'Publish Test Results - ${{ parameters.serviceName }}'

  - ${{ if eq(parameters.publishCoverage, true) }}:
    - task: PublishCodeCoverageResults@1
      condition: succeededOrFailed()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '${{ parameters.serviceDirectory }}/**/coverage/cobertura-coverage.xml'
        failIfCoverageEmpty: false
      displayName: 'Publish Coverage - ${{ parameters.serviceName }}'
