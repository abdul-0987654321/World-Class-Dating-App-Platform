# Terraform Init Template
# Initializes Terraform with Azure backend configuration

parameters:
  - name: environment
    type: string
  - name: workingDirectory
    type: string

steps:
  - task: Cache@2
    displayName: 'Cache Terraform plugins'
    inputs:
      key: 'terraform | "$(Agent.OS)" | ${{ parameters.environment }} | **/*.tf'
      path: '$(Pipeline.Workspace)/.terraform.d/plugin-cache'
      restoreKeys: |
        terraform | "$(Agent.OS)" | ${{ parameters.environment }}
        terraform | "$(Agent.OS)"

  - script: |
      if ! command -v terraform &> /dev/null; then
        curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
        sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
        sudo apt-get update && sudo apt-get install -y terraform=$(TF_VERSION)-1
      fi
      terraform version
    displayName: 'Ensure Terraform $(TF_VERSION)'
    workingDirectory: ${{ parameters.workingDirectory }}

  - script: |
      export TF_PLUGIN_CACHE_DIR="$(Pipeline.Workspace)/.terraform.d/plugin-cache"
      mkdir -p $TF_PLUGIN_CACHE_DIR

      # Configure backend dynamically using environment variables for Terraform
      export ARM_CLIENT_ID="$(ARM_CLIENT_ID)"
      export ARM_CLIENT_SECRET="$(ARM_CLIENT_SECRET)"
      export ARM_SUBSCRIPTION_ID="$(ARM_SUBSCRIPTION_ID)"
      export ARM_TENANT_ID="$(ARM_TENANT_ID)"

      # Login to Azure CLI for backend operations
      echo "##[group]Azure CLI Login"
      az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" --output none
      az account set --subscription "$ARM_SUBSCRIPTION_ID"
      echo "Logged in to Azure CLI as service principal"
      echo "##[endgroup]"

      echo "##[group]Initializing Terraform for ${{ parameters.environment }}"

      # Initialize with retry logic
      MAX_RETRIES=3
      RETRY_COUNT=0

      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        if terraform init \
          -backend-config="resource_group_name=$(TF_STATE_RESOURCE_GROUP)" \
          -backend-config="storage_account_name=$(TF_STATE_STORAGE_ACCOUNT)" \
          -backend-config="container_name=$(TF_STATE_CONTAINER)" \
          -backend-config="key=${{ parameters.environment }}.terraform.tfstate" \
          -reconfigure \
          -upgrade; then
          echo "Terraform init successful"
          break
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "##[warning]Terraform init failed, retry $RETRY_COUNT of $MAX_RETRIES"
            sleep 10
          else
            echo "##[error]Terraform init failed after $MAX_RETRIES attempts"
            exit 1
          fi
        fi
      done

      echo "##[endgroup]"
    displayName: 'Terraform Init - ${{ parameters.environment }}'
    workingDirectory: ${{ parameters.workingDirectory }}
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
