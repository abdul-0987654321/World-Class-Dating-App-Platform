# =============================================================================
# Docker Build and Push Template
# =============================================================================
# Reusable template for building and pushing Docker images to ACR
# =============================================================================

parameters:
  - name: serviceName
    type: string
  - name: dockerfilePath
    type: string
  - name: buildContext
    type: string
  - name: imageRepository
    type: string
    default: 'flamoral'
  - name: imageTag
    type: string
    default: '$(Build.BuildId)'
  - name: containerRegistry
    type: string
    default: 'acr-datingapp-connection'
  - name: pushImage
    type: boolean
    default: true
  - name: buildArgs
    type: string
    default: '--build-arg NODE_ENV=production'
  - name: scanImage
    type: boolean
    default: true

steps:
  - task: Docker@2
    displayName: 'Login to ACR'
    inputs:
      command: login
      containerRegistry: ${{ parameters.containerRegistry }}

  - task: Docker@2
    displayName: 'Build - ${{ parameters.serviceName }}'
    inputs:
      command: build
      repository: '${{ parameters.imageRepository }}/${{ parameters.serviceName }}'
      dockerfile: ${{ parameters.dockerfilePath }}
      buildContext: ${{ parameters.buildContext }}
      tags: |
        ${{ parameters.imageTag }}
        latest
      arguments: |
        ${{ parameters.buildArgs }}
        --build-arg BUILD_DATE=$(Build.BuildNumber)
        --build-arg VCS_REF=$(Build.SourceVersion)
        --label org.opencontainers.image.source=$(Build.Repository.Uri)
        --label org.opencontainers.image.revision=$(Build.SourceVersion)

  - ${{ if eq(parameters.scanImage, true) }}:
    - script: |
        echo "Installing Trivy..."
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy -y

        echo "Scanning image for vulnerabilities..."
        trivy image --severity HIGH,CRITICAL \
          --exit-code 0 \
          --format table \
          ${{ parameters.imageRepository }}/${{ parameters.serviceName }}:${{ parameters.imageTag }} || true
      displayName: 'Security Scan - ${{ parameters.serviceName }}'
      continueOnError: true

  - ${{ if eq(parameters.pushImage, true) }}:
    - task: Docker@2
      displayName: 'Push - ${{ parameters.serviceName }}'
      inputs:
        command: push
        repository: '${{ parameters.imageRepository }}/${{ parameters.serviceName }}'
        containerRegistry: ${{ parameters.containerRegistry }}
        tags: |
          ${{ parameters.imageTag }}
          latest

  - script: |
      echo "Image built and pushed successfully"
      echo "Repository: ${{ parameters.imageRepository }}/${{ parameters.serviceName }}"
      echo "Tags: ${{ parameters.imageTag }}, latest"
    displayName: 'Summary - ${{ parameters.serviceName }}'
