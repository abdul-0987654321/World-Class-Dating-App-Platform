# =============================================================================
# Rollback Deployment Template
# =============================================================================
# Automated rollback mechanism for failed deployments
# Supports Helm rollback and database migration rollback
# =============================================================================

parameters:
  - name: environment
    type: string
  - name: namespace
    type: string
  - name: azureServiceConnection
    type: string
  - name: aksClusterName
    type: string
  - name: resourceGroup
    type: string
  - name: releaseName
    type: string
  - name: rollbackDatabase
    type: boolean
    default: false
  - name: imageRegistry
    type: string
  - name: imageTag
    type: string

steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az aks get-credentials \
          --resource-group ${{ parameters.resourceGroup }} \
          --name ${{ parameters.aksClusterName }} \
          --overwrite-existing
    displayName: 'Get AKS Credentials for Rollback'

  - script: |
      echo "========================================="
      echo "ROLLBACK INITIATED"
      echo "========================================="
      echo "Environment: ${{ parameters.environment }}"
      echo "Release: ${{ parameters.releaseName }}"
      echo "Namespace: ${{ parameters.namespace }}"
      echo "Rollback Database: ${{ parameters.rollbackDatabase }}"
      echo "========================================="
    displayName: 'Rollback Info'

  # Database rollback (if enabled)
  - ${{ if eq(parameters.rollbackDatabase, true) }}:
    - script: |
        echo "Rolling back database migrations..."

        # Delete existing rollback job if present
        kubectl delete job database-migration-rollback-${{ parameters.environment }} \
          -n ${{ parameters.namespace }} \
          --ignore-not-found=true

        # Wait for deletion
        kubectl wait --for=delete job/database-migration-rollback-${{ parameters.environment }} \
          -n ${{ parameters.namespace }} \
          --timeout=60s || true
      displayName: 'Clean Up Previous Rollback Job'

    - task: Kubernetes@1
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: ${{ parameters.azureServiceConnection }}
        azureResourceGroup: ${{ parameters.resourceGroup }}
        kubernetesCluster: ${{ parameters.aksClusterName }}
        namespace: ${{ parameters.namespace }}
        command: 'apply'
        useConfigurationFile: true
        inline: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: database-migration-rollback-${{ parameters.environment }}
            namespace: ${{ parameters.namespace }}
            labels:
              app: flamoral
              component: migration-rollback
          spec:
            ttlSecondsAfterFinished: 300
            backoffLimit: 1
            template:
              metadata:
                labels:
                  app: flamoral
                  component: migration-rollback
              spec:
                restartPolicy: Never
                containers:
                  - name: migration-rollback
                    image: ${{ parameters.imageRegistry }}/flamoral/migration:${{ parameters.imageTag }}
                    imagePullPolicy: Always
                    command: ["npm", "run", "migrate:rollback"]
                    env:
                      - name: NODE_ENV
                        value: "${{ parameters.environment }}"
                      - name: DB_HOST
                        valueFrom:
                          secretKeyRef:
                            name: database-secrets
                            key: DB_HOST
                      - name: DB_PORT
                        valueFrom:
                          secretKeyRef:
                            name: database-secrets
                            key: DB_PORT
                      - name: DB_NAME
                        valueFrom:
                          secretKeyRef:
                            name: database-secrets
                            key: DB_NAME
                      - name: DB_USER
                        valueFrom:
                          secretKeyRef:
                            name: database-secrets
                            key: DB_USER
                      - name: DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: database-secrets
                            key: DB_PASSWORD
                      - name: DB_SSL
                        value: "true"
                    resources:
                      requests:
                        memory: "256Mi"
                        cpu: "100m"
                      limits:
                        memory: "512Mi"
                        cpu: "500m"
                imagePullSecrets:
                  - name: acr-secret
      displayName: 'Create Database Rollback Job'

    - script: |
        echo "Waiting for database rollback to complete..."

        kubectl wait --for=condition=complete \
          job/database-migration-rollback-${{ parameters.environment }} \
          -n ${{ parameters.namespace }} \
          --timeout=300s

        if [ $? -eq 0 ]; then
          echo "Database rollback completed successfully!"
          kubectl logs job/database-migration-rollback-${{ parameters.environment }} -n ${{ parameters.namespace }}
        else
          echo "Database rollback failed or timed out!"
          kubectl logs job/database-migration-rollback-${{ parameters.environment }} -n ${{ parameters.namespace }}
          exit 1
        fi
      displayName: 'Wait for Database Rollback'

  # Helm rollback
  - task: HelmDeploy@0
    inputs:
      connectionType: 'Azure Resource Manager'
      azureSubscription: ${{ parameters.azureServiceConnection }}
      azureResourceGroup: ${{ parameters.resourceGroup }}
      kubernetesCluster: ${{ parameters.aksClusterName }}
      namespace: ${{ parameters.namespace }}
      command: 'rollback'
      arguments: '${{ parameters.releaseName }} 0 --wait --timeout 10m'
    displayName: 'Helm Rollback to Previous Version'

  # Verify rollback
  - script: |
      echo "Verifying rollback..."

      # Wait for pods to stabilize
      sleep 30

      # Check deployment status
      kubectl rollout status deployment -n ${{ parameters.namespace }} -l app.kubernetes.io/name=flamoral --timeout=300s

      # Get pod status
      kubectl get pods -n ${{ parameters.namespace }} -l app.kubernetes.io/name=flamoral

      echo "Rollback verification complete"
    displayName: 'Verify Rollback'

  # Post-rollback health check
  - script: |
      echo "Running post-rollback health checks..."

      # Wait for services to stabilize
      sleep 30

      # Check if services are responding
      ENDPOINTS=$(kubectl get endpoints -n ${{ parameters.namespace }} -l app.kubernetes.io/name=flamoral -o jsonpath='{.items[*].subsets[*].addresses[*].ip}' | tr ' ' '\n')

      if [ -z "$ENDPOINTS" ]; then
        echo "ERROR: No endpoints found after rollback"
        exit 1
      fi

      echo "Endpoints found: $ENDPOINTS"
      echo "Post-rollback health check passed"
    displayName: 'Post-Rollback Health Check'

  - script: |
      echo "========================================="
      echo "ROLLBACK COMPLETED"
      echo "========================================="
      echo "Environment: ${{ parameters.environment }}"
      echo "Release: ${{ parameters.releaseName }}"
      echo "Status: SUCCESS"
      echo "========================================="
    displayName: 'Rollback Summary'
