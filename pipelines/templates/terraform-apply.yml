# Terraform Apply Template
# Applies the execution plan and captures outputs

parameters:
  - name: environment
    type: string
  - name: workingDirectory
    type: string
  - name: autoApprove
    type: boolean
    default: true

steps:
  - task: DownloadPipelineArtifact@2
    displayName: 'Download Terraform Plan'
    inputs:
      buildType: 'current'
      artifactName: 'tfplan-${{ parameters.environment }}'
      targetPath: '${{ parameters.workingDirectory }}'

  - script: |
      # Verify plan file exists
      if [ ! -f "tfplan" ]; then
        echo "##[error]Plan file not found. Cannot apply."
        exit 1
      fi

      echo "Plan file found, size: $(ls -lh tfplan | awk '{print $5}')"
    displayName: 'Verify Plan Artifact'
    workingDirectory: ${{ parameters.workingDirectory }}

  - script: |
      export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
      export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
      export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
      export ARM_TENANT_ID=$(ARM_TENANT_ID)

      echo "##[group]Applying Terraform plan for ${{ parameters.environment }}"

      # Apply with retry logic
      MAX_RETRIES=2
      RETRY_COUNT=0

      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        if terraform apply -input=false -auto-approve tfplan; then
          echo "##[section]Terraform apply successful"
          break
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "##[warning]Terraform apply failed, retry $RETRY_COUNT of $MAX_RETRIES"
            sleep 30
          else
            echo "##[error]Terraform apply failed after $MAX_RETRIES attempts"
            exit 1
          fi
        fi
      done

      echo "##[endgroup]"
    displayName: 'Terraform Apply - ${{ parameters.environment }}'
    workingDirectory: ${{ parameters.workingDirectory }}
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
      ARM_TENANT_ID: $(ARM_TENANT_ID)

  - script: |
      export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
      export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
      export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
      export ARM_TENANT_ID=$(ARM_TENANT_ID)

      echo "##[group]Capturing Terraform outputs"

      # Capture outputs in JSON format
      terraform output -json > terraform-outputs.json

      # Display outputs
      echo "Terraform Outputs:"
      terraform output

      # List current state resources
      terraform state list > state-resources.txt

      echo ""
      echo "Resources in state:"
      cat state-resources.txt

      echo "##[endgroup]"

      # Set outputs as pipeline variables (for downstream tasks)
      echo "##[group]Setting pipeline variables from outputs"
      for key in $(terraform output -json | jq -r 'keys[]'); do
        value=$(terraform output -raw $key 2>/dev/null || echo "")
        if [ -n "$value" ]; then
          # Sanitize for pipeline variable
          echo "##vso[task.setvariable variable=TF_OUTPUT_$key]$value"
        fi
      done
      echo "##[endgroup]"
    displayName: 'Capture Outputs - ${{ parameters.environment }}'
    workingDirectory: ${{ parameters.workingDirectory }}
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
      ARM_TENANT_ID: $(ARM_TENANT_ID)

  - script: |
      if [ -f "terraform-outputs.json" ]; then
        echo "terraform-outputs.json found, will publish"
      else
        echo "terraform-outputs.json not found, creating empty placeholder"
        echo '{"error": "terraform apply did not complete successfully"}' > terraform-outputs.json
      fi
    displayName: 'Check Terraform Outputs File'
    workingDirectory: ${{ parameters.workingDirectory }}
    condition: always()

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Terraform Outputs'
    inputs:
      targetPath: '${{ parameters.workingDirectory }}/terraform-outputs.json'
      artifact: 'outputs-${{ parameters.environment }}'
      publishLocation: 'pipeline'
    condition: always()

  - script: |
      if [ -f "state-resources.txt" ]; then
        echo "state-resources.txt found, will publish"
      else
        echo "state-resources.txt not found, creating empty placeholder"
        echo "# No state resources available (terraform apply may not have completed)" > state-resources.txt
      fi
    displayName: 'Check State Resource File'
    workingDirectory: ${{ parameters.workingDirectory }}
    condition: always()

  - task: PublishPipelineArtifact@1
    displayName: 'Publish State Resource List'
    inputs:
      targetPath: '${{ parameters.workingDirectory }}/state-resources.txt'
      artifact: 'state-${{ parameters.environment }}'
      publishLocation: 'pipeline'
    condition: always()

  - script: |
      echo "=========================================="
      echo "Deployment Complete: ${{ parameters.environment }}"
      echo "=========================================="
      echo "Environment: ${{ parameters.environment }}"
      echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
      echo "Build ID: $(Build.BuildId)"
      echo "=========================================="
    displayName: 'Deployment Summary'
