# =============================================================================
# Database Migration Template
# =============================================================================
# Runs database migrations before deployment
# Includes pre-flight checks and rollback capability
# =============================================================================

parameters:
  - name: environment
    type: string
  - name: namespace
    type: string
  - name: azureServiceConnection
    type: string
  - name: aksClusterName
    type: string
  - name: resourceGroup
    type: string
  - name: imageTag
    type: string
  - name: imageRegistry
    type: string
  - name: dryRun
    type: boolean
    default: false

steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az aks get-credentials \
          --resource-group ${{ parameters.resourceGroup }} \
          --name ${{ parameters.aksClusterName }} \
          --overwrite-existing
    displayName: 'Get AKS Credentials for Migration'

  - script: |
      echo "========================================="
      echo "DATABASE MIGRATION - ${{ parameters.environment }}"
      echo "========================================="
      echo "Image Tag: ${{ parameters.imageTag }}"
      echo "Dry Run: ${{ parameters.dryRun }}"
      echo "========================================="
    displayName: 'Migration Info'

  # Check if migration job already exists and clean up
  - script: |
      kubectl delete job database-migration-${{ parameters.environment }} \
        -n ${{ parameters.namespace }} \
        --ignore-not-found=true

      # Wait for job to be deleted
      kubectl wait --for=delete job/database-migration-${{ parameters.environment }} \
        -n ${{ parameters.namespace }} \
        --timeout=60s || true
    displayName: 'Clean Up Previous Migration Job'

  # Create migration job
  - task: Kubernetes@1
    inputs:
      connectionType: 'Azure Resource Manager'
      azureSubscriptionEndpoint: ${{ parameters.azureServiceConnection }}
      azureResourceGroup: ${{ parameters.resourceGroup }}
      kubernetesCluster: ${{ parameters.aksClusterName }}
      namespace: ${{ parameters.namespace }}
      command: 'apply'
      useConfigurationFile: true
      inline: |
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: database-migration-${{ parameters.environment }}
          namespace: ${{ parameters.namespace }}
          labels:
            app: flamoral
            component: migration
            environment: ${{ parameters.environment }}
        spec:
          ttlSecondsAfterFinished: 300
          backoffLimit: 2
          template:
            metadata:
              labels:
                app: flamoral
                component: migration
            spec:
              restartPolicy: OnFailure
              containers:
                - name: migration
                  image: ${{ parameters.imageRegistry }}/flamoral/migration:${{ parameters.imageTag }}
                  imagePullPolicy: Always
                  command:
                    - /bin/sh
                    - -c
                    - |
                      echo "Starting database migration..."
                      ${{ if eq(parameters.dryRun, true) }}
                      npm run migrate:dry-run
                      {{ else }}
                      npm run migrate:latest
                      {{ end }}
                      echo "Migration completed successfully!"
                  env:
                    - name: NODE_ENV
                      value: "${{ parameters.environment }}"
                    - name: DB_HOST
                      valueFrom:
                        secretKeyRef:
                          name: database-secrets
                          key: DB_HOST
                    - name: DB_PORT
                      valueFrom:
                        secretKeyRef:
                          name: database-secrets
                          key: DB_PORT
                    - name: DB_NAME
                      valueFrom:
                        secretKeyRef:
                          name: database-secrets
                          key: DB_NAME
                    - name: DB_USER
                      valueFrom:
                        secretKeyRef:
                          name: database-secrets
                          key: DB_USER
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: database-secrets
                          key: DB_PASSWORD
                    - name: DB_SSL
                      value: "true"
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "100m"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
              imagePullSecrets:
                - name: acr-secret
    displayName: 'Create Migration Job'

  # Wait for migration to complete
  - script: |
      echo "Waiting for migration to complete..."

      # Wait for job to complete (max 5 minutes)
      kubectl wait --for=condition=complete \
        job/database-migration-${{ parameters.environment }} \
        -n ${{ parameters.namespace }} \
        --timeout=300s

      if [ $? -eq 0 ]; then
        echo "Migration completed successfully!"
        kubectl logs job/database-migration-${{ parameters.environment }} -n ${{ parameters.namespace }}
      else
        echo "Migration failed or timed out!"
        kubectl logs job/database-migration-${{ parameters.environment }} -n ${{ parameters.namespace }}
        kubectl describe job database-migration-${{ parameters.environment }} -n ${{ parameters.namespace }}
        exit 1
      fi
    displayName: 'Wait for Migration Completion'

  # Verify migration status
  - script: |
      JOB_STATUS=$(kubectl get job database-migration-${{ parameters.environment }} \
        -n ${{ parameters.namespace }} \
        -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')

      if [ "$JOB_STATUS" != "True" ]; then
        echo "Migration job did not complete successfully"
        exit 1
      fi

      echo "Migration verified successfully!"
    displayName: 'Verify Migration Status'
