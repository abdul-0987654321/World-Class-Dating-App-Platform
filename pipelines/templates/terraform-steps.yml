# =============================================================================
# Terraform Steps Template
# =============================================================================
# Reusable steps for Terraform operations
# =============================================================================

parameters:
  - name: environment
    type: string
  - name: terraformVersion
    type: string
    default: '1.6.0'
  - name: azureServiceConnection
    type: string
    default: 'azure-terraform-sp-connection'
  - name: workingDirectory
    type: string
    default: 'infrastructure/terraform'
  - name: backendResourceGroup
    type: string
    default: 'flamoral-terraform-state-rg'
  - name: backendStorageAccount
    type: string
    default: 'flamoraltfstate'
  - name: backendContainerName
    type: string
    default: 'tfstate'
  - name: command
    type: string
    values:
      - plan
      - apply
      - destroy
    default: 'plan'
  - name: additionalArgs
    type: string
    default: ''

steps:
  - task: TerraformInstaller@0
    inputs:
      terraformVersion: ${{ parameters.terraformVersion }}
    displayName: 'Install Terraform ${{ parameters.terraformVersion }}'

  - task: AzureCLI@2
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      addSpnToEnvironment: true
      inlineScript: |
        # Export ARM credentials for Terraform
        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_CLIENT_SECRET=$servicePrincipalKey
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        export ARM_TENANT_ID=$tenantId

        cd ${{ parameters.workingDirectory }}

        # Initialize Terraform
        echo "====================================="
        echo "Terraform Init for ${{ parameters.environment }}"
        echo "====================================="
        terraform init \
          -backend-config="resource_group_name=${{ parameters.backendResourceGroup }}" \
          -backend-config="storage_account_name=${{ parameters.backendStorageAccount }}" \
          -backend-config="container_name=${{ parameters.backendContainerName }}" \
          -backend-config="key=flamoral-${{ parameters.environment }}.tfstate"

        # Validate configuration
        echo "====================================="
        echo "Terraform Validate"
        echo "====================================="
        terraform validate
    displayName: 'Terraform Init & Validate'

  - ${{ if eq(parameters.command, 'plan') }}:
    - task: AzureCLI@2
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_TENANT_ID=$tenantId

          cd ${{ parameters.workingDirectory }}

          echo "====================================="
          echo "Terraform Plan for ${{ parameters.environment }}"
          echo "====================================="
          terraform plan \
            -var="environment=${{ parameters.environment }}" \
            -out=tfplan-${{ parameters.environment }} \
            ${{ parameters.additionalArgs }}

          # Show plan summary
          terraform show tfplan-${{ parameters.environment }}
      displayName: 'Terraform Plan'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '${{ parameters.workingDirectory }}/tfplan-${{ parameters.environment }}'
        artifact: 'terraform-plan-${{ parameters.environment }}'
        publishLocation: 'pipeline'
      displayName: 'Publish Terraform Plan'

  - ${{ if eq(parameters.command, 'apply') }}:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'terraform-plan-${{ parameters.environment }}'
        path: '${{ parameters.workingDirectory }}'
      displayName: 'Download Terraform Plan'

    - task: AzureCLI@2
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_TENANT_ID=$tenantId

          cd ${{ parameters.workingDirectory }}

          echo "====================================="
          echo "Terraform Apply for ${{ parameters.environment }}"
          echo "====================================="
          terraform apply tfplan-${{ parameters.environment }}

          echo "====================================="
          echo "Terraform Outputs"
          echo "====================================="
          terraform output -json > outputs-${{ parameters.environment }}.json
          terraform output
      displayName: 'Terraform Apply'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '${{ parameters.workingDirectory }}/outputs-${{ parameters.environment }}.json'
        artifact: 'terraform-outputs-${{ parameters.environment }}'
        publishLocation: 'pipeline'
      displayName: 'Publish Terraform Outputs'

  - ${{ if eq(parameters.command, 'destroy') }}:
    - task: AzureCLI@2
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_TENANT_ID=$tenantId

          cd ${{ parameters.workingDirectory }}

          echo "====================================="
          echo "WARNING: Terraform Destroy for ${{ parameters.environment }}"
          echo "====================================="
          terraform destroy -auto-approve \
            -var="environment=${{ parameters.environment }}" \
            ${{ parameters.additionalArgs }}
      displayName: 'Terraform Destroy'
