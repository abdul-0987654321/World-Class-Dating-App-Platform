# Azure DevOps Infrastructure Pipeline for Flamoral Dating Platform
# Terraform-based infrastructure provisioning with plan and apply approval

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/terraform/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/terraform/**

variables:
  - group: flamoral-terraform-vars # Variable group ID: 15
  - group: flamoral-common-vars
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: terraformVersion
    value: '1.6.0'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'

stages:
  # ================================
  # Stage 1: Terraform Validation
  # ================================
  - stage: ValidateInfrastructure
    displayName: 'Validate Infrastructure'
    jobs:
      - job: TerraformValidate
        displayName: 'Terraform Validation & Linting'
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init (Validation)'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: 'Azure-Service-Connection'
              backendAzureRmResourceGroupName: '$(TF_STATE_RESOURCE_GROUP)'
              backendAzureRmStorageAccountName: '$(TF_STATE_STORAGE_ACCOUNT)'
              backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
              backendAzureRmKey: 'flamoral.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Format Check'
            inputs:
              provider: 'azurerm'
              command: 'custom'
              workingDirectory: $(workingDirectory)
              customCommand: 'fmt'
              commandOptions: '-check -recursive'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: $(workingDirectory)

          # Security scanning with Checkov
          - script: |
              pip install checkov
              checkov -d $(workingDirectory) --config-file $(System.DefaultWorkingDirectory)/.checkov.yaml --output junitxml > checkov-results.xml
            displayName: 'Run Checkov security scan'
            continueOnError: true

          - task: PublishTestResults@2
            displayName: 'Publish Checkov results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'checkov-results.xml'
              testRunTitle: 'Checkov Security Scan'
            condition: always()

          # Linting with tflint
          - script: |
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --init
              tflint --config=$(System.DefaultWorkingDirectory)/.tflint.hcl --recursive
            displayName: 'Run tflint'
            workingDirectory: $(workingDirectory)

          # Cost estimation with Infracost
          - script: |
              # Install Infracost
              curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh

              # Generate cost estimate
              infracost breakdown \
                --path=$(workingDirectory) \
                --format=json \
                --out-file=infracost-base.json

              infracost output \
                --path=infracost-base.json \
                --format=table \
                --out-file=infracost-report.txt

              cat infracost-report.txt
            displayName: 'Generate infrastructure cost estimate'
            env:
              INFRACOST_API_KEY: $(INFRACOST_API_KEY)
            continueOnError: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish cost estimate'
            inputs:
              targetPath: 'infracost-report.txt'
              artifact: 'infracost-estimate'
              publishLocation: 'pipeline'
            condition: always()

  # ================================
  # Stage 2: Plan Development
  # ================================
  - stage: PlanDev
    displayName: 'Plan Development Infrastructure'
    dependsOn: ValidateInfrastructure
    condition: succeeded()
    variables:
      - name: environment
        value: 'dev'
      - name: tfWorkspace
        value: 'dev'
    jobs:
      - job: TerraformPlanDev
        displayName: 'Terraform Plan - Dev'
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - template: templates/terraform-apply.yml
            parameters:
              environment: $(environment)
              terraformCommand: 'plan'
              workingDirectory: '$(workingDirectory)/environments/dev'
              backendServiceArm: 'Azure-Service-Connection'
              backendResourceGroup: '$(TF_STATE_RESOURCE_GROUP)'
              backendStorageAccount: '$(TF_STATE_STORAGE_ACCOUNT)'
              backendContainer: '$(TF_STATE_CONTAINER)'
              stateKey: 'flamoral-dev.tfstate'

  # ================================
  # Stage 3: Apply Development
  # ================================
  - stage: ApplyDev
    displayName: 'Apply Development Infrastructure'
    dependsOn: PlanDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - name: environment
        value: 'dev'
      - name: tfWorkspace
        value: 'dev'
    jobs:
      - deployment: ApplyDevInfrastructure
        displayName: 'Apply Terraform - Dev'
        pool:
          vmImage: $(vmImageName)
        environment: 'flamoral-dev-infrastructure'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@0
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: $(terraformVersion)

                - template: templates/terraform-apply.yml
                  parameters:
                    environment: $(environment)
                    terraformCommand: 'apply'
                    workingDirectory: '$(workingDirectory)/environments/dev'
                    backendServiceArm: 'Azure-Service-Connection'
                    backendResourceGroup: '$(TF_STATE_RESOURCE_GROUP)'
                    backendStorageAccount: '$(TF_STATE_STORAGE_ACCOUNT)'
                    backendContainer: '$(TF_STATE_CONTAINER)'
                    stateKey: 'flamoral-dev.tfstate'

  # ================================
  # Stage 4: Plan Staging
  # ================================
  - stage: PlanStaging
    displayName: 'Plan Staging Infrastructure'
    dependsOn: ApplyDev
    condition: succeeded()
    variables:
      - name: environment
        value: 'staging'
      - name: tfWorkspace
        value: 'staging'
    jobs:
      - job: TerraformPlanStaging
        displayName: 'Terraform Plan - Staging'
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)/environments/test'
              backendServiceArm: 'Azure-Service-Connection'
              backendAzureRmResourceGroupName: '$(TF_STATE_RESOURCE_GROUP)'
              backendAzureRmStorageAccountName: '$(TF_STATE_STORAGE_ACCOUNT)'
              backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
              backendAzureRmKey: 'flamoral-staging.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(workingDirectory)/environments/test'
              environmentServiceNameAzureRM: 'Azure-Service-Connection'
              commandOptions: '-out=tfplan-staging -var-file="staging.tfvars"'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform plan'
            inputs:
              targetPath: '$(workingDirectory)/environments/test/tfplan-staging'
              artifact: 'tfplan-staging'
              publishLocation: 'pipeline'

  # ================================
  # Stage 5: Apply Staging
  # ================================
  - stage: ApplyStaging
    displayName: 'Apply Staging Infrastructure'
    dependsOn: PlanStaging
    condition: succeeded()
    variables:
      - name: environment
        value: 'staging'
      - name: tfWorkspace
        value: 'staging'
    jobs:
      - job: WaitForStagingApproval
        displayName: 'Wait for Staging Approval'
        pool: server
        timeoutInMinutes: 1440 # 24 hours
        steps:
          - task: ManualValidation@0
            displayName: 'Approve staging infrastructure changes'
            inputs:
              notifyUsers: |
                devops@flamoral.com
                infrastructure@flamoral.com
              instructions: |
                Please review the Terraform plan for staging infrastructure.

                Plan artifact: tfplan-staging
                Environment: Staging

                Review and approve to apply changes.

      - deployment: ApplyStagingInfrastructure
        displayName: 'Apply Terraform - Staging'
        dependsOn: WaitForStagingApproval
        pool:
          vmImage: $(vmImageName)
        environment: 'flamoral-staging-infrastructure'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@0
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: $(terraformVersion)

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Terraform plan'
                  inputs:
                    artifact: 'tfplan-staging'
                    path: '$(workingDirectory)/environments/test'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(workingDirectory)/environments/test'
                    backendServiceArm: 'Azure-Service-Connection'
                    backendAzureRmResourceGroupName: '$(TF_STATE_RESOURCE_GROUP)'
                    backendAzureRmStorageAccountName: '$(TF_STATE_STORAGE_ACCOUNT)'
                    backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
                    backendAzureRmKey: 'flamoral-staging.tfstate'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(workingDirectory)/environments/test'
                    environmentServiceNameAzureRM: 'Azure-Service-Connection'
                    commandOptions: 'tfplan-staging'

  # ================================
  # Stage 6: Plan Production
  # ================================
  - stage: PlanProduction
    displayName: 'Plan Production Infrastructure'
    dependsOn: ApplyStaging
    condition: succeeded()
    variables:
      - name: environment
        value: 'prod'
      - name: tfWorkspace
        value: 'prod'
    jobs:
      - job: TerraformPlanProd
        displayName: 'Terraform Plan - Production'
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)/environments/prod'
              backendServiceArm: 'Azure-Service-Connection'
              backendAzureRmResourceGroupName: '$(TF_STATE_RESOURCE_GROUP)'
              backendAzureRmStorageAccountName: '$(TF_STATE_STORAGE_ACCOUNT)'
              backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
              backendAzureRmKey: 'flamoral-prod.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(workingDirectory)/environments/prod'
              environmentServiceNameAzureRM: 'Azure-Service-Connection'
              commandOptions: '-out=tfplan-prod -var-file="prod.tfvars"'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform plan'
            inputs:
              targetPath: '$(workingDirectory)/environments/prod/tfplan-prod'
              artifact: 'tfplan-prod'
              publishLocation: 'pipeline'

          # Generate change summary
          - script: |
              terraform show -no-color tfplan-prod > terraform-plan-summary.txt
              echo "Terraform Plan Summary for Production" > plan-review.md
              echo "=======================================" >> plan-review.md
              echo "" >> plan-review.md
              terraform show tfplan-prod >> plan-review.md
            displayName: 'Generate plan summary'
            workingDirectory: '$(workingDirectory)/environments/prod'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish plan summary'
            inputs:
              targetPath: '$(workingDirectory)/environments/prod/plan-review.md'
              artifact: 'prod-plan-summary'
              publishLocation: 'pipeline'

  # ================================
  # Stage 7: Apply Production
  # ================================
  - stage: ApplyProduction
    displayName: 'Apply Production Infrastructure'
    dependsOn: PlanProduction
    condition: succeeded()
    variables:
      - name: environment
        value: 'prod'
      - name: tfWorkspace
        value: 'prod'
    jobs:
      - job: WaitForProductionApproval
        displayName: 'Wait for Production Approval'
        pool: server
        timeoutInMinutes: 4320 # 3 days
        steps:
          - task: ManualValidation@0
            displayName: 'Approve production infrastructure changes'
            inputs:
              notifyUsers: |
                devops@flamoral.com
                infrastructure@flamoral.com
                cto@flamoral.com
                engineering-leads@flamoral.com
              instructions: |
                CRITICAL: Production Infrastructure Changes Require Approval

                Please carefully review the Terraform plan for production infrastructure.

                Plan artifact: tfplan-prod
                Plan summary: prod-plan-summary
                Environment: Production

                Review checklist:
                - Verify all changes are intentional
                - Check for any destructive operations
                - Ensure backup procedures are in place
                - Confirm maintenance window if needed
                - Validate cost implications

                This is a PRODUCTION change. Approve only after thorough review.

      - deployment: ApplyProductionInfrastructure
        displayName: 'Apply Terraform - Production'
        dependsOn: WaitForProductionApproval
        pool:
          vmImage: $(vmImageName)
        environment: 'flamoral-production-infrastructure'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@0
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: $(terraformVersion)

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Terraform plan'
                  inputs:
                    artifact: 'tfplan-prod'
                    path: '$(workingDirectory)/environments/prod'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(workingDirectory)/environments/prod'
                    backendServiceArm: 'Azure-Service-Connection'
                    backendAzureRmResourceGroupName: '$(TF_STATE_RESOURCE_GROUP)'
                    backendAzureRmStorageAccountName: '$(TF_STATE_STORAGE_ACCOUNT)'
                    backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
                    backendAzureRmKey: 'flamoral-prod.tfstate'

                # Create backup of current state
                - task: AzureCLI@2
                  displayName: 'Backup current Terraform state'
                  inputs:
                    azureSubscription: 'Azure-Service-Connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      # Download current state
                      az storage blob download \
                        --account-name $(TF_STATE_STORAGE_ACCOUNT) \
                        --container-name $(TF_STATE_CONTAINER) \
                        --name flamoral-prod.tfstate \
                        --file prod-state-backup-$(Build.BuildId).tfstate

                      # Upload backup
                      az storage blob upload \
                        --account-name $(TF_STATE_STORAGE_ACCOUNT) \
                        --container-name tfstate-backups \
                        --name flamoral-prod-$(Build.BuildId).tfstate \
                        --file prod-state-backup-$(Build.BuildId).tfstate

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(workingDirectory)/environments/prod'
                    environmentServiceNameAzureRM: 'Azure-Service-Connection'
                    commandOptions: 'tfplan-prod'

                # Verify infrastructure
                - task: TerraformTaskV4@4
                  displayName: 'Verify infrastructure state'
                  inputs:
                    provider: 'azurerm'
                    command: 'custom'
                    workingDirectory: '$(workingDirectory)/environments/prod'
                    customCommand: 'output'
                    environmentServiceNameAzureRM: 'Azure-Service-Connection'

  # ================================
  # Stage 8: Post-Deployment Validation
  # ================================
  - stage: PostDeploymentValidation
    displayName: 'Post-Deployment Validation'
    dependsOn: ApplyProduction
    condition: succeeded()
    jobs:
      - job: ValidateInfrastructure
        displayName: 'Validate Deployed Infrastructure'
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Validate AKS cluster'
            inputs:
              azureSubscription: 'Azure-Service-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Check AKS cluster status
                az aks show --resource-group flamoral-prod-rg --name flamoral-prod-aks --query "powerState.code" -o tsv

                # Check node status
                az aks get-credentials --resource-group flamoral-prod-rg --name flamoral-prod-aks --overwrite-existing
                kubectl get nodes

          - task: AzureCLI@2
            displayName: 'Validate database'
            inputs:
              azureSubscription: 'Azure-Service-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Check PostgreSQL status
                az postgres flexible-server show \
                  --resource-group flamoral-prod-rg \
                  --name flamoral-prod-postgres \
                  --query "state" -o tsv

          - task: AzureCLI@2
            displayName: 'Validate storage accounts'
            inputs:
              azureSubscription: 'Azure-Service-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # List storage accounts and check status
                az storage account list \
                  --resource-group flamoral-prod-rg \
                  --query "[].{Name:name, Status:statusOfPrimary}" -o table

          - script: |
              echo "Infrastructure validation completed successfully"
              echo "Production infrastructure is ready for deployment"
            displayName: 'Summary'

      - job: NotifyCompletion
        displayName: 'Notify Infrastructure Team'
        dependsOn: ValidateInfrastructure
        pool:
          vmImage: $(vmImageName)
        steps:
          - script: |
              echo "Infrastructure deployment completed successfully"
              echo "Build ID: $(Build.BuildId)"
              echo "Environment: Production"
            displayName: 'Log completion'

          # Add notification tasks (email, Slack, Teams, etc.)
