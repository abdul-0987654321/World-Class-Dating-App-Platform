# Azure DevOps Pipeline - Infrastructure Deployment
# Terraform-based infrastructure provisioning for DatingPlatform
#
# Stages: Validate → Deploy Dev → Deploy Test → Deploy Prod
# Requires: Variable groups, service connections, and environment approvals

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - terraform/**

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - terraform/**

pool:
  vmImage: 'ubuntu-latest'  # Microsoft-hosted agent (was 'Default' self-hosted)

variables:
  - group: datingplatform-terraform-common
  - name: TF_VERSION
    value: '1.6.6'
  - name: TF_INPUT
    value: 'false'
  - name: ARM_USE_OIDC
    value: 'false'

stages:
  # ====================
  # Stage 1: Validation
  # ====================
  - stage: Validate
    displayName: 'Validate Terraform'
    jobs:
      - job: ValidateTerraform
        displayName: 'Terraform Validation'
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              mkdir -p $(Pipeline.Workspace)/.terraform.d/plugin-cache
            displayName: 'Create Terraform cache directory'

          - task: Cache@2
            displayName: 'Cache Terraform plugins'
            continueOnError: true
            inputs:
              key: 'terraform | "$(Agent.OS)" | terraform/**/*.tf'
              path: '$(Pipeline.Workspace)/.terraform.d/plugin-cache'
              restoreKeys: |
                terraform | "$(Agent.OS)"

          - script: |
              curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
              sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
              sudo apt-get update && sudo apt-get install -y terraform=$(TF_VERSION)-1
              terraform version
            displayName: 'Install Terraform $(TF_VERSION)'

          - script: |
              echo "##[group]Checking Terraform format"
              terraform fmt -check -recursive -diff terraform/
              echo "##[endgroup]"
            displayName: 'Terraform Format Check'
            continueOnError: false

          - script: |
              export TF_PLUGIN_CACHE_DIR="$(Pipeline.Workspace)/.terraform.d/plugin-cache"
              mkdir -p $TF_PLUGIN_CACHE_DIR

              export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
              export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
              export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
              export ARM_TENANT_ID=$(ARM_TENANT_ID)

              RESOURCE_GROUP="${TF_STATE_RG:-flamoral-rg}"
              STORAGE_ACCOUNT="${TF_STATE_SA:-flamoralstate}"
              CONTAINER="${TF_STATE_CONTAINER:-tfstate}"
              LOCATION="eastus"

              echo "Checking backend resources..."
              # Ensure backend exists before validation
              if ! az group show --name "$RESOURCE_GROUP" &> /dev/null; then
                echo "Creating backend resource group..."
                az group create --name "$RESOURCE_GROUP" --location "$LOCATION" \
                  --tags "Purpose=TerraformState" "ManagedBy=Pipeline"
              fi

              if ! az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" &> /dev/null; then
                echo "Creating backend storage account..."
                az storage account create --name "$STORAGE_ACCOUNT" \
                  --resource-group "$RESOURCE_GROUP" --location "$LOCATION" \
                  --sku Standard_LRS --https-only true
              fi

              STORAGE_KEY=$(az storage account keys list --resource-group "$RESOURCE_GROUP" \
                --account-name "$STORAGE_ACCOUNT" --query '[0].value' -o tsv)

              if ! az storage container show --name "$CONTAINER" \
                --account-name "$STORAGE_ACCOUNT" --account-key "$STORAGE_KEY" &> /dev/null; then
                echo "Creating backend container..."
                az storage container create --name "$CONTAINER" \
                  --account-name "$STORAGE_ACCOUNT" --account-key "$STORAGE_KEY"
              fi

              for env in dev test prod; do
                echo "##[group]Validating $env environment"
                cd $(Build.SourcesDirectory)/terraform/environments/$env

                # Initialize with backend config to download all required providers
                if terraform init \
                  -backend-config="resource_group_name=$RESOURCE_GROUP" \
                  -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
                  -backend-config="container_name=$CONTAINER" \
                  -backend-config="key=flamoral-$env.tfstate" \
                  -reconfigure \
                  -upgrade; then
                  echo "Terraform init successful for $env"
                else
                  echo "Backend init failed, trying without backend..."
                  terraform init -backend=false -upgrade || {
                    echo "Failed to initialize Terraform for $env"
                    exit 1
                  }
                fi

                terraform validate
                echo "##[endgroup]"
              done
            displayName: 'Terraform Validate (all environments)'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              TF_STATE_RG: $(tfStateResourceGroup)
              TF_STATE_SA: $(tfStateStorageAccount)
              TF_STATE_CONTAINER: $(tfStateContainer)

          - script: |
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --version

              for env in dev test prod; do
                echo "##[group]Running TFLint on $env"
                cd $(Build.SourcesDirectory)/terraform/environments/$env
                tflint --init
                tflint || true
                echo "##[endgroup]"
              done
            displayName: 'TFLint Analysis'
            continueOnError: true

          - script: |
              pip install checkov

              echo "##[group]Running Checkov Security Scan"
              checkov -d terraform/ \
                --config-file .checkov.yaml \
                --output cli \
                --output junitxml \
                --output-file-path checkov-results \
                --soft-fail
              echo "##[endgroup]"
            displayName: 'Checkov Security Scan'
            continueOnError: true

          - task: PublishTestResults@2
            displayName: 'Publish Checkov Results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/checkov-results/*.xml'
              testRunTitle: 'Checkov Security Scan'

  # ====================
  # Stage 2: Deploy Dev
  # ====================
  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Validate
    condition: succeeded()
    variables:
      - group: datingplatform-terraform-common  # Required for tfState* variables
      - group: datingplatform-terraform-dev
    jobs:
      - deployment: TerraformDeployDev
        displayName: 'Terraform Deploy - Dev'
        environment: 'datingplatform-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-init.yml
                  parameters:
                    environment: 'dev'
                    workingDirectory: '$(Build.SourcesDirectory)/terraform/environments/dev'

                - template: templates/terraform-plan.yml
                  parameters:
                    environment: 'dev'
                    workingDirectory: '$(Build.SourcesDirectory)/terraform/environments/dev'

                - template: templates/terraform-apply.yml
                  parameters:
                    environment: 'dev'
                    workingDirectory: '$(Build.SourcesDirectory)/terraform/environments/dev'

  # ====================
  # Stage 3: Deploy Test
  # ====================
  - stage: DeployTest
    displayName: 'Deploy to Test'
    dependsOn: DeployDev
    condition: succeeded()
    variables:
      - group: datingplatform-terraform-common  # Required for tfState* variables
      - group: datingplatform-terraform-test
    jobs:
      - deployment: TerraformDeployTest
        displayName: 'Terraform Deploy - Test'
        environment: 'datingplatform-test'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-init.yml
                  parameters:
                    environment: 'test'
                    workingDirectory: '$(Build.SourcesDirectory)/terraform/environments/test'

                - template: templates/terraform-plan.yml
                  parameters:
                    environment: 'test'
                    workingDirectory: '$(Build.SourcesDirectory)/terraform/environments/test'

                - template: templates/terraform-apply.yml
                  parameters:
                    environment: 'test'
                    workingDirectory: '$(Build.SourcesDirectory)/terraform/environments/test'

  # ====================
  # Stage 4: Deploy Prod
  # ====================
  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: DeployTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: datingplatform-terraform-common  # Required for tfState* variables
      - group: datingplatform-terraform-prod
    jobs:
      - deployment: TerraformDeployProd
        displayName: 'Terraform Deploy - Production'
        environment: 'datingplatform-prod'  # Requires manual approval
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-init.yml
                  parameters:
                    environment: 'prod'
                    workingDirectory: '$(Build.SourcesDirectory)/terraform/environments/prod'

                - template: templates/terraform-plan.yml
                  parameters:
                    environment: 'prod'
                    workingDirectory: '$(Build.SourcesDirectory)/terraform/environments/prod'

                - template: templates/terraform-apply.yml
                  parameters:
                    environment: 'prod'
                    workingDirectory: '$(Build.SourcesDirectory)/terraform/environments/prod'

  # ====================
  # Summary Stage
  # ====================
  - stage: Summary
    displayName: 'Deployment Summary'
    dependsOn:
      - DeployDev
      - DeployTest
      - DeployProd
    condition: always()
    jobs:
      - job: GenerateSummary
        displayName: 'Generate Summary'
        steps:
          - script: |
              echo "=========================================="
              echo "Infrastructure Deployment Summary"
              echo "=========================================="
              echo "Build ID: $(Build.BuildId)"
              echo "Source Branch: $(Build.SourceBranch)"
              echo "Triggered By: $(Build.RequestedFor)"
              echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              echo ""
              echo "Environments Deployed:"
              echo "  - Development: $(DeployDev.result)"
              echo "  - Test: $(DeployTest.result)"
              echo "  - Production: $(DeployProd.result)"
              echo "=========================================="
            displayName: 'Print Deployment Summary'
