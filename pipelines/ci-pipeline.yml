# =============================================================================
# Flamoral Dating Platform - Continuous Integration Pipeline
# =============================================================================
# Organization: citadelcloudmanagement
# Project: DatingPlatform
# URL: https://dev.azure.com/citadelcloudmanagement/DatingPlatform/_build
# =============================================================================
# This is the MAIN CI pipeline that consolidates all build and test operations.
# It replaces all previous CI pipelines to provide a single source of truth.
# =============================================================================

name: CI-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
      - release/*
      - hotfix/*
      - feature/*
  paths:
    exclude:
      - docs/**
      - '**/*.md'
      - LICENSE
      - .gitignore

pr:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - docs/**
      - '**/*.md'

variables:
  - template: templates/variables-common.yml

pool:
  vmImage: $(vmImageName)

stages:
  # ============================================================================
  # STAGE 1: CODE QUALITY & SECURITY ANALYSIS
  # ============================================================================
  - stage: CodeQuality
    displayName: 'Code Quality & Security'
    jobs:
      - job: Linting
        displayName: 'Lint & Type Check'
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - task: Cache@2
            inputs:
              key: 'yarn | "$(Agent.OS)" | yarn.lock'
              restoreKeys: yarn | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.yarn
            displayName: 'Cache yarn dependencies'

          - script: |
              yarn install --frozen-lockfile || npm install
            displayName: 'Install Dependencies'

          - script: |
              echo "Running ESLint across all workspaces..."
              yarn lint:all || npm run lint:all || echo "Lint completed"
            displayName: 'Run ESLint'
            continueOnError: true

          - script: |
              echo "Running TypeScript type checking..."
              yarn typecheck || npm run typecheck || echo "Type check completed"
            displayName: 'TypeScript Check'
            continueOnError: true

      - job: SecurityScan
        displayName: 'Security Vulnerability Scan'
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: |
              yarn install --frozen-lockfile || npm install
            displayName: 'Install Dependencies'

          - script: |
              echo "Running NPM Audit..."
              npm audit --audit-level=moderate --json > npm-audit.json || true
              npm audit --audit-level=moderate || true
            displayName: 'NPM Security Audit'

          - script: |
              echo "Installing and running Trivy..."
              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
              echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
              sudo apt-get update
              sudo apt-get install trivy -y

              echo "Scanning filesystem for vulnerabilities..."
              trivy fs --severity HIGH,CRITICAL --format json --output trivy-results.json . || true
              trivy fs --severity HIGH,CRITICAL . || true
            displayName: 'Trivy Security Scan'
            continueOnError: true

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'npm-audit.json'
              ArtifactName: 'security-reports'
            condition: succeededOrFailed()
            displayName: 'Publish Security Reports'

      - job: SecretsScan
        displayName: 'Secrets Detection'
        steps:
          - checkout: self

          - script: |
              pip install detect-secrets
              detect-secrets scan --all-files --exclude-files 'node_modules|\.git|dist|build' > .secrets.baseline || true
              detect-secrets audit .secrets.baseline --report || true
            displayName: 'Scan for Secrets'
            continueOnError: true

  # ============================================================================
  # STAGE 2: BUILD BACKEND SERVICES
  # ============================================================================
  - stage: BuildBackend
    displayName: 'Build Backend Services'
    dependsOn: CodeQuality
    condition: succeeded()
    jobs:
      - job: BuildNodeServices
        displayName: 'Build Node.js Microservices'
        strategy:
          maxParallel: 5
          matrix:
            ApiGateway:
              serviceName: 'api-gateway'
              serviceDir: 'backend/services/api-gateway'
            AuthService:
              serviceName: 'auth-service'
              serviceDir: 'backend/services/auth-service'
            UserService:
              serviceName: 'user-service'
              serviceDir: 'backend/services/user-service'
            MatchingService:
              serviceName: 'matching-service'
              serviceDir: 'backend/services/matching-service'
            MessagingService:
              serviceName: 'messaging-service'
              serviceDir: 'backend/services/messaging-service'
            MediaService:
              serviceName: 'media-service'
              serviceDir: 'backend/services/media-service'
            PaymentService:
              serviceName: 'payment-service'
              serviceDir: 'backend/services/payment-service'
            NotificationService:
              serviceName: 'notification-service'
              serviceDir: 'backend/services/notification-service'
            AnalyticsService:
              serviceName: 'analytics-service'
              serviceDir: 'backend/services/analytics-service'
            ModerationService:
              serviceName: 'moderation-service'
              serviceDir: 'backend/services/moderation-service'
            AdvertisingService:
              serviceName: 'advertising-service'
              serviceDir: 'backend/services/advertising-service'
            RealtimeService:
              serviceName: 'realtime-service'
              serviceDir: 'backend/services/realtime-service'
        steps:
          - checkout: self

          - template: templates/node-build.yml
            parameters:
              serviceName: $(serviceName)
              serviceDirectory: $(serviceDir)
              nodeVersion: $(nodeVersion)
              runTests: true
              publishCoverage: true

      - job: BuildAIServices
        displayName: 'Build AI/ML Services (Python)'
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install pytest pytest-cov pytest-asyncio flake8
            displayName: 'Install Python Dependencies'

          - script: |
              if [ -d "backend/services/ai-services" ]; then
                cd backend/services/ai-services
                if [ -f "requirements.txt" ]; then
                  pip install -r requirements.txt
                fi
                flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
                pytest tests/ --junitxml=junit/test-results.xml --cov=. --cov-report=xml || true
              fi
            displayName: 'Build & Test AI Services'
            continueOnError: true

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'backend/services/ai-services/**/test-results.xml'
              testRunTitle: 'AI Services Tests'

  # ============================================================================
  # STAGE 3: BUILD FRONTEND APPLICATIONS
  # ============================================================================
  - stage: BuildFrontend
    displayName: 'Build Frontend Applications'
    dependsOn: CodeQuality
    condition: succeeded()
    jobs:
      - job: BuildWebApp
        displayName: 'Build Web Application'
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - task: Cache@2
            inputs:
              key: 'yarn | "$(Agent.OS)" | apps/web-app/yarn.lock'
              restoreKeys: yarn | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.yarn
            displayName: 'Cache yarn dependencies'

          - script: |
              yarn install --frozen-lockfile || npm install
            displayName: 'Install Dependencies'

          - script: |
              if [ -d "apps/web-app" ]; then
                cd apps/web-app
                yarn build || npm run build
              elif [ -d "apps/web" ]; then
                cd apps/web
                yarn build || npm run build
              fi
            displayName: 'Build Web App'
            env:
              NODE_ENV: production

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'apps/web-app/dist'
              ArtifactName: 'web-app-build'
            condition: succeeded()
            displayName: 'Publish Web Artifacts'

      - job: BuildMobileApp
        displayName: 'Build Mobile Application'
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: |
              if [ -d "apps/mobile-app" ]; then
                cd apps/mobile-app
                yarn install --frozen-lockfile || npm install
                yarn test || npm test || echo "No mobile tests found"
              fi
            displayName: 'Build & Test Mobile App'
            continueOnError: true

  # ============================================================================
  # STAGE 4: BUILD & PUSH DOCKER IMAGES
  # ============================================================================
  - stage: BuildDockerImages
    displayName: 'Build & Push Docker Images'
    dependsOn:
      - BuildBackend
      - BuildFrontend
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildImages
        displayName: 'Build & Push Images'
        strategy:
          maxParallel: 4
          matrix:
            ApiGateway:
              serviceName: 'api-gateway'
              dockerfilePath: 'backend/services/api-gateway/Dockerfile'
              buildContext: 'backend/services/api-gateway'
            AuthService:
              serviceName: 'auth-service'
              dockerfilePath: 'backend/services/auth-service/Dockerfile'
              buildContext: 'backend/services/auth-service'
            UserService:
              serviceName: 'user-service'
              dockerfilePath: 'backend/services/user-service/Dockerfile'
              buildContext: 'backend/services/user-service'
            MatchingService:
              serviceName: 'matching-service'
              dockerfilePath: 'backend/services/matching-service/Dockerfile'
              buildContext: 'backend/services/matching-service'
            MessagingService:
              serviceName: 'messaging-service'
              dockerfilePath: 'backend/services/messaging-service/Dockerfile'
              buildContext: 'backend/services/messaging-service'
            MediaService:
              serviceName: 'media-service'
              dockerfilePath: 'backend/services/media-service/Dockerfile'
              buildContext: 'backend/services/media-service'
            PaymentService:
              serviceName: 'payment-service'
              dockerfilePath: 'backend/services/payment-service/Dockerfile'
              buildContext: 'backend/services/payment-service'
            NotificationService:
              serviceName: 'notification-service'
              dockerfilePath: 'backend/services/notification-service/Dockerfile'
              buildContext: 'backend/services/notification-service'
            AnalyticsService:
              serviceName: 'analytics-service'
              dockerfilePath: 'backend/services/analytics-service/Dockerfile'
              buildContext: 'backend/services/analytics-service'
            ModerationService:
              serviceName: 'moderation-service'
              dockerfilePath: 'backend/services/moderation-service/Dockerfile'
              buildContext: 'backend/services/moderation-service'
        steps:
          - checkout: self

          - template: templates/docker-build-push.yml
            parameters:
              serviceName: $(serviceName)
              dockerfilePath: $(dockerfilePath)
              buildContext: $(buildContext)
              imageRepository: $(imagePrefix)
              imageTag: $(imageTag)
              containerRegistry: $(dockerRegistryServiceConnection)
              scanImage: true

  # ============================================================================
  # STAGE 5: INTEGRATION TESTS
  # ============================================================================
  - stage: IntegrationTests
    displayName: 'Integration Tests'
    dependsOn: BuildDockerImages
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: RunIntegrationTests
        displayName: 'Run Integration Tests'
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: |
              yarn install --frozen-lockfile || npm install
            displayName: 'Install Dependencies'

          - script: |
              # Start test infrastructure
              if [ -f "docker-compose.test.yml" ]; then
                docker-compose -f docker-compose.test.yml up -d
              elif [ -f "docker-compose.yml" ]; then
                docker-compose -f docker-compose.yml up -d postgres redis mongodb
              fi
              sleep 30
            displayName: 'Start Test Infrastructure'

          - script: |
              yarn test:integration || npm run test:integration || echo "No integration tests configured"
            displayName: 'Run Integration Tests'
            continueOnError: true

          - script: |
              docker-compose down -v || true
            displayName: 'Cleanup Test Environment'
            condition: always()

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results/**/*.xml'
              mergeTestResults: true
              testRunTitle: 'Integration Tests'

  # ============================================================================
  # STAGE 6: PUBLISH ARTIFACTS
  # ============================================================================
  - stage: PublishArtifacts
    displayName: 'Publish Build Artifacts'
    dependsOn:
      - BuildDockerImages
      - IntegrationTests
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: PublishManifests
        displayName: 'Publish Deployment Artifacts'
        steps:
          - checkout: self

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'infrastructure/kubernetes'
              ArtifactName: 'k8s-manifests'
            displayName: 'Publish K8s Manifests'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'infrastructure/helm'
              ArtifactName: 'helm-charts'
            displayName: 'Publish Helm Charts'

          - script: |
              echo "=== Build Summary ===" > build-info.txt
              echo "Build Number: $(Build.BuildNumber)" >> build-info.txt
              echo "Build ID: $(Build.BuildId)" >> build-info.txt
              echo "Source Branch: $(Build.SourceBranch)" >> build-info.txt
              echo "Source Version: $(Build.SourceVersion)" >> build-info.txt
              echo "Image Tag: $(imageTag)" >> build-info.txt
              echo "Build Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> build-info.txt
              echo "Triggered By: $(Build.RequestedFor)" >> build-info.txt
            displayName: 'Generate Build Info'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'build-info.txt'
              ArtifactName: 'build-info'
            displayName: 'Publish Build Info'
