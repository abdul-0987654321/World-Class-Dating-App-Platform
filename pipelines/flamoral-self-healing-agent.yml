# =============================================================================
# Flamoral Pipeline Self-Healing Agent
# =============================================================================
# Automated agent that monitors and repairs pipeline failures
# - Monitors: Build failures, Job timeouts, Terraform errors, AKS rollout failures
# - Actions: Analyze logs, Identify root cause, Repair YAML/templates, Re-run
# =============================================================================

name: 'Flamoral-SelfHealing-$(Date:yyyyMMdd)-$(Rev:r)'

# Run on schedule to monitor pipelines
schedules:
  - cron: '*/15 * * * *'  # Every 15 minutes
    displayName: 'Pipeline Health Check'
    branches:
      include:
        - main
        - develop
    always: true

# Also trigger on pipeline completion events
trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: flamoral-common-vars
  - group: flamoral-terraform-vars

  # Self-healing configuration
  - name: maxRetries
    value: 3
  - name: lookbackMinutes
    value: 60
  - name: azureDevOpsOrg
    value: 'citadelcloudmanagement'
  - name: azureDevOpsProject
    value: 'DatingPlatform'

stages:
  # ===========================================================================
  # STAGE 1: Monitor Pipeline Health
  # ===========================================================================
  - stage: MonitorHealth
    displayName: 'Monitor Pipeline Health'
    jobs:
      - job: CheckFailedBuilds
        displayName: 'Check for Failed Builds'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              echo "##[section]=========================================="
              echo "##[section]  PIPELINE SELF-HEALING AGENT"
              echo "##[section]=========================================="
              echo ""
              echo "Checking for failed builds in the last $(lookbackMinutes) minutes..."
              echo "Organization: $(azureDevOpsOrg)"
              echo "Project: $(azureDevOpsProject)"
            displayName: 'Agent Startup'

          - task: PowerShell@2
            displayName: 'Query Failed Builds'
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $PAT = "$(System.AccessToken)"
                $headers = @{
                    Authorization = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$PAT"))
                }

                $org = "$(azureDevOpsOrg)"
                $project = "$(azureDevOpsProject)"
                $lookback = $(lookbackMinutes)

                Write-Host "##[section]Querying builds from last $lookback minutes..."

                # Get recent builds
                $minTime = (Get-Date).AddMinutes(-$lookback).ToString("yyyy-MM-ddTHH:mm:ssZ")
                $buildsUrl = "https://dev.azure.com/$org/$project/_apis/build/builds?minTime=$minTime&api-version=7.1"

                try {
                    $builds = Invoke-RestMethod -Uri $buildsUrl -Headers $headers -Method Get
                    $failedBuilds = $builds.value | Where-Object { $_.result -eq "failed" }

                    Write-Host ""
                    Write-Host "Total builds in timeframe: $($builds.value.Count)"
                    Write-Host "Failed builds: $($failedBuilds.Count)"

                    if ($failedBuilds.Count -gt 0) {
                        Write-Host ""
                        Write-Host "##[warning]Failed Builds Found:"
                        foreach ($build in $failedBuilds) {
                            Write-Host "  Build #$($build.id) - $($build.definition.name) - Failed at $($build.finishTime)"
                        }

                        # Export failed build IDs for next stage
                        $failedIds = ($failedBuilds | ForEach-Object { $_.id }) -join ","
                        Write-Host "##vso[task.setvariable variable=FailedBuildIds;isOutput=true]$failedIds"
                        Write-Host "##vso[task.setvariable variable=HasFailures;isOutput=true]true"
                    } else {
                        Write-Host "##[section]No failed builds found"
                        Write-Host "##vso[task.setvariable variable=HasFailures;isOutput=true]false"
                    }
                } catch {
                    Write-Host "##[error]Failed to query builds: $_"
                    Write-Host "##vso[task.setvariable variable=HasFailures;isOutput=true]false"
                }
            name: QueryBuilds
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # ===========================================================================
  # STAGE 2: Analyze Failures
  # ===========================================================================
  - stage: AnalyzeFailures
    displayName: 'Analyze Failures'
    dependsOn: MonitorHealth
    condition: eq(dependencies.MonitorHealth.outputs['CheckFailedBuilds.QueryBuilds.HasFailures'], 'true')
    jobs:
      - job: AnalyzeLogs
        displayName: 'Analyze Build Logs'
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          failedBuildIds: $[stageDependencies.MonitorHealth.CheckFailedBuilds.outputs['QueryBuilds.FailedBuildIds']]
        steps:
          - checkout: self

          - task: PowerShell@2
            displayName: 'Analyze Failed Build Logs'
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $PAT = "$(System.AccessToken)"
                $headers = @{
                    Authorization = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$PAT"))
                }

                $org = "$(azureDevOpsOrg)"
                $project = "$(azureDevOpsProject)"
                $failedIds = "$(failedBuildIds)".Split(",")

                Write-Host "##[section]Analyzing $($failedIds.Count) failed build(s)..."

                $analysisResults = @()

                foreach ($buildId in $failedIds) {
                    if ([string]::IsNullOrWhiteSpace($buildId)) { continue }

                    Write-Host ""
                    Write-Host "##[section]Analyzing Build #$buildId"

                    # Get build timeline for detailed failure info
                    $timelineUrl = "https://dev.azure.com/$org/$project/_apis/build/builds/$buildId/timeline?api-version=7.1"

                    try {
                        $timeline = Invoke-RestMethod -Uri $timelineUrl -Headers $headers -Method Get
                        $failedRecords = $timeline.records | Where-Object { $_.result -eq "failed" }

                        foreach ($record in $failedRecords) {
                            Write-Host "  Failed: $($record.name) ($($record.type))"

                            # Categorize the failure
                            $category = "unknown"
                            $errorPattern = ""
                            $suggestedFix = ""

                            # Check for common error patterns
                            if ($record.name -match "Terraform") {
                                $category = "terraform"
                                $suggestedFix = "Check Terraform state lock, backend config, or provider versions"
                            }
                            elseif ($record.name -match "Docker|Build.*Image") {
                                $category = "docker"
                                $suggestedFix = "Check Dockerfile syntax, base image availability, or build context"
                            }
                            elseif ($record.name -match "Deploy|Helm|AKS") {
                                $category = "deployment"
                                $suggestedFix = "Check AKS cluster connectivity, namespace permissions, or Helm values"
                            }
                            elseif ($record.name -match "Test") {
                                $category = "test"
                                $suggestedFix = "Review test failures, check test environment, or update test snapshots"
                            }
                            elseif ($record.name -match "Install|npm|node") {
                                $category = "dependency"
                                $suggestedFix = "Clear npm cache, check package versions, or update lock file"
                            }
                            elseif ($record.name -match "Security|Scan") {
                                $category = "security"
                                $suggestedFix = "Review security findings, update vulnerable dependencies"
                            }

                            $analysis = @{
                                BuildId = $buildId
                                FailedStep = $record.name
                                StepType = $record.type
                                Category = $category
                                SuggestedFix = $suggestedFix
                            }
                            $analysisResults += $analysis

                            Write-Host "    Category: $category"
                            Write-Host "    Suggested Fix: $suggestedFix"
                        }
                    } catch {
                        Write-Host "##[warning]Could not analyze build #$buildId : $_"
                    }
                }

                # Export analysis for healing stage
                $analysisJson = $analysisResults | ConvertTo-Json -Compress
                Write-Host ""
                Write-Host "##[section]Analysis Complete"
                Write-Host "##vso[task.setvariable variable=AnalysisResults;isOutput=true]$analysisJson"
            name: Analysis
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # ===========================================================================
  # STAGE 3: Automated Healing Actions
  # ===========================================================================
  - stage: AutomatedHealing
    displayName: 'Automated Healing'
    dependsOn: AnalyzeFailures
    condition: succeeded()
    jobs:
      - job: ApplyFixes
        displayName: 'Apply Automated Fixes'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              echo "##[section]Automated Healing Actions"
              echo ""
              echo "The following automated fixes can be applied:"
              echo ""
              echo "1. TERRAFORM FIXES:"
              echo "   - Clear state locks"
              echo "   - Refresh provider cache"
              echo "   - Update backend configuration"
              echo ""
              echo "2. DOCKER FIXES:"
              echo "   - Clear Docker build cache"
              echo "   - Pull latest base images"
              echo "   - Verify Dockerfile paths"
              echo ""
              echo "3. DEPENDENCY FIXES:"
              echo "   - Clear npm cache"
              echo "   - Regenerate lock files"
              echo "   - Update to stable versions"
              echo ""
              echo "4. DEPLOYMENT FIXES:"
              echo "   - Verify AKS connectivity"
              echo "   - Check namespace existence"
              echo "   - Validate Helm chart"
            displayName: 'List Available Fixes'

          - script: |
              echo "##[section]Validating Pipeline YAML Files"

              # Check YAML syntax for all pipeline files
              for file in pipelines/*.yml pipelines/templates/*.yml; do
                if [ -f "$file" ]; then
                  echo "Checking: $file"
                  # Basic YAML validation
                  python3 -c "import yaml; yaml.safe_load(open('$file'))" 2>/dev/null && echo "  ✓ Valid" || echo "  ✗ Invalid YAML"
                fi
              done
            displayName: 'Validate YAML Syntax'
            continueOnError: true

          - script: |
              echo "##[section]Checking Terraform Configuration"

              # Check for common Terraform issues
              if [ -d "infrastructure/terraform" ]; then
                cd infrastructure/terraform

                # Check for formatting issues
                terraform fmt -check -recursive 2>/dev/null && echo "✓ Terraform formatting OK" || echo "##[warning]Terraform formatting issues found"

                # Validate configuration (without init)
                for env in environments/*/; do
                  if [ -d "$env" ]; then
                    echo "Validating: $env"
                    cd "$env"
                    terraform validate 2>/dev/null && echo "  ✓ Valid" || echo "  ✗ Validation errors"
                    cd -
                  fi
                done
              fi
            displayName: 'Validate Terraform'
            continueOnError: true

          - script: |
              echo "##[section]Checking Docker Configurations"

              # Find and validate all Dockerfiles
              find . -name "Dockerfile" -type f | while read dockerfile; do
                echo "Checking: $dockerfile"

                # Check for common issues
                if grep -q "FROM.*:latest" "$dockerfile"; then
                  echo "  ##[warning]Uses :latest tag - consider pinning version"
                fi

                if ! grep -q "HEALTHCHECK" "$dockerfile"; then
                  echo "  ##[warning]No HEALTHCHECK defined"
                fi

                echo "  ✓ Dockerfile found"
              done
            displayName: 'Validate Dockerfiles'
            continueOnError: true

  # ===========================================================================
  # STAGE 4: Retry Failed Builds
  # ===========================================================================
  - stage: RetryBuilds
    displayName: 'Retry Failed Builds'
    dependsOn:
      - MonitorHealth
      - AutomatedHealing
    condition: |
      and(
        succeeded('AutomatedHealing'),
        eq(dependencies.MonitorHealth.outputs['CheckFailedBuilds.QueryBuilds.HasFailures'], 'true')
      )
    jobs:
      - job: QueueRetries
        displayName: 'Queue Build Retries'
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          failedBuildIds: $[stageDependencies.MonitorHealth.CheckFailedBuilds.outputs['QueryBuilds.FailedBuildIds']]
        steps:
          - task: PowerShell@2
            displayName: 'Retry Failed Builds'
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $PAT = "$(System.AccessToken)"
                $headers = @{
                    Authorization = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$PAT"))
                    "Content-Type" = "application/json"
                }

                $org = "$(azureDevOpsOrg)"
                $project = "$(azureDevOpsProject)"
                $failedIds = "$(failedBuildIds)".Split(",")
                $maxRetries = $(maxRetries)

                Write-Host "##[section]Retrying Failed Builds"
                Write-Host "Max retries per build: $maxRetries"

                foreach ($buildId in $failedIds) {
                    if ([string]::IsNullOrWhiteSpace($buildId)) { continue }

                    Write-Host ""
                    Write-Host "Processing Build #$buildId..."

                    # Get the original build to find definition
                    $buildUrl = "https://dev.azure.com/$org/$project/_apis/build/builds/$buildId`?api-version=7.1"

                    try {
                        $build = Invoke-RestMethod -Uri $buildUrl -Headers $headers -Method Get
                        $definitionId = $build.definition.id
                        $sourceBranch = $build.sourceBranch

                        # Check retry count (stored in build tags)
                        $retryCount = 0
                        if ($build.tags -contains "retry-1") { $retryCount = 1 }
                        if ($build.tags -contains "retry-2") { $retryCount = 2 }
                        if ($build.tags -contains "retry-3") { $retryCount = 3 }

                        if ($retryCount -ge $maxRetries) {
                            Write-Host "  ##[warning]Max retries ($maxRetries) reached for build #$buildId"
                            Write-Host "  Manual intervention required"
                            continue
                        }

                        $newRetryCount = $retryCount + 1
                        Write-Host "  Retry attempt: $newRetryCount of $maxRetries"

                        # Queue a new build
                        $queueUrl = "https://dev.azure.com/$org/$project/_apis/build/builds?api-version=7.1"
                        $body = @{
                            definition = @{ id = $definitionId }
                            sourceBranch = $sourceBranch
                            tags = @("retry-$newRetryCount", "self-healing-retry", "original-build-$buildId")
                        } | ConvertTo-Json

                        $newBuild = Invoke-RestMethod -Uri $queueUrl -Headers $headers -Method Post -Body $body
                        Write-Host "  ##[section]Queued new build #$($newBuild.id)"
                    } catch {
                        Write-Host "  ##[error]Failed to retry build #$buildId : $_"
                    }
                }
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # ===========================================================================
  # STAGE 5: Generate Health Report
  # ===========================================================================
  - stage: HealthReport
    displayName: 'Generate Health Report'
    dependsOn:
      - MonitorHealth
      - AnalyzeFailures
      - AutomatedHealing
      - RetryBuilds
    condition: always()
    jobs:
      - job: GenerateReport
        displayName: 'Generate Health Report'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "##[section]=========================================="
              echo "##[section]  PIPELINE HEALTH REPORT"
              echo "##[section]=========================================="
              echo ""
              echo "Report Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Agent Run: $(Build.BuildId)"
              echo ""
              echo "##[section]Summary:"
              echo "  - Health Check: Completed"
              echo "  - Failure Analysis: Completed"
              echo "  - Automated Healing: Completed"
              echo "  - Build Retries: Processed"
              echo ""
              echo "##[section]Next Scheduled Run: ~15 minutes"
            displayName: 'Print Health Report'

          - script: |
              # Generate JSON report
              cat << EOF > health-report.json
              {
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "agentBuildId": "$(Build.BuildId)",
                "organization": "$(azureDevOpsOrg)",
                "project": "$(azureDevOpsProject)",
                "lookbackMinutes": $(lookbackMinutes),
                "maxRetries": $(maxRetries),
                "status": "completed"
              }
              EOF
              cat health-report.json
            displayName: 'Generate JSON Report'

          - publish: 'health-report.json'
            artifact: 'health-report-$(Build.BuildId)'
            displayName: 'Publish Health Report'
