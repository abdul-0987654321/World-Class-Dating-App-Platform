# Railway Configuration for Flamoral Dating Platform
# This file provides TOML-based configuration for Railway deployment
# For complete service mesh configuration, see railway.json

# =============================================================================
# GLOBAL BUILD SETTINGS
# =============================================================================
[build]
builder = "dockerfile"
watchPatterns = ["backend/shared/**"]

# =============================================================================
# GLOBAL DEPLOY SETTINGS
# =============================================================================
[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# =============================================================================
# SERVICE-SPECIFIC CONFIGURATIONS
# Note: Railway will use railway.json for multi-service deployments
# This TOML file is kept for backwards compatibility and single-service deploys
# =============================================================================

