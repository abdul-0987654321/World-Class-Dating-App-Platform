name: Backend Services CI

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  lint-and-test:
    name: Lint and Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - matching-service
          - messaging-service
          - media-service
          - payment-service
          - api-gateway
          - analytics-service
          - moderation-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: npm ci

      - name: Run ESLint
        working-directory: backend/services/${{ matrix.service }}
        run: npm run lint || echo "No lint script defined"

      - name: Run TypeScript Compiler
        working-directory: backend/services/${{ matrix.service }}
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: backend/services/${{ matrix.service }}
        run: npm test || echo "No tests defined yet"
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-secret-key-min-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-key-min-32-characters-long

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v3
        with:
          files: backend/services/${{ matrix.service }}/coverage/lcov.info
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage

  build:
    name: Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint-and-test

    strategy:
      matrix:
        service:
          - user-service
          - matching-service
          - messaging-service
          - media-service
          - payment-service
          - api-gateway
          - analytics-service
          - moderation-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: npm ci

      - name: Build application
        working-directory: backend/services/${{ matrix.service }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.service }}-build
          path: backend/services/${{ matrix.service }}/dist
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        working-directory: backend
        run: |
          for service in services/*; do
            echo "Scanning $service..."
            cd "$service"
            npm audit --audit-level=high || true
            cd ../..
          done

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
