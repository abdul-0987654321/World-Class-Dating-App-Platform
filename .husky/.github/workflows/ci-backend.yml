name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - matching-service
          - messaging-service
          - media-service
          - payment-service
          - notification-service
          - moderation-service
          - analytics-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint ${{ matrix.service }}
        run: npm run lint --workspace=backend/services/${{ matrix.service }}
        continue-on-error: false

      - name: Build ${{ matrix.service }}
        run: npm run build --workspace=backend/services/${{ matrix.service }}
        continue-on-error: false

      - name: Run tests for ${{ matrix.service }}
        run: npm test --workspace=backend/services/${{ matrix.service }}
        continue-on-error: false

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
