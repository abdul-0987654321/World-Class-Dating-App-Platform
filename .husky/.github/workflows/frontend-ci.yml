name: Frontend CI

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  lint-and-test:
    name: Lint and Test - Web Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run ESLint
        working-directory: frontend/web
        run: npm run lint

      - name: Run TypeScript Compiler
        working-directory: frontend/web
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend/web
        run: npm test || echo "No tests defined yet"
        env:
          CI: true

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v3
        with:
          files: frontend/web/coverage/lcov.info
          flags: frontend-web
          name: frontend-web-coverage

  build:
    name: Build - Web Frontend
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Build application
        working-directory: frontend/web
        run: npm run build
        env:
          VITE_API_URL: https://api-staging.connectsphere.com
          VITE_ENVIRONMENT: staging

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-web-build
          path: frontend/web/dist
          retention-days: 7

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-web-build
          path: frontend/web/dist

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true
