name: Continuous Integration

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  # Backend Linting and Type Checking
  backend-lint:
    name: Backend Linting & Type Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - messaging-service
          - matching-service
          - media-service
          - moderation-service
          - payment-service
          - notification-service
          - analytics-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: npm ci

      - name: Run ESLint
        working-directory: backend/services/${{ matrix.service }}
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: backend/services/${{ matrix.service }}
        run: npx tsc --noEmit

  # Backend Unit Tests
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        service:
          - user-service
          - messaging-service
          - matching-service
          - media-service
          - moderation-service
          - payment-service
          - notification-service
          - analytics-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend/services/${{ matrix.service }}
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_key_for_ci_only
        run: npm test -- --coverage --ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: backend/services/${{ matrix.service }}/coverage/coverage-final.json
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}

  # Frontend Linting and Type Checking
  frontend-lint:
    name: Frontend Linting & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run ESLint
        working-directory: frontend/web
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: frontend/web
        run: npx tsc --noEmit

  # Frontend Build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Build production bundle
        working-directory: frontend/web
        env:
          NODE_ENV: production
        run: npm run build

      - name: Check bundle size
        working-directory: frontend/web
        run: |
          echo "Bundle size analysis:"
          du -sh dist/
          du -h dist/assets/*.js | sort -h

  # Frontend Unit Tests
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend/web
        run: npm test -- --coverage --ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: frontend/web/coverage/coverage-final.json
          flags: frontend
          name: frontend-web

  # Security Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run npm audit (Backend)
        working-directory: backend
        run: |
          for service in services/*; do
            if [ -d "$service" ]; then
              echo "Auditing $service"
              cd "$service"
              npm audit --audit-level=high || true
              cd ../..
            fi
          done

      - name: Run npm audit (Frontend)
        working-directory: frontend/web
        run: npm audit --audit-level=high || true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - messaging-service
          - matching-service
          - media-service
          - moderation-service
          - payment-service
          - notification-service
          - analytics-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        working-directory: backend/services/${{ matrix.service }}
        run: |
          docker build -t flamoral/${{ matrix.service }}:test .

      - name: Test Docker image
        run: |
          docker run --rm flamoral/${{ matrix.service }}:test node --version
          docker run --rm flamoral/${{ matrix.service }}:test npm --version

  # API Gateway Build Test
  api-gateway-build:
    name: API Gateway Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/api-gateway/package-lock.json

      - name: Install dependencies
        working-directory: backend/api-gateway
        run: npm ci

      - name: Run type check
        working-directory: backend/api-gateway
        run: npx tsc --noEmit

  # Summary
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-tests
      - frontend-lint
      - frontend-build
      - frontend-tests
      - security-scan
      - docker-build
      - api-gateway-build

    steps:
      - name: Success notification
        run: |
          echo "✅ All CI checks passed!"
          echo "✅ Backend: Linting, Type Check, Unit Tests"
          echo "✅ Frontend: Linting, Type Check, Build, Unit Tests"
          echo "✅ Security: Vulnerability Scan"
          echo "✅ Docker: Build Test"
