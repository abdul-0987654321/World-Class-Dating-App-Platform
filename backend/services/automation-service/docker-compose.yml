version: '3.8'

services:
  automation-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flamoral-automation-service
    restart: unless-stopped
    ports:
      - "3013:3013"
    environment:
      - NODE_ENV=development
      - PORT=3013
      - SERVICE_NAME=automation-service

      # JWT
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}

      # Database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=flamoral_automation
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=false

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=7

      # RabbitMQ
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=flamoral_events

      # Service URLs
      - MESSAGING_SERVICE_URL=http://messaging-service:3003
      - NOTIFICATION_SERVICE_URL=http://notification-service:3008
      - USER_SERVICE_URL=http://user-service:3001
      - MATCHING_SERVICE_URL=http://matching-service:3002
      - AI_SERVICE_URL=http://nlp-service:8000
      - ANALYTICS_SERVICE_URL=http://analytics-service:3007

      # Service Auth
      - SERVICE_API_KEY=${SERVICE_API_KEY}

      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4-turbo-preview

      # Feature Flags
      - ENABLE_AUTO_DM_FLOWS=true
      - ENABLE_ICEBREAKER_SUGGESTIONS=true
      - ENABLE_GHOSTING_DETECTION=true
      - ENABLE_SCHEDULED_MESSAGES=true
      - ENABLE_AI_REPLY_ASSISTANT=true

      # CORS
      - CORS_ORIGINS=http://localhost:3000

      # Logging
      - LOG_LEVEL=debug

    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - flamoral-network
    volumes:
      - ./src:/app/src
      - /app/node_modules

  postgres:
    image: postgres:15-alpine
    container_name: flamoral-automation-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=flamoral_automation
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - flamoral-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flamoral-automation-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - flamoral-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: flamoral-automation-rabbitmq
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - flamoral-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  flamoral-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
