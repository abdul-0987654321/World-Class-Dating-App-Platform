# Deepfake Detection Model Configuration
# FLAMORAL Dating Platform

model:
  # Primary detection model
  name: efficientnet_b4
  pretrained: true
  num_classes: 2  # Real, Fake
  dropout_rate: 0.3

  # Input configuration
  input_size: 380  # EfficientNet-B4 default
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  # Model weights (relative to models directory)
  weights_path: weights/efficientnet_deepfake.pth

detection:
  # Detection thresholds
  deepfake_threshold: 0.5  # Score above this = deepfake
  high_confidence_threshold: 0.8  # Auto-reject above this
  flag_threshold: 0.3  # Flag for review above this

  # Analysis weights for combined score
  weights:
    ml_model: 0.50  # Deep learning model weight
    frequency_analysis: 0.15
    texture_analysis: 0.15
    lighting_analysis: 0.10
    indicator_count: 0.10

face_detection:
  # MTCNN configuration
  min_face_size: 80
  thresholds: [0.6, 0.7, 0.7]  # P-Net, R-Net, O-Net
  factor: 0.709  # Image pyramid scale factor

  # Face selection
  selection_method: largest  # largest, center, all
  margin: 0.3  # Face crop margin

  # Quality requirements
  min_confidence: 0.9

video_analysis:
  # Frame sampling
  max_frames: 300
  sample_fps: 2.0  # Frames per second to sample

  # Temporal analysis
  temporal_window: 30  # Frames for consistency check

  # Blink detection
  blink_detection_enabled: true
  min_video_duration: 3.0  # Seconds

indicators:
  # List of detection indicators
  - face_boundary_artifacts
  - eye_blinking_anomaly
  - skin_texture_anomaly
  - lighting_inconsistency
  - resolution_mismatch
  - gan_fingerprint
  - temporal_inconsistency
  - unnatural_symmetry
  - compression_artifacts
  - frequency_anomaly
  - missing_metadata
  - common_gan_resolution

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Pre-trained model download URLs (for initialization)
model_urls:
  efficientnet_b4: "https://github.com/rwightman/pytorch-image-models/releases/download/v0.1-weights/efficientnet_b4_ra2_320-7eb33cd5.pth"
  # Note: Deepfake-specific fine-tuned weights should be downloaded separately
  # or trained on datasets like FaceForensics++, Celeb-DF, etc.
