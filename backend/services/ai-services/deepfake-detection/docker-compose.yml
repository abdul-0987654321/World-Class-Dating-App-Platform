version: '3.8'

services:
  deepfake-detection:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: flamoral-deepfake-detection
    ports:
      - "8010:8010"
    environment:
      - DEEPFAKE_HOST=0.0.0.0
      - DEEPFAKE_PORT=8010
      - DEEPFAKE_DEBUG=false
      - DEEPFAKE_DETECTION_THRESHOLD=0.5
      - DEEPFAKE_MODEL_PATH=/app/models/weights/efficientnet_deepfake.pth
      - LOG_LEVEL=INFO
    volumes:
      - ./models/weights:/app/models/weights:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - flamoral-network

  # GPU-enabled version (use with: docker-compose --profile gpu up)
  deepfake-detection-gpu:
    profiles:
      - gpu
    build:
      context: .
      dockerfile: Dockerfile
      target: production-gpu
    container_name: flamoral-deepfake-detection-gpu
    ports:
      - "8010:8010"
    environment:
      - DEEPFAKE_HOST=0.0.0.0
      - DEEPFAKE_PORT=8010
      - DEEPFAKE_DEBUG=false
      - DEEPFAKE_DETECTION_THRESHOLD=0.5
      - DEEPFAKE_MODEL_PATH=/app/models/weights/efficientnet_deepfake.pth
      - LOG_LEVEL=INFO
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./models/weights:/app/models/weights:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - flamoral-network

networks:
  flamoral-network:
    external: true
