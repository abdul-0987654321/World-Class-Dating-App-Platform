# ML Recommendation Service Configuration

# Service Settings
service:
  name: "ml-recommendation-service"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8004
  debug: false
  log_level: "INFO"

# Model Paths
models:
  directory: "/app/models"
  collaborative_filter: "collaborative_filter.pkl"
  content_filter: "content_filter.pkl"
  behavioral_learner: "behavioral_learner.pkl"
  auto_load: true
  auto_save: true
  save_interval_minutes: 60

# Feature Extraction Settings
feature_extraction:
  numerical_features:
    - age
    - height
    - distance_preference
    - age_min_preference
    - age_max_preference
    - profile_completeness
    - photo_count
    - activity_score
    - response_rate
    - swipe_right_rate

  categorical_features:
    - gender
    - looking_for_gender
    - relationship_goal
    - education_level
    - smoking
    - drinking
    - exercise_frequency
    - diet
    - pets
    - children
    - religion
    - politics

  text_features:
    - bio
    - interests
    - hobbies

  tfidf_settings:
    max_features: 100
    ngram_range: [1, 2]
    stop_words: "english"

# Collaborative Filtering Settings
collaborative_filtering:
  enabled: true
  n_factors: 50
  learning_rate: 0.01
  regularization: 0.02
  n_iterations: 20
  min_interactions_for_training: 100

  action_weights:
    pass: -0.5
    like: 1.0
    super_like: 2.0
    match: 3.0
    message: 4.0
    conversation: 5.0

  cold_start_fallback: "global_mean"

# Content-Based Filtering Settings
content_based_filtering:
  enabled: true

  scoring_weights:
    base_similarity: 0.3
    preference_match: 0.5
    interaction_history: 0.2

  preference_matching:
    age_mismatch_penalty: 0.2
    gender_mismatch_penalty: 0.1
    distance_mismatch_penalty: 0.3
    interest_overlap_bonus: 0.2
    dealbreaker_penalty: 0.1

  diversity:
    enabled: true
    default_factor: 0.1
    mmr_algorithm: true

# Hybrid Recommender Settings
hybrid_recommender:
  enabled: true

  default_weights:
    collaborative: 0.5
    content_based: 0.5

  adaptive_weighting:
    enabled: true
    min_interactions_for_cf: 5
    max_interactions_threshold: 50
    transition_function: "sigmoid"
    performance_tracking: true

  cold_start_strategy:
    new_user_method: "content_based"
    low_interaction_blend: true
    experienced_user_method: "collaborative_heavy"

  ranking_adjustments:
    verified_boost: 1.05
    active_user_boost: 1.03
    high_response_rate_boost: 1.02
    complete_profile_boost: 1.05
    low_photo_penalty: 0.95

# Behavioral Learning Settings
behavioral_learning:
  enabled: true

  learning_rate: 0.1
  decay_factor: 0.95

  swipe_learning:
    enabled: true
    weight_likes: 1.0
    weight_passes: 0.3
    weight_super_likes: 2.0

  match_learning:
    enabled: true
    successful_match_weight: 2.0
    conversation_quality_threshold: 10

  temporal_patterns:
    track_active_hours: true
    track_active_days: true
    track_session_patterns: true

  preference_learning:
    min_interactions_for_learning: 10
    update_frequency: 10  # Update every N swipes
    confidence_growth_rate: 0.05

# A/B Testing Settings
ab_testing:
  enabled: true

  default_settings:
    minimum_sample_size: 1000
    confidence_level: 0.95
    min_experiment_duration_days: 7
    max_experiment_duration_days: 30

  assignment:
    method: "consistent_hashing"
    algorithm: "md5"

  metrics:
    primary_metric: "match_rate"
    secondary_metrics:
      - "like_rate"
      - "conversation_rate"
      - "user_satisfaction"

  statistical_tests:
    categorical: "chi_square"
    continuous: "t_test"
    min_p_value: 0.05

# Recommendation Settings
recommendations:
  default_count: 20
  max_count: 100
  min_count: 1

  candidate_filtering:
    apply_dealbreakers: true
    respect_preferences: true
    min_age_gap: -99
    max_age_gap: 99
    max_distance_km: 500

  diversity:
    default_factor: 0.1
    min_factor: 0.0
    max_factor: 1.0

  quality_thresholds:
    min_compatibility_score: 0.3
    top_picks_threshold: 0.7
    auto_match_threshold: 0.9

  caching:
    enabled: true
    ttl_seconds: 300
    max_cache_size: 10000

# Performance Settings
performance:
  batch_processing:
    enabled: true
    batch_size: 100
    max_workers: 4

  feature_caching:
    enabled: true
    cache_ttl: 3600
    max_cached_profiles: 50000

  similarity_caching:
    enabled: true
    cache_ttl: 1800
    precompute_top_k: 100

  database_pool:
    min_connections: 2
    max_connections: 10
    connection_timeout: 30

# Monitoring Settings
monitoring:
  enabled: true

  metrics:
    - recommendation_latency
    - model_accuracy
    - diversity_score
    - coverage_rate
    - user_satisfaction

  logging:
    log_predictions: true
    log_explanations: true
    log_ab_test_assignments: true

  alerts:
    low_diversity_threshold: 0.3
    low_coverage_threshold: 0.2
    high_latency_ms: 1000

# Training Settings
training:
  auto_training:
    enabled: false
    schedule: "0 2 * * 0"  # Weekly at 2 AM on Sunday

  data_validation:
    min_profiles: 100
    min_interactions: 1000
    max_missing_values_pct: 10

  evaluation:
    test_size: 0.2
    validation_size: 0.1
    metrics:
      - precision_at_k
      - recall_at_k
      - ndcg_at_k
      - coverage
      - diversity

  checkpointing:
    enabled: true
    save_best_only: true
    checkpoint_dir: "/app/checkpoints"

# Security Settings
security:
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_size: 10

  data_privacy:
    anonymize_logs: true
    encrypt_user_data: true
    gdpr_compliant: true

  api_authentication:
    required: true
    jwt_validation: true

# Database Settings
database:
  postgres:
    host: "postgres"
    port: 5432
    database: "dating_app"
    user: "postgres"
    password_env: "POSTGRES_PASSWORD"
    ssl_mode: "prefer"

  redis:
    host: "redis"
    port: 6379
    db: 1
    password_env: "REDIS_PASSWORD"
    ssl: false

  mongodb:
    host: "mongodb"
    port: 27017
    database: "dating_app"
    user: "mongodb"
    password_env: "MONGODB_PASSWORD"

# External Services
external_services:
  analytics:
    enabled: true
    endpoint: "http://analytics-service:8080"

  user_service:
    enabled: true
    endpoint: "http://user-service:8001"

  matching_service:
    enabled: true
    endpoint: "http://matching-service:8002"

# Development Settings
development:
  synthetic_data:
    enabled: false
    n_users: 1000
    n_interactions: 10000

  debug_mode:
    enabled: false
    verbose_logging: true
    save_intermediate_results: true

  testing:
    mock_external_services: false
    use_test_database: false
