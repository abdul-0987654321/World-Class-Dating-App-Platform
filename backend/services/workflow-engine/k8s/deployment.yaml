apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-engine
  namespace: flamoral
  labels:
    app: workflow-engine
    service: workflow-engine
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workflow-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: workflow-engine
        service: workflow-engine
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3011"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: workflow-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
      - name: workflow-engine
        image: flamoral/workflow-engine:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3011
          protocol: TCP

        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3011"

        # Database Configuration
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: db.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: db.port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: db.name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: workflow-engine-secrets
              key: db.user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-engine-secrets
              key: db.password

        # Redis Configuration
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: redis.host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: redis.port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-engine-secrets
              key: redis.password

        # RabbitMQ Configuration
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: rabbitmq.host
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: rabbitmq.port
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: workflow-engine-secrets
              key: rabbitmq.user
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-engine-secrets
              key: rabbitmq.password

        # Service URLs
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: services.userService
        - name: NOTIFICATION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: services.notificationService
        - name: MATCHING_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: services.matchingService
        - name: PAYMENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: workflow-engine-config
              key: services.paymentService

        # Internal Service Key
        - name: INTERNAL_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: workflow-engine-secrets
              key: internal.service.key

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

      terminationGracePeriodSeconds: 30

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - workflow-engine
              topologyKey: kubernetes.io/hostname
