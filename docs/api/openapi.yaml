openapi: 3.0.3
info:
  title: Flamoral Dating Platform API
  description: |
    Complete API documentation for the Flamoral Dating Platform.

    This dating platform features:
    - User authentication and profiles
    - Discovery and matching system
    - Real-time messaging
    - Subscription and coins system
    - Boost products
    - Privacy controls
    - Notifications
    - Payment processing
  version: 1.0.0
  contact:
    name: Flamoral Platform Team
    email: platform@flamoral.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.flamoral.com
    description: Production API

tags:
  - name: Platform
    description: Platform information and configuration
  - name: Auth
    description: Authentication and authorization endpoints
  - name: Profile
    description: User profile management
  - name: Photos
    description: Photo upload and management
  - name: Discovery
    description: User discovery and preferences
  - name: Swipes
    description: Swiping actions
  - name: Matches
    description: Match management
  - name: Conversations
    description: Conversation management
  - name: Messages
    description: Message operations
  - name: Subscriptions
    description: Subscription management
  - name: Coins
    description: Virtual currency operations
  - name: Boosts
    description: Profile boost features
  - name: Privacy
    description: Privacy settings
  - name: Blocks
    description: User blocking
  - name: Reports
    description: User reporting
  - name: Notifications
    description: Notification management
  - name: Payments
    description: Payment processing
  - name: Media
    description: Media upload services

paths:
  # ============== PLATFORM ENDPOINTS ==============
  /api/v1/platform/version:
    get:
      tags: [Platform]
      summary: Get application version information
      operationId: getPlatformVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'

  /api/v1/platform/config/public:
    get:
      tags: [Platform]
      summary: Get public configuration
      operationId: getPublicConfig
      responses:
        '200':
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'

  # ============== AUTH SERVICE ==============
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists

  /api/auth/login:
    post:
      tags: [Auth]
      summary: User login
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: User logout
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified successfully

  /api/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification email
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification email sent

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset email sent

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/validate-token:
    post:
      tags: [Auth]
      summary: Validate JWT token
      operationId: validateToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============== USER SERVICE - PROFILE ==============
  /api/profile:
    get:
      tags: [Profile]
      summary: Get user profile
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
    put:
      tags: [Profile]
      summary: Update user profile
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  # ============== USER SERVICE - PHOTOS ==============
  /api/photos:
    get:
      tags: [Photos]
      summary: Get user photos
      operationId: getPhotos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Photo'
    post:
      tags: [Photos]
      summary: Upload photo
      operationId: uploadPhoto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'

  /api/photos/{id}:
    delete:
      tags: [Photos]
      summary: Delete photo
      operationId: deletePhoto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Photo deleted

  /api/photos/{id}/primary:
    put:
      tags: [Photos]
      summary: Set primary photo
      operationId: setPrimaryPhoto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Primary photo set

  /api/photos/reorder:
    put:
      tags: [Photos]
      summary: Reorder photos
      operationId: reorderPhotos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Photos reordered

  # ============== USER SERVICE - SUBSCRIPTIONS ==============
  /api/subscriptions/current:
    get:
      tags: [Subscriptions]
      summary: Get current subscription
      operationId: getCurrentSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /api/subscriptions/features:
    get:
      tags: [Subscriptions]
      summary: Get available features
      operationId: getSubscriptionFeatures
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available features
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'

  /api/subscriptions/features/{key}/access:
    get:
      tags: [Subscriptions]
      summary: Check feature access
      operationId: checkFeatureAccess
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Feature access status
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasAccess:
                    type: boolean

  /api/subscriptions/tier:
    put:
      tags: [Subscriptions]
      summary: Update subscription tier
      operationId: updateSubscriptionTier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
                  enum: [free, premium, premium_plus]
      responses:
        '200':
          description: Subscription updated

  /api/subscriptions/cancel:
    post:
      tags: [Subscriptions]
      summary: Cancel subscription
      operationId: cancelSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription cancelled

  /api/subscriptions/reactivate:
    post:
      tags: [Subscriptions]
      summary: Reactivate subscription
      operationId: reactivateSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription reactivated

  # ============== USER SERVICE - COINS ==============
  /api/coins/balance:
    get:
      tags: [Coins]
      summary: Get coin balance
      operationId: getCoinBalance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Coin balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: integer

  /api/coins/transactions:
    get:
      tags: [Coins]
      summary: Get coin transactions
      operationId: getCoinTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Transaction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactions'

  /api/coins/transactions/summary:
    get:
      tags: [Coins]
      summary: Get transaction summary
      operationId: getTransactionSummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transaction summary

  /api/coins/products:
    get:
      tags: [Coins]
      summary: Get coin products
      operationId: getCoinProducts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available coin packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoinProduct'

  /api/coins/purchase:
    post:
      tags: [Coins]
      summary: Purchase coins
      operationId: purchaseCoins
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                paymentMethodId:
                  type: string
      responses:
        '200':
          description: Purchase successful

  /api/coins/spend:
    post:
      tags: [Coins]
      summary: Spend coins
      operationId: spendCoins
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                reason:
                  type: string
      responses:
        '200':
          description: Coins spent

  /api/coins/daily-reward:
    post:
      tags: [Coins]
      summary: Claim daily reward
      operationId: claimDailyReward
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daily reward claimed
        '429':
          description: Already claimed today

  # ============== USER SERVICE - BOOSTS ==============
  /api/boosts/products:
    get:
      tags: [Boosts]
      summary: Get boost products
      operationId: getBoostProducts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available boost products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoostProduct'

  /api/boosts/active:
    get:
      tags: [Boosts]
      summary: Get active boosts
      operationId: getActiveBoosts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active boosts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveBoost'

  /api/boosts/history:
    get:
      tags: [Boosts]
      summary: Get boost history
      operationId: getBoostHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Boost history

  /api/boosts/activate-with-coins:
    post:
      tags: [Boosts]
      summary: Activate boost with coins
      operationId: activateBoostWithCoins
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                boostProductId:
                  type: string
      responses:
        '200':
          description: Boost activated

  # ============== USER SERVICE - PRIVACY ==============
  /api/privacy/settings:
    get:
      tags: [Privacy]
      summary: Get privacy settings
      operationId: getPrivacySettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Privacy settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
    put:
      tags: [Privacy]
      summary: Update privacy settings
      operationId: updatePrivacySettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettings'
      responses:
        '200':
          description: Privacy settings updated

  # ============== USER SERVICE - BLOCKS ==============
  /api/blocks:
    get:
      tags: [Blocks]
      summary: Get blocked users
      operationId: getBlockedUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Blocked users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockedUser'
    post:
      tags: [Blocks]
      summary: Block user
      operationId: blockUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
      responses:
        '201':
          description: User blocked

  /api/blocks/{userId}:
    delete:
      tags: [Blocks]
      summary: Unblock user
      operationId: unblockUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User unblocked

  # ============== USER SERVICE - REPORTS ==============
  /api/reports/categories:
    get:
      tags: [Reports]
      summary: Get report categories
      operationId: getReportCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Report categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportCategory'

  /api/reports:
    post:
      tags: [Reports]
      summary: Submit report
      operationId: submitReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '201':
          description: Report submitted

  # ============== MATCHING SERVICE ==============
  /api/discovery:
    get:
      tags: [Discovery]
      summary: Get discovery feed
      operationId: getDiscoveryFeed
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Discovery feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscoveryProfile'

  /api/discovery/preferences:
    get:
      tags: [Discovery]
      summary: Get discovery preferences
      operationId: getDiscoveryPreferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Discovery preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryPreferences'
    put:
      tags: [Discovery]
      summary: Update discovery preferences
      operationId: updateDiscoveryPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryPreferences'
      responses:
        '200':
          description: Preferences updated

  /api/swipes:
    post:
      tags: [Swipes]
      summary: Record swipe action
      operationId: recordSwipe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwipeRequest'
      responses:
        '200':
          description: Swipe recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwipeResponse'

  /api/swipes/stats:
    get:
      tags: [Swipes]
      summary: Get swipe statistics
      operationId: getSwipeStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Swipe statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwipeStats'

  /api/matches:
    get:
      tags: [Matches]
      summary: Get all matches
      operationId: getMatches
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMatches'

  /api/matches/recent:
    get:
      tags: [Matches]
      summary: Get recent matches
      operationId: getRecentMatches
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent matches

  /api/matches/count:
    get:
      tags: [Matches]
      summary: Get match count
      operationId: getMatchCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Match count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /api/matches/{matchId}:
    get:
      tags: [Matches]
      summary: Get match details
      operationId: getMatchDetails
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Match details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
    delete:
      tags: [Matches]
      summary: Unmatch user
      operationId: unmatchUser
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unmatched successfully

  /api/matches/{matchId}/extend:
    post:
      tags: [Matches]
      summary: Extend match expiry
      operationId: extendMatchExpiry
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Match extended

  /api/matches/{targetUserId}/rematch:
    post:
      tags: [Matches]
      summary: Request rematch
      operationId: requestRematch
      security:
        - bearerAuth: []
      parameters:
        - name: targetUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rematch requested

  # ============== MESSAGING SERVICE ==============
  /api/conversations:
    get:
      tags: [Conversations]
      summary: Get conversations
      operationId: getConversations
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversations'

  /api/conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get conversation details
      operationId: getConversation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /api/conversations/{id}/messages:
    get:
      tags: [Conversations]
      summary: Get conversation messages
      operationId: getConversationMessages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Conversation messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessages'

  /api/conversations/{id}/read:
    put:
      tags: [Conversations]
      summary: Mark conversation as read
      operationId: markConversationRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marked as read

  /api/conversations/{id}/archive:
    put:
      tags: [Conversations]
      summary: Archive conversation
      operationId: archiveConversation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation archived

  /api/messages:
    post:
      tags: [Messages]
      summary: Send message
      operationId: sendMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/messages/unread-count:
    get:
