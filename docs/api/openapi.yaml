                $ref: '#/components/schemas/PaginatedNotifications'

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      operationId: getUnreadNotificationCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /api/notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Mark notification as read
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marked as read

  /api/notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All marked as read

  /api/notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get notification preferences
      operationId: getNotificationPreferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
    put:
      tags: [Notifications]
      summary: Update notification preferences
      operationId: updateNotificationPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Preferences updated

  /api/notifications/devices:
    post:
      tags: [Notifications]
      summary: Register device for push notifications
      operationId: registerDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '201':
          description: Device registered

  # ============== PAYMENT SERVICE ==============
  /api/payments/create-intent:
    post:
      tags: [Payments]
      summary: Create payment intent
      operationId: createPaymentIntent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
      responses:
        '200':
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'

  /api/payments/history:
    get:
      tags: [Payments]
      summary: Get payment history
      operationId: getPaymentHistory
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPayments'

  /api/payments/methods:
    get:
      tags: [Payments]
      summary: Get payment methods
      operationId: getPaymentMethods
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'

  /api/payments/webhook:
    post:
      tags: [Payments]
      summary: Stripe webhook
      operationId: handleStripeWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed

  # ============== MEDIA SERVICE ==============
  /api/media/upload:
    post:
      tags: [Media]
      summary: Upload media file
      operationId: uploadMedia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [photo, video, voice]
      responses:
        '201':
          description: Media uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'

  /api/media/presigned-url:
    get:
      tags: [Media]
      summary: Get presigned upload URL
      operationId: getPresignedUrl
      security:
        - bearerAuth: []
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
        - name: contentType
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Presigned URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  key:
                    type: string

  /api/media/video:
    post:
      tags: [Media]
      summary: Upload video
      operationId: uploadVideo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  format: binary
      responses:
        '201':
          description: Video uploaded

  /api/media/voice-note:
    post:
      tags: [Media]
      summary: Upload voice note
      operationId: uploadVoiceNote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '201':
          description: Voice note uploaded

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # Platform schemas
    VersionInfo:
      type: object
      properties:
        version:
          type: string
          example: "1.0.0"
        build:
          type: string
          example: "abc1234"
        environment:
          type: string
          enum: [development, staging, production]
          example: "production"
        timestamp:
          type: string
          format: date-time
          example: "2025-12-17T10:30:00.000Z"

    PublicConfig:
      type: object
      properties:
        features:
          type: object
          properties:
            videoCallsEnabled:
              type: boolean
              example: true
            verificationEnabled:
              type: boolean
              example: true
            maxPhotos:
              type: integer
              example: 6
        support:
          type: object
          properties:
            email:
              type: string
              format: email
              example: "support@flamoral.com"
        legal:
          type: object
          properties:
            termsUrl:
              type: string
              example: "/legal/terms"
            privacyUrl:
              type: string
              example: "/legal/privacy"

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer

    RegisterRequest:
      type: object
      required: [email, password, firstName, dateOfBirth, gender]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Profile:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        age:
          type: integer
        bio:
          type: string
        location:
          type: object
          properties:
            city:
              type: string
            country:
              type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        interests:
          type: array
          items:
            type: string

    ProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
        bio:
          type: string
        interests:
          type: array
          items:
            type: string

    Photo:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        isPrimary:
          type: boolean
        order:
          type: integer

    Subscription:
      type: object
      properties:
        tier:
          type: string
          enum: [free, premium, premium_plus]
        status:
          type: string
          enum: [active, cancelled, expired]
        expiresAt:
          type: string
          format: date-time

    Feature:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        requiredTier:
          type: string

    CoinProduct:
      type: object
      properties:
        id:
          type: string
        coins:
          type: integer
        price:
          type: number
        currency:
          type: string

    BoostProduct:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        durationMinutes:
          type: integer
        coinCost:
          type: integer

    ActiveBoost:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        expiresAt:
          type: string
          format: date-time

    PrivacySettings:
      type: object
      properties:
        showOnlineStatus:
          type: boolean
        showLastActive:
          type: boolean
        showDistance:
          type: boolean
        showAge:
          type: boolean

    BlockedUser:
      type: object
      properties:
        userId:
          type: string
        blockedAt:
          type: string
          format: date-time

    ReportCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    ReportRequest:
      type: object
      required: [userId, categoryId]
      properties:
        userId:
          type: string
        categoryId:
          type: string
        description:
          type: string

    DiscoveryProfile:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        age:
          type: integer
        bio:
          type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        distance:
          type: number

    DiscoveryPreferences:
      type: object
      properties:
        minAge:
          type: integer
        maxAge:
          type: integer
        maxDistance:
          type: integer
        genderPreference:
          type: array
          items:
            type: string

    SwipeRequest:
      type: object
      required: [targetUserId, direction]
      properties:
        targetUserId:
          type: string
        direction:
          type: string
          enum: [like, pass, superlike]

    SwipeResponse:
      type: object
      properties:
        matched:
          type: boolean
        matchId:
          type: string

    SwipeStats:
      type: object
      properties:
        totalSwipes:
          type: integer
        likes:
          type: integer
        passes:
          type: integer
        superLikes:
          type: integer
        likesRemaining:
          type: integer

    Match:
      type: object
      properties:
        id:
          type: string
        user:
          $ref: '#/components/schemas/DiscoveryProfile'
        matchedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        conversationId:
          type: string

    PaginatedMatches:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Conversation:
      type: object
      properties:
        id:
          type: string
        matchId:
          type: string
        participant:
          $ref: '#/components/schemas/DiscoveryProfile'
        lastMessage:
          $ref: '#/components/schemas/Message'
        unreadCount:
          type: integer

    PaginatedConversations:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [text, image, gif, voice]
        status:
          type: string
          enum: [sent, delivered, read]
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [conversationId, content]
      properties:
        conversationId:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [text, image, gif, voice]

    PaginatedMessages:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PaginatedNotifications:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'

    NotificationPreferences:
      type: object
      properties:
        newMatches:
          type: boolean
        newMessages:
          type: boolean
        likes:
          type: boolean
        promotions:
          type: boolean

    DeviceRegistration:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
        platform:
          type: string
          enum: [ios, android, web]

    PaymentIntentRequest:
      type: object
      required: [productId, productType]
      properties:
        productId:
          type: string
        productType:
          type: string
          enum: [subscription, coins, boost]

    PaymentIntent:
      type: object
      properties:
        clientSecret:
          type: string
        paymentIntentId:
          type: string

    Payment:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
        productType:
          type: string
        createdAt:
          type: string
          format: date-time

    PaginatedPayments:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        pagination:
          $ref: '#/components/schemas/Pagination'

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        last4:
          type: string
        brand:
          type: string
        isDefault:
          type: boolean

    MediaUploadResponse:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        type:
          type: string

    PaginatedTransactions:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              amount:
                type: integer
              type:
                type: string
              description:
                type: string
              createdAt:
                type: string
                format: date-time
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
