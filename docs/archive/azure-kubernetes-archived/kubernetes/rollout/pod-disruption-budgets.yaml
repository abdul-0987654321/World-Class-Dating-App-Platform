# =============================================================================
# Flamoral Pod Disruption Budgets
# =============================================================================
# Ensures high availability during updates and node maintenance
# =============================================================================

---
# PDB for Web App - maintain at least 1 replica during disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flamoral-web-pdb
  namespace: flamoral
  labels:
    app: flamoral-web
    component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: flamoral-web

---
# PDB for API Gateway - maintain at least 1 replica
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: flamoral
  labels:
    app: api-gateway
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway

---
# PDB for Auth Service - critical service, maintain at least 1
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: flamoral
  labels:
    app: auth-service
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service

---
# PDB for User Service - critical service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service-pdb
  namespace: flamoral
  labels:
    app: user-service
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user-service

---
# PDB for Messaging Service - real-time critical
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: messaging-service-pdb
  namespace: flamoral
  labels:
    app: messaging-service
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: messaging-service

---
# PDB for Matching Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: matching-service-pdb
  namespace: flamoral
  labels:
    app: matching-service
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: matching-service
