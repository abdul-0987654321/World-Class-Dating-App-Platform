# =============================================================================
# External Secrets Configuration for Flamoral Dating Platform
# Uses External Secrets Operator with Azure Key Vault
# =============================================================================

---
# ClusterSecretStore - connects to Azure Key Vault
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault-store
spec:
  provider:
    azurekv:
      tenantId: "${AZURE_TENANT_ID}"
      vaultUrl: "https://flamoral-prod-kv.vault.azure.net/"
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets-sa
        namespace: external-secrets

---
# =============================================================================
# DATABASE SECRETS
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-database-secrets
  namespace: flamoral
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: flamoral-database-secrets
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: database-url
  - secretKey: DB_PASSWORD
    remoteRef:
      key: database-password
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: postgres-password
  - secretKey: MONGODB_URI
    remoteRef:
      key: mongodb-uri
  - secretKey: CLICKHOUSE_PASSWORD
    remoteRef:
      key: clickhouse-password

