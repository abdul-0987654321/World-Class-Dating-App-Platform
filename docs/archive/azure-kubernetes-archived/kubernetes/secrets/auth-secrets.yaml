# =============================================================================
# Flamoral Dating Platform - Auth Service Secrets
# =============================================================================
# SECURITY CRITICAL: This file contains sensitive credentials.
#
# IMPORTANT INSTRUCTIONS:
# 1. NEVER commit actual secrets to version control
# 2. Replace placeholder values before applying
# 3. Use Azure Key Vault in production (see approach below)
# 4. Generate secrets using: openssl rand -base64 32
#
# Generation Commands:
#   JWT_ACCESS_SECRET=$(openssl rand -base64 32)
#   JWT_REFRESH_SECRET=$(openssl rand -base64 32)
#   INTERNAL_SERVICE_KEY=$(openssl rand -base64 32)
#
# Apply with:
#   kubectl apply -f auth-secrets.yaml
#
# Last Updated: 2024-12-21
# =============================================================================

---
# Option 1: Direct Secret (for development/staging only)
# In production, use Azure Key Vault via External Secrets Operator
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: flamoral
  labels:
    app: auth-service
    component: secrets
    environment: production
type: Opaque
stringData:
  # =============================================================================
  # JWT Secrets (REQUIRED)
  # =============================================================================
  # Generate with: openssl rand -base64 32
  # These MUST be at least 32 characters long
  JWT_ACCESS_SECRET: "REPLACE_WITH_GENERATED_SECRET_1_MINIMUM_32_CHARS"
  JWT_REFRESH_SECRET: "REPLACE_WITH_GENERATED_SECRET_2_MINIMUM_32_CHARS"

  # =============================================================================
  # Internal Service Authentication
  # =============================================================================
  # Used for service-to-service communication
  INTERNAL_SERVICE_KEY: "REPLACE_WITH_GENERATED_SECRET_3"

  # =============================================================================
  # Database Credentials
  # =============================================================================
  DB_USER: "flamoral"
  DB_PASSWORD: "REPLACE_WITH_DATABASE_PASSWORD"
  DATABASE_URL: "postgresql://flamoral:REPLACE_WITH_DATABASE_PASSWORD@postgres:5432/flamoral_db?sslmode=require"

  # =============================================================================
  # Redis Authentication
  # =============================================================================
  REDIS_URL: "redis://:REPLACE_WITH_REDIS_PASSWORD@redis:6379/0"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"

  # =============================================================================
  # Email Service (SendGrid)
  # =============================================================================
  SMTP_USER: "apikey"
  SMTP_PASSWORD: "REPLACE_WITH_SENDGRID_API_KEY"
  SENDGRID_API_KEY: "REPLACE_WITH_SENDGRID_API_KEY"

  # =============================================================================
  # OAuth Provider Secrets
  # =============================================================================
  # Google OAuth 2.0
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"

  # Apple Sign-In
  APPLE_CLIENT_ID: "com.flamoral.app"
  APPLE_TEAM_ID: "REPLACE_WITH_APPLE_TEAM_ID"
  APPLE_KEY_ID: "REPLACE_WITH_APPLE_KEY_ID"
  APPLE_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_APPLE_PRIVATE_KEY_CONTENT
    -----END PRIVATE KEY-----

  # Facebook OAuth
  FACEBOOK_APP_ID: "REPLACE_WITH_FACEBOOK_APP_ID"
  FACEBOOK_APP_SECRET: "REPLACE_WITH_FACEBOOK_APP_SECRET"

---
# Option 2: External Secrets Operator with Azure Key Vault (RECOMMENDED for production)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-secrets-external
  namespace: flamoral
  labels:
    app: auth-service
    component: external-secrets
    environment: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: auth-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app: auth-service
          component: secrets
  data:
    # JWT Secrets
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: JWT-ACCESS-SECRET
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: JWT-REFRESH-SECRET

    # Internal Service Key
    - secretKey: INTERNAL_SERVICE_KEY
      remoteRef:
        key: INTERNAL-SERVICE-KEY

    # Database
    - secretKey: DB_PASSWORD
      remoteRef:
        key: DB-PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: AUTH-SERVICE-DATABASE-URL

    # Redis
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS-PASSWORD
    - secretKey: REDIS_URL
      remoteRef:
        key: REDIS-URL

    # SendGrid
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: SENDGRID-API-KEY
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: SENDGRID-API-KEY

    # Google OAuth
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: GOOGLE-CLIENT-ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: GOOGLE-CLIENT-SECRET

    # Apple Sign-In
    - secretKey: APPLE_CLIENT_ID
      remoteRef:
        key: APPLE-CLIENT-ID
    - secretKey: APPLE_TEAM_ID
      remoteRef:
        key: APPLE-TEAM-ID
    - secretKey: APPLE_KEY_ID
      remoteRef:
        key: APPLE-KEY-ID
    - secretKey: APPLE_PRIVATE_KEY
      remoteRef:
        key: APPLE-PRIVATE-KEY

    # Facebook OAuth
    - secretKey: FACEBOOK_APP_ID
      remoteRef:
        key: FACEBOOK-APP-ID
    - secretKey: FACEBOOK_APP_SECRET
      remoteRef:
        key: FACEBOOK-APP-SECRET

---
# ClusterSecretStore for Azure Key Vault (if not already defined)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault-store
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultUrl: "https://flamoral-prod-kv.vault.azure.net"
      # Use the managed identity assigned to the AKS cluster
      # identityId: "YOUR-USER-ASSIGNED-IDENTITY-CLIENT-ID"

---
# =============================================================================
# Usage Instructions
# =============================================================================
#
# Development/Testing:
# 1. Copy this file and replace placeholder values
# 2. Apply: kubectl apply -f auth-secrets.yaml
#
# Production (Azure Key Vault):
# 1. Store all secrets in Azure Key Vault with the specified key names
# 2. Install External Secrets Operator
# 3. Apply only the ExternalSecret resource
#
# Key Vault Secret Names:
#   - JWT-ACCESS-SECRET
#   - JWT-REFRESH-SECRET
#   - INTERNAL-SERVICE-KEY
#   - DB-PASSWORD
#   - AUTH-SERVICE-DATABASE-URL
#   - REDIS-PASSWORD
#   - REDIS-URL
#   - SENDGRID-API-KEY
#   - GOOGLE-CLIENT-ID
#   - GOOGLE-CLIENT-SECRET
#   - APPLE-CLIENT-ID
#   - APPLE-TEAM-ID
#   - APPLE-KEY-ID
#   - APPLE-PRIVATE-KEY
#   - FACEBOOK-APP-ID
#   - FACEBOOK-APP-SECRET
#
# Generate JWT secrets:
#   az keyvault secret set --vault-name flamoral-prod-kv \
#     --name JWT-ACCESS-SECRET \
#     --value "$(openssl rand -base64 32)"
#
#   az keyvault secret set --vault-name flamoral-prod-kv \
#     --name JWT-REFRESH-SECRET \
#     --value "$(openssl rand -base64 32)"
#
# =============================================================================
