# =============================================================================
# External Secrets for PostgreSQL and Redis (Flamoral Production)
# =============================================================================
# These ExternalSecret resources sync database credentials from Azure Key Vault
# to Kubernetes secrets in the flamoral namespace.
#
# Prerequisites:
# 1. External Secrets Operator installed
# 2. ClusterSecretStore 'azure-keyvault-store' configured
# 3. Azure Key Vault secrets populated (see setup-database-infrastructure.sh)
# =============================================================================

---
# =============================================================================
# POSTGRESQL CREDENTIALS
# Azure Database for PostgreSQL Flexible Server: flamoral-prod-db
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: flamoral
  labels:
    app.kubernetes.io/name: postgres-credentials
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flamoral-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: postgres-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: postgres-credentials
          app.kubernetes.io/component: database
      data:
        # Static configuration values
        host: "flamoral-prod-db.postgres.database.azure.com"
        port: "5432"
        username: "flamoraladmin"
        ssl-mode: "require"
        database: "flamoral_users"
  data:
  # Password from Key Vault
  - secretKey: password
    remoteRef:
      key: postgres-password

  # Main connection string
  - secretKey: connection-string
    remoteRef:
      key: database-url

  # Per-service database URLs
  - secretKey: auth-database-url
    remoteRef:
      key: auth-database-url

  - secretKey: users-database-url
    remoteRef:
      key: users-database-url

  - secretKey: matching-database-url
    remoteRef:
      key: matching-database-url

  - secretKey: messaging-database-url
    remoteRef:
      key: messaging-database-url

---
# =============================================================================
# REDIS CREDENTIALS
# Azure Cache for Redis: flamoral-prod-redis
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: flamoral
  labels:
    app.kubernetes.io/name: redis-credentials
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: flamoral-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-store
  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: redis-credentials
          app.kubernetes.io/component: cache
      data:
        # Static configuration values
        host: "flamoral-prod-redis.redis.cache.windows.net"
        port: "6380"
        tls-enabled: "true"
  data:
  # Password (access key) from Key Vault
  - secretKey: password
    remoteRef:
      key: redis-password

  # Full connection string
  - secretKey: connection-string
    remoteRef:
      key: redis-url

  # Alternative key for compatibility
  - secretKey: url
    remoteRef:
      key: redis-url

---
# =============================================================================
# DATABASE CONFIGMAP (Non-sensitive configuration)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: flamoral
  labels:
    app.kubernetes.io/name: database-config
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: flamoral-platform
data:
  # PostgreSQL Configuration
  POSTGRES_HOST: "flamoral-prod-db.postgres.database.azure.com"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "flamoraladmin"
  POSTGRES_SSL_MODE: "require"

  # Database names
  AUTH_DATABASE: "flamoral_auth"
  USERS_DATABASE: "flamoral_users"
  MATCHING_DATABASE: "flamoral_matching"
  MESSAGING_DATABASE: "flamoral_messaging"

  # Redis Configuration
  REDIS_HOST: "flamoral-prod-redis.redis.cache.windows.net"
  REDIS_PORT: "6380"
  REDIS_TLS_ENABLED: "true"

  # Connection Pool Settings
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  DB_CONNECTION_TIMEOUT: "30000"
  DB_IDLE_TIMEOUT: "10000"

  # Redis Settings
  REDIS_MAX_RETRIES: "3"
  REDIS_RETRY_DELAY: "1000"
  REDIS_CONNECT_TIMEOUT: "10000"
