apiVersion: v1
kind: ConfigMap
metadata:
  name: flamoral-common-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    environment: ${ENVIRONMENT}
    tier: configuration
data:
  # Environment Settings
  NODE_ENV: "${ENVIRONMENT}"
  ENVIRONMENT: "${ENVIRONMENT}"
  LOG_LEVEL: "${LOG_LEVEL}"
  LOG_FORMAT: "json"

  # Service Discovery (Kubernetes Internal)
  USER_SERVICE_URL: "http://user-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3001"
  AUTH_SERVICE_URL: "http://auth-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3011"
  MATCHING_SERVICE_URL: "http://matching-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3002"
  MESSAGING_SERVICE_URL: "http://messaging-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3003"
  MODERATION_SERVICE_URL: "http://moderation-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3004"
  PAYMENT_SERVICE_URL: "http://payment-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3005"
  MEDIA_SERVICE_URL: "http://media-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3006"
  NOTIFICATION_SERVICE_URL: "http://notification-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3008"
  ANALYTICS_SERVICE_URL: "http://analytics-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3007"
  AI_SERVICE_URL: "http://ai-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3009"
  ADVERTISING_SERVICE_URL: "http://advertising-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3010"
  REALTIME_SERVICE_URL: "http://realtime-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3012"
  ADMIN_SERVICE_URL: "http://admin-service.flamoral-${ENVIRONMENT}.svc.cluster.local:3013"

  # External URLs
  WEB_URL: "${WEB_URL}"
  API_URL: "${API_URL}"
  ADMIN_URL: "${ADMIN_URL}"
  API_VERSION: "v1"

  # Database Configuration (Non-sensitive)
  DB_HOST: "${DB_HOST}"
  DB_PORT: "5432"
  DB_NAME: "${DB_NAME}"
  DB_USER: "${DB_USER}"
  DB_POOL_MIN: "${DB_POOL_MIN}"
  DB_POOL_MAX: "${DB_POOL_MAX}"
  DB_SSL: "true"
  DB_CONNECTION_TIMEOUT: "30000"

  # MongoDB Configuration (Non-sensitive)
  MONGODB_DB: "${MONGODB_DB}"
  MONGODB_MAX_POOL_SIZE: "${MONGODB_MAX_POOL_SIZE}"
  MONGODB_MIN_POOL_SIZE: "${MONGODB_MIN_POOL_SIZE}"

  # Redis Configuration (Non-sensitive)
  REDIS_HOST: "${REDIS_HOST}"
  REDIS_PORT: "${REDIS_PORT}"
  REDIS_DB: "0"
  REDIS_TLS: "true"
  REDIS_TTL: "3600"

  # JWT Configuration (Non-sensitive)
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  JWT_ALGORITHM: "HS256"
  JWT_ISSUER: "flamoral-${ENVIRONMENT}"

  # CORS Configuration
  CORS_ORIGIN: "${CORS_ORIGIN}"
  CORS_CREDENTIALS: "true"
  CORS_MAX_AGE: "86400"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS}"

  # File Upload Configuration
  MAX_FILE_SIZE: "10485760"
  MAX_PHOTO_COUNT: "10"
  MAX_VIDEO_SIZE: "52428800"
  ALLOWED_IMAGE_TYPES: "image/jpeg,image/png,image/webp"
  ALLOWED_VIDEO_TYPES: "video/mp4,video/quicktime"
  UPLOAD_VIRUS_SCAN_ENABLED: "${UPLOAD_VIRUS_SCAN_ENABLED}"

  # WebSocket Configuration
  WS_PORT: "5000"
  WS_HEARTBEAT_INTERVAL: "30000"
  WS_HEARTBEAT_TIMEOUT: "60000"
  WS_MAX_CONNECTIONS_PER_USER: "3"

  # Feature Flags
  FEATURE_AI_MATCHING: "${FEATURE_AI_MATCHING}"
  FEATURE_VIDEO_CALLS: "${FEATURE_VIDEO_CALLS}"
  FEATURE_TRAVEL_MODE: "${FEATURE_TRAVEL_MODE}"
  FEATURE_DATING_COACH: "${FEATURE_DATING_COACH}"
  FEATURE_GAMIFICATION: "${FEATURE_GAMIFICATION}"
  FEATURE_SOCIAL_FEED: "${FEATURE_SOCIAL_FEED}"
  FEATURE_STORIES: "${FEATURE_STORIES}"
  FEATURE_BETA_FEATURES: "${FEATURE_BETA_FEATURES}"

  # Monitoring
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  PROMETHEUS_PORT: "9090"
  JAEGER_AGENT_HOST: "jaeger-agent.flamoral-${ENVIRONMENT}.svc.cluster.local"
  JAEGER_AGENT_PORT: "6831"

  # Sentry Configuration (Non-sensitive)
  SENTRY_ENVIRONMENT: "${ENVIRONMENT}"
  SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE}"

  # Azure Configuration (Non-sensitive)
  AZURE_STORAGE_ACCOUNT: "${AZURE_STORAGE_ACCOUNT}"
  AZURE_STORAGE_CONTAINER_PHOTOS: "photos"
  AZURE_STORAGE_CONTAINER_VIDEOS: "videos"
  AZURE_STORAGE_CONTAINER_DOCUMENTS: "documents"
  AZURE_STORAGE_CDN_ENDPOINT: "${AZURE_STORAGE_CDN_ENDPOINT}"
  AZURE_FACE_API_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"
  AZURE_CONTENT_MODERATOR_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"

  # Firebase Configuration (Non-sensitive)
  FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
  FIREBASE_DATABASE_URL: "${FIREBASE_DATABASE_URL}"

  # Queue Names
  QUEUE_MATCHING: "matching_queue"
  QUEUE_NOTIFICATIONS: "notification_queue"
  QUEUE_ANALYTICS: "analytics_queue"
  QUEUE_MODERATION: "moderation_queue"
  QUEUE_MEDIA_PROCESSING: "media_processing_queue"
  QUEUE_EMAIL: "email_queue"
  QUEUE_SMS: "sms_queue"

  # Localization
  DEFAULT_LANGUAGE: "en"
  SUPPORTED_LANGUAGES: "en,es,fr,de,it,pt,ja,ko,zh"
  DEFAULT_TIMEZONE: "UTC"

  # Business Rules
  MIN_AGE: "18"
  MAX_AGE: "100"
  FREE_LIKES_PER_DAY: "10"
  FREE_SUPER_LIKES_PER_DAY: "1"
  MATCH_EXPIRY_DAYS: "30"
  MESSAGE_RETENTION_DAYS: "365"

  # Security Configuration
  BCRYPT_ROUNDS: "12"
  PASSWORD_MIN_LENGTH: "8"
  MAX_LOGIN_ATTEMPTS: "5"
  ACCOUNT_LOCKOUT_DURATION: "1800000"
  HSTS_MAX_AGE: "31536000"
  HSTS_INCLUDE_SUBDOMAINS: "true"

  # CDN Configuration
  CDN_ENABLED: "${CDN_ENABLED}"
  CDN_URL: "${CDN_URL}"

  # Background Jobs
  ENABLE_BACKGROUND_JOBS: "true"
  JOB_CONCURRENCY: "${JOB_CONCURRENCY}"
  JOB_RETRY_ATTEMPTS: "3"
  JOB_RETRY_DELAY: "5000"

  # Data Retention
  GDPR_ENABLED: "true"
  CCPA_ENABLED: "true"
  DATA_RETENTION_DAYS: "730"
  AUDIT_LOG_ENABLED: "true"

  # Geolocation
  DEFAULT_LOCATION_RADIUS_KM: "50"

  # AI/ML Configuration
  OPENAI_MODEL: "gpt-4"
  OPENAI_MAX_TOKENS: "2000"
