apiVersion: v1
kind: ConfigMap
metadata:
  name: ${SERVICE_NAME}-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: ${SERVICE_NAME}
    environment: ${ENVIRONMENT}
    tier: configuration
data:
  # Service-specific Port
  PORT: "${SERVICE_PORT}"
  HOST: "0.0.0.0"

  # Service Name
  SERVICE_NAME: "${SERVICE_NAME}"

  # Additional service-specific configurations can be added here
  # Reference common config for shared settings

---
# Example: User Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: user-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3001"
  SERVICE_NAME: "user-service"
  # User service specific settings
  MAX_PROFILE_PHOTOS: "10"
  PROFILE_COMPLETION_THRESHOLD: "70"
  EMAIL_VERIFICATION_REQUIRED: "true"
  PHONE_VERIFICATION_REQUIRED: "true"

---
# Example: Auth Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: auth-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3011"
  SERVICE_NAME: "auth-service"
  # Auth service specific settings
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
  FACEBOOK_APP_ID: "${FACEBOOK_APP_ID}"
  APPLE_CLIENT_ID: "${APPLE_CLIENT_ID}"
  OAUTH_CALLBACK_BASE_URL: "${API_URL}"

---
# Example: Matching Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: matching-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: matching-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3002"
  SERVICE_NAME: "matching-service"
  # Matching algorithm settings
  MATCH_SCORE_THRESHOLD: "70"
  MAX_MATCHES_PER_DAY: "50"
  LOCATION_WEIGHT: "0.3"
  INTERESTS_WEIGHT: "0.4"
  PREFERENCES_WEIGHT: "0.3"
  AI_MATCHING_ENABLED: "true"

---
# Example: Messaging Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: messaging-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: messaging-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3003"
  SERVICE_NAME: "messaging-service"
  # Messaging settings
  MAX_MESSAGE_LENGTH: "5000"
  MESSAGE_ATTACHMENTS_ENABLED: "true"
  MAX_ATTACHMENTS_PER_MESSAGE: "5"
  TYPING_INDICATOR_TIMEOUT: "3000"
  READ_RECEIPTS_ENABLED: "true"

---
# Example: Payment Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: payment-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3005"
  SERVICE_NAME: "payment-service"
  # Payment settings
  STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY}"
  STRIPE_API_VERSION: "2024-12-18.acacia"
  PAYMENT_CURRENCY: "USD"
  TAX_RATE: "0.0"
  REFUND_WINDOW_DAYS: "30"

---
# Example: Media Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: media-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: media-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3006"
  SERVICE_NAME: "media-service"
  # Media processing settings
  IMAGE_QUALITY: "85"
  THUMBNAIL_SIZE: "200x200"
  MEDIUM_SIZE: "800x800"
  VIDEO_TRANSCODE_ENABLED: "true"
  VIDEO_MAX_DURATION: "60"
  FACE_DETECTION_ENABLED: "true"

---
# Example: Notification Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: notification-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3008"
  SERVICE_NAME: "notification-service"
  # Notification settings
  SENDGRID_FROM_EMAIL: "${SENDGRID_FROM_EMAIL}"
  SENDGRID_FROM_NAME: "${SENDGRID_FROM_NAME}"
  TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
  EMAIL_RETRY_ATTEMPTS: "3"
  SMS_RETRY_ATTEMPTS: "3"
  PUSH_NOTIFICATION_ENABLED: "true"

---
# Example: Analytics Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: analytics-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3007"
  SERVICE_NAME: "analytics-service"
  # Analytics settings
  BATCH_SIZE: "1000"
  FLUSH_INTERVAL: "60000"
  RETENTION_DAYS: "365"
  ANONYMIZE_IP: "true"

---
# Example: AI Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: ai-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3009"
  SERVICE_NAME: "ai-service"
  # AI/ML settings
  OPENAI_MODEL: "gpt-4"
  OPENAI_MAX_TOKENS: "2000"
  OPENAI_TEMPERATURE: "0.7"
  DATING_COACH_ENABLED: "true"
  PROFILE_OPTIMIZATION_ENABLED: "true"

---
# Example: Moderation Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: moderation-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: moderation-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3004"
  SERVICE_NAME: "moderation-service"
  # Moderation settings
  AUTO_MODERATION_ENABLED: "true"
  ADULT_CONTENT_THRESHOLD: "0.7"
  HATE_SPEECH_THRESHOLD: "0.8"
  MANUAL_REVIEW_ENABLED: "true"
  QUARANTINE_ENABLED: "true"

---
# Example: Realtime Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: realtime-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: realtime-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3012"
  SERVICE_NAME: "realtime-service"
  # WebSocket settings
  WS_PATH: "/socket.io"
  WS_CORS_ORIGIN: "${CORS_ORIGIN}"
  WS_PING_TIMEOUT: "60000"
  WS_PING_INTERVAL: "25000"
  WS_MAX_HTTP_BUFFER_SIZE: "1e6"

---
# Example: Admin Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-service-config
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    service: admin-service
    environment: ${ENVIRONMENT}
data:
  PORT: "3013"
  SERVICE_NAME: "admin-service"
  # Admin settings
  ADMIN_SESSION_TIMEOUT: "3600000"
  ADMIN_MFA_REQUIRED: "true"
  ADMIN_IP_WHITELIST_ENABLED: "${ADMIN_IP_WHITELIST_ENABLED}"
