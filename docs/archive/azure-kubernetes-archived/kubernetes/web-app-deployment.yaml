---
# FLAMORAL Web App Kubernetes Deployment
# Image tag uses ${IMAGE_TAG} placeholder - replaced during CI/CD
# Default: git SHA for immutable deploys, or semantic version for releases
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: flamoral
  labels:
    app: web-app
    version: "${IMAGE_TAG}"
  annotations:
    kubernetes.io/change-cause: "Deploy web-app:${IMAGE_TAG}"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
        version: "${IMAGE_TAG}"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      containers:
      - name: web-app
        # Use immutable tag (git SHA) for production deploys
        # CI/CD replaces ${IMAGE_TAG} with actual value
        image: flamoralprodacr.azurecr.io/web-app:${IMAGE_TAG}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: flamoral
spec:
  type: LoadBalancer
  selector:
    app: web-app
  ports:
  - port: 80
    targetPort: 80
