# Alertmanager Secrets
# IMPORTANT: Update these values with your actual secrets before applying
# Consider using external-secrets-operator or sealed-secrets for production
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
  labels:
    app: alertmanager
type: Opaque
stringData:
  # Slack Webhook URL for notifications
  # Get this from: https://api.slack.com/apps -> Incoming Webhooks
  slack-webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

  # PagerDuty Integration Key
  # Get this from: PagerDuty -> Services -> Your Service -> Integrations
  pagerduty-service-key: "YOUR_PAGERDUTY_INTEGRATION_KEY"

---
# Basic Auth Secret for Prometheus UI
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-basic-auth
  namespace: monitoring
  labels:
    app: prometheus
type: Opaque
data:
  # Generate with: htpasswd -nb admin <password> | base64
  # Default: admin:FlamoralAdmin123!
  auth: YWRtaW46JGFwcjEkSFdYSHVLUngkd3d1dHlZTWFBZ29tQ3BtcDJnYnI5Lwo=

---
# Basic Auth Secret for Alertmanager UI
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-basic-auth
  namespace: monitoring
  labels:
    app: alertmanager
type: Opaque
data:
  # Generate with: htpasswd -nb admin <password> | base64
  # Default: admin:FlamoralAdmin123!
  auth: YWRtaW46JGFwcjEkSFdYSHVLUngkd3d1dHlZTWFBZ29tQ3BtcDJnYnI5Lwo=
