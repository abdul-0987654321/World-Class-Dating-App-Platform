# =============================================================================
# Flamoral Dating Platform - Auth Service Configuration
# =============================================================================
# This ConfigMap contains non-sensitive configuration for the auth service.
# Sensitive values (secrets) should be stored in Kubernetes Secrets or Azure Key Vault.
#
# Usage:
#   kubectl apply -f auth-config.yaml
#
# Last Updated: 2024-12-21
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: flamoral
  labels:
    app: auth-service
    component: configuration
    environment: production
data:
  # =============================================================================
  # JWT Configuration
  # =============================================================================
  # Issuer and audience for JWT token validation
  JWT_ISSUER: "https://api.flamoral.com"
  JWT_AUDIENCE: "flamoral-users"

  # Token expiration settings
  # Access tokens are short-lived for security (15 minutes)
  JWT_ACCESS_EXPIRES_IN: "15m"
  # Refresh tokens are longer-lived (7 days)
  JWT_REFRESH_EXPIRES_IN: "7d"

  # =============================================================================
  # CORS Configuration
  # =============================================================================
  # Allowed origins for cross-origin requests
  CORS_ORIGINS: "https://flamoral.com,https://www.flamoral.com,https://app.flamoral.com"

  # =============================================================================
  # Rate Limiting Configuration
  # =============================================================================
  # Time window for rate limiting (15 minutes in milliseconds)
  RATE_LIMIT_WINDOW_MS: "900000"
  # Maximum requests per window
  RATE_LIMIT_MAX_REQUESTS: "100"

  # =============================================================================
  # Service Configuration
  # =============================================================================
  # Server port
  PORT: "3001"
  # Environment
  NODE_ENV: "production"

  # =============================================================================
  # Email Configuration
  # =============================================================================
  # SMTP settings (non-sensitive)
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  EMAIL_FROM: "noreply@flamoral.com"

  # =============================================================================
  # Frontend URLs
  # =============================================================================
  FRONTEND_URL: "https://flamoral.com"

  # =============================================================================
  # OAuth Providers Configuration (non-sensitive)
  # =============================================================================
  # Google OAuth callback URL
  GOOGLE_CALLBACK_URL: "https://api.flamoral.com/api/v1/auth/google/callback"
  # Apple Sign-In callback URL
  APPLE_CALLBACK_URL: "https://api.flamoral.com/api/v1/auth/apple/callback"
  # Facebook OAuth callback URL
  FACEBOOK_CALLBACK_URL: "https://api.flamoral.com/api/v1/auth/facebook/callback"

  # =============================================================================
  # Service Discovery
  # =============================================================================
  # Internal service URLs
  USER_SERVICE_URL: "http://user-service:3002"
  MATCHING_SERVICE_URL: "http://matching-service:3003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3004"

  # =============================================================================
  # Database Configuration (non-sensitive)
  # =============================================================================
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "flamoral_db"
  DB_SSL: "true"
  DB_POOL_SIZE: "20"

  # =============================================================================
  # Redis Configuration (non-sensitive)
  # =============================================================================
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

---
# =============================================================================
# Auth Service Specific ConfigMap for Advanced Settings
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-security-config
  namespace: flamoral
  labels:
    app: auth-service
    component: security-configuration
    environment: production
data:
  # =============================================================================
  # Account Security Settings
  # =============================================================================
  # Maximum failed login attempts before account lockout
  MAX_FAILED_ATTEMPTS: "5"
  # Lockout duration in seconds (15 minutes)
  LOCKOUT_DURATION_SECONDS: "900"
  # Permanent lockout threshold (consecutive lockouts)
  PERMANENT_LOCKOUT_THRESHOLD: "3"

  # =============================================================================
  # Password Policy
  # =============================================================================
  # Minimum password length
  PASSWORD_MIN_LENGTH: "8"
  # Require uppercase letters
  PASSWORD_REQUIRE_UPPERCASE: "true"
  # Require lowercase letters
  PASSWORD_REQUIRE_LOWERCASE: "true"
  # Require numbers
  PASSWORD_REQUIRE_NUMBER: "true"
  # Require special characters
  PASSWORD_REQUIRE_SPECIAL: "true"
  # Enable password breach checking (HaveIBeenPwned API)
  ENABLE_BREACH_CHECKING: "true"

  # =============================================================================
  # Session Management
  # =============================================================================
  # Maximum concurrent sessions per user
  MAX_CONCURRENT_SESSIONS: "5"
  # Session timeout in seconds (30 minutes of inactivity)
  SESSION_IDLE_TIMEOUT: "1800"
  # Require re-authentication for sensitive operations
  REQUIRE_REAUTH_FOR_SENSITIVE: "true"

  # =============================================================================
  # Device Fingerprinting
  # =============================================================================
  # Enable device fingerprinting
  ENABLE_DEVICE_FINGERPRINTING: "true"
  # Send notification for new device login
  NOTIFY_NEW_DEVICE_LOGIN: "true"
  # Maximum trusted devices per user
  MAX_TRUSTED_DEVICES: "10"

  # =============================================================================
  # Email Verification
  # =============================================================================
  # Require email verification in production
  REQUIRE_EMAIL_VERIFICATION: "true"
  # Email verification token expiry (24 hours)
  EMAIL_VERIFICATION_EXPIRY_HOURS: "24"
  # Maximum verification email resends per hour
  MAX_VERIFICATION_RESENDS_PER_HOUR: "3"

  # =============================================================================
  # Password Reset
  # =============================================================================
  # Password reset token expiry (1 hour)
  PASSWORD_RESET_EXPIRY_HOURS: "1"
  # Maximum password reset requests per hour
  MAX_PASSWORD_RESET_PER_HOUR: "3"
