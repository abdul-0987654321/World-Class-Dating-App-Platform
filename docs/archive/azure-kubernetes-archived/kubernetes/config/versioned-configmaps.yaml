# =============================================================================
# Flamoral Versioned ConfigMaps
# =============================================================================
# ConfigMaps with version hashes for immutable deployments
# These are regenerated by CI/CD with content hashes
# =============================================================================

---
# Web App Config - Version 1.0.0
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-config-v1
  namespace: flamoral
  labels:
    app: flamoral-web
    config-version: "v1"
    flamoral.com/managed-by: ci-cd
  annotations:
    flamoral.com/config-hash: "sha256:pending"
    flamoral.com/deployed-at: "2024-01-01T00:00:00Z"
    flamoral.com/deployed-by: "github-actions"
data:
  default.conf: |
    server {
        listen 80;
        server_name flamoral.com www.flamoral.com;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location /api/ {
            proxy_pass http://api-gateway.flamoral.svc.cluster.local/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

---
# API Gateway Config - Version 1.0.0
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config-v1
  namespace: flamoral
  labels:
    app: api-gateway
    config-version: "v1"
    flamoral.com/managed-by: ci-cd
  annotations:
    flamoral.com/config-hash: "sha256:pending"
    flamoral.com/deployed-at: "2024-01-01T00:00:00Z"
    flamoral.com/deployed-by: "github-actions"
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      server {
        listen 80;
        location /health {
          return 200 '{"status":"healthy"}';
          add_header Content-Type application/json;
        }
        location /api/v1/status {
          return 200 '{"api":"flamoral","version":"1.0.0","status":"operational"}';
          add_header Content-Type application/json;
        }
        location / {
          return 200 '{"message":"Welcome to Flamoral API"}';
          add_header Content-Type application/json;
        }
      }
    }

---
# Environment Config Template
apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-config-template
  namespace: flamoral
  labels:
    app: flamoral
    flamoral.com/managed-by: ci-cd
  annotations:
    flamoral.com/description: "Template for versioned environment configs"
data:
  # These values are replaced by CI/CD with environment-specific values
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  API_BASE_URL: "https://api.flamoral.com"
  WEB_BASE_URL: "https://flamoral.com"
  CORS_ORIGINS: "https://flamoral.com,https://www.flamoral.com"

---
# Feature Flags ConfigMap (versioned)
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags-v1
  namespace: flamoral
  labels:
    app: flamoral
    config-version: "v1"
    flamoral.com/managed-by: ci-cd
  annotations:
    flamoral.com/config-hash: "sha256:pending"
    flamoral.com/deployed-at: "2024-01-01T00:00:00Z"
data:
  flags.json: |
    {
      "version": "1.0.0",
      "flags": {
        "enable_video_calls": true,
        "enable_verification": true,
        "enable_virtual_gifts": true,
        "enable_premium_features": true,
        "enable_push_notifications": true,
        "maintenance_mode": false
      }
    }
