# =============================================================================
# Flamoral Drift Detection
# =============================================================================
# Periodic checks for unapproved changes in production
# =============================================================================

---
# Service Account for drift detection
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-detector
  namespace: flamoral
  labels:
    app: drift-detector

---
# ClusterRole for reading resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: drift-detector-reader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: drift-detector-binding
subjects:
  - kind: ServiceAccount
    name: drift-detector
    namespace: flamoral
roleRef:
  kind: ClusterRole
  name: drift-detector-reader
  apiGroup: rbac.authorization.k8s.io

---
# Drift Detection ConfigMap with expected state hashes
apiVersion: v1
kind: ConfigMap
metadata:
  name: drift-detection-baseline
  namespace: flamoral
  labels:
    app: drift-detector
data:
  # These hashes should be updated by CI/CD after each deployment
  # Format: resource-type/name: sha256-hash
  baseline.json: |
    {
      "version": "1.0.0",
      "lastUpdated": "2024-01-01T00:00:00Z",
      "deployedBy": "github-actions",
      "commitSha": "latest",
      "resources": {
        "deployment/flamoral-web": "pending-update-by-ci",
        "deployment/api-gateway": "pending-update-by-ci",
        "configmap/web-app-config": "pending-update-by-ci",
        "configmap/api-gateway-config": "pending-update-by-ci",
        "service/flamoral-web": "pending-update-by-ci",
        "service/api-gateway": "pending-update-by-ci"
      }
    }

---
# Drift Detection CronJob - runs every 15 minutes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-detector
  namespace: flamoral
  labels:
    app: drift-detector
spec:
  schedule: "*/15 * * * *"  # Every 15 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: drift-detector
          restartPolicy: OnFailure
          containers:
            - name: drift-detector
              image: bitnami/kubectl:1.28.5
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/bash
                - -c
                - |
                  echo "=== Drift Detection Report $(date) ==="
                  echo ""

                  # Check deployments
                  echo "Checking deployments in flamoral namespace..."
                  DEPLOYMENTS=$(kubectl get deployments -n flamoral -o json)

                  # Check for deployments without CI annotation
                  echo ""
                  echo "Deployments without CI/CD annotation:"
                  kubectl get deployments -n flamoral -o json | \
                    jq -r '.items[] | select(.metadata.annotations["flamoral.com/deployed-by"] == null) | .metadata.name' || echo "All deployments have CI annotations"

                  # Check for recent changes
                  echo ""
                  echo "Recent deployment changes (last 15 min):"
                  kubectl get deployments -n flamoral -o json | \
                    jq -r '.items[] | select(.metadata.creationTimestamp > (now - 900 | strftime("%Y-%m-%dT%H:%M:%SZ"))) | .metadata.name' 2>/dev/null || echo "No recent changes"

                  # Check pod restarts
                  echo ""
                  echo "Pods with restarts:"
                  kubectl get pods -n flamoral -o json | \
                    jq -r '.items[] | select(.status.containerStatuses[].restartCount > 0) | "\(.metadata.name): \(.status.containerStatuses[].restartCount) restarts"' || echo "No pod restarts"

                  # Check for pending/failed pods
                  echo ""
                  echo "Non-running pods:"
                  kubectl get pods -n flamoral --field-selector=status.phase!=Running,status.phase!=Succeeded 2>/dev/null || echo "All pods running"

                  # ConfigMap changes
                  echo ""
                  echo "ConfigMaps in namespace:"
                  kubectl get configmaps -n flamoral -o name | wc -l

                  echo ""
                  echo "=== Drift Detection Complete ==="

              resources:
                limits:
                  cpu: "100m"
                  memory: "128Mi"
                requests:
                  cpu: "50m"
                  memory: "64Mi"

---
# Drift Alert ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: drift-alert-config
  namespace: flamoral
  labels:
    app: drift-detector
data:
  # Alert configuration for drift detection
  alert-config.yaml: |
    alerting:
      enabled: true
      channels:
        - type: log
          enabled: true
        # Add webhook for Slack/Teams when configured
        # - type: webhook
        #   url: "${SLACK_WEBHOOK_URL}"
      thresholds:
        maxDriftItems: 5
        maxPodRestarts: 10
        alertOnMissingAnnotation: true
