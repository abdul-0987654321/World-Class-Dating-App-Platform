# Istio Service Mesh - Mutual TLS Configuration
# Enables encrypted service-to-service communication with mutual authentication
# Documentation: https://istio.io/latest/docs/tasks/security/authentication/mtls-migration/

---
# Install Istio using IstioOperator for production configuration
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: flamoral-istio
  namespace: istio-system
spec:
  profile: production

  # Hub and tag for Istio images
  hub: docker.io/istio
  tag: 1.20.0

  # Mesh configuration
  meshConfig:
    # Enable automatic mTLS
    defaultConfig:
      proxyMetadata:
        ISTIO_META_DNS_CAPTURE: "true"
        ISTIO_META_DNS_AUTO_ALLOCATE: "true"

    # Access logging
    accessLogFile: /dev/stdout
    accessLogEncoding: JSON

    # Tracing configuration
    enableTracing: true
    defaultConfig:
      tracing:
        sampling: 10.0
        zipkin:
          address: zipkin.istio-system:9411

    # Enable automatic mTLS
    enableAutoMtls: true

    # Certificate management
    certificates:
      - secretName: dns.flamoral-prod
        dnsNames:
          - flamoral.com
          - "*.flamoral.com"

  # Component configurations
  components:
    # Ingress Gateway
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          replicas: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          service:
            type: LoadBalancer
            ports:
              - port: 15021
                targetPort: 15021
                name: status-port
              - port: 80
                targetPort: 8080
                name: http2
              - port: 443
                targetPort: 8443
                name: https
          hpaSpec:
            minReplicas: 3
            maxReplicas: 10
            metrics:
              - type: Resource
                resource:
                  name: cpu
                  targetAverageUtilization: 80

    # Egress Gateway
    egressGateways:
      - name: istio-egressgateway
        enabled: true
        k8s:
          replicas: 2
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

    # Pilot (Istiod)
    pilot:
      enabled: true
      k8s:
        replicas: 3
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        hpaSpec:
          minReplicas: 3
          maxReplicas: 10
          metrics:
            - type: Resource
              resource:
                name: cpu
                targetAverageUtilization: 80

  # Global values
  values:
    global:
      # Enable mTLS by default
      mtls:
        enabled: true
        auto: true

      # Logging configuration
      logging:
        level: "default:info"

      # Proxy configuration
      proxy:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 1024Mi

        # Enable access logs
        logLevel: warning
        componentLogLevel: "misc:error"

      # Security
      controlPlaneSecurityEnabled: true

      # Multi-cluster configuration (if needed)
      multiCluster:
        clusterName: flamoral-prod-aks

---
# Namespace for Istio system components
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    istio-injection: disabled

---
# PeerAuthentication - Enforce strict mTLS across the mesh
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT

---
# PeerAuthentication for production namespace - strict mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: production-mtls
  namespace: flamoral
spec:
  mtls:
    mode: STRICT

---
# PeerAuthentication for staging namespace - strict mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: staging-mtls
  namespace: flamoral-staging
spec:
  mtls:
    mode: STRICT

---
# DestinationRule - Configure TLS for all services
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: default-mtls
  namespace: flamoral
spec:
  host: "*.dating-app-production.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

---
# AuthorizationPolicy - Default deny all
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: flamoral
spec:
  {}

---
# AuthorizationPolicy - Allow ingress gateway to services
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress
  namespace: flamoral
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["istio-system"]
        principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]

---
# AuthorizationPolicy - Allow authenticated service-to-service communication
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-service-to-service
  namespace: flamoral
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["dating-app-production"]
        principals: ["cluster.local/ns/dating-app-production/*"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]

---
# Sidecar injection configuration for production namespace
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-sidecar-injector
  namespace: istio-system
data:
  config: |
    policy: enabled
    alwaysInjectSelector:
      - matchLabels:
          istio-injection: enabled
    neverInjectSelector:
      - matchLabels:
          istio-injection: disabled
    template: |
      containers:
      - name: istio-proxy
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 1024Mi

---
# Gateway for external traffic
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: flamoral-gateway
  namespace: flamoral
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: flamoral-tls-cert
    hosts:
    - "flamoral.com"
    - "www.flamoral.com"
    - "api.flamoral.com"
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "flamoral.com"
    - "www.flamoral.com"
    - "api.flamoral.com"
    tls:
      httpsRedirect: true

---
# VirtualService for API routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-routes
  namespace: flamoral
spec:
  hosts:
  - "api.flamoral.com"
  gateways:
  - flamoral-gateway
  http:
  - match:
    - uri:
        prefix: "/api/v1/users"
    route:
    - destination:
        host: user-service.dating-app-production.svc.cluster.local
        port:
          number: 8080
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s

  - match:
    - uri:
        prefix: "/api/v1/auth"
    route:
    - destination:
        host: auth-service.dating-app-production.svc.cluster.local
        port:
          number: 8080
    timeout: 30s

  - match:
    - uri:
        prefix: "/api/v1/matching"
    route:
    - destination:
        host: matching-service.dating-app-production.svc.cluster.local
        port:
          number: 8080
    timeout: 60s

  - match:
    - uri:
        prefix: "/api/v1/messages"
    route:
    - destination:
        host: messaging-service.dating-app-production.svc.cluster.local
        port:
          number: 8080
    timeout: 30s

---
# ServiceEntry for external PostgreSQL (if using Azure PostgreSQL)
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: postgres-external
  namespace: flamoral
spec:
  hosts:
  - "*.postgres.database.azure.com"
  ports:
  - number: 5432
    name: postgres
    protocol: TCP
  location: MESH_EXTERNAL
  resolution: DNS

---
# ServiceEntry for external Redis (if using Azure Redis)
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: redis-external
  namespace: flamoral
spec:
  hosts:
  - "*.redis.cache.windows.net"
  ports:
  - number: 6380
    name: redis-ssl
    protocol: TCP
  location: MESH_EXTERNAL
  resolution: DNS

---
# RequestAuthentication - JWT validation
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: jwt-auth
  namespace: flamoral
spec:
  selector:
    matchLabels:
      auth: required
  jwtRules:
  - issuer: "https://api.flamoral.com/auth"
    jwksUri: "https://api.flamoral.com/.well-known/jwks.json"
    audiences:
    - "flamoral-api"

---
# AuthorizationPolicy - Require valid JWT for protected endpoints
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: require-jwt
  namespace: flamoral
spec:
  selector:
    matchLabels:
      auth: required
  action: ALLOW
  rules:
  - from:
    - source:
        requestPrincipals: ["*"]
    when:
    - key: request.auth.claims[iss]
      values: ["https://api.flamoral.com/auth"]

---
# Telemetry configuration for observability
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: mesh-telemetry
  namespace: istio-system
spec:
  metrics:
  - providers:
    - name: prometheus
  tracing:
  - providers:
    - name: zipkin
    randomSamplingPercentage: 10.0
  accessLogging:
  - providers:
    - name: envoy

---
# ProxyConfig for security hardening
apiVersion: networking.istio.io/v1beta1
kind: ProxyConfig
metadata:
  name: security-proxy-config
  namespace: flamoral
spec:
  concurrency: 2
  image:
    imageType: distroless
