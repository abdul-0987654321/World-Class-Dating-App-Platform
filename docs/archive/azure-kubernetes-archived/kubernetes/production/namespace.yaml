apiVersion: v1
kind: Namespace
metadata:
  name: dating-app-production
  labels:
    name: dating-app-production
    environment: production
    managed-by: terraform
  annotations:
    description: "Production environment for Dating App Platform"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: flamoral
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "3"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: production-limits
  namespace: flamoral
spec:
  limits:
  - max:
      cpu: "8"
      memory: 16Gi
    min:
      cpu: "100m"
      memory: 128Mi
    default:
      cpu: "1"
      memory: 2Gi
    defaultRequest:
      cpu: "500m"
      memory: 1Gi
    type: Container
  - max:
      cpu: "16"
      memory: 32Gi
    min:
      cpu: "1"
      memory: 1Gi
    type: Pod
