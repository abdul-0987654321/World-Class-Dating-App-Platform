# PgBouncer Connection Pooler for PostgreSQL

# PgBouncer ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: flamoral
data:
  pgbouncer.ini: |
    [databases]
    dating_app = host=production-dating-app-postgres.postgres.database.azure.com port=5432 dbname=dating_app_production
    dating_app_replica = host=production-dating-app-postgres-replica.postgres.database.azure.com port=5432 dbname=dating_app_production

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    admin_users = pgbouncer_admin
    stats_users = stats, pgbouncer_admin

    # Connection pooling
    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 25
    min_pool_size = 10
    reserve_pool_size = 10
    reserve_pool_timeout = 5
    max_db_connections = 100
    max_user_connections = 100

    # Timeouts
    server_lifetime = 3600
    server_idle_timeout = 600
    server_connect_timeout = 15
    server_login_retry = 15
    query_timeout = 300
    query_wait_timeout = 120
    client_idle_timeout = 0
    idle_transaction_timeout = 600

    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1

    # Performance
    pkt_buf = 8192
    listen_backlog = 4096
    sbuf_loopcnt = 5

    # Security
    ignore_startup_parameters = extra_float_digits,options

    # Health check
    server_check_query = SELECT 1
    server_check_delay = 30

    # DNS
    dns_max_ttl = 15
    dns_zone_check_period = 0

  userlist.txt: |
    "datingappadmin" "SCRAM-SHA-256$$POSTGRES_PASSWORD_HASH"
---
# PgBouncer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: flamoral
  labels:
    app: pgbouncer
    tier: database
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        tier: database
        monitoring: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
    spec:
      priorityClassName: critical-priority
      serviceAccountName: pgbouncer

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - pgbouncer
              topologyKey: kubernetes.io/hostname

      initContainers:
      - name: init-userlist
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "\"$DB_USER\" \"$DB_PASSWORD\"" > /tmp/userlist.txt
          chmod 600 /tmp/userlist.txt
        env:
        - name: DB_USER
          value: datingappadmin
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PASSWORD
        volumeMounts:
        - name: userlist
          mountPath: /tmp

      containers:
      - name: pgbouncer
        image: pgbouncer/pgbouncer:1.21.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: pgbouncer
          containerPort: 5432
          protocol: TCP

        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi

        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - killall -INT pgbouncer && sleep 120

        env:
        - name: DATABASES_HOST
          value: "production-dating-app-postgres.postgres.database.azure.com"
        - name: DATABASES_PORT
          value: "5432"
        - name: DATABASES_DBNAME
          value: "dating_app_production"

        volumeMounts:
        - name: config
          mountPath: /etc/pgbouncer
          readOnly: true
        - name: userlist
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
          readOnly: true

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

      - name: pgbouncer-exporter
        image: prometheuscommunity/pgbouncer-exporter:v0.7.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9127
          protocol: TCP

        env:
        - name: PGBOUNCER_EXPORTER_HOST
          value: "127.0.0.1"
        - name: PGBOUNCER_EXPORTER_PORT
          value: "5432"
        - name: PGBOUNCER_USER
          value: "stats"
        - name: PGBOUNCER_PASS
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PASSWORD

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

      volumes:
      - name: config
        configMap:
          name: pgbouncer-config
          items:
          - key: pgbouncer.ini
            path: pgbouncer.ini
      - name: userlist
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi

      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
# PgBouncer Service
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: flamoral
  labels:
    app: pgbouncer
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
  - name: pgbouncer
    port: 5432
    targetPort: 5432
    protocol: TCP
  - name: metrics
    port: 9127
    targetPort: 9127
    protocol: TCP
  selector:
    app: pgbouncer
---
# PgBouncer Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgbouncer
  namespace: flamoral
---
# PgBouncer Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-pdb
  namespace: flamoral
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: pgbouncer
---
# PgBouncer Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pgbouncer-hpa
  namespace: flamoral
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pgbouncer
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
# Service Monitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pgbouncer
  namespace: flamoral
  labels:
    app: pgbouncer
spec:
  selector:
    matchLabels:
      app: pgbouncer
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
