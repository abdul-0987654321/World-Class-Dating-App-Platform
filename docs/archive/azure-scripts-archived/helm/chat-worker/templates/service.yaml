apiVersion: v1
kind: Service
metadata:
  name: {{ include "chat-worker.fullname" . }}
  labels:
    {{- include "chat-worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "chat-worker.selectorLabels" . | nindent 4 }}
