replicaCount: 1

image:
  tag: "dev"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

ingress:
  hosts:
    - host: api-dev.flamoral.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-dev-tls
      hosts:
        - api-dev.flamoral.com

env:
  - name: NODE_ENV
    value: "development"
  - name: LOG_LEVEL
    value: "debug"
