components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from login or registration.

        Example: `Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...`

    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Internal service-to-service authentication key

  headers:
    X-RateLimit-Limit:
      description: The number of allowed requests in the current period
      schema:
        type: integer
        example: 100

    X-RateLimit-Remaining:
      description: The number of remaining requests in the current period
      schema:
        type: integer
        example: 95

    X-RateLimit-Reset:
      description: The time at which the current rate limit window resets (Unix timestamp)
      schema:
        type: integer
        example: 1640995200

  responses:
    BadRequest:
      description: Bad request - Invalid input or validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: Validation error
              value:
                error: ValidationError
                message: Invalid input data
                statusCode: 400
                details:
                  - field: email
                    message: Invalid email format
                  - field: password
                    message: Password must be at least 8 characters

    Unauthorized:
      description: Unauthorized - Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              summary: Missing token
              value:
                error: Unauthorized
                message: No authorization token provided
                statusCode: 401
            invalidToken:
              summary: Invalid token
              value:
                error: Unauthorized
                message: Invalid or expired token
                statusCode: 401

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden
            message: You do not have permission to access this resource
            statusCode: 403

    NotFound:
      description: Not found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: NotFound
            message: The requested resource was not found
            statusCode: 404

    TooManyRequests:
      description: Too many requests - Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          description: Number of seconds to wait before making another request
          schema:
            type: integer
            example: 900
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: TooManyRequests
            message: Rate limit exceeded. Please try again later.
            statusCode: 429
            details:
              retryAfter: 900
              limit: 100
              window: 900

  schemas:
    Error:
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          description: Error type/code
          example: ValidationError
        message:
          type: string
          description: Human-readable error message
          example: Invalid input data
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        details:
          type: object
          description: Additional error details (optional)
          additionalProperties: true

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - dateOfBirth
        - gender
      properties:
        email:
          type: string
          format: email
          description: User email address (must be unique)
          example: john.doe@example.com
        password:
          type: string
          minLength: 8
          format: password
          description: User password (min 8 chars, must include letters and numbers)
          example: SecurePass123!
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          description: User's first name
          example: John
        lastName:
          type: string
          maxLength: 50
          description: User's last name (optional)
          example: Doe
        dateOfBirth:
          type: string
          format: date
          description: Date of birth (must be 18+ years old)
          example: "1995-06-15"
        gender:
          type: string
          enum: [male, female, non-binary, other]
          description: User gender
          example: male
        phoneNumber:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'
          description: Phone number in E.164 format (optional)
          example: "+14155552671"
        referralCode:
          type: string
          description: Referral code from existing user (optional)
          example: JOHN123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: john.doe@example.com
        password:
          type: string
          format: password
          description: User password
          example: SecurePass123!
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: JWT access token (expires in 15 minutes)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfMTIzYWJjNDU2ZGVmIiwiaWF0IjoxNjQwOTk1MjAwLCJleHAiOjE2NDA5OTYxMDB9.abc123def456
        refreshToken:
          type: string
          description: Refresh token (expires in 30 days)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfMTIzYWJjNDU2ZGVmIiwiaWF0IjoxNjQwOTk1MjAwLCJleHAiOjE2NDM1ODcyMDB9.def456ghi789
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 900

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: New JWT access token
        refreshToken:
          type: string
          description: New refresh token (if rotated)
        expiresIn:
          type: integer
          description: Token expiration time in seconds
          example: 900

    User:
      type: object
      properties:
        id:
          type: string
          description: Unique user identifier
          example: usr_123abc456def
        email:
          type: string
          format: email
          example: john.doe@example.com
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        emailVerified:
          type: boolean
          description: Whether email has been verified
          example: true
        phoneVerified:
          type: boolean
          description: Whether phone number has been verified
          example: false
        photoVerified:
          type: boolean
          description: Whether profile photo has been verified
          example: true
        subscriptionTier:
          type: string
          enum: [free, premium, premium_plus]
          example: premium
        coinBalance:
          type: integer
          description: Current coin balance
          example: 150
        profileComplete:
          type: boolean
          description: Whether profile setup is complete
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        lastActiveAt:
          type: string
          format: date-time
          example: "2024-01-20T15:45:00Z"

    Profile:
      type: object
      properties:
        id:
          type: string
          example: usr_123abc456def
        firstName:
          type: string
          example: John
        age:
          type: integer
          description: Calculated from date of birth
          example: 28
        bio:
          type: string
          maxLength: 500
          description: User bio/description
          example: "Adventure seeker and coffee enthusiast ☕"
        gender:
          type: string
          enum: [male, female, non-binary, other]
          example: male
        location:
          type: object
          properties:
            city:
              type: string
              example: San Francisco
            country:
              type: string
              example: United States
            coordinates:
              type: object
              properties:
                latitude:
                  type: number
                  format: double
                  example: 37.7749
                longitude:
                  type: number
                  format: double
                  example: -122.4194
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        interests:
          type: array
          items:
            type: string
          maxItems: 10
          example: ["Travel", "Photography", "Cooking", "Hiking"]
        height:
          type: integer
          description: Height in centimeters
          example: 175
        education:
          type: string
          example: "Bachelor's Degree"
        occupation:
          type: string
          example: "Software Engineer"
        relationshipGoal:
          type: string
          enum: [casual, dating, relationship, long-term, friendship]
          example: long-term
        verified:
          type: boolean
          description: Whether profile is verified
          example: true
        profileScore:
          type: integer
          description: Profile completeness score (0-100)
          example: 85

    PublicProfile:
      type: object
      description: Public-facing profile (respects privacy settings)
      properties:
        id:
          type: string
        firstName:
          type: string
        age:
          type: integer
        bio:
          type: string
        photos:
          type: array
          items:
            type: string
            format: uri
        interests:
          type: array
          items:
            type: string
        distance:
          type: number
          description: Distance in kilometers (may be hidden)
        verified:
          type: boolean
        lastActive:
          type: string
          description: Last active time (may be hidden)
          example: "Active today"

    ProfileUpdate:
      type: object
      properties:
        bio:
          type: string
          maxLength: 500
        interests:
          type: array
          items:
            type: string
          maxItems: 10
        height:
          type: integer
        education:
          type: string
        occupation:
          type: string
        relationshipGoal:
          type: string
          enum: [casual, dating, relationship, long-term, friendship]
        location:
          type: object
          properties:
            city:
              type: string
            country:
              type: string
            coordinates:
              type: object
              properties:
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double

    Photo:
      type: object
      properties:
        id:
          type: string
          example: photo_123
        url:
          type: string
          format: uri
          description: CDN URL for full-size photo
          example: https://cdn.flamoral.com/photos/usr_123/photo_123.jpg
        thumbnailUrl:
          type: string
          format: uri
          description: CDN URL for thumbnail (optimized)
          example: https://cdn.flamoral.com/photos/usr_123/photo_123_thumb.jpg
        isPrimary:
          type: boolean
          description: Whether this is the primary profile photo
          example: true
        isVerified:
          type: boolean
          description: Whether this photo has been verified
          example: false
        order:
          type: integer
          minimum: 1
          maximum: 9
          description: Display order
          example: 1
        uploadedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        moderationStatus:
          type: string
          enum: [pending, approved, rejected]
          example: approved

    DeviceInfo:
      type: object
      description: Device information for login tracking and push notifications
      properties:
        deviceId:
          type: string
          description: Unique device identifier
          example: "device_abc123"
        deviceType:
          type: string
          enum: [ios, android, web]
          example: ios
        deviceName:
          type: string
          example: "iPhone 13 Pro"
        appVersion:
          type: string
          example: "1.2.0"
        osVersion:
          type: string
          example: "iOS 17.2"
        pushToken:
          type: string
          description: FCM/APNS token for push notifications
          example: "fcm_token_abc123..."

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number (1-indexed)
          example: 1
        limit:
          type: integer
          description: Items per page
          example: 20
        total:
          type: integer
          description: Total number of items
          example: 150
        totalPages:
          type: integer
          description: Total number of pages
          example: 8
        hasNext:
          type: boolean
          description: Whether there is a next page
          example: true
        hasPrevious:
          type: boolean
          description: Whether there is a previous page
          example: false

