security:
  - bearerAuth: []

paths:
  # ============== AUTHENTICATION SERVICE ==============
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: |
        Register a new user account with email and password.

        **Requirements:**
        - Unique email address
        - Password minimum 8 characters
        - Valid date of birth (must be 18+ years old)

        **Process:**
        1. Validates user input
        2. Checks for existing email
        3. Hashes password using bcrypt
        4. Creates user account
        5. Sends verification email
        6. Returns access and refresh tokens
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              basic:
                summary: Basic registration
                value:
                  email: john.doe@example.com
                  password: SecurePass123!
                  firstName: John
                  lastName: Doe
                  dateOfBirth: "1995-06-15"
                  gender: male
      responses:
        '201':
          description: User registered successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  summary: Successful registration
                  value:
                    user:
                      id: usr_123abc456def
                      email: john.doe@example.com
                      firstName: John
                      lastName: Doe
                      emailVerified: false
                      createdAt: "2024-01-15T10:30:00Z"
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: ConflictError
                message: An account with this email already exists
                statusCode: 409
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: |
        Authenticate user with email and password.

        **Process:**
        1. Validates credentials
        2. Verifies password hash
        3. Generates JWT access token (15 min expiry)
        4. Generates refresh token (30 day expiry)
        5. Updates last login timestamp
        6. Returns user data and tokens

        **Rate Limiting:**
        - 5 attempts per 15 minutes per IP
        - Account locked after 10 failed attempts (1 hour lockout)
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              email:
                summary: Login with email
                value:
                  email: john.doe@example.com
                  password: SecurePass123!
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Refresh token cookie (httpOnly, secure, sameSite)
              schema:
                type: string
                example: refreshToken=eyJhbG...; HttpOnly; Secure; SameSite=Strict; Max-Age=2592000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Account locked due to too many failed attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: AccountLocked
                message: Account temporarily locked due to too many failed login attempts
                statusCode: 423
                details:
                  lockedUntil: "2024-01-15T12:00:00Z"
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: |
        Logout user and invalidate refresh token.

        **Process:**
        1. Validates access token
        2. Invalidates refresh token
        3. Removes token from whitelist
        4. Clears cookies
      operationId: logoutUser
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: |
        Obtain a new access token using a valid refresh token.

        **Process:**
        1. Validates refresh token
        2. Checks token whitelist
        3. Generates new access token
        4. Optionally rotates refresh token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: Valid refresh token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify email address
      description: |
        Verify user email address using verification token sent via email.

        **Process:**
        1. Validates verification token
        2. Checks token expiration (24 hours)
        3. Updates user email_verified status
        4. Grants access to full platform features
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Email verification token from email
                  example: verify_abc123def456
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email verified successfully
                  emailVerified:
                    type: boolean
                    example: true
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Resend verification email
      description: |
        Resend email verification link.

        **Rate Limiting:**
        - 3 requests per hour per email
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Verification email sent successfully
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      description: |
        Request password reset link via email.

        **Security:**
        - Always returns 200 (prevents email enumeration)
        - Token expires in 1 hour
        - Rate limited to 3 requests per hour
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
      responses:
        '200':
          description: Password reset email sent (if account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If an account exists, a password reset link has been sent
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with token
      description: |
        Reset user password using token from email.

        **Requirements:**
        - Valid reset token
        - Password minimum 8 characters
        - Password cannot be same as previous 3 passwords
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Password reset token from email
                  example: reset_abc123def456
                password:
                  type: string
                  minLength: 8
                  description: New password
                  example: NewSecurePass123!
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset successfully
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      description: |
        Get current authenticated user information.

        **Returns:**
        - User profile data
        - Subscription status
        - Coin balance
        - Feature access permissions
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/validate-token:
    post:
      tags: [Authentication]
      summary: Validate JWT token (Internal)
      description: |
        Validate JWT token for internal service-to-service authentication.

        **Internal Use Only:**
        - Requires service key authentication
        - Used by API Gateway and microservices
      operationId: validateToken
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  userId:
                    type: string
                    example: usr_123abc456def
                  email:
                    type: string
                    example: john.doe@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============== SOCIAL LOGIN ==============
  /api/auth/social/google:
    post:
      tags: [Social Login]
      summary: Login with Google
      description: |
        Authenticate user with Google OAuth token.

        **Process:**
        1. Validates Google OAuth token with Google API
        2. Extracts user info (email, name, profile picture)
        3. Creates or updates user account
        4. Returns access and refresh tokens

        **Auto-populated fields:**
        - Email (verified by Google)
        - First name
        - Last name
        - Profile picture
      operationId: googleLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Google OAuth ID token
                  example: ya29.a0AfH6SMBx...
                deviceInfo:
                  $ref: '#/components/schemas/DeviceInfo'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/social/facebook:
    post:
      tags: [Social Login]
      summary: Login with Facebook
      description: |
        Authenticate user with Facebook OAuth token.
      operationId: facebookLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Facebook OAuth access token
                deviceInfo:
                  $ref: '#/components/schemas/DeviceInfo'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/social/apple:
    post:
      tags: [Social Login]
      summary: Login with Apple
      description: |
        Authenticate user with Apple Sign In token.

        **Note:** Apple may not provide email if user opts for privacy relay.
      operationId: appleLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken:
                  type: string
                  description: Apple identity token
                authorizationCode:
                  type: string
                  description: Apple authorization code
                user:
                  type: object
                  description: User data (only provided on first sign in)
                  properties:
                    firstName:
                      type: string
                    lastName:
                      type: string
                    email:
                      type: string
                deviceInfo:
                  $ref: '#/components/schemas/DeviceInfo'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============== USER PROFILE SERVICE ==============
  /api/profile:
    get:
      tags: [User Profile]
      summary: Get user profile
      description: |
        Get complete user profile including photos, bio, interests, and verification status.
      operationId: getProfile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [User Profile]
      summary: Update user profile
      description: |
        Update user profile information.

        **Updatable fields:**
        - Bio (max 500 characters)
        - Interests (max 10)
        - Height
        - Education
        - Occupation
        - Relationship goals
        - Location (city, country)
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            examples:
              basic:
                summary: Update basic info
                value:
                  bio: "Adventure seeker and coffee enthusiast ☕"
                  interests: ["Travel", "Photography", "Cooking", "Hiking"]
                  height: 175
                  education: "Bachelor's Degree"
                  occupation: "Software Engineer"
              complete:
                summary: Complete profile update
                value:
                  bio: "Adventure seeker and coffee enthusiast ☕"
                  interests: ["Travel", "Photography", "Cooking", "Hiking"]
                  height: 175
                  education: "Bachelor's Degree"
                  occupation: "Software Engineer"
                  relationshipGoal: "long-term"
                  location:
                    city: "San Francisco"
                    country: "United States"
                    coordinates:
                      latitude: 37.7749
                      longitude: -122.4194
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/profile/{userId}:
    get:
      tags: [User Profile]
      summary: Get another user's profile
      description: |
        Get public profile of another user.

        **Privacy:**
        - Respects user's privacy settings
        - Some fields may be hidden based on preferences
        - Blocked users cannot view each other's profiles
      operationId: getUserProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: usr_123abc456def
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '403':
          description: Cannot view this profile (blocked/privacy settings)
        '404':
          $ref: '#/components/responses/NotFound'

  # ============== PHOTOS ==============
  /api/photos:
    get:
      tags: [Photos]
      summary: Get user photos
      description: |
        Get all photos for the authenticated user.

        **Returns:**
        - Photo URLs (CDN-optimized)
        - Photo order
        - Primary photo indicator
        - Verification status
      operationId: getPhotos
      responses:
        '200':
          description: List of photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Photo'
              example:
                - id: photo_123
                  url: https://cdn.flamoral.com/photos/usr_123/photo_123.jpg
                  thumbnailUrl: https://cdn.flamoral.com/photos/usr_123/photo_123_thumb.jpg
                  isPrimary: true
                  isVerified: true
                  order: 1
                  uploadedAt: "2024-01-15T10:30:00Z"
                - id: photo_456
                  url: https://cdn.flamoral.com/photos/usr_123/photo_456.jpg
                  thumbnailUrl: https://cdn.flamoral.com/photos/usr_123/photo_456_thumb.jpg
                  isPrimary: false
                  isVerified: false
                  order: 2
                  uploadedAt: "2024-01-16T14:20:00Z"

    post:
      tags: [Photos]
      summary: Upload photo
      description: |
        Upload a new photo to profile.

        **Requirements:**
        - Max 9 photos per profile
        - Supported formats: JPEG, PNG, WebP
        - Max file size: 10MB
        - Min resolution: 800x800px
        - Max resolution: 4096x4096px

        **Processing:**
        1. Validates file format and size
        2. Runs AI moderation (NSFW detection)
        3. Resizes and optimizes image
        4. Generates thumbnails
        5. Uploads to CDN (Azure Blob Storage)
        6. Updates user profile

        **Rate Limiting:**
        - 20 uploads per hour
      operationId: uploadPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: Photo file (JPEG, PNG, WebP)
                order:
                  type: integer
                  description: Display order (1-9)
                  minimum: 1
                  maximum: 9
      responses:
        '201':
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '400':
          description: Invalid file or max photos reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                maxPhotos:
                  summary: Max photos reached
                  value:
                    error: MaxPhotosReached
                    message: You have reached the maximum of 9 photos
                    statusCode: 400
                invalidFile:
                  summary: Invalid file format
                  value:
                    error: InvalidFile
                    message: Only JPEG, PNG, and WebP formats are supported
                    statusCode: 400
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: FileTooLarge
                message: File size must be less than 10MB
                statusCode: 413
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/photos/{id}:
    delete:
      tags: [Photos]
      summary: Delete photo
      description: |
        Delete a photo from profile.

        **Requirements:**
        - Must have at least 2 photos (cannot delete if only 1 remaining)
        - Cannot delete photo that is currently primary
      operationId: deletePhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: photo_123
      responses:
        '200':
          description: Photo deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Photo deleted successfully
        '400':
          description: Cannot delete photo (minimum requirement or primary photo)
        '404':
          $ref: '#/components/responses/NotFound'

  /api/photos/{id}/primary:
    put:
      tags: [Photos]
      summary: Set primary photo
      description: |
        Set a photo as the primary profile photo.

        **Note:** Primary photo is displayed first in discovery and matches.
      operationId: setPrimaryPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: photo_123
      responses:
        '200':
          description: Primary photo set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Primary photo updated successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /api/photos/reorder:
    put:
      tags: [Photos]
      summary: Reorder photos
      description: |
        Change the display order of photos.

        **Requirements:**
        - Must include all existing photo IDs
        - Order numbers must be sequential (1-N)
      operationId: reorderPhotos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoIds]
              properties:
                photoIds:
                  type: array
                  items:
                    type: string
                  description: Array of photo IDs in desired order
                  example: ["photo_456", "photo_123", "photo_789"]
      responses:
        '200':
          description: Photos reordered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Photos reordered successfully
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/photos/{id}/verify:
    post:
      tags: [Photos]
      summary: Request photo verification
      description: |
        Request verification for a photo to earn a verification badge.

        **Process:**
        1. User uploads a real-time selfie matching a pose
        2. AI compares selfie with profile photos
        3. Manual review if AI confidence is low
        4. Verification badge granted on approval

        **Benefits:**
        - Verification badge on profile
        - Increased trust and match rate
        - Access to verified-only discovery feed
      operationId: verifyPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [verificationPhoto]
              properties:
                verificationPhoto:
                  type: string
                  format: binary
                  description: Real-time selfie for verification
      responses:
        '202':
          description: Verification request submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Verification request submitted successfully
                  status:
                    type: string
                    example: pending
                  estimatedTime:
                    type: string
                    example: "10-15 minutes"
        '400':
          $ref: '#/components/responses/BadRequest'

