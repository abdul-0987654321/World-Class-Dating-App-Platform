openapi: 3.0.3
info:
  title: Flamoral Dating Platform API
  description: |
    # Flamoral Dating Platform API Documentation

    Complete API documentation for the Flamoral Dating Platform - a modern, feature-rich dating application.

    ## Features

    - **Authentication**: Email/password, social login (Google, Facebook, Apple), phone verification
    - **User Profiles**: Rich profiles with photos, bio, interests, verification badges
    - **Discovery**: Smart matching algorithm with filters and preferences
    - **Messaging**: Real-time messaging with text, images, GIFs, voice notes, and video calls
    - **Subscriptions**: Free, Premium, and Premium Plus tiers
    - **Coins & Boosts**: Virtual currency for premium features and profile boosts
    - **Privacy & Safety**: Blocking, reporting, photo verification, content moderation
    - **Payments**: Stripe integration for subscriptions, coins, and in-app purchases
    - **Analytics**: User behavior tracking and engagement metrics
    - **Admin**: Comprehensive admin dashboard for platform management

    ## Architecture

    The platform uses a microservices architecture:
    - **API Gateway**: Request routing, rate limiting, authentication
    - **Auth Service**: User authentication and authorization
    - **User Service**: Profile management, subscriptions, coins, boosts
    - **Matching Service**: Discovery algorithm, swipes, matches
    - **Messaging Service**: Real-time messaging via WebSocket
    - **Media Service**: Photo/video upload, processing, storage
    - **Payment Service**: Stripe integration, subscriptions, transactions
    - **Notification Service**: Push notifications, email, in-app notifications
    - **Analytics Service**: Event tracking, metrics, reporting
    - **Moderation Service**: Content moderation, CSAM detection
    - **Admin Service**: Admin dashboard and management tools

    ## Authentication

    Most endpoints require authentication using JWT bearer tokens:

    ```
    Authorization: Bearer <access_token>
    ```

    ### Token Lifecycle

    1. **Login**: Obtain access token and refresh token
    2. **Access Token**: Valid for 15 minutes (use for API requests)
    3. **Refresh Token**: Valid for 30 days (use to obtain new access token)
    4. **Logout**: Invalidate refresh token

    ### Obtaining Tokens

    ```bash
    POST /api/auth/login
    Content-Type: application/json

    {
      "email": "user@example.com",
      "password": "SecurePass123!"
    }
    ```

    Response:
    ```json
    {
      "user": { ... },
      "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
      "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    }
    ```

    ### Refreshing Tokens

    ```bash
    POST /api/auth/refresh-token
    Content-Type: application/json

    {
      "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    }
    ```

    ## Rate Limiting

    API endpoints are rate-limited to prevent abuse:

    | Endpoint Type | Rate Limit | Window |
    |--------------|------------|---------|
    | Authentication | 5 requests | 15 minutes |
    | General API | 100 requests | 15 minutes |
    | Media Upload | 20 requests | 15 minutes |
    | Messaging | 60 requests | 1 minute |

    Rate limit headers are included in responses:

    ```
    X-RateLimit-Limit: 100
    X-RateLimit-Remaining: 95
    X-RateLimit-Reset: 1640995200
    ```

    ## Error Handling

    Errors follow a consistent format:

    ```json
    {
      "error": "ValidationError",
      "message": "Invalid email format",
      "statusCode": 400,
      "details": {
        "field": "email",
        "constraint": "isEmail"
      }
    }
    ```

    ### Common Error Codes

    | Code | Description |
    |------|-------------|
    | 400 | Bad Request - Invalid input |
    | 401 | Unauthorized - Missing or invalid token |
    | 403 | Forbidden - Insufficient permissions |
    | 404 | Not Found - Resource does not exist |
    | 409 | Conflict - Resource already exists |
    | 429 | Too Many Requests - Rate limit exceeded |
    | 500 | Internal Server Error |

    ## Pagination

    List endpoints support pagination:

    ```bash
    GET /api/matches?page=1&limit=20
    ```

    Response includes pagination metadata:

    ```json
    {
      "data": [...],
      "pagination": {
        "page": 1,
        "limit": 20,
        "total": 150,
        "totalPages": 8,
        "hasNext": true,
        "hasPrevious": false
      }
    }
    ```

    ## Webhooks

    The platform supports webhooks for real-time event notifications:

    - **Stripe Webhooks**: Payment events, subscription updates
    - **Moderation Webhooks**: Content moderation results
    - **Custom Webhooks**: Match events, message events

    See the Webhooks section for detailed documentation.

    ## WebSocket API

    Real-time features use WebSocket connections:

    ```javascript
    import io from 'socket.io-client';

    const socket = io('wss://api.flamoral.com', {
      auth: {
        token: accessToken,
        userId: currentUserId
      }
    });

    // Listen for new messages
    socket.on('message:new', (message) => {
      console.log('New message:', message);
    });

    // Send a message
    socket.emit('message:send', {
      conversationId: 'conv_123',
      receiverId: 'user_456',
      content: 'Hello!',
      type: 'text'
    }, (response) => {
      console.log('Message sent:', response);
    });
    ```

    See the WebSocket API section for detailed documentation.

