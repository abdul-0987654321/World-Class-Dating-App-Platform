# Azure Boards Integration Configuration
# This file defines the integration between Azure Pipelines and Azure Boards

name: Azure Boards Integration
description: Automated work item linking and state transitions

# ===========================================
# Work Item Linking Configuration
# ===========================================
workItemLinking:
  enabled: true

  # Commit message patterns that link to work items
  patterns:
    - pattern: 'AB#(\d+)'
      description: 'Link commits to work items using AB#123 format'
    - pattern: '#(\d+)'
      description: 'Alternative short format for work item linking'
    - pattern: 'Fixes AB#(\d+)'
      description: 'Automatically resolve bugs with Fixes AB#123'
    - pattern: 'Closes AB#(\d+)'
      description: 'Close work items with Closes AB#123'

  # Auto-linking rules
  autoLink:
    - trigger: 'commit'
      action: 'link'
      comment: 'Commit {{commit.sha}} linked from branch {{branch.name}}'

    - trigger: 'pull_request'
      action: 'link'
      comment: 'Pull Request #{{pr.number}} created: {{pr.title}}'

    - trigger: 'build_started'
      action: 'comment'
      comment: 'Build {{build.number}} started for this work item'

    - trigger: 'build_completed'
      action: 'comment'
      condition: 'success'
      comment: 'Build {{build.number}} completed successfully'

    - trigger: 'build_failed'
      action: 'comment'
      condition: 'failure'
      comment: 'Build {{build.number}} failed. Please review.'

# ===========================================
# State Transition Rules
# ===========================================
stateTransitions:
  enabled: true

  rules:
    # When PR is created
    - trigger: 'pull_request_opened'
      workItemTypes: ['User Story', 'Task', 'Bug']
      transitions:
        - fromState: 'New'
          toState: 'Active'
        - fromState: 'Approved'
          toState: 'Committed'
      comment: 'Work started - Pull Request #{{pr.number}} opened'

    # When PR is merged to develop
    - trigger: 'pull_request_merged'
      branch: 'develop'
      workItemTypes: ['User Story', 'Task', 'Bug']
      transitions:
        - fromState: 'Active'
          toState: 'Resolved'
        - fromState: 'Committed'
          toState: 'Resolved'
      comment: 'Code merged to develop branch via PR #{{pr.number}}'

    # When deployed to staging
    - trigger: 'deployment_completed'
      environment: 'staging'
      workItemTypes: ['User Story', 'Task', 'Bug']
      transitions:
        - fromState: 'Resolved'
          toState: 'Deployed-Staging'
      comment: 'Deployed to staging environment - Build {{build.number}}'

    # When deployed to production
    - trigger: 'deployment_completed'
      environment: 'production'
      workItemTypes: ['User Story', 'Task', 'Bug']
      transitions:
        - fromState: 'Deployed-Staging'
          toState: 'Closed'
      comment: 'Deployed to production - Release {{release.name}}'

    # When build fails
    - trigger: 'build_failed'
      workItemTypes: ['Bug', 'Task']
      transitions:
        - fromState: 'Active'
          toState: 'Active'
      tags:
        - 'build-failed'
      comment: 'Build {{build.number}} failed. Investigation needed.'

# ===========================================
# Release Notes Generation
# ===========================================
releaseNotes:
  enabled: true

  # Query to fetch work items for release notes
  query:
    workItemTypes: ['User Story', 'Bug', 'Feature', 'Task']
    states: ['Resolved', 'Closed']
    fields:
      - 'System.Id'
      - 'System.Title'
      - 'System.WorkItemType'
      - 'System.State'
      - 'System.Tags'
      - 'Microsoft.VSTS.Common.Priority'

  # Release notes template
  template: |
    ## Release Notes - {{release.name}}

    **Release Date:** {{release.date}}
    **Environment:** {{environment}}
    **Build:** {{build.number}}

    ### Features
    {{#features}}
    - [AB#{{id}}] {{title}}
    {{/features}}

    ### User Stories
    {{#userStories}}
    - [AB#{{id}}] {{title}}
    {{/userStories}}

    ### Bug Fixes
    {{#bugs}}
    - [AB#{{id}}] {{title}} (Priority: {{priority}})
    {{/bugs}}

    ### Technical Tasks
    {{#tasks}}
    - [AB#{{id}}] {{title}}
    {{/tasks}}

    ### Deployment Information
    - **Deployment Strategy:** {{deployment.strategy}}
    - **Rollback Plan:** Available via Azure DevOps
    - **Monitoring:** Azure Monitor & Application Insights

    ### Related Links
    - [Build Pipeline]({{build.url}})
    - [Work Items Query]({{query.url}})
    - [Deployment Logs]({{deployment.url}})

  # Output formats
  formats:
    - markdown
    - html
    - json

  # Where to publish release notes
  publish:
    - location: 'azure-repos'
      path: 'RELEASE_NOTES.md'
    - location: 'azure-wiki'
      page: 'Release Notes/{{release.name}}'
    - location: 'github-releases'
      repository: '{{github.repository}}'

# ===========================================
# Dashboard Widgets Configuration
# ===========================================
dashboards:
  - name: 'Sprint Overview'
    widgets:
      - type: 'sprint-burndown'
        query: 'Sprint Backlog'
      - type: 'work-item-chart'
        query: 'Active Work Items by State'
      - type: 'velocity'
        iterations: 6

  - name: 'Release Status'
    widgets:
      - type: 'work-item-chart'
        query: 'Release Readiness'
      - type: 'build-history'
        pipelines: ['CI-Backend', 'CI-Frontend', 'CD-Production']
      - type: 'deployment-status'
        environments: ['staging', 'production']

# ===========================================
# Notification Rules
# ===========================================
notifications:
  - trigger: 'work_item_created'
    workItemTypes: ['Bug']
    severity: ['1 - Critical', '2 - High']
    recipients:
      - team: 'DevOps-Team'
      - email: 'devops@datingplatform.com'
    template: 'Critical Bug Created'

  - trigger: 'work_item_state_changed'
    fromState: 'Active'
    toState: 'Resolved'
    recipients:
      - assignedTo: true
      - createdBy: true
    template: 'Work Item Resolved'

  - trigger: 'deployment_completed'
    environment: 'production'
    recipients:
      - team: 'DevOps-Team'
      - team: 'Product-Team'
      - channel: 'slack://production-deployments'
    template: 'Production Deployment'

  - trigger: 'build_failed'
    recipients:
      - assignedTo: true
      - channel: 'slack://build-failures'
    template: 'Build Failed'

# ===========================================
# Integration Settings
# ===========================================
integration:
  azureDevOps:
    organization: 'citadelcloudmanagement'
    project: 'DatingPlatform'
    boardsUrl: 'https://dev.azure.com/citadelcloudmanagement/DatingPlatform/_workitems'

  github:
    enabled: true
    repository: 'World-Class-Dating-App-Platform'
    webhooks:
      - event: 'push'
        action: 'link-commits'
      - event: 'pull_request'
        action: 'link-pr'
      - event: 'deployment'
        action: 'update-state'

  slack:
    enabled: true
    channels:
      production: '#production-deployments'
      staging: '#staging-deployments'
      builds: '#build-notifications'
      bugs: '#bug-alerts'

  azure:
    monitor:
      enabled: true
      workspace: 'dating-platform-logs'
    applicationInsights:
      enabled: true
      instrumentationKey: '${APPINSIGHTS_KEY}'
