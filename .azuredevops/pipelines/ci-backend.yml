# Azure Pipeline - Backend CI
# Runs on: Push to main/develop, PRs to main/develop
# Tests: Backend services, shared packages
# Triggers: Changes to backend/ or packages/shared/

name: Backend-CI-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
      - release/*
  paths:
    include:
      - backend/*
      - packages/shared/*
      - package.json
      - yarn.lock

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - backend/*
      - packages/shared/*
      - package.json
      - yarn.lock

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '20.x'
  YARN_CACHE_FOLDER: $(Pipeline.Workspace)/.yarn

stages:
  - stage: Build
    displayName: 'Build and Test Backend'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Lint, and Test'
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: 'Checkout repository'

          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js $(NODE_VERSION)'

          - task: Cache@2
            inputs:
              key: 'yarn | "$(Agent.OS)" | yarn.lock'
              restoreKeys: |
                yarn | "$(Agent.OS)"
              path: $(YARN_CACHE_FOLDER)
            displayName: 'Cache yarn dependencies'

          - script: |
              yarn install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: |
              cd backend
              yarn lint
            displayName: 'Lint backend code'

          - script: |
              cd backend
              yarn test --coverage --ci --reporters=default --reporters=jest-junit
            displayName: 'Run backend unit tests'
            env:
              NODE_ENV: test

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit.xml'
              mergeTestResults: true
              testRunTitle: 'Backend Unit Tests'
              failTaskOnFailedTests: true
            displayName: 'Publish test results'

          - task: PublishCodeCoverageResults@1
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/backend/coverage/cobertura-coverage.xml'
              reportDirectory: '$(System.DefaultWorkingDirectory)/backend/coverage'
              failIfCoverageEmpty: true
            displayName: 'Publish code coverage'

          - script: |
              cd backend
              yarn build
            displayName: 'Build backend services'

          - script: |
              cd backend
              yarn test:integration
            displayName: 'Run integration tests'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

          - task: PublishBuildArtifacts@1
            condition: succeeded()
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/backend/dist'
              ArtifactName: 'backend-build'
              publishLocation: 'Container'
            displayName: 'Publish build artifacts'

  - stage: CodeQuality
    displayName: 'Code Quality Analysis'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: SonarQube
        displayName: 'SonarQube Analysis'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js'

          - script: |
              yarn install --frozen-lockfile
            displayName: 'Install dependencies'

          # Uncomment when SonarQube is configured
          # - task: SonarQubePrepare@5
