# ==============================================================================
# Reusable Template: Helm Deployment
# ==============================================================================
# Usage: Include this template to deploy applications using Helm
# ==============================================================================

parameters:
  - name: environment
    type: string
  - name: namespace
    type: string
  - name: releaseName
    type: string
  - name: chartPath
    type: string
  - name: imageTag
    type: string
    default: 'latest'
  - name: replicaCount
    type: number
    default: 2
  - name: helmVersion
    type: string
    default: '3.12.0'
  - name: kubernetesServiceConnection
    type: string
    default: 'aks-flamoral-connection'
  - name: azureServiceConnection
    type: string
    default: 'azure-datingapp-sp-connection'
  - name: aksClusterName
    type: string
    default: 'flamoral-aks'
  - name: resourceGroup
    type: string
    default: 'flamoral-dating-app-rg'
  - name: timeout
    type: string
    default: '10m'
  - name: values
    type: object
    default: {}

steps:
  - task: HelmInstaller@1
    displayName: 'Install Helm ${{ parameters.helmVersion }}'
    inputs:
      helmVersionToInstall: ${{ parameters.helmVersion }}

  - task: KubectlInstaller@0
    displayName: 'Install kubectl'
    inputs:
      kubectlVersion: 'latest'

  - task: AzureCLI@2
    displayName: 'Get AKS Credentials'
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az aks get-credentials \
          --resource-group ${{ parameters.resourceGroup }} \
          --name ${{ parameters.aksClusterName }} \
          --overwrite-existing

  - script: |
      kubectl create namespace ${{ parameters.namespace }} --dry-run=client -o yaml | kubectl apply -f -
    displayName: 'Create Namespace'

  - task: HelmDeploy@0
    displayName: 'Deploy ${{ parameters.releaseName }}'
    inputs:
      connectionType: 'Kubernetes Service Connection'
      kubernetesServiceConnection: ${{ parameters.kubernetesServiceConnection }}
      namespace: ${{ parameters.namespace }}
      command: 'upgrade'
      chartType: 'FilePath'
      chartPath: ${{ parameters.chartPath }}
      releaseName: ${{ parameters.releaseName }}
      overrideValues: |
        global.environment=${{ parameters.environment }}
        global.imageTag=${{ parameters.imageTag }}
        replicaCount=${{ parameters.replicaCount }}
        ${{ each value in parameters.values }}:
        ${{ value.key }}=${{ value.value }}
        ${{ end }}
      arguments: '--create-namespace --install --wait --timeout ${{ parameters.timeout }}'

  - script: |
      echo "Waiting for deployments to be ready..."
      kubectl wait --for=condition=available --timeout=300s \
        deployment --all -n ${{ parameters.namespace }}
    displayName: 'Wait for Deployment Ready'

  - script: |
      echo "=== Deployment Status ==="
      kubectl get all -n ${{ parameters.namespace }}
    displayName: 'Show Deployment Status'
