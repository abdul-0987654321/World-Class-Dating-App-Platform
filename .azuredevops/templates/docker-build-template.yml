# ==============================================================================
# Reusable Template: Docker Build and Push
# ==============================================================================
# Usage: Include this template to build and push Docker images to ACR
# ==============================================================================

parameters:
  - name: serviceName
    type: string
  - name: dockerfilePath
    type: string
  - name: buildContext
    type: string
    default: '.'
  - name: imageRepository
    type: string
    default: 'flamoral'
  - name: imageTag
    type: string
    default: '$(Build.BuildId)'
  - name: acrName
    type: string
    default: 'flamoralacr'
  - name: dockerRegistryServiceConnection
    type: string
    default: 'acr-datingapp-connection'
  - name: additionalTags
    type: object
    default: []
  - name: buildArgs
    type: string
    default: ''

steps:
  - task: Docker@2
    displayName: 'Login to ACR'
    inputs:
      command: login
      containerRegistry: ${{ parameters.dockerRegistryServiceConnection }}

  - task: Docker@2
    displayName: 'Build ${{ parameters.serviceName }} Image'
    inputs:
      command: build
      repository: ${{ parameters.imageRepository }}/${{ parameters.serviceName }}
      dockerfile: ${{ parameters.dockerfilePath }}
      buildContext: ${{ parameters.buildContext }}
      tags: |
        ${{ parameters.imageTag }}
        latest
        ${{ join(char(10), parameters.additionalTags) }}
      arguments: ${{ parameters.buildArgs }}

  - task: Docker@2
    displayName: 'Push ${{ parameters.serviceName }} Image'
    inputs:
      command: push
      repository: ${{ parameters.imageRepository }}/${{ parameters.serviceName }}
      tags: |
        ${{ parameters.imageTag }}
        latest
        ${{ join(char(10), parameters.additionalTags) }}

  - task: Docker@2
    displayName: 'Scan ${{ parameters.serviceName }} Image'
    inputs:
      command: scan
      arguments: '${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepository }}/${{ parameters.serviceName }}:${{ parameters.imageTag }}'
    continueOnError: true

  - script: |
      docker image inspect ${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepository }}/${{ parameters.serviceName }}:${{ parameters.imageTag }}
    displayName: 'Verify ${{ parameters.serviceName }} Image'
