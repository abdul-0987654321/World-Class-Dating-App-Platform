# ==============================================================================
# Reusable Template: Testing
# ==============================================================================
# Usage: Include this template to run tests for services
# ==============================================================================

parameters:
  - name: serviceName
    type: string
  - name: serviceDirectory
    type: string
  - name: testType
    type: string
    default: 'unit'
    values:
      - unit
      - integration
      - e2e
  - name: nodeVersion
    type: string
    default: '20.x'
  - name: pythonVersion
    type: string
    default: '3.11'
  - name: language
    type: string
    default: 'node'
    values:
      - node
      - python
      - go
  - name: coverageThreshold
    type: number
    default: 70

steps:
  # Node.js Testing
  - ${{ if eq(parameters.language, 'node') }}:
    - task: NodeTool@0
      displayName: 'Install Node.js ${{ parameters.nodeVersion }}'
      inputs:
        versionSpec: ${{ parameters.nodeVersion }}

    - script: |
        cd ${{ parameters.serviceDirectory }}
        npm install -g yarn
        yarn install --frozen-lockfile
      displayName: 'Install Dependencies for ${{ parameters.serviceName }}'

    - script: |
        cd ${{ parameters.serviceDirectory }}
        yarn test --coverage --ci --reporters=default --reporters=jest-junit || \
        npm test -- --coverage --ci --reporters=default --reporters=jest-junit
      displayName: 'Run ${{ parameters.testType }} Tests for ${{ parameters.serviceName }}'
      continueOnError: ${{ eq(parameters.testType, 'e2e') }}

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '${{ parameters.serviceDirectory }}/**/junit.xml'
        mergeTestResults: true
        testRunTitle: '${{ parameters.serviceName }} - ${{ parameters.testType }} Tests'
      displayName: 'Publish Test Results'

    - task: PublishCodeCoverageResults@1
      condition: succeededOrFailed()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '${{ parameters.serviceDirectory }}/**/coverage/cobertura-coverage.xml'
        failIfCoverageEmpty: false
      displayName: 'Publish Code Coverage'

    - script: |
        cd ${{ parameters.serviceDirectory }}
        if [ -f "coverage/coverage-summary.json" ]; then
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Code Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < ${{ parameters.coverageThreshold }}" | bc -l) )); then
            echo "##vso[task.logissue type=warning]Coverage $COVERAGE% is below threshold ${{ parameters.coverageThreshold }}%"
          fi
        fi
      displayName: 'Check Coverage Threshold'
      continueOnError: true

  # Python Testing
  - ${{ if eq(parameters.language, 'python') }}:
    - task: UsePythonVersion@0
      displayName: 'Use Python ${{ parameters.pythonVersion }}'
      inputs:
        versionSpec: ${{ parameters.pythonVersion }}

    - script: |
        cd ${{ parameters.serviceDirectory }}
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio pytest-junit
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi
        if [ -f "requirements-dev.txt" ]; then
          pip install -r requirements-dev.txt
        fi
      displayName: 'Install Python Dependencies'

    - script: |
        cd ${{ parameters.serviceDirectory }}
        pytest tests/ \
          --junitxml=junit/test-results.xml \
          --cov=. \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term
      displayName: 'Run Python Tests'
      continueOnError: true

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '${{ parameters.serviceDirectory }}/**/test-results.xml'
        testRunTitle: '${{ parameters.serviceName }} - Python Tests'

  # Go Testing
  - ${{ if eq(parameters.language, 'go') }}:
    - task: GoTool@0
      displayName: 'Install Go'
      inputs:
        version: '1.21'

    - script: |
        cd ${{ parameters.serviceDirectory }}
        go mod download
      displayName: 'Download Go Dependencies'

    - script: |
        cd ${{ parameters.serviceDirectory }}
        go test -v -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html
      displayName: 'Run Go Tests'

    - script: |
        cd ${{ parameters.serviceDirectory }}
        go test -v ./... -json > test-results.json
      displayName: 'Generate Test Results'
