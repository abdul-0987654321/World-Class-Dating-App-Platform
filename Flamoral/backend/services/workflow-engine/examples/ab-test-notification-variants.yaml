# A/B Test Example: Testing different notification messages for new matches
# This YAML file demonstrates how to set up A/B test variants

testGroup: "new_match_notification_q4_2024"
baseWorkflow: "new_match_notification"
description: "Testing different notification copy to improve engagement rate"

variants:
  - variant: "control"
    percentage: 33
    modifications:
      name: "New Match Notification - Control"
      actions:
        - type: "send_push"
          config:
            title: "You have a new match!"
            body: "{{match.firstName}} liked you back. Start chatting now!"
            data:
              action: "navigate_to_match"
              matchId: "{{match.id}}"
          delay: 0
          retryOnFailure: true

  - variant: "emoji_friendly"
    percentage: 33
    modifications:
      name: "New Match Notification - Emoji Friendly"
      actions:
        - type: "send_push"
          config:
            title: "🎉 It's a match!"
            body: "You and {{match.firstName}} liked each other! Say hi! 👋"
            data:
              action: "navigate_to_match"
              matchId: "{{match.id}}"
          delay: 0
          retryOnFailure: true

  - variant: "curiosity_driven"
    percentage: 34
    modifications:
      name: "New Match Notification - Curiosity Driven"
      actions:
        - type: "send_push"
          config:
            title: "Someone special is waiting..."
            body: "{{match.firstName}} can't wait to hear from you. Don't keep them waiting!"
            data:
              action: "navigate_to_match"
              matchId: "{{match.id}}"
          delay: 0
          retryOnFailure: true

# Expected metrics to track:
# - Push notification open rate
# - Time to first message after match
# - Conversation initiation rate
# - User engagement within 24 hours

# Test duration: 14 days
# Minimum sample size: 1000 users per variant
# Success metric: Conversation initiation rate
