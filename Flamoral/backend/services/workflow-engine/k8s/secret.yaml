# This is a template file. Actual secrets should be managed via sealed-secrets or external secrets operator
apiVersion: v1
kind: Secret
metadata:
  name: workflow-engine-secrets
  namespace: flamoral
  labels:
    app: workflow-engine
type: Opaque
stringData:
  # Database credentials (base64 encoded in production)
  db.user: "workflow_user"
  db.password: "REPLACE_WITH_ACTUAL_PASSWORD"

  # Redis credentials
  redis.password: "REPLACE_WITH_ACTUAL_PASSWORD"

  # RabbitMQ credentials
  rabbitmq.user: "workflow_service"
  rabbitmq.password: "REPLACE_WITH_ACTUAL_PASSWORD"

  # Internal service authentication key
  internal.service.key: "REPLACE_WITH_ACTUAL_SERVICE_KEY"

  # JWT secret (if needed)
  jwt.secret: "REPLACE_WITH_ACTUAL_JWT_SECRET"
