apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-engine
  namespace: flamoral
  labels:
    app: workflow-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-engine-role
  namespace: flamoral
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-engine-rolebinding
  namespace: flamoral
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-engine-role
subjects:
- kind: ServiceAccount
  name: workflow-engine
  namespace: flamoral
