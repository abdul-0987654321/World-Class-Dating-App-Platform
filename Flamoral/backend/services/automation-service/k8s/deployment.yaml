apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-service
  namespace: flamoral
  labels:
    app: automation-service
    tier: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: automation-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: automation-service
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3014"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: automation-service
      containers:
        - name: automation-service
          image: flamoral/automation-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3014
              protocol: TCP
            - name: websocket
              containerPort: 3014
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3014"
            - name: SERVICE_NAME
              value: "automation-service"

            # JWT Configuration
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: access-secret

            # Database Configuration
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: automation-service-config
                  key: db-host
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "flamoral_automation"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DB_SSL
              value: "true"

            # Redis Configuration
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: automation-service-config
                  key: redis-host
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_DB
              value: "7"

            # RabbitMQ Configuration
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
            - name: RABBITMQ_EXCHANGE
              value: "flamoral_events"

            # Service URLs (Correct port assignments)
            - name: MESSAGING_SERVICE_URL
              value: "http://messaging-service:3004"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3012"
            - name: USER_SERVICE_URL
              value: "http://user-service:3002"
            - name: MATCHING_SERVICE_URL
              value: "http://matching-service:3009"
            - name: AI_SERVICE_URL
              value: "http://nlp-service:8000"
            - name: ANALYTICS_SERVICE_URL
              value: "http://analytics-service:3007"

            # Service Authentication
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: service-api-keys
                  key: automation-service

            # OpenAI Configuration
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-credentials
                  key: api-key
            - name: OPENAI_MODEL
              value: "gpt-4-turbo-preview"

            # Feature Flags
            - name: ENABLE_AUTO_DM_FLOWS
              value: "true"
            - name: ENABLE_ICEBREAKER_SUGGESTIONS
              value: "true"
            - name: ENABLE_GHOSTING_DETECTION
              value: "true"
            - name: ENABLE_SCHEDULED_MESSAGES
              value: "true"
            - name: ENABLE_AI_REPLY_ASSISTANT
              value: "true"

            # CORS Configuration
            - name: CORS_ORIGINS
              value: "https://flamoral.com,https://www.flamoral.com,https://app.flamoral.com"

            # Logging
            - name: LOG_LEVEL
              value: "info"

          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

      terminationGracePeriodSeconds: 30

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - automation-service
                topologyKey: kubernetes.io/hostname
