apiVersion: v1
kind: ServiceAccount
metadata:
  name: automation-service
  namespace: flamoral
  labels:
    app: automation-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: automation-service-role
  namespace: flamoral
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: automation-service-rolebinding
  namespace: flamoral
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: automation-service-role
subjects:
  - kind: ServiceAccount
    name: automation-service
    namespace: flamoral
