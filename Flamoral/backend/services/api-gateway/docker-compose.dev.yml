version: '3.8'

services:
  # ============================================================================
  # API Gateway
  # ============================================================================
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dating-api-gateway
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      # JWT
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production

      # Service URLs
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      MATCHING_SERVICE_URL: http://matching-service:3003
      MESSAGING_SERVICE_URL: http://messaging-service:3004
      MEDIA_SERVICE_URL: http://media-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      MODERATION_SERVICE_URL: http://moderation-service:3009
      ANALYTICS_SERVICE_URL: http://analytics-service:3010

      # Internal Service Key
      INTERNAL_SERVICE_KEY: dev-internal-service-key

      # CORS
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      CORS_CREDENTIALS: true

      # Logging
      LOG_LEVEL: debug

      # Tracing
      TRACING_ENABLED: true
      TRACING_SERVICE_NAME: api-gateway
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
    depends_on:
      - redis
      - jaeger
    networks:
      - dating-network
    restart: unless-stopped

  # ============================================================================
  # Redis (Rate Limiting & Caching)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: dating-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - dating-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # Redis Commander (Optional - Redis GUI)
  # ============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: dating-redis-commander
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - dating-network
    restart: unless-stopped

  # ============================================================================
  # Jaeger (Distributed Tracing)
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: dating-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector
      - "14250:14250"
      - "9411:9411"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    networks:
      - dating-network
    restart: unless-stopped

  # ============================================================================
  # Prometheus (Metrics Collection)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: dating-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - dating-network
    restart: unless-stopped

  # ============================================================================
  # Grafana (Metrics Visualization)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: dating-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - dating-network
    restart: unless-stopped

# ============================================================================
# Networks
# ============================================================================
networks:
  dating-network:
    driver: bridge
    name: dating-network

# ============================================================================
# Volumes
# ============================================================================
volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
