# =============================================================================
# CUSTOM RULES - CLOUD PROVIDERS
# =============================================================================

[[rules]]
id = "azure-storage-connection-string"
description = "Detected Azure Storage Connection String"
regex = '''DefaultEndpointsProtocol=https;AccountName=[a-z0-9]+;AccountKey=[A-Za-z0-9+/=]{88};EndpointSuffix=core\.windows\.net'''
tags = ["azure", "storage", "connection-string", "critical"]
[rules.allowlist]
regexes = [
  '''AccountKey=YOUR_ACCOUNT_KEY_HERE''',
  '''AccountKey=PLACEHOLDER''',
  '''AccountName=YOUR_ACCOUNT_NAME'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*\.env\.template$'''
]

[[rules]]
id = "azure-storage-account-key"
description = "Detected Azure Storage Account Key"
regex = '''[A-Za-z0-9+/]{88}=='''
tags = ["azure", "storage", "key", "critical"]
[rules.allowlist]
regexes = [
  '''YOUR_ACCOUNT_KEY_HERE''',
  '''PLACEHOLDER_KEY''',
  '''[A-Z]{88}=='''  # All caps placeholder
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*\.env\.template$''',
  '''.*/tests/.*''',
  '''.*/__tests__/.*'''
]

[[rules]]
id = "azure-service-bus-connection-string"
description = "Detected Azure Service Bus Connection String"
regex = '''Endpoint=sb://[a-z0-9-]+\.servicebus\.windows\.net/;SharedAccessKeyName=[A-Za-z0-9]+;SharedAccessKey=[A-Za-z0-9+/=]{44}'''
tags = ["azure", "servicebus", "connection-string", "critical"]
[rules.allowlist]
regexes = [
  '''SharedAccessKey=YOUR_KEY_HERE''',
  '''SharedAccessKey=PLACEHOLDER'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$'''
]

[[rules]]
id = "azure-cosmos-db-key"
description = "Detected Azure Cosmos DB Primary/Secondary Key"
regex = '''[A-Za-z0-9+/]{88}=='''
tags = ["azure", "cosmosdb", "key", "critical"]
[rules.allowlist]
regexes = [
  '''YOUR_COSMOS_KEY_HERE''',
  '''PLACEHOLDER_KEY'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*\.env\.template$'''
]

[[rules]]
id = "azure-app-insights-instrumentation-key"
description = "Detected Azure Application Insights Instrumentation Key"
regex = '''[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'''
tags = ["azure", "appinsights", "instrumentation-key", "medium"]
[rules.allowlist]
regexes = [
  '''00000000-0000-0000-0000-000000000000''',
  '''12345678-1234-1234-1234-123456789012''',
  '''YOUR_INSTRUMENTATION_KEY'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*/package\.json$''',
  '''.*/package-lock\.json$'''
]

# =============================================================================
# CUSTOM RULES - DATABASE CREDENTIALS
# =============================================================================

[[rules]]
id = "postgres-connection-string"
description = "Detected PostgreSQL Connection String with Password"
regex = '''postgres(?:ql)?://[a-zA-Z0-9_-]+:[^@\s]+@[a-zA-Z0-9.-]+:[0-9]+/[a-zA-Z0-9_-]+'''
tags = ["database", "postgres", "connection-string", "high"]
[rules.allowlist]
regexes = [
  '''postgres://postgres:postgres@localhost''',
  '''postgres://test:test@localhost''',
  '''postgres://user:password@localhost''',
  '''postgres://USERNAME:PASSWORD@HOST''',
  '''your_password_here''',
  '''YOUR_PASSWORD'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*\.env\.template$''',
  '''.*/tests/.*''',
  '''.*/__tests__/.*''',
  '''.*/test/.*''',
  '''.*/docker-compose\.yml$''',
  '''.*/docker-compose\.yaml$'''
]

[[rules]]
id = "mongodb-connection-string"
description = "Detected MongoDB Connection String with Password"
regex = '''mongodb(\+srv)?://[a-zA-Z0-9_-]+:[^@\s]+@[a-zA-Z0-9.-]+'''
tags = ["database", "mongodb", "connection-string", "high"]
[rules.allowlist]
regexes = [
  '''mongodb://admin:password@localhost''',
  '''mongodb://USERNAME:PASSWORD@HOST''',
  '''your_password_here''',
  '''YOUR_PASSWORD'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*/tests/.*''',
  '''.*/__tests__/.*''',
  '''.*/docker-compose\.yml$'''
]

[[rules]]
id = "redis-connection-string"
description = "Detected Redis Connection String with Password"
regex = '''redis://:[^@\s]+@[a-zA-Z0-9.-]+:[0-9]+'''
tags = ["database", "redis", "connection-string", "medium"]
[rules.allowlist]
regexes = [
  '''redis://:password@localhost''',
  '''redis://:YOUR_PASSWORD@''',
  '''your_redis_password'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*/tests/.*''',
  '''.*/docker-compose\.yml$'''
]

# =============================================================================
# CUSTOM RULES - JWT & API SECRETS
# =============================================================================

[[rules]]
id = "jwt-secret-high-entropy"
description = "Detected JWT Secret with High Entropy"
regex = '''(?i)(jwt_secret|jwt_access_secret|jwt_refresh_secret|access_token_secret|refresh_token_secret)\s*[:=]\s*['\"]?([a-zA-Z0-9+/=_-]{32,})['\"]?'''
entropy = 4.5
tags = ["jwt", "secret", "token", "high"]
[rules.allowlist]
regexes = [
  '''your-jwt-.*-secret''',
  '''your_jwt_.*_secret''',
  '''test_jwt_secret''',
  '''JWT_SECRET_PLACEHOLDER''',
  '''your-secret-key-min-32-chars''',
  '''your-.*-secret-key-min-32-chars'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*\.env\.template$''',
  '''.*/tests/.*''',
  '''.*/__tests__/.*''',
  '''.*/test/.*'''
]

[[rules]]
id = "api-key-high-entropy"
description = "Detected API Key with High Entropy"
regex = '''(?i)(api_key|apikey|service_api_key|x-api-key)\s*[:=]\s*['\"]?([a-zA-Z0-9_-]{32,})['\"]?'''
entropy = 4.0
tags = ["api", "key", "secret", "high"]
[rules.allowlist]
regexes = [
  '''your.*api.*key''',
  '''YOUR_API_KEY''',
  '''API_KEY_PLACEHOLDER''',
  '''test_api_key''',
  '''your-internal-service-api-key-min-32-chars'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*/tests/.*''',
  '''.*/__tests__/.*'''
]

# =============================================================================
# CUSTOM RULES - THIRD-PARTY SERVICES
# =============================================================================

[[rules]]
id = "sendgrid-api-key"
description = "Detected SendGrid API Key"
regex = '''SG\.[a-zA-Z0-9_-]{22}\.[a-zA-Z0-9_-]{43}'''
tags = ["sendgrid", "email", "api-key", "high"]
[rules.allowlist]
regexes = [
  '''SG\.YOUR_API_KEY''',
  '''SG\.PLACEHOLDER'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$'''
]

[[rules]]
id = "twilio-api-key"
description = "Detected Twilio API Key"
regex = '''SK[a-z0-9]{32}'''
tags = ["twilio", "sms", "api-key", "high"]
[rules.allowlist]
regexes = [
  '''SK00000000000000000000000000000000''',
  '''SKYOUR_API_KEY_HERE'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$'''
]

[[rules]]
id = "twilio-account-sid"
description = "Detected Twilio Account SID"
regex = '''AC[a-z0-9]{32}'''
tags = ["twilio", "account-sid", "medium"]
[rules.allowlist]
regexes = [
  '''AC00000000000000000000000000000000''',
  '''ACYOUR_ACCOUNT_SID_HERE'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$'''
]

[[rules]]
id = "slack-webhook-url"
description = "Detected Slack Webhook URL"
regex = '''https://hooks\.slack\.com/services/T[a-zA-Z0-9_]+/B[a-zA-Z0-9_]+/[a-zA-Z0-9_]+'''
tags = ["slack", "webhook", "url", "medium"]
[rules.allowlist]
regexes = [
  '''https://hooks\.slack\.com/services/YOUR_WEBHOOK_URL'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$'''
]

[[rules]]
id = "aws-access-key-id"
description = "Detected AWS Access Key ID"
regex = '''(?i)(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["aws", "access-key", "critical"]
[rules.allowlist]
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''AKIA0000000000000000''',
  '''YOUR_AWS_ACCESS_KEY'''
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*/docs/.*'''
]

[[rules]]
id = "aws-secret-access-key"
description = "Detected AWS Secret Access Key"
regex = '''(?i)aws_secret_access_key\s*[:=]\s*['\"]?([a-zA-Z0-9+/]{40})['\"]?'''
tags = ["aws", "secret-key", "critical"]
[rules.allowlist]
regexes = [
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  '''YOUR_AWS_SECRET_KEY''',
  '''[A-Z0-9]{40}'''  # All caps placeholder
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$'''
]

# =============================================================================
# CUSTOM RULES - PRIVATE KEYS
# =============================================================================

[[rules]]
id = "rsa-private-key"
description = "Detected RSA Private Key"
regex = '''-----BEGIN RSA PRIVATE KEY-----'''
tags = ["private-key", "rsa", "critical"]
[rules.allowlist]
paths = [
  '''.*/tests/.*''',
  '''.*/__tests__/.*''',
  '''.*/test/.*''',
  '''.*/fixtures/.*''',
  '''.*/docs/.*''',
  '''.*/examples/.*'''
]

[[rules]]
id = "openssh-private-key"
description = "Detected OpenSSH Private Key"
regex = '''-----BEGIN OPENSSH PRIVATE KEY-----'''
tags = ["private-key", "openssh", "critical"]
[rules.allowlist]
paths = [
  '''.*/tests/.*''',
  '''.*/__tests__/.*''',
  '''.*/fixtures/.*'''
]

[[rules]]
id = "pgp-private-key"
description = "Detected PGP Private Key"
regex = '''-----BEGIN PGP PRIVATE KEY BLOCK-----'''
tags = ["private-key", "pgp", "critical"]
[rules.allowlist]
paths = [
  '''.*/tests/.*''',
  '''.*/__tests__/.*''',
  '''.*/fixtures/.*'''
]

# =============================================================================
# GLOBAL ALLOWLIST
# =============================================================================

[allowlist]
description = "Global allowlist for known safe patterns and files"

# Paths to completely ignore
paths = [
  # Example and template files
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*\.env\.template$''',
  '''.*\.env\.dist$''',

  # Documentation
  '''.*/docs/.*\.md$''',
  '''.*/README\.md$''',
  '''.*/CHANGELOG\.md$''',

  # Test fixtures
  '''.*/tests/fixtures/.*''',
  '''.*/test/fixtures/.*''',
  '''.*/__tests__/fixtures/.*''',
  '''.*/testdata/.*''',

  # Node modules
  '''.*/node_modules/.*''',

  # Build artifacts
  '''.*/dist/.*''',
  '''.*/build/.*''',
  '''.*/out/.*''',
  '''.*/coverage/.*''',

  # Lock files
  '''.*package-lock\.json$''',
  '''.*yarn\.lock$''',
  '''.*pnpm-lock\.yaml$''',

  # Configuration files (non-sensitive)
  '''.*/\.prettierrc.*''',
  '''.*/\.eslintrc.*''',
  '''.*/tsconfig\.json$''',
  '''.*/jest\.config\.*''',

  # Gitleaks itself
  '''.*\.gitleaks\.toml$''',
  '''.*\.trufflehogignore$''',

  # Git files
  '''.*/\.git/.*''',
  '''.*/\.github/.*\.md$'''
]

# Regex patterns to ignore globally
regexes = [
  # Common placeholder patterns
  '''(?i)YOUR_.*_HERE''',
  '''(?i)PLACEHOLDER''',
  '''(?i)REPLACE_ME''',
  '''(?i)TODO''',
  '''(?i)CHANGEME''',
  '''(?i)example''',
  '''(?i)sample''',
  '''(?i)test_.*_key''',

  # Common test values
  '''test:test@localhost''',
  '''postgres:postgres@localhost''',
  '''admin:password@localhost''',
  '''username:password''',

  # UUIDs that are placeholders
  '''00000000-0000-0000-0000-000000000000''',
  '''11111111-1111-1111-1111-111111111111''',
  '''12345678-1234-1234-1234-123456789012'''
]

# Commits to ignore (useful for baseline)
commits = []

# Stop scanning at these commits
stopwords = []

# =============================================================================
# ENTROPY DETECTION
# =============================================================================

# Disable generic high-entropy detection to reduce false positives
# We use specific rules with entropy thresholds instead
[allowlist.regexTarget]
regexes = []

# =============================================================================
# REPORTING CONFIGURATION
# =============================================================================

# Configure the output
[report]
format = "sarif"
path = "gitleaks-report.sarif"

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================

# Adjust these for repository size and scan speed
[settings]
# Number of commits to scan (0 = all)
depth = 0

# Skip binary files
ignoreBinary = true

# Max file size to scan (bytes)
maxFileSize = 1048576  # 1MB
