# ============================================
# Docker Compose - Flamoral Platform
# Complete Staging Configuration
# ============================================

version: '3.8'

# ==========================================
# NETWORKS
# ==========================================
networks:
  flamoral-staging:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres-staging-data:
    driver: local
  mongodb-staging-data:
    driver: local
  redis-staging-data:
    driver: local
  rabbitmq-staging-data:
    driver: local
  elasticsearch-staging-data:
    driver: local
  prometheus-staging-data:
    driver: local
  grafana-staging-data:
    driver: local

# ==========================================
# SERVICES
# ==========================================
services:
  # ==========================================
  # INFRASTRUCTURE SERVICES
  # ==========================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: flamoral-postgres-staging
    environment:
      POSTGRES_DB: flamoral_staging
      POSTGRES_USER: ${POSTGRES_USER:-flamoral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flamoral}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:7-jammy
    container_name: flamoral-mongodb-staging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-flamoral}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: flamoral_staging
    ports:
      - "27018:27017"
    volumes:
      - mongodb-staging-data:/data/db
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: flamoral-redis-staging
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-flamoral_staging}
    ports:
      - "6380:6379"
    volumes:
      - redis-staging-data:/data
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: flamoral-rabbitmq-staging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-flamoral}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-staging-data:/var/lib/rabbitmq
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: flamoral-elasticsearch-staging
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    volumes:
      - elasticsearch-staging-data:/usr/share/elasticsearch/data
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # CORE BACKEND SERVICES
  # ==========================================

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: backend/services/api-gateway/Dockerfile
    image: flamoral/api-gateway:staging
    container_name: flamoral-api-gateway-staging
    environment:
      NODE_ENV: staging
      PORT: 4000
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:4001
      USER_SERVICE_URL: http://user-service:4002
      MATCHING_SERVICE_URL: http://matching-service:4003
      MESSAGING_SERVICE_URL: http://messaging-service:4004
      MEDIA_SERVICE_URL: http://media-service:4005
      PAYMENT_SERVICE_URL: http://payment-service:4006
      NOTIFICATION_SERVICE_URL: http://notification-service:4007
      ANALYTICS_SERVICE_URL: http://analytics-service:4008
      MODERATION_SERVICE_URL: http://moderation-service:4009
      ADMIN_SERVICE_URL: http://admin-service:4010
      REALTIME_SERVICE_URL: http://realtime-service:4011
      POLICY_SERVICE_URL: http://policy-service:4012
      ADVERTISING_SERVICE_URL: http://advertising-service:4013
      AUTOMATION_SERVICE_URL: http://automation-service:4014
      WORKFLOW_ENGINE_URL: http://workflow-engine:4015
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    image: flamoral/auth-service:staging
    container_name: flamoral-auth-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: .
      dockerfile: backend/services/user-service/Dockerfile
    image: flamoral/user-service:staging
    container_name: flamoral-user-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      MEDIA_SERVICE_URL: http://media-service:4005
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Matching Service
  matching-service:
    build:
      context: .
      dockerfile: backend/services/matching-service/Dockerfile
    image: flamoral/matching-service:staging
    container_name: flamoral-matching-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      USER_SERVICE_URL: http://user-service:4002
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Messaging Service
  messaging-service:
    build:
      context: .
      dockerfile: backend/services/messaging-service/Dockerfile
    image: flamoral/messaging-service:staging
    container_name: flamoral-messaging-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4004
      MONGODB_URI: mongodb://${MONGO_USER:-flamoral}:${MONGO_PASSWORD}@mongodb:27017/flamoral_staging?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      USER_SERVICE_URL: http://user-service:4002
      MODERATION_SERVICE_URL: http://moderation-service:4009
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4004:4004"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Media Service
  media-service:
    build:
      context: .
      dockerfile: backend/services/media-service/Dockerfile
    image: flamoral/media-service:staging
    container_name: flamoral-media-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4005
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      MODERATION_SERVICE_URL: http://moderation-service:4009
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-media-staging}
    ports:
      - "4005:4005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: backend/services/payment-service/Dockerfile
    image: flamoral/payment-service:staging
    container_name: flamoral-payment-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4006
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      USER_SERVICE_URL: http://user-service:4002
    ports:
      - "4006:4006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
    image: flamoral/notification-service:staging
    container_name: flamoral-notification-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4007
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
    ports:
      - "4007:4007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: backend/services/analytics-service/Dockerfile
    image: flamoral/analytics-service:staging
    container_name: flamoral-analytics-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4008
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "4008:4008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Moderation Service
  moderation-service:
    build:
      context: .
      dockerfile: backend/services/moderation-service/Dockerfile
    image: flamoral/moderation-service:staging
    container_name: flamoral-moderation-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4009
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AZURE_CONTENT_MODERATOR_KEY: ${AZURE_CONTENT_MODERATOR_KEY}
      AZURE_CONTENT_MODERATOR_ENDPOINT: ${AZURE_CONTENT_MODERATOR_ENDPOINT}
    ports:
      - "4009:4009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Admin Service
  admin-service:
    build:
      context: .
      dockerfile: backend/services/admin-service/Dockerfile
    image: flamoral/admin-service:staging
    container_name: flamoral-admin-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4010
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4010:4010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Realtime Service
  realtime-service:
    build:
      context: .
      dockerfile: backend/services/realtime-service/Dockerfile
    image: flamoral/realtime-service:staging
    container_name: flamoral-realtime-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4011
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4011:4011"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================================
  # NEW SERVICES
  # ==========================================

  # Policy Service
  policy-service:
    build:
      context: .
      dockerfile: backend/services/policy-service/Dockerfile
    image: flamoral/policy-service:staging
    container_name: flamoral-policy-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4012
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4012:4012"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Advertising Service
  advertising-service:
    build:
      context: .
      dockerfile: backend/services/advertising-service/Dockerfile
    image: flamoral/advertising-service:staging
    container_name: flamoral-advertising-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4013
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      ANALYTICS_SERVICE_URL: http://analytics-service:4008
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4013:4013"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4013/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Automation Service
  automation-service:
    build:
      context: .
      dockerfile: backend/services/automation-service/Dockerfile
    image: flamoral/automation-service:staging
    container_name: flamoral-automation-service-staging
    environment:
      NODE_ENV: staging
      PORT: 4014
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-flamoral}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      NOTIFICATION_SERVICE_URL: http://notification-service:4007
      MESSAGING_SERVICE_URL: http://messaging-service:4004
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4014:4014"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4014/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Workflow Engine
  workflow-engine:
    build:
      context: .
      dockerfile: backend/services/workflow-engine/Dockerfile
    image: flamoral/workflow-engine:staging
    container_name: flamoral-workflow-engine-staging
    environment:
      NODE_ENV: staging
      PORT: 4015
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD}@postgres:5432/flamoral_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_staging}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-flamoral}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4015:4015"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================================
  # MONITORING
  # ==========================================

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: flamoral-prometheus-staging
    ports:
      - "9091:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-staging-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - flamoral-staging
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: flamoral-grafana-staging
    ports:
      - "3010:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-staging-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - flamoral-staging
    restart: unless-stopped

  # ==========================================
  # FRONTEND & GATEWAY
  # ==========================================

  # Frontend Web App
  frontend-web:
    build:
      context: ./apps/web-app
      dockerfile: Dockerfile.staging
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:4000}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-ws://localhost:4011}
    image: flamoral/frontend-web:staging
    container_name: flamoral-frontend-web-staging
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - flamoral-staging
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: flamoral-nginx-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/staging.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend-web
      - api-gateway
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
