# =============================================================================
# INFRASTRUCTURE PIPELINE - Flamoral Dating Platform
# =============================================================================
# Terraform automation with plan, apply, cost estimation, and validation
# Multi-environment infrastructure deployment
# =============================================================================

name: Infrastructure Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - 'k8s/**'
      - 'helm/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - 'k8s/**'
      - 'helm/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      action:
        description: 'Terraform action'
        required: true
        type: choice
        default: 'plan'
        options:
          - plan
          - apply
          - destroy
      auto_approve:
        description: 'Auto-approve (use with caution)'
        type: boolean
        default: false

concurrency:
  group: infrastructure-${{ github.event.inputs.environment || 'all' }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: '1.6.0'
  TFLINT_VERSION: 'latest'
  CHECKOV_VERSION: 'latest'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ===========================================================================
  # Terraform Validation & Linting
  # ===========================================================================
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform

      - name: Terraform Init (Validation)
        run: |
          for env_dir in infrastructure/terraform/environments/*; do
            if [ -d "$env_dir" ]; then
              echo "Validating $env_dir"
              cd "$env_dir"
              terraform init -backend=false
              terraform validate
              cd - > /dev/null
            fi
          done

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive
        working-directory: infrastructure/terraform

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
          skip_check: CKV_AZURE_33,CKV_AZURE_35

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov-terraform

  # ===========================================================================
  # Infrastructure Cost Estimation
  # ===========================================================================
  cost-estimate:
    name: Cost Estimation
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
        continue-on-error: true

      - name: Generate cost estimate - Development
        run: |
          cd infrastructure/terraform/environments/dating-dev
          terraform init -backend=false
          infracost breakdown --path . \
            --format json \
            --out-file /tmp/infracost-dev.json
        continue-on-error: true

      - name: Generate cost estimate - Staging
        run: |
          cd infrastructure/terraform/environments/test
          terraform init -backend=false
          infracost breakdown --path . \
            --format json \
            --out-file /tmp/infracost-staging.json
        continue-on-error: true

      - name: Generate cost estimate - Production
        run: |
          cd infrastructure/terraform/environments/prod
          terraform init -backend=false
          infracost breakdown --path . \
            --format json \
            --out-file /tmp/infracost-prod.json
        continue-on-error: true

      - name: Post cost estimate comment
        uses: infracost/actions/comment@v1
        with:
          path: /tmp/infracost-*.json
          behavior: update
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate cost summary
        run: |
          infracost output --path /tmp/infracost-*.json \
            --format table \
            --out-file cost-summary.txt
          cat cost-summary.txt
        continue-on-error: true

      - name: Upload cost reports
        uses: actions/upload-artifact@v4
        with:
          name: cost-estimates
          path: |
            /tmp/infracost-*.json
            cost-summary.txt
          retention-days: 90

  # ===========================================================================
  # Terraform Plan - Development
  # ===========================================================================
  plan-dev:
    name: Plan Development
    runs-on: ubuntu-latest
    needs: [validate, cost-estimate]
    if: github.event.inputs.environment == 'development' || github.event_name == 'pull_request'
    environment: development-plan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/dating-dev
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_DEV }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_DEV }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

      - name: Terraform Plan
        working-directory: infrastructure/terraform/environments/dating-dev
        run: terraform plan -out=tfplan-dev
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_DEV }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_DEV }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/terraform/environments/dating-dev/tfplan-dev
          retention-days: 30

  # ===========================================================================
  # Terraform Apply - Development
  # ===========================================================================
  apply-dev:
    name: Apply Development
    runs-on: ubuntu-latest
    needs: plan-dev
    if: |
      (github.event.inputs.environment == 'development' && github.event.inputs.action == 'apply') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/terraform/environments/dating-dev

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/dating-dev
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_DEV }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_DEV }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

      - name: Terraform Apply
        working-directory: infrastructure/terraform/environments/dating-dev
        run: terraform apply -auto-approve tfplan-dev
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_DEV }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_DEV }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

  # ===========================================================================
  # Terraform Plan - Staging
  # ===========================================================================
  plan-staging:
    name: Plan Staging
    runs-on: ubuntu-latest
    needs: [validate, cost-estimate]
    if: github.event.inputs.environment == 'staging' || github.event_name == 'pull_request'
    environment: staging-plan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/test
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_STAGING }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_STAGING }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_STAGING }}

      - name: Terraform Plan
        working-directory: infrastructure/terraform/environments/test
        run: terraform plan -out=tfplan-staging -var-file=staging.tfvars
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_STAGING }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_STAGING }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_STAGING }}

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: infrastructure/terraform/environments/test/tfplan-staging
          retention-days: 30

  # ===========================================================================
  # Terraform Apply - Staging
  # ===========================================================================
  apply-staging:
    name: Apply Staging
    runs-on: ubuntu-latest
    needs: plan-staging
    if: github.event.inputs.environment == 'staging' && github.event.inputs.action == 'apply'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: infrastructure/terraform/environments/test

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/test
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_STAGING }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_STAGING }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_STAGING }}

      - name: Terraform Apply
        working-directory: infrastructure/terraform/environments/test
        run: terraform apply -auto-approve tfplan-staging
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_STAGING }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_STAGING }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_STAGING }}

  # ===========================================================================
  # Terraform Plan - Production
  # ===========================================================================
  plan-production:
    name: Plan Production
    runs-on: ubuntu-latest
    needs: [validate, cost-estimate]
    if: github.event.inputs.environment == 'production'
    environment: production-plan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/prod
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Plan
        working-directory: infrastructure/terraform/environments/prod
        run: terraform plan -out=tfplan-prod -var-file=prod.tfvars
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate plan summary
        working-directory: infrastructure/terraform/environments/prod
        run: |
          terraform show -no-color tfplan-prod > plan-summary.txt
          echo "# Production Infrastructure Changes" > plan-review.md
          echo "" >> plan-review.md
          echo "## Terraform Plan Summary" >> plan-review.md
          echo '```' >> plan-review.md
          terraform show tfplan-prod >> plan-review.md
          echo '```' >> plan-review.md

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-production
          path: |
            infrastructure/terraform/environments/prod/tfplan-prod
            infrastructure/terraform/environments/prod/plan-*.{txt,md}
          retention-days: 90

  # ===========================================================================
  # Terraform Apply - Production
  # ===========================================================================
  apply-production:
    name: Apply Production
    runs-on: ubuntu-latest
    needs: plan-production
    if: |
      github.event.inputs.environment == 'production' &&
      github.event.inputs.action == 'apply' &&
      github.event.inputs.auto_approve == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-production
          path: infrastructure/terraform/environments/prod

      - name: Backup Terraform State
        run: |
          az storage blob download \
            --account-name ${{ secrets.TF_STATE_STORAGE_ACCOUNT }} \
            --container-name ${{ secrets.TF_STATE_CONTAINER }} \
            --name flamoral-prod.tfstate \
            --file tfstate-backup-${{ github.run_id }}.json || echo "Backup created"

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/prod
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Apply
        working-directory: infrastructure/terraform/environments/prod
        run: terraform apply -auto-approve tfplan-prod
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # ===========================================================================
  # Post-deployment Validation
  # ===========================================================================
  validate-deployment:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    needs: [apply-dev, apply-staging, apply-production]
    if: |
      always() &&
      (needs.apply-dev.result == 'success' ||
       needs.apply-staging.result == 'success' ||
       needs.apply-production.result == 'success')

    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ needs.apply-production.result }}" == "success" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "resource_group=flamoral-prod-rg" >> $GITHUB_OUTPUT
            echo "aks_cluster=flamoral-prod-aks" >> $GITHUB_OUTPUT
          elif [ "${{ needs.apply-staging.result }}" == "success" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "resource_group=flamoral-staging-rg" >> $GITHUB_OUTPUT
            echo "aks_cluster=flamoral-staging-aks" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "resource_group=flamoral-dev-rg" >> $GITHUB_OUTPUT
            echo "aks_cluster=flamoral-dev-aks" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate AKS cluster
        run: |
          STATUS=$(az aks show \
            --resource-group ${{ steps.env.outputs.resource_group }} \
            --name ${{ steps.env.outputs.aks_cluster }} \
            --query "powerState.code" -o tsv)

          if [ "$STATUS" == "Running" ]; then
            echo "AKS cluster is running"
          else
            echo "AKS cluster status: $STATUS"
            exit 1
          fi

      - name: Validate database
        run: |
          az postgres flexible-server show \
            --resource-group ${{ steps.env.outputs.resource_group }} \
            --name flamoral-${{ steps.env.outputs.environment }}-postgres \
            --query "state" -o tsv

      - name: Validate networking
        run: |
          az network vnet list \
            --resource-group ${{ steps.env.outputs.resource_group }} \
            --query "[].{Name:name, Status:provisioningState}" -o table

  # ===========================================================================
  # Notifications
  # ===========================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [validate-deployment]
    if: always()

    steps:
      - name: Infrastructure Summary
        run: |
          echo "# Infrastructure Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cost Estimate | ${{ needs.cost-estimate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | ${{ needs.validate-deployment.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#infrastructure'
          text: |
            Infrastructure deployment ${{ job.status }}
            Environment: ${{ github.event.inputs.environment || 'all' }}
            Action: ${{ github.event.inputs.action || 'plan' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
