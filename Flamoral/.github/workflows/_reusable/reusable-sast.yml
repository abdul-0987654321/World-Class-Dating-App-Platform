# =============================================================================
# REUSABLE WORKFLOW: SAST (Static Application Security Testing)
# =============================================================================
# CodeQL, Semgrep, ESLint security analysis
# =============================================================================

name: Reusable SAST

on:
  workflow_call:
    inputs:
      languages:
        description: 'Languages to analyze (comma-separated)'
        required: false
        type: string
        default: 'javascript,typescript'
      semgrep-rules:
        description: 'Semgrep rule sets'
        required: false
        type: string
        default: 'p/javascript,p/typescript,p/react,p/nodejs,p/owasp-top-ten,p/security-audit'
      fail-on-critical:
        description: 'Fail on critical findings'
        required: false
        type: boolean
        default: true
      working-directory:
        description: 'Working directory for analysis'
        required: false
        type: string
        default: '.'
    outputs:
      findings-count:
        description: 'Number of security findings'
        value: ${{ jobs.sast.outputs.findings-count }}
      critical-count:
        description: 'Number of critical findings'
        value: ${{ jobs.sast.outputs.critical-count }}

jobs:
  sast:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    outputs:
      findings-count: ${{ steps.summary.outputs.findings-count }}
      critical-count: ${{ steps.summary.outputs.critical-count }}

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.languages }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          upload: true

      - name: Run Semgrep
        id: semgrep
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: ${{ inputs.semgrep-rules }}
          generateSarif: "1"

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Setup Node.js for ESLint
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: ${{ inputs.working-directory }}
        continue-on-error: true

      - name: Run ESLint security rules
        id: eslint
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: |
          npx eslint . --ext .js,.ts,.jsx,.tsx \
            --format json \
            --output-file eslint-security-report.json \
            || true

          # Count security-related findings
          if [ -f eslint-security-report.json ]; then
            ESLINT_ERRORS=$(cat eslint-security-report.json | jq '[.[].errorCount] | add // 0')
            echo "eslint-errors=$ESLINT_ERRORS" >> $GITHUB_OUTPUT
          fi

      - name: Generate SAST Summary
        id: summary
        if: always()
        run: |
          REPORT_PATH="sast-report.json"

          # Count findings (simplified for this example)
          FINDINGS_COUNT=0
          CRITICAL_COUNT=0

          cat > $REPORT_PATH <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "analyzers": {
              "codeql": {
                "status": "${{ steps.codeql.outcome }}"
              },
              "semgrep": {
                "status": "${{ steps.semgrep.outcome }}"
              },
              "eslint": {
                "status": "${{ steps.eslint.outcome }}",
                "errors": "${{ steps.eslint.outputs.eslint-errors || 0 }}"
              }
            },
            "findings_count": $FINDINGS_COUNT,
            "critical_count": $CRITICAL_COUNT,
            "sha": "${{ github.sha }}"
          }
          EOF

          echo "=== SAST Summary ==="
          cat $REPORT_PATH
          echo "===================="

          echo "findings-count=$FINDINGS_COUNT" >> $GITHUB_OUTPUT
          echo "critical-count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT

          # Generate step summary
          echo "## SAST Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Analyzer | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ steps.codeql.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ${{ steps.semgrep.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint | ${{ steps.eslint.outcome }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report-${{ github.run_id }}
          path: |
            sast-report.json
            eslint-security-report.json
            semgrep.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail on critical
        if: inputs.fail-on-critical && steps.summary.outputs.critical-count != '0'
        run: |
          echo "::error::Critical security findings detected"
          exit 1
