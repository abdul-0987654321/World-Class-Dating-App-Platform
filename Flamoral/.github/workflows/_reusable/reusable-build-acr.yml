# =============================================================================
# REUSABLE WORKFLOW: Build and Push to ACR
# =============================================================================
# Docker build, SBOM generation, Trivy scan, ACR push with digest verification
# =============================================================================

name: Reusable Build ACR

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Name of the service to build'
        required: true
        type: string
      service-path:
        description: 'Path to service directory'
        required: true
        type: string
      acr-name:
        description: 'Azure Container Registry name'
        required: true
        type: string
      image-tag:
        description: 'Image tag (defaults to SHA)'
        required: false
        type: string
        default: ''
      environment:
        description: 'Target environment'
        required: false
        type: string
        default: 'dev'
      generate-sbom:
        description: 'Generate SBOM'
        required: false
        type: boolean
        default: true
      scan-image:
        description: 'Scan image with Trivy'
        required: false
        type: boolean
        default: true
    outputs:
      image-digest:
        description: 'Image digest'
        value: ${{ jobs.build-push.outputs.digest }}
      image-tag:
        description: 'Image tag used'
        value: ${{ jobs.build-push.outputs.tag }}
      sbom-path:
        description: 'Path to SBOM file'
        value: ${{ jobs.build-push.outputs.sbom-path }}
    secrets:
      AZURE_CREDENTIALS:
        required: true

jobs:
  build-push:
    name: Build and Push ${{ inputs.service-name }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.vars.outputs.tag }}
      sbom-path: ${{ steps.sbom.outputs.path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TAG="${{ inputs.image-tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "acr-server=${{ inputs.acr-name }}.azurecr.io" >> $GITHUB_OUTPUT
          echo "image=${{ inputs.acr-name }}.azurecr.io/flamoral/${{ inputs.service-name }}" >> $GITHUB_OUTPUT

      - name: Check Dockerfile exists
        id: dockerfile-check
        run: |
          if [ -f "${{ inputs.service-path }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Dockerfile found at ${{ inputs.service-path }}/Dockerfile"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::No Dockerfile found at ${{ inputs.service-path }}/Dockerfile"
          fi

      - name: Azure Login
        if: steps.dockerfile-check.outputs.exists == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        if: steps.dockerfile-check.outputs.exists == 'true'
        run: az acr login --name ${{ inputs.acr-name }}

      - name: Set up Docker Buildx
        if: steps.dockerfile-check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: push
        if: steps.dockerfile-check.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.service-path }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:${{ inputs.environment }}-latest
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
            BUILD_VERSION=${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Generate SBOM
        id: sbom
        if: inputs.generate-sbom && steps.dockerfile-check.outputs.exists == 'true'
        run: |
          echo "Generating SBOM for ${{ inputs.service-name }}..."

          # Install syft
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

          SBOM_PATH="sbom-${{ inputs.service-name }}.json"

          # Generate SBOM in CycloneDX format
          syft ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }} \
            -o cyclonedx-json=$SBOM_PATH \
            --scope all-layers

          echo "path=$SBOM_PATH" >> $GITHUB_OUTPUT
          echo "SBOM generated: $SBOM_PATH"

      - name: Scan image with Trivy
        id: trivy
        if: inputs.scan-image && steps.dockerfile-check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          format: 'sarif'
          output: 'trivy-${{ inputs.service-name }}.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results
        if: inputs.scan-image && steps.dockerfile-check.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ inputs.service-name }}.sarif
          category: trivy-${{ inputs.service-name }}
        continue-on-error: true

      - name: Verify image digest
        if: steps.dockerfile-check.outputs.exists == 'true'
        run: |
          echo "=== Image Verification ==="
          echo "Image: ${{ steps.vars.outputs.image }}"
          echo "Tag: ${{ steps.vars.outputs.tag }}"
          echo "Digest: ${{ steps.push.outputs.digest }}"

          # Verify image exists in registry
          az acr repository show-tags \
            --name ${{ inputs.acr-name }} \
            --repository flamoral/${{ inputs.service-name }} \
            --orderby time_desc \
            --top 5

      - name: Generate build summary
        if: always()
        run: |
          REPORT_PATH="build-report-${{ inputs.service-name }}.json"

          cat > $REPORT_PATH <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "service": "${{ inputs.service-name }}",
            "path": "${{ inputs.service-path }}",
            "dockerfile_exists": ${{ steps.dockerfile-check.outputs.exists }},
            "image": "${{ steps.vars.outputs.image }}",
            "tag": "${{ steps.vars.outputs.tag }}",
            "digest": "${{ steps.push.outputs.digest || 'N/A' }}",
            "environment": "${{ inputs.environment }}",
            "sbom_generated": ${{ inputs.generate-sbom && steps.dockerfile-check.outputs.exists == 'true' }},
            "trivy_scan": "${{ steps.trivy.outcome || 'skipped' }}",
            "sha": "${{ github.sha }}"
          }
          EOF

          echo "## Build Report: ${{ inputs.service-name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ steps.vars.outputs.image }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.vars.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile | ${{ steps.dockerfile-check.outputs.exists }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Scan | ${{ steps.trivy.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ inputs.service-name }}-${{ github.run_id }}
          path: |
            build-report-${{ inputs.service-name }}.json
            sbom-${{ inputs.service-name }}.json
            trivy-${{ inputs.service-name }}.sarif
          retention-days: 30
          if-no-files-found: ignore
