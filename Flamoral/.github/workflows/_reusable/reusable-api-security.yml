# =============================================================================
# REUSABLE WORKFLOW: API Security Testing
# =============================================================================
# OWASP ZAP, API authentication tests, security headers validation
# =============================================================================

name: Reusable API Security

on:
  workflow_call:
    inputs:
      target-url:
        description: 'Target API URL for scanning'
        required: true
        type: string
      scan-type:
        description: 'Type of scan (baseline, full, api)'
        required: false
        type: string
        default: 'baseline'
      auth-token:
        description: 'Authentication token for API access'
        required: false
        type: string
        default: ''
      fail-on-high:
        description: 'Fail on high severity findings'
        required: false
        type: boolean
        default: true
    outputs:
      high-alerts:
        description: 'Number of high severity alerts'
        value: ${{ jobs.zap-scan.outputs.high-alerts }}
      report-path:
        description: 'Path to ZAP report'
        value: ${{ jobs.zap-scan.outputs.report-path }}
    secrets:
      STAGING_URL:
        required: false
      STAGING_API_URL:
        required: false
      API_AUTH_TOKEN:
        required: false

jobs:
  zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    outputs:
      high-alerts: ${{ steps.summary.outputs.high-alerts }}
      report-path: ${{ steps.summary.outputs.report-path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZAP rules file if missing
        run: |
          mkdir -p .zap
          if [ ! -f ".zap/rules.tsv" ]; then
            echo "Creating default ZAP rules file..."
            cat > .zap/rules.tsv <<'EOF'
          # Default ZAP rules - HIGH severity alerts
          40018	HIGH
          40012	HIGH
          6	HIGH
          90019	HIGH
          40046	HIGH
          10021	MEDIUM
          10020	MEDIUM
          EOF
          fi

      - name: ZAP Baseline Scan
        if: inputs.scan-type == 'baseline'
        id: zap-baseline
        uses: zaproxy/action-baseline@v0.11.0
        continue-on-error: true
        with:
          target: ${{ inputs.target-url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false

      - name: ZAP Full Scan
        if: inputs.scan-type == 'full'
        id: zap-full
        uses: zaproxy/action-full-scan@v0.9.0
        continue-on-error: true
        with:
          target: ${{ inputs.target-url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false

      - name: ZAP API Scan
        if: inputs.scan-type == 'api'
        id: zap-api
        uses: zaproxy/action-api-scan@v0.7.0
        continue-on-error: true
        with:
          target: ${{ inputs.target-url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-f openapi'
          allow_issue_writing: false

      - name: Run API authentication tests
        id: auth-tests
        continue-on-error: true
        run: |
          TARGET_URL="${{ inputs.target-url }}"

          echo "=== API Authentication Tests ==="

          # Test 1: Check for authentication requirement
          echo "Test 1: Checking protected endpoints require auth..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/api/v1/users/me" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "  PASS: Protected endpoint requires authentication"
            AUTH_TEST_1="pass"
          else
            echo "  WARN: Protected endpoint returned $HTTP_CODE (expected 401/403)"
            AUTH_TEST_1="warn"
          fi

          # Test 2: Check for rate limiting headers
          echo "Test 2: Checking for rate limiting..."
          RATE_HEADERS=$(curl -s -I "$TARGET_URL/health" 2>/dev/null | grep -i "x-ratelimit" || echo "")
          if [ -n "$RATE_HEADERS" ]; then
            echo "  PASS: Rate limiting headers present"
            AUTH_TEST_2="pass"
          else
            echo "  INFO: No rate limiting headers detected"
            AUTH_TEST_2="info"
          fi

          # Test 3: Check security headers
          echo "Test 3: Checking security headers..."
          SECURITY_HEADERS=$(curl -s -I "$TARGET_URL/health" 2>/dev/null)
          MISSING_HEADERS=()

          if ! echo "$SECURITY_HEADERS" | grep -qi "x-content-type-options"; then
            MISSING_HEADERS+=("X-Content-Type-Options")
          fi
          if ! echo "$SECURITY_HEADERS" | grep -qi "x-frame-options"; then
            MISSING_HEADERS+=("X-Frame-Options")
          fi
          if ! echo "$SECURITY_HEADERS" | grep -qi "strict-transport-security"; then
            MISSING_HEADERS+=("Strict-Transport-Security")
          fi

          if [ ${#MISSING_HEADERS[@]} -eq 0 ]; then
            echo "  PASS: All critical security headers present"
            AUTH_TEST_3="pass"
          else
            echo "  WARN: Missing headers: ${MISSING_HEADERS[*]}"
            AUTH_TEST_3="warn"
          fi

          echo "auth-test-1=$AUTH_TEST_1" >> $GITHUB_OUTPUT
          echo "auth-test-2=$AUTH_TEST_2" >> $GITHUB_OUTPUT
          echo "auth-test-3=$AUTH_TEST_3" >> $GITHUB_OUTPUT

      - name: Generate API Security Summary
        id: summary
        if: always()
        run: |
          REPORT_PATH="api-security-report.json"

          # Parse ZAP results if available
          HIGH_ALERTS=0
          if [ -f "report_html.html" ]; then
            # Count high alerts from ZAP report (simplified)
            HIGH_ALERTS=$(grep -c "High" report_html.html 2>/dev/null || echo "0")
          fi

          cat > $REPORT_PATH <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "target": "${{ inputs.target-url }}",
            "scan_type": "${{ inputs.scan-type }}",
            "zap_results": {
              "high_alerts": $HIGH_ALERTS,
              "baseline_status": "${{ steps.zap-baseline.outcome || 'skipped' }}",
              "full_status": "${{ steps.zap-full.outcome || 'skipped' }}",
              "api_status": "${{ steps.zap-api.outcome || 'skipped' }}"
            },
            "auth_tests": {
              "auth_required": "${{ steps.auth-tests.outputs.auth-test-1 || 'unknown' }}",
              "rate_limiting": "${{ steps.auth-tests.outputs.auth-test-2 || 'unknown' }}",
              "security_headers": "${{ steps.auth-tests.outputs.auth-test-3 || 'unknown' }}"
            },
            "sha": "${{ github.sha }}"
          }
          EOF

          echo "high-alerts=$HIGH_ALERTS" >> $GITHUB_OUTPUT
          echo "report-path=$REPORT_PATH" >> $GITHUB_OUTPUT

          # Generate step summary
          echo "## API Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ inputs.target-url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Type:** ${{ inputs.scan-type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| High Alerts | $HIGH_ALERTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Auth Required | ${{ steps.auth-tests.outputs.auth-test-1 || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rate Limiting | ${{ steps.auth-tests.outputs.auth-test-2 || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Headers | ${{ steps.auth-tests.outputs.auth-test-3 || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-security-report-${{ github.run_id }}
          path: |
            api-security-report.json
            report_html.html
            report_json.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail on high severity
        if: inputs.fail-on-high && steps.summary.outputs.high-alerts != '0'
        run: |
          echo "::error::High severity API security findings detected"
          exit 1
