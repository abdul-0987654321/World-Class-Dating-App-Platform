# =============================================================================
# REUSABLE WORKFLOW: Bootstrap
# =============================================================================
# Standard setup for all CI/CD jobs: checkout, node, cache, validation
# =============================================================================

name: Reusable Bootstrap

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      working-directory:
        description: 'Working directory'
        required: false
        type: string
        default: '.'
      install-dependencies:
        description: 'Install npm dependencies'
        required: false
        type: boolean
        default: true
      environment:
        description: 'Target environment for validation'
        required: false
        type: string
        default: ''
      validate-secrets:
        description: 'Validate required secrets'
        required: false
        type: boolean
        default: false
      required-secrets:
        description: 'Comma-separated list of required secrets'
        required: false
        type: string
        default: ''
    outputs:
      node-version:
        description: 'Installed Node.js version'
        value: ${{ jobs.bootstrap.outputs.node-version }}
      cache-hit:
        description: 'Whether cache was hit'
        value: ${{ jobs.bootstrap.outputs.cache-hit }}
    secrets:
      AZURE_CREDENTIALS:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false

jobs:
  bootstrap:
    name: Bootstrap Environment
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.setup-node.outputs.node-version }}
      cache-hit: ${{ steps.setup-node.outputs.cache-hit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Print diagnostics
        run: |
          echo "=== Bootstrap Diagnostics ==="
          echo "Node.js: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Git SHA: ${{ github.sha }}"
          echo "Working dir: ${{ inputs.working-directory }}"
          echo "=============================="

      - name: Install dependencies
        if: inputs.install-dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --prefer-offline --no-audit
          elif [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          fi

      - name: Validate environment
        if: inputs.environment != ''
        run: |
          echo "Validating environment: ${{ inputs.environment }}"
          # Environment validation logic here

      - name: Generate bootstrap report
        if: always()
        run: |
          cat > bootstrap-report.json <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "node_version": "$(node --version)",
            "npm_version": "$(npm --version)",
            "working_directory": "${{ inputs.working-directory }}",
            "environment": "${{ inputs.environment }}",
            "cache_hit": "${{ steps.setup-node.outputs.cache-hit }}",
            "sha": "${{ github.sha }}"
          }
          EOF

      - name: Upload bootstrap report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-report-${{ github.run_id }}
          path: bootstrap-report.json
          retention-days: 7
