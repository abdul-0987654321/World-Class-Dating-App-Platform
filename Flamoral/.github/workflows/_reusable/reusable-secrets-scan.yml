# =============================================================================
# REUSABLE WORKFLOW: Secrets Scanning
# =============================================================================
# Comprehensive secret detection using multiple tools
# =============================================================================

name: Reusable Secrets Scan

on:
  workflow_call:
    inputs:
      fail-on-detection:
        description: 'Fail workflow if secrets detected'
        required: false
        type: boolean
        default: true
      scan-depth:
        description: 'Git history depth to scan (0 for all)'
        required: false
        type: number
        default: 0
      upload-sarif:
        description: 'Upload results to GitHub Security'
        required: false
        type: boolean
        default: true
    outputs:
      secrets-found:
        description: 'Whether secrets were detected'
        value: ${{ jobs.secret-scan.outputs.secrets-found }}
      report-path:
        description: 'Path to scan report'
        value: ${{ jobs.secret-scan.outputs.report-path }}

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    outputs:
      secrets-found: ${{ steps.summary.outputs.secrets-found }}
      report-path: ${{ steps.summary.outputs.report-path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.scan-depth }}

      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --json

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Run detect-secrets baseline scan
        id: detect-secrets
        continue-on-error: true
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --force-use-all-plugins > detect-secrets-report.json || true
          if [ -s detect-secrets-report.json ]; then
            echo "detect-secrets completed"
          fi

      - name: Check for exposed .env files
        id: env-check
        run: |
          echo "Checking for exposed environment files..."
          EXPOSED_FILES=()

          # Check for .env files that shouldn't be committed
          for pattern in ".env" ".env.local" ".env.production" ".env.*.local" "*.pem" "*.key" "credentials.json" "service-account.json"; do
            files=$(find . -name "$pattern" -type f ! -path "*/node_modules/*" ! -path "*/.git/*" 2>/dev/null || true)
            if [ -n "$files" ]; then
              echo "Warning: Found $pattern files:"
              echo "$files"
              while IFS= read -r file; do
                EXPOSED_FILES+=("$file")
              done <<< "$files"
            fi
          done

          if [ ${#EXPOSED_FILES[@]} -gt 0 ]; then
            echo "env-exposed=true" >> $GITHUB_OUTPUT
            printf '%s\n' "${EXPOSED_FILES[@]}" > exposed-files.txt
          else
            echo "env-exposed=false" >> $GITHUB_OUTPUT
            echo "No exposed environment files found."
          fi

      - name: Generate summary report
        id: summary
        if: always()
        run: |
          REPORT_PATH="secrets-scan-report.json"

          TRUFFLEHOG_STATUS="${{ steps.trufflehog.outcome }}"
          GITLEAKS_STATUS="${{ steps.gitleaks.outcome }}"
          ENV_EXPOSED="${{ steps.env-check.outputs.env-exposed }}"

          # Determine if secrets were found
          SECRETS_FOUND="false"
          if [ "$TRUFFLEHOG_STATUS" = "failure" ] || [ "$GITLEAKS_STATUS" = "failure" ] || [ "$ENV_EXPOSED" = "true" ]; then
            SECRETS_FOUND="true"
          fi

          cat > $REPORT_PATH <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "secrets_found": $SECRETS_FOUND,
            "scanners": {
              "trufflehog": {
                "status": "$TRUFFLEHOG_STATUS"
              },
              "gitleaks": {
                "status": "$GITLEAKS_STATUS"
              },
              "env_exposure": {
                "exposed": $ENV_EXPOSED
              }
            },
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}"
          }
          EOF

          echo "=== Secrets Scan Summary ==="
          cat $REPORT_PATH
          echo "============================"

          echo "secrets-found=$SECRETS_FOUND" >> $GITHUB_OUTPUT
          echo "report-path=$REPORT_PATH" >> $GITHUB_OUTPUT

          # Generate step summary
          echo "## Secrets Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | $TRUFFLEHOG_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | $GITLEAKS_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Env Exposure | $([ "$ENV_EXPOSED" = "true" ] && echo "EXPOSED" || echo "Clean") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$SECRETS_FOUND" = "true" ]; then
            echo "::warning::Potential secrets detected in repository"
          fi

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-scan-report-${{ github.run_id }}
          path: |
            secrets-scan-report.json
            detect-secrets-report.json
            exposed-files.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail on detection
        if: inputs.fail-on-detection && steps.summary.outputs.secrets-found == 'true'
        run: |
          echo "::error::Secrets detected in repository. Review the scan report."
          exit 1
