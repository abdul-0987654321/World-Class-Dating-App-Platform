# =============================================================================
# REUSABLE WORKFLOW: Deploy to Kubernetes (AKS)
# =============================================================================
# Helm deployment with progressive delivery, backup, and rollback
# =============================================================================

name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev, staging, prod)'
        required: true
        type: string
      image-tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      deployment-strategy:
        description: 'Deployment strategy (rolling, canary, blue-green)'
        required: false
        type: string
        default: 'rolling'
      create-backup:
        description: 'Create backup before deployment'
        required: false
        type: boolean
        default: true
      run-smoke-tests:
        description: 'Run smoke tests after deployment'
        required: false
        type: boolean
        default: true
      helm-chart-path:
        description: 'Path to Helm chart'
        required: false
        type: string
        default: 'infrastructure/helm/flamoral'
    outputs:
      deployed:
        description: 'Whether deployment succeeded'
        value: ${{ jobs.deploy.outputs.deployed }}
      rollback-available:
        description: 'Whether rollback is available'
        value: ${{ jobs.deploy.outputs.rollback-available }}
    secrets:
      AZURE_CREDENTIALS:
        required: true

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight validation
        id: check
        run: |
          echo "=== Preflight Checks ==="

          ERRORS=()

          # Check Helm chart exists
          if [ ! -f "${{ inputs.helm-chart-path }}/Chart.yaml" ]; then
            ERRORS+=("Helm chart not found at ${{ inputs.helm-chart-path }}")
          fi

          # Check values file exists
          VALUES_FILE="${{ inputs.helm-chart-path }}/values-${{ inputs.environment }}.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            # Try alternate locations
            ALT_VALUES="${{ inputs.helm-chart-path }}/values.yaml"
            if [ -f "$ALT_VALUES" ]; then
              echo "Using default values.yaml"
            else
              ERRORS+=("Values file not found")
            fi
          fi

          if [ ${#ERRORS[@]} -gt 0 ]; then
            echo "::error::Preflight failed: ${ERRORS[*]}"
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "All preflight checks passed"
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

  backup:
    name: Create Backup
    runs-on: ubuntu-latest
    needs: preflight
    if: inputs.create-backup && needs.preflight.outputs.proceed == 'true'

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          # Environment-specific cluster names
          case "${{ inputs.environment }}" in
            dev)
              RG="flamoral-dev-rg"
              CLUSTER="flamoral-dev-aks"
              ;;
            staging)
              RG="flamoral-staging-rg"
              CLUSTER="flamoral-staging-aks"
              ;;
            prod|production)
              RG="flamoral-prod-rg"
              CLUSTER="flamoral-prod-aks"
              ;;
          esac

          az aks get-credentials --resource-group $RG --name $CLUSTER --overwrite-existing || true

      - name: Backup current state
        run: |
          NAMESPACE="flamoral-${{ inputs.environment }}"

          echo "Backing up namespace: $NAMESPACE"

          kubectl get deployments -n $NAMESPACE -o yaml > deployments-backup.yaml 2>/dev/null || echo "No deployments"
          kubectl get configmaps -n $NAMESPACE -o yaml > configmaps-backup.yaml 2>/dev/null || echo "No configmaps"
          kubectl get services -n $NAMESPACE -o yaml > services-backup.yaml 2>/dev/null || echo "No services"

          # Get current image versions
          kubectl get deployments -n $NAMESPACE \
            -o jsonpath='{range .items[*]}{.metadata.name}: {.spec.template.spec.containers[0].image}{"\n"}{end}' \
            > current-versions.txt 2>/dev/null || echo "No versions"

          echo "Backup created"

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: deployment-backup-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            deployments-backup.yaml
            configmaps-backup.yaml
            services-backup.yaml
            current-versions.txt
          retention-days: 90

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [preflight, backup]
    if: always() && needs.preflight.outputs.proceed == 'true'
    outputs:
      deployed: ${{ steps.deploy.outputs.success }}
      rollback-available: ${{ steps.deploy.outputs.rollback-available }}
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          case "${{ inputs.environment }}" in
            dev)
              RG="flamoral-dev-rg"
              CLUSTER="flamoral-dev-aks"
              ACR="flamoraldevacr"
              ;;
            staging)
              RG="flamoral-staging-rg"
              CLUSTER="flamoral-staging-aks"
              ACR="flamoralstagingacr"
              ;;
            prod|production)
              RG="flamoral-prod-rg"
              CLUSTER="flamoral-prod-aks"
              ACR="flamoralprodacr"
              ;;
          esac

          az aks get-credentials --resource-group $RG --name $CLUSTER --overwrite-existing
          echo "acr=$ACR" >> $GITHUB_ENV

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Create namespace
        run: |
          NAMESPACE="flamoral-${{ inputs.environment }}"
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        id: deploy
        run: |
          NAMESPACE="flamoral-${{ inputs.environment }}"
          RELEASE="flamoral-${{ inputs.environment }}"
          CHART="${{ inputs.helm-chart-path }}"

          # Determine values file
          if [ -f "$CHART/values-${{ inputs.environment }}.yaml" ]; then
            VALUES="--values $CHART/values-${{ inputs.environment }}.yaml"
          else
            VALUES=""
          fi

          echo "Deploying with ${{ inputs.deployment-strategy }} strategy..."

          case "${{ inputs.deployment-strategy }}" in
            rolling)
              helm upgrade --install $RELEASE $CHART \
                --namespace $NAMESPACE \
                $VALUES \
                --set global.image.tag=${{ inputs.image-tag }} \
                --set global.image.registry=${{ env.acr }}.azurecr.io \
                --set global.environment=${{ inputs.environment }} \
                --wait \
                --timeout 15m
              ;;
            canary)
              # Deploy canary at 10%
              helm upgrade --install ${RELEASE}-canary $CHART \
                --namespace $NAMESPACE \
                $VALUES \
                --set global.image.tag=${{ inputs.image-tag }} \
                --set global.canary.enabled=true \
                --set global.canary.weight=10 \
                --wait \
                --timeout 10m
              ;;
            blue-green)
              # Deploy to inactive slot
              CURRENT_SLOT=$(kubectl get configmap deployment-slot -n $NAMESPACE -o jsonpath='{.data.active}' 2>/dev/null || echo "blue")
              DEPLOY_SLOT=$([ "$CURRENT_SLOT" = "blue" ] && echo "green" || echo "blue")

              helm upgrade --install ${RELEASE}-${DEPLOY_SLOT} $CHART \
                --namespace $NAMESPACE \
                $VALUES \
                --set global.image.tag=${{ inputs.image-tag }} \
                --set global.slot=$DEPLOY_SLOT \
                --wait \
                --timeout 15m
              ;;
          esac

          if [ $? -eq 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "rollback-available=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "rollback-available=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify deployment
        run: |
          NAMESPACE="flamoral-${{ inputs.environment }}"

          echo "=== Deployment Status ==="
          kubectl rollout status deployment --all -n $NAMESPACE --timeout=5m || true
          kubectl get pods -n $NAMESPACE
          kubectl get services -n $NAMESPACE

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: inputs.run-smoke-tests && needs.deploy.outputs.deployed == 'true'

    steps:
      - name: Run smoke tests
        run: |
          case "${{ inputs.environment }}" in
            dev)
              API_URL="https://dev-api.flamoral.com"
              ;;
            staging)
              API_URL="https://staging-api.flamoral.com"
              ;;
            prod|production)
              API_URL="https://api.flamoral.com"
              ;;
          esac

          echo "Running smoke tests against: $API_URL"

          # Health check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Health check: PASS"
          else
            echo "Health check: WARN (HTTP $HTTP_CODE)"
          fi

      - name: Generate deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ inputs.image-tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Strategy | ${{ inputs.deployment-strategy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed | ${{ needs.deploy.outputs.deployed }} |" >> $GITHUB_STEP_SUMMARY
