# =============================================================================
# REUSABLE WORKFLOW: Terraform Drift Detection
# =============================================================================
# Detect and classify infrastructure drift for dev/staging/prod
# =============================================================================

name: Reusable Drift Detection

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev, staging, prod)'
        required: true
        type: string
      terraform-path:
        description: 'Path to Terraform configuration'
        required: false
        type: string
        default: 'infrastructure/terraform/environments'
      auto-fix:
        description: 'Attempt auto-fix for safe drift'
        required: false
        type: boolean
        default: false
      require-approval:
        description: 'Require approval for destructive changes'
        required: false
        type: boolean
        default: true
    outputs:
      drift-detected:
        description: 'Whether drift was detected'
        value: ${{ jobs.drift-detect.outputs.drift-detected }}
      drift-classification:
        description: 'Classification of drift (SAFE_AUTO_FIX, REQUIRES_APPROVAL, BLOCK_AND_ESCALATE)'
        value: ${{ jobs.drift-detect.outputs.classification }}
      changes-count:
        description: 'Number of resource changes'
        value: ${{ jobs.drift-detect.outputs.changes }}
    secrets:
      AZURE_CREDENTIALS:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  drift-detect:
    name: Detect Drift - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      drift-detected: ${{ steps.plan.outputs.drift }}
      classification: ${{ steps.classify.outputs.classification }}
      changes: ${{ steps.plan.outputs.changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Determine Terraform path
        id: path
        run: |
          # Map environment to actual directory name
          case "${{ inputs.environment }}" in
            dev|development)
              TF_PATH="${{ inputs.terraform-path }}/dev"
              ;;
            staging)
              TF_PATH="${{ inputs.terraform-path }}/staging"
              ;;
            prod|production)
              TF_PATH="${{ inputs.terraform-path }}/prod"
              ;;
            *)
              TF_PATH="${{ inputs.terraform-path }}/${{ inputs.environment }}"
              ;;
          esac

          if [ -d "$TF_PATH" ]; then
            echo "path=$TF_PATH" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Terraform path: $TF_PATH"
          else
            echo "::error::Terraform path not found: $TF_PATH"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        if: steps.path.outputs.exists == 'true'
        working-directory: ${{ steps.path.outputs.path }}
        run: |
          terraform init -input=false
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Plan (Drift Detection)
        id: plan
        if: steps.path.outputs.exists == 'true'
        working-directory: ${{ steps.path.outputs.path }}
        run: |
          # Run plan and capture output
          terraform plan -detailed-exitcode -no-color -out=tfplan 2>&1 | tee plan-output.txt || EXIT_CODE=$?

          # Exit codes: 0 = no changes, 1 = error, 2 = changes present
          if [ "${EXIT_CODE:-0}" -eq 0 ]; then
            echo "drift=false" >> $GITHUB_OUTPUT
            echo "changes=0" >> $GITHUB_OUTPUT
            echo "No drift detected"
          elif [ "${EXIT_CODE:-0}" -eq 2 ]; then
            echo "drift=true" >> $GITHUB_OUTPUT
            # Count changes
            ADD=$(grep -c "will be created" plan-output.txt || echo "0")
            CHANGE=$(grep -c "will be updated" plan-output.txt || echo "0")
            DESTROY=$(grep -c "will be destroyed" plan-output.txt || echo "0")
            TOTAL=$((ADD + CHANGE + DESTROY))
            echo "changes=$TOTAL" >> $GITHUB_OUTPUT
            echo "add=$ADD" >> $GITHUB_OUTPUT
            echo "change=$CHANGE" >> $GITHUB_OUTPUT
            echo "destroy=$DESTROY" >> $GITHUB_OUTPUT
            echo "Drift detected: $ADD add, $CHANGE change, $DESTROY destroy"
          else
            echo "::error::Terraform plan failed"
            echo "drift=error" >> $GITHUB_OUTPUT
            echo "changes=0" >> $GITHUB_OUTPUT
          fi
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      - name: Classify Drift
        id: classify
        if: steps.plan.outputs.drift == 'true'
        run: |
          DESTROY="${{ steps.plan.outputs.destroy || 0 }}"
          ENV="${{ inputs.environment }}"

          # Classification logic
          if [ "$DESTROY" -gt 0 ]; then
            if [ "$ENV" = "prod" ] || [ "$ENV" = "production" ]; then
              echo "classification=BLOCK_AND_ESCALATE" >> $GITHUB_OUTPUT
              echo "::error::BLOCK_AND_ESCALATE: Destructive changes in production"
            else
              echo "classification=REQUIRES_APPROVAL" >> $GITHUB_OUTPUT
              echo "::warning::REQUIRES_APPROVAL: Destructive changes detected"
            fi
          elif [ "$ENV" = "prod" ] || [ "$ENV" = "production" ]; then
            echo "classification=REQUIRES_APPROVAL" >> $GITHUB_OUTPUT
            echo "Production changes require approval"
          else
            echo "classification=SAFE_AUTO_FIX" >> $GITHUB_OUTPUT
            echo "Changes can be auto-fixed"
          fi

      - name: Auto-fix (if enabled and safe)
        if: |
          inputs.auto-fix &&
          steps.plan.outputs.drift == 'true' &&
          steps.classify.outputs.classification == 'SAFE_AUTO_FIX'
        working-directory: ${{ steps.path.outputs.path }}
        run: |
          echo "Applying safe auto-fix..."
          terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Drift Report
        if: always()
        run: |
          REPORT_PATH="drift-report-${{ inputs.environment }}.json"

          cat > $REPORT_PATH <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "environment": "${{ inputs.environment }}",
            "terraform_path": "${{ steps.path.outputs.path }}",
            "drift_detected": ${{ steps.plan.outputs.drift == 'true' }},
            "classification": "${{ steps.classify.outputs.classification || 'NO_DRIFT' }}",
            "changes": {
              "total": ${{ steps.plan.outputs.changes || 0 }},
              "add": ${{ steps.plan.outputs.add || 0 }},
              "change": ${{ steps.plan.outputs.change || 0 }},
              "destroy": ${{ steps.plan.outputs.destroy || 0 }}
            },
            "auto_fix_enabled": ${{ inputs.auto-fix }},
            "sha": "${{ github.sha }}"
          }
          EOF

          # Generate step summary
          echo "## Drift Report: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Drift Detected | ${{ steps.plan.outputs.drift }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Classification | ${{ steps.classify.outputs.classification || 'NO_DRIFT' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Changes | ${{ steps.plan.outputs.changes || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Add | ${{ steps.plan.outputs.add || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Change | ${{ steps.plan.outputs.change || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Destroy | ${{ steps.plan.outputs.destroy || 0 }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            drift-report-${{ inputs.environment }}.json
            ${{ steps.path.outputs.path }}/plan-output.txt
          retention-days: 30
          if-no-files-found: ignore
