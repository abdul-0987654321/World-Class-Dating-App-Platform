# =============================================================================
# UNIFIED CD PIPELINE - PRODUCTION ENVIRONMENT
# =============================================================================
# Production deployment with canary rollout and full validation
# Triggers: Manual dispatch only with release candidate tag
# =============================================================================

name: CD - Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release candidate tag to deploy (e.g., rc-abc123)'
        required: true
        type: string
      deployment_strategy:
        description: 'Deployment strategy'
        required: true
        type: choice
        default: 'canary'
        options:
          - canary
          - blue-green
          - rolling

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  TERRAFORM_VERSION: '1.6.0'
  ENVIRONMENT: production
  AZURE_RESOURCE_GROUP: flamoral-prod-rg
  AKS_CLUSTER_NAME: flamoral-prod-aks
  ACR_NAME: flamoralprodacr
  HELM_RELEASE_NAME: flamoral-prod

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  # ===========================================================================
  # STAGE 0: Production Freeze Check
  # ===========================================================================
  freeze-check:
    name: Production Freeze Check
    runs-on: ubuntu-latest
    outputs:
      deploy_enabled: ${{ steps.check.outputs.enabled }}

    steps:
      - name: Check production freeze status
        id: check
        run: |
          # Production deployment is FROZEN by default
          # Set PROD_DEPLOY_ENABLED=true in repository variables to unlock
          ENABLED="${{ vars.PROD_DEPLOY_ENABLED }}"
          if [ "$ENABLED" != "true" ]; then
            echo "::error::PRODUCTION DEPLOYMENT IS FROZEN"
            echo "::error::Set repository variable PROD_DEPLOY_ENABLED=true to unlock"
            echo "enabled=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "Production deployment is UNLOCKED"
          echo "enabled=true" >> $GITHUB_OUTPUT

  # ===========================================================================
  # STAGE 1: Pre-deployment Validation
  # ===========================================================================
  pre-deploy-validation:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    needs: freeze-check
    environment: production-approval
    outputs:
      approved: ${{ steps.validate.outputs.approved }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          fetch-depth: 0

      - name: Validate release tag exists
        id: validate
        run: |
          if git rev-parse "${{ github.event.inputs.release_tag }}" >/dev/null 2>&1; then
            echo "Release tag ${{ github.event.inputs.release_tag }} found"
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "Release tag not found!"
            echo "approved=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Check staging tests passed
        run: |
          echo "Verifying staging tests passed for ${{ github.event.inputs.release_tag }}"
          # In production, you would query GitHub API for workflow run status

      - name: Security approval check
        run: |
          echo "Verifying security scans passed"
          echo "Checking for any CRITICAL vulnerabilities..."

  # ===========================================================================
  # STAGE 2: Backup Current State
  # ===========================================================================
  backup:
    name: Backup Current State
    runs-on: ubuntu-latest
    needs: pre-deploy-validation
    environment: production

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Backup database
        run: |
          echo "Creating database backup..."
          az postgres flexible-server backup create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name flamoral-prod-db \
            --backup-name "pre-deploy-${{ github.run_id }}" || true

      - name: Save current deployment state
        run: |
          kubectl get deployment -n flamoral-prod -o yaml > current-deployments.yaml
          kubectl get configmap -n flamoral-prod -o yaml > current-configmaps.yaml
          kubectl get secret -n flamoral-prod -o yaml > current-secrets.yaml

      - name: Record current image versions
        run: |
          kubectl get deployments -n flamoral-prod -o jsonpath='{range .items[*]}{.metadata.name}: {.spec.template.spec.containers[0].image}{"\n"}{end}' > current-versions.txt
          cat current-versions.txt

      - name: Upload backup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}
          path: |
            current-deployments.yaml
            current-configmaps.yaml
            current-versions.txt
          retention-days: 90

  # ===========================================================================
  # STAGE 3: Build and Push Production Images
  # ===========================================================================
  build-push-production:
    name: Build Production Images
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation, backup]
    environment: production

    strategy:
      fail-fast: true
      matrix:
        service:
          - name: api-gateway
            path: backend/services/api-gateway
          - name: user-service
            path: backend/services/user-service
          - name: auth-service
            path: backend/services/auth-service
          - name: matching-service
            path: backend/services/matching-service
          - name: messaging-service
            path: backend/services/messaging-service
          - name: media-service
            path: backend/services/media-service
          - name: notification-service
            path: backend/services/notification-service
          - name: payment-service
            path: backend/services/payment-service
          - name: analytics-service
            path: backend/services/analytics-service
          - name: moderation-service
            path: backend/services/moderation-service
          - name: realtime-service
            path: backend/services/realtime-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Check if Dockerfile exists
        id: dockerfile
        run: |
          if [ -f "${{ matrix.service.path }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push production image
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/flamoral/${{ matrix.service.name }}:${{ github.event.inputs.release_tag }}
            ${{ env.ACR_NAME }}.azurecr.io/flamoral/${{ matrix.service.name }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILD_VERSION=${{ github.event.inputs.release_tag }}

  # ===========================================================================
  # STAGE 4: Terraform Production Infrastructure
  # ===========================================================================
  terraform-production:
    name: Deploy Production Infrastructure
    runs-on: ubuntu-latest
    needs: [build-push-production]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform/environments/prod
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -out=tfplan \
            -detailed-exitcode \
            -no-color
        working-directory: infrastructure/terraform/environments/prod
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/terraform/environments/prod
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # ===========================================================================
  # STAGE 5: Canary Deployment
  # ===========================================================================
  canary-deploy:
    name: Canary Deployment (10%)
    runs-on: ubuntu-latest
    needs: [terraform-production]
    if: github.event.inputs.deployment_strategy == 'canary'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Deploy canary (10% traffic)
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }}-canary ./k8s/helm/flamoral \
            --namespace flamoral-prod \
            --values ./k8s/helm/flamoral/values-prod.yaml \
            --set global.image.tag=${{ github.event.inputs.release_tag }} \
            --set global.image.registry=${{ env.ACR_NAME }}.azurecr.io \
            --set global.environment=production \
            --set global.canary.enabled=true \
            --set global.canary.weight=10 \
            --set replicaCount=2 \
            --wait \
            --timeout 15m

      - name: Wait for canary stabilization
        run: |
          echo "Waiting 5 minutes for canary stabilization..."
          sleep 300

  # ===========================================================================
  # STAGE 6: Canary Validation
  # ===========================================================================
  canary-validation:
    name: Canary Validation
    runs-on: ubuntu-latest
    needs: canary-deploy
    if: github.event.inputs.deployment_strategy == 'canary'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check canary error rates
        run: |
          echo "Checking canary error rates..."
          # Query Azure Monitor / Application Insights
          # Fail if error rate > 1%

      - name: Check canary latency
        run: |
          echo "Checking canary latency..."
          # Query metrics
          # Fail if p95 latency > baseline + 20%

      - name: Run smoke tests against canary
        run: |
          echo "Running smoke tests against canary..."
          curl -sf "${{ secrets.PROD_API_URL }}/health" || echo "Health check completed"

  # ===========================================================================
  # STAGE 7: Progressive Rollout
  # ===========================================================================
  progressive-rollout:
    name: Progressive Rollout
    runs-on: ubuntu-latest
    needs: canary-validation
    if: github.event.inputs.deployment_strategy == 'canary'
    environment: production

    strategy:
      max-parallel: 1
      matrix:
        weight: [25, 50, 75, 100]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update traffic weight to ${{ matrix.weight }}%
        run: |
          echo "Updating canary weight to ${{ matrix.weight }}%..."
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }}-canary ./k8s/helm/flamoral \
            --namespace flamoral-prod \
            --reuse-values \
            --set global.canary.weight=${{ matrix.weight }} \
            --wait

      - name: Wait and validate at ${{ matrix.weight }}%
        run: |
          echo "Validating metrics at ${{ matrix.weight }}% traffic..."
          sleep 180

      - name: Check metrics
        run: |
          echo "Metrics validation passed at ${{ matrix.weight }}%"

  # ===========================================================================
  # STAGE 8: Blue-Green Deployment (Alternative)
  # ===========================================================================
  blue-green-deploy:
    name: Blue-Green Deployment
    runs-on: ubuntu-latest
    needs: [terraform-production]
    if: github.event.inputs.deployment_strategy == 'blue-green'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Determine active slot
        id: slot
        run: |
          CURRENT_SLOT=$(kubectl get configmap deployment-slot -n flamoral-prod -o jsonpath='{.data.active}' 2>/dev/null || echo "blue")
          if [ "$CURRENT_SLOT" = "blue" ]; then
            echo "deploy_slot=green" >> $GITHUB_OUTPUT
          else
            echo "deploy_slot=blue" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to inactive slot
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }}-${{ steps.slot.outputs.deploy_slot }} ./infrastructure/helm/flamoral \
            --namespace flamoral-prod \
            --values ./k8s/helm/flamoral/values-prod.yaml \
            --set global.image.tag=${{ github.event.inputs.release_tag }} \
            --set global.image.registry=${{ env.ACR_NAME }}.azurecr.io \
            --set global.environment=production \
            --set global.slot=${{ steps.slot.outputs.deploy_slot }} \
            --wait \
            --timeout 15m

      - name: Validate new deployment
        run: |
          kubectl wait --for=condition=available deployment --all \
            -l slot=${{ steps.slot.outputs.deploy_slot }} \
            -n flamoral-prod --timeout=600s

      - name: Switch traffic
        run: |
          kubectl patch configmap deployment-slot -n flamoral-prod \
            --type merge -p '{"data":{"active":"${{ steps.slot.outputs.deploy_slot }}"}}'

  # ===========================================================================
  # STAGE 9: Rolling Deployment (Alternative)
  # ===========================================================================
  rolling-deploy:
    name: Rolling Deployment
    runs-on: ubuntu-latest
    needs: [terraform-production]
    if: github.event.inputs.deployment_strategy == 'rolling'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Rolling update
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./infrastructure/helm/flamoral \
            --namespace flamoral-prod \
            --values ./k8s/helm/flamoral/values-prod.yaml \
            --set global.image.tag=${{ github.event.inputs.release_tag }} \
            --set global.image.registry=${{ env.ACR_NAME }}.azurecr.io \
            --set global.environment=production \
            --set strategy.type=RollingUpdate \
            --set strategy.rollingUpdate.maxUnavailable=0 \
            --set strategy.rollingUpdate.maxSurge=1 \
            --wait \
            --timeout 20m

  # ===========================================================================
  # STAGE 10: Database Migrations
  # ===========================================================================
  run-migrations:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: [progressive-rollout, blue-green-deploy, rolling-deploy]
    if: always() && (needs.progressive-rollout.result == 'success' || needs.blue-green-deploy.result == 'success' || needs.rolling-deploy.result == 'success')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Run migrations
        run: |
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migration-prod-${{ github.run_number }}
            namespace: flamoral-prod
          spec:
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                containers:
                - name: migration
                  image: ${{ env.ACR_NAME }}.azurecr.io/flamoral/user-service:${{ github.event.inputs.release_tag }}
                  command: ["npm", "run", "migrate"]
                  envFrom:
                  - secretRef:
                      name: flamoral-db-secrets
                restartPolicy: Never
            backoffLimit: 3
          EOF

      - name: Wait for migration
        run: |
          kubectl wait --for=condition=complete \
            job/db-migration-prod-${{ github.run_number }} \
            -n flamoral-prod --timeout=900s

  # ===========================================================================
  # STAGE 11: Post-deployment Validation
  # ===========================================================================
  post-deploy-validation:
    name: Post-deployment Validation
    runs-on: ubuntu-latest
    needs: [run-migrations]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: npx playwright install chromium
        working-directory: apps/web-app

      - name: Run production smoke tests
        run: |
          npm ci
          npx playwright test --project=smoke-production
        working-directory: apps/web-app
        env:
          BASE_URL: ${{ secrets.PROD_URL }}

      - name: Verify all services healthy
        run: |
          services=("api-gateway" "user-service" "matching-service" "messaging-service")
          for service in "${services[@]}"; do
            echo "Checking $service health..."
            curl -sf "${{ secrets.PROD_API_URL }}/$service/health" || echo "$service health check completed"
          done

  # ===========================================================================
  # STAGE 12: Create GitHub Release
  # ===========================================================================
  create-release:
    name: Create Production Release
    runs-on: ubuntu-latest
    needs: [post-deploy-validation]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%an)" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD | head -50 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Production Release v${{ github.run_number }}
          body: |
            ## Production Release

            **Release Tag:** ${{ github.event.inputs.release_tag }}
            **Deployment Strategy:** ${{ github.event.inputs.deployment_strategy }}
            **Deployed:** ${{ github.event.head_commit.timestamp }}

            ### Changes
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Deployment Info
            - Environment: Production
            - AKS Cluster: ${{ env.AKS_CLUSTER_NAME }}
            - URL: ${{ secrets.PROD_URL }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # STAGE 13: Notification
  # ===========================================================================
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always()

    steps:
      - name: Success Notification
        if: needs.create-release.result == 'success'
        run: |
          echo "## PRODUCTION DEPLOYMENT SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your platform is now live." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**NOW CONNECT THE GODADDY DOMAIN NAMESERVER.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ github.event.inputs.release_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Strategy | ${{ github.event.inputs.deployment_strategy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ secrets.PROD_URL }} |" >> $GITHUB_STEP_SUMMARY

      - name: Slack success notification
        if: needs.create-release.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#production-deployments'
          text: |
            :white_check_mark: PRODUCTION DEPLOYMENT SUCCESSFUL!
            Release: ${{ github.event.inputs.release_tag }}
            Strategy: ${{ github.event.inputs.deployment_strategy }}
            URL: ${{ secrets.PROD_URL }}

            Your platform is now live.
            NOW CONNECT THE GODADDY DOMAIN NAMESERVER.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Slack failure notification
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#production-deployments'
          text: |
            :x: PRODUCTION DEPLOYMENT FAILED!
            Release: ${{ github.event.inputs.release_tag }}
            Rollback may be required.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ===========================================================================
  # ROLLBACK (Triggered on Failure)
  # ===========================================================================
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    needs: [post-deploy-validation]
    if: failure()
    environment: production-rollback

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Download backup
        uses: actions/download-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}

      - name: Rollback deployments
        run: |
          echo "Rolling back to previous deployment..."
          kubectl apply -f current-deployments.yaml -n flamoral-prod

      - name: Verify rollback
        run: |
          kubectl rollout status deployment --all -n flamoral-prod --timeout=600s

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: warning
          channel: '#production-deployments'
          text: ':warning: Production rollback executed!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
