# =============================================================================
# UNIFIED SECURITY PIPELINE
# =============================================================================
# Comprehensive security scanning using standardized foundation
# Includes: Secrets, SAST, DAST (ZAP), Compliance, Container Scanning
# =============================================================================

name: Unified Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'  # Daily at 4 AM UTC
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run full scan including DAST'
        type: boolean
        default: false
      environment:
        description: 'Target environment for DAST'
        type: choice
        default: 'staging'
        options:
          - dev
          - staging

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

jobs:
  # ===========================================================================
  # STAGE 1: Bootstrap and Validation
  # ===========================================================================
  bootstrap:
    name: Bootstrap & Validate
    runs-on: ubuntu-latest
    outputs:
      secrets-valid: ${{ steps.secrets.outputs.valid }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets exist
        id: secrets
        run: |
          MISSING=()

          # Check required secrets
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            # GITHUB_TOKEN is always available
            echo "GITHUB_TOKEN available"
          fi

          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "::warning::SNYK_TOKEN not configured - Snyk scan will be skipped"
          fi

          if [ -z "${{ secrets.STAGING_URL }}" ]; then
            echo "::warning::STAGING_URL not configured - ZAP scan will be skipped"
          fi

          echo "valid=true" >> $GITHUB_OUTPUT

      - name: Generate bootstrap report
        run: |
          cat > bootstrap-report.json <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref }}",
            "sha": "${{ github.sha }}",
            "actor": "${{ github.actor }}"
          }
          EOF

      - name: Upload bootstrap report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-report
          path: bootstrap-report.json
          retention-days: 7

  # ===========================================================================
  # STAGE 2: Secret Detection
  # ===========================================================================
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    needs: bootstrap

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Check for exposed env files
        id: env_check
        run: |
          echo "Checking for exposed environment files..."
          EXPOSED=()

          for pattern in ".env" ".env.local" ".env.production" "*.pem" "*.key" "credentials.json"; do
            files=$(find . -name "$pattern" -type f ! -path "*/node_modules/*" ! -path "*/.git/*" 2>/dev/null || true)
            if [ -n "$files" ]; then
              echo "::warning::Found potentially sensitive files matching: $pattern"
              while IFS= read -r file; do
                EXPOSED+=("$file")
              done <<< "$files"
            fi
          done

          if [ ${#EXPOSED[@]} -gt 0 ]; then
            echo "exposed=true" >> $GITHUB_OUTPUT
          else
            echo "exposed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate secret scan report
        if: always()
        run: |
          cat > secret-scan-report.json <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "trufflehog": "${{ steps.trufflehog.outcome }}",
            "gitleaks": "${{ steps.gitleaks.outcome }}",
            "env_exposed": "${{ steps.env_check.outputs.exposed }}",
            "sha": "${{ github.sha }}"
          }
          EOF

          echo "## Secret Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | ${{ steps.trufflehog.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ steps.gitleaks.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Env Exposure | ${{ steps.env_check.outputs.exposed }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload secret scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-report
          path: secret-scan-report.json
          retention-days: 30

  # ===========================================================================
  # STAGE 3: SAST (Static Analysis)
  # ===========================================================================
  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: bootstrap

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

      - name: Run Semgrep
        id: semgrep
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/javascript
            p/typescript
            p/react
            p/nodejs
            p/owasp-top-ten
            p/security-audit
          generateSarif: "1"

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Generate SAST report
        if: always()
        run: |
          cat > sast-report.json <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "codeql": "${{ steps.codeql.outcome }}",
            "semgrep": "${{ steps.semgrep.outcome }}",
            "sha": "${{ github.sha }}"
          }
          EOF

          echo "## SAST Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Analyzer | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ steps.codeql.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ${{ steps.semgrep.outcome }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: |
            sast-report.json
            semgrep.sarif
          retention-days: 30

  # ===========================================================================
  # STAGE 4: Dependency Scanning
  # ===========================================================================
  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    needs: bootstrap

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        id: npm_audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high --json > npm-audit.json || true
          VULN_COUNT=$(cat npm-audit.json | jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' 2>/dev/null || echo "0")
          echo "vulnerabilities=$VULN_COUNT" >> $GITHUB_OUTPUT

      - name: Run Trivy filesystem scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-fs.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-filesystem'

      - name: Run Snyk scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-report.json

      - name: Generate dependency report
        if: always()
        run: |
          cat > dependency-report.json <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "npm_audit": "${{ steps.npm_audit.outcome }}",
            "npm_vulnerabilities": "${{ steps.npm_audit.outputs.vulnerabilities }}",
            "trivy": "${{ steps.trivy.outcome }}",
            "sha": "${{ github.sha }}"
          }
          EOF

          echo "## Dependency Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit | ${{ steps.npm_audit.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | ${{ steps.trivy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| High/Critical Vulns | ${{ steps.npm_audit.outputs.vulnerabilities }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: |
            dependency-report.json
            npm-audit.json
            trivy-fs.sarif
            snyk-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 5: Infrastructure Security
  # ===========================================================================
  iac-security:
    name: Infrastructure Security
    runs-on: ubuntu-latest
    needs: bootstrap

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: infrastructure/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov.sarif
          category: 'checkov'

      - name: Run tfsec
        id: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true
        with:
          working_directory: infrastructure/terraform
          soft_fail: true

      - name: Trivy IaC scan
        id: trivy_iac
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'infrastructure/terraform'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-iac.sarif'
        continue-on-error: true

      - name: Upload Trivy IaC results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-iac.sarif'
          category: 'trivy-iac'

      - name: Generate IaC report
        if: always()
        run: |
          cat > iac-report.json <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "checkov": "${{ steps.checkov.outcome }}",
            "tfsec": "${{ steps.tfsec.outcome }}",
            "trivy_iac": "${{ steps.trivy_iac.outcome }}",
            "sha": "${{ github.sha }}"
          }
          EOF

          echo "## IaC Security Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov | ${{ steps.checkov.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| tfsec | ${{ steps.tfsec.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy IaC | ${{ steps.trivy_iac.outcome }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload IaC report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-report
          path: |
            iac-report.json
            checkov.sarif
            trivy-iac.sarif
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 6: Container Scanning
  # ===========================================================================
  container-scan:
    name: Container Security
    runs-on: ubuntu-latest
    needs: bootstrap
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - auth-service
          - matching-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: dockerfile
        run: |
          if [ -f "backend/services/${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::No Dockerfile for ${{ matrix.service }}"
          fi

      - name: Build image
        if: steps.dockerfile.outputs.exists == 'true'
        run: |
          docker build -t scan/${{ matrix.service }}:latest ./backend/services/${{ matrix.service }}

      - name: Scan with Trivy
        if: steps.dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'scan/${{ matrix.service }}:latest'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results
        if: steps.dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'container-${{ matrix.service }}'

      - name: Generate skip report
        if: steps.dockerfile.outputs.exists == 'false'
        run: |
          cat > skip-${{ matrix.service }}.json <<EOF
          {
            "service": "${{ matrix.service }}",
            "reason": "No Dockerfile found",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-scan-${{ matrix.service }}
          path: |
            trivy-${{ matrix.service }}.sarif
            skip-${{ matrix.service }}.json
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 7: OWASP ZAP (DAST)
  # ===========================================================================
  zap-scan:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan]
    if: |
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' && github.event.inputs.full_scan == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure ZAP rules exist
        run: |
          mkdir -p .zap
          if [ ! -f ".zap/rules.tsv" ]; then
            cat > .zap/rules.tsv <<'EOF'
          40018	HIGH
          40012	HIGH
          6	HIGH
          90019	HIGH
          10021	MEDIUM
          EOF
          fi

      - name: ZAP Baseline Scan
        if: env.STAGING_URL != ''
        uses: zaproxy/action-baseline@v0.11.0
        continue-on-error: true
        with:
          target: ${{ secrets.STAGING_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 8: Compliance Check
  # ===========================================================================
  compliance:
    name: Compliance Check
    runs-on: ubuntu-latest
    needs: bootstrap

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP Top 10 Evidence
        id: owasp
        run: |
          SCORE=0
          TOTAL=10

          # A01 - Broken Access Control
          if grep -r "authorize\|authentication\|rbac" backend/src --include="*.ts" -l > /dev/null 2>&1; then
            ((SCORE++))
          fi

          # A02 - Cryptographic Failures
          if grep -r "bcrypt\|argon2\|crypto" backend/src --include="*.ts" -l > /dev/null 2>&1; then
            ((SCORE++))
          fi

          # A03 - Injection
          if grep -r "parameterized\|prepared\|sanitize" backend/src --include="*.ts" -l > /dev/null 2>&1; then
            ((SCORE++))
          fi

          # A05 - Security Misconfiguration
          if grep -r "helmet\|csp\|cors" backend/src --include="*.ts" -l > /dev/null 2>&1; then
            ((SCORE++))
          fi

          # A06 - Vulnerable Components
          if [ -f ".github/dependabot.yml" ]; then
            ((SCORE++))
          fi

          # A07 - Authentication
          if grep -r "jwt\|session\|oauth" backend/src --include="*.ts" -l > /dev/null 2>&1; then
            ((SCORE++))
          fi

          # A08 - Software Integrity
          if [ -f "package-lock.json" ]; then
            ((SCORE++))
          fi

          # A09 - Logging
          if grep -r "winston\|bunyan\|pino\|logger" backend/src --include="*.ts" -l > /dev/null 2>&1; then
            ((SCORE++))
          fi

          # Calculate percentage
          PERCENTAGE=$((SCORE * 100 / TOTAL))
          echo "score=$PERCENTAGE" >> $GITHUB_OUTPUT
          echo "OWASP Top 10 Score: $PERCENTAGE% ($SCORE/$TOTAL)"

      - name: Security Headers Check
        id: headers
        run: |
          if grep -r "helmet()" backend/src --include="*.ts" -l > /dev/null 2>&1; then
            echo "helmet=configured" >> $GITHUB_OUTPUT
          else
            echo "helmet=missing" >> $GITHUB_OUTPUT
          fi

      - name: Generate compliance report
        if: always()
        run: |
          cat > compliance-report.json <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "owasp_score": "${{ steps.owasp.outputs.score }}",
            "helmet_status": "${{ steps.headers.outputs.helmet }}",
            "sha": "${{ github.sha }}"
          }
          EOF

          echo "## Compliance Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP Top 10 | ${{ steps.owasp.outputs.score }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Headers | ${{ steps.headers.outputs.helmet }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-report
          path: compliance-report.json
          retention-days: 90

  # ===========================================================================
  # STAGE 9: Security Summary
  # ===========================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, dependency-scan, iac-security, container-scan, compliance]
    if: always()

    steps:
      - name: Generate comprehensive summary
        run: |
          cat > security-summary.json <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "results": {
              "secret_scan": "${{ needs.secret-scan.result }}",
              "sast": "${{ needs.sast.result }}",
              "dependency_scan": "${{ needs.dependency-scan.result }}",
              "iac_security": "${{ needs.iac-security.result }}",
              "container_scan": "${{ needs.container-scan.result }}",
              "compliance": "${{ needs.compliance.result }}"
            },
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}"
          }
          EOF

          echo "# Security Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | ${{ needs.sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC Security | ${{ needs.iac-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compliance | ${{ needs.compliance.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-summary
          path: security-summary.json
          retention-days: 90

      - name: Notify on failure
        if: |
          needs.secret-scan.result == 'failure' ||
          needs.sast.result == 'failure'
        uses: 8398a7/action-slack@v3
        continue-on-error: true
        with:
          status: failure
          channel: '#security-alerts'
          text: 'Security scan detected issues!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
