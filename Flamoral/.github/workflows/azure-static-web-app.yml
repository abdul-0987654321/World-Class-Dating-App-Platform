name: Deploy FLAMORAL Web App to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web-app/**'
      - '.github/workflows/azure-static-web-app.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'apps/web-app/**'

env:
  NODE_VERSION: '20.x'
  APP_LOCATION: 'apps/web-app'
  OUTPUT_LOCATION: 'dist'
  API_LOCATION: ''

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy to Azure Static Web Apps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'apps/web-app/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.APP_LOCATION }}
        run: npm ci

      - name: Build production app
        working-directory: ${{ env.APP_LOCATION }}
        run: npm run build
        env:
          # Production environment variables
          VITE_API_URL: https://api.flamoral.com/api/v1
          VITE_WS_URL: wss://api.flamoral.com
          VITE_SOCKET_URL: https://api.flamoral.com
          VITE_GRAPHQL_URL: https://api.flamoral.com/graphql
          VITE_APP_NAME: Flamoral
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_APP_ENV: production
          VITE_APP_DOMAIN: https://flamoral.com
          VITE_CDN_URL: https://cdn.flamoral.com
          VITE_MEDIA_CDN_URL: https://media.flamoral.com
          # Feature flags
          VITE_ENABLE_VIDEO_CALLS: true
          VITE_ENABLE_VOICE_CALLS: true
          VITE_ENABLE_EVENTS: true
          VITE_ENABLE_AI_FEATURES: true
          VITE_ENABLE_STORIES: true
          VITE_ENABLE_TRAVEL_MODE: true
          VITE_ENABLE_PREMIUM_SUBSCRIPTIONS: true
          VITE_ENABLE_PHOTO_VERIFICATION: true
          VITE_ENABLE_GAMIFICATION: true
          VITE_ENABLE_AI_COACH: true
          # Debug options (disabled in production)
          VITE_ENABLE_MOCK_API: false
          VITE_ENABLE_DEBUG: false
          VITE_ENABLE_REDUX_DEVTOOLS: false
          VITE_LOG_LEVEL: error
          # Keys from Azure Key Vault (populated by GitHub Secrets)
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_AGORA_APP_ID: ${{ secrets.VITE_AGORA_APP_ID }}
          VITE_TENOR_API_KEY: ${{ secrets.VITE_TENOR_API_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: ${{ env.APP_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}
          skip_app_build: true
          skip_api_build: true

      - name: Purge CDN cache
        if: success()
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az cdn endpoint purge \
              --resource-group flamoral-prod-rg \
              --profile-name flamoral-cdn \
              --name flamoral-frontend \
              --content-paths "/*" \
              --no-wait || echo "CDN purge skipped"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'

  notify_deployment:
    needs: build_and_deploy
    if: success()
    runs-on: ubuntu-latest
    name: Notify Deployment Success
    steps:
      - name: Send deployment notification
        run: |
          echo "FLAMORAL Web App deployed successfully to Azure Static Web Apps"
          echo "URL: https://flamoral.com"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
