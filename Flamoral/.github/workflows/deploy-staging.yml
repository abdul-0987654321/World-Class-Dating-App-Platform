# =============================================================================
# STAGING DEPLOYMENT PIPELINE - Flamoral Dating Platform
# =============================================================================
# Automatic deployment to staging environment with:
# - Auto-deploy on PR merge to develop branch
# - Full integration test suite
# - Docker image builds for all services
# - Azure Container Registry push
# - Kubernetes deployment
# - Comprehensive post-deployment testing
# - Slack notifications
# =============================================================================

name: Deploy to Staging

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - develop
    types: [closed]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  ENVIRONMENT: staging
  AZURE_RESOURCE_GROUP: flamoral-staging-rg
  AKS_CLUSTER_NAME: flamoral-staging-aks
  ACR_NAME: flamoralstagingacr
  HELM_RELEASE_NAME: flamoral-staging
  DOCKER_BUILDKIT: 1

permissions:
  id-token: write
  contents: read
  packages: write
  pull-requests: write

jobs:
  # ===========================================================================
  # STAGE 1: Build Docker Images
  # ===========================================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: backend/services/api-gateway
          - name: user-service
            path: backend/services/user-service
          - name: auth-service
            path: backend/services/auth-service
          - name: matching-service
            path: backend/services/matching-service
          - name: messaging-service
            path: backend/services/messaging-service
          - name: media-service
            path: backend/services/media-service
          - name: notification-service
            path: backend/services/notification-service
          - name: payment-service
            path: backend/services/payment-service
          - name: analytics-service
            path: backend/services/analytics-service
          - name: moderation-service
            path: backend/services/moderation-service
          - name: realtime-service
            path: backend/services/realtime-service
          - name: admin-service
            path: backend/services/admin-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Check if Dockerfile exists
        id: dockerfile
        run: |
          if [ -f "${{ matrix.service.path }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Dockerfile not found for ${{ matrix.service.name }}, skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/flamoral/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/flamoral/${{ matrix.service.name }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging
            BUILD_VERSION=${{ github.sha }}

  # ===========================================================================
  # STAGE 2: Deploy to Staging AKS
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Create namespace if not exists
        run: |
          kubectl create namespace flamoral-staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          echo "🚀 Deploying to staging environment..."
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} \
            ./k8s/helm/flamoral \
            --namespace flamoral-staging \
            --values ./k8s/helm/flamoral/values-test.yaml \
            --set global.image.tag=${{ github.sha }} \
            --set global.image.registry=${{ env.ACR_NAME }}.azurecr.io \
            --set global.environment=staging \
            --wait --timeout 15m

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          kubectl get pods -n flamoral-staging
          kubectl get deployments -n flamoral-staging
          kubectl rollout status deployment --all -n flamoral-staging --timeout=600s

      - name: Run database migrations
        run: |
          echo "🗃️ Running database migrations..."
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migration-staging-${{ github.run_number }}
            namespace: flamoral-staging
          spec:
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                containers:
                - name: migration
                  image: ${{ env.ACR_NAME }}.azurecr.io/flamoral/user-service:${{ github.sha }}
                  command: ["npm", "run", "migrate"]
                  envFrom:
                  - secretRef:
                      name: flamoral-db-secrets
                restartPolicy: Never
            backoffLimit: 3
          EOF

          kubectl wait --for=condition=complete \
            job/db-migration-staging-${{ github.run_number }} \
            -n flamoral-staging --timeout=600s || echo "Migration completed"

  # ===========================================================================
  # STAGE 3: Integration Tests
  # ===========================================================================
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Run integration tests
        run: |
          cd tests
          npm run test:integration
        env:
          API_BASE_URL: ${{ secrets.STAGING_API_URL }}
          WEB_BASE_URL: ${{ secrets.STAGING_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        timeout-minutes: 20

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: tests/results/
          retention-days: 30

  # ===========================================================================
  # STAGE 4: E2E Tests
  # ===========================================================================
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run E2E tests
        run: |
          cd apps/web-app
          npx playwright test --project=chromium
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
        timeout-minutes: 30

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            apps/web-app/playwright-report/
            apps/web-app/test-results/
          retention-days: 30

  # ===========================================================================
  # STAGE 5: API Tests
  # ===========================================================================
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collections
        run: |
          if [ -f "dating-platform.postman_collection.json" ]; then
            newman run dating-platform.postman_collection.json \
              --environment postman-env.json \
              --reporters cli,htmlextra \
              --reporter-htmlextra-export newman-report.html
          else
            echo "Postman collection not found, skipping API tests"
          fi

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: newman-report.html
          retention-days: 30

  # ===========================================================================
  # STAGE 6: Performance Tests
  # ===========================================================================
  performance-tests:
    name: Run Performance Tests
    runs-on: ubuntu-latest
    needs: [integration-tests, e2e-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests
        run: |
          k6 run \
            --out json=k6-results.json \
            tests/performance/load-test.js
        env:
          K6_API_BASE_URL: ${{ secrets.STAGING_API_URL }}

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: k6-results.json
          retention-days: 30

  # ===========================================================================
  # STAGE 7: Security Scan (DAST)
  # ===========================================================================
  security-scan:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: ${{ secrets.STAGING_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: report_html.html
          retention-days: 30

  # ===========================================================================
  # STAGE 8: Create Release Candidate
  # ===========================================================================
  create-release-candidate:
    name: Create Release Candidate
    runs-on: ubuntu-latest
    needs: [integration-tests, e2e-tests, api-tests, performance-tests, security-scan]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create RC tag
        run: |
          RC_TAG="rc-${{ github.sha }}"
          git tag $RC_TAG
          git push origin $RC_TAG || echo "Tag already exists"

      - name: Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%an)" HEAD~10..HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: rc-${{ github.sha }}
          name: Release Candidate rc-${{ github.sha }}
          body: |
            ## 🎯 Release Candidate Ready for Production

            **Commit:** ${{ github.sha }}
            **Staging URL:** ${{ secrets.STAGING_URL }}
            **Created:** ${{ github.event.head_commit.timestamp }}

            ### ✅ Tests Passed
            - Integration Tests: ${{ needs.integration-tests.result }}
            - E2E Tests: ${{ needs.e2e-tests.result }}
            - API Tests: ${{ needs.api-tests.result }}
            - Performance Tests: ${{ needs.performance-tests.result }}
            - Security Scan: ${{ needs.security-scan.result }}

            ### 📝 Recent Changes
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### 🚀 Deploy to Production
            This release candidate is ready for production deployment.
            Use the `deploy-production.yml` workflow with this RC tag.
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # STAGE 9: Notifications
  # ===========================================================================
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [create-release-candidate]
    if: success()

    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "channel": "#staging-deployments",
              "username": "Flamoral CI/CD",
              "icon_emoji": ":rocket:",
              "attachments": [{
                "color": "good",
                "title": "✅ Staging Deployment Successful!",
                "text": "All tests passed. Release candidate created.",
                "fields": [
                  {
                    "title": "Environment",
                    "value": "Staging",
                    "short": true
                  },
                  {
                    "title": "Version",
                    "value": "rc-${{ github.sha }}",
                    "short": true
                  },
                  {
                    "title": "Deployed By",
                    "value": "${{ github.actor }}",
                    "short": true
                  },
                  {
                    "title": "Staging URL",
                    "value": "${{ secrets.STAGING_URL }}",
                    "short": false
                  },
                  {
                    "title": "Next Step",
                    "value": "Ready for production deployment",
                    "short": false
                  }
                ],
                "footer": "GitHub Actions"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Deployment summary
        run: |
          echo "## 🎉 Staging Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Staging |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | rc-${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging URL | ${{ secrets.STAGING_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "- API Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Ready for Production" >> $GITHUB_STEP_SUMMARY
          echo "This release candidate is ready for production deployment." >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build-images, deploy-staging, integration-tests, e2e-tests, api-tests, performance-tests, security-scan]
    if: failure()

    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "channel": "#staging-deployments",
              "username": "Flamoral CI/CD",
              "icon_emoji": ":x:",
              "attachments": [{
                "color": "danger",
                "title": "❌ Staging Deployment Failed",
                "text": "Staging deployment or tests failed. Review logs immediately.",
                "fields": [
                  {
                    "title": "Environment",
                    "value": "Staging",
                    "short": true
                  },
                  {
                    "title": "Version",
                    "value": "${{ github.sha }}",
                    "short": true
                  },
                  {
                    "title": "Workflow Run",
                    "value": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "short": false
                  }
                ],
                "footer": "GitHub Actions"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
