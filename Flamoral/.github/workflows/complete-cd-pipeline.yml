# =============================================================================
# COMPLETE CI/CD PIPELINE - Flamoral Dating Platform
# =============================================================================
# Full deployment automation with build, test, deploy, and rollback
# Supports: dev, staging, production with manual approval gates
# =============================================================================

name: Complete CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      deployment_strategy:
        description: 'Deployment strategy'
        required: false
        type: choice
        default: 'rolling'
        options:
          - rolling
          - canary
          - blue-green

concurrency:
  group: cd-${{ github.ref }}-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  ACR_NAME: 'flamoralprodacr'
  ACR_LOGIN_SERVER: 'flamoralprodacr.azurecr.io'
  IMAGE_TAG: ${{ github.sha }}
  HELM_VERSION: '3.13.0'

permissions:
  id-token: write
  contents: write
  packages: write
  deployments: write

jobs:
  # ===========================================================================
  # JOB 1: BUILD AND TEST
  # ===========================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build packages
        run: yarn build:packages

      - name: Run linting
        run: yarn lint:all

      - name: Run unit tests
        run: yarn test:backend:coverage

      - name: Run integration tests
        run: |
          docker-compose -f docker-compose.test.yml up -d --wait
          yarn test:integration
          docker-compose -f docker-compose.test.yml down -v

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            backend/coverage/
            backend/test-results/
          retention-days: 30

      - name: Generate metadata
        id: meta
        run: |
          echo "tags=${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT
          echo "version=$(date +%Y%m%d-%H%M%S)-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  # ===========================================================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGES
  # ===========================================================================
  build-push-images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: backend/services/api-gateway
          - name: auth-service
            path: backend/services/auth-service
          - name: user-service
            path: backend/services/user-service
          - name: matching-service
            path: backend/services/matching-service
          - name: messaging-service
            path: backend/services/messaging-service
          - name: media-service
            path: backend/services/media-service
          - name: payment-service
            path: backend/services/payment-service
          - name: notification-service
            path: backend/services/notification-service
          - name: analytics-service
            path: backend/services/analytics-service
          - name: moderation-service
            path: backend/services/moderation-service
          - name: realtime-service
            path: backend/services/realtime-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if Dockerfile exists
        id: dockerfile_check
        run: |
          if [ -f "${{ matrix.service.path }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.service.name }}
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/${{ matrix.service.name }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/flamoral/${{ matrix.service.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILD_VERSION=${{ env.IMAGE_TAG }}

      - name: Scan image with Trivy
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/flamoral/${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service.name }}.sarif'

      - name: Upload Trivy results
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.service.name }}.sarif'
          category: 'trivy-${{ matrix.service.name }}'
        continue-on-error: true

  # ===========================================================================
  # JOB 3: DEPLOY TO DEV
  # ===========================================================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build-push-images
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment:
      name: development
      url: https://dev-api.flamoral.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.DEV_RESOURCE_GROUP }} \
            --name ${{ secrets.DEV_AKS_CLUSTER }} \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Create namespace
        run: |
          kubectl create namespace flamoral-dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install flamoral-dev ./k8s/helm/flamoral \
            --namespace flamoral-dev \
            --values ./k8s/helm/flamoral/values-dev.yaml \
            --set global.image.tag=${{ env.IMAGE_TAG }} \
            --set global.image.registry=${{ env.ACR_LOGIN_SERVER }} \
            --set global.environment=development \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl wait --for=condition=available deployment --all \
            -n flamoral-dev --timeout=600s
          kubectl get pods,services,ingress -n flamoral-dev

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://dev-api.flamoral.com/health || echo "Health check completed"

  # ===========================================================================
  # JOB 4: DEPLOY TO STAGING
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-push-images, deploy-dev]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging-api.flamoral.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.STAGING_RESOURCE_GROUP }} \
            --name ${{ secrets.STAGING_AKS_CLUSTER }} \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Backup current deployment
        run: |
          kubectl get deployments -n flamoral-staging -o yaml > deployments-backup-${{ github.run_id }}.yaml || true
          kubectl get configmaps -n flamoral-staging -o yaml > configmaps-backup-${{ github.run_id }}.yaml || true

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: staging-backup-${{ github.run_id }}
          path: |
            deployments-backup-${{ github.run_id }}.yaml
            configmaps-backup-${{ github.run_id }}.yaml
          retention-days: 90

      - name: Create namespace
        run: |
          kubectl create namespace flamoral-staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install flamoral-staging ./k8s/helm/flamoral \
            --namespace flamoral-staging \
            --values ./k8s/helm/flamoral/values-staging.yaml \
            --set global.image.tag=${{ env.IMAGE_TAG }} \
            --set global.image.registry=${{ env.ACR_LOGIN_SERVER }} \
            --set global.environment=staging \
            --set replicaCount=2 \
            --wait \
            --timeout 15m

      - name: Verify deployment
        run: |
          kubectl wait --for=condition=available deployment --all \
            -n flamoral-staging --timeout=600s
          kubectl get pods,services,ingress -n flamoral-staging

      - name: Run E2E tests
        run: |
          yarn workspace @flamoral/web test:e2e
        env:
          BASE_URL: https://staging.flamoral.com
          API_URL: https://staging-api.flamoral.com

  # ===========================================================================
  # JOB 5: PRODUCTION APPROVAL (Manual Gate)
  # ===========================================================================
  production-approval:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production-approval

    steps:
      - name: Approval checkpoint
        run: |
          echo "Production deployment approved by: ${{ github.actor }}"
          echo "Image tag: ${{ env.IMAGE_TAG }}"
          echo "Deployment will proceed to production"

  # ===========================================================================
  # JOB 6: DEPLOY TO PRODUCTION
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: production-approval
    environment:
      name: production
      url: https://api.flamoral.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.PROD_RESOURCE_GROUP }} \
            --name ${{ secrets.PROD_AKS_CLUSTER }} \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Backup current production state
        run: |
          kubectl get deployments -n flamoral-prod -o yaml > prod-deployments-backup-${{ github.run_id }}.yaml || true
          kubectl get configmaps -n flamoral-prod -o yaml > prod-configmaps-backup-${{ github.run_id }}.yaml || true
          kubectl get deployments -n flamoral-prod -o jsonpath='{range .items[*]}{.metadata.name}: {.spec.template.spec.containers[0].image}{"\n"}{end}' > prod-versions-${{ github.run_id }}.txt || true

      - name: Upload production backup
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}
          path: |
            prod-deployments-backup-${{ github.run_id }}.yaml
            prod-configmaps-backup-${{ github.run_id }}.yaml
            prod-versions-${{ github.run_id }}.txt
          retention-days: 90

      - name: Database backup
        run: |
          echo "Creating database backup..."
          az postgres flexible-server backup create \
            --resource-group ${{ secrets.PROD_RESOURCE_GROUP }} \
            --name flamoral-prod-db \
            --backup-name "pre-deploy-${{ github.run_id }}" || true
        continue-on-error: true

      - name: Create namespace
        run: |
          kubectl create namespace flamoral-prod --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Canary strategy
        if: github.event.inputs.deployment_strategy == 'canary' || github.event.inputs.deployment_strategy == ''
        run: |
          # Deploy canary at 10%
          helm upgrade --install flamoral-prod-canary ./k8s/helm/flamoral \
            --namespace flamoral-prod \
            --values ./k8s/helm/flamoral/values-prod.yaml \
            --set global.image.tag=${{ env.IMAGE_TAG }} \
            --set global.image.registry=${{ env.ACR_LOGIN_SERVER }} \
            --set global.environment=production \
            --set global.canary.enabled=true \
            --set global.canary.weight=10 \
            --set replicaCount=2 \
            --wait \
            --timeout 15m

          echo "Canary deployed at 10%, waiting 3 minutes for validation..."
          sleep 180

          # Progressive rollout
          for weight in 25 50 75 100; do
            echo "Rolling out to ${weight}%..."
            helm upgrade flamoral-prod-canary ./k8s/helm/flamoral \
              --namespace flamoral-prod \
              --reuse-values \
              --set global.canary.weight=$weight \
              --wait
            sleep 120
          done

          # Finalize deployment
          helm upgrade flamoral-prod-canary ./k8s/helm/flamoral \
            --namespace flamoral-prod \
            --reuse-values \
            --set global.canary.enabled=false \
            --wait

      - name: Deploy with Rolling strategy
        if: github.event.inputs.deployment_strategy == 'rolling'
        run: |
          helm upgrade --install flamoral-prod ./k8s/helm/flamoral \
            --namespace flamoral-prod \
            --values ./k8s/helm/flamoral/values-prod.yaml \
            --set global.image.tag=${{ env.IMAGE_TAG }} \
            --set global.image.registry=${{ env.ACR_LOGIN_SERVER }} \
            --set global.environment=production \
            --set replicaCount=3 \
            --set strategy.type=RollingUpdate \
            --set strategy.rollingUpdate.maxUnavailable=0 \
            --set strategy.rollingUpdate.maxSurge=1 \
            --wait \
            --timeout 20m

      - name: Deploy with Blue-Green strategy
        if: github.event.inputs.deployment_strategy == 'blue-green'
        run: |
          # Determine current slot
          CURRENT_SLOT=$(kubectl get configmap deployment-slot -n flamoral-prod -o jsonpath='{.data.active}' 2>/dev/null || echo "blue")
          if [ "$CURRENT_SLOT" = "blue" ]; then
            DEPLOY_SLOT="green"
          else
            DEPLOY_SLOT="blue"
          fi

          echo "Deploying to $DEPLOY_SLOT slot..."

          # Deploy to inactive slot
          helm upgrade --install flamoral-prod-$DEPLOY_SLOT ./k8s/helm/flamoral \
            --namespace flamoral-prod \
            --values ./k8s/helm/flamoral/values-prod.yaml \
            --set global.image.tag=${{ env.IMAGE_TAG }} \
            --set global.image.registry=${{ env.ACR_LOGIN_SERVER }} \
            --set global.environment=production \
            --set global.slot=$DEPLOY_SLOT \
            --set replicaCount=3 \
            --wait \
            --timeout 15m

          # Wait for new deployment to be ready
          kubectl wait --for=condition=available deployment --all \
            -l slot=$DEPLOY_SLOT \
            -n flamoral-prod --timeout=600s

          # Switch traffic
          kubectl patch configmap deployment-slot -n flamoral-prod \
            --type merge -p "{\"data\":{\"active\":\"$DEPLOY_SLOT\"}}" || \
          kubectl create configmap deployment-slot -n flamoral-prod \
            --from-literal=active=$DEPLOY_SLOT

          echo "Traffic switched to $DEPLOY_SLOT"

      - name: Run database migrations
        run: |
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migration-prod-${{ github.run_number }}
            namespace: flamoral-prod
          spec:
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                containers:
                - name: migration
                  image: ${{ env.ACR_LOGIN_SERVER }}/flamoral/user-service:${{ env.IMAGE_TAG }}
                  command: ["npm", "run", "migrate"]
                  envFrom:
                  - secretRef:
                      name: flamoral-db-secrets
                restartPolicy: Never
            backoffLimit: 3
          EOF

          kubectl wait --for=condition=complete \
            job/db-migration-prod-${{ github.run_number }} \
            -n flamoral-prod --timeout=900s

      - name: Verify production deployment
        run: |
          kubectl get pods,services,ingress -n flamoral-prod
          curl -sf https://api.flamoral.com/health || echo "Health check completed"

  # ===========================================================================
  # JOB 7: POST-DEPLOYMENT VALIDATION
  # ===========================================================================
  post-deployment-validation:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run production smoke tests
        run: |
          yarn install --frozen-lockfile
          npx playwright install chromium
          yarn test:e2e:smoke
        env:
          BASE_URL: https://flamoral.com
          API_URL: https://api.flamoral.com

      - name: Check service health
        run: |
          services=("api-gateway" "user-service" "matching-service" "messaging-service" "payment-service")
          for service in "${services[@]}"; do
            echo "Checking $service health..."
            curl -sf https://api.flamoral.com/$service/health || echo "$service health check completed"
            sleep 2
          done

  # ===========================================================================
  # JOB 8: ROLLBACK (On Failure)
  # ===========================================================================
  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deployment-validation]
    if: failure() && needs.deploy-production.result == 'success'
    environment:
      name: production-rollback

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.PROD_RESOURCE_GROUP }} \
            --name ${{ secrets.PROD_AKS_CLUSTER }} \
            --overwrite-existing

      - name: Download backup
        uses: actions/download-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}

      - name: Rollback deployments
        run: |
          echo "Rolling back to previous deployment..."
          kubectl apply -f prod-deployments-backup-${{ github.run_id }}.yaml -n flamoral-prod || true

      - name: Verify rollback
        run: |
          kubectl rollout status deployment --all -n flamoral-prod --timeout=600s
          kubectl get pods -n flamoral-prod

  # ===========================================================================
  # JOB 9: NOTIFICATIONS
  # ===========================================================================
  notify-deployment:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deployment-validation, rollback-production]
    if: always()

    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.rollback-production.result }}" == "success" ]; then
            echo "status=rolled_back" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy-production.result }}" == "success" ] && [ "${{ needs.post-deployment-validation.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} Flamoral Deployment ${{ steps.status.outputs.status }}",
              "attachments": [{
                "color": "${{ steps.status.outputs.color }}",
                "fields": [
                  {"title": "Environment", "value": "Production", "short": true},
                  {"title": "Image Tag", "value": "${{ env.IMAGE_TAG }}", "short": true},
                  {"title": "Deployed by", "value": "${{ github.actor }}", "short": true},
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always() && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true

      - name: Send Teams notification
        run: |
          curl -X POST ${{ secrets.TEAMS_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "@type": "MessageCard",
              "@context": "https://schema.org/extensions",
              "summary": "Flamoral Deployment",
              "themeColor": "${{ steps.status.outputs.color == 'good' && '28a745' || steps.status.outputs.color == 'warning' && 'ffc107' || 'dc3545' }}",
              "title": "${{ steps.status.outputs.emoji }} Flamoral Deployment ${{ steps.status.outputs.status }}",
              "sections": [{
                "facts": [
                  {"name": "Environment", "value": "Production"},
                  {"name": "Image Tag", "value": "${{ env.IMAGE_TAG }}"},
                  {"name": "Deployed by", "value": "${{ github.actor }}"},
                  {"name": "Branch", "value": "${{ github.ref_name }}"},
                  {"name": "Status", "value": "${{ steps.status.outputs.status }}"}
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Deployment",
                "targets": [{
                  "os": "default",
                  "uri": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }]
              }]
            }'
        if: always() && env.TEAMS_WEBHOOK_URL != ''
        continue-on-error: true

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://flamoral.com" >> $GITHUB_STEP_SUMMARY
