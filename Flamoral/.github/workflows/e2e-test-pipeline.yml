# =============================================================================
# E2E TEST PIPELINE - Playwright, Accessibility, Visual Regression
# =============================================================================
# Comprehensive E2E testing including:
# - Playwright browser tests (Chrome, Firefox, Safari)
# - Accessibility testing (axe-core)
# - Visual regression testing
# - Mobile viewport testing
# - Cross-browser compatibility
# =============================================================================

name: E2E Test Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - 'e2e/**'
      - 'playwright.config.*'
      - '.github/workflows/e2e-test-pipeline.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - 'e2e/**'
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
      browsers:
        description: 'Browsers to test'
        required: false
        default: 'chromium,firefox'
      test_filter:
        description: 'Test filter pattern (grep)'
        required: false
        default: ''
      debug_mode:
        description: 'Enable debug mode with traces'
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PLAYWRIGHT_BROWSERS_PATH: 0

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ===========================================================================
  # STAGE 1: Setup & Install
  # ===========================================================================
  setup:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.urls.outputs.base_url }}
      api_url: ${{ steps.urls.outputs.api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine test URLs
        id: urls
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"

          case "$ENV" in
            dev)
              BASE_URL="https://dev.flamoral.com"
              API_URL="https://dev-api.flamoral.com"
              ;;
            staging)
              BASE_URL="https://staging.flamoral.com"
              API_URL="https://staging-api.flamoral.com"
              ;;
          esac

          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

          echo "## Test Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** $ENV" >> $GITHUB_STEP_SUMMARY
          echo "- **Base URL:** $BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # STAGE 2: Playwright E2E Tests
  # ===========================================================================
  playwright-tests:
    name: Playwright - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -f "e2e/package.json" ]; then
            cd e2e && npm ci
          elif [ -f "frontend/package.json" ]; then
            cd frontend && npm ci
          else
            npm ci
          fi

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Check for Playwright config
        id: config
        run: |
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
            echo "config_exists=true" >> $GITHUB_OUTPUT
            echo "config_path=." >> $GITHUB_OUTPUT
          elif [ -f "e2e/playwright.config.ts" ] || [ -f "e2e/playwright.config.js" ]; then
            echo "config_exists=true" >> $GITHUB_OUTPUT
            echo "config_path=e2e" >> $GITHUB_OUTPUT
          elif [ -f "frontend/playwright.config.ts" ] || [ -f "frontend/playwright.config.js" ]; then
            echo "config_exists=true" >> $GITHUB_OUTPUT
            echo "config_path=frontend" >> $GITHUB_OUTPUT
          else
            echo "config_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create default Playwright config
        if: steps.config.outputs.config_exists != 'true'
        run: |
          mkdir -p e2e/tests

          cat << 'EOF' > e2e/playwright.config.ts
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './tests',
            fullyParallel: true,
            forbidOnly: !!process.env.CI,
            retries: process.env.CI ? 2 : 0,
            workers: process.env.CI ? 1 : undefined,
            reporter: [
              ['html', { open: 'never' }],
              ['json', { outputFile: 'test-results/results.json' }],
              ['junit', { outputFile: 'test-results/junit.xml' }]
            ],
            use: {
              baseURL: process.env.BASE_URL || 'http://localhost:3000',
              trace: 'on-first-retry',
              screenshot: 'only-on-failure',
            },
            projects: [
              { name: 'chromium', use: { ...devices['Desktop Chrome'] } },
              { name: 'firefox', use: { ...devices['Desktop Firefox'] } },
              { name: 'webkit', use: { ...devices['Desktop Safari'] } },
              { name: 'Mobile Chrome', use: { ...devices['Pixel 5'] } },
              { name: 'Mobile Safari', use: { ...devices['iPhone 12'] } },
            ],
          });
          EOF

          echo "config_path=e2e" >> $GITHUB_OUTPUT

      - name: Create placeholder test
        if: steps.config.outputs.config_exists != 'true'
        run: |
          cat << 'EOF' > e2e/tests/health.spec.ts
          import { test, expect } from '@playwright/test';

          test('API health check', async ({ request }) => {
            const response = await request.get(process.env.API_URL + '/health');
            expect(response.status()).toBeLessThan(500);
          });

          test('Homepage loads', async ({ page }) => {
            await page.goto('/');
            await expect(page).toHaveTitle(/.*/);
          });
          EOF

      - name: Run Playwright tests
        run: |
          cd ${{ steps.config.outputs.config_path || 'e2e' }}

          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.test_filter }}" ]; then
            EXTRA_ARGS="--grep '${{ github.event.inputs.test_filter }}'"
          fi

          if [ "${{ github.event.inputs.debug_mode }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --trace on"
          fi

          npx playwright test \
            --project=${{ matrix.browser }} \
            --shard=${{ matrix.shard }}/2 \
            $EXTRA_ARGS
        env:
          BASE_URL: ${{ needs.setup.outputs.base_url }}
          API_URL: ${{ needs.setup.outputs.api_url }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ${{ steps.config.outputs.config_path || 'e2e' }}/playwright-report/
            ${{ steps.config.outputs.config_path || 'e2e' }}/test-results/
          retention-days: 30

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}-${{ matrix.shard }}
          path: ${{ steps.config.outputs.config_path || 'e2e' }}/test-results/**/trace.zip
          retention-days: 7

  # ===========================================================================
  # STAGE 3: Accessibility Testing
  # ===========================================================================
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm install --save-dev @axe-core/playwright playwright

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Create accessibility test
        run: |
          mkdir -p a11y-tests

          cat << 'EOF' > a11y-tests/accessibility.spec.ts
          import { test, expect } from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';

          const pages = [
            { name: 'Homepage', path: '/' },
            { name: 'Login', path: '/login' },
            { name: 'Register', path: '/register' },
            { name: 'Profile', path: '/profile' },
          ];

          for (const page of pages) {
            test(`${page.name} should have no accessibility violations`, async ({ page: testPage }) => {
              await testPage.goto(page.path, { waitUntil: 'networkidle', timeout: 30000 }).catch(() => {
                console.log(`Could not load ${page.path}, skipping...`);
              });

              const accessibilityScanResults = await new AxeBuilder({ page: testPage })
                .withTags(['wcag2a', 'wcag2aa', 'wcag21aa'])
                .analyze();

              // Log violations for debugging
              if (accessibilityScanResults.violations.length > 0) {
                console.log(`\nAccessibility violations on ${page.name}:`);
                accessibilityScanResults.violations.forEach(violation => {
                  console.log(`- ${violation.id}: ${violation.description}`);
                  console.log(`  Impact: ${violation.impact}`);
                  console.log(`  Nodes affected: ${violation.nodes.length}`);
                });
              }

              // Fail on serious violations only
              const seriousViolations = accessibilityScanResults.violations.filter(
                v => v.impact === 'critical' || v.impact === 'serious'
              );

              expect(seriousViolations).toHaveLength(0);
            });
          }
          EOF

          cat << 'EOF' > a11y-tests/playwright.config.ts
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: '.',
            timeout: 60000,
            retries: 1,
            reporter: [
              ['html', { open: 'never', outputFolder: 'a11y-report' }],
              ['json', { outputFile: 'a11y-results.json' }]
            ],
            use: {
              baseURL: process.env.BASE_URL || 'http://localhost:3000',
            },
          });
          EOF

      - name: Run accessibility tests
        run: |
          cd a11y-tests
          npx playwright test
        env:
          BASE_URL: ${{ needs.setup.outputs.base_url }}

      - name: Generate accessibility report
        if: always()
        run: |
          echo "## Accessibility Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "a11y-tests/a11y-results.json" ]; then
            PASSED=$(jq '.suites[].suites[].specs[] | select(.ok == true) | .title' a11y-tests/a11y-results.json 2>/dev/null | wc -l || echo "0")
            FAILED=$(jq '.suites[].suites[].specs[] | select(.ok == false) | .title' a11y-tests/a11y-results.json 2>/dev/null | wc -l || echo "0")

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file found - tests may have been skipped" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: |
            a11y-tests/a11y-report/
            a11y-tests/a11y-results.json
          retention-days: 30

  # ===========================================================================
  # STAGE 4: Mobile Viewport Testing
  # ===========================================================================
  mobile-tests:
    name: Mobile Viewport Tests
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          npm install --save-dev @playwright/test
          npx playwright install chromium webkit

      - name: Create mobile viewport tests
        run: |
          mkdir -p mobile-tests

          cat << 'EOF' > mobile-tests/mobile.spec.ts
          import { test, expect, devices } from '@playwright/test';

          const mobileDevices = [
            { name: 'iPhone 12', device: devices['iPhone 12'] },
            { name: 'iPhone SE', device: devices['iPhone SE'] },
            { name: 'Pixel 5', device: devices['Pixel 5'] },
            { name: 'Galaxy S9', device: devices['Galaxy S9+'] },
          ];

          const criticalPages = ['/', '/login', '/register'];

          for (const { name, device } of mobileDevices) {
            test.describe(`${name}`, () => {
              test.use({ ...device });

              for (const path of criticalPages) {
                test(`${path} - renders correctly`, async ({ page }) => {
                  const response = await page.goto(path, { timeout: 30000 }).catch(() => null);

                  if (response) {
                    // Check no horizontal scroll
                    const scrollWidth = await page.evaluate(() => document.documentElement.scrollWidth);
                    const clientWidth = await page.evaluate(() => document.documentElement.clientWidth);
                    expect(scrollWidth).toBeLessThanOrEqual(clientWidth + 10);

                    // Check viewport meta tag
                    const viewportMeta = await page.locator('meta[name="viewport"]').count();
                    expect(viewportMeta).toBeGreaterThan(0);

                    // Screenshot for visual verification
                    await page.screenshot({ path: `screenshots/${name.replace(/\s+/g, '-')}-${path.replace(/\//g, '-') || 'home'}.png` });
                  }
                });
              }
            });
          }
          EOF

          cat << 'EOF' > mobile-tests/playwright.config.ts
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: '.',
            timeout: 60000,
            reporter: [
              ['html', { open: 'never', outputFolder: 'mobile-report' }],
              ['json', { outputFile: 'mobile-results.json' }]
            ],
            use: {
              baseURL: process.env.BASE_URL || 'http://localhost:3000',
            },
          });
          EOF

      - name: Run mobile tests
        run: |
          cd mobile-tests
          mkdir -p screenshots
          npx playwright test
        env:
          BASE_URL: ${{ needs.setup.outputs.base_url }}

      - name: Upload mobile test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-report
          path: |
            mobile-tests/mobile-report/
            mobile-tests/screenshots/
            mobile-tests/mobile-results.json
          retention-days: 30

  # ===========================================================================
  # STAGE 5: Generate Test Summary
  # ===========================================================================
  test-summary:
    name: Generate Test Summary
    runs-on: ubuntu-latest
    needs: [playwright-tests, accessibility-tests, mobile-tests]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Generate consolidated report
        run: |
          mkdir -p reports

          echo "# E2E Test Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright E2E | ${{ needs.playwright-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | ${{ needs.accessibility-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Viewport | ${{ needs.mobile-tests.result }} |" >> $GITHUB_STEP_SUMMARY

          # Generate JSON summary
          cat << EOF > reports/e2e-summary.json
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "environment": "${{ github.event.inputs.environment || 'dev' }}",
            "results": {
              "playwright": "${{ needs.playwright-tests.result }}",
              "accessibility": "${{ needs.accessibility-tests.result }}",
              "mobile": "${{ needs.mobile-tests.result }}"
            },
            "overall": "${{ (needs.playwright-tests.result == 'success' && needs.accessibility-tests.result == 'success' && needs.mobile-tests.result == 'success') && 'passed' || 'failed' }}"
          }
          EOF

      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-summary
          path: reports/
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const playwrightResult = '${{ needs.playwright-tests.result }}';
            const accessibilityResult = '${{ needs.accessibility-tests.result }}';
            const mobileResult = '${{ needs.mobile-tests.result }}';

            const statusEmoji = (result) => result === 'success' ? ':white_check_mark:' : ':x:';

            const body = `## E2E Test Results

            | Test Suite | Status |
            |------------|--------|
            | Playwright | ${statusEmoji(playwrightResult)} ${playwrightResult} |
            | Accessibility | ${statusEmoji(accessibilityResult)} ${accessibilityResult} |
            | Mobile Viewport | ${statusEmoji(mobileResult)} ${mobileResult} |

            [View Full Report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
        continue-on-error: true
