# =============================================================================
# INFRASTRUCTURE DRIFT DETECTION PIPELINE
# =============================================================================
# Comprehensive drift detection for Terraform, Kubernetes, and Helm
# With intelligent classification: SAFE_AUTO_FIX, REQUIRES_APPROVAL, BLOCK_AND_ESCALATE
# =============================================================================

name: Infrastructure Drift Detection

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - all
          - dev
          - staging
          - prod
      auto_fix:
        description: 'Enable auto-fix for safe drift'
        type: boolean
        default: false

concurrency:
  group: drift-detection-${{ github.event.inputs.environment || 'all' }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.6.0'
  HELM_VERSION: 'v3.13.0'

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ===========================================================================
  # STAGE 1: Terraform Drift Detection
  # ===========================================================================
  terraform-drift:
    name: Terraform Drift - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    outputs:
      dev_drift: ${{ steps.classify.outputs.dev_drift }}
      staging_drift: ${{ steps.classify.outputs.staging_drift }}
      prod_drift: ${{ steps.classify.outputs.prod_drift }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment filter
        id: filter
        run: |
          INPUT_ENV="${{ github.event.inputs.environment }}"
          MATRIX_ENV="${{ matrix.environment }}"

          if [ "$INPUT_ENV" = "all" ] || [ "$INPUT_ENV" = "$MATRIX_ENV" ] || [ -z "$INPUT_ENV" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        if: steps.filter.outputs.should_run == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure Login
        if: steps.filter.outputs.should_run == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Initialize Terraform
        if: steps.filter.outputs.should_run == 'true'
        id: init
        run: |
          cd infrastructure/terraform/environments/${{ matrix.environment }}
          terraform init -input=false 2>&1 | tee init-output.txt

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "init_failed=true" >> $GITHUB_OUTPUT
            echo "## Terraform Init Failed - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
            cat init-output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "init_failed=false" >> $GITHUB_OUTPUT
          fi
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Plan and detect drift
        if: steps.filter.outputs.should_run == 'true' && steps.init.outputs.init_failed != 'true'
        id: plan
        run: |
          cd infrastructure/terraform/environments/${{ matrix.environment }}

          # Run plan with detailed exit code
          terraform plan -detailed-exitcode -no-color -out=tfplan 2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          if [ $EXIT_CODE -eq 0 ]; then
            echo "drift_status=no_drift" >> $GITHUB_OUTPUT
            echo "## No Drift Detected - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "drift_status=drift_detected" >> $GITHUB_OUTPUT
            echo "## Drift Detected - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY

            # Save plan for analysis
            terraform show -no-color tfplan > plan-readable.txt
          else
            echo "drift_status=error" >> $GITHUB_OUTPUT
            echo "## Error Running Plan - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Classify drift severity
        if: steps.filter.outputs.should_run == 'true' && steps.plan.outputs.drift_status == 'drift_detected'
        id: classify
        run: |
          cd infrastructure/terraform/environments/${{ matrix.environment }}

          # Initialize classification
          CLASSIFICATION="SAFE_AUTO_FIX"
          DESTRUCTIVE_CHANGES=0
          SENSITIVE_CHANGES=0
          TOTAL_CHANGES=0

          # Parse plan output for change types
          if [ -f plan-readable.txt ]; then
            # Count destructive operations (destroy, replace)
            DESTRUCTIVE_CHANGES=$(grep -c "will be destroyed\|must be replaced" plan-readable.txt 2>/dev/null || echo "0")

            # Count sensitive resource changes (databases, key vaults, etc.)
            SENSITIVE_CHANGES=$(grep -c "azurerm_postgresql\|azurerm_key_vault\|azurerm_cosmosdb\|azurerm_redis" plan-readable.txt 2>/dev/null || echo "0")

            # Count total changes
            TOTAL_CHANGES=$(grep -c "will be\|must be" plan-readable.txt 2>/dev/null || echo "0")

            # Classify based on changes
            if [ "$DESTRUCTIVE_CHANGES" -gt 0 ]; then
              CLASSIFICATION="BLOCK_AND_ESCALATE"
            elif [ "$SENSITIVE_CHANGES" -gt 0 ] && [ "${{ matrix.environment }}" = "prod" ]; then
              CLASSIFICATION="REQUIRES_APPROVAL"
            elif [ "$TOTAL_CHANGES" -gt 10 ]; then
              CLASSIFICATION="REQUIRES_APPROVAL"
            elif [ "${{ matrix.environment }}" = "prod" ]; then
              CLASSIFICATION="REQUIRES_APPROVAL"
            fi
          fi

          echo "${{ matrix.environment }}_drift=$CLASSIFICATION" >> $GITHUB_OUTPUT
          echo "classification=$CLASSIFICATION" >> $GITHUB_OUTPUT
          echo "destructive_count=$DESTRUCTIVE_CHANGES" >> $GITHUB_OUTPUT
          echo "sensitive_count=$SENSITIVE_CHANGES" >> $GITHUB_OUTPUT
          echo "total_count=$TOTAL_CHANGES" >> $GITHUB_OUTPUT

          # Add to summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Drift Classification: $CLASSIFICATION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Changes | $TOTAL_CHANGES |" >> $GITHUB_STEP_SUMMARY
          echo "| Destructive Changes | $DESTRUCTIVE_CHANGES |" >> $GITHUB_STEP_SUMMARY
          echo "| Sensitive Resources | $SENSITIVE_CHANGES |" >> $GITHUB_STEP_SUMMARY

      - name: Auto-fix safe drift
        if: |
          steps.filter.outputs.should_run == 'true' &&
          steps.classify.outputs.classification == 'SAFE_AUTO_FIX' &&
          github.event.inputs.auto_fix == 'true' &&
          matrix.environment != 'prod'
        run: |
          cd infrastructure/terraform/environments/${{ matrix.environment }}

          echo "## Auto-fixing Safe Drift" >> $GITHUB_STEP_SUMMARY
          echo "Environment: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY

          terraform apply -auto-approve tfplan 2>&1 | tee apply-output.txt

          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "Auto-fix completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "Auto-fix failed - manual intervention required" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      - name: Upload drift report
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ matrix.environment }}
          path: |
            infrastructure/terraform/environments/${{ matrix.environment }}/plan-output.txt
            infrastructure/terraform/environments/${{ matrix.environment }}/plan-readable.txt
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 2: Kubernetes Drift Detection
  # ===========================================================================
  kubernetes-drift:
    name: Kubernetes Drift - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment filter
        id: filter
        run: |
          INPUT_ENV="${{ github.event.inputs.environment }}"
          MATRIX_ENV="${{ matrix.environment }}"

          if [ "$INPUT_ENV" = "all" ] || [ "$INPUT_ENV" = "$MATRIX_ENV" ] || [ -z "$INPUT_ENV" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        if: steps.filter.outputs.should_run == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Helm
        if: steps.filter.outputs.should_run == 'true'
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Get AKS credentials
        if: steps.filter.outputs.should_run == 'true'
        id: aks
        run: |
          case "${{ matrix.environment }}" in
            dev)
              RG="flamoral-dev-rg"
              CLUSTER="flamoral-dev-aks"
              ;;
            staging)
              RG="flamoral-staging-rg"
              CLUSTER="flamoral-staging-aks"
              ;;
            prod)
              RG="flamoral-prod-rg"
              CLUSTER="flamoral-prod-aks"
              ;;
          esac

          az aks get-credentials --resource-group $RG --name $CLUSTER --overwrite-existing 2>&1 || {
            echo "cluster_available=false" >> $GITHUB_OUTPUT
            exit 0
          }
          echo "cluster_available=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Detect Helm drift
        if: steps.filter.outputs.should_run == 'true' && steps.aks.outputs.cluster_available == 'true'
        id: helm_drift
        run: |
          NAMESPACE="flamoral-${{ matrix.environment }}"
          CHART_PATH="infrastructure/helm/flamoral"
          VALUES_FILE="infrastructure/helm/flamoral/values-${{ matrix.environment }}.yaml"

          echo "## Helm Drift Detection - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY

          # Check if release exists
          RELEASE_EXISTS=$(helm list -n $NAMESPACE -q 2>/dev/null | grep -c "flamoral" || echo "0")

          if [ "$RELEASE_EXISTS" -eq 0 ]; then
            echo "No Helm release found in $NAMESPACE" >> $GITHUB_STEP_SUMMARY
            echo "helm_drift=none" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Perform diff against current state
          if [ -f "$VALUES_FILE" ]; then
            helm diff upgrade flamoral-${{ matrix.environment }} $CHART_PATH \
              --namespace $NAMESPACE \
              --values $VALUES_FILE \
              --no-color 2>&1 | tee helm-diff.txt || true
          else
            helm diff upgrade flamoral-${{ matrix.environment }} $CHART_PATH \
              --namespace $NAMESPACE \
              --no-color 2>&1 | tee helm-diff.txt || true
          fi

          if [ -s helm-diff.txt ] && grep -q "^+" helm-diff.txt; then
            echo "helm_drift=detected" >> $GITHUB_OUTPUT
            echo "Helm configuration drift detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "helm_drift=none" >> $GITHUB_OUTPUT
            echo "No Helm drift detected" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Check resource drift
        if: steps.filter.outputs.should_run == 'true' && steps.aks.outputs.cluster_available == 'true'
        run: |
          NAMESPACE="flamoral-${{ matrix.environment }}"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Kubernetes Resources State" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check deployment status
          echo "**Deployments:**" >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -n $NAMESPACE -o wide 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || echo "Unable to get deployments" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pod Status:**" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n $NAMESPACE --show-labels 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || echo "Unable to get pods" >> $GITHUB_STEP_SUMMARY

          # Check for pods not running
          NOT_RUNNING=$(kubectl get pods -n $NAMESPACE --no-headers 2>/dev/null | grep -v "Running\|Completed" | wc -l || echo "0")

          if [ "$NOT_RUNNING" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Warning: $NOT_RUNNING pods not in Running state**" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Upload Kubernetes drift report
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k8s-drift-report-${{ matrix.environment }}
          path: helm-diff.txt
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 3: Generate Consolidated Report
  # ===========================================================================
  generate-report:
    name: Generate Drift Report
    runs-on: ubuntu-latest
    needs: [terraform-drift, kubernetes-drift]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: drift-reports
        continue-on-error: true

      - name: Generate consolidated report
        id: report
        run: |
          mkdir -p reports

          cat << 'EOF' > reports/drift-report.json
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "environments": {
              "dev": {
                "terraform_drift": "${{ needs.terraform-drift.outputs.dev_drift || 'unknown' }}",
                "terraform_status": "${{ needs.terraform-drift.result }}"
              },
              "staging": {
                "terraform_drift": "${{ needs.terraform-drift.outputs.staging_drift || 'unknown' }}",
                "terraform_status": "${{ needs.terraform-drift.result }}"
              },
              "prod": {
                "terraform_drift": "${{ needs.terraform-drift.outputs.prod_drift || 'unknown' }}",
                "terraform_status": "${{ needs.terraform-drift.result }}"
              }
            },
            "kubernetes_status": "${{ needs.kubernetes-drift.result }}",
            "overall_status": "${{ (needs.terraform-drift.result == 'success' && needs.kubernetes-drift.result == 'success') && 'healthy' || 'attention_required' }}"
          }
          EOF

          # Generate markdown summary
          echo "# Infrastructure Drift Report" > reports/drift-report.md
          echo "" >> reports/drift-report.md
          echo "**Generated:** $(date -u)" >> reports/drift-report.md
          echo "" >> reports/drift-report.md
          echo "## Summary" >> reports/drift-report.md
          echo "" >> reports/drift-report.md
          echo "| Environment | Terraform Status | Classification |" >> reports/drift-report.md
          echo "|-------------|------------------|----------------|" >> reports/drift-report.md
          echo "| dev | ${{ needs.terraform-drift.result }} | ${{ needs.terraform-drift.outputs.dev_drift || 'N/A' }} |" >> reports/drift-report.md
          echo "| staging | ${{ needs.terraform-drift.result }} | ${{ needs.terraform-drift.outputs.staging_drift || 'N/A' }} |" >> reports/drift-report.md
          echo "| prod | ${{ needs.terraform-drift.result }} | ${{ needs.terraform-drift.outputs.prod_drift || 'N/A' }} |" >> reports/drift-report.md
          echo "" >> reports/drift-report.md
          echo "## Classification Legend" >> reports/drift-report.md
          echo "" >> reports/drift-report.md
          echo "- **SAFE_AUTO_FIX**: Non-destructive changes that can be auto-applied (non-prod only)" >> reports/drift-report.md
          echo "- **REQUIRES_APPROVAL**: Changes that need human review before applying" >> reports/drift-report.md
          echo "- **BLOCK_AND_ESCALATE**: Destructive changes that require immediate attention" >> reports/drift-report.md

          # Check for critical drift
          CRITICAL_DRIFT="false"
          if echo "${{ needs.terraform-drift.outputs.prod_drift }}" | grep -q "BLOCK_AND_ESCALATE"; then
            CRITICAL_DRIFT="true"
          fi
          echo "critical_drift=$CRITICAL_DRIFT" >> $GITHUB_OUTPUT

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-consolidated
          path: reports/
          retention-days: 90

      - name: Create issue for critical drift
        if: steps.report.outputs.critical_drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            await github.rest.issues.create({
              owner,
              repo,
              title: '[CRITICAL] Infrastructure Drift Detected - Immediate Attention Required',
              body: `## Critical Infrastructure Drift Detected

              The Infrastructure Drift Detection pipeline has detected critical drift that requires immediate attention.

              ### Details
              - **Detection Time:** ${new Date().toISOString()}
              - **Workflow Run:** ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}

              ### Classification
              - Production environment has **BLOCK_AND_ESCALATE** level drift
              - This indicates destructive changes in the infrastructure state

              ### Required Actions
              1. Review the drift report immediately
              2. Determine if changes were intentional
              3. If unintentional, investigate the source of drift
              4. Apply fixes through proper change management process

              ---
              *This issue was automatically created by the Infrastructure Drift Detection pipeline*`,
              labels: ['infrastructure', 'critical', 'drift']
            });

      - name: Notify Slack on critical drift
        if: steps.report.outputs.critical_drift == 'true'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#infrastructure-alerts'
          text: |
            :rotating_light: CRITICAL INFRASTRUCTURE DRIFT DETECTED

            Production environment has destructive drift that requires immediate attention.

            Review: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Update GitHub Step Summary
        run: |
          echo "# Infrastructure Drift Detection Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Drift | ${{ needs.terraform-drift.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kubernetes Drift | ${{ needs.kubernetes-drift.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.report.outputs.critical_drift }}" = "true" ]; then
            echo "## :warning: CRITICAL DRIFT DETECTED" >> $GITHUB_STEP_SUMMARY
            echo "A GitHub Issue has been created for tracking." >> $GITHUB_STEP_SUMMARY
          fi
