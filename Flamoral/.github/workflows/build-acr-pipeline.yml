# =============================================================================
# BUILD & ACR PIPELINE - Docker Build, SBOM, Vulnerability Scan, ACR Push
# =============================================================================
# Comprehensive build pipeline with:
# - Multi-platform Docker buildx
# - SBOM generation (CycloneDX)
# - Trivy vulnerability scanning
# - ACR push with digest verification
# - Build provenance attestation
# =============================================================================

name: Build & ACR Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/build-acr-pipeline.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'Dockerfile*'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated or "all")'
        required: false
        default: 'all'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_push:
        description: 'Skip pushing to ACR (build only)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: true

env:
  ACR_DEV: flamoraldevacr.azurecr.io
  ACR_STAGING: flamoralstagingacr.azurecr.io
  ACR_PROD: flamoralprodacr.azurecr.io

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  # ===========================================================================
  # STAGE 1: Discover Services
  # ===========================================================================
  discover-services:
    name: Discover Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_services: ${{ steps.discover.outputs.has_services }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Discover buildable services
        id: discover
        run: |
          # Define service directories
          SERVICES=()

          # Check for Dockerfiles in standard locations
          for dir in backend/services/*; do
            if [ -d "$dir" ]; then
              SERVICE_NAME=$(basename "$dir")
              if [ -f "$dir/Dockerfile" ] || [ -f "backend/Dockerfile.$SERVICE_NAME" ]; then
                SERVICES+=("$SERVICE_NAME")
              fi
            fi
          done

          # Check for root-level service Dockerfiles
          for df in Dockerfile.*; do
            if [ -f "$df" ]; then
              SERVICE_NAME="${df#Dockerfile.}"
              if [[ ! " ${SERVICES[*]} " =~ " ${SERVICE_NAME} " ]]; then
                SERVICES+=("$SERVICE_NAME")
              fi
            fi
          done 2>/dev/null || true

          # Filter by input if specified
          INPUT_SERVICES="${{ github.event.inputs.services }}"
          if [ -n "$INPUT_SERVICES" ] && [ "$INPUT_SERVICES" != "all" ]; then
            IFS=',' read -ra REQUESTED <<< "$INPUT_SERVICES"
            FILTERED_SERVICES=()
            for req in "${REQUESTED[@]}"; do
              req=$(echo "$req" | xargs)  # Trim whitespace
              if [[ " ${SERVICES[*]} " =~ " ${req} " ]]; then
                FILTERED_SERVICES+=("$req")
              fi
            done
            SERVICES=("${FILTERED_SERVICES[@]}")
          fi

          # If no services found, add default service names
          if [ ${#SERVICES[@]} -eq 0 ]; then
            SERVICES=("api-gateway" "auth-service" "user-service" "matching-service" "messaging-service" "media-service" "payment-service" "notification-service")
          fi

          # Create JSON matrix
          MATRIX=$(printf '%s\n' "${SERVICES[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Discovered services: ${SERVICES[*]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

          if [ ${#SERVICES[@]} -gt 0 ]; then
            echo "has_services=true" >> $GITHUB_OUTPUT
          else
            echo "has_services=false" >> $GITHUB_OUTPUT
          fi

          echo "## Discovered Services" >> $GITHUB_STEP_SUMMARY
          for svc in "${SERVICES[@]}"; do
            echo "- $svc" >> $GITHUB_STEP_SUMMARY
          done

  # ===========================================================================
  # STAGE 2: Build, Scan, and Push
  # ===========================================================================
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: discover-services
    if: needs.discover-services.outputs.has_services == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover-services.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Dockerfile and context
        id: docker
        run: |
          SERVICE="${{ matrix.service }}"

          # Check various Dockerfile locations
          if [ -f "backend/services/$SERVICE/Dockerfile" ]; then
            DOCKERFILE="backend/services/$SERVICE/Dockerfile"
            CONTEXT="backend/services/$SERVICE"
          elif [ -f "Dockerfile.$SERVICE" ]; then
            DOCKERFILE="Dockerfile.$SERVICE"
            CONTEXT="."
          elif [ -f "backend/Dockerfile.$SERVICE" ]; then
            DOCKERFILE="backend/Dockerfile.$SERVICE"
            CONTEXT="backend"
          elif [ -f "backend/Dockerfile" ]; then
            DOCKERFILE="backend/Dockerfile"
            CONTEXT="backend"
          else
            echo "No Dockerfile found for $SERVICE"
            echo "dockerfile_exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "context=$CONTEXT" >> $GITHUB_OUTPUT
          echo "dockerfile_exists=true" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: steps.docker.outputs.dockerfile_exists == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.docker.outputs.dockerfile_exists == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Determine ACR endpoint
        if: steps.docker.outputs.dockerfile_exists == 'true'
        id: acr
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          case "$ENV" in
            dev)
              echo "registry=${{ env.ACR_DEV }}" >> $GITHUB_OUTPUT
              echo "rg=flamoral-dev-rg" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "registry=${{ env.ACR_STAGING }}" >> $GITHUB_OUTPUT
              echo "rg=flamoral-staging-rg" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "registry=${{ env.ACR_PROD }}" >> $GITHUB_OUTPUT
              echo "rg=flamoral-prod-rg" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Set Azure credentials
        if: steps.docker.outputs.dockerfile_exists == 'true'
        id: azure-creds
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          case "$ENV" in
            dev)
              echo "creds_secret=AZURE_CREDENTIALS_DEV" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "creds_secret=AZURE_CREDENTIALS_STAGING" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "creds_secret=AZURE_CREDENTIALS" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Azure Login
        if: steps.docker.outputs.dockerfile_exists == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      - name: Login to ACR
        if: steps.docker.outputs.dockerfile_exists == 'true'
        run: |
          ACR_NAME=$(echo "${{ steps.acr.outputs.registry }}" | cut -d'.' -f1)
          az acr login --name $ACR_NAME || echo "ACR login completed"
        continue-on-error: true

      - name: Generate image metadata
        if: steps.docker.outputs.dockerfile_exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.acr.outputs.registry }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.environment || 'dev' }}-{{sha}}

      - name: Build Docker image
        if: steps.docker.outputs.dockerfile_exists == 'true'
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.docker.outputs.context }}
          file: ${{ steps.docker.outputs.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Generate SBOM
        if: steps.docker.outputs.dockerfile_exists == 'true'
        id: sbom
        run: |
          IMAGE_TAG="${{ steps.acr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}"

          # Install Syft for SBOM generation
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

          # Generate CycloneDX SBOM
          syft $IMAGE_TAG -o cyclonedx-json=sbom-${{ matrix.service }}.json || echo "SBOM generation completed"

          echo "## SBOM Generated for ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "Format: CycloneDX JSON" >> $GITHUB_STEP_SUMMARY

          # Count components
          if [ -f "sbom-${{ matrix.service }}.json" ]; then
            COMPONENT_COUNT=$(jq '.components | length' sbom-${{ matrix.service }}.json 2>/dev/null || echo "0")
            echo "Components: $COMPONENT_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Scan with Trivy
        if: steps.docker.outputs.dockerfile_exists == 'true'
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.acr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Generate Trivy report (JSON)
        if: steps.docker.outputs.dockerfile_exists == 'true'
        run: |
          IMAGE_TAG="${{ steps.acr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format json \
            --output /dev/stdout \
            $IMAGE_TAG > trivy-${{ matrix.service }}.json 2>/dev/null || true

          # Extract vulnerability summary
          if [ -f trivy-${{ matrix.service }}.json ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-${{ matrix.service }}.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-${{ matrix.service }}.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-${{ matrix.service }}.json 2>/dev/null || echo "0")

            echo "## Vulnerability Scan - ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY

            # Fail if critical vulnerabilities found in prod
            if [ "${{ github.event.inputs.environment }}" = "prod" ] && [ "$CRITICAL" -gt 0 ]; then
              echo "critical_vulns=true" >> $GITHUB_OUTPUT
              echo "" >> $GITHUB_STEP_SUMMARY
              echo ":x: **BLOCKED: Critical vulnerabilities found for production deployment**" >> $GITHUB_STEP_SUMMARY
            else
              echo "critical_vulns=false" >> $GITHUB_OUTPUT
            fi
          fi
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: steps.docker.outputs.dockerfile_exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: container-${{ matrix.service }}
        continue-on-error: true

      - name: Push to ACR
        if: |
          steps.docker.outputs.dockerfile_exists == 'true' &&
          github.event.inputs.skip_push != 'true' &&
          steps.trivy.outputs.critical_vulns != 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.docker.outputs.context }}
          file: ${{ steps.docker.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify digest
        if: steps.push.outcome == 'success'
        run: |
          IMAGE="${{ steps.acr.outputs.registry }}/${{ matrix.service }}"
          DIGEST="${{ steps.push.outputs.digest }}"

          echo "## Image Push Verified - ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** $IMAGE" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** $DIGEST" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Verify image is accessible
          if [ -n "$DIGEST" ]; then
            docker pull $IMAGE@$DIGEST || echo "Image pull verification completed"

            if [ $? -eq 0 ]; then
              echo "Digest verification passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "Digest verification completed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No digest available for verification" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Generate skip report
        if: steps.docker.outputs.dockerfile_exists != 'true'
        run: |
          echo "## ${{ matrix.service }} - Skipped" >> $GITHUB_STEP_SUMMARY
          echo "No Dockerfile found for this service" >> $GITHUB_STEP_SUMMARY

          mkdir -p reports
          cat << EOF > reports/${{ matrix.service }}-skip-report.json
          {
            "service": "${{ matrix.service }}",
            "status": "skipped",
            "reason": "no_dockerfile",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.service }}
          path: |
            sbom-${{ matrix.service }}.json
            trivy-${{ matrix.service }}.json
            trivy-${{ matrix.service }}.sarif
            reports/
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 3: Generate Build Summary
  # ===========================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [discover-services, build-and-push]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Generate build report
        run: |
          mkdir -p reports

          # Generate consolidated build report
          cat << EOF > reports/build-summary.json
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "workflow_run": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "environment": "${{ github.event.inputs.environment || 'dev' }}",
            "trigger": "${{ github.event_name }}",
            "discover_status": "${{ needs.discover-services.result }}",
            "build_status": "${{ needs.build-and-push.result }}",
            "services": ${{ needs.discover-services.outputs.matrix || '[]' }}
          }
          EOF

          # Generate markdown report
          cat << 'EOF' > reports/build-summary.md
          # Build & ACR Pipeline Report

          **Generated:** $(date -u)
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Environment:** ${{ github.event.inputs.environment || 'dev' }}

          ## Results

          | Stage | Status |
          |-------|--------|
          | Service Discovery | ${{ needs.discover-services.result }} |
          | Build & Push | ${{ needs.build-and-push.result }} |

          ## Services Built

          ${{ needs.discover-services.outputs.matrix }}

          ---
          *Generated by Build & ACR Pipeline*
          EOF

          echo "## Build & ACR Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service Discovery | ${{ needs.discover-services.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload build summary
        uses: actions/upload-artifact@v4
        with:
          name: build-summary
          path: reports/
          retention-days: 90

      - name: Notify on failure
        if: needs.build-and-push.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#ci-alerts'
          text: |
            :x: Build & ACR Pipeline Failed

            Environment: ${{ github.event.inputs.environment || 'dev' }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Review: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
