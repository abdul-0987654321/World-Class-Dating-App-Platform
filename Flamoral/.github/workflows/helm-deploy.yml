name: Deploy to AKS with Helm

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      service:
        description: 'Service to deploy (or all)'
        required: true
        type: choice
        options:
          - all
          - dating-api
          - media-processor
          - chat-worker
      image_tag:
        description: 'Image tag to deploy'
        required: true
        type: string
        default: 'latest'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group flamoral-${{ github.event.inputs.environment }}-rg \
            --name flamoral-${{ github.event.inputs.environment }}-aks \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Create namespace
        run: |
          kubectl create namespace flamoral --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy API Service
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'dating-api'
        run: |
          CHART_PATH="./k8s/helm/dating-api"
          VALUES_FILE="./k8s/helm/dating-api/values-${{ github.event.inputs.environment }}.yaml"

          if [ ! -f "$CHART_PATH/Chart.yaml" ]; then
            echo "Helm chart not found for dating-api"
            exit 0
          fi

          if [ ! -f "$VALUES_FILE" ]; then
            VALUES_FILE="$CHART_PATH/values.yaml"
          fi

          helm upgrade --install dating-api $CHART_PATH \
            --namespace flamoral \
            --set image.tag=${{ github.event.inputs.image_tag }} \
            --set environment=${{ github.event.inputs.environment }} \
            --values $VALUES_FILE \
            --wait \
            --timeout 10m

      - name: Deploy Media Processor
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'media-processor'
        run: |
          CHART_PATH="./k8s/helm/media-processor"
          VALUES_FILE="./k8s/helm/media-processor/values-${{ github.event.inputs.environment }}.yaml"

          if [ ! -f "$CHART_PATH/Chart.yaml" ]; then
            echo "Helm chart not found for media-processor"
            exit 0
          fi

          if [ ! -f "$VALUES_FILE" ]; then
            VALUES_FILE="$CHART_PATH/values.yaml"
          fi

          helm upgrade --install media-processor $CHART_PATH \
            --namespace flamoral \
            --set image.tag=${{ github.event.inputs.image_tag }} \
            --set environment=${{ github.event.inputs.environment }} \
            --values $VALUES_FILE \
            --wait \
            --timeout 10m

      - name: Deploy Chat Worker
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'chat-worker'
        run: |
          CHART_PATH="./k8s/helm/chat-worker"
          VALUES_FILE="./k8s/helm/chat-worker/values-${{ github.event.inputs.environment }}.yaml"

          if [ ! -f "$CHART_PATH/Chart.yaml" ]; then
            echo "Helm chart not found for chat-worker"
            exit 0
          fi

          if [ ! -f "$VALUES_FILE" ]; then
            VALUES_FILE="$CHART_PATH/values.yaml"
          fi

          helm upgrade --install chat-worker $CHART_PATH \
            --namespace flamoral \
            --set image.tag=${{ github.event.inputs.image_tag }} \
            --set environment=${{ github.event.inputs.environment }} \
            --values $VALUES_FILE \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl get pods -n flamoral
          kubectl get services -n flamoral
          kubectl get ingress -n flamoral

      - name: Run smoke tests
        if: github.event.inputs.environment != 'prod'
        run: |
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod -l app=flamoral-api -n flamoral --timeout=300s || true

          # Get service endpoints
          API_URL=$(kubectl get ingress -n flamoral -o jsonpath='{.items[0].spec.rules[0].host}')

          # Basic health check
          curl -f https://${API_URL}/health || echo "Health check failed"

      - name: Notify deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Helm Deployment - ${{ github.event.inputs.environment }} 🚀

            **Environment:** ${{ github.event.inputs.environment }}
            **Service:** ${{ github.event.inputs.service }}
            **Image Tag:** ${{ github.event.inputs.image_tag }}
            **Status:** ✅ Successfully deployed

            Deployment completed at: ${new Date().toISOString()}`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: output
            })
