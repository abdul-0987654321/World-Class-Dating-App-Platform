# =============================================================================
# UNIFIED CD PIPELINE - DEV ENVIRONMENT
# =============================================================================
# Continuous deployment to development environment
# Triggers: Push to develop branch after CI passes
# =============================================================================

name: CD - Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: cd-dev
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  TERRAFORM_VERSION: '1.6.0'
  ENVIRONMENT: dev
  AZURE_RESOURCE_GROUP: flamoral-dev-rg
  AKS_CLUSTER_NAME: flamoral-dev-aks
  ACR_NAME: flamoraldevacr
  HELM_RELEASE_NAME: flamoral-dev

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # STAGE 1: Build and Push Images to ACR
  # ===========================================================================
  build-push-acr:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: backend/services/api-gateway
          - name: user-service
            path: backend/services/user-service
          - name: auth-service
            path: backend/services/auth-service
          - name: matching-service
            path: backend/services/matching-service
          - name: messaging-service
            path: backend/services/messaging-service
          - name: media-service
            path: backend/services/media-service
          - name: notification-service
            path: backend/services/notification-service
          - name: payment-service
            path: backend/services/payment-service
          - name: analytics-service
            path: backend/services/analytics-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Check if Dockerfile exists
        id: dockerfile
        run: |
          if [ -f "${{ matrix.service.path }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ACR
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/flamoral/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/flamoral/${{ matrix.service.name }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=development
            BUILD_VERSION=${{ github.sha }}

      - name: Scan image with Trivy
        if: steps.dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_NAME }}.azurecr.io/flamoral/${{ matrix.service.name }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ===========================================================================
  # STAGE 2: Terraform Infrastructure
  # ===========================================================================
  terraform-deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build-push-acr
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform/environments/dating-dev
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -out=tfplan \
            -detailed-exitcode \
            -no-color
        working-directory: infrastructure/terraform/environments/dating-dev
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Apply
        if: steps.plan.outcome == 'success'
        run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/terraform/environments/dating-dev
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # ===========================================================================
  # STAGE 3: Deploy to AKS with Helm
  # ===========================================================================
  deploy-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [build-push-acr, terraform-deploy]
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Create namespace if not exists
        run: |
          kubectl create namespace flamoral-dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Pull secrets from Key Vault
        run: |
          # Create secrets in Kubernetes from Key Vault
          az keyvault secret show --vault-name flamoral-dev-kv --name db-connection-string --query value -o tsv | \
            kubectl create secret generic flamoral-db-secrets \
              --from-literal=connection-string="$(cat)" \
              -n flamoral-dev --dry-run=client -o yaml | kubectl apply -f -
        continue-on-error: true

      - name: Deploy services with Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./k8s/helm/flamoral \
            --namespace flamoral-dev \
            --values ./k8s/helm/flamoral/values-dev.yaml \
            --set global.image.tag=${{ github.sha }} \
            --set global.image.registry=${{ env.ACR_NAME }}.azurecr.io \
            --set global.environment=dev \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment -n flamoral-dev --timeout=5m || true
          kubectl get pods -n flamoral-dev
          kubectl get services -n flamoral-dev

  # ===========================================================================
  # STAGE 4: Database Migrations
  # ===========================================================================
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy-aks
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Run migrations job
        run: |
          # Apply migration job
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migration-${{ github.sha }}
            namespace: flamoral-dev
          spec:
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                containers:
                - name: migration
                  image: ${{ env.ACR_NAME }}.azurecr.io/flamoral/user-service:${{ github.sha }}
                  command: ["npm", "run", "migrate"]
                  envFrom:
                  - secretRef:
                      name: flamoral-db-secrets
                restartPolicy: Never
            backoffLimit: 3
          EOF

      - name: Wait for migration
        run: |
          kubectl wait --for=condition=complete job/db-migration-${{ github.sha }} \
            -n flamoral-dev --timeout=300s || \
          kubectl logs job/db-migration-${{ github.sha }} -n flamoral-dev

  # ===========================================================================
  # STAGE 5: Smoke Tests
  # ===========================================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-aks, run-migrations]
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run smoke tests
        run: |
          # Health check endpoints
          API_URL="${{ secrets.DEV_API_URL }}"

          echo "Testing API Gateway health..."
          curl -sf "${API_URL}/health" || echo "API Gateway health check failed"

          echo "Testing User Service health..."
          curl -sf "${API_URL}/api/users/health" || echo "User Service health check failed"

          echo "All smoke tests completed"

      - name: Run API tests
        run: |
          npm ci
          npm run test:api:dev || true
        working-directory: tests

  # ===========================================================================
  # STAGE 6: Notification
  # ===========================================================================
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## DEV Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-push-acr.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.terraform-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AKS Deploy | ${{ needs.deploy-aks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ needs.run-migrations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ secrets.DEV_URL }}" >> $GITHUB_STEP_SUMMARY

      - name: Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            DEV Deployment: ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
