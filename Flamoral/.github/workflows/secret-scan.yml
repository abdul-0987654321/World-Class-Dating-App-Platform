# =============================================================================
# SECRET SCANNING WORKFLOW - Flamoral Dating Platform
# =============================================================================
# Automated detection of secrets, API keys, and sensitive credentials
# Uses: Gitleaks for comprehensive secret detection
# Blocks: PRs with detected secrets, prevents credential leaks
# =============================================================================

name: Secret Leak Detection

on:
  pull_request:
    branches: [main, develop, staging, release/*]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan mode (full or diff)'
        type: choice
        options:
          - diff
          - full
        default: 'diff'

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 'v8.18.1'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  # ===========================================================================
  # STAGE 1: Gitleaks Secret Detection
  # ===========================================================================
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    outputs:
      secrets_found: ${{ steps.gitleaks.outputs.secrets_found }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Set scan parameters
        id: scan_params
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "scan_mode=diff" >> $GITHUB_OUTPUT
            echo "base_ref=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.scan_mode }}" == "full" ]]; then
            echo "scan_mode=full" >> $GITHUB_OUTPUT
            echo "base_ref=" >> $GITHUB_OUTPUT
          else
            echo "scan_mode=diff" >> $GITHUB_OUTPUT
            echo "base_ref=HEAD~1" >> $GITHUB_OUTPUT
          fi

      - name: Run Gitleaks Secret Scanner
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional: for enterprise features
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_NOTIFY_USER_LIST: ${{ secrets.SECURITY_TEAM_EMAILS }} # Optional
        with:
          args: >-
            --config=.gitleaks.toml
            --verbose
            --redact
            --report-format=sarif
            --report-path=gitleaks-report.sarif
            --exit-code=1
            ${{ steps.scan_params.outputs.scan_mode == 'diff' && format('--log-opts={0}..HEAD', steps.scan_params.outputs.base_ref) || '' }}

      - name: Set output
        if: always()
        run: |
          if [ "${{ steps.gitleaks.outcome }}" == "failure" ]; then
            echo "secrets_found=true" >> $GITHUB_OUTPUT
          else
            echo "secrets_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Gitleaks SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
          category: 'gitleaks-secrets'
        continue-on-error: true

      - name: Upload Gitleaks report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.sha }}
          path: gitleaks-report.sarif
          retention-days: 30

      - name: Generate detailed findings report
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "# Secret Detection Report" > secret_report.md
          echo "" >> secret_report.md
          echo "## Summary" >> secret_report.md
          echo "Secrets were detected in this commit/PR. Please review and remediate immediately." >> secret_report.md
          echo "" >> secret_report.md
          echo "## Next Steps" >> secret_report.md
          echo "1. **DO NOT** commit real secrets to the repository" >> secret_report.md
          echo "2. Remove the detected secrets from the code" >> secret_report.md
          echo "3. Rotate/invalidate any exposed credentials immediately" >> secret_report.md
          echo "4. Use environment variables or secret management services (Azure Key Vault, AWS Secrets Manager)" >> secret_report.md
          echo "5. Add patterns to .gitleaks.toml allowlist if they are false positives" >> secret_report.md
          echo "" >> secret_report.md
          echo "## Detected Issues" >> secret_report.md
          echo "Please check the Gitleaks SARIF report for detailed findings." >> secret_report.md
          echo "" >> secret_report.md
          echo "## Resources" >> secret_report.md
          echo "- [Flamoral Security Guide](docs/security/secret-management.md)" >> secret_report.md
          echo "- [Gitleaks Documentation](https://github.com/gitleaks/gitleaks)" >> secret_report.md
          echo "- [OWASP Secret Management](https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password)" >> secret_report.md

      - name: Upload secret report
        if: steps.gitleaks.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: secret-detection-report-${{ github.sha }}
          path: secret_report.md
          retention-days: 90

  # ===========================================================================
  # STAGE 2: TruffleHog Secret Detection (Additional Layer)
  # ===========================================================================
  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: HEAD
          extra_args: >-
            --only-verified
            --fail
            --exclude-paths=.trufflehogignore

  # ===========================================================================
  # STAGE 3: Custom Pattern Detection (Flamoral-Specific)
  # ===========================================================================
  custom-secret-detection:
    name: Custom Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan for Flamoral-specific secrets
        id: custom_scan
        run: |
          echo "Scanning for payment provider keys..."

          # Define dangerous patterns (excluding .env.example files)
          STRIPE_LIVE_KEY=$(git diff --cached --name-only | grep -v "\.env\.example" | xargs grep -l "sk_live_" || true)
          PAYSTACK_KEY=$(git diff --cached --name-only | grep -v "\.env\.example" | xargs grep -l "sk_live_.*paystack" -i || true)
          FLUTTERWAVE_KEY=$(git diff --cached --name-only | grep -v "\.env\.example" | xargs grep -l "FLWSECK-" || true)
          AZURE_CONN=$(git diff --cached --name-only | grep -v "\.env\.example" | xargs grep -l "AccountKey=.*==" || true)

          if [[ -n "$STRIPE_LIVE_KEY" ]] || [[ -n "$PAYSTACK_KEY" ]] || [[ -n "$FLUTTERWAVE_KEY" ]] || [[ -n "$AZURE_CONN" ]]; then
            echo "custom_secrets_found=true" >> $GITHUB_OUTPUT
            echo "WARNING: Detected potential live payment credentials!"
            echo "Files: $STRIPE_LIVE_KEY $PAYSTACK_KEY $FLUTTERWAVE_KEY $AZURE_CONN"
          else
            echo "custom_secrets_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR with custom findings
        if: steps.custom_scan.outputs.custom_secrets_found == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **CRITICAL SECURITY ALERT** ⚠️\n\n' +
                    'This PR contains potential **LIVE payment credentials**.\n\n' +
                    '**IMMEDIATE ACTION REQUIRED:**\n' +
                    '1. ❌ Remove all live API keys from the code\n' +
                    '2. 🔄 Rotate/invalidate the exposed credentials\n' +
                    '3. 🔐 Use environment variables or Azure Key Vault\n' +
                    '4. ✅ Re-push after remediation\n\n' +
                    '**Detected Patterns:**\n' +
                    '- Stripe live keys (sk_live_)\n' +
                    '- Paystack keys\n' +
                    '- Flutterwave keys (FLWSECK-)\n' +
                    '- Azure connection strings\n\n' +
                    'This PR will be **BLOCKED** until secrets are removed.'
            })

  # ===========================================================================
  # STAGE 4: Security Analysis and Reporting
  # ===========================================================================
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [gitleaks-scan, trufflehog-scan, custom-secret-detection]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Secret Scanning Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | ${{ needs.trufflehog-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Custom Patterns | ${{ needs.custom-secret-detection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.gitleaks-scan.outputs.secrets_found }}" == "true" ]]; then
            echo "## ⚠️ SECRETS DETECTED ⚠️" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more scanners detected potential secrets in this commit/PR." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Remediation Steps:" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the Gitleaks report in the Security tab" >> $GITHUB_STEP_SUMMARY
            echo "2. Remove all detected secrets from the codebase" >> $GITHUB_STEP_SUMMARY
            echo "3. Rotate any exposed credentials immediately" >> $GITHUB_STEP_SUMMARY
            echo "4. Use Azure Key Vault or environment variables for secrets" >> $GITHUB_STEP_SUMMARY
            echo "5. Add false positives to .gitleaks.toml allowlist" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ No Secrets Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All secret scanners completed successfully with no findings." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify security team
        if: needs.gitleaks-scan.outputs.secrets_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Create a high-priority security issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 SECURITY ALERT: Secrets Detected in Commit ' + context.sha.substring(0, 7),
              body: '## 🚨 Critical Security Alert\n\n' +
                    'Automated secret scanning has detected potential credentials in the repository.\n\n' +
                    '### Details:\n' +
                    '- **Commit**: `' + context.sha + '`\n' +
                    '- **Branch**: `' + context.ref + '`\n' +
                    '- **Author**: @' + context.actor + '\n' +
                    '- **PR**: ' + (context.payload.pull_request ? '#' + context.payload.pull_request.number : 'N/A') + '\n\n' +
                    '### Immediate Actions Required:\n' +
                    '- [ ] Review Gitleaks SARIF report\n' +
                    '- [ ] Identify exposed credentials\n' +
                    '- [ ] Rotate/invalidate compromised secrets\n' +
                    '- [ ] Remove secrets from code\n' +
                    '- [ ] Verify no secrets in git history\n' +
                    '- [ ] Update secret management practices\n\n' +
                    '### Links:\n' +
                    '- [Workflow Run](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ')\n' +
                    '- [Security Tab](' + context.payload.repository.html_url + '/security)\n\n' +
                    '**This issue has been created automatically by the secret scanning workflow.**',
              labels: ['security', 'critical', 'secret-leak'],
              assignees: process.env.SECURITY_TEAM_GITHUB_USERS ? process.env.SECURITY_TEAM_GITHUB_USERS.split(',') : []
            });

            console.log('Security issue created:', issue.data.html_url);
        continue-on-error: true
        env:
          SECURITY_TEAM_GITHUB_USERS: ${{ secrets.SECURITY_TEAM_GITHUB_USERS }}

  # ===========================================================================
  # STAGE 5: Block PR if Secrets Detected
  # ===========================================================================
  block-on-secrets:
    name: Block PR on Secret Detection
    runs-on: ubuntu-latest
    needs: [gitleaks-scan, trufflehog-scan, custom-secret-detection]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Check for secrets and fail
        run: |
          if [[ "${{ needs.gitleaks-scan.outputs.secrets_found }}" == "true" ]]; then
            echo "::error::Secrets detected! This PR cannot be merged."
            echo "::error::Please remove all secrets and rotate any exposed credentials."
            exit 1
          fi

          echo "✅ No secrets detected. PR can proceed."

      - name: Add PR label
        if: needs.gitleaks-scan.outputs.secrets_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['security-blocked', 'secrets-detected']
            });
        continue-on-error: true

      - name: Update PR status
        if: needs.gitleaks-scan.outputs.secrets_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🚫 PR BLOCKED - Secrets Detected\n\n' +
                    'This PR has been automatically blocked because secret scanning detected potential credentials.\n\n' +
                    '### ⚠️ What to do:\n' +
                    '1. **Review** the Gitleaks report in the workflow logs\n' +
                    '2. **Remove** all detected secrets from your code\n' +
                    '3. **Rotate** any exposed credentials immediately:\n' +
                    '   - Stripe keys (sk_live_, sk_test_)\n' +
                    '   - Paystack keys\n' +
                    '   - Flutterwave keys\n' +
                    '   - Azure connection strings\n' +
                    '   - Database passwords\n' +
                    '4. **Use** environment variables or Azure Key Vault for secrets\n' +
                    '5. **Re-push** your changes after remediation\n\n' +
                    '### ℹ️ If this is a false positive:\n' +
                    '- Add the pattern to `.gitleaks.toml` allowlist\n' +
                    '- Ensure `.env.example` files only contain placeholders\n' +
                    '- Contact the security team for assistance\n\n' +
                    '**This PR will remain blocked until all secrets are removed.**'
            });
        continue-on-error: true

  # ===========================================================================
  # STAGE 6: Success Notification
  # ===========================================================================
  scan-success:
    name: Secret Scan Passed
    runs-on: ubuntu-latest
    needs: [gitleaks-scan, trufflehog-scan, custom-secret-detection]
    if: |
      always() &&
      needs.gitleaks-scan.outputs.secrets_found != 'true' &&
      needs.gitleaks-scan.result != 'failure'

    steps:
      - name: Post success comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Secret Scanning Passed**\n\n' +
                    'No secrets or credentials were detected in this PR.\n\n' +
                    '**Scans performed:**\n' +
                    '- Gitleaks (comprehensive secret detection)\n' +
                    '- TruffleHog (additional verification)\n' +
                    '- Custom Flamoral patterns (payment providers)\n\n' +
                    '_This is an automated security check._'
            });
        continue-on-error: true

      - name: Success summary
        run: |
          echo "::notice::All secret scanning checks passed successfully"
          echo "No credentials or secrets detected in the codebase"
