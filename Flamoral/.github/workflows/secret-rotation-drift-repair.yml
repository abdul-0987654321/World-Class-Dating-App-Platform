# =============================================================================
# SECRET ROTATION & DRIFT REPAIR PIPELINE
# =============================================================================
# Automated secret rotation, Key Vault sync, and drift repair capabilities
# Part of the Full SaaS Multi-Environment security system
# =============================================================================

name: Secret Rotation & Drift Repair

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly drift check at 2 AM UTC on Sundays
    - cron: '0 3 1 */3 *'  # JWT rotation every 90 days at 3 AM UTC on 1st day
    - cron: '0 4 1 */6 *'  # Database credential rotation every 180 days
    - cron: '0 5 15 * *'  # API keys rotation monthly on 15th
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - rotate-secrets
          - rotate-jwt-only
          - rotate-db-only
          - rotate-api-keys-only
          - sync-keyvault
          - repair-drift
          - full-maintenance
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - all
          - dev
          - staging
          - prod
      secret_type:
        description: 'Type of secret to rotate (for targeted rotation)'
        required: false
        type: choice
        options:
          - all
          - jwt
          - database
          - api-keys
          - encryption
          - oauth

concurrency:
  group: secret-rotation
  cancel-in-progress: false

env:
  KEY_VAULT_DEV: flamoral-dev-kv
  KEY_VAULT_STAGING: flamoral-staging-kv
  KEY_VAULT_PROD: flamoral-prod-kv

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  # ===========================================================================
  # STAGE 1: Secret Audit
  # ===========================================================================
  secret-audit:
    name: Audit Secrets
    runs-on: ubuntu-latest
    outputs:
      needs_rotation: ${{ steps.audit.outputs.needs_rotation }}
      expired_secrets: ${{ steps.audit.outputs.expired_secrets }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Audit Key Vault secrets
        id: audit
        run: |
          echo "## Secret Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          NEEDS_ROTATION="false"
          EXPIRED_SECRETS=""

          for KV_NAME in "${{ env.KEY_VAULT_DEV }}" "${{ env.KEY_VAULT_STAGING }}" "${{ env.KEY_VAULT_PROD }}"; do
            echo "### $KV_NAME" >> $GITHUB_STEP_SUMMARY

            # Get secret list
            SECRETS=$(az keyvault secret list --vault-name $KV_NAME --query "[].{name:name, enabled:attributes.enabled, expires:attributes.expires}" -o json 2>/dev/null || echo "[]")

            if [ "$SECRETS" != "[]" ]; then
              echo "$SECRETS" | jq -r '.[] | "- \(.name): enabled=\(.enabled), expires=\(.expires)"' >> $GITHUB_STEP_SUMMARY

              # Check for expiring secrets (within 30 days)
              CURRENT_DATE=$(date +%s)
              THIRTY_DAYS=$((30 * 24 * 60 * 60))

              echo "$SECRETS" | jq -r '.[] | select(.expires != null) | "\(.name) \(.expires)"' | while read name expires; do
                if [ -n "$expires" ]; then
                  EXPIRE_DATE=$(date -d "$expires" +%s 2>/dev/null || echo "0")
                  if [ $((EXPIRE_DATE - CURRENT_DATE)) -lt $THIRTY_DAYS ]; then
                    NEEDS_ROTATION="true"
                    EXPIRED_SECRETS="$EXPIRED_SECRETS $name"
                  fi
                fi
              done
            else
              echo "- Unable to access or no secrets found" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
          done

          echo "needs_rotation=$NEEDS_ROTATION" >> $GITHUB_OUTPUT
          echo "expired_secrets=$EXPIRED_SECRETS" >> $GITHUB_OUTPUT
        continue-on-error: true

  # ===========================================================================
  # STAGE 2: Rotate Database Credentials
  # ===========================================================================
  rotate-db-credentials:
    name: Rotate Database Credentials
    runs-on: ubuntu-latest
    needs: secret-audit
    if: |
      github.event.inputs.operation == 'rotate-secrets' ||
      github.event.inputs.operation == 'full-maintenance' ||
      needs.secret-audit.outputs.needs_rotation == 'true'
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Generate new database password
        id: newpass
        run: |
          NEW_PASSWORD=$(openssl rand -base64 32 | tr -dc 'a-zA-Z0-9!@#$%' | head -c 32)
          echo "::add-mask::$NEW_PASSWORD"
          echo "password=$NEW_PASSWORD" >> $GITHUB_OUTPUT

      - name: Update PostgreSQL password (dev)
        if: github.event.inputs.environment == 'all' || github.event.inputs.environment == 'dev'
        run: |
          echo "Updating PostgreSQL password for dev environment..."
          # Update Azure PostgreSQL
          az postgres flexible-server parameter set \
            --resource-group flamoral-dev-rg \
            --server-name flamoral-dev-db \
            --name password \
            --value "${{ steps.newpass.outputs.password }}" 2>/dev/null || echo "Skipping DB password update"

          # Update Key Vault
          az keyvault secret set \
            --vault-name ${{ env.KEY_VAULT_DEV }} \
            --name "db-password" \
            --value "${{ steps.newpass.outputs.password }}" \
            --expires $(date -d "+90 days" -u +"%Y-%m-%dT%H:%M:%SZ") 2>/dev/null || echo "Skipping KV update"

          echo "Database credentials rotated for dev" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Trigger AKS secret refresh
        run: |
          # Restart deployments to pick up new secrets
          az aks get-credentials \
            --resource-group flamoral-dev-rg \
            --name flamoral-dev-aks 2>/dev/null || true

          kubectl rollout restart deployment -n flamoral-dev 2>/dev/null || echo "Unable to restart deployments"
        continue-on-error: true

  # ===========================================================================
  # STAGE 3: Rotate API Keys
  # ===========================================================================
  rotate-api-keys:
    name: Rotate API Keys
    runs-on: ubuntu-latest
    needs: secret-audit
    if: |
      github.event.inputs.operation == 'rotate-secrets' ||
      github.event.inputs.operation == 'full-maintenance'
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run JWT rotation script with dual-key transition
        run: |
          chmod +x scripts/rotate-jwt-secrets.sh

          KV_NAME="${{ env.KEY_VAULT_DEV }}"
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            KV_NAME="${{ env.KEY_VAULT_STAGING }}"
          elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            KV_NAME="${{ env.KEY_VAULT_PROD }}"
          fi

          ./scripts/rotate-jwt-secrets.sh \
            --vault-name "$KV_NAME" \
            --environment "${{ github.event.inputs.environment || 'dev' }}" \
            --transition-period-hours 24

          echo "## JWT Rotation Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Vault: $KV_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- Dual-key transition period: 24 hours" >> $GITHUB_STEP_SUMMARY
          echo "- New secrets will fully activate after transition" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Generate new API encryption key
        id: encryption
        run: |
          NEW_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$NEW_KEY"
          echo "key=$NEW_KEY" >> $GITHUB_OUTPUT

      - name: Update encryption key in Key Vault
        run: |
          KV_NAME="${{ env.KEY_VAULT_DEV }}"
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            KV_NAME="${{ env.KEY_VAULT_STAGING }}"
          elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            KV_NAME="${{ env.KEY_VAULT_PROD }}"
          fi

          az keyvault secret set \
            --vault-name $KV_NAME \
            --name "encryption-key" \
            --value "${{ steps.encryption.outputs.key }}" \
            --expires $(date -d "+90 days" -u +"%Y-%m-%dT%H:%M:%SZ") 2>/dev/null || echo "Skipping encryption key update"

          echo "Encryption key rotated" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  # ===========================================================================
  # STAGE 4: Sync Key Vault to Kubernetes
  # ===========================================================================
  sync-keyvault-to-k8s:
    name: Sync Key Vault to Kubernetes
    runs-on: ubuntu-latest
    needs: [rotate-db-credentials, rotate-api-keys]
    if: |
      always() &&
      (github.event.inputs.operation == 'sync-keyvault' ||
       github.event.inputs.operation == 'full-maintenance' ||
       github.event.inputs.operation == 'rotate-secrets')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sync secrets to AKS (dev)
        if: github.event.inputs.environment == 'all' || github.event.inputs.environment == 'dev'
        run: |
          az aks get-credentials \
            --resource-group flamoral-dev-rg \
            --name flamoral-dev-aks 2>/dev/null || exit 0

          # Create or update secrets from Key Vault
          DB_PASSWORD=$(az keyvault secret show --vault-name ${{ env.KEY_VAULT_DEV }} --name "db-password" --query value -o tsv 2>/dev/null || echo "")
          JWT_SECRET=$(az keyvault secret show --vault-name ${{ env.KEY_VAULT_DEV }} --name "jwt-secret" --query value -o tsv 2>/dev/null || echo "")
          ENCRYPTION_KEY=$(az keyvault secret show --vault-name ${{ env.KEY_VAULT_DEV }} --name "encryption-key" --query value -o tsv 2>/dev/null || echo "")

          if [ -n "$DB_PASSWORD" ] && [ -n "$JWT_SECRET" ]; then
            kubectl create secret generic flamoral-secrets \
              --from-literal=db-password="$DB_PASSWORD" \
              --from-literal=jwt-secret="$JWT_SECRET" \
              --from-literal=encryption-key="$ENCRYPTION_KEY" \
              -n flamoral-dev \
              --dry-run=client -o yaml | kubectl apply -f -

            echo "Secrets synced to flamoral-dev namespace" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Restart deployments to apply new secrets
        run: |
          kubectl rollout restart deployment -n flamoral-dev 2>/dev/null || true
          echo "Deployments restarted" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  # ===========================================================================
  # STAGE 5: Terraform Drift Repair
  # ===========================================================================
  drift-repair:
    name: Terraform Drift Repair
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.operation == 'repair-drift' ||
      github.event.inputs.operation == 'full-maintenance'

    strategy:
      matrix:
        environment: [dev, test, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Determine TF directory
        id: dir
        run: |
          # All environments use standard naming
          echo "tf_dir=infrastructure/terraform/environments/${{ matrix.environment }}" >> $GITHUB_OUTPUT

      - name: Check for drift
        id: drift
        run: |
          cd ${{ steps.dir.outputs.tf_dir }}
          terraform init 2>/dev/null || exit 0

          terraform plan -detailed-exitcode -no-color 2>&1 | tee drift-check.txt
          EXIT_CODE=${PIPESTATUS[0]}

          if [ $EXIT_CODE -eq 2 ]; then
            echo "has_drift=true" >> $GITHUB_OUTPUT
            echo "## Drift Detected - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "has_drift=false" >> $GITHUB_OUTPUT
            echo "## No Drift - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      - name: Create drift repair PR
        if: steps.drift.outputs.has_drift == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix: repair infrastructure drift in ${{ matrix.environment }} [auto]'
          title: '[Drift Repair] Infrastructure changes detected in ${{ matrix.environment }}'
          body: |
            ## Infrastructure Drift Detected

            The Self-Healing Agent detected drift in the **${{ matrix.environment }}** environment.

            ### Drift Details
            See the workflow run for full drift analysis.

            ### Recommended Actions
            1. Review the proposed Terraform changes
            2. Approve the terraform apply if changes are expected
            3. Investigate if changes were made outside of Terraform

            ---
            *Generated by Secret Rotation & Drift Repair Pipeline*
          branch: drift-repair/${{ matrix.environment }}-${{ github.run_number }}
          delete-branch: true
        continue-on-error: true

  # ===========================================================================
  # STAGE 6: AKS Manifest Drift Repair
  # ===========================================================================
  aks-drift-repair:
    name: AKS Manifest Drift Repair
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.operation == 'repair-drift' ||
      github.event.inputs.operation == 'full-maintenance'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Check AKS manifest drift (dev)
        run: |
          az aks get-credentials \
            --resource-group flamoral-dev-rg \
            --name flamoral-dev-aks 2>/dev/null || exit 0

          echo "## AKS Drift Check - dev" >> $GITHUB_STEP_SUMMARY

          # Check Helm releases
          helm list -n flamoral-dev >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No Helm releases found" >> $GITHUB_STEP_SUMMARY

          # Dry-run upgrade to detect drift
          helm upgrade --install flamoral-dev ./infrastructure/helm/flamoral \
            --namespace flamoral-dev \
            --values ./infrastructure/helm/flamoral/values-dev.yaml \
            --dry-run 2>&1 | head -50 >> $GITHUB_STEP_SUMMARY || echo "Drift check completed" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  # ===========================================================================
  # NOTIFICATION
  # ===========================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [secret-audit, rotate-db-credentials, rotate-api-keys, sync-keyvault-to-k8s, drift-repair, aks-drift-repair]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Secret Rotation & Drift Repair Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Audit | ${{ needs.secret-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DB Credential Rotation | ${{ needs.rotate-db-credentials.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Key Rotation | ${{ needs.rotate-api-keys.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault Sync | ${{ needs.sync-keyvault-to-k8s.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Drift Repair | ${{ needs.drift-repair.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AKS Drift Repair | ${{ needs.aks-drift-repair.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Operation:** ${{ github.event.inputs.operation || 'scheduled' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'all' }}" >> $GITHUB_STEP_SUMMARY

      - name: Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#security-ops'
          text: |
            Secret Rotation & Drift Repair: ${{ job.status }}
            Operation: ${{ github.event.inputs.operation || 'scheduled' }}
            Environment: ${{ github.event.inputs.environment || 'all' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
