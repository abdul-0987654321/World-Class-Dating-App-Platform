# =============================================================================
# ENHANCED SELF-HEALING AGENT - Comprehensive Health Monitoring & Auto-Repair
# =============================================================================
# Advanced self-healing capabilities:
# - AKS cluster health monitoring
# - Pod and service health checks
# - Endpoint availability monitoring
# - Workflow health analysis
# - Safe auto-remediation playbooks
# - Intelligent escalation
# =============================================================================

name: Enhanced Self-Healing Agent

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:
    inputs:
      force_scan:
        description: 'Force full system scan'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run - report only, no fixes'
        type: boolean
        default: false
      environment:
        description: 'Target environment (all for all environments)'
        type: choice
        options:
          - all
          - dev
          - staging
          - prod
        default: all

concurrency:
  group: self-healing-enhanced
  cancel-in-progress: false

env:
  HEALTH_CHECK_TIMEOUT: 30
  MAX_RESTART_ATTEMPTS: 3

permissions:
  contents: write
  pull-requests: write
  actions: read
  security-events: read
  issues: write
  id-token: write

jobs:
  # ===========================================================================
  # STAGE 1: AKS Cluster Health Check
  # ===========================================================================
  aks-health:
    name: AKS Health - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    outputs:
      dev_status: ${{ steps.health.outputs.dev_status }}
      staging_status: ${{ steps.health.outputs.staging_status }}
      prod_status: ${{ steps.health.outputs.prod_status }}

    steps:
      - name: Check environment filter
        id: filter
        run: |
          INPUT_ENV="${{ github.event.inputs.environment }}"
          MATRIX_ENV="${{ matrix.environment }}"

          if [ "$INPUT_ENV" = "all" ] || [ "$INPUT_ENV" = "$MATRIX_ENV" ] || [ -z "$INPUT_ENV" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        if: steps.filter.outputs.should_run == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        if: steps.filter.outputs.should_run == 'true'
        id: aks
        run: |
          case "${{ matrix.environment }}" in
            dev)
              RG="flamoral-dev-rg"
              CLUSTER="flamoral-dev-aks"
              ;;
            staging)
              RG="flamoral-staging-rg"
              CLUSTER="flamoral-staging-aks"
              ;;
            prod)
              RG="flamoral-prod-rg"
              CLUSTER="flamoral-prod-aks"
              ;;
          esac

          echo "resource_group=$RG" >> $GITHUB_OUTPUT
          echo "cluster_name=$CLUSTER" >> $GITHUB_OUTPUT

          # Check cluster exists and is accessible
          CLUSTER_STATE=$(az aks show --resource-group $RG --name $CLUSTER --query "powerState.code" -o tsv 2>/dev/null || echo "NotFound")

          if [ "$CLUSTER_STATE" = "Running" ]; then
            az aks get-credentials --resource-group $RG --name $CLUSTER --overwrite-existing
            echo "cluster_available=true" >> $GITHUB_OUTPUT
          else
            echo "cluster_available=false" >> $GITHUB_OUTPUT
            echo "cluster_state=$CLUSTER_STATE" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Check node health
        if: steps.filter.outputs.should_run == 'true' && steps.aks.outputs.cluster_available == 'true'
        id: nodes
        run: |
          echo "## Node Health - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY

          # Get node status
          NODES=$(kubectl get nodes -o json 2>/dev/null || echo '{"items":[]}')

          TOTAL_NODES=$(echo "$NODES" | jq '.items | length')
          READY_NODES=$(echo "$NODES" | jq '[.items[] | select(.status.conditions[] | select(.type=="Ready" and .status=="True"))] | length')
          NOT_READY=$(echo "$NODES" | jq '[.items[] | select(.status.conditions[] | select(.type=="Ready" and .status!="True"))] | length')

          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Nodes | $TOTAL_NODES |" >> $GITHUB_STEP_SUMMARY
          echo "| Ready | $READY_NODES |" >> $GITHUB_STEP_SUMMARY
          echo "| Not Ready | $NOT_READY |" >> $GITHUB_STEP_SUMMARY

          if [ "$NOT_READY" -gt 0 ]; then
            echo "node_issues=true" >> $GITHUB_OUTPUT
            echo "not_ready_count=$NOT_READY" >> $GITHUB_OUTPUT
          else
            echo "node_issues=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Check pod health
        if: steps.filter.outputs.should_run == 'true' && steps.aks.outputs.cluster_available == 'true'
        id: pods
        run: |
          NAMESPACE="flamoral-${{ matrix.environment }}"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pod Health - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY

          # Get all pods in namespace
          PODS=$(kubectl get pods -n $NAMESPACE -o json 2>/dev/null || echo '{"items":[]}')

          TOTAL_PODS=$(echo "$PODS" | jq '.items | length')
          RUNNING_PODS=$(echo "$PODS" | jq '[.items[] | select(.status.phase=="Running")] | length')
          FAILED_PODS=$(echo "$PODS" | jq '[.items[] | select(.status.phase=="Failed")] | length')
          PENDING_PODS=$(echo "$PODS" | jq '[.items[] | select(.status.phase=="Pending")] | length')
          CRASHLOOP_PODS=$(echo "$PODS" | jq '[.items[] | select(.status.containerStatuses[]?.state.waiting?.reason=="CrashLoopBackOff")] | length')

          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total | $TOTAL_PODS |" >> $GITHUB_STEP_SUMMARY
          echo "| Running | $RUNNING_PODS |" >> $GITHUB_STEP_SUMMARY
          echo "| Pending | $PENDING_PODS |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILED_PODS |" >> $GITHUB_STEP_SUMMARY
          echo "| CrashLoopBackOff | $CRASHLOOP_PODS |" >> $GITHUB_STEP_SUMMARY

          # Identify unhealthy pods
          UNHEALTHY_PODS=$(echo "$PODS" | jq -r '.items[] | select(.status.phase != "Running" and .status.phase != "Succeeded") | .metadata.name')

          if [ -n "$UNHEALTHY_PODS" ]; then
            echo "pod_issues=true" >> $GITHUB_OUTPUT
            echo "unhealthy_pods<<EOF" >> $GITHUB_OUTPUT
            echo "$UNHEALTHY_PODS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "crashloop_count=$CRASHLOOP_PODS" >> $GITHUB_OUTPUT
          else
            echo "pod_issues=false" >> $GITHUB_OUTPUT
          fi

          # Export pod names for remediation
          echo "$UNHEALTHY_PODS" > /tmp/unhealthy-pods.txt
        continue-on-error: true

      - name: Check service endpoints
        if: steps.filter.outputs.should_run == 'true' && steps.aks.outputs.cluster_available == 'true'
        id: services
        run: |
          NAMESPACE="flamoral-${{ matrix.environment }}"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Service Endpoints - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY

          # Check services have endpoints
          SERVICES=$(kubectl get svc -n $NAMESPACE -o json 2>/dev/null || echo '{"items":[]}')

          echo "| Service | Type | Endpoints |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|-----------|" >> $GITHUB_STEP_SUMMARY

          SERVICES_WITHOUT_ENDPOINTS=""

          echo "$SERVICES" | jq -r '.items[] | "\(.metadata.name) \(.spec.type)"' | while read name type; do
            ENDPOINT_COUNT=$(kubectl get endpoints $name -n $NAMESPACE -o json 2>/dev/null | jq '.subsets[]?.addresses | length // 0' || echo "0")
            echo "| $name | $type | $ENDPOINT_COUNT |" >> $GITHUB_STEP_SUMMARY

            if [ "$ENDPOINT_COUNT" -eq 0 ] && [ "$type" != "ExternalName" ]; then
              SERVICES_WITHOUT_ENDPOINTS="$SERVICES_WITHOUT_ENDPOINTS $name"
            fi
          done

          if [ -n "$SERVICES_WITHOUT_ENDPOINTS" ]; then
            echo "service_issues=true" >> $GITHUB_OUTPUT
            echo "services_without_endpoints=$SERVICES_WITHOUT_ENDPOINTS" >> $GITHUB_OUTPUT
          else
            echo "service_issues=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Consolidate health status
        if: steps.filter.outputs.should_run == 'true'
        id: health
        run: |
          STATUS="healthy"

          if [ "${{ steps.aks.outputs.cluster_available }}" != "true" ]; then
            STATUS="critical"
          elif [ "${{ steps.nodes.outputs.node_issues }}" = "true" ]; then
            STATUS="degraded"
          elif [ "${{ steps.pods.outputs.pod_issues }}" = "true" ]; then
            if [ "${{ steps.pods.outputs.crashloop_count }}" -gt 0 ]; then
              STATUS="degraded"
            else
              STATUS="warning"
            fi
          elif [ "${{ steps.services.outputs.service_issues }}" = "true" ]; then
            STATUS="warning"
          fi

          echo "${{ matrix.environment }}_status=$STATUS" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Overall Status: $STATUS" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # STAGE 2: Endpoint Health Check
  # ===========================================================================
  endpoint-health:
    name: Endpoint Health Check
    runs-on: ubuntu-latest
    outputs:
      endpoints_healthy: ${{ steps.check.outputs.all_healthy }}

    steps:
      - name: Define endpoints to check
        id: endpoints
        run: |
          # Define critical endpoints per environment
          cat << 'EOF' > endpoints.json
          {
            "dev": [
              {"name": "API Gateway", "url": "https://dev-api.flamoral.com/health", "expected_status": 200},
              {"name": "Auth Service", "url": "https://dev-api.flamoral.com/api/v1/auth/health", "expected_status": 200}
            ],
            "staging": [
              {"name": "API Gateway", "url": "https://staging-api.flamoral.com/health", "expected_status": 200},
              {"name": "Auth Service", "url": "https://staging-api.flamoral.com/api/v1/auth/health", "expected_status": 200}
            ],
            "prod": [
              {"name": "API Gateway", "url": "https://api.flamoral.com/health", "expected_status": 200},
              {"name": "Auth Service", "url": "https://api.flamoral.com/api/v1/auth/health", "expected_status": 200},
              {"name": "Web App", "url": "https://flamoral.com", "expected_status": 200}
            ]
          }
          EOF

      - name: Check endpoint health
        id: check
        run: |
          echo "## Endpoint Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Endpoint | Status | Response Time |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|----------|--------|---------------|" >> $GITHUB_STEP_SUMMARY

          ALL_HEALTHY="true"
          FAILED_ENDPOINTS=""

          for env in dev staging prod; do
            # Check if environment should be tested
            INPUT_ENV="${{ github.event.inputs.environment }}"
            if [ "$INPUT_ENV" != "all" ] && [ "$INPUT_ENV" != "$env" ] && [ -n "$INPUT_ENV" ]; then
              continue
            fi

            ENDPOINTS=$(jq -r ".${env}[]" endpoints.json 2>/dev/null || echo "")

            if [ -z "$ENDPOINTS" ]; then
              continue
            fi

            jq -c ".${env}[]" endpoints.json | while read endpoint; do
              NAME=$(echo "$endpoint" | jq -r '.name')
              URL=$(echo "$endpoint" | jq -r '.url')
              EXPECTED=$(echo "$endpoint" | jq -r '.expected_status')

              # Make request with timeout
              START_TIME=$(date +%s%N)
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$URL" 2>/dev/null || echo "000")
              END_TIME=$(date +%s%N)

              RESPONSE_TIME=$(( (END_TIME - START_TIME) / 1000000 ))ms

              if [ "$RESPONSE" = "$EXPECTED" ]; then
                STATUS=":white_check_mark: $RESPONSE"
              else
                STATUS=":x: $RESPONSE"
                ALL_HEALTHY="false"
                FAILED_ENDPOINTS="$FAILED_ENDPOINTS $NAME($env)"
              fi

              echo "| $env | $NAME | $STATUS | $RESPONSE_TIME |" >> $GITHUB_STEP_SUMMARY
            done
          done

          echo "all_healthy=$ALL_HEALTHY" >> $GITHUB_OUTPUT

          if [ "$ALL_HEALTHY" != "true" ]; then
            echo "failed_endpoints=$FAILED_ENDPOINTS" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

  # ===========================================================================
  # STAGE 3: Workflow Health Monitor
  # ===========================================================================
  workflow-health:
    name: Workflow Health Monitor
    runs-on: ubuntu-latest
    outputs:
      has_failures: ${{ steps.check.outputs.has_failures }}
      failed_workflows: ${{ steps.check.outputs.failed_workflows }}

    steps:
      - name: Check recent workflow runs
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // Get workflow runs from last 4 hours
            const fourHoursAgo = new Date(Date.now() - 4 * 60 * 60 * 1000).toISOString();

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              created: `>${fourHoursAgo}`,
              per_page: 100
            });

            // Exclude self-healing workflows from analysis
            const excludedWorkflows = ['Self-Healing', 'Enhanced Self-Healing'];

            const failedRuns = runs.data.workflow_runs.filter(run =>
              run.conclusion === 'failure' &&
              !excludedWorkflows.some(excluded => run.name.includes(excluded))
            );

            // Group failures by workflow
            const failuresByWorkflow = {};
            failedRuns.forEach(run => {
              if (!failuresByWorkflow[run.name]) {
                failuresByWorkflow[run.name] = [];
              }
              failuresByWorkflow[run.name].push({
                id: run.id,
                head_sha: run.head_sha,
                url: run.html_url,
                created_at: run.created_at
              });
            });

            // Generate summary
            let summary = '## Workflow Health\n\n';

            if (Object.keys(failuresByWorkflow).length > 0) {
              summary += '| Workflow | Failure Count | Latest Failure |\n';
              summary += '|----------|---------------|----------------|\n';

              for (const [workflow, failures] of Object.entries(failuresByWorkflow)) {
                const latestFailure = failures[0];
                summary += `| ${workflow} | ${failures.length} | [Run #${latestFailure.id}](${latestFailure.url}) |\n`;
              }

              core.setOutput('has_failures', 'true');
              core.setOutput('failed_workflows', JSON.stringify(Object.keys(failuresByWorkflow)));
            } else {
              summary += 'All workflows healthy - no failures in the last 4 hours.\n';
              core.setOutput('has_failures', 'false');
              core.setOutput('failed_workflows', '[]');
            }

            await core.summary.addRaw(summary).write();

  # ===========================================================================
  # STAGE 4: Auto-Remediation Playbooks
  # ===========================================================================
  auto-remediation:
    name: Auto-Remediation
    runs-on: ubuntu-latest
    needs: [aks-health, endpoint-health, workflow-health]
    if: |
      always() &&
      github.event.inputs.dry_run != 'true' &&
      (needs.aks-health.outputs.dev_status != 'healthy' ||
       needs.aks-health.outputs.staging_status != 'healthy' ||
       needs.aks-health.outputs.prod_status != 'healthy' ||
       needs.endpoint-health.outputs.endpoints_healthy != 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Remediation - Restart failing pods (dev/staging only)
        id: restart_pods
        run: |
          echo "## Auto-Remediation Actions" >> $GITHUB_STEP_SUMMARY

          for env in dev staging; do
            STATUS_VAR="${env}_status"
            STATUS="${{ needs.aks-health.outputs[format('{0}_status', env)] }}"

            if [ "$STATUS" = "degraded" ] || [ "$STATUS" = "warning" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Remediating $env environment" >> $GITHUB_STEP_SUMMARY

              case "$env" in
                dev)
                  RG="flamoral-dev-rg"
                  CLUSTER="flamoral-dev-aks"
                  ;;
                staging)
                  RG="flamoral-staging-rg"
                  CLUSTER="flamoral-staging-aks"
                  ;;
              esac

              az aks get-credentials --resource-group $RG --name $CLUSTER --overwrite-existing 2>/dev/null || continue

              NAMESPACE="flamoral-$env"

              # Delete pods in CrashLoopBackOff
              CRASHLOOP_PODS=$(kubectl get pods -n $NAMESPACE -o json 2>/dev/null | jq -r '.items[] | select(.status.containerStatuses[]?.state.waiting?.reason=="CrashLoopBackOff") | .metadata.name')

              if [ -n "$CRASHLOOP_PODS" ]; then
                echo "Restarting CrashLoopBackOff pods:" >> $GITHUB_STEP_SUMMARY
                for pod in $CRASHLOOP_PODS; do
                  kubectl delete pod $pod -n $NAMESPACE --grace-period=30 2>/dev/null || true
                  echo "- Deleted pod: $pod" >> $GITHUB_STEP_SUMMARY
                done
              fi

              # Restart deployments with failing pods (up to 3)
              FAILED_DEPLOYMENTS=$(kubectl get pods -n $NAMESPACE -o json 2>/dev/null | jq -r '.items[] | select(.status.phase != "Running" and .status.phase != "Succeeded") | .metadata.ownerReferences[]? | select(.kind=="ReplicaSet") | .name' | sort -u | head -3)

              if [ -n "$FAILED_DEPLOYMENTS" ]; then
                echo "Rolling restart affected deployments:" >> $GITHUB_STEP_SUMMARY
                for rs in $FAILED_DEPLOYMENTS; do
                  DEPLOYMENT=$(kubectl get rs $rs -n $NAMESPACE -o jsonpath='{.metadata.ownerReferences[0].name}' 2>/dev/null || echo "")
                  if [ -n "$DEPLOYMENT" ]; then
                    kubectl rollout restart deployment/$DEPLOYMENT -n $NAMESPACE 2>/dev/null || true
                    echo "- Restarted: $DEPLOYMENT" >> $GITHUB_STEP_SUMMARY
                  fi
                done
              fi
            fi
          done
        continue-on-error: true

      - name: Remediation - Clear stuck jobs
        run: |
          # Clean up completed/failed jobs older than 1 hour
          for env in dev staging; do
            case "$env" in
              dev)
                RG="flamoral-dev-rg"
                CLUSTER="flamoral-dev-aks"
                ;;
              staging)
                RG="flamoral-staging-rg"
                CLUSTER="flamoral-staging-aks"
                ;;
            esac

            az aks get-credentials --resource-group $RG --name $CLUSTER --overwrite-existing 2>/dev/null || continue

            NAMESPACE="flamoral-$env"

            # Delete completed/failed jobs
            kubectl delete jobs --field-selector status.successful=1 -n $NAMESPACE 2>/dev/null || true
            kubectl delete jobs --field-selector status.failed=1 -n $NAMESPACE 2>/dev/null || true
          done
        continue-on-error: true

      - name: Skip production auto-remediation
        if: needs.aks-health.outputs.prod_status != 'healthy'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Production Environment" >> $GITHUB_STEP_SUMMARY
          echo ":warning: **Production auto-remediation skipped - manual intervention required**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.aks-health.outputs.prod_status }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # STAGE 5: Generate Health Report & Notifications
  # ===========================================================================
  generate-report:
    name: Generate Health Report
    runs-on: ubuntu-latest
    needs: [aks-health, endpoint-health, workflow-health, auto-remediation]
    if: always()

    steps:
      - name: Generate comprehensive report
        id: report
        run: |
          mkdir -p reports

          # Determine overall health
          OVERALL_STATUS="healthy"

          DEV_STATUS="${{ needs.aks-health.outputs.dev_status || 'unknown' }}"
          STAGING_STATUS="${{ needs.aks-health.outputs.staging_status || 'unknown' }}"
          PROD_STATUS="${{ needs.aks-health.outputs.prod_status || 'unknown' }}"
          ENDPOINTS_HEALTHY="${{ needs.endpoint-health.outputs.endpoints_healthy || 'unknown' }}"
          WORKFLOW_FAILURES="${{ needs.workflow-health.outputs.has_failures || 'false' }}"

          if [ "$PROD_STATUS" = "critical" ] || [ "$PROD_STATUS" = "degraded" ]; then
            OVERALL_STATUS="critical"
          elif [ "$STAGING_STATUS" = "critical" ] || [ "$DEV_STATUS" = "critical" ]; then
            OVERALL_STATUS="degraded"
          elif [ "$ENDPOINTS_HEALTHY" != "true" ]; then
            OVERALL_STATUS="degraded"
          elif [ "$WORKFLOW_FAILURES" = "true" ]; then
            OVERALL_STATUS="warning"
          elif [ "$DEV_STATUS" != "healthy" ] || [ "$STAGING_STATUS" != "healthy" ]; then
            OVERALL_STATUS="warning"
          fi

          echo "overall_status=$OVERALL_STATUS" >> $GITHUB_OUTPUT

          # Generate JSON report
          cat << EOF > reports/health-report.json
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "overall_status": "$OVERALL_STATUS",
            "aks_health": {
              "dev": "$DEV_STATUS",
              "staging": "$STAGING_STATUS",
              "prod": "$PROD_STATUS"
            },
            "endpoints_healthy": $ENDPOINTS_HEALTHY,
            "workflow_failures": $WORKFLOW_FAILURES,
            "remediation_status": "${{ needs.auto-remediation.result }}"
          }
          EOF

          # Generate step summary
          echo "# Self-Healing Agent Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Status:** $OVERALL_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Environment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | AKS Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dev | $DEV_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging | $STAGING_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Prod | $PROD_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| AKS Health | ${{ needs.aks-health.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint Health | ${{ needs.endpoint-health.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow Health | ${{ needs.workflow-health.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-Remediation | ${{ needs.auto-remediation.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: reports/
          retention-days: 30

      - name: Create issue for critical status
        if: steps.report.outputs.overall_status == 'critical'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            await github.rest.issues.create({
              owner,
              repo,
              title: '[CRITICAL] System Health Alert - Immediate Attention Required',
              body: `## Critical System Health Alert

              The Enhanced Self-Healing Agent has detected critical issues requiring immediate attention.

              ### Status Summary
              - **Overall Status:** CRITICAL
              - **Detection Time:** ${new Date().toISOString()}
              - **Workflow Run:** ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}

              ### Environment Status
              - Dev: ${{ needs.aks-health.outputs.dev_status }}
              - Staging: ${{ needs.aks-health.outputs.staging_status }}
              - Prod: ${{ needs.aks-health.outputs.prod_status }}

              ### Immediate Actions Required
              1. Check AKS cluster health in Azure Portal
              2. Review pod logs for failing services
              3. Verify network connectivity and DNS
              4. Check for any ongoing Azure incidents

              ---
              *This issue was automatically created by the Enhanced Self-Healing Agent*`,
              labels: ['critical', 'health-alert', 'auto-generated']
            });

      - name: Notify Slack on critical/degraded
        if: steps.report.outputs.overall_status == 'critical' || steps.report.outputs.overall_status == 'degraded'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#infrastructure-alerts'
          text: |
            :rotating_light: *System Health Alert*

            *Status:* ${{ steps.report.outputs.overall_status }}
            *Dev:* ${{ needs.aks-health.outputs.dev_status }}
            *Staging:* ${{ needs.aks-health.outputs.staging_status }}
            *Prod:* ${{ needs.aks-health.outputs.prod_status }}

            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Update status badge
        run: |
          # Create status badge data for external dashboards
          cat << EOF > reports/status-badge.json
          {
            "schemaVersion": 1,
            "label": "System Health",
            "message": "${{ steps.report.outputs.overall_status }}",
            "color": "$([ '${{ steps.report.outputs.overall_status }}' = 'healthy' ] && echo 'green' || ([ '${{ steps.report.outputs.overall_status }}' = 'warning' ] && echo 'yellow' || echo 'red'))"
          }
          EOF
