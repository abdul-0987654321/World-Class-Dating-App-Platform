name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile-app/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  build-android:
    if: github.event.inputs.platform != 'ios'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'apps/mobile-app/pnpm-lock.yaml'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "production" ]; then
            eas build --platform android --profile production --non-interactive
          elif [ "${{ github.event.inputs.build_type }}" == "staging" ]; then
            eas build --platform android --profile preview --non-interactive
          else
            eas build --platform android --profile development --non-interactive
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-build
          path: apps/mobile-app/android/app/build/outputs/apk/
          retention-days: 14

  build-ios:
    if: github.event.inputs.platform != 'android'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'apps/mobile-app/pnpm-lock.yaml'

      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: apps/mobile-app/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "production" ]; then
            eas build --platform ios --profile production --non-interactive
          elif [ "${{ github.event.inputs.build_type }}" == "staging" ]; then
            eas build --platform ios --profile preview --non-interactive
          else
            eas build --platform ios --profile development --non-interactive
          fi

      - name: Upload to TestFlight
        if: github.event.inputs.build_type == 'production'
        run: eas submit --platform ios --latest --non-interactive

  notify:
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Mobile Build ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Mobile Build ${{ job.status }}*\n*Platform:* ${{ github.event.inputs.platform || 'all' }}\n*Type:* ${{ github.event.inputs.build_type || 'development' }}\n*Branch:* ${{ github.ref_name }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
