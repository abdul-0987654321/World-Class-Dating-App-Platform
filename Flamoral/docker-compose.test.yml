version: '3.8'

# Docker Compose configuration for running integration and E2E tests
# This setup provides isolated test dependencies with separate databases and services

services:
  # PostgreSQL Database for Testing
  postgres-test:
    image: postgres:16-alpine
    container_name: flamoral-postgres-test
    environment:
      POSTGRES_DB: flamoral_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flamoral-test-network
    tmpfs:
      - /var/lib/postgresql/data

  # Redis Cache for Testing
  redis-test:
    image: redis:7-alpine
    container_name: flamoral-redis-test
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flamoral-test-network
    tmpfs:
      - /data

  # MongoDB for Testing
  mongodb-test:
    image: mongo:7
    container_name: flamoral-mongodb-test
    environment:
      MONGO_INITDB_DATABASE: flamoral_test
    ports:
      - "27018:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flamoral-test-network
    tmpfs:
      - /data/db

  # RabbitMQ for Testing
  rabbitmq-test:
    image: rabbitmq:3-management-alpine
    container_name: flamoral-rabbitmq-test
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flamoral-test-network

  # Elasticsearch for Testing
  elasticsearch-test:
    image: elasticsearch:8.11.0
    container_name: flamoral-elasticsearch-test
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flamoral-test-network
    tmpfs:
      - /usr/share/elasticsearch/data

  # MinIO for S3-compatible storage testing
  minio-test:
    image: minio/minio:latest
    container_name: flamoral-minio-test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flamoral-test-network
    tmpfs:
      - /data

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: flamoral-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - flamoral-test-network

volumes:
  postgres_test_data:
    driver: local

networks:
  flamoral-test-network:
    driver: bridge
    name: flamoral-test-network
