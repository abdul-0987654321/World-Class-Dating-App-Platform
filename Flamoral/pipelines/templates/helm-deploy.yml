# Reusable template for deploying applications using Helm to AKS
# Parameters:
#   - chartName: Name of the Helm chart
#   - chartPath: Path to the Helm chart directory
#   - releaseName: Helm release name
#   - namespace: Kubernetes namespace
#   - environment: Environment name (dev, staging, prod)
#   - imageTag: Docker image tag to deploy
#   - acrLoginServer: ACR login server URL
#   - valueFiles: Array of values files to use
#   - additionalValues: Additional Helm values to set
#   - timeout: Helm deployment timeout (default: 10m)
#   - createNamespace: Create namespace if not exists (default: true)
#   - waitForCompletion: Wait for deployment to complete (default: true)

parameters:
  - name: chartName
    type: string
    displayName: 'Helm chart name'

  - name: chartPath
    type: string
    displayName: 'Path to Helm chart'

  - name: releaseName
    type: string
    displayName: 'Helm release name'

  - name: namespace
    type: string
    displayName: 'Kubernetes namespace'

  - name: environment
    type: string
    displayName: 'Environment'

  - name: imageTag
    type: string
    displayName: 'Docker image tag'

  - name: acrLoginServer
    type: string
    displayName: 'ACR login server'

  - name: valueFiles
    type: object
    displayName: 'Values files'
    default: []

  - name: additionalValues
    type: object
    displayName: 'Additional values'
    default: []

  - name: timeout
    type: string
    displayName: 'Deployment timeout'
    default: '10m'

  - name: createNamespace
    type: boolean
    displayName: 'Create namespace if not exists'
    default: true

  - name: waitForCompletion
    type: boolean
    displayName: 'Wait for deployment completion'
    default: true

  - name: atomic
    type: boolean
    displayName: 'Atomic deployment (rollback on failure)'
    default: true

  - name: maxHistory
    type: number
    displayName: 'Maximum number of revisions to keep'
    default: 10

  - name: enableRollback
    type: boolean
    displayName: 'Enable automatic rollback on failure'
    default: true

steps:
  # Step 1: Display deployment information
  - script: |
      echo "========================================="
      echo "Helm Deployment: ${{ parameters.releaseName }}"
      echo "========================================="
      echo "Chart: ${{ parameters.chartName }}"
      echo "Chart Path: ${{ parameters.chartPath }}"
      echo "Release Name: ${{ parameters.releaseName }}"
      echo "Namespace: ${{ parameters.namespace }}"
      echo "Environment: ${{ parameters.environment }}"
      echo "Image Tag: ${{ parameters.imageTag }}"
      echo "ACR Server: ${{ parameters.acrLoginServer }}"
      echo "========================================="
    displayName: 'Display deployment info: ${{ parameters.releaseName }}'

  # Step 2: Create namespace (if enabled)
  - ${{ if eq(parameters.createNamespace, true) }}:
    - script: |
        kubectl create namespace ${{ parameters.namespace }} --dry-run=client -o yaml | kubectl apply -f -
        kubectl label namespace ${{ parameters.namespace }} \
          environment=${{ parameters.environment }} \
          managed-by=azure-pipelines \
          --overwrite
      displayName: 'Create namespace: ${{ parameters.namespace }}'

  # Step 3: Add Helm repository (if using remote chart)
  - script: |
      # Add ACR Helm repository if needed
      helm repo add flamoral https://${{ parameters.acrLoginServer }}/helm/v1/repo --username $(ACR_USERNAME) --password $(ACR_PASSWORD) || true
      helm repo update
    displayName: 'Update Helm repositories'
    continueOnError: true

  # Step 4: Validate Helm chart
  - script: |
      cd ${{ parameters.chartPath }}
      helm lint . --strict
    displayName: 'Lint Helm chart: ${{ parameters.chartName }}'

  # Step 5: Create image pull secret for ACR
  - task: Kubernetes@1
    displayName: 'Create ACR image pull secret'
    inputs:
      connectionType: 'Azure Resource Manager'
      azureSubscriptionEndpoint: 'Azure-Service-Connection'
      azureResourceGroup: '$(resourceGroup)'
      kubernetesCluster: '$(aksClusterName)'
      namespace: '${{ parameters.namespace }}'
      command: 'create'
      arguments: 'secret docker-registry acr-secret --docker-server=${{ parameters.acrLoginServer }} --docker-username=$(ACR_USERNAME) --docker-password=$(ACR_PASSWORD) --dry-run=client -o yaml | kubectl apply -f -'

  # Step 6: Render Helm template (dry-run)
  - script: |
      echo "Rendering Helm template..."

      # Build values file arguments
      VALUES_ARGS=""
      ${{ each valueFile in parameters.valueFiles }}:
        if [ -f "${{ valueFile }}" ]; then
          VALUES_ARGS="$VALUES_ARGS -f ${{ valueFile }}"
        else
          echo "Warning: Values file not found: ${{ valueFile }}"
        fi
      ${{ end }}

      # Build additional values arguments
      ADDITIONAL_VALUES=""
      ${{ each value in parameters.additionalValues }}:
        ADDITIONAL_VALUES="$ADDITIONAL_VALUES --set ${{ value }}"
      ${{ end }}

      # Render template
      helm template ${{ parameters.releaseName }} ${{ parameters.chartPath }} \
        --namespace ${{ parameters.namespace }} \
        $VALUES_ARGS \
        --set image.tag=${{ parameters.imageTag }} \
        --set image.repository=${{ parameters.acrLoginServer }} \
        --set global.environment=${{ parameters.environment }} \
        $ADDITIONAL_VALUES \
        > rendered-manifest.yaml

      echo "Template rendered successfully"
      echo "Manifest preview (first 50 lines):"
      head -n 50 rendered-manifest.yaml
    displayName: 'Render Helm template: ${{ parameters.releaseName }}'

  # Step 7: Check if release exists
  - script: |
      if helm list -n ${{ parameters.namespace }} | grep -q "${{ parameters.releaseName }}"; then
        echo "Release ${{ parameters.releaseName }} exists - will perform upgrade"
        echo "##vso[task.setvariable variable=releaseExists]true"
      else
        echo "Release ${{ parameters.releaseName }} does not exist - will perform install"
        echo "##vso[task.setvariable variable=releaseExists]false"
      fi
    displayName: 'Check release status: ${{ parameters.releaseName }}'
    name: checkRelease

  # Step 8: Get current deployment state (for rollback if needed)
  - script: |
      if [ "$(releaseExists)" = "true" ]; then
        echo "Backing up current release state..."
        helm get values ${{ parameters.releaseName }} -n ${{ parameters.namespace }} > current-values-${{ parameters.releaseName }}.yaml
        helm get manifest ${{ parameters.releaseName }} -n ${{ parameters.namespace }} > current-manifest-${{ parameters.releaseName }}.yaml

        echo "Current release version:"
        helm list -n ${{ parameters.namespace }} -f ${{ parameters.releaseName }}
      fi
    displayName: 'Backup current release: ${{ parameters.releaseName }}'
    condition: eq(variables.releaseExists, 'true')

  # Step 9: Deploy with Helm (install or upgrade)
  - script: |
      echo "Deploying Helm chart: ${{ parameters.chartName }}"

      # Build values file arguments
      VALUES_ARGS=""
      ${{ each valueFile in parameters.valueFiles }}:
        if [ -f "${{ valueFile }}" ]; then
          VALUES_ARGS="$VALUES_ARGS -f ${{ valueFile }}"
        fi
      ${{ end }}

      # Build additional values arguments
      ADDITIONAL_VALUES=""
      ${{ each value in parameters.additionalValues }}:
        ADDITIONAL_VALUES="$ADDITIONAL_VALUES --set ${{ value }}"
      ${{ end }}

      # Build common arguments
      COMMON_ARGS="--namespace ${{ parameters.namespace }} \
        --timeout ${{ parameters.timeout }} \
        --history-max ${{ parameters.maxHistory }} \
        --set image.tag=${{ parameters.imageTag }} \
        --set image.repository=${{ parameters.acrLoginServer }} \
        --set global.environment=${{ parameters.environment }} \
        $VALUES_ARGS \
        $ADDITIONAL_VALUES"

      # Add wait flag if enabled
      ${{ if eq(parameters.waitForCompletion, true) }}:
        COMMON_ARGS="$COMMON_ARGS --wait --wait-for-jobs"
      ${{ end }}

      # Add atomic flag if enabled
      ${{ if eq(parameters.atomic, true) }}:
        COMMON_ARGS="$COMMON_ARGS --atomic --cleanup-on-fail"
      ${{ end }}

      # Install or upgrade
      if [ "$(releaseExists)" = "true" ]; then
        echo "Upgrading existing release..."
        helm upgrade ${{ parameters.releaseName }} ${{ parameters.chartPath }} \
          $COMMON_ARGS \
          --install \
          --create-namespace
      else
        echo "Installing new release..."
        helm install ${{ parameters.releaseName }} ${{ parameters.chartPath }} \
          $COMMON_ARGS \
          --create-namespace
      fi

      echo "Deployment completed successfully"
    displayName: 'Deploy Helm chart: ${{ parameters.releaseName }}'

  # Step 10: Verify deployment
  - script: |
      echo "Verifying deployment..."

      # Get release status
      helm status ${{ parameters.releaseName }} -n ${{ parameters.namespace }}

      # Get deployed resources
      echo ""
      echo "Deployed resources:"
      kubectl get all -n ${{ parameters.namespace }} -l "app.kubernetes.io/instance=${{ parameters.releaseName }}"

      # Check pod status
      echo ""
      echo "Pod status:"
      kubectl get pods -n ${{ parameters.namespace }} -l "app.kubernetes.io/instance=${{ parameters.releaseName }}"

      # Wait for pods to be ready
      ${{ if eq(parameters.waitForCompletion, true) }}:
        echo ""
        echo "Waiting for pods to be ready..."
        kubectl wait --for=condition=ready pod \
          -l "app.kubernetes.io/instance=${{ parameters.releaseName }}" \
          -n ${{ parameters.namespace }} \
          --timeout=${{ parameters.timeout }} || true
      ${{ end }}
    displayName: 'Verify deployment: ${{ parameters.releaseName }}'

  # Step 11: Get deployment endpoints
  - script: |
      echo "========================================="
      echo "Deployment Endpoints"
      echo "========================================="

      # Get services
      kubectl get svc -n ${{ parameters.namespace }} -l "app.kubernetes.io/instance=${{ parameters.releaseName }}"

      # Get ingress
      kubectl get ingress -n ${{ parameters.namespace }} -l "app.kubernetes.io/instance=${{ parameters.releaseName }}"

      echo "========================================="
    displayName: 'Get deployment endpoints: ${{ parameters.releaseName }}'

  # Step 12: Run deployment tests (if chart has tests)
  - script: |
      if helm test ${{ parameters.releaseName }} -n ${{ parameters.namespace }} --logs 2>/dev/null; then
        echo "Helm tests passed"
      else
        echo "No Helm tests defined or tests not applicable"
      fi
    displayName: 'Run Helm tests: ${{ parameters.releaseName }}'
    continueOnError: true

  # Step 13: Save deployment artifacts
  - script: |
      # Save deployed values
      helm get values ${{ parameters.releaseName }} -n ${{ parameters.namespace }} \
        > deployed-values-${{ parameters.releaseName }}-${{ parameters.imageTag }}.yaml

      # Save deployed manifest
      helm get manifest ${{ parameters.releaseName }} -n ${{ parameters.namespace }} \
        > deployed-manifest-${{ parameters.releaseName }}-${{ parameters.imageTag }}.yaml

      # Save deployment summary
      cat > deployment-summary-${{ parameters.releaseName }}.txt << EOF
      Deployment Summary
      ==================
      Release Name: ${{ parameters.releaseName }}
      Chart: ${{ parameters.chartName }}
      Namespace: ${{ parameters.namespace }}
      Environment: ${{ parameters.environment }}
      Image Tag: ${{ parameters.imageTag }}
      Deployment Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
      Build ID: $(Build.BuildId)
      EOF

      helm list -n ${{ parameters.namespace }} -f ${{ parameters.releaseName }} >> deployment-summary-${{ parameters.releaseName }}.txt
    displayName: 'Save deployment artifacts: ${{ parameters.releaseName }}'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish deployment artifacts'
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)'
      artifact: 'helm-deployment-${{ parameters.releaseName }}-${{ parameters.imageTag }}'
      publishLocation: 'pipeline'
    condition: always()

  # Step 14: Display final status
  - script: |
      echo "========================================="
      echo "Deployment Complete: ${{ parameters.releaseName }}"
      echo "========================================="
      echo "Release: ${{ parameters.releaseName }}"
      echo "Namespace: ${{ parameters.namespace }}"
      echo "Environment: ${{ parameters.environment }}"
      echo "Image Tag: ${{ parameters.imageTag }}"
      echo "Status: SUCCESS"
      echo "========================================="
    displayName: 'Deployment summary: ${{ parameters.releaseName }}'
