# Reusable template for Terraform operations
# Parameters:
#   - environment: Environment name (dev, staging, prod)
#   - terraformCommand: Terraform command to execute (plan, apply, destroy)
#   - workingDirectory: Path to Terraform configuration
#   - backendServiceArm: Azure service connection name
#   - backendResourceGroup: Resource group for Terraform state
#   - backendStorageAccount: Storage account for Terraform state
#   - backendContainer: Container name for Terraform state
#   - stateKey: State file key/name
#   - varFile: Path to tfvars file (optional)
#   - additionalArgs: Additional Terraform arguments (optional)
#   - autoApprove: Auto-approve apply/destroy (default: false)

parameters:
  - name: environment
    type: string
    displayName: 'Environment'

  - name: terraformCommand
    type: string
    displayName: 'Terraform command'
    values:
      - plan
      - apply
      - destroy
      - validate

  - name: workingDirectory
    type: string
    displayName: 'Working directory'

  - name: backendServiceArm
    type: string
    displayName: 'Azure service connection'

  - name: backendResourceGroup
    type: string
    displayName: 'Backend resource group'

  - name: backendStorageAccount
    type: string
    displayName: 'Backend storage account'

  - name: backendContainer
    type: string
    displayName: 'Backend container'

  - name: stateKey
    type: string
    displayName: 'State file key'

  - name: varFile
    type: string
    displayName: 'Variables file'
    default: ''

  - name: additionalArgs
    type: string
    displayName: 'Additional arguments'
    default: ''

  - name: autoApprove
    type: boolean
    displayName: 'Auto-approve changes'
    default: false

  - name: parallelism
    type: number
    displayName: 'Parallelism'
    default: 10

  - name: outputPlanFile
    type: boolean
    displayName: 'Output plan file'
    default: true

steps:
  # Step 1: Display Terraform operation information
  - script: |
      echo "========================================="
      echo "Terraform Operation"
      echo "========================================="
      echo "Command: ${{ parameters.terraformCommand }}"
      echo "Environment: ${{ parameters.environment }}"
      echo "Working Directory: ${{ parameters.workingDirectory }}"
      echo "State Key: ${{ parameters.stateKey }}"
      echo "Backend Storage: ${{ parameters.backendStorageAccount }}"
      echo "Backend Container: ${{ parameters.backendContainer }}"
      echo "========================================="
    displayName: 'Display Terraform info: ${{ parameters.environment }}'

  # Step 2: Initialize Terraform
  - task: TerraformTaskV4@4
    displayName: 'Terraform Init: ${{ parameters.environment }}'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '${{ parameters.workingDirectory }}'
      backendServiceArm: '${{ parameters.backendServiceArm }}'
      backendAzureRmResourceGroupName: '${{ parameters.backendResourceGroup }}'
      backendAzureRmStorageAccountName: '${{ parameters.backendStorageAccount }}'
      backendAzureRmContainerName: '${{ parameters.backendContainer }}'
      backendAzureRmKey: '${{ parameters.stateKey }}'

  # Step 3: Terraform Validate
  - task: TerraformTaskV4@4
    displayName: 'Terraform Validate: ${{ parameters.environment }}'
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '${{ parameters.workingDirectory }}'

  # Step 4: Execute Terraform Plan (if command is plan or apply)
  - ${{ if or(eq(parameters.terraformCommand, 'plan'), eq(parameters.terraformCommand, 'apply')) }}:
    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan: ${{ parameters.environment }}'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '${{ parameters.workingDirectory }}'
        environmentServiceNameAzureRM: '${{ parameters.backendServiceArm }}'
        commandOptions: |
          -out=tfplan-${{ parameters.environment }}
          -parallelism=${{ parameters.parallelism }}
          ${{ if ne(parameters.varFile, '') }}:
            -var-file="${{ parameters.varFile }}"
          ${{ end }}
          ${{ parameters.additionalArgs }}

    # Show plan output
    - script: |
        cd "${{ parameters.workingDirectory }}"
        echo "========================================="
        echo "Terraform Plan Output"
        echo "========================================="
        terraform show -no-color tfplan-${{ parameters.environment }}
      displayName: 'Show Terraform Plan: ${{ parameters.environment }}'

    # Save plan as artifact
    - ${{ if eq(parameters.outputPlanFile, true) }}:
      - task: PublishPipelineArtifact@1
        displayName: 'Publish Terraform Plan'
        inputs:
          targetPath: '${{ parameters.workingDirectory }}/tfplan-${{ parameters.environment }}'
          artifact: 'tfplan-${{ parameters.environment }}'
          publishLocation: 'pipeline'

      # Generate human-readable plan
      - script: |
          cd "${{ parameters.workingDirectory }}"
          terraform show -no-color tfplan-${{ parameters.environment }} > terraform-plan-${{ parameters.environment }}.txt

          # Generate JSON plan for detailed analysis
          terraform show -json tfplan-${{ parameters.environment }} > terraform-plan-${{ parameters.environment }}.json

          echo "Plan files generated:"
          ls -lh terraform-plan-${{ parameters.environment }}.*
        displayName: 'Generate plan reports: ${{ parameters.environment }}'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish plan reports'
        inputs:
          targetPath: '${{ parameters.workingDirectory }}'
          artifact: 'terraform-plan-reports-${{ parameters.environment }}'
          publishLocation: 'pipeline'

  # Step 5: Execute Terraform Apply (if command is apply)
  - ${{ if eq(parameters.terraformCommand, 'apply') }}:
    # Show what will be applied
    - script: |
        cd "${{ parameters.workingDirectory }}"
        echo "========================================="
        echo "Applying Terraform Changes"
        echo "========================================="
        echo "Environment: ${{ parameters.environment }}"
        echo "Plan file: tfplan-${{ parameters.environment }}"

        # Count resources to be changed
        ADDS=$(terraform show -json tfplan-${{ parameters.environment }} | jq -r '[.resource_changes[]? | select(.change.actions | contains(["create"]))] | length')
        CHANGES=$(terraform show -json tfplan-${{ parameters.environment }} | jq -r '[.resource_changes[]? | select(.change.actions | contains(["update"]))] | length')
        DESTROYS=$(terraform show -json tfplan-${{ parameters.environment }} | jq -r '[.resource_changes[]? | select(.change.actions | contains(["delete"]))] | length')

        echo "Resources to add: $ADDS"
        echo "Resources to change: $CHANGES"
        echo "Resources to destroy: $DESTROYS"
        echo "========================================="
      displayName: 'Pre-apply summary: ${{ parameters.environment }}'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Apply: ${{ parameters.environment }}'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '${{ parameters.workingDirectory }}'
        environmentServiceNameAzureRM: '${{ parameters.backendServiceArm }}'
        commandOptions: |
          tfplan-${{ parameters.environment }}
          ${{ if eq(parameters.autoApprove, true) }}:
            -auto-approve
          ${{ end }}

    # Step 6: Capture Terraform outputs
    - task: TerraformTaskV4@4
      displayName: 'Get Terraform Outputs: ${{ parameters.environment }}'
      inputs:
        provider: 'azurerm'
        command: 'output'
        workingDirectory: '${{ parameters.workingDirectory }}'
        environmentServiceNameAzureRM: '${{ parameters.backendServiceArm }}'

    # Save outputs to file
    - script: |
        cd "${{ parameters.workingDirectory }}"
        terraform output -json > terraform-outputs-${{ parameters.environment }}.json
        terraform output > terraform-outputs-${{ parameters.environment }}.txt

        echo "========================================="
        echo "Terraform Outputs"
        echo "========================================="
        cat terraform-outputs-${{ parameters.environment }}.txt
        echo "========================================="
      displayName: 'Save Terraform Outputs: ${{ parameters.environment }}'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform outputs'
      inputs:
        targetPath: '${{ parameters.workingDirectory }}'
        artifact: 'terraform-outputs-${{ parameters.environment }}'
        publishLocation: 'pipeline'

  # Step 7: Execute Terraform Destroy (if command is destroy)
  - ${{ if eq(parameters.terraformCommand, 'destroy') }}:
    - script: |
        echo "========================================="
        echo "WARNING: Destroying Infrastructure"
        echo "========================================="
        echo "Environment: ${{ parameters.environment }}"
        echo "This will destroy all resources managed by this Terraform configuration"
        echo "========================================="
      displayName: 'Destroy warning: ${{ parameters.environment }}'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Destroy: ${{ parameters.environment }}'
      inputs:
        provider: 'azurerm'
        command: 'destroy'
        workingDirectory: '${{ parameters.workingDirectory }}'
        environmentServiceNameAzureRM: '${{ parameters.backendServiceArm }}'
        commandOptions: |
          ${{ if ne(parameters.varFile, '') }}:
            -var-file="${{ parameters.varFile }}"
          ${{ end }}
          ${{ if eq(parameters.autoApprove, true) }}:
            -auto-approve
          ${{ end }}
          ${{ parameters.additionalArgs }}

  # Step 8: Generate state summary
  - script: |
      cd "${{ parameters.workingDirectory }}"

      echo "========================================="
      echo "Terraform State Summary"
      echo "========================================="

      # List resources in state
      terraform state list > state-resources-${{ parameters.environment }}.txt

      # Count resources
      RESOURCE_COUNT=$(terraform state list | wc -l)
      echo "Total resources in state: $RESOURCE_COUNT"

      # Show state stats
      terraform show -json | jq -r '
        .values.root_module.resources |
        group_by(.type) |
        map({
          type: .[0].type,
          count: length
        }) |
        sort_by(.count) |
        reverse |
        .[] |
        "\(.type): \(.count)"
      ' > state-summary-${{ parameters.environment }}.txt 2>/dev/null || echo "State summary not available"

      if [ -f state-summary-${{ parameters.environment }}.txt ]; then
        echo ""
        echo "Resources by type:"
        cat state-summary-${{ parameters.environment }}.txt
      fi

      echo "========================================="
    displayName: 'Generate state summary: ${{ parameters.environment }}'
    condition: or(eq('${{ parameters.terraformCommand }}', 'apply'), eq('${{ parameters.terraformCommand }}', 'plan'))

  # Step 9: Verify infrastructure (for apply operations)
  - ${{ if eq(parameters.terraformCommand, 'apply') }}:
    - script: |
        cd "${{ parameters.workingDirectory }}"

        echo "========================================="
        echo "Verifying Infrastructure Deployment"
        echo "========================================="

        # Run Terraform refresh to verify state
        terraform refresh \
          ${{ if ne(parameters.varFile, '') }}:
            -var-file="${{ parameters.varFile }}"
          ${{ end }} \
          > /dev/null 2>&1

        # Check for drift
        echo "Checking for configuration drift..."
        terraform plan -detailed-exitcode \
          ${{ if ne(parameters.varFile, '') }}:
            -var-file="${{ parameters.varFile }}"
          ${{ end }} \
          > /dev/null 2>&1

        EXIT_CODE=$?
        if [ $EXIT_CODE -eq 0 ]; then
          echo "No drift detected - infrastructure matches configuration"
        elif [ $EXIT_CODE -eq 2 ]; then
          echo "WARNING: Drift detected - infrastructure differs from configuration"
          terraform plan \
            ${{ if ne(parameters.varFile, '') }}:
              -var-file="${{ parameters.varFile }}"
            ${{ end }}
        else
          echo "ERROR: Failed to check for drift"
        fi

        echo "========================================="
      displayName: 'Verify infrastructure: ${{ parameters.environment }}'
      continueOnError: true

  # Step 10: Cost estimation (for plan/apply)
  - ${{ if or(eq(parameters.terraformCommand, 'plan'), eq(parameters.terraformCommand, 'apply')) }}:
    - script: |
        # Install Infracost if available
        if command -v infracost &> /dev/null; then
          cd "${{ parameters.workingDirectory }}"

          echo "Generating cost estimate..."
          infracost breakdown \
            --path=tfplan-${{ parameters.environment }} \
            --format=table \
            > cost-estimate-${{ parameters.environment }}.txt 2>&1 || echo "Cost estimation not available"

          if [ -f cost-estimate-${{ parameters.environment }}.txt ]; then
            echo "========================================="
            echo "Infrastructure Cost Estimate"
            echo "========================================="
            cat cost-estimate-${{ parameters.environment }}.txt
            echo "========================================="
          fi
        else
          echo "Infracost not installed - skipping cost estimation"
        fi
      displayName: 'Generate cost estimate: ${{ parameters.environment }}'
      env:
        INFRACOST_API_KEY: $(INFRACOST_API_KEY)
      continueOnError: true

  # Step 11: Final summary
  - script: |
      echo "========================================="
      echo "Terraform Operation Complete"
      echo "========================================="
      echo "Command: ${{ parameters.terraformCommand }}"
      echo "Environment: ${{ parameters.environment }}"
      echo "Working Directory: ${{ parameters.workingDirectory }}"
      echo "State File: ${{ parameters.stateKey }}"
      echo "Status: SUCCESS"
      echo "========================================="
    displayName: 'Operation summary: ${{ parameters.environment }}'
