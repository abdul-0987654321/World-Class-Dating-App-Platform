# Reusable template for building Node.js/TypeScript projects
# Parameters:
#   - projectPath: Path to the Node.js project
#   - nodeVersion: Node.js version to use (default: 20.x)
#   - buildCommand: Build command to execute (default: npm run build)
#   - testCommand: Test command to execute (optional)
#   - publishArtifact: Whether to publish build artifacts (default: true)
#   - artifactName: Name of the artifact to publish

parameters:
  - name: projectPath
    type: string
    displayName: 'Project path'

  - name: nodeVersion
    type: string
    displayName: 'Node.js version'
    default: '20.x'

  - name: buildCommand
    type: string
    displayName: 'Build command'
    default: 'npm run build'

  - name: testCommand
    type: string
    displayName: 'Test command'
    default: ''

  - name: publishArtifact
    type: boolean
    displayName: 'Publish build artifacts'
    default: true

  - name: artifactName
    type: string
    displayName: 'Artifact name'
    default: 'build-output'

  - name: installCommand
    type: string
    displayName: 'Install command'
    default: 'npm ci'

  - name: cacheKey
    type: string
    displayName: 'Cache key for dependencies'
    default: 'npm | "$(Agent.OS)" | package-lock.json'

  - name: lintCommand
    type: string
    displayName: 'Lint command'
    default: ''

  - name: enableCodeCoverage
    type: boolean
    displayName: 'Enable code coverage'
    default: false

steps:
  # Step 1: Install Node.js
  - task: NodeTool@0
    displayName: 'Install Node.js ${{ parameters.nodeVersion }}'
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}

  # Step 2: Cache node_modules
  - task: Cache@2
    displayName: 'Cache node_modules'
    inputs:
      key: '${{ parameters.cacheKey }}'
      path: '${{ parameters.projectPath }}/node_modules'
      restoreKeys: |
        npm | "$(Agent.OS)"
      cacheHitVar: 'CACHE_RESTORED'

  # Step 3: Install dependencies
  - script: |
      cd "${{ parameters.projectPath }}"
      ${{ parameters.installCommand }}
    displayName: 'Install dependencies'
    condition: ne(variables.CACHE_RESTORED, 'true')

  # Step 4: Run linting (if specified)
  - ${{ if ne(parameters.lintCommand, '') }}:
    - script: |
        cd "${{ parameters.projectPath }}"
        ${{ parameters.lintCommand }}
      displayName: 'Run linting'

  # Step 5: Run tests (if specified)
  - ${{ if ne(parameters.testCommand, '') }}:
    - script: |
        cd "${{ parameters.projectPath }}"
        ${{ parameters.testCommand }}
      displayName: 'Run tests'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '${{ parameters.projectPath }}/**/junit.xml'
        mergeTestResults: true
        failTaskOnFailedTests: true
      condition: always()

    # Publish code coverage if enabled
    - ${{ if eq(parameters.enableCodeCoverage, true) }}:
      - task: PublishCodeCoverageResults@1
        displayName: 'Publish code coverage'
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '${{ parameters.projectPath }}/**/coverage/cobertura-coverage.xml'
          reportDirectory: '${{ parameters.projectPath }}/**/coverage'
        condition: always()

  # Step 6: Build the project
  - script: |
      cd "${{ parameters.projectPath }}"
      ${{ parameters.buildCommand }}
    displayName: 'Build project'

  # Step 7: Publish build artifacts (if enabled)
  - ${{ if eq(parameters.publishArtifact, true) }}:
    - task: PublishPipelineArtifact@1
      displayName: 'Publish build artifacts'
      inputs:
        targetPath: '${{ parameters.projectPath }}/dist'
        artifact: '${{ parameters.artifactName }}'
        publishLocation: 'pipeline'

  # Step 8: Display build summary
  - script: |
      echo "========================================="
      echo "Build Summary for ${{ parameters.projectPath }}"
      echo "========================================="
      echo "Node Version: ${{ parameters.nodeVersion }}"
      echo "Build Command: ${{ parameters.buildCommand }}"
      echo "Artifact Name: ${{ parameters.artifactName }}"
      echo "========================================="
    displayName: 'Build summary'
