# =============================================================================
# Environment Variables Configuration Template
# =============================================================================
# Use this template to configure environment-specific variables for CI/CD
# Copy relevant sections to Azure DevOps Variable Groups or GitHub Secrets
# =============================================================================

# =============================================================================
# COMMON VARIABLES (All Environments)
# =============================================================================
common:
  # Container Registry
  ACR_NAME: flamoralprodacr
  ACR_LOGIN_SERVER: flamoralprodacr.azurecr.io

  # Versions
  NODE_VERSION: '20.x'
  HELM_VERSION: '3.13.0'
  KUBECTL_VERSION: '1.28.0'
  TERRAFORM_VERSION: '1.6.0'

  # Repository
  DOCKER_REGISTRY: flamoralprodacr.azurecr.io
  IMAGE_REPOSITORY: flamoral

  # Monitoring
  ENABLE_MONITORING: true
  ENABLE_TRACING: true
  ENABLE_LOGGING: true

  # Security
  ENABLE_SECURITY_SCANNING: true
  ENABLE_DEPENDENCY_CHECK: true

# Secrets (DO NOT commit actual values)
common_secrets:
  ACR_USERNAME: '<from-azure-portal>'
  ACR_PASSWORD: '<from-azure-portal>'
  SNYK_TOKEN: '<from-snyk>'
  CODECOV_TOKEN: '<from-codecov>'
  SONARCLOUD_TOKEN: '<from-sonarcloud>'

# =============================================================================
# DEVELOPMENT ENVIRONMENT
# =============================================================================
development:
  # Environment
  ENVIRONMENT: development
  NODE_ENV: development

  # Azure Resources
  AZURE_SUBSCRIPTION_ID: '<subscription-id>'
  RESOURCE_GROUP: flamoral-dev-rg
  LOCATION: eastus

  # Kubernetes
  AKS_CLUSTER_NAME: flamoral-dev-aks
  AKS_NODE_COUNT: 2
  AKS_NODE_VM_SIZE: Standard_D2s_v3
  NAMESPACE: flamoral-dev

  # URLs
  API_URL: https://dev-api.flamoral.com
  APP_URL: https://dev.flamoral.com
  WEB_SOCKET_URL: wss://dev-api.flamoral.com

  # Database
  DB_HOST: flamoral-dev-db.postgres.database.azure.com
  DB_PORT: 5432
  DB_NAME: flamoral_dev
  DB_SSL_MODE: require

  # Redis
  REDIS_HOST: flamoral-dev-redis.redis.cache.windows.net
  REDIS_PORT: 6380
  REDIS_SSL: true

  # RabbitMQ
  RABBITMQ_HOST: flamoral-dev-rabbitmq.servicebus.windows.net
  RABBITMQ_PORT: 5671

  # Storage
  STORAGE_ACCOUNT: flamoraldevstore
  STORAGE_CONTAINER: media
  CDN_URL: https://dev-cdn.flamoral.com

  # Feature Flags
  ENABLE_FEATURES_NEW_MATCHING: true
  ENABLE_FEATURES_VIDEO_CALLS: true
  ENABLE_FEATURES_AI_COACH: true

  # Logging
  LOG_LEVEL: debug
  LOG_FORMAT: json

  # Deployment
  REPLICA_COUNT: 1
  AUTO_SCALING_ENABLED: false
  MIN_REPLICAS: 1
  MAX_REPLICAS: 3

  # Resources
  CPU_REQUEST: '100m'
  CPU_LIMIT: '500m'
  MEMORY_REQUEST: '256Mi'
  MEMORY_LIMIT: '512Mi'

# Secrets (DO NOT commit actual values)
development_secrets:
  DB_USERNAME: '<dev-db-username>'
  DB_PASSWORD: '<dev-db-password>'
  REDIS_PASSWORD: '<dev-redis-password>'
  RABBITMQ_USERNAME: '<dev-rabbitmq-username>'
  RABBITMQ_PASSWORD: '<dev-rabbitmq-password>'
  JWT_SECRET: '<dev-jwt-secret>'
  JWT_ACCESS_SECRET: '<dev-jwt-access-secret>'
  JWT_REFRESH_SECRET: '<dev-jwt-refresh-secret>'
  ENCRYPTION_KEY: '<dev-encryption-key>'
  AZURE_STORAGE_KEY: '<dev-storage-key>'

# =============================================================================
# STAGING ENVIRONMENT
# =============================================================================
staging:
  # Environment
  ENVIRONMENT: staging
  NODE_ENV: production

  # Azure Resources
  AZURE_SUBSCRIPTION_ID: '<subscription-id>'
  RESOURCE_GROUP: flamoral-staging-rg
  LOCATION: eastus

  # Kubernetes
  AKS_CLUSTER_NAME: flamoral-staging-aks
  AKS_NODE_COUNT: 3
  AKS_NODE_VM_SIZE: Standard_D4s_v3
  NAMESPACE: flamoral-staging

  # URLs
  API_URL: https://staging-api.flamoral.com
  APP_URL: https://staging.flamoral.com
  WEB_SOCKET_URL: wss://staging-api.flamoral.com

  # Database
  DB_HOST: flamoral-staging-db.postgres.database.azure.com
  DB_PORT: 5432
  DB_NAME: flamoral_staging
  DB_SSL_MODE: require
  DB_POOL_SIZE: 20

  # Redis
  REDIS_HOST: flamoral-staging-redis.redis.cache.windows.net
  REDIS_PORT: 6380
  REDIS_SSL: true
  REDIS_CLUSTER_MODE: false

  # RabbitMQ
  RABBITMQ_HOST: flamoral-staging-rabbitmq.servicebus.windows.net
  RABBITMQ_PORT: 5671
  RABBITMQ_VHOST: /

  # Storage
  STORAGE_ACCOUNT: flomoralstagingstore
  STORAGE_CONTAINER: media
  CDN_URL: https://staging-cdn.flamoral.com

  # Feature Flags
  ENABLE_FEATURES_NEW_MATCHING: true
  ENABLE_FEATURES_VIDEO_CALLS: true
  ENABLE_FEATURES_AI_COACH: true

  # Logging
  LOG_LEVEL: info
  LOG_FORMAT: json

  # Deployment
  REPLICA_COUNT: 2
  AUTO_SCALING_ENABLED: true
  MIN_REPLICAS: 2
  MAX_REPLICAS: 5

  # Resources
  CPU_REQUEST: '250m'
  CPU_LIMIT: '1000m'
  MEMORY_REQUEST: '512Mi'
  MEMORY_LIMIT: '1Gi'

  # Testing
  ENABLE_E2E_TESTS: true
  ENABLE_PERFORMANCE_TESTS: true

# Secrets (DO NOT commit actual values)
staging_secrets:
  DB_USERNAME: '<staging-db-username>'
  DB_PASSWORD: '<staging-db-password>'
  REDIS_PASSWORD: '<staging-redis-password>'
  RABBITMQ_USERNAME: '<staging-rabbitmq-username>'
  RABBITMQ_PASSWORD: '<staging-rabbitmq-password>'
  JWT_SECRET: '<staging-jwt-secret>'
  JWT_ACCESS_SECRET: '<staging-jwt-access-secret>'
  JWT_REFRESH_SECRET: '<staging-jwt-refresh-secret>'
  ENCRYPTION_KEY: '<staging-encryption-key>'
  AZURE_STORAGE_KEY: '<staging-storage-key>'

# =============================================================================
# PRODUCTION ENVIRONMENT
# =============================================================================
production:
  # Environment
  ENVIRONMENT: production
  NODE_ENV: production

  # Azure Resources
  AZURE_SUBSCRIPTION_ID: '<subscription-id>'
  RESOURCE_GROUP: flamoral-prod-rg
  LOCATION: eastus

  # Kubernetes
  AKS_CLUSTER_NAME: flamoral-prod-aks
  AKS_NODE_COUNT: 5
  AKS_NODE_VM_SIZE: Standard_D8s_v3
  NAMESPACE: flamoral-prod

  # URLs
  API_URL: https://api.flamoral.com
  APP_URL: https://flamoral.com
  WEB_SOCKET_URL: wss://api.flamoral.com
  ADMIN_URL: https://admin.flamoral.com

  # Database
  DB_HOST: flamoral-prod-db.postgres.database.azure.com
  DB_PORT: 5432
  DB_NAME: flamoral_production
  DB_SSL_MODE: require
  DB_POOL_SIZE: 50
  DB_CONNECTION_TIMEOUT: 30000
  DB_IDLE_TIMEOUT: 10000

  # Redis
  REDIS_HOST: flamoral-prod-redis.redis.cache.windows.net
  REDIS_PORT: 6380
  REDIS_SSL: true
  REDIS_CLUSTER_MODE: true
  REDIS_MAX_RETRIES: 3

  # RabbitMQ
  RABBITMQ_HOST: flamoral-prod-rabbitmq.servicebus.windows.net
  RABBITMQ_PORT: 5671
  RABBITMQ_VHOST: /
  RABBITMQ_HEARTBEAT: 60

  # Storage
  STORAGE_ACCOUNT: flamoralprodstore
  STORAGE_CONTAINER: media
  CDN_URL: https://cdn.flamoral.com

  # Elasticsearch
  ELASTICSEARCH_URL: https://flamoral-prod-elastic.azurewebsites.net
  ELASTICSEARCH_INDEX_PREFIX: flamoral-prod

  # Feature Flags
  ENABLE_FEATURES_NEW_MATCHING: true
  ENABLE_FEATURES_VIDEO_CALLS: true
  ENABLE_FEATURES_AI_COACH: true
  ENABLE_FEATURES_PREMIUM: true

  # Logging
  LOG_LEVEL: warn
  LOG_FORMAT: json
  LOG_RETENTION_DAYS: 90

  # Monitoring
  APP_INSIGHTS_CONNECTION_STRING: '<from-azure-portal>'
  ENABLE_PROFILING: false
  ENABLE_SAMPLING: true
  SAMPLING_RATE: 0.1

  # Deployment
  REPLICA_COUNT: 3
  AUTO_SCALING_ENABLED: true
  MIN_REPLICAS: 3
  MAX_REPLICAS: 10
  TARGET_CPU_UTILIZATION: 70
  TARGET_MEMORY_UTILIZATION: 80

  # Resources
  CPU_REQUEST: '500m'
  CPU_LIMIT: '2000m'
  MEMORY_REQUEST: '1Gi'
  MEMORY_LIMIT: '2Gi'

  # Rate Limiting
  RATE_LIMIT_ENABLED: true
  RATE_LIMIT_WINDOW: 60000
  RATE_LIMIT_MAX_REQUESTS: 100

  # Security
  CORS_ORIGINS: https://flamoral.com,https://www.flamoral.com
  HELMET_ENABLED: true
  CSRF_ENABLED: true

  # Approvers
  PROD_APPROVER_EMAIL_1: lead@flamoral.com
  PROD_APPROVER_EMAIL_2: cto@flamoral.com

# Secrets (DO NOT commit actual values)
production_secrets:
  DB_USERNAME: '<prod-db-username>'
  DB_PASSWORD: '<prod-db-password>'
  DB_READONLY_USERNAME: '<prod-db-readonly-username>'
  DB_READONLY_PASSWORD: '<prod-db-readonly-password>'
  REDIS_PASSWORD: '<prod-redis-password>'
  RABBITMQ_USERNAME: '<prod-rabbitmq-username>'
  RABBITMQ_PASSWORD: '<prod-rabbitmq-password>'
  JWT_SECRET: '<prod-jwt-secret-min-64-chars>'
  JWT_ACCESS_SECRET: '<prod-jwt-access-secret-min-64-chars>'
  JWT_REFRESH_SECRET: '<prod-jwt-refresh-secret-min-64-chars>'
  ENCRYPTION_KEY: '<prod-encryption-key-min-64-chars>'
  AZURE_STORAGE_KEY: '<prod-storage-key>'
  STRIPE_SECRET_KEY: '<prod-stripe-secret-key>'
  STRIPE_WEBHOOK_SECRET: '<prod-stripe-webhook-secret>'
  SENDGRID_API_KEY: '<prod-sendgrid-api-key>'
  TWILIO_ACCOUNT_SID: '<prod-twilio-account-sid>'
  TWILIO_AUTH_TOKEN: '<prod-twilio-auth-token>'
  GOOGLE_CLIENT_SECRET: '<prod-google-client-secret>'
  FACEBOOK_APP_SECRET: '<prod-facebook-app-secret>'
  APPLE_CLIENT_SECRET: '<prod-apple-client-secret>'

# =============================================================================
# NOTIFICATION SERVICES
# =============================================================================
notifications:
  # Slack
  SLACK_WEBHOOK_URL: '<slack-webhook-url>'
  SLACK_CHANNEL_DEPLOYMENTS: '#deployments'
  SLACK_CHANNEL_ALERTS: '#alerts'
  SLACK_CHANNEL_INCIDENTS: '#incidents'

  # Microsoft Teams
  TEAMS_WEBHOOK_URL: '<teams-webhook-url>'

  # Email
  NOTIFICATION_EMAIL_FROM: noreply@flamoral.com
  NOTIFICATION_EMAIL_TO: devops@flamoral.com

# =============================================================================
# AZURE CREDENTIALS
# =============================================================================
# Format for AZURE_CREDENTIALS secret in GitHub Actions
azure_credentials:
  clientId: '<client-id>'
  clientSecret: '<client-secret>'
  subscriptionId: '<subscription-id>'
  tenantId: '<tenant-id>'

# =============================================================================
# SERVICE-SPECIFIC CONFIGURATION
# =============================================================================
services:
  api-gateway:
    PORT: 4000
    RATE_LIMIT_ENABLED: true
    TIMEOUT: 30000

  auth-service:
    PORT: 3001
    TOKEN_EXPIRY: 3600
    REFRESH_TOKEN_EXPIRY: 2592000

  user-service:
    PORT: 3002
    MAX_FILE_SIZE: 10485760  # 10MB

  matching-service:
    PORT: 3003
    MATCHING_ALGORITHM: enhanced
    MAX_MATCHES_PER_DAY: 100

  messaging-service:
    PORT: 3004
    MESSAGE_RETENTION_DAYS: 365
    MAX_MESSAGE_LENGTH: 5000

  media-service:
    PORT: 3006
    SUPPORTED_FORMATS: 'jpg,jpeg,png,gif,mp4,webm'
    MAX_UPLOAD_SIZE: 52428800  # 50MB

  payment-service:
    PORT: 3007
    CURRENCY: USD
    PAYMENT_PROVIDER: stripe

  notification-service:
    PORT: 3008
    EMAIL_PROVIDER: sendgrid
    SMS_PROVIDER: twilio
    PUSH_PROVIDER: firebase

# =============================================================================
# TERRAFORM BACKEND CONFIGURATION
# =============================================================================
terraform:
  # State Storage
  STATE_RESOURCE_GROUP: flamoral-tfstate-rg
  STATE_STORAGE_ACCOUNT: flamoraltfstate
  STATE_CONTAINER: tfstate
  STATE_KEY_DEV: flamoral-dev.tfstate
  STATE_KEY_STAGING: flamoral-staging.tfstate
  STATE_KEY_PROD: flamoral-prod.tfstate

  # Lock Table
  LOCK_TABLE: terraform-locks

# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================
#
# Azure DevOps:
# 1. Go to Pipelines → Library → Variable Groups
# 2. Create variable group (e.g., "flamoral-prod-vars")
# 3. Add variables from the relevant section above
# 4. For secrets, click the lock icon to mark as secret
# 5. Link variable group to pipeline
#
# GitHub Actions:
# 1. Go to Settings → Secrets and variables → Actions
# 2. Click "New repository secret"
# 3. Add each secret individually
# 4. For non-secret variables, use environment variables in workflow files
#
# Kubernetes Secrets:
# kubectl create secret generic flamoral-secrets \
#   --from-literal=DB_PASSWORD='<password>' \
#   --from-literal=REDIS_PASSWORD='<password>' \
#   -n flamoral-prod
#
# ConfigMaps:
# kubectl create configmap flamoral-config \
#   --from-literal=API_URL='https://api.flamoral.com' \
#   --from-literal=NODE_ENV='production' \
#   -n flamoral-prod
#
# =============================================================================
