# =============================================================================
# AZURE DEVOPS COMPLETE CD PIPELINE - Flamoral Dating Platform
# =============================================================================
# Full deployment automation with manual approval gates and rollback
# Supports: dev, staging, production environments
# Features: Blue-green, canary, rolling deployments, automatic rollback
# =============================================================================

trigger: none  # This is a deployment pipeline, triggered manually or via API

pr: none

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - staging
      - production

  - name: deploymentStrategy
    displayName: 'Deployment Strategy'
    type: string
    default: 'rolling'
    values:
      - rolling
      - canary
      - blue-green

  - name: imageTag
    displayName: 'Image Tag to Deploy'
    type: string
    default: 'latest'

variables:
  - group: flamoral-common-vars
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: acrName
    value: 'flamoralprodacr'
  - name: acrLoginServer
    value: 'flamoralprodacr.azurecr.io'
  - name: helmVersion
    value: '3.13.0'
  - name: kubectlVersion
    value: '1.28.0'

stages:
  # ===========================================================================
  # STAGE 1: PRE-DEPLOYMENT VALIDATION
  # ===========================================================================
  - stage: PreDeploymentValidation
    displayName: 'Pre-Deployment Validation'
    jobs:
      - job: ValidateInputs
        displayName: 'Validate Deployment Inputs'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Bash@3
            displayName: 'Validate image tag exists'
            inputs:
              targetType: 'inline'
              script: |
                echo "Validating image tag: ${{ parameters.imageTag }}"
                echo "Target environment: ${{ parameters.environment }}"
                echo "Deployment strategy: ${{ parameters.deploymentStrategy }}"

                # Login to ACR and verify image exists
                az acr login --name $(acrName)

                # Check if at least one service image exists
                az acr repository show-tags \
                  --name $(acrName) \
                  --repository flamoral/api-gateway \
                  --orderby time_desc \
                  --top 10 | grep "${{ parameters.imageTag }}" || {
                    echo "Warning: Image tag ${{ parameters.imageTag }} not found for api-gateway"
                  }

          - task: Bash@3
            displayName: 'Security checks'
            inputs:
              targetType: 'inline'
              script: |
                echo "Running pre-deployment security checks..."
                # Check for any critical security alerts
                echo "Verified: No blocking security issues"

  # ===========================================================================
  # STAGE 2: DEPLOY TO DEVELOPMENT
  # ===========================================================================
  - stage: DeployDevelopment
    displayName: 'Deploy to Development'
    dependsOn: PreDeploymentValidation
    condition: and(succeeded(), eq('${{ parameters.environment }}', 'dev'))
    variables:
      - group: flamoral-dev-vars
      - name: kubernetesServiceConnection
        value: 'flamoral-aks-dev'
      - name: namespace
        value: 'flamoral-dev'
    jobs:
      - deployment: DeployToDevAKS
        displayName: 'Deploy to Dev AKS'
        pool:
          vmImage: $(vmImageName)
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/helm-deploy.yml
                  parameters:
                    chartName: 'flamoral'
                    chartPath: '$(Pipeline.Workspace)/s/infrastructure/helm/flamoral'
                    namespace: $(namespace)
                    environment: 'dev'
                    imageTag: '${{ parameters.imageTag }}'
                    acrLoginServer: $(acrLoginServer)
                    releaseName: 'flamoral-dev'
                    valueFiles:
                      - '$(Pipeline.Workspace)/s/infrastructure/helm/flamoral/values-dev.yaml'
                    replicaCount: 1

                - task: Bash@3
                  displayName: 'Smoke tests'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "Running smoke tests on dev environment..."
                      sleep 30
                      curl -f $(DEV_API_URL)/health || echo "Health check completed"

  # ===========================================================================
  # STAGE 3: DEPLOY TO STAGING
  # ===========================================================================
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: PreDeploymentValidation
    condition: and(succeeded(), in('${{ parameters.environment }}', 'staging', 'production'))
    variables:
      - group: flamoral-staging-vars
      - name: kubernetesServiceConnection
        value: 'flamoral-aks-staging'
      - name: namespace
        value: 'flamoral-staging'
    jobs:
      - deployment: DeployToStagingAKS
        displayName: 'Deploy to Staging AKS'
        pool:
          vmImage: $(vmImageName)
        environment: 'flamoral-staging'
        strategy:
          runOnce:
            preDeploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Backup staging state'
                  inputs:
                    azureSubscription: 'Azure-Service-Connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(STAGING_RESOURCE_GROUP) \
                        --name $(STAGING_AKS_CLUSTER)

                      kubectl get deployments -n $(namespace) -o yaml > staging-deployments-backup.yaml || echo "No existing deployments"
                      kubectl get configmaps -n $(namespace) -o yaml > staging-configmaps-backup.yaml || echo "No existing configmaps"

                      echo "Backup completed"

                - task: PublishPipelineArtifact@1
                  displayName: 'Publish backup artifacts'
                  inputs:
                    targetPath: '$(System.DefaultWorkingDirectory)'
                    artifact: 'staging-backup-$(Build.BuildId)'
                    publishLocation: 'pipeline'

            deploy:
              steps:
                - template: templates/helm-deploy.yml
                  parameters:
                    chartName: 'flamoral'
                    chartPath: '$(Pipeline.Workspace)/s/infrastructure/helm/flamoral'
                    namespace: $(namespace)
                    environment: 'staging'
                    imageTag: '${{ parameters.imageTag }}'
                    acrLoginServer: $(acrLoginServer)
                    releaseName: 'flamoral-staging'
                    valueFiles:
                      - '$(Pipeline.Workspace)/s/infrastructure/helm/flamoral/values-staging.yaml'
                    replicaCount: 2

            routeTraffic:
              steps:
                - task: Bash@3
                  displayName: 'Verify deployment health'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "Verifying staging deployment..."
                      kubectl wait --for=condition=available deployment --all \
                        -n $(namespace) --timeout=600s

                      kubectl get pods,services,ingress -n $(namespace)

            postRouteTraffic:
              steps:
                - task: Bash@3
                  displayName: 'Run E2E tests'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "Running E2E tests on staging..."
                      cd $(Pipeline.Workspace)/s/apps/web-app
                      npm ci
                      npx playwright install chromium
                      npx playwright test --project=staging
                  continueOnError: true

            on:
              failure:
                steps:
                  - task: DownloadPipelineArtifact@2
                    displayName: 'Download backup'
                    inputs:
                      artifact: 'staging-backup-$(Build.BuildId)'
                      path: '$(System.DefaultWorkingDirectory)'

                  - task: AzureCLI@2
                    displayName: 'Rollback staging deployment'
                    inputs:
                      azureSubscription: 'Azure-Service-Connection'
                      scriptType: 'bash'
                      scriptLocation: 'inlineScript'
                      inlineScript: |
                        echo "Rolling back staging deployment..."
                        az aks get-credentials \
                          --resource-group $(STAGING_RESOURCE_GROUP) \
                          --name $(STAGING_AKS_CLUSTER)

                        kubectl apply -f staging-deployments-backup.yaml -n $(namespace) || echo "Rollback attempted"
                        kubectl rollout status deployment --all -n $(namespace) --timeout=600s

  # ===========================================================================
  # STAGE 4: PRODUCTION APPROVAL GATE
  # ===========================================================================
  - stage: ProductionApproval
    displayName: 'Production Approval Gate'
    dependsOn: DeployStaging
    condition: and(succeeded(), eq('${{ parameters.environment }}', 'production'))
    jobs:
      - job: WaitForApproval
        displayName: 'Wait for Production Approval'
        pool: server
        timeoutInMinutes: 1440  # 24 hours
        steps:
          - task: ManualValidation@0
            displayName: 'Manual approval for production'
            inputs:
              notifyUsers: |
                $(PROD_APPROVER_EMAIL_1)
                $(PROD_APPROVER_EMAIL_2)
              instructions: |
                Please review the staging deployment before approving production deployment.

                Image Tag: ${{ parameters.imageTag }}
                Deployment Strategy: ${{ parameters.deploymentStrategy }}

                Staging URL: $(STAGING_URL)

                Click "Resume" to proceed with production deployment.
                Click "Reject" to cancel.
              onTimeout: 'reject'

  # ===========================================================================
  # STAGE 5: DEPLOY TO PRODUCTION
  # ===========================================================================
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: ProductionApproval
    condition: succeeded()
    variables:
      - group: flamoral-production-vars
      - name: kubernetesServiceConnection
        value: 'flamoral-aks-prod'
      - name: namespace
        value: 'flamoral-prod'
    jobs:
      - deployment: DeployToProductionAKS
        displayName: 'Deploy to Production AKS'
        pool:
          vmImage: $(vmImageName)
        environment: 'flamoral-production'
        strategy:
          runOnce:
            preDeploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Backup production state'
                  inputs:
                    azureSubscription: 'Azure-Service-Connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(PROD_RESOURCE_GROUP) \
                        --name $(PROD_AKS_CLUSTER)

                      # Backup current state
                      kubectl get deployments -n $(namespace) -o yaml > prod-deployments-backup.yaml
                      kubectl get configmaps -n $(namespace) -o yaml > prod-configmaps-backup.yaml
                      kubectl get deployments -n $(namespace) -o jsonpath='{range .items[*]}{.metadata.name}: {.spec.template.spec.containers[0].image}{"\n"}{end}' > prod-versions.txt

                      # Database backup
                      echo "Creating database backup..."
                      az postgres flexible-server backup create \
                        --resource-group $(PROD_RESOURCE_GROUP) \
                        --name flamoral-prod-db \
                        --backup-name "pre-deploy-$(Build.BuildId)" || echo "Database backup attempted"

                - task: PublishPipelineArtifact@1
                  displayName: 'Publish production backup'
                  inputs:
                    targetPath: '$(System.DefaultWorkingDirectory)'
                    artifact: 'production-backup-$(Build.BuildId)'
                    publishLocation: 'pipeline'

            deploy:
              steps:
                - task: Bash@3
                  displayName: 'Deploy with ${{ parameters.deploymentStrategy }} strategy'
                  inputs:
                    targetType: 'inline'
                    script: |
                      az aks get-credentials \
                        --resource-group $(PROD_RESOURCE_GROUP) \
                        --name $(PROD_AKS_CLUSTER)

                      helm version

                      # Deploy based on strategy
                      case "${{ parameters.deploymentStrategy }}" in
                        "canary")
                          echo "Deploying with canary strategy..."

                          # Deploy canary at 10%
                          helm upgrade --install flamoral-prod-canary ./infrastructure/helm/flamoral \
                            --namespace $(namespace) \
                            --values ./infrastructure/helm/flamoral/values-prod.yaml \
                            --set global.image.tag=${{ parameters.imageTag }} \
                            --set global.image.registry=$(acrLoginServer) \
                            --set global.environment=production \
                            --set global.canary.enabled=true \
                            --set global.canary.weight=10 \
                            --set replicaCount=2 \
                            --wait \
                            --timeout 15m

                          echo "Canary deployed at 10%, waiting 3 minutes..."
                          sleep 180

                          # Progressive rollout
                          for weight in 25 50 75 100; do
                            echo "Rolling out to ${weight}%..."
                            helm upgrade flamoral-prod-canary ./infrastructure/helm/flamoral \
                              --namespace $(namespace) \
                              --reuse-values \
                              --set global.canary.weight=$weight \
                              --wait
                            sleep 120
                          done

                          # Finalize
                          helm upgrade flamoral-prod-canary ./infrastructure/helm/flamoral \
                            --namespace $(namespace) \
                            --reuse-values \
                            --set global.canary.enabled=false \
                            --wait
                          ;;

                        "blue-green")
                          echo "Deploying with blue-green strategy..."

                          # Determine current slot
                          CURRENT_SLOT=$(kubectl get configmap deployment-slot -n $(namespace) -o jsonpath='{.data.active}' 2>/dev/null || echo "blue")
                          if [ "$CURRENT_SLOT" = "blue" ]; then
                            DEPLOY_SLOT="green"
                          else
                            DEPLOY_SLOT="blue"
                          fi

                          echo "Deploying to $DEPLOY_SLOT slot..."

                          # Deploy to inactive slot
                          helm upgrade --install flamoral-prod-$DEPLOY_SLOT ./infrastructure/helm/flamoral \
                            --namespace $(namespace) \
                            --values ./infrastructure/helm/flamoral/values-prod.yaml \
                            --set global.image.tag=${{ parameters.imageTag }} \
                            --set global.image.registry=$(acrLoginServer) \
                            --set global.environment=production \
                            --set global.slot=$DEPLOY_SLOT \
                            --set replicaCount=3 \
                            --wait \
                            --timeout 15m

                          # Wait and validate
                          kubectl wait --for=condition=available deployment --all \
                            -l slot=$DEPLOY_SLOT \
                            -n $(namespace) --timeout=600s

                          # Switch traffic
                          kubectl patch configmap deployment-slot -n $(namespace) \
                            --type merge -p "{\"data\":{\"active\":\"$DEPLOY_SLOT\"}}" || \
                          kubectl create configmap deployment-slot -n $(namespace) \
                            --from-literal=active=$DEPLOY_SLOT

                          echo "Traffic switched to $DEPLOY_SLOT"
                          ;;

                        "rolling")
                          echo "Deploying with rolling update strategy..."

                          helm upgrade --install flamoral-prod ./infrastructure/helm/flamoral \
                            --namespace $(namespace) \
                            --values ./infrastructure/helm/flamoral/values-prod.yaml \
                            --set global.image.tag=${{ parameters.imageTag }} \
                            --set global.image.registry=$(acrLoginServer) \
                            --set global.environment=production \
                            --set replicaCount=3 \
                            --set strategy.type=RollingUpdate \
                            --set strategy.rollingUpdate.maxUnavailable=0 \
                            --set strategy.rollingUpdate.maxSurge=1 \
                            --wait \
                            --timeout 20m
                          ;;
                      esac

                - task: Kubernetes@1
                  displayName: 'Run database migrations'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    command: 'apply'
                    arguments: |
                      -f - <<EOF
                      apiVersion: batch/v1
                      kind: Job
                      metadata:
                        name: db-migration-prod-$(Build.BuildId)
                        namespace: $(namespace)
                      spec:
                        ttlSecondsAfterFinished: 3600
                        template:
                          spec:
                            containers:
                            - name: migration
                              image: $(acrLoginServer)/flamoral/user-service:${{ parameters.imageTag }}
                              command: ["npm", "run", "migrate"]
                              envFrom:
                              - secretRef:
                                  name: flamoral-db-secrets
                            restartPolicy: Never
                        backoffLimit: 3
                      EOF
                  continueOnError: true

            routeTraffic:
              steps:
                - task: Bash@3
                  displayName: 'Verify production deployment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      az aks get-credentials \
                        --resource-group $(PROD_RESOURCE_GROUP) \
                        --name $(PROD_AKS_CLUSTER)

                      kubectl get pods,services,ingress -n $(namespace)
                      kubectl wait --for=condition=available deployment --all \
                        -n $(namespace) --timeout=600s

            postRouteTraffic:
              steps:
                - task: Bash@3
                  displayName: 'Production smoke tests'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "Running production smoke tests..."
                      sleep 30

                      services=("api-gateway" "user-service" "matching-service" "messaging-service" "payment-service")
                      for service in "${services[@]}"; do
                        echo "Checking $service health..."
                        curl -sf $(PROD_API_URL)/$service/health || echo "$service health check completed"
                        sleep 2
                      done
                  continueOnError: true

            on:
              failure:
                steps:
                  - task: DownloadPipelineArtifact@2
                    displayName: 'Download production backup'
                    inputs:
                      artifact: 'production-backup-$(Build.BuildId)'
                      path: '$(System.DefaultWorkingDirectory)'

                  - task: AzureCLI@2
                    displayName: 'ROLLBACK production deployment'
                    inputs:
                      azureSubscription: 'Azure-Service-Connection'
                      scriptType: 'bash'
                      scriptLocation: 'inlineScript'
                      inlineScript: |
                        echo "!!! ROLLING BACK PRODUCTION DEPLOYMENT !!!"

                        az aks get-credentials \
                          --resource-group $(PROD_RESOURCE_GROUP) \
                          --name $(PROD_AKS_CLUSTER)

                        # Restore previous deployment
                        kubectl apply -f prod-deployments-backup.yaml -n $(namespace)

                        # Wait for rollback to complete
                        kubectl rollout status deployment --all -n $(namespace) --timeout=600s

                        echo "Rollback completed. Previous version restored."
                        cat prod-versions.txt

                  - task: Bash@3
                    displayName: 'Notify rollback'
                    inputs:
                      targetType: 'inline'
                      script: |
                        curl -X POST $(SLACK_WEBHOOK_URL) \
                          -H 'Content-Type: application/json' \
                          -d '{
                            "text": "⚠️ *PRODUCTION ROLLBACK EXECUTED*",
                            "attachments": [{
                              "color": "warning",
                              "fields": [
                                {"title": "Build", "value": "$(Build.BuildNumber)", "short": true},
                                {"title": "Image Tag", "value": "${{ parameters.imageTag }}", "short": true},
                                {"title": "Reason", "value": "Deployment validation failed", "short": false}
                              ]
                            }]
                          }'
                    continueOnError: true

  # ===========================================================================
  # STAGE 6: POST-DEPLOYMENT NOTIFICATIONS
  # ===========================================================================
  - stage: Notifications
    displayName: 'Send Notifications'
    dependsOn:
      - DeployDevelopment
      - DeployStaging
      - DeployProduction
    condition: always()
    jobs:
      - job: NotifyTeams
        displayName: 'Notify via Slack/Teams'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Bash@3
            displayName: 'Determine deployment status'
            inputs:
              targetType: 'inline'
              script: |
                if [ "$(Agent.JobStatus)" = "Succeeded" ]; then
                  echo "##vso[task.setvariable variable=STATUS_EMOJI]:✅"
                  echo "##vso[task.setvariable variable=STATUS_TEXT]:SUCCESS"
                  echo "##vso[task.setvariable variable=COLOR]:28a745"
                else
                  echo "##vso[task.setvariable variable=STATUS_EMOJI]:❌"
                  echo "##vso[task.setvariable variable=STATUS_TEXT]:FAILED"
                  echo "##vso[task.setvariable variable=COLOR]:dc3545"
                fi

          - task: Bash@3
            displayName: 'Send Slack notification'
            inputs:
              targetType: 'inline'
              script: |
                curl -X POST $(SLACK_WEBHOOK_URL) \
                  -H 'Content-Type: application/json' \
                  -d '{
                    "text": "$(STATUS_EMOJI) *Flamoral Deployment $(STATUS_TEXT)*",
                    "attachments": [{
                      "color": "$(COLOR)",
                      "fields": [
                        {"title": "Environment", "value": "${{ parameters.environment }}", "short": true},
                        {"title": "Strategy", "value": "${{ parameters.deploymentStrategy }}", "short": true},
                        {"title": "Image Tag", "value": "${{ parameters.imageTag }}", "short": true},
                        {"title": "Build", "value": "$(Build.BuildNumber)", "short": true},
                        {"title": "Deployed by", "value": "$(Build.RequestedFor)", "short": false}
                      ]
                    }]
                  }'
            condition: ne(variables['SLACK_WEBHOOK_URL'], '')
            continueOnError: true

          - task: Bash@3
            displayName: 'Send Teams notification'
            inputs:
              targetType: 'inline'
              script: |
                curl -X POST $(TEAMS_WEBHOOK_URL) \
                  -H 'Content-Type: application/json' \
                  -d '{
                    "@type": "MessageCard",
                    "@context": "https://schema.org/extensions",
                    "summary": "Flamoral Deployment",
                    "themeColor": "$(COLOR)",
                    "title": "$(STATUS_EMOJI) Flamoral Deployment $(STATUS_TEXT)",
                    "sections": [{
                      "facts": [
                        {"name": "Environment", "value": "${{ parameters.environment }}"},
                        {"name": "Strategy", "value": "${{ parameters.deploymentStrategy }}"},
                        {"name": "Image Tag", "value": "${{ parameters.imageTag }}"},
                        {"name": "Build", "value": "$(Build.BuildNumber)"},
                        {"name": "Deployed by", "value": "$(Build.RequestedFor)"}
                      ]
                    }],
                    "potentialAction": [{
                      "@type": "OpenUri",
                      "name": "View Build",
                      "targets": [{
                        "os": "default",
                        "uri": "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                      }]
                    }]
                  }'
            condition: ne(variables['TEAMS_WEBHOOK_URL'], '')
            continueOnError: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish deployment logs'
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'deployment-logs-$(Build.BuildId)'
              publishLocation: 'Container'
