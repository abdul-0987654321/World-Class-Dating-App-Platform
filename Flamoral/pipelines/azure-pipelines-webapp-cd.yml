# Azure DevOps CD Pipeline for FLAMORAL Web App
# Deploys frontend to Azure Static Web Apps (no Docker)
# Deploys backend to Azure App Service (no Docker)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/web-app/**
      - backend/**

variables:
  - group: flamoral-production-vars
  - name: nodeVersion
    value: '20.x'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: webAppResourceGroup
    value: 'flamoral-prod-rg'
  - name: frontendAppName
    value: 'flamoral-frontend'
  - name: backendAppName
    value: 'flamoral-api'

stages:
  # ================================
  # Stage 1: Build Frontend
  # ================================
  - stage: BuildFrontend
    displayName: 'Build Frontend'
    jobs:
      - job: Build
        displayName: 'Build Web App'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache node_modules'
            inputs:
              key: 'npm | "$(Agent.OS)" | apps/web-app/package-lock.json'
              path: apps/web-app/node_modules

          - script: |
              cd apps/web-app
              npm ci
            displayName: 'Install dependencies'

          - script: |
              cd apps/web-app
              npm run build
            displayName: 'Build production bundle'
            env:
              VITE_API_URL: https://api.flamoral.com/api/v1
              VITE_WS_URL: wss://api.flamoral.com
              VITE_SOCKET_URL: https://api.flamoral.com
              VITE_GRAPHQL_URL: https://api.flamoral.com/graphql
              VITE_APP_NAME: Flamoral
              VITE_APP_VERSION: $(Build.BuildId)
              VITE_APP_ENV: production
              VITE_APP_DOMAIN: https://flamoral.com
              VITE_CDN_URL: https://cdn.flamoral.com
              VITE_MEDIA_CDN_URL: https://media.flamoral.com
              VITE_ENABLE_VIDEO_CALLS: true
              VITE_ENABLE_AI_FEATURES: true
              VITE_ENABLE_PREMIUM_SUBSCRIPTIONS: true
              VITE_ENABLE_PHOTO_VERIFICATION: true
              VITE_ENABLE_GAMIFICATION: true
              VITE_ENABLE_MOCK_API: false
              VITE_ENABLE_DEBUG: false
              VITE_LOG_LEVEL: error
              VITE_STRIPE_PUBLISHABLE_KEY: $(STRIPE_PUBLISHABLE_KEY)
              VITE_GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
              VITE_AGORA_APP_ID: $(AGORA_APP_ID)
              VITE_GA_MEASUREMENT_ID: $(GA_MEASUREMENT_ID)
              VITE_SENTRY_DSN: $(SENTRY_DSN)
              VITE_GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish frontend artifact'
            inputs:
              targetPath: 'apps/web-app/dist'
              artifact: 'frontend-dist'
              publishLocation: 'pipeline'

  # ================================
  # Stage 2: Build Backend Services
  # ================================
  - stage: BuildBackend
    displayName: 'Build Backend'
    jobs:
      - job: Build
        displayName: 'Build API Services'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              npm ci
            displayName: 'Install root dependencies'

          - script: |
              npm run build:backend
            displayName: 'Build backend TypeScript'

          - task: CopyFiles@2
            displayName: 'Prepare deployment package'
            inputs:
              SourceFolder: 'backend'
              Contents: |
                **/*.js
                **/*.json
                **/package.json
                **/package-lock.json
                !**/node_modules/**
              TargetFolder: '$(Build.ArtifactStagingDirectory)/backend'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish backend artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/backend'
              artifact: 'backend-dist'
              publishLocation: 'pipeline'

  # ================================
  # Stage 3: Deploy Frontend to Azure Static Web Apps
  # ================================
  - stage: DeployFrontend
    displayName: 'Deploy Frontend'
    dependsOn: BuildFrontend
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: 'Deploy to Azure Static Web Apps'
        pool:
          vmImage: $(vmImageName)
        environment: 'production-frontend'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  displayName: 'Download frontend artifact'
                  inputs:
                    artifact: 'frontend-dist'
                    path: '$(Pipeline.Workspace)/frontend'

                - task: AzureStaticWebApp@0
                  displayName: 'Deploy to Azure Static Web Apps'
                  inputs:
                    workingDirectory: '$(Pipeline.Workspace)/frontend'
                    app_location: '/'
                    skip_app_build: true
                    azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_TOKEN)

  # ================================
  # Stage 4: Deploy Backend to Azure App Service
  # ================================
  - stage: DeployBackend
    displayName: 'Deploy Backend'
    dependsOn: BuildBackend
    condition: succeeded()
    jobs:
      - deployment: DeployAPI
        displayName: 'Deploy API Gateway'
        pool:
          vmImage: $(vmImageName)
        environment: 'production-backend'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  displayName: 'Download backend artifact'
                  inputs:
                    artifact: 'backend-dist'
                    path: '$(Pipeline.Workspace)/backend'

                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service'
                  inputs:
                    azureSubscription: 'Azure-Production-Connection'
                    appType: 'webAppLinux'
                    appName: $(backendAppName)
                    resourceGroupName: $(webAppResourceGroup)
                    package: '$(Pipeline.Workspace)/backend'
                    runtimeStack: 'NODE|20-lts'
                    startUpCommand: 'npm run start:production'

  # ================================
  # Stage 5: Post-Deployment Verification
  # ================================
  - stage: Verify
    displayName: 'Verify Deployment'
    dependsOn:
      - DeployFrontend
      - DeployBackend
    condition: succeeded()
    jobs:
      - job: HealthCheck
        displayName: 'Health Checks'
        pool:
          vmImage: $(vmImageName)
        steps:
          - script: |
              echo "Verifying frontend deployment..."
              curl -f https://flamoral.com || exit 1
              echo "Frontend: OK"

              echo "Verifying API deployment..."
              curl -f https://api.flamoral.com/health || exit 1
              echo "API: OK"

              echo "All health checks passed!"
            displayName: 'Run health checks'

          - script: |
              echo "Deployment completed successfully!"
              echo "Frontend: https://flamoral.com"
              echo "API: https://api.flamoral.com"
              echo "Build: $(Build.BuildId)"
            displayName: 'Deployment summary'
