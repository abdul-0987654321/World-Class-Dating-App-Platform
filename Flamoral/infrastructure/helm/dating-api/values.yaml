replicaCount: 2

image:
  repository: flamoralacr.azurecr.io/api-gateway
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: acr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 4000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/websocket-services: "realtime-service"
  hosts:
    - host: api.flamoral.com
      paths:
        - path: /
          pathType: Prefix
    - host: api-dev.flamoral.com
      paths:
        - path: /
          pathType: Prefix
    - host: api-staging.flamoral.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - api.flamoral.com
        - api-dev.flamoral.com
        - api-staging.flamoral.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - dating-api
          topologyKey: kubernetes.io/hostname

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "4000"
  - name: LOG_LEVEL
    value: "info"
  - name: LOG_FORMAT
    value: "json"

# Service URLs
  - name: AUTH_SERVICE_URL
    value: "http://flamoral-auth-service:3001"
  - name: USER_SERVICE_URL
    value: "http://flamoral-user-service:3002"
  - name: MATCHING_SERVICE_URL
    value: "http://flamoral-matching-service:3009"
  - name: MESSAGING_SERVICE_URL
    value: "http://flamoral-messaging-service:3004"
  - name: PAYMENT_SERVICE_URL
    value: "http://flamoral-payment-service:3005"
  - name: MEDIA_SERVICE_URL
    value: "http://flamoral-media-service:3006"
  - name: ANALYTICS_SERVICE_URL
    value: "http://flamoral-analytics-service:3007"
  - name: MODERATION_SERVICE_URL
    value: "http://flamoral-moderation-service:3008"
  - name: ADMIN_SERVICE_URL
    value: "http://flamoral-admin-service:3010"
  - name: NOTIFICATION_SERVICE_URL
    value: "http://flamoral-notification-service:3012"
  - name: REALTIME_SERVICE_URL
    value: "http://flamoral-realtime-service:8081"

# AI Services
  - name: RECOMMENDATION_SERVICE_URL
    value: "http://flamoral-recommendation-service:5000"
  - name: NLP_SERVICE_URL
    value: "http://flamoral-nlp-service:5001"
  - name: PHOTO_ANALYSIS_SERVICE_URL
    value: "http://flamoral-photo-analysis-service:5002"
  - name: FRAUD_DETECTION_SERVICE_URL
    value: "http://flamoral-fraud-detection-service:5003"
  - name: DATING_COACH_SERVICE_URL
    value: "http://flamoral-dating-coach-service:5004"
  - name: CONTENT_GENERATOR_SERVICE_URL
    value: "http://flamoral-content-generator-service:5005"

# CORS Configuration
  - name: CORS_ORIGINS
    value: "https://flamoral.com,https://www.flamoral.com,https://app.flamoral.com,https://admin.flamoral.com"
  - name: CORS_CREDENTIALS
    value: "true"

envFrom:
  - configMapRef:
      name: dating-api-config
  - secretRef:
      name: dating-api-secrets

livenessProbe:
  httpGet:
    path: /health/live
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 4000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /app/.cache

volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}
