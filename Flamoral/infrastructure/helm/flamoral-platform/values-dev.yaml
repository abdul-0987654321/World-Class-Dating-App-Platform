# Development Environment Values

global:
  environment: development
  domain: dev.flamoral.com
  imagePullPolicy: IfNotPresent

services:
  apiGateway:
    replicaCount: 2
    autoscaling:
      minReplicas: 2
      maxReplicas: 5
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  authService:
    replicaCount: 2
    autoscaling:
      minReplicas: 2
      maxReplicas: 5

  userService:
    replicaCount: 1
    autoscaling:
      minReplicas: 1
      maxReplicas: 3

  matchingService:
    replicaCount: 1
    autoscaling:
      minReplicas: 1
      maxReplicas: 3

  messagingService:
    replicaCount: 2
    autoscaling:
      minReplicas: 2
      maxReplicas: 5

  mediaService:
    replicaCount: 1
    env:
      S3_BUCKET: "flamoral-media-dev"

  paymentService:
    replicaCount: 1
    env:
      STRIPE_MODE: "test"

  notificationService:
    replicaCount: 1
    env:
      EMAIL_MODE: "sandbox"

  analyticsService:
    replicaCount: 1

  moderationService:
    replicaCount: 1

  realtimeService:
    replicaCount: 2
    autoscaling:
      minReplicas: 2
      maxReplicas: 5

  adminService:
    replicaCount: 1

  advertisingService:
    replicaCount: 1

  automationService:
    replicaCount: 1

  workflowEngine:
    replicaCount: 1

aiServices:
  recommendationService:
    replicaCount: 1
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
        nvidia.com/gpu: 0
      limits:
        memory: "4Gi"
        cpu: "2000m"
        nvidia.com/gpu: 0

  datingCoachService:
    replicaCount: 1

  moderationAIService:
    replicaCount: 1
    resources:
      requests:
        nvidia.com/gpu: 0
      limits:
        nvidia.com/gpu: 0

postgresql:
  primary:
    persistence:
      size: 20Gi
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
  readReplicas:
    replicaCount: 0

redis:
  replica:
    replicaCount: 1
  master:
    persistence:
      size: 5Gi

mongodb:
  replicaCount: 1
  persistence:
    size: 10Gi

kafka:
  replicaCount: 1
  persistence:
    size: 10Gi
  zookeeper:
    replicaCount: 1

monitoring:
  prometheus:
    enabled: true
    server:
      retention: 7d
      persistentVolume:
        size: 20Gi
      resources:
        requests:
          memory: 1Gi
          cpu: 500m

  grafana:
    enabled: true

tracing:
  jaeger:
    enabled: true

logging:
  loki:
    enabled: true
    loki:
      persistence:
        size: 10Gi
