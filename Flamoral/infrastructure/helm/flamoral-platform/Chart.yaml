apiVersion: v2
name: flamoral-platform
description: Complete Helm chart for Flamoral Dating Platform - All microservices
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - dating
  - microservices
  - flamoral
home: https://flamoral.com
sources:
  - https://github.com/flamoral/dating-platform
maintainers:
  - name: Flamoral DevOps Team
    email: devops@flamoral.com
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: mongodb
    version: "13.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: mongodb.enabled
  - name: kafka
    version: "22.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
  - name: prometheus
    version: "15.x.x"
    repository: "https://prometheus-community.github.io/helm-charts"
    alias: prometheus
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "6.x.x"
    repository: "https://grafana.github.io/helm-charts"
    condition: monitoring.grafana.enabled
  - name: jaeger
    version: "0.x.x"
    repository: "https://jaegertracing.github.io/helm-charts"
    condition: tracing.jaeger.enabled
  - name: loki-stack
    version: "2.x.x"
    repository: "https://grafana.github.io/helm-charts"
    condition: logging.loki.enabled
