apiGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: api-gateway
    tag: ""  # Uses global.imageTag if empty
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  env:
    NODE_ENV: production
    PORT: "4000"

