# =============================================================================
# Ingress Configuration
# =============================================================================

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/websocket-services: "realtime-service"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: api.flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
          port: 4000
    - host: www.flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
          port: 4000
    - host: flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
          port: 4000
    - host: ws.flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: realtime-service
          port: 8081
    - host: admin.flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: admin-service
          port: 3010
  tls:
    - secretName: flamoral-tls
      hosts:
        - flamoral.com
        - www.flamoral.com
        - api.flamoral.com
        - admin.flamoral.com
        - ws.flamoral.com

# =============================================================================
# Autoscaling Configuration
# =============================================================================

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# =============================================================================
# Pod Disruption Budget
# =============================================================================

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# =============================================================================
# Service Account
# =============================================================================

serviceAccount:
  create: true
  annotations: {}
  name: ""

# =============================================================================
# Pod Security
# =============================================================================

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true

# =============================================================================
# Resource Defaults
# =============================================================================

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# =============================================================================
# Health Probes
# =============================================================================

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# =============================================================================
# Node Selection
# =============================================================================

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - flamoral
          topologyKey: kubernetes.io/hostname

# =============================================================================
# Circuit Breaker Configuration
# =============================================================================

circuitBreaker:
  failureThreshold: 5
  failureRateThreshold: 50
  successThreshold: 5
  timeout: 15000
  resetTimeout: 60000
  minimumRequests: 5
  slowCallThreshold: 5000
  slowCallRateThreshold: 80
  halfOpenMaxCalls: 10
  slidingWindowSize: 100

# =============================================================================
# Proxy Configuration
# =============================================================================

proxy:
  maxRetries: 1
  retryDelay: 500

# =============================================================================
# Service Timeouts (milliseconds)
# =============================================================================

serviceTimeouts:
  default: 15000
  auth: 5000
  user: 10000
  messaging: 15000
  media: 45000
  moderation: 20000
  payment: 30000
  matching: 15000

# =============================================================================
# CORS Configuration
# =============================================================================

cors:
  origins: "https://flamoral.com,https://www.flamoral.com,https://admin.flamoral.com"
  credentials: true

# =============================================================================
# Logging Configuration
# =============================================================================

logging:
  level: info
  format: json

# =============================================================================
# Rate Limiting Configuration
# =============================================================================

rateLimit:
  user:
    points: 1000
    duration: 900
    blockDuration: 300
  ip:
    points: 500
    duration: 900
    blockDuration: 600
  auth:
    points: 5
    duration: 900
    blockDuration: 3600

# =============================================================================
# Secrets Configuration
# =============================================================================
# NOTE: For production, use external secret management (e.g., Azure Key Vault,
# AWS Secrets Manager, HashiCorp Vault) instead of storing secrets in values files
# =============================================================================

secrets:
  enabled: true

  # Database credentials
  database:
    url: ""  # Full connection string (optional, overrides individual fields)
    host: "postgres"
    port: "5432"
    name: "flamoral"
    user: "postgres"
    password: ""  # Set via --set secrets.database.password=xxx or use external secrets

  # Redis credentials
  redis:
    url: ""  # Full connection string (optional)
    host: "redis"
    port: "6379"
    password: ""  # Set if Redis requires authentication

  # JWT configuration
  jwt:
    secret: ""  # REQUIRED: Set a strong secret
    refreshSecret: ""  # REQUIRED: Set a different strong secret
    accessExpiration: "15m"
    refreshExpiration: "7d"

  # OAuth providers
  oauth:
    google:
      clientId: ""
      clientSecret: ""
    facebook:
      appId: ""
      appSecret: ""
    apple:
      clientId: ""
      teamId: ""
      keyId: ""
      privateKey: ""

  # Cloud storage
  storage:
    aws:
      accessKeyId: ""
      secretAccessKey: ""
      region: "us-east-1"
      bucket: ""
    azure:
      account: ""
      key: ""
      container: ""

  # Email service
  email:
    sendgrid:
      apiKey: ""
    ses:
      accessKeyId: ""
      secretAccessKey: ""
      region: "us-east-1"
    from: "noreply@flamoral.com"

  # SMS service
  sms:
    twilio:
      accountSid: ""
      authToken: ""
      phoneNumber: ""

  # Payment gateways
  payment:
    stripe:
      publicKey: ""
      secretKey: ""
      webhookSecret: ""
    paypal:
      clientId: ""
      clientSecret: ""
      mode: "sandbox"  # or "live" for production

  # Push notifications
  push:
    fcm:
      serverKey: ""
      senderId: ""
    apns:
      keyId: ""
      teamId: ""
      privateKey: ""
      production: false

  # AI/ML services
  ai:
    openai:
      apiKey: ""
      organization: ""
    azure:
      key: ""
      endpoint: ""

  # Analytics
  analytics:
    segment:
      writeKey: ""
    mixpanel:
      token: ""

  # Error tracking
  sentry:
    dsn: ""
    environment: ""  # Defaults to global.environment

  # Encryption
  encryption:
    key: ""  # REQUIRED: Set a strong encryption key
    algorithm: "aes-256-gcm"

  # Session management
  session:
    secret: ""  # REQUIRED: Set a strong session secret

  # Additional API keys
  apiKeys: {}
    # CUSTOM_API_KEY: "value"
    # ANOTHER_KEY: "value"
