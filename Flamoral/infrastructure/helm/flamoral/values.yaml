# =============================================================================
# Flamoral Dating Platform - Helm Values
# =============================================================================
# Global configuration for all microservices
# =============================================================================

global:
  environment: dev
  imageRegistry: flamoralacr.azurecr.io
  imageTag: latest
  imagePullSecrets:
    - name: acr-secret
  slot: blue

# Common settings
common:
  enabled: false

