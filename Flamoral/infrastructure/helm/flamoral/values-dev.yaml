# =============================================================================
# Flamoral Dating Platform - Development Environment Values
# =============================================================================
# Overrides for development environment
# =============================================================================

global:
  environment: development
  imageRegistry: flamoraldevacr.azurecr.io
  imageTag: dev-latest

# Development uses fewer replicas
apiGateway:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

authService:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

userService:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

matchingService:
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

messagingService:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

mediaService:
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

paymentService:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

notificationService:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

analyticsService:
  replicaCount: 1

moderationService:
  replicaCount: 1

advertisingService:
  enabled: false

realtimeService:
  replicaCount: 1

# Development ingress
ingress:
  hosts:
    - host: dev-api.flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
  tls:
    - secretName: dev-flamoral-tls
      hosts:
        - dev-api.flamoral.com

# Disable autoscaling in dev
autoscaling:
  enabled: false

# Disable PDB in dev
podDisruptionBudget:
  enabled: false
