{{- if .Values.secrets.enabled -}}
{{- $fullName := include "flamoral.fullname" . -}}
{{- $labels := include "flamoral.labels" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  # Database Credentials
  {{- if .Values.secrets.database }}
  DATABASE_URL: {{ .Values.secrets.database.url | quote }}
  DATABASE_HOST: {{ .Values.secrets.database.host | default "postgres" | quote }}
  DATABASE_PORT: {{ .Values.secrets.database.port | default "5432" | quote }}
  DATABASE_NAME: {{ .Values.secrets.database.name | default "flamoral" | quote }}
  DATABASE_USER: {{ .Values.secrets.database.user | default "postgres" | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.database.password | quote }}
  {{- end }}

  # Redis Credentials
  {{- if .Values.secrets.redis }}
  REDIS_URL: {{ .Values.secrets.redis.url | quote }}
  REDIS_HOST: {{ .Values.secrets.redis.host | default "redis" | quote }}
  REDIS_PORT: {{ .Values.secrets.redis.port | default "6379" | quote }}
  {{- if .Values.secrets.redis.password }}
  REDIS_PASSWORD: {{ .Values.secrets.redis.password | quote }}
  {{- end }}
  {{- end }}

  # JWT Secrets
  {{- if .Values.secrets.jwt }}
  JWT_SECRET: {{ .Values.secrets.jwt.secret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwt.refreshSecret | quote }}
  JWT_ACCESS_EXPIRATION: {{ .Values.secrets.jwt.accessExpiration | default "15m" | quote }}
  JWT_REFRESH_EXPIRATION: {{ .Values.secrets.jwt.refreshExpiration | default "7d" | quote }}
  {{- end }}

  # OAuth Credentials
  {{- if .Values.secrets.oauth }}
  {{- if .Values.secrets.oauth.google }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.oauth.google.clientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.oauth.google.clientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.oauth.facebook }}
  FACEBOOK_APP_ID: {{ .Values.secrets.oauth.facebook.appId | quote }}
  FACEBOOK_APP_SECRET: {{ .Values.secrets.oauth.facebook.appSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.oauth.apple }}
  APPLE_CLIENT_ID: {{ .Values.secrets.oauth.apple.clientId | quote }}
  APPLE_TEAM_ID: {{ .Values.secrets.oauth.apple.teamId | quote }}
  APPLE_KEY_ID: {{ .Values.secrets.oauth.apple.keyId | quote }}
  APPLE_PRIVATE_KEY: {{ .Values.secrets.oauth.apple.privateKey | quote }}
  {{- end }}
  {{- end }}

  # AWS/Azure Cloud Storage
  {{- if .Values.secrets.storage }}
  {{- if .Values.secrets.storage.aws }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.storage.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.storage.aws.secretAccessKey | quote }}
  AWS_REGION: {{ .Values.secrets.storage.aws.region | default "us-east-1" | quote }}
  AWS_S3_BUCKET: {{ .Values.secrets.storage.aws.bucket | quote }}
  {{- end }}
  {{- if .Values.secrets.storage.azure }}
  AZURE_STORAGE_ACCOUNT: {{ .Values.secrets.storage.azure.account | quote }}
  AZURE_STORAGE_KEY: {{ .Values.secrets.storage.azure.key | quote }}
  AZURE_STORAGE_CONTAINER: {{ .Values.secrets.storage.azure.container | quote }}
  {{- end }}
  {{- end }}

  # Email Service (SendGrid, SES, etc.)
  {{- if .Values.secrets.email }}
  {{- if .Values.secrets.email.sendgrid }}
  SENDGRID_API_KEY: {{ .Values.secrets.email.sendgrid.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.email.ses }}
  SES_ACCESS_KEY_ID: {{ .Values.secrets.email.ses.accessKeyId | quote }}
  SES_SECRET_ACCESS_KEY: {{ .Values.secrets.email.ses.secretAccessKey | quote }}
  SES_REGION: {{ .Values.secrets.email.ses.region | default "us-east-1" | quote }}
  {{- end }}
  EMAIL_FROM: {{ .Values.secrets.email.from | default "noreply@flamoral.com" | quote }}
  {{- end }}

  # SMS Service (Twilio, SNS, etc.)
  {{- if .Values.secrets.sms }}
  {{- if .Values.secrets.sms.twilio }}
  TWILIO_ACCOUNT_SID: {{ .Values.secrets.sms.twilio.accountSid | quote }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.sms.twilio.authToken | quote }}
  TWILIO_PHONE_NUMBER: {{ .Values.secrets.sms.twilio.phoneNumber | quote }}
  {{- end }}
  {{- end }}

  # Payment Gateway (Stripe, PayPal)
  {{- if .Values.secrets.payment }}
  {{- if .Values.secrets.payment.stripe }}
  STRIPE_PUBLIC_KEY: {{ .Values.secrets.payment.stripe.publicKey | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.payment.stripe.secretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.payment.stripe.webhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.payment.paypal }}
  PAYPAL_CLIENT_ID: {{ .Values.secrets.payment.paypal.clientId | quote }}
  PAYPAL_CLIENT_SECRET: {{ .Values.secrets.payment.paypal.clientSecret | quote }}
  PAYPAL_MODE: {{ .Values.secrets.payment.paypal.mode | default "sandbox" | quote }}
  {{- end }}
  {{- end }}

  # Push Notifications (FCM, APNS)
  {{- if .Values.secrets.push }}
  {{- if .Values.secrets.push.fcm }}
  FCM_SERVER_KEY: {{ .Values.secrets.push.fcm.serverKey | quote }}
  FCM_SENDER_ID: {{ .Values.secrets.push.fcm.senderId | quote }}
  {{- end }}
  {{- if .Values.secrets.push.apns }}
  APNS_KEY_ID: {{ .Values.secrets.push.apns.keyId | quote }}
  APNS_TEAM_ID: {{ .Values.secrets.push.apns.teamId | quote }}
  APNS_PRIVATE_KEY: {{ .Values.secrets.push.apns.privateKey | quote }}
  APNS_PRODUCTION: {{ .Values.secrets.push.apns.production | default "false" | quote }}
  {{- end }}
  {{- end }}

  # AI/ML Services
  {{- if .Values.secrets.ai }}
  {{- if .Values.secrets.ai.openai }}
  OPENAI_API_KEY: {{ .Values.secrets.ai.openai.apiKey | quote }}
  OPENAI_ORGANIZATION: {{ .Values.secrets.ai.openai.organization | quote }}
  {{- end }}
  {{- if .Values.secrets.ai.azure }}
  AZURE_OPENAI_KEY: {{ .Values.secrets.ai.azure.key | quote }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.secrets.ai.azure.endpoint | quote }}
  {{- end }}
  {{- end }}

  # Analytics & Monitoring
  {{- if .Values.secrets.analytics }}
  {{- if .Values.secrets.analytics.segment }}
  SEGMENT_WRITE_KEY: {{ .Values.secrets.analytics.segment.writeKey | quote }}
  {{- end }}
  {{- if .Values.secrets.analytics.mixpanel }}
  MIXPANEL_TOKEN: {{ .Values.secrets.analytics.mixpanel.token | quote }}
  {{- end }}
  {{- end }}

  # Error Tracking (Sentry)
  {{- if .Values.secrets.sentry }}
  SENTRY_DSN: {{ .Values.secrets.sentry.dsn | quote }}
  SENTRY_ENVIRONMENT: {{ .Values.secrets.sentry.environment | default .Values.global.environment | quote }}
  {{- end }}

  # Encryption Keys
  {{- if .Values.secrets.encryption }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryption.key | quote }}
  ENCRYPTION_ALGORITHM: {{ .Values.secrets.encryption.algorithm | default "aes-256-gcm" | quote }}
  {{- end }}

  # Session Store
  {{- if .Values.secrets.session }}
  SESSION_SECRET: {{ .Values.secrets.session.secret | quote }}
  {{- end }}

  # API Keys for Third-party Services
  {{- if .Values.secrets.apiKeys }}
  {{- range $key, $value := .Values.secrets.apiKeys }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}

{{- end }}
