{{- $fullName := include "flamoral.fullname" . -}}
{{- $labels := include "flamoral.labels" . -}}
{{- $selectorLabels := include "flamoral.selectorLabels" . -}}

# =============================================================================
# API Gateway Service
# =============================================================================
{{- if .Values.apiGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: api-gateway
  {{- if .Values.global.slot }}
  annotations:
    deployment.kubernetes.io/slot: {{ .Values.global.slot | quote }}
  {{- end }}
spec:
  type: {{ .Values.apiGateway.service.type }}
  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- $selectorLabels | nindent 4 }}
    app.kubernetes.io/component: api-gateway
    {{- if .Values.global.slot }}
    slot: {{ .Values.global.slot }}
    {{- end }}
---
{{- end }}

