# =============================================================================
# Flamoral Production Ingress - Updated with Admin Subdomain
# =============================================================================
# Routes traffic to Web App, API Gateway, and Admin Service
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flamoral-ingress
  namespace: flamoral
  annotations:
    # cert-manager annotation for automatic SSL/TLS certificate provisioning
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # NGINX ingress annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/websocket-services: "realtime-service"

    # ExternalDNS annotations (optional - only if using ExternalDNS)
    external-dns.alpha.kubernetes.io/hostname: flamoral.com,www.flamoral.com,api.flamoral.com,admin.flamoral.com
    external-dns.alpha.kubernetes.io/ttl: "300"

  labels:
    app: flamoral
    environment: production
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - flamoral.com
    - www.flamoral.com
    - api.flamoral.com
    - admin.flamoral.com
    secretName: flamoral-tls
  rules:
  # Web App - Main domain
  - host: flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app
            port:
              number: 80

  # Web App - www subdomain
  - host: www.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app
            port:
              number: 80

  # API Gateway - api subdomain
  - host: api.flamoral.com
    http:
      paths:
      # Health check endpoint - CRITICAL: must be first for priority routing
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
      # Route /api/* to API Gateway
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
      # Default route to API Gateway
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000

  # Admin Dashboard - admin subdomain
  - host: admin.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-service
            port:
              number: 3010
