---
# Docker setup playbook
# Installs and configures Docker and Docker Compose

- name: Setup Docker
  hosts: all
  become: yes
  tasks:
    - name: Remove old Docker versions
      apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add application user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes

    - name: Configure Docker daemon
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            },
            "storage-driver": "overlay2",
            "storage-opts": [
              "overlay2.override_kernel_check=true"
            ],
            "live-restore": true,
            "userland-proxy": false,
            "default-address-pools": [
              {
                "base": "172.80.0.0/16",
                "size": 24
              }
            ],
            "metrics-addr": "0.0.0.0:9323",
            "experimental": true
          }
      notify: Restart Docker

    - name: Install Docker Compose standalone
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Create Docker network for application
      docker_network:
        name: dating-app-network
        driver: bridge
        state: present

    - name: Login to Docker registry
      docker_login:
        registry_url: "{{ docker_registry }}"
        username: "{{ docker_registry_username }}"
        password: "{{ docker_registry_password }}"
      when: docker_registry_username is defined and docker_registry_password is defined

    - name: Install Docker monitoring tools
      apt:
        name:
          - docker-compose
        state: present

  handlers:
    - name: Restart Docker
      service:
        name: docker
        state: restarted
