---
# Ansible Inventory for Azure-hosted Dating App Platform

all:
  children:
    # Development Environment - Azure
    azure_dev:
      children:
        azure_dev_aks:
          hosts:
            azure-dev-aks-01:
              ansible_host: 10.1.1.10
              ansible_user: azureuser
              ansible_ssh_private_key_file: ~/.ssh/dating-app-azure-dev.pem
              azure_resource_group: dev-dating-app-rg
              azure_location: eastus

    # Staging Environment - Azure
    azure_staging:
      children:
        azure_staging_aks:
          hosts:
            azure-staging-aks-01:
              ansible_host: 10.2.1.10
              ansible_user: azureuser
              ansible_ssh_private_key_file: ~/.ssh/dating-app-azure-staging.pem
              azure_resource_group: staging-dating-app-rg
              azure_location: eastus
            azure-staging-aks-02:
              ansible_host: 10.2.1.11
              ansible_user: azureuser
              ansible_ssh_private_key_file: ~/.ssh/dating-app-azure-staging.pem
              azure_resource_group: staging-dating-app-rg
              azure_location: eastus

    # Production Environment - Azure
    azure_production:
      children:
        azure_prod_aks:
          hosts:
            azure-prod-aks-01:
              ansible_host: 10.0.1.10
              ansible_user: azureuser
              ansible_ssh_private_key_file: ~/.ssh/dating-app-azure-prod.pem
              azure_resource_group: production-dating-app-rg
              azure_location: eastus
            azure-prod-aks-02:
              ansible_host: 10.0.1.11
              ansible_user: azureuser
              ansible_ssh_private_key_file: ~/.ssh/dating-app-azure-prod.pem
              azure_resource_group: production-dating-app-rg
              azure_location: eastus
            azure-prod-aks-03:
              ansible_host: 10.0.1.12
              ansible_user: azureuser
              ansible_ssh_private_key_file: ~/.ssh/dating-app-azure-prod.pem
              azure_resource_group: production-dating-app-rg
              azure_location: eastus

  # Global variables for Azure
  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_name: dating-app
    app_user: datingapp
    app_group: datingapp
    cloud_provider: azure
    docker_version: "24.0"
    nodejs_version: "20.x"

    # Azure-specific variables
    azure_subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
    azure_tenant_id: "{{ lookup('env', 'AZURE_TENANT_ID') }}"
