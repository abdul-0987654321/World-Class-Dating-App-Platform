# =============================================================================
# Nginx Cache Headers Configuration
# Optimized for Flamoral Dating Platform
# =============================================================================
# This configuration sets proper cache headers for different content types
# to maximize CDN hit ratios and minimize origin requests
# =============================================================================

# Static assets with versioned filenames - cache for 1 year (immutable)
location ~* ^/assets/.+\.(js|css|woff|woff2|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Cache-Status $upstream_cache_status;

    # Enable CORS for fonts
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript font/woff font/woff2;
    gzip_comp_level 6;

    # Enable sendfile for better performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
}

# Images - cache for 30 days
location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    add_header X-Cache-Status $upstream_cache_status;

    # Vary header for responsive images
    add_header Vary "Accept";

    # Enable CORS for images
    add_header Access-Control-Allow-Origin "*";

    # No compression for images (already compressed)
    gzip off;

    # Enable sendfile
    sendfile on;
    tcp_nopush on;
}

# Videos - cache for 30 days
location ~* \.(mp4|webm|mov|avi)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Cache-Status $upstream_cache_status;

    # Enable range requests for video seeking
    add_header Accept-Ranges "bytes";

    # No compression for videos
    gzip off;

    # Enable sendfile and directio for large files
    sendfile on;
    directio 4m;
    output_buffers 1 128k;
}

# Manifest and service worker - cache for 1 hour with revalidation
location ~* \.(manifest|json|webmanifest)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header X-Cache-Status $upstream_cache_status;

    # Gzip compression
    gzip on;
    gzip_types application/json application/manifest+json;
}

# Service worker - no cache (must always be fresh)
location = /service-worker.js {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate, private";
    add_header Pragma "no-cache";

    # Gzip compression
    gzip on;
    gzip_types application/javascript;
}

# HTML pages - cache for 1 hour with revalidation
location ~* \.html?$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate, stale-while-revalidate=300";
    add_header X-Cache-Status $upstream_cache_status;

    # ETag support for conditional requests
    etag on;

    # Gzip compression
    gzip on;
    gzip_types text/html;
}

# API responses - conditional caching
location /api/ {
    # Default: no cache for API responses
    add_header Cache-Control "no-cache, no-store, must-revalidate, private";
    add_header Pragma "no-cache";

    # Override for specific cacheable endpoints
    location ~ ^/api/v1/(interests|passions|config|public)/ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=60";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # User-specific data - private cache
    location ~ ^/api/v1/(users|profiles|matches|notifications)/ {
        expires 1m;
        add_header Cache-Control "private, max-age=60, must-revalidate";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Analytics - cache for 15 minutes
    location ~ ^/api/v1/analytics/ {
        expires 15m;
        add_header Cache-Control "private, max-age=900";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Gzip compression for API responses
    gzip on;
    gzip_types application/json application/xml text/plain;
    gzip_comp_level 5;
}

# Health checks and metrics - no cache
location ~ ^/(health|healthz|ready|live|metrics)$ {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";

    access_log off;
    gzip off;
}

# WebSocket and realtime - no cache
location ~ ^/(ws|socket\.io|signalr|realtime)/ {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";

    # WebSocket upgrade headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # No buffering for realtime
    proxy_buffering off;
    proxy_cache off;
    gzip off;
}

# Sensitive endpoints - strict no-cache
location ~ ^/(auth|login|register|password|token|payment|subscription|admin)/ {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, private";
    add_header Pragma "no-cache";
    add_header Expires "0";

    # Additional security headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";

    gzip on;
    gzip_types application/json text/html;
}

# =============================================================================
# Global Cache Settings
# =============================================================================

# Enable ETag generation for conditional requests
etag on;

# Disable Last-Modified header (use ETag instead for better accuracy)
if_modified_since before;

# Enable gzip compression by default
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    application/x-font-ttf
    application/x-font-opentype
    application/vnd.ms-fontobject
    font/ttf
    font/otf
    font/eot
    image/svg+xml;

# Enable brotli compression if available
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml;

# =============================================================================
# Proxy Cache Configuration (if using nginx as reverse proxy cache)
# =============================================================================

# Cache path configuration
# proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=flamoral_cache:100m max_size=10g inactive=60d use_temp_path=off;

# Cache key
# proxy_cache_key "$scheme$request_method$host$request_uri";

# Cache valid responses
# proxy_cache_valid 200 301 302 30d;
# proxy_cache_valid 404 1h;
# proxy_cache_valid any 1m;

# Cache locking to prevent cache stampede
# proxy_cache_lock on;
# proxy_cache_lock_timeout 5s;

# Use stale cache when backend is down
# proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
# proxy_cache_background_update on;

# Bypass cache for certain conditions
# proxy_cache_bypass $http_pragma $http_authorization;
# proxy_no_cache $http_pragma $http_authorization;

# =============================================================================
# Rate Limiting for Cache Protection
# =============================================================================

# Limit request rate to prevent cache poisoning
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=200r/s;

# Apply rate limits
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;
}

location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    limit_req zone=static_limit burst=50 nodelay;
    limit_req_status 429;
}

# =============================================================================
# Browser Hints for Better Caching
# =============================================================================

# DNS Prefetch for external resources
location = /index.html {
    add_header Link "<https://fonts.googleapis.com>; rel=dns-prefetch";
    add_header Link "<https://cdn.flamoral.com>; rel=dns-prefetch";
    add_header Link "<https://api.flamoral.com>; rel=preconnect";
}

# Resource hints for critical assets
location = / {
    add_header Link "</assets/js/main.js>; rel=preload; as=script";
    add_header Link "</assets/css/main.css>; rel=preload; as=style";
    add_header Link "</flamoral-icon.svg>; rel=preload; as=image";
}
