# Cost-Optimized Redis Configuration for Flamoral
# This configuration implements efficient caching strategies with appropriate TTLs
# and memory management policies to optimize cost per usage.

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: flamoral
  labels:
    app: redis
    tier: cache
data:
  redis.conf: |
    # NETWORK
    bind 0.0.0.0
    protected-mode yes
    port 6379
    tcp-backlog 511
    timeout 300
    tcp-keepalive 300

    # GENERAL
    daemonize no
    supervised no
    pidfile /var/run/redis.pid
    loglevel notice
    logfile ""
    databases 16

    # SNAPSHOTTING - Disabled for cache-only use (cost optimization)
    save ""
    stop-writes-on-bgsave-error no
    rdbcompression no
    rdbchecksum no
    dbfilename dump.rdb
    dir /data

    # REPLICATION
    replica-serve-stale-data yes
    replica-read-only yes
    repl-diskless-sync no
    repl-disable-tcp-nodelay no

    # SECURITY
    requirepass ${REDIS_PASSWORD}

    # MEMORY MANAGEMENT - Cost Optimized
    # Set maximum memory to 2GB (adjustable based on workload)
    maxmemory 2gb

    # Use allkeys-lru to evict least recently used keys across all keys
    # This is optimal for cache use cases
    maxmemory-policy allkeys-lru

    # Number of samples for LRU algorithm (higher = more accurate, more CPU)
    maxmemory-samples 5

    # LAZY FREEING
    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
    lazyfree-lazy-server-del yes
    replica-lazy-flush yes

    # APPEND ONLY MODE - Disabled for cache-only (cost optimization)
    appendonly no

    # SLOW LOG
    slowlog-log-slower-than 10000
    slowlog-max-len 128

    # LATENCY MONITOR
    latency-monitor-threshold 100

    # EVENT NOTIFICATION
    notify-keyspace-events "Ex"

    # ADVANCED CONFIG
    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    list-compress-depth 0
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64
    hll-sparse-max-bytes 3000
    stream-node-max-bytes 4096
    stream-node-max-entries 100
    activerehashing yes
    client-output-buffer-limit normal 0 0 0
    client-output-buffer-limit replica 256mb 64mb 60
    client-output-buffer-limit pubsub 32mb 8mb 60
    hz 10
    dynamic-hz yes
    aof-rewrite-incremental-fsync yes
    rdb-save-incremental-fsync yes

  # TTL Configuration Guide (in seconds)
  ttl-config.json: |
    {
      "session_data": {
        "ttl": 86400,
        "description": "User session data - 24 hours",
        "key_pattern": "session:*"
      },
      "user_profiles": {
        "ttl": 3600,
        "description": "User profile cache - 1 hour",
        "key_pattern": "user:profile:*"
      },
      "match_recommendations": {
        "ttl": 900,
        "description": "Match recommendations - 15 minutes",
        "key_pattern": "match:recommendations:*"
      },
      "rate_limits": {
        "ttl": 900,
        "description": "Rate limit counters - 15 minutes",
        "key_pattern": "ratelimit:*"
      },
      "auth_tokens": {
        "ttl": 1800,
        "description": "Authentication tokens - 30 minutes",
        "key_pattern": "auth:token:*"
      },
      "refresh_tokens": {
        "ttl": 604800,
        "description": "Refresh tokens - 7 days",
        "key_pattern": "refresh_token:*"
      },
      "verification_tokens": {
        "ttl": 3600,
        "description": "Email/phone verification - 1 hour",
        "key_pattern": "verification:*"
      },
      "user_preferences": {
        "ttl": 7200,
        "description": "User preferences cache - 2 hours",
        "key_pattern": "user:preferences:*"
      },
      "app_settings": {
        "ttl": 21600,
        "description": "Application settings - 6 hours",
        "key_pattern": "app:settings:*"
      },
      "search_results": {
        "ttl": 600,
        "description": "Search results cache - 10 minutes",
        "key_pattern": "search:*"
      },
      "analytics_counters": {
        "ttl": 300,
        "description": "Real-time analytics - 5 minutes",
        "key_pattern": "analytics:counter:*"
      },
      "notification_queue": {
        "ttl": 3600,
        "description": "Notification queue - 1 hour",
        "key_pattern": "notification:queue:*"
      },
      "chat_presence": {
        "ttl": 300,
        "description": "User online presence - 5 minutes",
        "key_pattern": "presence:*"
      },
      "geolocation_cache": {
        "ttl": 1800,
        "description": "User location cache - 30 minutes",
        "key_pattern": "geo:*"
      },
      "media_metadata": {
        "ttl": 14400,
        "description": "Media file metadata - 4 hours",
        "key_pattern": "media:metadata:*"
      }
    }
---
# Redis StatefulSet for Production
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: flamoral
  labels:
    app: redis
    tier: cache
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis
      tier: cache
  template:
    metadata:
      labels:
        app: redis
        tier: cache
        monitoring: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      serviceAccountName: redis
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: redis
        image: redis:7.2-alpine
        imagePullPolicy: IfNotPresent

        command:
        - redis-server
        - /etc/redis/redis.conf

        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP

        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: REDIS_PASSWORD

        resources:
          requests:
            cpu: 250m      # Cost-optimized
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi

        volumeMounts:
        - name: config
          mountPath: /etc/redis
          readOnly: true
        - name: data
          mountPath: /data

        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping | grep PONG
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping | grep PONG
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

      - name: redis-exporter
        image: oliver006/redis_exporter:v1.55.0-alpine
        imagePullPolicy: IfNotPresent

        ports:
        - name: metrics
          containerPort: 9121
          protocol: TCP

        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: REDIS_PASSWORD
        - name: REDIS_ADDR
          value: "redis://localhost:6379"

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

      volumes:
      - name: config
        configMap:
          name: redis-config
          items:
          - key: redis.conf
            path: redis.conf

  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app: redis
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: managed-premium
      resources:
        requests:
          storage: 10Gi  # Cost-optimized storage
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: flamoral
  labels:
    app: redis
    tier: cache
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  - name: metrics
    port: 9121
    targetPort: 9121
    protocol: TCP
  selector:
    app: redis
    tier: cache
---
# Redis Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: flamoral
---
# Redis Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: flamoral
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis
      tier: cache
---
# Service Monitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis
  namespace: flamoral
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  endpoints:
  - port: metrics
    interval: 60s
    path: /metrics
---
# Redis Cluster ConfigMap (for future scaling)
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: flamoral
  labels:
    app: redis-cluster
    tier: cache
data:
  redis-cluster.conf: |
    # Future configuration for Redis Cluster (3 master + 3 replica setup)
    # Uncomment and apply when scaling to cluster mode

    # cluster-enabled yes
    # cluster-config-file /data/nodes.conf
    # cluster-node-timeout 5000
    # cluster-require-full-coverage no
    # cluster-migration-barrier 1
    # cluster-replica-validity-factor 0
