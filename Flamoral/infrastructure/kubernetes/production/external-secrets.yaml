# External Secrets Operator Configuration for Azure Key Vault Integration

# Install External Secrets Operator using Helm:
# helm repo add external-secrets https://charts.external-secrets.io
# helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace

# Azure Key Vault Secret Store
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-store
  namespace: flamoral
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://production-dating-kv.vault.azure.net"
      serviceAccountRef:
        name: external-secrets-sa
---
# Cluster-wide Azure Key Vault Secret Store
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault-cluster-store
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://production-dating-kv.vault.azure.net"
      serviceAccountRef:
        name: external-secrets-sa
        namespace: external-secrets-system
---
# Service Account for External Secrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: flamoral
  annotations:
    azure.workload.identity/client-id: "${AZURE_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"
---
# External Secret for Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: flamoral
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_HOST: "{{ .host }}"
        DB_PORT: "5432"
        DB_NAME: "dating_app_production"
        DB_USER: "datingappadmin"
        DB_PASSWORD: "{{ .password }}"
        DB_CONNECTION_STRING: "{{ .connectionString }}"
  dataFrom:
  - extract:
      key: production-postgres-admin-password
      property: password
  - extract:
      key: production-database-connection-string
      property: connectionString
---
# External Secret for Redis Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: flamoral
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_HOST: "production-dating-app-redis.redis.cache.windows.net"
        REDIS_PORT: "6380"
        REDIS_PASSWORD: "{{ .password }}"
        REDIS_CONNECTION_STRING: "{{ .connectionString }}"
        REDIS_TLS: "true"
  data:
  - secretKey: password
    remoteRef:
      key: production-redis-primary-key
  - secretKey: connectionString
    remoteRef:
      key: production-redis-connection-string
---
# External Secret for Application Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: application-secrets
  namespace: flamoral
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: application-secrets
    creationPolicy: Owner
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: production-jwt-secret
  - secretKey: ENCRYPTION_KEY
    remoteRef:
      key: production-encryption-key
  - secretKey: STORAGE_ACCOUNT_KEY
    remoteRef:
      key: production-storage-account-key
---
# External Secret for Third-Party API Keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: third-party-api-keys
  namespace: flamoral
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: third-party-api-keys
    creationPolicy: Owner
  data:
  - secretKey: SENDGRID_API_KEY
    remoteRef:
      key: production-sendgrid-api-key
  - secretKey: TWILIO_AUTH_TOKEN
    remoteRef:
      key: production-twilio-auth-token
  - secretKey: STRIPE_SECRET_KEY
    remoteRef:
      key: production-stripe-secret-key
---
# External Secret for OAuth Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth-credentials
  namespace: flamoral
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: oauth-credentials
    creationPolicy: Owner
  data:
  - secretKey: GOOGLE_CLIENT_SECRET
    remoteRef:
      key: production-google-oauth-secret
  - secretKey: FACEBOOK_APP_SECRET
    remoteRef:
      key: production-facebook-app-secret
---
# Push Secret for backing up Kubernetes secrets to Key Vault
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: backup-tls-secrets
  namespace: flamoral
spec:
  refreshInterval: 1h
  secretStoreRefs:
  - name: azure-keyvault-store
    kind: SecretStore
  selector:
    secret:
      name: tls-certificate
  data:
  - match:
      secretKey: tls.crt
      remoteRef:
        remoteKey: production-tls-certificate
  - match:
      secretKey: tls.key
      remoteRef:
        remoteKey: production-tls-key
