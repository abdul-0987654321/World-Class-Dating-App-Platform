# Security Context Patch for All Deployments
# Apply this patch using kustomize to add security contexts to all services
#
# Usage in kustomization.yaml:
#   patchesStrategicMerge:
#     - security-patch.yaml
#
# This patch adds:
# - Pod-level security context (runAsNonRoot, runAsUser, fsGroup)
# - Container-level security context (readOnlyRootFilesystem, capabilities drop)
# - Volume mounts for tmp and cache directories

# Template for other services - copy and modify as needed:
---
# Auth Service Security Patch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: flamoral
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: auth-service
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
---
