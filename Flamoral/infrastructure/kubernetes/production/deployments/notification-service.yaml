apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: flamoral-prod
  labels:
    app: notification-service
    tier: medium-traffic
    cost-optimization: enabled
spec:
  replicas: 1  # Managed by HPA
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: medium-traffic
    spec:
      serviceAccountName: flamoral-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Spot instance eligible - asynchronous processing
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: In
                values:
                - spot
      tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule

      containers:
      - name: notification-service
        image: flamoralacr.azurecr.io/notification-service:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 3012
          name: http
        env:
        - name: PORT
          value: "3012"
        - name: NODE_ENV
          value: "production"
        - name: SERVICE_NAME
          value: "notification-service"
        # Database configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DATABASE_URL
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_PASSWORD
        - name: DB_SSL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_SSL
        # Redis configuration
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_PASSWORD
        - name: REDIS_TLS
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_TLS
        # Notification provider secrets
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: flamoral-notification-secrets
              key: SENDGRID_API_KEY
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: flamoral-notification-secrets
              key: TWILIO_ACCOUNT_SID
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: flamoral-notification-secrets
              key: TWILIO_AUTH_TOKEN
        - name: FIREBASE_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: flamoral-notification-secrets
              key: FIREBASE_PROJECT_ID
        - name: FIREBASE_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: flamoral-notification-secrets
              key: FIREBASE_PRIVATE_KEY
        # Auth secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "192Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "300m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3012
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3012
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
