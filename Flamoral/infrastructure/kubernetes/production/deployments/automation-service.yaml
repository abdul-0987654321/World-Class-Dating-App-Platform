apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-service
  namespace: flamoral-prod
  labels:
    app: automation-service
    tier: low-traffic
    cost-optimization: enabled
spec:
  replicas: 1  # Managed by HPA
  selector:
    matchLabels:
      app: automation-service
  template:
    metadata:
      labels:
        app: automation-service
        tier: low-traffic
    spec:
      serviceAccountName: flamoral-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Low traffic - spot instance eligible
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: In
                values:
                - spot
      tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule

      containers:
      - name: automation-service
        image: flamoraldevacr.azurecr.io/automation-service:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 3014
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3014"
        - name: NODE_ENV
          value: "production"
        - name: SERVICE_NAME
          value: "automation-service"

        # ConfigMap environment variables
        envFrom:
        - configMapRef:
            name: flamoral-config

        # Database configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DATABASE_URL
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_PASSWORD

        # Redis configuration
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_PASSWORD

        # Auth secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_SECRET
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: SERVICE_API_KEY

        # Communication secrets
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: flamoral-communication-secrets
              key: SENDGRID_API_KEY
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: flamoral-communication-secrets
              key: TWILIO_AUTH_TOKEN

        # Azure Service Bus
        - name: AZURE_SERVICE_BUS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: flamoral-azure-secrets
              key: AZURE_SERVICE_BUS_CONNECTION_STRING

        resources:
          requests:
            memory: "192Mi"
            cpu: "75m"
          limits:
            memory: "512Mi"
            cpu: "400m"

        readinessProbe:
          httpGet:
            path: /health
            port: 3014
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1

        livenessProbe:
          httpGet:
            path: /health
            port: 3014
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
        - name: logs
          mountPath: /app/logs

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: automation-service
  namespace: flamoral-prod
  labels:
    app: automation-service
spec:
  type: ClusterIP
  ports:
  - port: 3014
    targetPort: 3014
    protocol: TCP
    name: http
  selector:
    app: automation-service
