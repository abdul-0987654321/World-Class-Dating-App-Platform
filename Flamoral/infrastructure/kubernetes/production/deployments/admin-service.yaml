apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: flamoral-prod
  labels:
    app: admin-service
    tier: low-traffic
    cost-optimization: enabled
spec:
  replicas: 1  # Managed by HPA
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
        tier: low-traffic
    spec:
      serviceAccountName: flamoral-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Spot instance eligible - business hours only
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: In
                values:
                - spot
      tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule

      containers:
      - name: admin-service
        image: flamoralacr.azurecr.io/admin-service:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 3010
          name: http
        env:
        - name: PORT
          value: "3010"
        - name: NODE_ENV
          value: "production"
        - name: SERVICE_NAME
          value: "admin-service"
        # Database configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DATABASE_URL
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_PASSWORD
        - name: DB_SSL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_SSL
        # Redis configuration
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_URL
        # Auth secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_SECRET
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_ACCESS_SECRET
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
