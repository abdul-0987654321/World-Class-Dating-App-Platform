apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-service
  namespace: flamoral-prod
  labels:
    app: policy-service
    tier: medium-traffic
    cost-optimization: enabled
spec:
  replicas: 2  # Managed by HPA
  selector:
    matchLabels:
      app: policy-service
  template:
    metadata:
      labels:
        app: policy-service
        tier: medium-traffic
    spec:
      serviceAccountName: flamoral-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Medium priority - can use spot instances
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: In
                values:
                - spot
        # Spread across nodes for HA
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - policy-service
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule

      containers:
      - name: policy-service
        image: flamoraldevacr.azurecr.io/policy-service:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 3016
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3016"
        - name: NODE_ENV
          value: "production"
        - name: SERVICE_NAME
          value: "policy-service"

        # ConfigMap environment variables
        envFrom:
        - configMapRef:
            name: flamoral-config

        # Database configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DATABASE_URL
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_PASSWORD

        # Redis configuration
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_PASSWORD

        # Auth secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_SECRET
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: SERVICE_API_KEY

        # Azure secrets
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: flamoral-azure-secrets
              key: AZURE_STORAGE_CONNECTION_STRING

        resources:
          requests:
            memory: "192Mi"
            cpu: "75m"
          limits:
            memory: "384Mi"
            cpu: "300m"

        readinessProbe:
          httpGet:
            path: /health
            port: 3016
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1

        livenessProbe:
          httpGet:
            path: /health
            port: 3016
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
        - name: logs
          mountPath: /app/logs

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
  namespace: flamoral-prod
  labels:
    app: policy-service
spec:
  type: ClusterIP
  ports:
  - port: 3016
    targetPort: 3016
    protocol: TCP
    name: http
  selector:
    app: policy-service
