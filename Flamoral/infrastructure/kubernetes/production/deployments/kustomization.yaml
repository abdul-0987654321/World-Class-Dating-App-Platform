# =============================================================================
# Kustomization - Flamoral Production Services Deployment
# =============================================================================
# This file orchestrates the deployment of all Flamoral backend services
# Usage: kubectl apply -k infrastructure/kubernetes/production/deployments/
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flamoral

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: flamoral
  app.kubernetes.io/part-of: flamoral-dating-platform
  environment: production
  managed-by: kustomize

# Common annotations
commonAnnotations:
  deployment.kubernetes.io/revision: "1"
  app.kubernetes.io/version: "1.0.0"

# Deployment resources
resources:
  # High-traffic tier (critical path)
  - api-gateway.yaml
  - user-service.yaml

  # Critical tier (auth, payments)
  - auth-service.yaml
  - payment-service.yaml

  # Medium-traffic tier
  - matching-service.yaml
  - messaging-service.yaml
  - media-service.yaml
  - notification-service.yaml
  - realtime-service.yaml

  # Low-traffic tier
  - analytics-service.yaml
  - moderation-service.yaml
  - admin-service.yaml
  - advertising-service.yaml
  - workflow-engine.yaml

  # Services
  - ../services/all-services.yaml

# Images - Override with specific versions for production
images:
  - name: flamoraldevacr.azurecr.io/api-gateway
    newTag: latest
  - name: flamoraldevacr.azurecr.io/auth-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/user-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/matching-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/messaging-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/payment-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/media-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/analytics-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/moderation-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/admin-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/advertising-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/notification-service
    newTag: latest
  - name: flamoraldevacr.azurecr.io/workflow-engine
    newTag: latest
  - name: flamoraldevacr.azurecr.io/realtime-service
    newTag: latest

# ConfigMap generator for environment-specific configs
configMapGenerator:
  - name: service-endpoints
    literals:
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - MATCHING_SERVICE_URL=http://matching-service:3009
      - MESSAGING_SERVICE_URL=http://messaging-service:3004
      - PAYMENT_SERVICE_URL=http://payment-service:3005
      - MEDIA_SERVICE_URL=http://media-service:3006
      - ANALYTICS_SERVICE_URL=http://analytics-service:3007
      - MODERATION_SERVICE_URL=http://moderation-service:3008
      - ADMIN_SERVICE_URL=http://admin-service:3010
      - ADVERTISING_SERVICE_URL=http://advertising-service:3011
      - NOTIFICATION_SERVICE_URL=http://notification-service:3012
      - WORKFLOW_ENGINE_URL=http://workflow-engine:3013
      - REALTIME_SERVICE_URL=http://realtime-service:8081

# Security patches - Apply security contexts to all deployments
patchesStrategicMerge:
  - ../security-patch.yaml

# Replica overrides for production (can be adjusted via HPA)
replicas:
  - name: api-gateway
    count: 2
  - name: auth-service
    count: 2
  - name: user-service
    count: 2
  - name: payment-service
    count: 2
  - name: matching-service
    count: 1
  - name: messaging-service
    count: 1
  - name: media-service
    count: 1
  - name: analytics-service
    count: 1
  - name: moderation-service
    count: 1
  - name: admin-service
    count: 1
  - name: advertising-service
    count: 1
  - name: notification-service
    count: 1
  - name: workflow-engine
    count: 1
  - name: realtime-service
    count: 1
