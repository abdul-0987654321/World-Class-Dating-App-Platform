apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service
  namespace: flamoral
  labels:
    app: messaging-service
    tier: medium-traffic
    cost-optimization: enabled
spec:
  replicas: 1  # HPA will manage scaling
  selector:
    matchLabels:
      app: messaging-service
  template:
    metadata:
      labels:
        app: messaging-service
        tier: medium-traffic
    spec:
      # Medium traffic - can use spot instances
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: In
                values:
                - spot
      tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule

      containers:
      - name: messaging-service
        image: flamoraldevacr.azurecr.io/messaging-service:latest
        ports:
        - containerPort: 3003
          name: http
        env:
        - name: PORT
          value: "3003"
        - name: NODE_ENV
          value: "production"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: COSMOS_ENDPOINT
          value: "https://flamoral-cosmos.documents.azure.com:443/"
        - name: COSMOS_KEY
          valueFrom:
            secretKeyRef:
              name: cosmos-secrets
              key: COSMOS_KEY
        - name: COSMOS_DATABASE_ID
          value: "Flamoral"
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: JWT_ACCESS_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "400m"  # Reduced from 500m for cost savings
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-service
  namespace: flamoral
  labels:
    app: messaging-service
spec:
  selector:
    app: messaging-service
  ports:
  - port: 3003
    targetPort: 3003
    name: http
  type: ClusterIP
