apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: flamoral-prod
  labels:
    app: api-gateway
    tier: high-traffic
    cost-optimization: enabled
spec:
  replicas: 2  # Managed by HPA, starting with 2 for HA
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: high-traffic
    spec:
      serviceAccountName: flamoral-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      # No spot instances for critical gateway
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: NotIn
                values:
                - spot
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api-gateway
              topologyKey: kubernetes.io/hostname

      containers:
      - name: api-gateway
        image: flamoraldevacr.azurecr.io/api-gateway:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: PORT
          value: "4000"
        - name: NODE_ENV
          value: "production"
        - name: SERVICE_NAME
          value: "api-gateway"
        # Service discovery endpoints
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3001"
        - name: USER_SERVICE_URL
          value: "http://user-service:3002"
        - name: MATCHING_SERVICE_URL
          value: "http://matching-service:3009"
        - name: MESSAGING_SERVICE_URL
          value: "http://messaging-service:3004"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:3005"
        - name: MEDIA_SERVICE_URL
          value: "http://media-service:3006"
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service:3007"
        - name: MODERATION_SERVICE_URL
          value: "http://moderation-service:3008"
        - name: ADMIN_SERVICE_URL
          value: "http://admin-service:3010"
        - name: ADVERTISING_SERVICE_URL
          value: "http://advertising-service:3011"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:3012"
        - name: WORKFLOW_ENGINE_URL
          value: "http://workflow-engine:3013"
        - name: REALTIME_SERVICE_URL
          value: "http://realtime-service:8081"
        # Redis for rate limiting and caching
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_URL
        # Auth secrets for JWT validation
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_SECRET
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_ACCESS_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
