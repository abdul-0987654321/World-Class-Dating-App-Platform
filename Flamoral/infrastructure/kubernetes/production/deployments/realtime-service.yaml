apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-service
  namespace: flamoral-prod
  labels:
    app: realtime-service
    tier: medium-traffic
    cost-optimization: enabled
spec:
  replicas: 1  # Managed by HPA
  selector:
    matchLabels:
      app: realtime-service
  template:
    metadata:
      labels:
        app: realtime-service
        tier: medium-traffic
    spec:
      serviceAccountName: flamoral-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Partial spot instance - use session affinity for WebSocket
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: In
                values:
                - spot
      tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule

      containers:
      - name: realtime-service
        image: flamoralacr.azurecr.io/realtime-service:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 8082
          name: websocket
        env:
        - name: PORT
          value: "8081"
        - name: WS_PORT
          value: "8082"
        - name: NODE_ENV
          value: "production"
        - name: ENVIRONMENT
          value: "production"
        - name: SERVICE_NAME
          value: "realtime-service"
        - name: LOG_LEVEL
          value: "info"
        # CORS configuration
        - name: ALLOWED_ORIGINS
          value: "https://flamoral.com,https://www.flamoral.com,https://app.flamoral.com,https://admin.flamoral.com"
        # JWT configuration
        - name: JWT_ISSUER
          value: "flamoral-auth-service"
        - name: JWT_EXPIRATION
          value: "15m"
        # Database configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DATABASE_URL
        # Redis configuration (critical for WebSocket session management)
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_PASSWORD
        - name: REDIS_TLS
          value: "true"  # Always use TLS for Azure Redis in production
        - name: REDIS_DB
          value: "0"
        # Auth secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_SECRET
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_ACCESS_SECRET
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: INTERNAL_SERVICE_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
