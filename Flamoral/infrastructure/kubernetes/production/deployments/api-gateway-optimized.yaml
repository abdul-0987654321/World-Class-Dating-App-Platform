apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: flamoral
  labels:
    app: api-gateway
    tier: high-traffic
    cost-optimization: enabled
spec:
  replicas: 2  # Managed by HPA, starting with 2 for HA
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: high-traffic
    spec:
      # No spot instances for critical gateway
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: NotIn
                values:
                - spot
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api-gateway
              topologyKey: kubernetes.io/hostname

      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "128Mi"  # Increased from 64Mi for better caching
            cpu: "100m"      # Increased from 50m for better performance
          limits:
            memory: "256Mi"  # Increased from 128Mi
            cpu: "300m"      # Increased from 200m
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: nginx-config
        configMap:
          name: api-gateway-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: flamoral
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      upstream auth_backend {
        server auth-service:3011;
      }
      upstream messaging_backend {
        server messaging-service:3003;
      }
      upstream user_backend {
        server user-service:3001;
      }
      upstream matching_backend {
        server matching-service:3002;
      }

      # Connection pooling for better performance
      keepalive_timeout 65;
      keepalive_requests 100;

      server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
          return 200 'OK';
          add_header Content-Type text/plain;
        }

        # Auth service routes
        location /api/v1/auth/ {
          proxy_pass http://auth_backend/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User service routes
        location /api/v1/users {
          proxy_pass http://user_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Matching service routes
        location /api/v1/matches {
          proxy_pass http://matching_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Messaging service routes
        location /api/v1/messages {
          proxy_pass http://messaging_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }

        location /api/v1/conversations {
          proxy_pass http://messaging_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support for realtime messaging
        location /socket.io {
          proxy_pass http://messaging_backend;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default - return 404
        location / {
          return 404 '{"error": "Not Found"}';
          add_header Content-Type application/json;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: flamoral
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: LoadBalancer
