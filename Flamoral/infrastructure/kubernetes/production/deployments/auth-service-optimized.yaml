apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: flamoral
  labels:
    app: auth-service
    tier: critical
    cost-optimization: enabled
spec:
  replicas: 2  # Critical service - always maintain 2 for HA
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: critical
    spec:
      # Critical service - NO spot instances
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: NotIn
                values:
                - spot
        # Spread across nodes for HA
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - auth-service
              topologyKey: kubernetes.io/hostname

      containers:
      - name: auth-service
        image: flamoraldevacr.azurecr.io/auth-service:latest
        ports:
        - containerPort: 3011
          name: http
        env:
        - name: PORT
          value: "3011"
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "flamoral_db"
        - name: DB_USER
          value: "flamoral"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: JWT_ACCESS_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: JWT_REFRESH_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3011
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3011
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: flamoral
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
  - port: 3011
    targetPort: 3011
    name: http
  type: ClusterIP
