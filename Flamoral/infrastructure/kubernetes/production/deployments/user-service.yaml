apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: flamoral-prod
  labels:
    app: user-service
    tier: high-traffic
    cost-optimization: enabled
spec:
  replicas: 2  # Managed by HPA
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        tier: high-traffic
    spec:
      serviceAccountName: flamoral-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      # High traffic service - NO spot instances
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: NotIn
                values:
                - spot
        # Spread across nodes for HA
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - user-service
              topologyKey: kubernetes.io/hostname

      containers:
      - name: user-service
        image: flamoraldevacr.azurecr.io/user-service:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: PORT
          value: "3002"
        - name: NODE_ENV
          value: "production"
        - name: SERVICE_NAME
          value: "user-service"
        # Database configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DATABASE_URL
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_PASSWORD
        # Redis configuration
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: REDIS_PORT
        # Auth secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_SECRET
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_ACCESS_SECRET
        # Media service
        - name: AZURE_STORAGE_ACCOUNT
          valueFrom:
            secretKeyRef:
              name: flamoral-media-secrets
              key: AZURE_STORAGE_ACCOUNT
        - name: AZURE_STORAGE_KEY
          valueFrom:
            secretKeyRef:
              name: flamoral-media-secrets
              key: AZURE_STORAGE_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
