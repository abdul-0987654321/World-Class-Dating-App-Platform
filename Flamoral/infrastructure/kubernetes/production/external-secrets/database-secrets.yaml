# =============================================================================
# Database & Cache Secrets
# =============================================================================
# Pulls database and Redis credentials from Azure Key Vault
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-database-secrets
  namespace: flamoral
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flamoral-dating-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: flamoral-database-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: flamoral
          app.kubernetes.io/component: database
      data:
        # PostgreSQL Connection String
        DATABASE_URL: "postgresql://{{ .dbUser }}:{{ .dbPassword }}@{{ .dbHost }}:5432/{{ .dbName }}?sslmode=require"

        # Individual PostgreSQL Components
        DB_HOST: "{{ .dbHost }}"
        DB_PORT: "5432"
        DB_NAME: "{{ .dbName }}"
        DB_USER: "{{ .dbUser }}"
        DB_PASSWORD: "{{ .dbPassword }}"

        # Read Replicas
        DB_READ_REPLICA_1_URL: "{{ .dbReadReplica1Url }}"
        DB_READ_REPLICA_2_URL: "{{ .dbReadReplica2Url }}"

        # MongoDB
        MONGODB_URI: "{{ .mongodbUri }}"

        # Redis Configuration
        REDIS_HOST: "{{ .redisHost }}"
        REDIS_PORT: "6380"
        REDIS_PASSWORD: "{{ .redisPassword }}"
        REDIS_TLS: "true"
        REDIS_URL: "rediss://:{{ .redisPassword }}@{{ .redisHost }}:6380"

        # Azure Service Bus (Message Queue)
        AZURE_SERVICE_BUS_CONNECTION_STRING: "{{ .serviceBusConnectionString }}"
  data:
  # PostgreSQL Credentials
  - secretKey: dbHost
    remoteRef:
      key: db-host
  - secretKey: dbName
    remoteRef:
      key: db-name
  - secretKey: dbUser
    remoteRef:
      key: db-user
  - secretKey: dbPassword
    remoteRef:
      key: db-password
  - secretKey: dbReadReplica1Url
    remoteRef:
      key: db-read-replica-1-url
  - secretKey: dbReadReplica2Url
    remoteRef:
      key: db-read-replica-2-url

  # MongoDB
  - secretKey: mongodbUri
    remoteRef:
      key: mongodb-uri

  # Redis
  - secretKey: redisHost
    remoteRef:
      key: redis-host
  - secretKey: redisPassword
    remoteRef:
      key: redis-password

  # Azure Service Bus
  - secretKey: serviceBusConnectionString
    remoteRef:
      key: azure-service-bus-connection-string
