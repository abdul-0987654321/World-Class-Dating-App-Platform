# =============================================================================
# Azure Key Vault SecretStore Configuration
# =============================================================================
# This SecretStore connects External Secrets Operator to Azure Key Vault
# Key Vault URL: https://flamoral-prod-kv.vault.azure.net
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: flamoral
  annotations:
    azure.workload.identity/client-id: "${AZURE_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-store
  namespace: flamoral
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://flamoral-prod-kv.vault.azure.net"
      serviceAccountRef:
        name: external-secrets-sa
---
# Cluster-wide SecretStore (optional - for cross-namespace access)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault-cluster-store
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://flamoral-prod-kv.vault.azure.net"
      serviceAccountRef:
        name: external-secrets-sa
        namespace: flamoral
