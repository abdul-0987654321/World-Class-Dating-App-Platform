# =============================================================================
# Payment Service Secrets
# =============================================================================
# Pulls Stripe payment credentials from Azure Key Vault
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-payment-secrets
  namespace: flamoral
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: payment
    app.kubernetes.io/part-of: flamoral-dating-platform
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: flamoral-payment-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: flamoral
          app.kubernetes.io/component: payment
  data:
  # Stripe Secrets
  - secretKey: STRIPE_SECRET_KEY
    remoteRef:
      key: stripe-secret-key
  - secretKey: STRIPE_WEBHOOK_SECRET
    remoteRef:
      key: stripe-webhook-secret
  - secretKey: STRIPE_PUBLISHABLE_KEY
    remoteRef:
      key: stripe-publishable-key
