# =============================================================================
# Media Service Secrets
# =============================================================================
# Pulls Azure Storage, Cognitive Services, and Agora credentials from Azure Key Vault
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-media-secrets
  namespace: flamoral
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: media
    app.kubernetes.io/part-of: flamoral-dating-platform
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: flamoral-media-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: flamoral
          app.kubernetes.io/component: media
  data:
  # Azure Storage
  - secretKey: AZURE_STORAGE_KEY
    remoteRef:
      key: azure-storage-key
  - secretKey: AZURE_STORAGE_CONNECTION_STRING
    remoteRef:
      key: azure-storage-connection-string

  # Azure Cognitive Services
  - secretKey: AZURE_FACE_API_KEY
    remoteRef:
      key: azure-face-api-key
  - secretKey: AZURE_CONTENT_MODERATOR_KEY
    remoteRef:
      key: azure-content-moderator-key
  - secretKey: AZURE_COMPUTER_VISION_KEY
    remoteRef:
      key: azure-computer-vision-key

  # Agora (Video/Voice)
  - secretKey: AGORA_APP_ID
    remoteRef:
      key: agora-app-id
  - secretKey: AGORA_APP_CERTIFICATE
    remoteRef:
      key: agora-app-certificate
  - secretKey: AGORA_CUSTOMER_KEY
    remoteRef:
      key: agora-customer-key
  - secretKey: AGORA_CUSTOMER_SECRET
    remoteRef:
      key: agora-customer-secret
