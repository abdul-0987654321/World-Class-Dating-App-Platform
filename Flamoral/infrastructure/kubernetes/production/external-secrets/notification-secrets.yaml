# =============================================================================
# Notification Service Secrets
# =============================================================================
# Pulls SendGrid, Twilio, and Firebase credentials from Azure Key Vault
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-notification-secrets
  namespace: flamoral
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: notification
    app.kubernetes.io/part-of: flamoral-dating-platform
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: flamoral-notification-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: flamoral
          app.kubernetes.io/component: notification
  data:
  # SendGrid (Email)
  - secretKey: SENDGRID_API_KEY
    remoteRef:
      key: sendgrid-api-key

  # Twilio (SMS)
  - secretKey: TWILIO_ACCOUNT_SID
    remoteRef:
      key: twilio-account-sid
  - secretKey: TWILIO_AUTH_TOKEN
    remoteRef:
      key: twilio-auth-token

  # Firebase (Push Notifications)
  - secretKey: FIREBASE_PRIVATE_KEY
    remoteRef:
      key: firebase-private-key
  - secretKey: FCM_SERVER_KEY
    remoteRef:
      key: fcm-server-key
