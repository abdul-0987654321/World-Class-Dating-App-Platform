# =============================================================================
# Authentication & Authorization Secrets
# =============================================================================
# Pulls JWT secrets and service authentication credentials from Azure Key Vault
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-auth-secrets
  namespace: flamoral
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: flamoral-dating-platform
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: flamoral-auth-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: flamoral
          app.kubernetes.io/component: auth
  data:
  # JWT Secrets
  - secretKey: JWT_SECRET
    remoteRef:
      key: jwt-secret
  - secretKey: JWT_ACCESS_SECRET
    remoteRef:
      key: jwt-access-secret
  - secretKey: JWT_REFRESH_SECRET
    remoteRef:
      key: jwt-refresh-secret

  # Service Authentication
  - secretKey: SERVICE_API_KEY
    remoteRef:
      key: service-api-key
  - secretKey: SESSION_SECRET
    remoteRef:
      key: session-secret

  # OAuth Secrets - Aligned with Terraform KeyVault definitions
  - secretKey: GOOGLE_CLIENT_SECRET
    remoteRef:
      key: google-client-secret
  - secretKey: FACEBOOK_APP_SECRET
    remoteRef:
      key: facebook-app-secret
  - secretKey: APPLE_PRIVATE_KEY
    remoteRef:
      key: apple-private-key
