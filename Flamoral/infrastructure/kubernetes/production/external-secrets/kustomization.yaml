apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flamoral

resources:
  - secret-store.yaml
  - auth-secrets.yaml
  - payment-secrets.yaml
  - notification-secrets.yaml
  - media-secrets.yaml
  - database-secrets.yaml

# Labels to apply to all resources
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: flamoral-dating-platform
  environment: production

# Annotations to apply to all resources
commonAnnotations:
  documentation: "https://github.com/flamoral/infrastructure/tree/main/kubernetes/production/external-secrets"
  managed-by: "external-secrets-operator"
