# Vertical Pod Autoscaler (VPA) Configurations - Cost Optimized
# Flamoral Dating Platform - Production Environment
#
# VPA Modes:
# - "Off": Only provides recommendations, doesn't modify pods
# - "Initial": Sets resource requests on pod creation only
# - "Recreate": Updates running pods by evicting and recreating them
# - "Auto": Automatically updates resource requests (use with caution)
#
# For production cost optimization, we use "Off" mode to get recommendations
# and "Auto" mode for non-critical services that can tolerate restarts
---
# HIGH TRAFFIC SERVICES - Recommendation Mode
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: api-gateway-vpa
  namespace: flamoral
  labels:
    app: api-gateway
    tier: high-traffic
    cost-optimization: enabled
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  updatePolicy:
    updateMode: "Off"  # Recommendations only for high-traffic services
  resourcePolicy:
    containerPolicies:
    - containerName: nginx
      minAllowed:
        cpu: 50m
        memory: 64Mi
      maxAllowed:
        cpu: 500m
        memory: 256Mi
      controlledResources:
      - cpu
      - memory
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: user-service-vpa
  namespace: flamoral
  labels:
    app: user-service
    tier: high-traffic
    cost-optimization: enabled
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
    - containerName: user-service
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 1000m
        memory: 1Gi
      controlledResources:
      - cpu
      - memory
---
