---
# CRITICAL SERVICES (Auth & Payment)
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: flamoral
  labels:
    app: auth-service
    tier: critical
    cost-optimization: enabled
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2  # Always maintain minimum 2 for high availability
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65  # Lower threshold for critical service
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes for critical service
      policies:
      - type: Percent
        value: 25  # Conservative scale down
        periodSeconds: 120
      - type: Pods
        value: 1
        periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15  # Fast scale up for critical service
      - type: Pods
        value: 3
        periodSeconds: 15
      selectPolicy: Max
---
