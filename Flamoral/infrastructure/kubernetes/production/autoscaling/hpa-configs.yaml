# Horizontal Pod Autoscaler (HPA) Configurations - Cost Optimized
# Flamoral Dating Platform - Production Environment
#
# Service Classification:
# - High Traffic: api-gateway, user-service (min: 2, max: 10)
# - Medium Traffic: messaging, matching, realtime (min: 1, max: 5)
# - Low Traffic: analytics, admin, advertising, moderation (min: 1, max: 3)
# - Critical: auth-service, payment-service (min: 2, max: 8)
---
# HIGH TRAFFIC SERVICES
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: flamoral
  labels:
    app: api-gateway
    tier: high-traffic
    cost-optimization: enabled
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes to stabilize before scaling down
      policies:
      - type: Percent
        value: 50  # Scale down max 50% at a time
        periodSeconds: 60
      - type: Pods
        value: 2  # Or remove max 2 pods at a time
        periodSeconds: 60
      selectPolicy: Min  # Choose the most conservative option
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100  # Can double pods count
        periodSeconds: 30
      - type: Pods
        value: 4  # Or add 4 pods at a time
        periodSeconds: 30
      selectPolicy: Max  # Choose the most aggressive option
