# Pod Disruption Budgets (PDB) - Cost-Effective Rolling Updates
# Flamoral Dating Platform - Production Environment
#
# PDBs ensure zero-downtime deployments without over-provisioning
# They control how many pods can be unavailable during voluntary disruptions
# (rolling updates, node drains, etc.)
---
# HIGH AVAILABILITY SERVICES - Maintain strict availability
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: flamoral
  labels:
    app: api-gateway
    tier: high-traffic
spec:
  minAvailable: 1  # Always keep at least 1 pod running
  selector:
    matchLabels:
      app: api-gateway
  unhealthyPodEvictionPolicy: AlwaysAllow
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service-pdb
  namespace: flamoral
  labels:
    app: user-service
    tier: high-traffic
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user-service
  unhealthyPodEvictionPolicy: AlwaysAllow
---
# CRITICAL SERVICES - Maximum availability
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: flamoral
  labels:
    app: auth-service
    tier: critical
spec:
  minAvailable: 2  # Auth is critical - keep 2 always
  selector:
    matchLabels:
      app: auth-service
  unhealthyPodEvictionPolicy: AlwaysAllow
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service-pdb
  namespace: flamoral
  labels:
    app: payment-service
    tier: critical
spec:
  minAvailable: 2  # Payment is critical - keep 2 always
  selector:
    matchLabels:
      app: payment-service
  unhealthyPodEvictionPolicy: AlwaysAllow
---
# MEDIUM TRAFFIC SERVICES - Balance availability and cost
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: messaging-service-pdb
  namespace: flamoral
  labels:
    app: messaging-service
    tier: medium-traffic
spec:
  maxUnavailable: 50%  # Can update half at a time for faster rollouts
  selector:
    matchLabels:
      app: messaging-service
  unhealthyPodEvictionPolicy: IfHealthyBudget
---
apiVersion: policy/v1
