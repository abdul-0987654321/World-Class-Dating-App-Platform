# Namespace Resource Quotas - Cost Control
# Flamoral Dating Platform - Production Environment
#
# Resource Quotas prevent resource sprawl and runaway costs
# They set hard limits on total resources per namespace
---
# Production Namespace - Main Application
apiVersion: v1
kind: ResourceQuota
metadata:
  name: flamoral-production-quota
  namespace: flamoral
  labels:
    environment: production
    cost-optimization: enabled
spec:
  hard:
    # Compute Resources
    requests.cpu: "20"          # Max 20 CPU cores requested across all pods
    requests.memory: 40Gi       # Max 40GB RAM requested
    limits.cpu: "60"            # Max 60 CPU cores limit (allows 3x burst)
    limits.memory: 80Gi         # Max 80GB RAM limit

    # Object Counts
    pods: "100"                 # Max 100 pods total
    services: "30"              # Max 30 services
    persistentvolumeclaims: "20" # Max 20 PVCs
    configmaps: "50"            # Max 50 ConfigMaps
    secrets: "50"               # Max 50 Secrets

    # Storage
    requests.storage: "500Gi"   # Max 500GB total storage

  # Scope quotas to specific priority classes
  scopeSelector:
    matchExpressions:
    - operator: Exists
      scopeName: PriorityClass
---
# LimitRange - Default resource constraints per pod
apiVersion: v1
kind: LimitRange
metadata:
  name: flamoral-production-limits
  namespace: flamoral
  labels:
    environment: production
    cost-optimization: enabled
spec:
  limits:
  # Container defaults
  - type: Container
    default:
      cpu: 500m              # Default limit if not specified
      memory: 512Mi
    defaultRequest:
      cpu: 100m              # Default request if not specified
      memory: 128Mi
    min:
      cpu: 10m               # Minimum allowed
      memory: 16Mi
    max:
      cpu: 2000m             # Maximum allowed per container
      memory: 4Gi
    maxLimitRequestRatio:
      cpu: 10                # Limit can be max 10x request
      memory: 4              # Limit can be max 4x request

  # Pod limits
  - type: Pod
    max:
      cpu: 4000m             # Max CPU per pod
      memory: 8Gi            # Max memory per pod

  # PVC limits
  - type: PersistentVolumeClaim
    min:
      storage: 1Gi
    max:
      storage: 100Gi
---
# Staging Namespace - Lower limits for testing
apiVersion: v1
kind: ResourceQuota
metadata:
  name: flamoral-staging-quota
  namespace: flamoral-staging
  labels:
    environment: staging
    cost-optimization: enabled
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "30"
    limits.memory: 40Gi
    pods: "50"
    services: "20"
    persistentvolumeclaims: "10"
    configmaps: "30"
    secrets: "30"
    requests.storage: "200Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: flamoral-staging-limits
  namespace: flamoral-staging
  labels:
    environment: staging
    cost-optimization: enabled
spec:
  limits:
  - type: Container
    default:
      cpu: 200m
      memory: 256Mi
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    min:
      cpu: 10m
      memory: 16Mi
    max:
      cpu: 1000m
      memory: 2Gi
    maxLimitRequestRatio:
      cpu: 10
      memory: 4
  - type: Pod
    max:
      cpu: 2000m
      memory: 4Gi
---
# Development Namespace - Minimal resources
apiVersion: v1
kind: ResourceQuota
metadata:
  name: flamoral-dev-quota
  namespace: flamoral-dev
  labels:
    environment: development
    cost-optimization: enabled
spec:
  hard:
    requests.cpu: "5"
    requests.memory: 10Gi
    limits.cpu: "15"
    limits.memory: 20Gi
    pods: "30"
    services: "15"
    persistentvolumeclaims: "5"
    configmaps: "20"
    secrets: "20"
    requests.storage: "50Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: flamoral-dev-limits
  namespace: flamoral-dev
  labels:
    environment: development
    cost-optimization: enabled
spec:
  limits:
  - type: Container
    default:
      cpu: 200m
      memory: 256Mi
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    min:
      cpu: 10m
      memory: 16Mi
    max:
      cpu: 500m
      memory: 1Gi
    maxLimitRequestRatio:
      cpu: 10
      memory: 4
  - type: Pod
    max:
      cpu: 1000m
      memory: 2Gi
---
# Priority Classes for Resource Allocation
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: critical-priority
  labels:
    cost-optimization: enabled
value: 1000000
globalDefault: false
description: "Critical services (auth, payment) - highest priority"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
  labels:
    cost-optimization: enabled
value: 100000
globalDefault: false
description: "High traffic services (api-gateway, user-service)"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: medium-priority
  labels:
    cost-optimization: enabled
value: 10000
globalDefault: true
description: "Medium traffic services - default priority"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority
  labels:
    cost-optimization: enabled
value: 1000
globalDefault: false
description: "Low traffic services - can be preempted for higher priority"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: batch-priority
  labels:
    cost-optimization: enabled
value: 100
globalDefault: false
description: "Batch jobs - lowest priority, highly preemptible"
---
# Resource Quota Monitoring ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: quota-monitoring
  namespace: flamoral
  labels:
    purpose: cost-optimization
data:
  check-quota-usage: |
    #!/bin/bash
    # Check resource quota usage across namespaces

    echo "=== Flamoral Production Quota Usage ==="
    kubectl describe quota flamoral-production-quota -n flamoral

    echo ""
    echo "=== Flamoral Staging Quota Usage ==="
    kubectl describe quota flamoral-staging-quota -n flamoral-staging

    echo ""
    echo "=== Flamoral Dev Quota Usage ==="
    kubectl describe quota flamoral-dev-quota -n flamoral-dev

    # Alert if usage > 80%
    USAGE=$(kubectl get quota flamoral-production-quota -n flamoral -o jsonpath='{.status.used.requests\.cpu}' | sed 's/m//')
    HARD=$(kubectl get quota flamoral-production-quota -n flamoral -o jsonpath='{.status.hard.requests\.cpu}' | sed 's/m//')
    PERCENT=$((USAGE * 100 / HARD))

    if [ $PERCENT -gt 80 ]; then
      echo "WARNING: CPU quota usage at ${PERCENT}%"
    fi

  prometheus-alerts: |
    # Prometheus alerts for quota violations
    groups:
    - name: resource-quotas
      interval: 30s
      rules:
      - alert: NamespaceQuotaNearLimit
        expr: |
          (
            kube_resourcequota{namespace="flamoral", type="used"}
            /
            kube_resourcequota{namespace="flamoral", type="hard"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          tier: cost-optimization
        annotations:
          summary: "Namespace {{ $labels.namespace }} quota {{ $labels.resource }} near limit"
          description: "Quota usage is at {{ $value | humanizePercentage }}"

      - alert: NamespaceQuotaExceeded
        expr: |
          (
            kube_resourcequota{namespace="flamoral", type="used"}
            /
            kube_resourcequota{namespace="flamoral", type="hard"}
          ) >= 1
        for: 1m
        labels:
          severity: critical
          tier: cost-optimization
        annotations:
          summary: "Namespace {{ $labels.namespace }} quota {{ $labels.resource }} exceeded"
          description: "Cannot create new resources in namespace"

  cost-optimization-report: |
    Resource Quota Cost Optimization Summary
    ========================================

    Production Namespace Limits:
    - Total CPU Requests: 20 cores
    - Total Memory Requests: 40Gi
    - Estimated monthly cost: ~$300-500 (Azure AKS)

    With optimizations:
    - Actual average usage: ~12 cores, 25Gi (60% utilization)
    - Spot instances: 50% of workloads (-$100/month)
    - Right-sizing: 20% resource reduction (-$60/month)
    - Off-hours scaling: 30% time reduction (-$90/month)

    OPTIMIZED COST: ~$150-250/month (40-50% savings)

    Best Practices:
    1. Review quota usage monthly
    2. Adjust based on actual peak usage + 20% buffer
    3. Set up alerts at 80% quota usage
    4. Use LimitRanges to prevent individual pod overuse
    5. Implement PriorityClasses for intelligent scheduling
