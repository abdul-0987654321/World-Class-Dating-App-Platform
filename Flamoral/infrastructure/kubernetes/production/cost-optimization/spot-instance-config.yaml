# Spot/Preemptible Instance Configuration for Cost Optimization
# Flamoral Dating Platform - Azure AKS
#
# This file contains node affinity rules and tolerations for spot instances
# Estimated cost savings: 60-80% for spot-eligible workloads
#
# Azure Spot Instances: ~70% discount compared to on-demand
# Trade-off: Can be evicted with 30-second notice
---
# Node Pool Configuration Reference
# Apply this with: az aks nodepool add
apiVersion: v1
kind: ConfigMap
metadata:
  name: spot-instance-guide
  namespace: flamoral
  labels:
    purpose: cost-optimization
data:
  azure-spot-nodepool-commands: |
    # Create Spot Instance Node Pool for Non-Critical Workloads
    az aks nodepool add \
      --resource-group flamoral-rg \
      --cluster-name flamoral-aks \
      --name spotnp \
      --priority Spot \
      --eviction-policy Delete \
      --spot-max-price -1 \
      --enable-cluster-autoscaler \
      --min-count 1 \
      --max-count 10 \
      --node-vm-size Standard_D2s_v3 \
      --node-taints kubernetes.azure.com/scalesetpriority=spot:NoSchedule \
      --labels kubernetes.azure.com/scalesetpriority=spot \
      --tags tier=spot cost-optimization=enabled

    # Create On-Demand Node Pool for Critical Workloads
    az aks nodepool add \
      --resource-group flamoral-rg \
      --cluster-name flamoral-aks \
      --name regularnp \
      --priority Regular \
      --enable-cluster-autoscaler \
      --min-count 2 \
      --max-count 5 \
      --node-vm-size Standard_D2s_v3 \
      --labels kubernetes.azure.com/scalesetpriority=regular \
      --tags tier=regular critical=true

  node-affinity-guide: |
    Node Affinity Strategy:

    1. Critical Services (Auth, Payment):
       - REQUIRED: Regular nodes only
       - No spot instances allowed

    2. High Traffic (API Gateway, User Service):
       - REQUIRED: Regular nodes only
       - Need consistent performance

    3. Medium Traffic (Messaging, Matching, Realtime):
       - PREFERRED: Spot instances
       - FALLBACK: Regular nodes if spot unavailable

    4. Low Traffic (Analytics, Admin, Advertising):
       - REQUIRED: Spot instances
       - Significant cost savings
---
# Spot Instance Deployment Examples
---
# LOW TRAFFIC SERVICE - Require Spot Instances
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: flamoral
  labels:
    app: analytics-service
    tier: low-traffic
    spot-eligible: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        tier: low-traffic
    spec:
      # REQUIRE spot instances for maximum savings
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: In
                values:
                - spot
      # Tolerate spot node taints
      tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule
      containers:
      - name: analytics-service
        image: flamoraldevacr.azurecr.io/analytics-service:latest
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
# MEDIUM TRAFFIC SERVICE - Prefer Spot, Fallback to Regular
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: flamoral
  labels:
    app: matching-service
    tier: medium-traffic
    spot-eligible: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
        tier: medium-traffic
    spec:
      # PREFER spot instances, but can use regular if needed
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80  # Strong preference for spot
            preference:
              matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: In
                values:
                - spot
          - weight: 20  # Fallback to regular
            preference:
              matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: In
                values:
                - regular
      tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule
      containers:
      - name: matching-service
        image: flamoraldevacr.azurecr.io/matching-service:latest
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
# CRITICAL SERVICE - Regular Nodes Only
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: flamoral
  labels:
    app: payment-service
    tier: critical
    spot-eligible: "false"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        tier: critical
    spec:
      # REQUIRE regular nodes - NO spot instances
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/scalesetpriority
                operator: NotIn
                values:
                - spot
        # Spread across nodes for HA
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - payment-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: payment-service
        image: flamoraldevacr.azurecr.io/payment-service:latest
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
# Service Classification ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: spot-instance-classification
  namespace: flamoral
data:
  spot-required: |
    # Services that MUST run on spot instances (70% cost savings)
    - analytics-service
    - admin-service
    - advertising-service
    - moderation-service (batch processing)
    - automation-service
    - policy-service
    - workflow-engine

  spot-preferred: |
    # Services that PREFER spot but can use regular (flexible)
    - messaging-service
    - matching-service
    - media-service
    - notification-service

  regular-only: |
    # Services that MUST run on regular nodes (critical)
    - auth-service
    - payment-service
    - api-gateway
    - user-service
    - realtime-service (WebSocket connections)

  eviction-handling: |
    Spot Instance Eviction Handling:

    1. Azure sends 30-second termination notice
    2. Pod receives SIGTERM signal
    3. PreStop hook executes (if defined)
    4. Graceful shutdown period (terminationGracePeriodSeconds)
    5. Pod is rescheduled on available node

    Best Practices:
    - Implement graceful shutdown handlers
    - Use PodDisruptionBudgets
    - Set appropriate terminationGracePeriodSeconds (30-60s)
    - Enable cluster autoscaler for quick replacement
    - Monitor eviction rates and adjust if > 10%
---
# Spot Instance Monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: spot-monitoring-queries
  namespace: flamoral
data:
  prometheus-queries: |
    # Spot Instance Eviction Rate
    rate(kube_node_status_condition{
      condition="Ready",
      status="false",
      node=~".*spot.*"
    }[1h])

    # Cost Savings from Spot Instances
    sum(
      kube_pod_info{node=~".*spot.*"}
      * on(pod) group_left()
      avg_over_time(kube_pod_container_resource_requests[1h])
    ) * 0.7  # 70% savings

    # Pods on Spot vs Regular Nodes
    count(kube_pod_info{node=~".*spot.*"}) by (namespace)
    /
    count(kube_pod_info) by (namespace)

  azure-cli-monitoring: |
    # Monitor spot instance interruptions
    az monitor metrics list \
      --resource-group flamoral-rg \
      --resource-type Microsoft.Compute/virtualMachineScaleSets \
      --metric "Percentage CPU" \
      --interval PT1M

    # Check node pool status
    az aks nodepool list \
      --resource-group flamoral-rg \
      --cluster-name flamoral-aks \
      --query "[].{Name:name,Priority:priority,Count:count,MinCount:minCount,MaxCount:maxCount}"
