# Kubernetes Resource Optimization Recommendations
# Flamoral Dating Platform - Production Cost Efficiency Guide
#
# This document provides optimized resource requests and limits for all services
# based on service tier, traffic patterns, and cost optimization requirements.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resource-recommendations
  namespace: flamoral
  labels:
    purpose: cost-optimization
    environment: production
data:
  # RESOURCE OPTIMIZATION STRATEGY
  optimization-strategy: |
    Cost Optimization Strategy for Flamoral Dating Platform
    =======================================================

    1. Right-Sizing Principles:
       - Requests: Set to P90 actual usage (leaves headroom for bursts)
       - Limits: Set to 2-3x requests (prevents runaway costs)
       - Review metrics monthly and adjust based on actual usage

    2. Service Tiers:
       - High Traffic (api-gateway, user-service):
         * Higher baseline resources
         * Min 2 replicas for HA
         * Moderate autoscaling thresholds (70% CPU)

       - Critical (auth, payment):
         * Guaranteed resources
         * Min 2 replicas always
         * Lower autoscaling thresholds (65% CPU)
         * On-demand nodes only (no spot instances)

       - Medium Traffic (messaging, matching, realtime, notification, media):
         * Balanced resources
         * Can scale to 0 during off-hours
         * Standard autoscaling (75% CPU)

       - Low Traffic (analytics, admin, advertising, moderation, automation, policy, workflow):
         * Minimal baseline resources
         * Aggressive autoscaling (80% CPU)
         * Prefer spot instances
         * Can tolerate disruptions

    3. Cost Savings Mechanisms:
       - HPA: Scale down during low traffic periods
       - VPA: Right-size resources based on actual usage
       - Spot Instances: Use for non-critical workloads (30-70% cost savings)
       - Resource Quotas: Prevent resource sprawl per namespace
       - PDB: Enable zero-downtime updates without over-provisioning

  # HIGH TRAFFIC SERVICES
  api-gateway-resources: |
    Service: API Gateway (Nginx)
    Tier: High Traffic
    Current: requests(50m/64Mi), limits(200m/128Mi)
    Recommended: requests(100m/128Mi), limits(300m/256Mi)
    Rationale: Gateway handles all incoming traffic, needs quick response

    Container: nginx
      requests:
        cpu: 100m      # Increased from 50m for better performance
        memory: 128Mi  # Doubled for caching
      limits:
        cpu: 300m      # 3x requests for bursts
        memory: 256Mi  # 2x requests

    Replicas: min=2, max=10
    Spot Instance Eligible: No (critical path)
    Estimated Monthly Cost: $15-30 (based on Azure AKS B2s nodes)

  user-service-resources: |
    Service: User Service
    Tier: High Traffic
    Recommended: requests(150m/256Mi), limits(500m/512Mi)

    Container: user-service
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    Replicas: min=2, max=10
    Spot Instance Eligible: No
    Estimated Monthly Cost: $20-40

  # CRITICAL SERVICES
  auth-service-resources: |
    Service: Auth Service
    Tier: Critical
    Current: requests(100m/256Mi), limits(500m/512Mi)
    Recommended: Keep current settings (already optimized)

    Container: auth-service
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    Replicas: min=2, max=8
    Spot Instance Eligible: No (critical service)
    Node Affinity: On-demand nodes only
    Estimated Monthly Cost: $18-35

  payment-service-resources: |
    Service: Payment Service
    Tier: Critical
    Recommended: requests(150m/256Mi), limits(500m/512Mi)

    Container: payment-service
      requests:
        cpu: 150m      # Higher for payment processing
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    Replicas: min=2, max=8
    Spot Instance Eligible: No (critical - handles money)
    Node Affinity: On-demand nodes only
    PCI-DSS Compliance: Required
    Estimated Monthly Cost: $20-38

  # MEDIUM TRAFFIC SERVICES
  messaging-service-resources: |
    Service: Messaging Service
    Tier: Medium Traffic
    Current: requests(100m/256Mi), limits(500m/512Mi)
    Recommended: requests(100m/256Mi), limits(400m/512Mi)

    Container: messaging-service
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 400m     # Reduced from 500m
        memory: 512Mi

    Replicas: min=1, max=5
    Spot Instance Eligible: Yes (tolerates brief interruptions)
    Estimated Monthly Cost: $10-25

  matching-service-resources: |
    Service: Matching Service
    Tier: Medium Traffic
    Recommended: requests(150m/256Mi), limits(500m/512Mi)

    Container: matching-service
      requests:
        cpu: 150m      # Algorithm-heavy, needs CPU
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    Replicas: min=1, max=5
    Spot Instance Eligible: Yes
    Estimated Monthly Cost: $12-28

  realtime-service-resources: |
    Service: Realtime Service (WebSocket)
    Tier: Medium Traffic
    Recommended: requests(100m/256Mi), limits(400m/512Mi)

    Container: realtime-service
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi

    Replicas: min=1, max=5
    Spot Instance Eligible: Partial (use session affinity)
    Estimated Monthly Cost: $10-25

  notification-service-resources: |
    Service: Notification Service
    Tier: Medium Traffic
    Recommended: requests(100m/192Mi), limits(300m/384Mi)

    Container: notification-service
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 300m
        memory: 384Mi

    Replicas: min=1, max=5
    Spot Instance Eligible: Yes (asynchronous processing)
    Estimated Monthly Cost: $8-22

  media-service-resources: |
    Service: Media Service (Image/Video Processing)
    Tier: Medium Traffic
    Recommended: requests(200m/512Mi), limits(1000m/1Gi)

    Container: media-service
      requests:
        cpu: 200m      # Media processing is CPU-intensive
        memory: 512Mi  # Image manipulation needs memory
      limits:
        cpu: 1000m     # Allow bursts for processing
        memory: 1Gi

    Replicas: min=1, max=5
    Spot Instance Eligible: Yes (batch processing tolerates interruptions)
    Estimated Monthly Cost: $15-40

  # LOW TRAFFIC SERVICES
  analytics-service-resources: |
    Service: Analytics Service
    Tier: Low Traffic
    Recommended: requests(50m/128Mi), limits(200m/256Mi)

    Container: analytics-service
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    Replicas: min=1, max=3
    Spot Instance Eligible: Yes
    Scale to Zero: Consider during night hours
    Estimated Monthly Cost: $5-12

  admin-service-resources: |
    Service: Admin Dashboard Service
    Tier: Low Traffic
    Recommended: requests(50m/128Mi), limits(200m/256Mi)

    Container: admin-service
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    Replicas: min=1, max=3
    Spot Instance Eligible: Yes
    Business Hours Only: Consider scaling to 0 at night
    Estimated Monthly Cost: $5-12

  advertising-service-resources: |
    Service: Advertising Service
    Tier: Low Traffic
    Recommended: requests(50m/128Mi), limits(200m/256Mi)

    Container: advertising-service
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    Replicas: min=1, max=3
    Spot Instance Eligible: Yes
    Estimated Monthly Cost: $5-12

  moderation-service-resources: |
    Service: Content Moderation Service
    Tier: Low Traffic
    Recommended: requests(100m/256Mi), limits(400m/512Mi)

    Container: moderation-service
      requests:
        cpu: 100m      # AI/ML moderation needs more CPU
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi

    Replicas: min=1, max=3
    Spot Instance Eligible: Yes (asynchronous)
    Estimated Monthly Cost: $8-18

  automation-service-resources: |
    Service: Automation/Workflow Service
    Tier: Low Traffic
    Recommended: requests(50m/128Mi), limits(200m/256Mi)

    Container: automation-service
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    Replicas: min=1, max=3
    Spot Instance Eligible: Yes
    Estimated Monthly Cost: $5-12

  policy-service-resources: |
    Service: Policy Engine Service
    Tier: Low Traffic
    Recommended: requests(50m/128Mi), limits(200m/256Mi)

    Container: policy-service
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    Replicas: min=1, max=3
    Spot Instance Eligible: Yes
    Estimated Monthly Cost: $5-12

  workflow-engine-resources: |
    Service: Workflow Engine
    Tier: Low Traffic
    Recommended: requests(75m/192Mi), limits(300m/384Mi)

    Container: workflow-engine
      requests:
        cpu: 75m
        memory: 192Mi
      limits:
        cpu: 300m
        memory: 384Mi

    Replicas: min=1, max=3
    Spot Instance Eligible: Yes
    Estimated Monthly Cost: $6-15

  # COST PROJECTIONS
  monthly-cost-estimate: |
    Estimated Monthly Infrastructure Costs (Azure AKS)
    =================================================

    Based on Azure B2s instances ($0.0416/hour = ~$30/month per node)
    Assumes average 50% utilization with autoscaling

    High Traffic Services:
      - API Gateway:     $15-30
      - User Service:    $20-40

    Critical Services:
      - Auth Service:    $18-35
      - Payment Service: $20-38

    Medium Traffic Services:
      - Messaging:       $10-25
      - Matching:        $12-28
      - Realtime:        $10-25
      - Notification:    $8-22
      - Media:           $15-40

    Low Traffic Services:
      - Analytics:       $5-12
      - Admin:           $5-12
      - Advertising:     $5-12
      - Moderation:      $8-18
      - Automation:      $5-12
      - Policy:          $5-12
      - Workflow:        $6-15

    TOTAL ESTIMATED RANGE: $167 - $376 per month

    Cost Optimization Opportunities:
    1. Spot Instances (70% discount):    -$50-100/month
    2. Reserved Instances (30% discount): -$30-60/month
    3. Right-sizing (VPA recommendations): -$20-40/month
    4. Off-hours scaling (nights/weekends): -$30-50/month

    OPTIMIZED TOTAL: $67 - $186 per month (60% savings)

  # IMPLEMENTATION CHECKLIST
  implementation-checklist: |
    Cost Optimization Implementation Checklist
    ==========================================

    Phase 1: Foundation (Week 1)
    [ ] Deploy VPA in "Off" mode for all services
    [ ] Collect VPA recommendations for 1 week
    [ ] Set up monitoring dashboards for resource usage
    [ ] Establish baseline cost metrics

    Phase 2: Resource Right-Sizing (Week 2)
    [ ] Update deployment manifests with optimized requests/limits
    [ ] Apply changes to low-traffic services first
    [ ] Monitor for 48 hours before proceeding
    [ ] Update medium and high-traffic services

    Phase 3: Horizontal Autoscaling (Week 2-3)
    [ ] Deploy HPA configs for all services
    [ ] Test scale-up behavior under load
    [ ] Test scale-down behavior during low traffic
    [ ] Fine-tune thresholds based on observations

    Phase 4: Pod Disruption Budgets (Week 3)
    [ ] Create PDB for all critical services
    [ ] Test rolling updates with PDBs
    [ ] Verify zero-downtime deployments

    Phase 5: Spot Instances (Week 4)
    [ ] Create spot instance node pool in AKS
    [ ] Add node affinity to non-critical services
    [ ] Test spot instance eviction handling
    [ ] Monitor cost savings

    Phase 6: Advanced Optimization (Ongoing)
    [ ] Enable VPA "Auto" mode for low-traffic services
    [ ] Implement scheduled scaling (CronJobs for off-hours)
    [ ] Set up cost anomaly alerts
    [ ] Monthly cost review and optimization

    Success Metrics:
    - 40-60% reduction in infrastructure costs
    - < 1% increase in error rates
    - < 50ms increase in p95 latency
    - Zero customer-impacting incidents

  # MONITORING QUERIES
  monitoring-queries: |
    Prometheus Queries for Cost Optimization Monitoring
    ===================================================

    # CPU Request vs Usage (identify over-provisioning)
    (
      avg(rate(container_cpu_usage_seconds_total{namespace="flamoral"}[5m])) by (pod)
      /
      avg(kube_pod_container_resource_requests{namespace="flamoral",resource="cpu"}) by (pod)
    ) * 100

    # Memory Request vs Usage
    (
      avg(container_memory_working_set_bytes{namespace="flamoral"}) by (pod)
      /
      avg(kube_pod_container_resource_requests{namespace="flamoral",resource="memory"}) by (pod)
    ) * 100

    # Cost per Service (estimated)
    sum(
      avg_over_time(kube_pod_container_resource_requests{namespace="flamoral"}[1h])
      * on(node) group_left() node_cost_per_cpu_hour
    ) by (pod)

    # HPA Active Replicas
    kube_horizontalpodautoscaler_status_current_replicas{namespace="flamoral"}

    # Spot Instance Interruptions
    sum(rate(kube_node_status_condition{condition="Ready",status="false"}[5m])) by (node)

---
# Example optimized deployment template
apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment-template-example
  namespace: flamoral
data:
  low-traffic-service-template.yaml: |
    # Template for Low-Traffic Services
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: <SERVICE-NAME>
      namespace: flamoral
      labels:
        app: <SERVICE-NAME>
        tier: low-traffic
        cost-optimization: enabled
    spec:
      replicas: 1  # HPA will manage this
      selector:
        matchLabels:
          app: <SERVICE-NAME>
      template:
        metadata:
          labels:
            app: <SERVICE-NAME>
            tier: low-traffic
        spec:
          # Spot instance affinity for cost savings
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                  - key: kubernetes.azure.com/scalesetpriority
                    operator: In
                    values:
                    - spot
          # Tolerate spot instance eviction
          tolerations:
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
            effect: NoSchedule

          containers:
          - name: <SERVICE-NAME>
            image: <IMAGE>
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            # Health checks for proper autoscaling
            livenessProbe:
              httpGet:
                path: /health
                port: <PORT>
              initialDelaySeconds: 30
              periodSeconds: 10
            readinessProbe:
              httpGet:
                path: /health
                port: <PORT>
              initialDelaySeconds: 10
              periodSeconds: 5
