# =============================================================================
# Flamoral Production Services - All Service Definitions
# =============================================================================
# This file contains all ClusterIP Service definitions for internal communication
# between microservices in the Flamoral platform.
# =============================================================================

---
# API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: flamoral-prod
  labels:
    app: api-gateway
    tier: critical
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: api-gateway

