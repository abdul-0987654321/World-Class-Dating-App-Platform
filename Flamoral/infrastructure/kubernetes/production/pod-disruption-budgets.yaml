# Pod Disruption Budgets for Production Environment

# API Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dating-api-pdb
  namespace: flamoral
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dating-api
  unhealthyPodEvictionPolicy: AlwaysAllow
---
# Web App Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dating-app-pdb
  namespace: flamoral
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dating-app
  unhealthyPodEvictionPolicy: AlwaysAllow
---
# Chat Worker Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chat-worker-pdb
  namespace: flamoral
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: chat-worker
  unhealthyPodEvictionPolicy: AlwaysAllow
---
# Media Processor Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: media-processor-pdb
  namespace: flamoral
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: media-processor
  unhealthyPodEvictionPolicy: IfHealthyBudget
---
# Redis Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: flamoral
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis
  unhealthyPodEvictionPolicy: AlwaysAllow
