---
apiVersion: v1
kind: Service
metadata:
  name: realtime-service
  namespace: flamoral
  labels:
    app: realtime-service
    tier: medium-traffic
spec:
  selector:
    app: realtime-service
  ports:
  - port: 8081
    targetPort: 8081
    name: http
    protocol: TCP
  - port: 8082
    targetPort: 8082
    name: websocket
    protocol: TCP
  type: ClusterIP
  sessionAffinity: ClientIP  # Important for WebSocket connections
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour for long-lived WebSocket connections
