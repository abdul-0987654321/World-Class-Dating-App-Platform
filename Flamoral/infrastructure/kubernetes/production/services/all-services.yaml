# =============================================================================
# Flamoral Platform - Kubernetes Services
# All backend service definitions for production deployment
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: flamoral
  labels:
    app: api-gateway
    tier: high-traffic
spec:
  selector:
    app: api-gateway
  ports:
  - port: 4000
    targetPort: 4000
    name: http
    protocol: TCP
  type: ClusterIP
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: flamoral
  labels:
    app: auth-service
    tier: critical
spec:
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001
    name: http
    protocol: TCP
  type: ClusterIP

