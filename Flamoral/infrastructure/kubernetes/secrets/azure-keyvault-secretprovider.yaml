# =============================================================================
# Azure Key Vault Secret Provider for Flamoral Dating Platform
# =============================================================================
# This uses Azure Key Vault Provider for Secrets Store CSI Driver
# Secrets are mounted as volumes and synced to Kubernetes secrets
# =============================================================================

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: flamoral-azure-keyvault
  namespace: flamoral-${ENVIRONMENT}
spec:
  provider: azure
  secretObjects:
  # Database Secrets
  - secretName: flamoral-database-secrets
    type: Opaque
    data:
    - objectName: database-password
      key: DB_PASSWORD
    - objectName: database-url
      key: DATABASE_URL
    - objectName: mongodb-uri
      key: MONGODB_URI

  # Cache Secrets
  - secretName: flamoral-cache-secrets
    type: Opaque
    data:
    - objectName: redis-password
      key: REDIS_PASSWORD
    - objectName: redis-url
      key: REDIS_URL

  # Auth Secrets
  - secretName: flamoral-auth-secrets
    type: Opaque
    data:
    - objectName: jwt-secret
      key: JWT_SECRET
    - objectName: jwt-access-secret
      key: JWT_ACCESS_SECRET
    - objectName: jwt-refresh-secret
      key: JWT_REFRESH_SECRET
    - objectName: service-api-key
      key: SERVICE_API_KEY
    - objectName: session-secret
      key: SESSION_SECRET

  # Azure Secrets
  - secretName: flamoral-azure-secrets
    type: Opaque
    data:
    - objectName: azure-storage-key
      key: AZURE_STORAGE_KEY
    - objectName: azure-storage-connection-string
      key: AZURE_STORAGE_CONNECTION_STRING
    - objectName: azure-servicebus-connection-string
      key: AZURE_SERVICE_BUS_CONNECTION_STRING
    - objectName: azure-face-api-key
      key: AZURE_FACE_API_KEY
    - objectName: azure-content-moderator-key
      key: AZURE_CONTENT_MODERATOR_KEY
    - objectName: application-insights-connection-string
      key: APPLICATION_INSIGHTS_CONNECTION_STRING

  # Payment Secrets
  - secretName: flamoral-payment-secrets
    type: Opaque
    data:
    - objectName: stripe-secret-key
      key: STRIPE_SECRET_KEY
    - objectName: stripe-webhook-secret
      key: STRIPE_WEBHOOK_SECRET

  # Communication Secrets
  - secretName: flamoral-communication-secrets
    type: Opaque
    data:
    - objectName: sendgrid-api-key
      key: SENDGRID_API_KEY
    - objectName: twilio-auth-token
      key: TWILIO_AUTH_TOKEN

  # Video Secrets
  - secretName: flamoral-video-secrets
    type: Opaque
    data:
    - objectName: agora-app-certificate
      key: AGORA_APP_CERTIFICATE
    - objectName: agora-customer-key
      key: AGORA_CUSTOMER_KEY
    - objectName: agora-customer-secret
      key: AGORA_CUSTOMER_SECRET

  # Firebase Secrets
  - secretName: flamoral-firebase-secrets
    type: Opaque
    data:
    - objectName: firebase-private-key
      key: FIREBASE_PRIVATE_KEY

  # OAuth Secrets
  - secretName: flamoral-oauth-secrets
    type: Opaque
    data:
    - objectName: google-oauth-secret
      key: GOOGLE_CLIENT_SECRET
    - objectName: facebook-oauth-secret
      key: FACEBOOK_APP_SECRET
    - objectName: apple-oauth-key
      key: APPLE_PRIVATE_KEY

  # AI Secrets
  - secretName: flamoral-ai-secrets
    type: Opaque
    data:
    - objectName: openai-api-key
      key: OPENAI_API_KEY
    - objectName: ai-model-api-key
      key: AI_MODEL_API_KEY

  # Monitoring Secrets
  - secretName: flamoral-monitoring-secrets
    type: Opaque
    data:
    - objectName: sentry-dsn
      key: SENTRY_DSN
    - objectName: mixpanel-token
      key: MIXPANEL_TOKEN

  # Geolocation Secrets
  - secretName: flamoral-geolocation-secrets
    type: Opaque
    data:
    - objectName: google-maps-api-key
      key: GOOGLE_MAPS_API_KEY
    - objectName: mapbox-access-token
      key: MAPBOX_ACCESS_TOKEN

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${AZURE_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        # Database
        - |
          objectName: database-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: database-url
          objectType: secret
          objectVersion: ""
        - |
          objectName: mongodb-uri
          objectType: secret
          objectVersion: ""
        # Cache
        - |
          objectName: redis-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: redis-url
          objectType: secret
          objectVersion: ""
        # Auth
        - |
          objectName: jwt-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: jwt-access-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: jwt-refresh-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: service-api-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: session-secret
          objectType: secret
          objectVersion: ""
        # Azure Services
        - |
          objectName: azure-storage-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: azure-storage-connection-string
          objectType: secret
          objectVersion: ""
        - |
          objectName: azure-servicebus-connection-string
          objectType: secret
          objectVersion: ""
        - |
          objectName: azure-face-api-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: azure-content-moderator-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: application-insights-connection-string
          objectType: secret
          objectVersion: ""
        # Payment
        - |
          objectName: stripe-secret-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: stripe-webhook-secret
          objectType: secret
          objectVersion: ""
        # Communication
        - |
          objectName: sendgrid-api-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: twilio-auth-token
          objectType: secret
          objectVersion: ""
        # Video
        - |
          objectName: agora-app-certificate
          objectType: secret
          objectVersion: ""
        - |
          objectName: agora-customer-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: agora-customer-secret
          objectType: secret
          objectVersion: ""
        # Firebase
        - |
          objectName: firebase-private-key
          objectType: secret
          objectVersion: ""
        # OAuth
        - |
          objectName: google-oauth-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: facebook-oauth-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: apple-oauth-key
          objectType: secret
          objectVersion: ""
        # AI
        - |
          objectName: openai-api-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: ai-model-api-key
          objectType: secret
          objectVersion: ""
        # Monitoring
        - |
          objectName: sentry-dsn
          objectType: secret
          objectVersion: ""
        - |
          objectName: mixpanel-token
          objectType: secret
          objectVersion: ""
        # Geolocation
        - |
          objectName: google-maps-api-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: mapbox-access-token
          objectType: secret
          objectVersion: ""
    tenantId: "${AZURE_TENANT_ID}"

---
# Example deployment using the secret provider
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-service
  namespace: flamoral-${ENVIRONMENT}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-service
  template:
    metadata:
      labels:
        app: example-service
    spec:
      serviceAccountName: flamoral-service-account
      containers:
      - name: example-service
        image: flamoralacr8eq5eg.azurecr.io/example-service:latest
        env:
        # Load secrets from Kubernetes secrets (synced from Key Vault)
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-auth-secrets
              key: JWT_SECRET
        # ... more environment variables
        envFrom:
        - configMapRef:
            name: flamoral-common-config
        - configMapRef:
            name: example-service-config
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "flamoral-azure-keyvault"
