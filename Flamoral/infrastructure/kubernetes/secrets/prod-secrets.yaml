---
# =============================================================================
# PRODUCTION SECURITY NOTES
# =============================================================================
# 1. NO plaintext secrets are stored in this file
# 2. ALL secrets come from Azure Key Vault
# 3. Use Azure Key Vault CSI Secret Store Driver (Recommended)
# 4. Alternative: External Secrets Operator
# 5. Secrets are synced automatically and rotated per policy
# 6. Access controlled via Azure AD and Kubernetes RBAC
# 7. All secret access is logged and audited
# 8. Encryption at rest and in transit enforced
# 9. Least privilege access model enforced
# 10. Regular secret rotation is MANDATORY
#
# To use these secrets:
# 1. Ensure Azure Key Vault CSI Driver is installed
# 2. Configure SecretProviderClass (see azure-keyvault-secretprovider.yaml)
# 3. Grant AKS cluster identity access to Key Vault
# 4. Store actual secret values in Azure Key Vault
# 5. Mount secrets in deployments using CSI volumes
#
# Secret naming convention in Azure Key Vault:
# - Database: DB-PASSWORD, DATABASE-URL, etc.
# - Redis: REDIS-PASSWORD, REDIS-URL
# - Auth: JWT-SECRET, JWT-ACCESS-SECRET, JWT-REFRESH-SECRET
# - Payment: STRIPE-SECRET-KEY, STRIPE-WEBHOOK-SECRET
# - And so on...
#
# Example deployment volume mount:
# volumes:
# - name: secrets-store
#   csi:
#     driver: secrets-store.csi.k8s.io
#     readOnly: true
#     volumeAttributes:
#       secretProviderClass: "flamoral-azure-keyvault"
# =============================================================================
