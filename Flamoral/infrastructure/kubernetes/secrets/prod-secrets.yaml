# =============================================================================
# Flamoral Dating Platform - Production Environment Secrets
# =============================================================================
# Environment: production
# Namespace: flamoral-prod
# Purpose: Production environment - ALL SECRETS MUST COME FROM AZURE KEY VAULT
# Security Level: CRITICAL (no plaintext secrets allowed)
# =============================================================================
# IMPORTANT: This file contains NO actual secret values
# All secrets are referenced from Azure Key Vault using CSI Secret Store Driver
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: flamoral-prod
  labels:
    name: flamoral-prod
    environment: production
    managedBy: kubernetes
    security-level: critical

---
# PRODUCTION DATABASE SECRETS
# All values sourced from Azure Key Vault: flamoral-prod-data-kv
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-database-secrets
  namespace: flamoral-prod
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flamoral-platform
    app.kubernetes.io/managed-by: external-secrets
    environment: production
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-prod-data-kv"
    rotation-policy: "90-days"
    security-level: "critical"
type: Opaque
# NOTE: Data populated by Azure Key Vault CSI Driver or External Secrets Operator
# See: azure-keyvault-secretprovider.yaml for configuration

