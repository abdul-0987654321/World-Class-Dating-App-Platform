    kind: SecretStore
  target:
    name: flamoral-azure-secrets
    creationPolicy: Owner
  data:
    - secretKey: AZURE_STORAGE_ACCOUNT_NAME
      remoteRef:
        key: azure-storage-account-name
    - secretKey: AZURE_STORAGE_KEY
      remoteRef:
        key: azure-storage-account-key
    - secretKey: AZURE_STORAGE_CONNECTION_STRING
      remoteRef:
        key: azure-storage-connection-string
    - secretKey: AZURE_SERVICE_BUS_CONNECTION_STRING
      remoteRef:
        key: azure-servicebus-connection-string
    - secretKey: AZURE_FACE_API_KEY
      remoteRef:
        key: azure-cognitive-face-api-key
    - secretKey: AZURE_CONTENT_MODERATOR_KEY
      remoteRef:
        key: azure-cognitive-content-moderator-key
    - secretKey: AZURE_COMPUTER_VISION_KEY
      remoteRef:
        key: azure-cognitive-computer-vision-key
    - secretKey: APPLICATION_INSIGHTS_CONNECTION_STRING
      remoteRef:
        key: azure-appinsights-connection-string
    - secretKey: APPLICATION_INSIGHTS_INSTRUMENTATION_KEY
      remoteRef:
        key: azure-appinsights-instrumentation-key

---
# External Secret - AI Services
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-ai-external
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: ai
spec:
  refreshInterval: 2h
  secretStoreRef:
    name: azure-keyvault-${ENVIRONMENT}
    kind: SecretStore
  target:
    name: flamoral-ai-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai-api-key
    - secretKey: AI_MODEL_API_KEY
      remoteRef:
        key: ai-model-api-key

---
# External Secret - Monitoring
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-monitoring-external
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: monitoring
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: azure-keyvault-${ENVIRONMENT}
    kind: SecretStore
  target:
    name: flamoral-monitoring-secrets
    creationPolicy: Owner
  data:
    - secretKey: SENTRY_DSN
      remoteRef:
        key: sentry-dsn
    - secretKey: MIXPANEL_TOKEN
      remoteRef:
        key: mixpanel-token
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: grafana-admin-password

---
# Push Secret (Triggers immediate refresh)
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-secret-to-keyvault
  namespace: flamoral-${ENVIRONMENT}
spec:
  refreshInterval: 10s
  secretStoreRefs:
    - name: azure-keyvault-${ENVIRONMENT}
      kind: SecretStore
  selector:
    secret:
      name: local-secret-to-push
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: my-secret-password

---
# Installation Instructions
# =============================================================================
# 1. Install External Secrets Operator:
#    helm repo add external-secrets https://charts.external-secrets.io
#    helm repo update
#    helm install external-secrets \
#      external-secrets/external-secrets \
#      -n external-secrets-system \
#      --create-namespace
#
# 2. Configure Azure Managed Identity or Service Principal
#
# 3. Grant access to Azure Key Vault:
#    az keyvault set-policy \
#      --name flamoral-${ENVIRONMENT}-kv \
#      --object-id <MANAGED_IDENTITY_OBJECT_ID> \
#      --secret-permissions get list
#
# 4. Apply SecretStore configurations:
#    kubectl apply -f external-secrets-operator.yaml
#
# 5. Verify ExternalSecrets are syncing:
#    kubectl get externalsecrets -n flamoral-${ENVIRONMENT}
#    kubectl get secrets -n flamoral-${ENVIRONMENT}
#
# 6. Check sync status:
#    kubectl describe externalsecret flamoral-database-external -n flamoral-${ENVIRONMENT}
# =============================================================================
