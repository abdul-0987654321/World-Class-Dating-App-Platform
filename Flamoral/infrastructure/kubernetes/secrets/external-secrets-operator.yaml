---
# External Secret - Communication (Email, SMS, Push)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-communication-external
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: communication
spec:
  refreshInterval: 2h
  secretStoreRef:
    name: azure-keyvault-${ENVIRONMENT}
    kind: SecretStore
  target:
    name: flamoral-communication-secrets
    creationPolicy: Owner
  data:
    # Email
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: sendgrid-api-key
    # SMS
    - secretKey: TWILIO_ACCOUNT_SID
      remoteRef:
        key: twilio-account-sid
    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: twilio-auth-token
    - secretKey: TWILIO_PHONE_NUMBER
      remoteRef:
        key: twilio-phone-number

---
# External Secret - Push Notifications
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-push-external
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: push
spec:
  refreshInterval: 2h
  secretStoreRef:
    name: azure-keyvault-${ENVIRONMENT}
    kind: SecretStore
  target:
    name: flamoral-push-secrets
    creationPolicy: Owner
  data:
    # Firebase
    - secretKey: FIREBASE_PRIVATE_KEY
      remoteRef:
        key: firebase-private-key
    - secretKey: FCM_SERVER_KEY
      remoteRef:
        key: fcm-server-key
    # APNS
    - secretKey: APNS_KEY_ID
      remoteRef:
        key: apns-key-id
    - secretKey: APNS_PRIVATE_KEY
      remoteRef:
        key: apns-private-key

