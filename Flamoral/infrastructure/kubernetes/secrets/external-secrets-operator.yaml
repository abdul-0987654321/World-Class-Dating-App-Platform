# =============================================================================
# External Secrets Operator Configuration for Flamoral Dating Platform
# =============================================================================
# Purpose: Configure External Secrets Operator to sync secrets from Azure Key Vault
# Documentation: https://external-secrets.io/
# =============================================================================

---
# SecretStore for Development Environment
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-dev
  namespace: flamoral-dev
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultUrl: "https://flamoral-dev-kv.vault.azure.net"
      # Alternative: Service Principal
      # authSecretRef:
      #   clientId:
      #     name: azure-secret-sp
      #     key: client-id
      #   clientSecret:
      #     name: azure-secret-sp
      #     key: client-secret
      # tenantId: "YOUR_TENANT_ID"

---
# SecretStore for Staging Environment
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-staging
  namespace: flamoral-staging
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultUrl: "https://flamoral-staging-kv.vault.azure.net"

---
# SecretStore for Production Environment
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-prod
  namespace: flamoral-prod
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultUrl: "https://flamoral-prod-kv.vault.azure.net"

---
# ClusterSecretStore (Available across all namespaces)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault-global
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultUrl: "https://flamoral-global-kv.vault.azure.net"

---
# External Secret - Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-database-external
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-${ENVIRONMENT}
    kind: SecretStore
  target:
    name: flamoral-database-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@{{ .POSTGRES_HOST }}:{{ .POSTGRES_PORT }}/{{ .POSTGRES_DB }}?sslmode=require"
        REDIS_URL: "redis://:{{ .REDIS_PASSWORD }}@{{ .REDIS_HOST }}:{{ .REDIS_PORT }}/0"
  data:
    # PostgreSQL
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: postgres-host
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: postgres-port
    - secretKey: POSTGRES_USER
      remoteRef:
        key: postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: postgres-db
    # MongoDB/Cosmos
    - secretKey: MONGODB_URI
      remoteRef:
        key: cosmos-mongodb-uri
    - secretKey: COSMOS_CONNECTION_STRING
      remoteRef:
        key: cosmos-connection-string
    # Redis
    - secretKey: REDIS_HOST
      remoteRef:
        key: redis-host
    - secretKey: REDIS_PORT
      remoteRef:
        key: redis-port
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-password

---
# External Secret - Authentication
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-auth-external
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: auth
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: azure-keyvault-${ENVIRONMENT}
    kind: SecretStore
  target:
    name: flamoral-auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: jwt-access-secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: jwt-refresh-secret
    - secretKey: SESSION_SECRET
      remoteRef:
        key: session-secret
    - secretKey: COOKIE_SECRET
      remoteRef:
        key: cookie-secret
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: encryption-key
    - secretKey: SERVICE_API_KEY
      remoteRef:
        key: service-api-key

---
# External Secret - OAuth
