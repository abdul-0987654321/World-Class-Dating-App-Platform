  target:
    name: flamoral-oauth-secrets
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: google-oauth-client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: google-oauth-client-secret
    - secretKey: FACEBOOK_APP_ID
      remoteRef:
        key: facebook-app-id
    - secretKey: FACEBOOK_APP_SECRET
      remoteRef:
        key: facebook-app-secret
    - secretKey: APPLE_CLIENT_ID
      remoteRef:
        key: apple-client-id
    - secretKey: APPLE_TEAM_ID
      remoteRef:
        key: apple-team-id
    - secretKey: APPLE_KEY_ID
      remoteRef:
        key: apple-key-id
    - secretKey: APPLE_PRIVATE_KEY
      remoteRef:
        key: apple-private-key

---
# External Secret - Payment
