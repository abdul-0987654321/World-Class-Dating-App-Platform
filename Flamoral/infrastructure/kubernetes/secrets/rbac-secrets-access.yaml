---
# Role: Secrets Reader (Database & Cache)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: database-secrets-reader
  namespace: flamoral-${ENVIRONMENT}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "flamoral-database-secrets"
    - "flamoral-cache-secrets"
  verbs: ["get", "list"]

---
# Role: Auth Secrets Reader
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-secrets-reader
  namespace: flamoral-${ENVIRONMENT}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "flamoral-auth-secrets"
    - "flamoral-oauth-secrets"
  verbs: ["get", "list"]

---
# Role: Payment Secrets Reader
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payment-secrets-reader
  namespace: flamoral-${ENVIRONMENT}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "flamoral-payment-secrets"
  verbs: ["get", "list"]

---
# Role: Communication Secrets Reader
apiVersion: rbac.authorization.k8s.io/v1
