# =============================================================================
# Flamoral Dating Platform - RBAC for Secrets Access
# =============================================================================
# Purpose: Define Role-Based Access Control for secrets management
# Security: Implements least-privilege access model
# =============================================================================

---
# Service Account for User Service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: flamoral-platform
automountServiceAccountToken: true

---
