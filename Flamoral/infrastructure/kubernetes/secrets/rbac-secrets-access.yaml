  name: database-secrets-reader
  apiGroup: rbac.authorization.k8s.io

---
# RoleBinding: Admin Service -> All Secrets (with audit logging)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-service-all-secrets
  namespace: flamoral-${ENVIRONMENT}
  annotations:
    audit-enabled: "true"
    security-level: "critical"
subjects:
- kind: ServiceAccount
  name: admin-service
  namespace: flamoral-${ENVIRONMENT}
roleRef:
  kind: Role
  name: all-secrets-reader
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole: Azure Key Vault CSI Driver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-store-csi-driver
rules:
- apiGroups: ["secrets-store.csi.x-k8s.io"]
  resources: ["secretproviderclasses"]
  verbs: ["get", "list"]
- apiGroups: ["secrets-store.csi.x-k8s.io"]
  resources: ["secretproviderclasspodstatuses"]
  verbs: ["create", "update", "patch", "delete", "get", "list"]

---
# ClusterRoleBinding for CSI Driver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-store-csi-driver-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-store-csi-driver
subjects:
- kind: ServiceAccount
  name: user-service
  namespace: flamoral-${ENVIRONMENT}
- kind: ServiceAccount
  name: auth-service
  namespace: flamoral-${ENVIRONMENT}
- kind: ServiceAccount
  name: matching-service
  namespace: flamoral-${ENVIRONMENT}
- kind: ServiceAccount
  name: messaging-service
  namespace: flamoral-${ENVIRONMENT}
- kind: ServiceAccount
  name: payment-service
  namespace: flamoral-${ENVIRONMENT}
- kind: ServiceAccount
  name: notification-service
  namespace: flamoral-${ENVIRONMENT}
- kind: ServiceAccount
  name: media-service
  namespace: flamoral-${ENVIRONMENT}
- kind: ServiceAccount
  name: ai-service
  namespace: flamoral-${ENVIRONMENT}
- kind: ServiceAccount
  name: analytics-service
  namespace: flamoral-${ENVIRONMENT}
- kind: ServiceAccount
  name: admin-service
  namespace: flamoral-${ENVIRONMENT}

---
# Audit Policy for Secrets Access
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-audit-policy
  namespace: flamoral-${ENVIRONMENT}
data:
  audit-policy.yaml: |
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
    - level: RequestResponse
      resources:
      - group: ""
        resources: ["secrets"]
      omitStages:
        - "RequestReceived"
    - level: Metadata
      resources:
      - group: "secrets-store.csi.x-k8s.io"
        resources: ["secretproviderclasses", "secretproviderclasspodstatuses"]
