metadata:
  name: communication-secrets-reader
  namespace: flamoral-${ENVIRONMENT}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "flamoral-communication-secrets"
    - "flamoral-push-secrets"
  verbs: ["get", "list"]

---
# Role: Azure Secrets Reader
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: azure-secrets-reader
  namespace: flamoral-${ENVIRONMENT}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "flamoral-azure-secrets"
  verbs: ["get", "list"]

---
# Role: AI Secrets Reader
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-secrets-reader
  namespace: flamoral-${ENVIRONMENT}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "flamoral-ai-secrets"
  verbs: ["get", "list"]

---
# Role: All Secrets Reader (for API Gateway and Admin)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: all-secrets-reader
  namespace: flamoral-${ENVIRONMENT}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "flamoral-database-secrets"
    - "flamoral-cache-secrets"
    - "flamoral-auth-secrets"
    - "flamoral-oauth-secrets"
    - "flamoral-payment-secrets"
    - "flamoral-communication-secrets"
    - "flamoral-push-secrets"
    - "flamoral-azure-secrets"
    - "flamoral-video-secrets"
    - "flamoral-ai-secrets"
    - "flamoral-monitoring-secrets"
    - "flamoral-geolocation-secrets"
  verbs: ["get", "list"]

---
# RoleBinding: User Service -> Database Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: user-service-database-secrets
  namespace: flamoral-${ENVIRONMENT}
subjects:
- kind: ServiceAccount
  name: user-service
  namespace: flamoral-${ENVIRONMENT}
roleRef:
  kind: Role
  name: database-secrets-reader
  apiGroup: rbac.authorization.k8s.io

---
# RoleBinding: Auth Service -> Auth & Database Secrets
apiVersion: rbac.authorization.k8s.io/v1
