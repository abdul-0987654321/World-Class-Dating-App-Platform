# =============================================================================
# Sealed Secrets Configuration for Flamoral Dating Platform
# =============================================================================
# Purpose: Enable GitOps-friendly encrypted secrets using Sealed Secrets
# Documentation: https://github.com/bitnami-labs/sealed-secrets
# =============================================================================

---
# Namespace for Sealed Secrets Controller
apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets
  labels:
    name: sealed-secrets

---
# SealedSecret - Database Credentials (Development)
# This is an EXAMPLE - actual sealed secrets must be generated using kubeseal
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: flamoral-database-secrets
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: database
spec:
  encryptedData:
    # These values are encrypted using kubeseal
    # Example: echo -n "mypassword" | kubeseal --raw --from-file=/dev/stdin --namespace=flamoral-dev --name=flamoral-database-secrets
    DB_PASSWORD: AgBxyz123...ENCRYPTED_VALUE...
    DATABASE_URL: AgBabc456...ENCRYPTED_VALUE...
    MONGODB_URI: AgBdef789...ENCRYPTED_VALUE...
    REDIS_PASSWORD: AgBghi012...ENCRYPTED_VALUE...
  template:
    metadata:
      name: flamoral-database-secrets
      namespace: flamoral-dev
      labels:
        app.kubernetes.io/name: flamoral
        app.kubernetes.io/component: database
    type: Opaque

---
# SealedSecret - Auth Secrets (Development)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: flamoral-auth-secrets
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: auth
spec:
  encryptedData:
    JWT_SECRET: AgBjkl345...ENCRYPTED_VALUE...
    JWT_ACCESS_SECRET: AgBmno678...ENCRYPTED_VALUE...
    JWT_REFRESH_SECRET: AgBpqr901...ENCRYPTED_VALUE...
    SESSION_SECRET: AgBstu234...ENCRYPTED_VALUE...
  template:
    metadata:
      name: flamoral-auth-secrets
      namespace: flamoral-dev
    type: Opaque

---
# SealedSecret - Payment Secrets (Staging)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: flamoral-payment-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: payment
spec:
  encryptedData:
    STRIPE_SECRET_KEY: AgBvwx567...ENCRYPTED_VALUE...
    STRIPE_WEBHOOK_SECRET: AgByza890...ENCRYPTED_VALUE...
  template:
    metadata:
      name: flamoral-payment-secrets
      namespace: flamoral-staging
    type: Opaque

---
# ConfigMap - Sealed Secrets Controller Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: sealed-secrets-controller
  namespace: sealed-secrets
data:
  # Key rotation period (default: 30 days)
  key-renew-period: "720h"

  # Enable key rotation
  key-rotation: "true"

  # Controller logging level
  log-level: "info"

---
# Service for Sealed Secrets Controller
apiVersion: v1
kind: Service
metadata:
  name: sealed-secrets-controller
  namespace: sealed-secrets
  labels:
    app.kubernetes.io/name: sealed-secrets-controller
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: sealed-secrets-controller

---
# RBAC for Sealed Secrets Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-controller
  namespace: sealed-secrets

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-unsealer
rules:
- apiGroups:
  - bitnami.com
  resources:
  - sealedsecrets
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - bitnami.com
  resources:
  - sealedsecrets/status
  verbs:
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - update
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-unsealer
subjects:
- kind: ServiceAccount
  name: sealed-secrets-controller
  namespace: sealed-secrets

---
# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================
#
# 1. Install Sealed Secrets Controller:
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
#
#    Or via Helm:
#    helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#    helm install sealed-secrets sealed-secrets/sealed-secrets -n sealed-secrets --create-namespace
#
# 2. Install kubeseal CLI:
#    wget https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/kubeseal-0.24.0-linux-amd64.tar.gz
#    tar -xvzf kubeseal-0.24.0-linux-amd64.tar.gz
#    sudo install -m 755 kubeseal /usr/local/bin/kubeseal
#
# 3. Create a regular Kubernetes secret:
#    kubectl create secret generic mysecret \
#      --from-literal=password=mypassword \
#      --dry-run=client \
#      -o yaml > mysecret.yaml
#
# 4. Seal the secret:
#    kubeseal -f mysecret.yaml -w mysealedsecret.yaml
#
# 5. Apply the sealed secret:
#    kubectl apply -f mysealedsecret.yaml
#
# 6. The controller automatically unseals it and creates the regular secret
#
# =============================================================================
# EXAMPLE COMMANDS
# =============================================================================
#
# Seal a secret from stdin:
#   echo -n "my-secret-password" | kubeseal \
#     --raw \
#     --from-file=/dev/stdin \
#     --namespace=flamoral-dev \
#     --name=flamoral-database-secrets \
#     --controller-namespace=sealed-secrets
#
# Seal an entire secret file:
#   kubeseal \
#     -f dev-secrets.yaml \
#     -w sealed-dev-secrets.yaml \
#     --controller-namespace=sealed-secrets \
#     --controller-name=sealed-secrets-controller
#
# Seal for a specific namespace and name (strict scope):
#   kubeseal \
#     --scope=strict \
#     --namespace=flamoral-prod \
#     --name=flamoral-payment-secrets \
#     -f payment-secret.yaml \
#     -w sealed-payment-secret.yaml
#
# Get the public key for sealing (useful in CI/CD):
#   kubeseal --fetch-cert > pub-sealed-secrets.pem
#
# Seal using the fetched public key (offline sealing):
#   kubeseal \
#     --cert=pub-sealed-secrets.pem \
#     -f mysecret.yaml \
#     -w mysealedsecret.yaml
#
# =============================================================================
# SCOPES
# =============================================================================
#
# strict (default): Secret can only be unsealed in the specified namespace with exact name
# namespace-wide: Secret can be unsealed in the specified namespace with any name
# cluster-wide: Secret can be unsealed in any namespace with any name
#
# Example with namespace-wide scope:
#   kubeseal \
#     --scope=namespace-wide \
#     --namespace=flamoral-prod \
#     -f secret.yaml \
#     -w sealed-secret.yaml
#
# =============================================================================
# KEY ROTATION
# =============================================================================
#
# The controller generates a new sealing key every 30 days (configurable)
# Old sealed secrets can still be decrypted using old keys
# To manually rotate keys:
#   kubectl delete secret sealed-secrets-key -n sealed-secrets
#   kubectl delete pod -l app.kubernetes.io/name=sealed-secrets-controller -n sealed-secrets
#
# =============================================================================
# BACKUP AND RESTORE
# =============================================================================
#
# Backup sealing keys (CRITICAL - store securely):
#   kubectl get secret -n sealed-secrets sealed-secrets-key -o yaml > sealed-secrets-key-backup.yaml
#
# Restore sealing keys:
#   kubectl apply -f sealed-secrets-key-backup.yaml
#
# =============================================================================
# CI/CD INTEGRATION
# =============================================================================
#
# In your CI/CD pipeline:
#
# 1. Fetch the public certificate:
#    kubeseal --fetch-cert \
#      --controller-name=sealed-secrets-controller \
#      --controller-namespace=sealed-secrets \
#      > pub-sealed-secrets.pem
#
# 2. Seal secrets offline:
#    kubeseal --cert=pub-sealed-secrets.pem \
#      --format=yaml \
#      -f secret.yaml > sealed-secret.yaml
#
# 3. Commit sealed-secret.yaml to git
#
# 4. Apply in cluster:
#    kubectl apply -f sealed-secret.yaml
#
# =============================================================================
