# =============================================================================
# Kubernetes Secrets Template for Flamoral Dating Platform
# =============================================================================
# IMPORTANT: This is a TEMPLATE file showing the structure
# DO NOT store actual secrets in this file
# Use Azure Key Vault with CSI Secret Store Driver in production
# =============================================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-database-secrets
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    environment: ${ENVIRONMENT}
    tier: secrets
type: Opaque
stringData:
  # PostgreSQL
  DB_PASSWORD: "${DB_PASSWORD}"
  DATABASE_URL: "${DATABASE_URL}"

  # MongoDB
  MONGODB_URI: "${MONGODB_URI}"

---
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-cache-secrets
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    environment: ${ENVIRONMENT}
    tier: secrets
type: Opaque
stringData:
  # Redis
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  REDIS_URL: "${REDIS_URL}"

---
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-auth-secrets
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    environment: ${ENVIRONMENT}
    tier: secrets
type: Opaque
stringData:
  # JWT Secrets
  JWT_SECRET: "${JWT_SECRET}"
  JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"

  # Service Authentication
  SERVICE_API_KEY: "${SERVICE_API_KEY}"
  SESSION_SECRET: "${SESSION_SECRET}"

---
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-azure-secrets
  namespace: flamoral-${ENVIRONMENT}
  labels:
    app: flamoral
    environment: ${ENVIRONMENT}
    tier: secrets
type: Opaque
stringData:
  # Azure Storage
  AZURE_STORAGE_KEY: "${AZURE_STORAGE_KEY}"
  AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING}"

  # Azure Service Bus
  AZURE_SERVICE_BUS_CONNECTION_STRING: "${AZURE_SERVICE_BUS_CONNECTION_STRING}"

  # Azure Cognitive Services
  AZURE_FACE_API_KEY: "${AZURE_FACE_API_KEY}"
  AZURE_CONTENT_MODERATOR_KEY: "${AZURE_CONTENT_MODERATOR_KEY}"

  # Application Insights
  APPLICATION_INSIGHTS_CONNECTION_STRING: "${APPLICATION_INSIGHTS_CONNECTION_STRING}"

