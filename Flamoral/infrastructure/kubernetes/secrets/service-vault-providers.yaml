# =============================================================================
# Service-Specific Vault SecretProviderClasses
# Implements vault-per-app-per-environment secrets access
# =============================================================================
# Each SecretProviderClass maps to a specific category vault:
# - auth-vault-secrets: JWT, OAuth, session secrets
# - payment-vault-secrets: Stripe, IAP credentials
# - data-vault-secrets: Database, Redis connections
# - external-vault-secrets: Third-party API keys
# - infra-vault-secrets: Infrastructure secrets
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: auth-vault-secrets
  namespace: flamoral-prod
  labels:
    app.kubernetes.io/part-of: flamoral
    vault-category: auth
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""  # Uses AKS kubelet identity
    keyvaultName: "flamoral-prod-auth-kv"
    tenantId: "ed27e9a3-1b1c-46c9-8a73-a4f3609d75c0"
    objects: |
      array:
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: jwt-access-secret
          objectType: secret
        - |
          objectName: jwt-refresh-secret
          objectType: secret
        - |
          objectName: session-secret
          objectType: secret
        - |
          objectName: google-client-secret
          objectType: secret
        - |
          objectName: facebook-app-secret
          objectType: secret
        - |
          objectName: apple-private-key
          objectType: secret
  secretObjects:
    - secretName: flamoral-auth-secrets
      type: Opaque
      data:
        - objectName: jwt-secret
          key: JWT_SECRET
        - objectName: jwt-access-secret
          key: JWT_ACCESS_SECRET
        - objectName: jwt-refresh-secret
          key: JWT_REFRESH_SECRET
        - objectName: session-secret
          key: SESSION_SECRET
        - objectName: google-client-secret
          key: GOOGLE_CLIENT_SECRET
        - objectName: facebook-app-secret
          key: FACEBOOK_APP_SECRET
        - objectName: apple-private-key
          key: APPLE_PRIVATE_KEY
---
