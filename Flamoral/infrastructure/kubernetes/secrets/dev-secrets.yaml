# =============================================================================
# Flamoral Dating Platform - Development Environment Secrets
# =============================================================================
# Environment: development
# Namespace: flamoral-dev
# Purpose: Development and testing environment secrets
# Security Level: Low (uses placeholder values safe for development)
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: flamoral-dev
  labels:
    name: flamoral-dev
    environment: development
    managedBy: kubernetes

---
# Database Secrets - Development
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-database-secrets
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
type: Opaque
stringData:
  # PostgreSQL Primary
  DB_HOST: "postgres-primary.flamoral-dev.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "flamoral_dev"
  DB_PASSWORD: "dev_password_change_me"
  DB_NAME: "flamoral_dev"
  DATABASE_URL: "postgresql://flamoral_dev:dev_password_change_me@postgres-primary.flamoral-dev.svc.cluster.local:5432/flamoral_dev?sslmode=disable"

  # Service-specific Database URLs
  USER_SERVICE_DATABASE_URL: "postgresql://flamoral_dev:dev_password_change_me@postgres-primary.flamoral-dev.svc.cluster.local:5432/flamoral_users_dev?sslmode=disable"
  AUTH_SERVICE_DATABASE_URL: "postgresql://flamoral_dev:dev_password_change_me@postgres-primary.flamoral-dev.svc.cluster.local:5432/flamoral_auth_dev?sslmode=disable"
  MATCHING_SERVICE_DATABASE_URL: "postgresql://flamoral_dev:dev_password_change_me@postgres-primary.flamoral-dev.svc.cluster.local:5432/flamoral_matching_dev?sslmode=disable"
  MESSAGING_SERVICE_DATABASE_URL: "postgresql://flamoral_dev:dev_password_change_me@postgres-primary.flamoral-dev.svc.cluster.local:5432/flamoral_messaging_dev?sslmode=disable"
  PAYMENT_SERVICE_DATABASE_URL: "postgresql://flamoral_dev:dev_password_change_me@postgres-primary.flamoral-dev.svc.cluster.local:5432/flamoral_payments_dev?sslmode=disable"
  ANALYTICS_SERVICE_DATABASE_URL: "postgresql://flamoral_dev:dev_password_change_me@postgres-primary.flamoral-dev.svc.cluster.local:5432/flamoral_analytics_dev?sslmode=disable"
  NOTIFICATION_SERVICE_DATABASE_URL: "postgresql://flamoral_dev:dev_password_change_me@postgres-primary.flamoral-dev.svc.cluster.local:5432/flamoral_notifications_dev?sslmode=disable"

  # MongoDB
  MONGODB_URI: "mongodb://flamoral_dev:dev_password_change_me@mongodb.flamoral-dev.svc.cluster.local:27017/flamoral_dev?authSource=admin"
  MONGODB_USER: "flamoral_dev"
  MONGODB_PASSWORD: "dev_password_change_me"

---
# Cache Secrets - Development
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-cache-secrets
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
type: Opaque
stringData:
  REDIS_HOST: "redis-cluster.flamoral-dev.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "dev_redis_password"
  REDIS_URL: "redis://:dev_redis_password@redis-cluster.flamoral-dev.svc.cluster.local:6379/0"
  REDIS_TLS_ENABLED: "false"

---
# Authentication & Authorization Secrets - Development
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-auth-secrets
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
type: Opaque
stringData:
  # JWT Secrets (Development - Use strong secrets in production)
  JWT_SECRET: "dev_jwt_secret_key_minimum_32_characters_long_for_security"
  JWT_ACCESS_SECRET: "dev_jwt_access_secret_key_minimum_32_characters_long"
  JWT_REFRESH_SECRET: "dev_jwt_refresh_secret_key_minimum_32_characters_long"
  JWT_ALGORITHM: "HS256"

  # Session Secrets
  SESSION_SECRET: "dev_session_secret_key_minimum_32_characters_long"
  COOKIE_SECRET: "dev_cookie_secret_key_minimum_32_characters_long"

  # Encryption Keys
  ENCRYPTION_KEY: "dev_encryption_key_32_chars!!"
  ENCRYPTION_IV: "dev_enc_iv_16ch!"

  # Service-to-Service Authentication
  SERVICE_API_KEY: "dev_service_api_key_for_inter_service_communication"
  INTERNAL_API_SECRET: "dev_internal_api_secret_key"

---
# OAuth & Social Login Secrets - Development
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-oauth-secrets
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: oauth
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
type: Opaque
stringData:
  # Google OAuth
  GOOGLE_CLIENT_ID: "YOUR_DEV_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "YOUR_DEV_GOOGLE_CLIENT_SECRET"

  # Facebook OAuth
  FACEBOOK_APP_ID: "YOUR_DEV_FACEBOOK_APP_ID"
  FACEBOOK_APP_SECRET: "YOUR_DEV_FACEBOOK_APP_SECRET"

  # Apple OAuth
  APPLE_CLIENT_ID: "com.flamoral.dev.signin"
  APPLE_TEAM_ID: "YOUR_APPLE_TEAM_ID"
  APPLE_KEY_ID: "YOUR_APPLE_KEY_ID"
  APPLE_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_DEV_APPLE_PRIVATE_KEY
    -----END PRIVATE KEY-----

---
# Payment Gateway Secrets - Development (Test Mode)
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-payment-secrets
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: payment
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
type: Opaque
stringData:
  # Stripe Test Mode
  STRIPE_SECRET_KEY: "sk_test_YOUR_DEV_STRIPE_SECRET_KEY"
  STRIPE_PUBLISHABLE_KEY: "pk_test_YOUR_DEV_STRIPE_PUBLISHABLE_KEY"
  STRIPE_WEBHOOK_SECRET: "whsec_YOUR_DEV_STRIPE_WEBHOOK_SECRET"

  # Apple In-App Purchase (Sandbox)
  APPLE_IAP_SHARED_SECRET: "YOUR_DEV_APPLE_IAP_SHARED_SECRET"
  APPLE_IAP_ENVIRONMENT: "sandbox"

  # Google Play (Test)
  GOOGLE_PLAY_SERVICE_ACCOUNT: |
    {
      "type": "service_account",
      "project_id": "flamoral-dev",
      "private_key_id": "REPLACE_WITH_DEV_KEY_ID",
      "private_key": "REPLACE_WITH_DEV_PRIVATE_KEY",
      "client_email": "dev@flamoral-dev.iam.gserviceaccount.com"
    }

---
# Communication Secrets - Development
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-communication-secrets
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: communication
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
type: Opaque
stringData:
  # Email - SendGrid
  SENDGRID_API_KEY: "SG.YOUR_DEV_SENDGRID_API_KEY"
  SENDGRID_FROM_EMAIL: "dev@flamoral.com"
  SENDGRID_FROM_NAME: "Flamoral Dev"

  # SMTP Configuration
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  SMTP_PASSWORD: "SG.YOUR_DEV_SENDGRID_API_KEY"
  SMTP_SECURE: "false"

  # SMS - Twilio
  TWILIO_ACCOUNT_SID: "YOUR_DEV_TWILIO_ACCOUNT_SID"
  TWILIO_AUTH_TOKEN: "YOUR_DEV_TWILIO_AUTH_TOKEN"
  TWILIO_PHONE_NUMBER: "+1234567890"
  TWILIO_MESSAGING_SERVICE_SID: "YOUR_DEV_MESSAGING_SERVICE_SID"

---
# Push Notification Secrets - Development
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-push-secrets
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: push-notifications
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
type: Opaque
stringData:
  # Firebase Cloud Messaging
  FIREBASE_PROJECT_ID: "flamoral-dev"
  FIREBASE_CLIENT_EMAIL: "firebase-adminsdk@flamoral-dev.iam.gserviceaccount.com"
  FIREBASE_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_DEV_FIREBASE_PRIVATE_KEY
    -----END PRIVATE KEY-----
  FCM_SERVER_KEY: "YOUR_DEV_FCM_SERVER_KEY"

  # Apple Push Notification Service (Development)
  APNS_KEY_ID: "YOUR_DEV_APNS_KEY_ID"
  APNS_TEAM_ID: "YOUR_APPLE_TEAM_ID"
  APNS_ENVIRONMENT: "development"
  APNS_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_DEV_APNS_PRIVATE_KEY
    -----END PRIVATE KEY-----

---
# Azure Services Secrets - Development
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-azure-secrets
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: azure
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
type: Opaque
stringData:
  # Azure Storage
  AZURE_STORAGE_ACCOUNT: "flamoraldevst"
  AZURE_STORAGE_KEY: "YOUR_DEV_AZURE_STORAGE_KEY"
  AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=flamoraldevst;AccountKey=YOUR_KEY;EndpointSuffix=core.windows.net"

  # Azure Service Bus
  AZURE_SERVICE_BUS_CONNECTION_STRING: "Endpoint=sb://flamoral-dev.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=YOUR_KEY"

  # Azure Cognitive Services
  AZURE_FACE_API_KEY: "YOUR_DEV_AZURE_FACE_API_KEY"
  AZURE_FACE_API_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"
  AZURE_CONTENT_MODERATOR_KEY: "YOUR_DEV_AZURE_CONTENT_MODERATOR_KEY"
  AZURE_CONTENT_MODERATOR_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"
  AZURE_COMPUTER_VISION_KEY: "YOUR_DEV_AZURE_COMPUTER_VISION_KEY"
  AZURE_COMPUTER_VISION_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"

  # Application Insights
  APPLICATION_INSIGHTS_CONNECTION_STRING: "InstrumentationKey=YOUR_DEV_INSTRUMENTATION_KEY;IngestionEndpoint=https://eastus-1.in.applicationinsights.azure.com/"
  APPLICATION_INSIGHTS_INSTRUMENTATION_KEY: "YOUR_DEV_INSTRUMENTATION_KEY"

