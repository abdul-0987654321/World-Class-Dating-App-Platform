    {
      "auths": {
        "flamoraldevacr.azurecr.io": {
          "username": "flamoraldevacr",
          "password": "YOUR_DEV_ACR_PASSWORD",
          "auth": "BASE64_ENCODED_USERNAME:PASSWORD"
        }
      }
    }
