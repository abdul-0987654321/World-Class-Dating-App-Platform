# =============================================================================
# Flamoral Dating Platform - Staging Environment Secrets
# =============================================================================
# Environment: staging
# Namespace: flamoral-staging
# Purpose: Pre-production testing and staging environment
# Security Level: Medium (uses Azure Key Vault for sensitive secrets)
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: flamoral-staging
  labels:
    name: flamoral-staging
    environment: staging
    managedBy: kubernetes

---
# Database Secrets - Staging
# NOTE: In production/staging, these should come from Azure Key Vault
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-database-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # PostgreSQL Primary
  DB_HOST: "flamoral-staging-db.postgres.database.azure.com"
  DB_PORT: "5432"
  DB_USER: "flamoral_staging@flamoral-staging-db"
  DB_PASSWORD: "${AZURE_KEYVAULT:db-password}"
  DB_NAME: "flamoral_staging"
  DATABASE_URL: "${AZURE_KEYVAULT:database-url}"

  # Service-specific Database URLs (from Key Vault)
  USER_SERVICE_DATABASE_URL: "${AZURE_KEYVAULT:user-service-db-url}"
  AUTH_SERVICE_DATABASE_URL: "${AZURE_KEYVAULT:auth-service-db-url}"
  MATCHING_SERVICE_DATABASE_URL: "${AZURE_KEYVAULT:matching-service-db-url}"
  MESSAGING_SERVICE_DATABASE_URL: "${AZURE_KEYVAULT:messaging-service-db-url}"
  PAYMENT_SERVICE_DATABASE_URL: "${AZURE_KEYVAULT:payment-service-db-url}"
  ANALYTICS_SERVICE_DATABASE_URL: "${AZURE_KEYVAULT:analytics-service-db-url}"
  NOTIFICATION_SERVICE_DATABASE_URL: "${AZURE_KEYVAULT:notification-service-db-url}"

  # Read Replicas
  DB_READ_REPLICA_1_URL: "${AZURE_KEYVAULT:db-read-replica-1-url}"
  DB_READ_REPLICA_2_URL: "${AZURE_KEYVAULT:db-read-replica-2-url}"

  # MongoDB
  MONGODB_URI: "${AZURE_KEYVAULT:mongodb-uri}"
  MONGODB_USER: "flamoral_staging"
  MONGODB_PASSWORD: "${AZURE_KEYVAULT:mongodb-password}"

---
# Cache Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-cache-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  REDIS_HOST: "flamoral-staging.redis.cache.windows.net"
  REDIS_PORT: "6380"
  REDIS_PASSWORD: "${AZURE_KEYVAULT:redis-password}"
  REDIS_URL: "${AZURE_KEYVAULT:redis-url}"
  REDIS_TLS_ENABLED: "true"

---
# Authentication & Authorization Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-auth-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # JWT Secrets (from Key Vault)
  JWT_SECRET: "${AZURE_KEYVAULT:jwt-secret}"
  JWT_ACCESS_SECRET: "${AZURE_KEYVAULT:jwt-access-secret}"
  JWT_REFRESH_SECRET: "${AZURE_KEYVAULT:jwt-refresh-secret}"
  JWT_ALGORITHM: "HS256"

  # Session Secrets
  SESSION_SECRET: "${AZURE_KEYVAULT:session-secret}"
  COOKIE_SECRET: "${AZURE_KEYVAULT:cookie-secret}"

  # Encryption Keys
  ENCRYPTION_KEY: "${AZURE_KEYVAULT:encryption-key}"
  ENCRYPTION_IV: "${AZURE_KEYVAULT:encryption-iv}"

  # Service-to-Service Authentication
  SERVICE_API_KEY: "${AZURE_KEYVAULT:service-api-key}"
  INTERNAL_API_SECRET: "${AZURE_KEYVAULT:internal-api-secret}"

---
# OAuth & Social Login Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-oauth-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: oauth
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # Google OAuth
  GOOGLE_CLIENT_ID: "YOUR_STAGING_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "${AZURE_KEYVAULT:google-client-secret}"

  # Facebook OAuth
  FACEBOOK_APP_ID: "YOUR_STAGING_FACEBOOK_APP_ID"
  FACEBOOK_APP_SECRET: "${AZURE_KEYVAULT:facebook-app-secret}"

  # Apple OAuth
  APPLE_CLIENT_ID: "com.flamoral.staging.signin"
  APPLE_TEAM_ID: "YOUR_APPLE_TEAM_ID"
  APPLE_KEY_ID: "YOUR_APPLE_KEY_ID"
  APPLE_PRIVATE_KEY: "${AZURE_KEYVAULT:apple-private-key}"

---
# Payment Gateway Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-payment-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: payment
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # Stripe Test Mode (but using staging keys)
  STRIPE_SECRET_KEY: "${AZURE_KEYVAULT:stripe-secret-key}"
  STRIPE_PUBLISHABLE_KEY: "${AZURE_KEYVAULT:stripe-publishable-key}"
  STRIPE_WEBHOOK_SECRET: "${AZURE_KEYVAULT:stripe-webhook-secret}"

  # Apple In-App Purchase (Sandbox)
  APPLE_IAP_SHARED_SECRET: "${AZURE_KEYVAULT:apple-iap-shared-secret}"
  APPLE_IAP_ENVIRONMENT: "sandbox"

  # Google Play
  GOOGLE_PLAY_SERVICE_ACCOUNT: "${AZURE_KEYVAULT:google-play-service-account}"

---
# Communication Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-communication-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: communication
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # Email - SendGrid
  SENDGRID_API_KEY: "${AZURE_KEYVAULT:sendgrid-api-key}"
  SENDGRID_FROM_EMAIL: "staging@flamoral.com"
  SENDGRID_FROM_NAME: "Flamoral Staging"

  # SMTP Configuration
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  SMTP_PASSWORD: "${AZURE_KEYVAULT:sendgrid-api-key}"
  SMTP_SECURE: "true"

  # SMS - Twilio
  TWILIO_ACCOUNT_SID: "${AZURE_KEYVAULT:twilio-account-sid}"
  TWILIO_AUTH_TOKEN: "${AZURE_KEYVAULT:twilio-auth-token}"
  TWILIO_PHONE_NUMBER: "${AZURE_KEYVAULT:twilio-phone-number}"
  TWILIO_MESSAGING_SERVICE_SID: "${AZURE_KEYVAULT:twilio-messaging-service-sid}"

---
# Push Notification Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-push-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: push-notifications
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # Firebase Cloud Messaging
  FIREBASE_PROJECT_ID: "flamoral-staging"
  FIREBASE_CLIENT_EMAIL: "${AZURE_KEYVAULT:firebase-client-email}"
  FIREBASE_PRIVATE_KEY: "${AZURE_KEYVAULT:firebase-private-key}"
  FCM_SERVER_KEY: "${AZURE_KEYVAULT:fcm-server-key}"

  # Apple Push Notification Service (Development/Sandbox)
  APNS_KEY_ID: "${AZURE_KEYVAULT:apns-key-id}"
  APNS_TEAM_ID: "YOUR_APPLE_TEAM_ID"
  APNS_ENVIRONMENT: "development"
  APNS_PRIVATE_KEY: "${AZURE_KEYVAULT:apns-private-key}"

---
# Azure Services Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-azure-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: azure
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # Azure Storage
  AZURE_STORAGE_ACCOUNT: "flamoralstagingst"
  AZURE_STORAGE_KEY: "${AZURE_KEYVAULT:azure-storage-key}"
  AZURE_STORAGE_CONNECTION_STRING: "${AZURE_KEYVAULT:azure-storage-connection-string}"

  # Azure Service Bus
  AZURE_SERVICE_BUS_CONNECTION_STRING: "${AZURE_KEYVAULT:azure-service-bus-connection-string}"

  # Azure Cognitive Services
  AZURE_FACE_API_KEY: "${AZURE_KEYVAULT:azure-face-api-key}"
  AZURE_FACE_API_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"
  AZURE_CONTENT_MODERATOR_KEY: "${AZURE_KEYVAULT:azure-content-moderator-key}"
  AZURE_CONTENT_MODERATOR_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"
  AZURE_COMPUTER_VISION_KEY: "${AZURE_KEYVAULT:azure-computer-vision-key}"
  AZURE_COMPUTER_VISION_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"

  # Application Insights
  APPLICATION_INSIGHTS_CONNECTION_STRING: "${AZURE_KEYVAULT:application-insights-connection-string}"
  APPLICATION_INSIGHTS_INSTRUMENTATION_KEY: "${AZURE_KEYVAULT:application-insights-instrumentation-key}"

---
# Video/Voice Services Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-video-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: video
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # Agora.io
  AGORA_APP_ID: "YOUR_STAGING_AGORA_APP_ID"
  AGORA_APP_CERTIFICATE: "${AZURE_KEYVAULT:agora-app-certificate}"
  AGORA_CUSTOMER_KEY: "${AZURE_KEYVAULT:agora-customer-key}"
  AGORA_CUSTOMER_SECRET: "${AZURE_KEYVAULT:agora-customer-secret}"

---
# AI/ML Services Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-ai-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # OpenAI
  OPENAI_API_KEY: "${AZURE_KEYVAULT:openai-api-key}"
  OPENAI_ORGANIZATION: "${AZURE_KEYVAULT:openai-organization}"

  # Custom AI Model API
  AI_MODEL_API_KEY: "${AZURE_KEYVAULT:ai-model-api-key}"
  AI_MODEL_API_ENDPOINT: "https://api-staging.flamoral.com/ai"

---
# Monitoring & Analytics Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-monitoring-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # Sentry
  SENTRY_DSN: "${AZURE_KEYVAULT:sentry-dsn}"
  SENTRY_ENVIRONMENT: "staging"

  # Mixpanel
  MIXPANEL_TOKEN: "${AZURE_KEYVAULT:mixpanel-token}"

  # Segment
  SEGMENT_WRITE_KEY: "${AZURE_KEYVAULT:segment-write-key}"

  # Grafana
  GRAFANA_ADMIN_PASSWORD: "${AZURE_KEYVAULT:grafana-admin-password}"

  # Prometheus
  PROMETHEUS_BASIC_AUTH_USER: "admin"
  PROMETHEUS_BASIC_AUTH_PASSWORD: "${AZURE_KEYVAULT:prometheus-basic-auth-password}"

---
# Geolocation Services Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-geolocation-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: geolocation
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # Google Maps
  GOOGLE_MAPS_API_KEY: "${AZURE_KEYVAULT:google-maps-api-key}"

  # Mapbox
  MAPBOX_ACCESS_TOKEN: "${AZURE_KEYVAULT:mapbox-access-token}"

---
# Support & Operations Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-support-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: support
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # Zendesk
  ZENDESK_SUBDOMAIN: "flamoral-staging"
  ZENDESK_API_TOKEN: "${AZURE_KEYVAULT:zendesk-api-token}"
  ZENDESK_EMAIL: "support@flamoral-staging.com"

  # PagerDuty
  PAGERDUTY_INTEGRATION_KEY: "${AZURE_KEYVAULT:pagerduty-integration-key}"

  # Slack Webhooks
  SLACK_WEBHOOK_URL: "${AZURE_KEYVAULT:slack-webhook-url}"
  SLACK_ALERTS_WEBHOOK_URL: "${AZURE_KEYVAULT:slack-alerts-webhook-url}"

---
# Search Services Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-search-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    secret-source: "azure-keyvault"
    keyvault-name: "flamoral-staging-kv"
type: Opaque
stringData:
  # Elasticsearch
  ELASTICSEARCH_USERNAME: "elastic"
  ELASTICSEARCH_PASSWORD: "${AZURE_KEYVAULT:elasticsearch-password}"
  ELASTICSEARCH_URL: "https://flamoral-staging-es.eastus.azure.elastic-cloud.com:9243"

---
# TLS/SSL Certificates - Staging (Let's Encrypt)
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-tls-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
type: kubernetes.io/tls
stringData:
  tls.crt: "${AZURE_KEYVAULT:tls-certificate}"
  tls.key: "${AZURE_KEYVAULT:tls-private-key}"

---
# Image Registry Secrets - Staging
apiVersion: v1
kind: Secret
metadata:
  name: flamoral-registry-secrets
  namespace: flamoral-staging
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: flamoral-platform
    environment: staging
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: "${AZURE_KEYVAULT:docker-config-json}"
