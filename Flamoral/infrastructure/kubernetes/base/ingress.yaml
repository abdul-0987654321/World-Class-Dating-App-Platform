apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flamoral-ingress
  namespace: flamoral-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # SSL/TLS Configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

    # Rate Limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

    # Proxy Configuration
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"

    # CORS Configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://flamoral.com,https://www.flamoral.com,https://admin.flamoral.com,https://ws.flamoral.com,https://media.flamoral.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Request-ID,X-Correlation-ID,Accept,Accept-Encoding,Accept-Language,Origin"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range,X-Request-ID,X-Correlation-ID"

    # WebSocket Support
    nginx.ingress.kubernetes.io/websocket-services: "flamoral-realtime-service"

    # Connection Settings
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "100"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "60"
    nginx.ingress.kubernetes.io/upstream-keepalive-requests: "100"

    # Health Checks
    nginx.ingress.kubernetes.io/health-check-path: "/health/live"
    nginx.ingress.kubernetes.io/health-check-interval: "30s"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - flamoral.com
    - www.flamoral.com
    - api.flamoral.com
    - admin.flamoral.com
    - ws.flamoral.com
    - media.flamoral.com
    secretName: flamoral-tls
  rules:
  - host: flamoral.com
    http:
      paths:
      # Health checks for monitoring
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
      # API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
      # WebSocket routes
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: realtime-service
            port:
              number: 8081
      # Frontend web application (lowest priority)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flamoral-web
            port:
              number: 80
  - host: www.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flamoral-web
            port:
              number: 80
  - host: api.flamoral.com
    http:
      paths:
      # Health check endpoint - critical for Kubernetes readiness/liveness probes
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
      # All API routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
  - host: admin.flamoral.com
    http:
      paths:
      # Admin panel routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-service
            port:
              number: 3013
  - host: ws.flamoral.com
    http:
      paths:
      # WebSocket routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: realtime-service
            port:
              number: 8081
  - host: media.flamoral.com
    http:
      paths:
      # Media service routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: media-service
            port:
              number: 3006
