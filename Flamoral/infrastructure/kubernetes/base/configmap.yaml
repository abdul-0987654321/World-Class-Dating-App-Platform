apiVersion: v1
kind: ConfigMap
metadata:
  name: flamoral-config
  namespace: flamoral-prod
data:
  NODE_ENV: "production"
  APP_NAME: "flamoral-dating-platform"
  LOG_LEVEL: "warn"
  TZ: "UTC"
  ENVIRONMENT: "production"

  # Frontend URLs
  WEB_URL: "https://flamoral.com"
  ADMIN_URL: "https://admin.flamoral.com"
  API_URL: "https://api.flamoral.com"

  # Database Configuration (Azure PostgreSQL)
  DB_HOST: "flamoral-prod-postgres.postgres.database.azure.com"
  DB_PORT: "5432"
  DB_NAME: "flamoral_prod"
  DB_SSL: "true"
  DB_POOL_MIN: "10"
  DB_POOL_MAX: "50"

  # Redis Configuration (Azure Cache for Redis)
  REDIS_HOST: "flamoral-prod-redis.redis.cache.windows.net"
  REDIS_PORT: "6380"
  REDIS_TLS: "true"
  REDIS_DB: "0"

  # Internal Service URLs (Kubernetes Service Discovery)
  AUTH_SERVICE_URL: "http://auth-service.flamoral-prod.svc.cluster.local:3001"
  USER_SERVICE_URL: "http://user-service.flamoral-prod.svc.cluster.local:3002"
  MATCHING_SERVICE_URL: "http://matching-service.flamoral-prod.svc.cluster.local:3009"
  MESSAGING_SERVICE_URL: "http://messaging-service.flamoral-prod.svc.cluster.local:3003"
  PAYMENT_SERVICE_URL: "http://payment-service.flamoral-prod.svc.cluster.local:3005"
  MEDIA_SERVICE_URL: "http://media-service.flamoral-prod.svc.cluster.local:3006"
  ANALYTICS_SERVICE_URL: "http://analytics-service.flamoral-prod.svc.cluster.local:3007"
  MODERATION_SERVICE_URL: "http://moderation-service.flamoral-prod.svc.cluster.local:3008"
  ADMIN_SERVICE_URL: "http://admin-service.flamoral-prod.svc.cluster.local:3013"
  ADVERTISING_SERVICE_URL: "http://advertising-service.flamoral-prod.svc.cluster.local:3011"
  NOTIFICATION_SERVICE_URL: "http://notification-service.flamoral-prod.svc.cluster.local:3012"
  WORKFLOW_ENGINE_URL: "http://workflow-engine.flamoral-prod.svc.cluster.local:3015"
  AUTOMATION_SERVICE_URL: "http://automation-service.flamoral-prod.svc.cluster.local:3014"
  POLICY_SERVICE_URL: "http://policy-service.flamoral-prod.svc.cluster.local:3016"
  REALTIME_SERVICE_URL: "http://realtime-service.flamoral-prod.svc.cluster.local:8081"
  AI_SERVICE_URL: "http://ai-service.flamoral-prod.svc.cluster.local:8000"

  # AI/ML Services (Python)
  RECOMMENDATION_SERVICE_URL: "http://recommendation-service.flamoral-prod.svc.cluster.local:5000"
  NLP_SERVICE_URL: "http://nlp-service.flamoral-prod.svc.cluster.local:5001"
  PHOTO_ANALYSIS_SERVICE_URL: "http://photo-analysis.flamoral-prod.svc.cluster.local:5002"
  FRAUD_DETECTION_SERVICE_URL: "http://fraud-detection.flamoral-prod.svc.cluster.local:5003"
  DATING_COACH_SERVICE_URL: "http://dating-coach-service.flamoral-prod.svc.cluster.local:5004"
  CONTENT_GENERATOR_SERVICE_URL: "http://content-generator.flamoral-prod.svc.cluster.local:5005"

  # API Gateway
  API_GATEWAY_PORT: "3000"
  GRAPHQL_PORT: "4000"
  WS_PORT: "5000"

  # CORS Configuration
  CORS_ORIGIN: "https://flamoral.com,https://www.flamoral.com,https://admin.flamoral.com"
  CORS_CREDENTIALS: "true"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"

  # CDN Configuration
  CDN_ENABLED: "true"
  CDN_URL: "https://cdn.flamoral.com"
  AZURE_STORAGE_CDN_ENDPOINT: "https://cdn.flamoral.com"

  # Monitoring & Observability
  ENABLE_METRICS: "true"
  METRICS_PORT: "9090"
  PROMETHEUS_ENABLED: "true"
  JAEGER_ENABLED: "true"
  APPLICATION_INSIGHTS_ENABLED: "true"

  # Feature Flags
  FEATURE_AI_MATCHING: "true"
  FEATURE_VIDEO_CALLS: "true"
  FEATURE_TRAVEL_MODE: "true"
  FEATURE_DATING_COACH: "true"
  FEATURE_GAMIFICATION: "true"
  FEATURE_BETA_FEATURES: "false"

  # Security
  ENABLE_GRAPHQL_PLAYGROUND: "false"
  ENABLE_API_DOCS: "false"
  ENABLE_DEBUG_LOGGING: "false"

  # JWT Configuration
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  JWT_ISSUER: "flamoral-production"
  JWT_AUDIENCE: "flamoral-app"
  JWT_ALGORITHM: "HS256"

  # Azure Storage
  AZURE_STORAGE_ACCOUNT: "flamoralprodst"

  # Azure Services
  AZURE_FACE_API_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"
  AZURE_CONTENT_MODERATOR_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"
  AZURE_COMPUTER_VISION_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"

  # Queue Names
  QUEUE_MATCHING: "matching_queue"
  QUEUE_NOTIFICATIONS: "notification_queue"
  QUEUE_ANALYTICS: "analytics_queue"
  QUEUE_MODERATION: "moderation_queue"
  QUEUE_MEDIA_PROCESSING: "media_processing_queue"
  QUEUE_EMAIL: "email_queue"
  QUEUE_SMS: "sms_queue"
  QUEUE_PUSH_NOTIFICATIONS: "push_notification_queue"
  QUEUE_WEBSOCKET_EVENTS: "websocket_events_queue"
  QUEUE_AUDIT_LOGS: "audit_logs_queue"

  # Topic Names
  TOPIC_USER_EVENTS: "user_events_topic"
  TOPIC_MATCH_EVENTS: "match_events_topic"
  TOPIC_MESSAGE_EVENTS: "message_events_topic"
  TOPIC_PAYMENT_EVENTS: "payment_events_topic"

  # Health Checks
  HEALTH_CHECK_ENABLED: "true"
  HEALTH_CHECK_PATH: "/health"
  READINESS_CHECK_PATH: "/ready"
  LIVENESS_CHECK_PATH: "/live"

  # Business Rules
  MIN_AGE: "18"
  MAX_AGE: "100"
  MAX_PHOTOS: "10"
  MAX_BIO_LENGTH: "500"
  MAX_DISTANCE_KM: "100"
  FREE_LIKES_PER_DAY: "10"
  PREMIUM_LIKES_PER_DAY: "unlimited"

  # Cache Configuration
  CACHE_TTL: "3600"
  CACHE_CHECK_PERIOD: "600"

  # Email Configuration
  EMAIL_FROM_NAME: "Flamoral Dating"
  EMAIL_SUPPORT: "support@flamoral.com"

  # Twilio Configuration
  TWILIO_VERIFY_ENABLED: "true"

  # Upload Configuration
  MAX_FILE_SIZE: "10485760"
  ALLOWED_IMAGE_TYPES: "image/jpeg,image/png,image/webp"

  # WebSocket Configuration
  WS_HEARTBEAT_INTERVAL: "25000"
  WS_HEARTBEAT_TIMEOUT: "60000"

  # Matching Algorithm
  MATCHING_ALGORITHM: "ml-enhanced"
  MATCHING_BATCH_SIZE: "100"
  MATCHING_SCHEDULE: "0 */6 * * *"

  # Payment Configuration
  STRIPE_MODE: "live"
  PAYMENT_CURRENCY: "USD"

  # Subscription Plans
  PREMIUM_MONTHLY_PRICE: "2999"
  PREMIUM_YEARLY_PRICE: "19999"
  PLATINUM_MONTHLY_PRICE: "4999"

  # Azure Cosmos DB Configuration
  COSMOS_DB_ENDPOINT: "https://flamoral-prod-cosmos.documents.azure.com:443/"
  COSMOS_DB_DATABASE: "flamoral"

  # Service Bus Configuration
  SERVICE_BUS_NAMESPACE: "flamoral-prod-sb.servicebus.windows.net"

  # Content Moderation
  MODERATION_AUTO_APPROVE_THRESHOLD: "0.95"
  MODERATION_AUTO_REJECT_THRESHOLD: "0.30"

  # Rate Limiting - Service Specific
  AUTH_RATE_LIMIT: "10"
  API_RATE_LIMIT: "100"
  UPLOAD_RATE_LIMIT: "5"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: flamoral-prod
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 4096;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;

        gzip on;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        include /etc/nginx/conf.d/*.conf;
    }
