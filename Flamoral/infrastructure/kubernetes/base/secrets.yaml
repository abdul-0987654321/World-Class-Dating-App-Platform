  REDIS_PASSWORD: "*** INJECT FROM AZURE KEY VAULT ***"
  REDIS_URL: "*** INJECT FROM AZURE KEY VAULT ***"

  # =============================================================================
  # JWT Secrets (CRITICAL - Must be 64+ characters)
  # =============================================================================
  JWT_SECRET: "*** INJECT FROM AZURE KEY VAULT ***"
  JWT_ACCESS_SECRET: "*** INJECT FROM AZURE KEY VAULT ***"
