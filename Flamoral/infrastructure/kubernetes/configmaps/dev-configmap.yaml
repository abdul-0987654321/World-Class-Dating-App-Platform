# =============================================================================
# Flamoral Dating Platform - Development ConfigMaps
# =============================================================================
# Environment: development
# Namespace: flamoral-dev
# Purpose: Non-sensitive configuration for development environment
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flamoral-common-config
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
    config-type: common
data:
  # Environment Settings
  NODE_ENV: "development"
  ENVIRONMENT: "development"
  LOG_LEVEL: "debug"
  LOG_FORMAT: "pretty"
  DEBUG: "true"

  # External URLs
  WEB_URL: "http://localhost:3000"
  API_URL: "http://localhost:8080"
  ADMIN_URL: "http://localhost:3001"
  CDN_URL: "http://localhost:8081"
  API_VERSION: "v1"

  # CORS Configuration
  CORS_ORIGIN: "http://localhost:3000,http://localhost:3001"
  CORS_CREDENTIALS: "true"
  CORS_MAX_AGE: "86400"

  # Rate Limiting (Relaxed for development)
  RATE_LIMIT_ENABLED: "false"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "1000"

  # Database Configuration (Non-sensitive)
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  DB_SSL: "false"
  DB_CONNECTION_TIMEOUT: "30000"
  DB_IDLE_TIMEOUT: "10000"
  DB_LOG_QUERIES: "true"

  # MongoDB Configuration
  MONGODB_DB: "flamoral_dev"
  MONGODB_MAX_POOL_SIZE: "10"
  MONGODB_MIN_POOL_SIZE: "2"

  # Redis Configuration
  REDIS_DB: "0"
  REDIS_TTL: "3600"
  REDIS_KEY_PREFIX: "flamoral:dev:"

  # JWT Configuration
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  JWT_ISSUER: "flamoral-dev"

  # File Upload Configuration
  MAX_FILE_SIZE: "10485760"
  MAX_PHOTO_COUNT: "10"
  MAX_VIDEO_SIZE: "52428800"
  ALLOWED_IMAGE_TYPES: "image/jpeg,image/png,image/webp,image/gif"
  ALLOWED_VIDEO_TYPES: "video/mp4,video/quicktime,video/webm"
  UPLOAD_VIRUS_SCAN_ENABLED: "false"

  # WebSocket Configuration
  WS_PORT: "5000"
  WS_HEARTBEAT_INTERVAL: "30000"
  WS_HEARTBEAT_TIMEOUT: "60000"
  WS_MAX_CONNECTIONS_PER_USER: "5"

  # Feature Flags (All enabled for development)
  FEATURE_AI_MATCHING: "true"
  FEATURE_VIDEO_CALLS: "true"
  FEATURE_TRAVEL_MODE: "true"
  FEATURE_DATING_COACH: "true"
  FEATURE_GAMIFICATION: "true"
  FEATURE_SOCIAL_FEED: "true"
  FEATURE_STORIES: "true"
  FEATURE_BETA_FEATURES: "true"

  # Monitoring
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  PROMETHEUS_PORT: "9090"
  SENTRY_ENVIRONMENT: "development"
  SENTRY_TRACES_SAMPLE_RATE: "1.0"

  # Azure Configuration
  AZURE_STORAGE_ACCOUNT: "flamoraldevst"
  AZURE_STORAGE_CONTAINER_PHOTOS: "photos-dev"
  AZURE_STORAGE_CONTAINER_VIDEOS: "videos-dev"
  AZURE_STORAGE_CONTAINER_DOCUMENTS: "documents-dev"
  AZURE_FACE_API_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"
  AZURE_CONTENT_MODERATOR_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"

  # Firebase Configuration
  FIREBASE_PROJECT_ID: "flamoral-dev"
  FIREBASE_DATABASE_URL: "https://flamoral-dev.firebaseio.com"

  # Queue Names
  QUEUE_MATCHING: "matching_queue_dev"
  QUEUE_NOTIFICATIONS: "notification_queue_dev"
  QUEUE_ANALYTICS: "analytics_queue_dev"
  QUEUE_MODERATION: "moderation_queue_dev"
  QUEUE_MEDIA_PROCESSING: "media_processing_queue_dev"
  QUEUE_EMAIL: "email_queue_dev"
  QUEUE_SMS: "sms_queue_dev"

  # Localization
  DEFAULT_LANGUAGE: "en"
  SUPPORTED_LANGUAGES: "en,es,fr,de,it,pt,ja,ko,zh"
  DEFAULT_TIMEZONE: "UTC"

  # Business Rules
  MIN_AGE: "18"
  MAX_AGE: "100"
  FREE_LIKES_PER_DAY: "100"
  FREE_SUPER_LIKES_PER_DAY: "10"
  MATCH_EXPIRY_DAYS: "30"
  MESSAGE_RETENTION_DAYS: "365"

  # Security Configuration
  BCRYPT_ROUNDS: "10"
  PASSWORD_MIN_LENGTH: "8"
  MAX_LOGIN_ATTEMPTS: "10"
  ACCOUNT_LOCKOUT_DURATION: "900000"

  # Background Jobs
  ENABLE_BACKGROUND_JOBS: "true"
  JOB_CONCURRENCY: "5"
  JOB_RETRY_ATTEMPTS: "3"
  JOB_RETRY_DELAY: "5000"

  # Data Retention
  GDPR_ENABLED: "true"
  CCPA_ENABLED: "true"
  DATA_RETENTION_DAYS: "730"
  AUDIT_LOG_ENABLED: "true"

  # Geolocation
  DEFAULT_LOCATION_RADIUS_KM: "50"

  # AI/ML Configuration
  OPENAI_MODEL: "gpt-4"
  OPENAI_MAX_TOKENS: "2000"
  AI_MATCHING_ENABLED: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flamoral-service-discovery
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: flamoral
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
    config-type: service-discovery
data:
  # Service URLs (Kubernetes Internal DNS)
  USER_SERVICE_URL: "http://user-service.flamoral-dev.svc.cluster.local:3001"
  AUTH_SERVICE_URL: "http://auth-service.flamoral-dev.svc.cluster.local:3011"
  MATCHING_SERVICE_URL: "http://matching-service.flamoral-dev.svc.cluster.local:3002"
  MESSAGING_SERVICE_URL: "http://messaging-service.flamoral-dev.svc.cluster.local:3003"
  MODERATION_SERVICE_URL: "http://moderation-service.flamoral-dev.svc.cluster.local:3004"
  PAYMENT_SERVICE_URL: "http://payment-service.flamoral-dev.svc.cluster.local:3005"
  MEDIA_SERVICE_URL: "http://media-service.flamoral-dev.svc.cluster.local:3006"
  NOTIFICATION_SERVICE_URL: "http://notification-service.flamoral-dev.svc.cluster.local:3008"
  ANALYTICS_SERVICE_URL: "http://analytics-service.flamoral-dev.svc.cluster.local:3007"
  AI_SERVICE_URL: "http://ai-service.flamoral-dev.svc.cluster.local:3009"
  ADVERTISING_SERVICE_URL: "http://advertising-service.flamoral-dev.svc.cluster.local:3010"
  REALTIME_SERVICE_URL: "http://realtime-service.flamoral-dev.svc.cluster.local:3012"
  ADMIN_SERVICE_URL: "http://admin-service.flamoral-dev.svc.cluster.local:3013"
  API_GATEWAY_URL: "http://api-gateway.flamoral-dev.svc.cluster.local:8080"

  # Infrastructure Services
  POSTGRES_HOST: "postgres-primary.flamoral-dev.svc.cluster.local"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis-cluster.flamoral-dev.svc.cluster.local"
  REDIS_PORT: "6379"
  MONGODB_HOST: "mongodb.flamoral-dev.svc.cluster.local"
  MONGODB_PORT: "27017"
  ELASTICSEARCH_HOST: "elasticsearch.flamoral-dev.svc.cluster.local"
  ELASTICSEARCH_PORT: "9200"

  # Monitoring Services
  JAEGER_AGENT_HOST: "jaeger-agent.flamoral-dev.svc.cluster.local"
  JAEGER_AGENT_PORT: "6831"
  PROMETHEUS_HOST: "prometheus.flamoral-dev.svc.cluster.local"
  PROMETHEUS_PORT: "9090"
  GRAFANA_HOST: "grafana.flamoral-dev.svc.cluster.local"
  GRAFANA_PORT: "3000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
data:
  SERVICE_NAME: "user-service"
  PORT: "3001"
  METRICS_PORT: "9090"
  LOG_LEVEL: "debug"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
data:
  SERVICE_NAME: "auth-service"
  PORT: "3011"
  METRICS_PORT: "9090"
  LOG_LEVEL: "debug"
  TOKEN_EXPIRY: "3600"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matching-service-config
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: matching-service
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
data:
  SERVICE_NAME: "matching-service"
  PORT: "3002"
  METRICS_PORT: "9090"
  LOG_LEVEL: "debug"
  MATCHING_ALGORITHM: "ml-enhanced"
  MAX_MATCHES_PER_DAY: "100"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: messaging-service-config
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: messaging-service
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
data:
  SERVICE_NAME: "messaging-service"
  PORT: "3003"
  METRICS_PORT: "9090"
  LOG_LEVEL: "debug"
  MESSAGE_RETENTION_DAYS: "365"
  MAX_MESSAGE_LENGTH: "5000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
data:
  SERVICE_NAME: "payment-service"
  PORT: "3005"
  METRICS_PORT: "9090"
  LOG_LEVEL: "debug"
  STRIPE_MODE: "test"
  PAYMENT_WEBHOOK_PATH: "/webhooks/stripe"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
data:
  SERVICE_NAME: "notification-service"
  PORT: "3008"
  METRICS_PORT: "9090"
  LOG_LEVEL: "debug"
  FCM_ENABLED: "true"
  APNS_ENABLED: "true"
  EMAIL_ENABLED: "true"
  SMS_ENABLED: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: media-service-config
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: media-service
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
data:
  SERVICE_NAME: "media-service"
  PORT: "3006"
  METRICS_PORT: "9090"
  LOG_LEVEL: "debug"
  IMAGE_COMPRESSION_QUALITY: "85"
  VIDEO_COMPRESSION_ENABLED: "true"
  THUMBNAIL_GENERATION_ENABLED: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-config
  namespace: flamoral-dev
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: flamoral-platform
    environment: development
data:
  SERVICE_NAME: "ai-service"
  PORT: "3009"
  METRICS_PORT: "9090"
  LOG_LEVEL: "debug"
  AI_MODEL_VERSION: "v2"
  MATCHING_AI_ENABLED: "true"
  CONTENT_MODERATION_AI_ENABLED: "true"
