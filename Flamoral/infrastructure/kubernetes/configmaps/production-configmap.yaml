apiVersion: v1
kind: ConfigMap
metadata:
  name: flamoral-production-config
  namespace: flamoral
  labels:
    app: flamoral
    environment: production
    managed-by: kubectl
  annotations:
    description: "Production environment configuration for Flamoral Dating Platform"
    last-updated: "2025-12-11"
data:
  # =============================================================================
  # Environment Settings
  # =============================================================================
  NODE_ENV: "production"
  ENVIRONMENT: "production"
  DEBUG: "false"

  # Logging
  LOG_LEVEL: "warn"
  LOG_FORMAT: "json"
  LOG_FILE_ENABLED: "true"
  LOG_FILE_PATH: "/var/log/flamoral"
  LOG_RETENTION_DAYS: "30"

  # Timezone
  TZ: "UTC"
  DEFAULT_TIMEZONE: "UTC"

  # =============================================================================
  # Service Configuration
  # =============================================================================
  PORT: "3000"
  HOST: "0.0.0.0"
  GRAPHQL_PORT: "4000"
  WS_PORT: "5000"
  API_VERSION: "v1"

  # =============================================================================
  # Frontend URLs
  # =============================================================================
  WEB_URL: "https://flamoral.com"
  API_URL: "https://api.flamoral.com"
  ADMIN_URL: "https://admin.flamoral.com"
  INGRESS_HOST: "flamoral.com"
  API_HOST: "api.flamoral.com"
  MOBILE_APP_SCHEME: "flamoral://"

  # =============================================================================
  # Internal Service URLs (Kubernetes Service Discovery)
  # =============================================================================
  USER_SERVICE_URL: "http://user-service.flamoral.svc.cluster.local:3002"
  AUTH_SERVICE_URL: "http://auth-service.flamoral.svc.cluster.local:3001"
  MATCHING_SERVICE_URL: "http://matching-service.flamoral.svc.cluster.local:3009"
  MESSAGING_SERVICE_URL: "http://messaging-service.flamoral.svc.cluster.local:3004"
  MODERATION_SERVICE_URL: "http://moderation-service.flamoral.svc.cluster.local:3008"
  PAYMENT_SERVICE_URL: "http://payment-service.flamoral.svc.cluster.local:3005"
  MEDIA_SERVICE_URL: "http://media-service.flamoral.svc.cluster.local:3006"
  NOTIFICATION_SERVICE_URL: "http://notification-service.flamoral.svc.cluster.local:3012"
  ANALYTICS_SERVICE_URL: "http://analytics-service.flamoral.svc.cluster.local:3007"
  AI_SERVICE_URL: "http://ai-service.flamoral.svc.cluster.local:8000"
  ADVERTISING_SERVICE_URL: "http://advertising-service.flamoral.svc.cluster.local:3011"
  REALTIME_SERVICE_URL: "http://realtime-service.flamoral.svc.cluster.local:8081"
  ADMIN_SERVICE_URL: "http://admin-service.flamoral.svc.cluster.local:3010"
  AUTOMATION_SERVICE_URL: "http://automation-service.flamoral.svc.cluster.local:3014"
  WORKFLOW_ENGINE_URL: "http://workflow-engine.flamoral.svc.cluster.local:3013"

  # AI/ML Services
  RECOMMENDATION_SERVICE_URL: "http://recommendation-service.flamoral.svc.cluster.local:5000"
  NLP_SERVICE_URL: "http://nlp-service.flamoral.svc.cluster.local:5001"
  PHOTO_ANALYSIS_SERVICE_URL: "http://photo-analysis.flamoral.svc.cluster.local:5002"
  FRAUD_DETECTION_SERVICE_URL: "http://fraud-detection.flamoral.svc.cluster.local:5003"
  DATING_COACH_SERVICE_URL: "http://dating-coach-service.flamoral.svc.cluster.local:5004"
  CONTENT_GENERATOR_SERVICE_URL: "http://content-generator.flamoral.svc.cluster.local:5005"

  # =============================================================================
  # Database Configuration (Non-Sensitive)
  # =============================================================================
  DB_HOST: "flamoral-prod-postgres.postgres.database.azure.com"
  DB_PORT: "5432"
  DB_NAME: "flamoral"
  DB_USER: "flamoraladmin"
  DB_POOL_MIN: "10"
  DB_POOL_MAX: "50"
  DB_SSL: "true"
  DB_SSL_REJECT_UNAUTHORIZED: "true"
  DB_CONNECTION_TIMEOUT: "30000"
  DB_QUERY_TIMEOUT: "60000"
  DB_READ_REPLICA_ENABLED: "true"

  # MongoDB Configuration (Non-Sensitive)
  MONGODB_DB: "flamoral_prod"
  MONGODB_MAX_POOL_SIZE: "50"
  MONGODB_MIN_POOL_SIZE: "10"
  MONGODB_SSL: "true"

  # =============================================================================
  # Redis Configuration (Non-Sensitive)
  # =============================================================================
  REDIS_HOST: "flamoral-prod-redis.redis.cache.windows.net"
  REDIS_PORT: "6380"
  REDIS_DB: "0"
  REDIS_TLS: "true"
  REDIS_CLUSTER_MODE: "true"
  REDIS_MAX_RETRIES: "3"
  REDIS_TTL: "3600"
  REDIS_KEY_PREFIX: "flamoral:prod:"

  # =============================================================================
  # Message Queue Configuration (Non-Sensitive)
  # =============================================================================
  AZURE_SERVICE_BUS_NAMESPACE: "flamoral-prod-sb"
  QUEUE_MATCHING: "matching_queue"
  QUEUE_NOTIFICATIONS: "notification_queue"
  QUEUE_ANALYTICS: "analytics_queue"
  QUEUE_MODERATION: "moderation_queue"
  QUEUE_MEDIA_PROCESSING: "media_processing_queue"
  QUEUE_EMAIL: "email_queue"
  QUEUE_SMS: "sms_queue"
  QUEUE_PUSH_NOTIFICATIONS: "push_notification_queue"
  QUEUE_WEBSOCKET_EVENTS: "websocket_events_queue"
  QUEUE_AUDIT_LOGS: "audit_logs_queue"

  # =============================================================================
  # JWT Configuration (Non-Sensitive)
  # =============================================================================
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  JWT_ALGORITHM: "HS256"
  JWT_ISSUER: "flamoral-production"

  # Session Configuration (Non-Sensitive)
  SESSION_MAX_AGE: "86400000"
  SESSION_SECURE: "true"
  SESSION_HTTP_ONLY: "true"
  SESSION_SAME_SITE: "strict"

  # =============================================================================
  # Service Authentication (Non-Sensitive)
  # =============================================================================
  SERVICE_NAME: "flamoral-production"
  SERVICE_TIMEOUT: "30000"

  # =============================================================================
  # Password Security
  # =============================================================================
  BCRYPT_ROUNDS: "12"
  PASSWORD_MIN_LENGTH: "8"
  PASSWORD_REQUIRE_UPPERCASE: "true"
  PASSWORD_REQUIRE_LOWERCASE: "true"
  PASSWORD_REQUIRE_NUMBER: "true"
  PASSWORD_REQUIRE_SPECIAL: "true"
  MAX_LOGIN_ATTEMPTS: "5"
  ACCOUNT_LOCKOUT_DURATION: "1800000"
  MFA_ENABLED: "true"

  # =============================================================================
  # OAuth Configuration (Non-Sensitive)
  # =============================================================================
  GOOGLE_CLIENT_ID: "your-production-google-client-id.apps.googleusercontent.com"
  GOOGLE_CALLBACK_URL: "https://api.flamoral.com/auth/google/callback"
  GOOGLE_OAUTH_ENABLED: "true"

  FACEBOOK_APP_ID: "your-production-facebook-app-id"
  FACEBOOK_CALLBACK_URL: "https://api.flamoral.com/auth/facebook/callback"
  FACEBOOK_OAUTH_ENABLED: "true"

  APPLE_CLIENT_ID: "com.flamoral.com"
  APPLE_CALLBACK_URL: "https://api.flamoral.com/auth/apple/callback"
  APPLE_OAUTH_ENABLED: "true"

  # =============================================================================
  # Payment Gateway (Non-Sensitive)
  # =============================================================================
  STRIPE_PUBLISHABLE_KEY: "pk_live_your_production_publishable_key"
  STRIPE_API_VERSION: "2024-12-18.acacia"
  STRIPE_CURRENCY: "usd"
  STRIPE_COUNTRY: "US"

  # =============================================================================
  # Email Configuration (Non-Sensitive)
  # =============================================================================
  SENDGRID_FROM_EMAIL: "noreply@flamoral.com"
  SENDGRID_FROM_NAME: "Flamoral"
  SENDGRID_REPLY_TO: "support@flamoral.com"
  EMAIL_RATE_LIMIT: "100"

  # =============================================================================
  # SMS Configuration (Non-Sensitive)
  # =============================================================================
  TWILIO_ACCOUNT_SID: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  TWILIO_PHONE_NUMBER: "+1234567890"
  TWILIO_VERIFY_SERVICE_SID: "VAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  # =============================================================================
  # Azure Storage (Non-Sensitive)
  # =============================================================================
  AZURE_STORAGE_ACCOUNT: "flamoralprodst"
  AZURE_STORAGE_CONTAINER_PHOTOS: "photos"
  AZURE_STORAGE_CONTAINER_VIDEOS: "videos"
  AZURE_STORAGE_CONTAINER_DOCUMENTS: "documents"
  AZURE_STORAGE_CONTAINER_AVATARS: "avatars"
  AZURE_STORAGE_CDN_ENABLED: "true"
  AZURE_STORAGE_CDN_ENDPOINT: "https://cdn.flamoral.com"

  # =============================================================================
  # Azure Cognitive Services (Non-Sensitive)
  # =============================================================================
  AZURE_FACE_API_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"
  FACE_VERIFICATION_THRESHOLD: "0.7"

  AZURE_CONTENT_MODERATOR_ENDPOINT: "https://eastus.api.cognitive.microsoft.com"
  CONTENT_MODERATION_ENABLED: "true"
  AUTO_REJECT_THRESHOLD: "0.90"
  AUTO_FLAG_THRESHOLD: "0.70"

  # =============================================================================
  # Video/Voice Calling (Non-Sensitive)
  # =============================================================================
  AGORA_APP_ID: "your_production_agora_app_id"
  AGORA_TOKEN_EXPIRY: "3600"
  AGORA_ENABLE_RECORDING: "true"

  # =============================================================================
  # Push Notifications (Non-Sensitive)
  # =============================================================================
  FIREBASE_PROJECT_ID: "flamoral-production"
  FIREBASE_CLIENT_EMAIL: "firebase-adminsdk@flamoral-production.iam.gserviceaccount.com"
  FIREBASE_DATABASE_URL: "https://flamoral-production.firebaseio.com"
  FCM_SENDER_ID: "your-fcm-sender-id"

  # =============================================================================
  # Error Tracking (Non-Sensitive)
  # =============================================================================
  SENTRY_ENVIRONMENT: "production"
  SENTRY_TRACES_SAMPLE_RATE: "0.1"
  SENTRY_PROFILES_SAMPLE_RATE: "0.1"
  SENTRY_RELEASE: "flamoral@1.0.0"
  SENTRY_DEBUG: "false"

  # =============================================================================
  # CORS Configuration
  # =============================================================================
  CORS_ORIGIN: "https://flamoral.com,https://www.flamoral.com,https://admin.flamoral.com"
  CORS_CREDENTIALS: "true"
  CORS_MAX_AGE: "86400"
  CORS_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"

  # =============================================================================
  # Rate Limiting
  # =============================================================================
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  RATE_LIMIT_AUTH_MAX: "10"
  RATE_LIMIT_API_MAX: "100"

  # =============================================================================
  # File Upload Configuration
  # =============================================================================
  MAX_FILE_SIZE: "10485760"
  MAX_PHOTO_COUNT: "10"
  MAX_VIDEO_SIZE: "52428800"
  ALLOWED_IMAGE_TYPES: "image/jpeg,image/png,image/webp,image/heic"
  ALLOWED_VIDEO_TYPES: "video/mp4,video/quicktime"
  UPLOAD_VIRUS_SCAN_ENABLED: "true"
  UPLOAD_CONTENT_MODERATION_ENABLED: "true"

  # =============================================================================
  # WebSocket Configuration
  # =============================================================================
  WS_PATH: "/socket.io"
  WS_HEARTBEAT_INTERVAL: "30000"
  WS_HEARTBEAT_TIMEOUT: "60000"
  WS_MAX_CONNECTIONS_PER_USER: "3"
  WS_RECONNECT_ATTEMPTS: "5"

  # =============================================================================
  # Feature Flags
  # =============================================================================
  FEATURE_AI_MATCHING: "true"
  FEATURE_VIDEO_CALLS: "true"
  FEATURE_VOICE_CALLS: "true"
  FEATURE_TRAVEL_MODE: "true"
  FEATURE_DATING_COACH: "true"
  FEATURE_GAMIFICATION: "true"
  FEATURE_SOCIAL_FEED: "true"
  FEATURE_STORIES: "true"
  FEATURE_BETA_FEATURES: "false"
  FEATURE_MAINTENANCE_MODE: "false"

  # =============================================================================
  # AI/ML Configuration (Non-Sensitive)
  # =============================================================================
  AI_MODEL_ENDPOINT: "https://ai.flamoral.com"
  OPENAI_MODEL: "gpt-4-turbo"
  OPENAI_MAX_TOKENS: "2000"
  OPENAI_TEMPERATURE: "0.7"
  ML_MODEL_PATH: "/app/models"

  # =============================================================================
  # Monitoring & Observability
  # =============================================================================
  ENABLE_METRICS: "true"
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PORT: "9090"
  PROMETHEUS_PATH: "/metrics"

  ENABLE_TRACING: "true"
  JAEGER_ENABLED: "true"
  JAEGER_AGENT_HOST: "jaeger-agent.flamoral.svc.cluster.local"
  JAEGER_AGENT_PORT: "6831"
  JAEGER_SAMPLER_TYPE: "probabilistic"
  JAEGER_SAMPLER_PARAM: "0.1"

  APPLICATION_INSIGHTS_ENABLED: "true"
  APPLICATION_INSIGHTS_ROLE_NAME: "flamoral-production"

  HEALTH_CHECK_ENABLED: "true"
  HEALTH_CHECK_PATH: "/health"
  READINESS_CHECK_PATH: "/ready"
  LIVENESS_CHECK_PATH: "/live"

  # =============================================================================
  # Development Tools (Disabled in Production)
  # =============================================================================
  ENABLE_GRAPHQL_PLAYGROUND: "false"
  ENABLE_API_DOCS: "false"
  ENABLE_SWAGGER: "false"
  ENABLE_DEBUG_LOGGING: "false"
  ENABLE_VERBOSE_ERRORS: "false"
  ENABLE_HOT_RELOAD: "false"

  # =============================================================================
  # Security Headers
  # =============================================================================
  HSTS_MAX_AGE: "31536000"
  HSTS_INCLUDE_SUBDOMAINS: "true"
  HSTS_PRELOAD: "true"
  CSP_ENABLED: "true"
  X_FRAME_OPTIONS: "DENY"
  X_CONTENT_TYPE_OPTIONS: "nosniff"

  # =============================================================================
  # Search Service (Non-Sensitive)
  # =============================================================================
  ELASTICSEARCH_ENABLED: "true"
  ELASTICSEARCH_URL: "https://flamoral-prod-search.eastus.cloudapp.azure.com:9200"
  ELASTICSEARCH_USERNAME: "elastic"
  ELASTICSEARCH_INDEX: "flamoral_prod"
  ELASTICSEARCH_SSL_VERIFY: "true"

  # =============================================================================
  # Analytics (Non-Sensitive)
  # =============================================================================
  ANALYTICS_ENABLED: "true"
  GOOGLE_ANALYTICS_ID: "UA-XXXXXXXXX-X"

  # =============================================================================
  # Geolocation
  # =============================================================================
  DEFAULT_LOCATION_RADIUS_KM: "50"
  MAX_LOCATION_RADIUS_KM: "200"
  LOCATION_UPDATE_INTERVAL: "300000"

  # =============================================================================
  # CDN Configuration
  # =============================================================================
  CDN_ENABLED: "true"
  CDN_URL: "https://cdn.flamoral.com"
  CDN_CACHE_CONTROL: "public, max-age=31536000"
  STATIC_ASSETS_URL: "https://cdn.flamoral.com/static"

  # =============================================================================
  # Background Jobs
  # =============================================================================
  ENABLE_BACKGROUND_JOBS: "true"
  JOB_CONCURRENCY: "20"
  JOB_RETRY_ATTEMPTS: "3"
  JOB_RETRY_DELAY: "5000"
  JOB_TIMEOUT: "300000"

  # =============================================================================
  # Data Retention & Privacy
  # =============================================================================
  GDPR_ENABLED: "true"
  CCPA_ENABLED: "true"
  DATA_RETENTION_DAYS: "730"
  MESSAGE_RETENTION_DAYS: "365"
  AUDIT_LOG_ENABLED: "true"
  AUDIT_LOG_RETENTION_DAYS: "365"

  # =============================================================================
  # Localization
  # =============================================================================
  DEFAULT_LANGUAGE: "en"
  DEFAULT_LOCALE: "en-US"
  SUPPORTED_LANGUAGES: "en,es,fr,de,it,pt,ja,ko,zh,ar,hi,ru"

  # =============================================================================
  # Business Rules
  # =============================================================================
  MIN_AGE: "18"
  MAX_AGE: "100"
  FREE_LIKES_PER_DAY: "10"
  FREE_SUPER_LIKES_PER_DAY: "1"
  MATCH_EXPIRY_DAYS: "30"
  MAX_PHOTOS: "10"
  MAX_BIO_LENGTH: "500"

  # =============================================================================
  # Azure Key Vault (Non-Sensitive)
  # =============================================================================
  KEY_VAULT_ENABLED: "true"
  KEY_VAULT_NAME: "flamoral-prod-kv"
  KEY_VAULT_URI: "https://flamoral-prod-kv.vault.azure.net/"
  KEY_VAULT_MANAGED_IDENTITY_ENABLED: "true"

  # =============================================================================
  # Kubernetes Configuration
  # =============================================================================
  AKS_CLUSTER_NAME: "flamoral-prod-aks"
  AKS_RESOURCE_GROUP: "flamoral-prod-rg"
  NAMESPACE: "flamoral"
  REPLICA_COUNT: "5"
  AUTOSCALING_ENABLED: "true"
  AUTOSCALING_MIN_REPLICAS: "5"
  AUTOSCALING_MAX_REPLICAS: "50"
  TARGET_CPU_UTILIZATION: "70"
  TARGET_MEMORY_UTILIZATION: "80"

  # =============================================================================
  # Resource Limits
  # =============================================================================
  RESOURCE_REQUEST_MEMORY: "1Gi"
  RESOURCE_REQUEST_CPU: "1000m"
  RESOURCE_LIMIT_MEMORY: "2Gi"
  RESOURCE_LIMIT_CPU: "2000m"
  NODE_OPTIONS: "--max-old-space-size=1792"

  # =============================================================================
  # SSL/TLS Configuration
  # =============================================================================
  SSL_ENABLED: "true"
  SSL_FORCE_HTTPS: "true"
  TLS_MIN_VERSION: "1.2"
  CERT_MANAGER_ENABLED: "true"
  CERT_MANAGER_ISSUER: "letsencrypt-prod"

  # =============================================================================
  # Backup Configuration
  # =============================================================================
  BACKUP_ENABLED: "true"
  BACKUP_SCHEDULE: "0 2 * * *"
  BACKUP_RETENTION_DAYS: "30"
  BACKUP_STORAGE_ACCOUNT: "flamoralbkupprodst"
  PITR_ENABLED: "true"
  PITR_RETENTION_DAYS: "35"

  # =============================================================================
  # Deployment Configuration
  # =============================================================================
  DEPLOYMENT_SLOT: "blue"
  DEPLOYMENT_STRATEGY: "rolling"
  ENABLE_CANARY_DEPLOYMENT: "true"
  CANARY_TRAFFIC_PERCENTAGE: "10"

  # =============================================================================
  # Alert Contacts (Non-Sensitive)
  # =============================================================================
  ALERT_EMAIL_PRODUCTION: "alerts@flamoral.com"
  ALERT_EMAIL_DEVOPS: "devops@flamoral.com"
  ONCALL_PHONE_NUMBER: "+1234567890"
  SLACK_CHANNEL_ALERTS: "#prod-alerts"

  # =============================================================================
  # Compliance
  # =============================================================================
  TERMS_OF_SERVICE_URL: "https://flamoral.com/terms"
  PRIVACY_POLICY_URL: "https://flamoral.com/privacy"
  COMPANY_NAME: "Flamoral Inc."
