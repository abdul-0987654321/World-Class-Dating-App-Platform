---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: matching-service
  namespace: flamoral-dating
  labels:
    app: matching-service
    component: backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matching-service-config
  namespace: flamoral-dating
  labels:
    app: matching-service
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3003"
  REDIS_HOST: "redis-cluster.flamoral-dating.svc.cluster.local"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres-primary.flamoral-dating.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "flamoral_matching"
  JAEGER_AGENT_HOST: "jaeger-agent.monitoring.svc.cluster.local"
  JAEGER_AGENT_PORT: "6831"
  METRICS_PORT: "9090"
  ML_MODEL_ENDPOINT: "http://ai-recommendation-service:5000"
  MATCHING_ALGORITHM: "ml-enhanced"
  MAX_DAILY_MATCHES: "50"
  DISTANCE_WEIGHT: "0.3"
  INTEREST_WEIGHT: "0.4"
  COMPATIBILITY_WEIGHT: "0.3"

---
apiVersion: v1
kind: Secret
metadata:
  name: matching-service-secrets
  namespace: flamoral-dating
  labels:
    app: matching-service
type: Opaque
stringData:
  POSTGRES_USER: "flamoral_matching"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  ML_API_KEY: "CHANGE_ME_IN_PRODUCTION"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: flamoral-dating
  labels:
    app: matching-service
    version: v1
    component: backend
spec:
  replicas: 4
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
        version: v1
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: matching-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - matching-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: matching-service
        image: flamoral/matching-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3003
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: matching-service-config
        - secretRef:
            name: matching-service-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: flamoral-dating
  labels:
    app: matching-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
  - port: 3003
    targetPort: http
    protocol: TCP
    name: http
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: matching-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: matching-service-pdb
  namespace: flamoral-dating
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: matching-service

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matching-service-network-policy
  namespace: flamoral-dating
spec:
  podSelector:
    matchLabels:
      app: matching-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: flamoral-dating
    ports:
    - protocol: TCP
      port: 3003
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: ai-recommendation-service
    ports:
    - protocol: TCP
      port: 5000
  - to:
    - podSelector:
        matchLabels:
          app: user-service
    ports:
    - protocol: TCP
      port: 3001
  - ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
