apiVersion: apps/v1
kind: Deployment
metadata:
  name: flamoral-web
  namespace: flamoral
  labels:
    app: flamoral-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flamoral-web
  template:
    metadata:
      labels:
        app: flamoral-web
    spec:
      containers:
      - name: nginx
        image: flamoraldevacr.azurecr.io/flamoral-web:v1.0.0
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flamoral-web
  namespace: flamoral
spec:
  selector:
    app: flamoral-web
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
