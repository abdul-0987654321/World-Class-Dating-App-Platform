apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flamoral-ingress
  namespace: flamoral
  annotations:
    # Ingress Class
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # SSL/TLS Configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"

    # Proxy Configuration
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

    # CORS Configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://flamoral.com,https://www.flamoral.com,https://ws.flamoral.com,https://media.flamoral.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Request-ID,X-Correlation-ID,Accept,Accept-Encoding,Accept-Language,Origin"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range,X-Request-ID,X-Correlation-ID"

    # Rate Limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "50"

    # WebSocket Support
    nginx.ingress.kubernetes.io/websocket-services: "flamoral-realtime-service"

    # Health Checks
    nginx.ingress.kubernetes.io/health-check-path: "/health/live"
    nginx.ingress.kubernetes.io/health-check-interval: "30s"

    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      more_clear_headers Server;
      more_clear_headers X-Powered-By;
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - flamoral.com
    - www.flamoral.com
    - api.flamoral.com
    - ws.flamoral.com
    - media.flamoral.com
    secretName: flamoral-tls
  rules:
  - host: flamoral.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: realtime-service
            port:
              number: 8081
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flamoral-web
            port:
              number: 80
  - host: www.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flamoral-web
            port:
              number: 80
  - host: api.flamoral.com
    http:
      paths:
      # Health check endpoint - must be first for priority routing
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
      # All other API routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
  - host: ws.flamoral.com
    http:
      paths:
      # WebSocket routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flamoral-realtime-service
            port:
              number: 8080
  - host: media.flamoral.com
    http:
      paths:
      # Media service routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flamoral-media-service
            port:
              number: 3005
