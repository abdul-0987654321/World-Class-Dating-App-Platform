apiVersion: v1
kind: Secret
metadata:
  name: flamoral-oauth-secrets
  namespace: flamoral
type: Opaque
stringData:
  # Google OAuth
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"
  GOOGLE_CALLBACK_URL: "https://api.flamoral.com/api/auth/oauth/google/callback"

  # Facebook OAuth
  FACEBOOK_APP_ID: "YOUR_FACEBOOK_APP_ID"
  FACEBOOK_APP_SECRET: "YOUR_FACEBOOK_APP_SECRET"
  FACEBOOK_CALLBACK_URL: "https://api.flamoral.com/api/auth/oauth/facebook/callback"

  # Apple OAuth
  APPLE_CLIENT_ID: "com.flamoral.app"
  APPLE_TEAM_ID: "YOUR_APPLE_TEAM_ID"
  APPLE_KEY_ID: "YOUR_APPLE_KEY_ID"
  APPLE_CALLBACK_URL: "https://api.flamoral.com/api/auth/oauth/apple/callback"
---
# ConfigMap for OAuth redirect URIs (non-sensitive)
apiVersion: v1
kind: ConfigMap
metadata:
  name: flamoral-oauth-config
  namespace: flamoral
data:
  OAUTH_GOOGLE_REDIRECT_URI: "https://api.flamoral.com/api/auth/oauth/google/callback"
  OAUTH_FACEBOOK_REDIRECT_URI: "https://api.flamoral.com/api/auth/oauth/facebook/callback"
  OAUTH_APPLE_REDIRECT_URI: "https://api.flamoral.com/api/auth/oauth/apple/callback"
