apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-user-service
  namespace: flamoral
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrator
        image: node:20-alpine
        workingDir: /app
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
        command:
        - /bin/sh
        - -c
        - |
          echo "Installing dependencies..."
          npm install -g knex ts-node typescript

          echo "Creating knexfile.js..."
          cat > knexfile.js <<'EOF'
          module.exports = {
            client: 'postgresql',
            connection: {
              host: process.env.POSTGRES_HOST,
              port: parseInt(process.env.POSTGRES_PORT || '5432'),
              database: 'flamoral_users',
              user: process.env.POSTGRES_USER,
              password: process.env.POSTGRES_PASSWORD,
              ssl: { rejectUnauthorized: false }
            },
            migrations: {
              directory: './migrations',
              extension: 'sql',
              tableName: 'knex_migrations'
            }
          };
          EOF

          echo "Creating SQL migrations..."
          mkdir -p migrations

          # Note: In production, these migrations should be copied from the codebase
          # For now, we'll run them via psql directly

          echo "Running migrations via psql..."
          apk add --no-cache postgresql-client

          # Create a simple migration to verify connectivity
          PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d flamoral_users -c "SELECT version();"

          echo "Migration setup completed. Migrations should be run from the service application code."
        env:
        - name: NODE_ENV
          value: "production"
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: POSTGRES_PASSWORD
  backoffLimit: 3
