version: '3.8'

# Flamoral Dating Platform - Local Development Docker Compose
# Complete setup for all backend services with dependencies

networks:
  flamoral-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  minio-data:
  rabbitmq-data:
  elasticsearch-data:

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: flamoral-postgres
    environment:
      POSTGRES_DB: flamoral
      POSTGRES_USER: ${POSTGRES_USER:-flamoral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flamoral_dev_pass}
      POSTGRES_MULTIPLE_DATABASES: users,auth,matching,analytics,payments,admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - flamoral-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flamoral}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flamoral-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-flamoral_redis_pass}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - flamoral-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: flamoral-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-flamoral}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-flamoral_mongo_pass}
      MONGO_INITDB_DATABASE: flamoral_messages
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - flamoral-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: flamoral-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - flamoral-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: flamoral-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-flamoral}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-flamoral_rabbit_pass}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - flamoral-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: flamoral-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - flamoral-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # Backend Services - Core
  # ============================================================================

  api-gateway:
    build:
      context: ../../
      dockerfile: backend/services/api-gateway/Dockerfile
    image: flamoral/api-gateway:latest
    container_name: flamoral-api-gateway
    environment:
      NODE_ENV: development
      PORT: 4000
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:4001
      USER_SERVICE_URL: http://user-service:4002
      MATCHING_SERVICE_URL: http://matching-service:4003
      MESSAGING_SERVICE_URL: http://messaging-service:4004
      MEDIA_SERVICE_URL: http://media-service:4005
      PAYMENT_SERVICE_URL: http://payment-service:4006
      NOTIFICATION_SERVICE_URL: http://notification-service:4007
      ANALYTICS_SERVICE_URL: http://analytics-service:4008
      MODERATION_SERVICE_URL: http://moderation-service:4009
      ADMIN_SERVICE_URL: http://admin-service:4010
      REALTIME_SERVICE_URL: http://realtime-service:4011
      POLICY_SERVICE_URL: http://policy-service:4012
      ADVERTISING_SERVICE_URL: http://advertising-service:4013
      AUTOMATION_SERVICE_URL: http://automation-service:4014
      WORKFLOW_ENGINE_URL: http://workflow-engine:4015
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - flamoral-network
    restart: unless-stopped

  auth-service:
    build:
      context: ../../
      dockerfile: backend/services/auth-service/Dockerfile
    image: flamoral/auth-service:latest
    container_name: flamoral-auth-service
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/auth
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  user-service:
    build:
      context: ../../
      dockerfile: backend/services/user-service/Dockerfile
    image: flamoral/user-service:latest
    container_name: flamoral-user-service
    environment:
      NODE_ENV: development
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/users
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      MEDIA_SERVICE_URL: http://media-service:4005
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  matching-service:
    build:
      context: ../../
      dockerfile: backend/services/matching-service/Dockerfile
    image: flamoral/matching-service:latest
    container_name: flamoral-matching-service
    environment:
      NODE_ENV: development
      PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/matching
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      USER_SERVICE_URL: http://user-service:4002
      ML_SERVICE_URL: http://recommendation-service:5000
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - flamoral-network
    restart: unless-stopped

  messaging-service:
    build:
      context: ../../
      dockerfile: backend/services/messaging-service/Dockerfile
    image: flamoral/messaging-service:latest
    container_name: flamoral-messaging-service
    environment:
      NODE_ENV: development
      PORT: 4004
      MONGODB_URI: mongodb://${MONGO_USER:-flamoral}:${MONGO_PASSWORD:-flamoral_mongo_pass}@mongodb:27017/flamoral_messages?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      USER_SERVICE_URL: http://user-service:4002
      MODERATION_SERVICE_URL: http://moderation-service:4009
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
    ports:
      - "4004:4004"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  media-service:
    build:
      context: ../../
      dockerfile: backend/services/media-service/Dockerfile
    image: flamoral/media-service:latest
    container_name: flamoral-media-service
    environment:
      NODE_ENV: development
      PORT: 4005
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/flamoral
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: flamoral-media
      MODERATION_SERVICE_URL: http://moderation-service:4009
      PHOTO_ANALYSIS_URL: http://photo-analysis:5002
    ports:
      - "4005:4005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  payment-service:
    build:
      context: ../../
      dockerfile: backend/services/payment-service/Dockerfile
    image: flamoral/payment-service:latest
    container_name: flamoral-payment-service
    environment:
      NODE_ENV: development
      PORT: 4006
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/payments
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_your_key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_your_secret}
      USER_SERVICE_URL: http://user-service:4002
    ports:
      - "4006:4006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  notification-service:
    build:
      context: ../../
      dockerfile: backend/services/notification-service/Dockerfile
    image: flamoral/notification-service:latest
    container_name: flamoral-notification-service
    environment:
      NODE_ENV: development
      PORT: 4007
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/flamoral
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-your_sendgrid_key}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-your_twilio_sid}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-your_twilio_token}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-your_fcm_key}
    ports:
      - "4007:4007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  analytics-service:
    build:
      context: ../../
      dockerfile: backend/services/analytics-service/Dockerfile
    image: flamoral/analytics-service:latest
    container_name: flamoral-analytics-service
    environment:
      NODE_ENV: development
      PORT: 4008
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/analytics
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "4008:4008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  moderation-service:
    build:
      context: ../../
      dockerfile: backend/services/moderation-service/Dockerfile
    image: flamoral/moderation-service:latest
    container_name: flamoral-moderation-service
    environment:
      NODE_ENV: development
      PORT: 4009
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/flamoral
      NLP_SERVICE_URL: http://nlp-service:5001
      FRAUD_DETECTION_URL: http://fraud-detection:5003
    ports:
      - "4009:4009"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  admin-service:
    build:
      context: ../../
      dockerfile: backend/services/admin-service/Dockerfile
    image: flamoral/admin-service:latest
    container_name: flamoral-admin-service
    environment:
      NODE_ENV: development
      PORT: 4010
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
    ports:
      - "4010:4010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  realtime-service:
    build:
      context: ../../
      dockerfile: backend/services/realtime-service/Dockerfile
    image: flamoral/realtime-service:latest
    container_name: flamoral-realtime-service
    environment:
      NODE_ENV: development
      PORT: 4011
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
    ports:
      - "4011:4011"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  # ============================================================================
  # AI Services (Python)
  # ============================================================================

  recommendation-service:
    build:
      context: ../../
      dockerfile: backend/services/ai-services/recommendation-service/Dockerfile
    image: flamoral/recommendation-service:latest
    container_name: flamoral-recommendation-service
    environment:
      FLASK_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/matching
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      MODEL_PATH: /app/models
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  nlp-service:
    build:
      context: ../../
      dockerfile: backend/services/ai-services/nlp-service/Dockerfile
    image: flamoral/nlp-service:latest
    container_name: flamoral-nlp-service
    environment:
      FLASK_ENV: development
      PORT: 5001
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      MODEL_PATH: /app/models
    ports:
      - "5001:5001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  photo-analysis:
    build:
      context: ../../
      dockerfile: backend/services/ai-services/photo-analysis/Dockerfile
    image: flamoral/photo-analysis:latest
    container_name: flamoral-photo-analysis
    environment:
      FLASK_ENV: development
      PORT: 5002
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      MODEL_PATH: /app/models
    ports:
      - "5002:5002"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  fraud-detection:
    build:
      context: ../../
      dockerfile: backend/services/ai-services/fraud-detection/Dockerfile
    image: flamoral/fraud-detection:latest
    container_name: flamoral-fraud-detection
    environment:
      FLASK_ENV: development
      PORT: 5003
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/flamoral
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      MODEL_PATH: /app/models
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  dating-coach-service:
    build:
      context: ../../
      dockerfile: backend/services/ai-services/dating-coach-service/Dockerfile
    image: flamoral/dating-coach-service:latest
    container_name: flamoral-dating-coach
    environment:
      FLASK_ENV: development
      PORT: 5004
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your_openai_key}
    ports:
      - "5004:5004"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  content-generator:
    build:
      context: ../../
      dockerfile: backend/services/ai-services/content-generator/Dockerfile
    image: flamoral/content-generator:latest
    container_name: flamoral-content-generator
    environment:
      FLASK_ENV: development
      PORT: 5005
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your_openai_key}
    ports:
      - "5005:5005"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped

  # ============================================================================
  # New Services
  # ============================================================================

  policy-service:
    build:
      context: ../../
      dockerfile: backend/services/policy-service/Dockerfile
    image: flamoral/policy-service:latest
    container_name: flamoral-policy-service
    environment:
      NODE_ENV: development
      PORT: 4012
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/flamoral
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "4012:4012"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4012/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  advertising-service:
    build:
      context: ../../
      dockerfile: backend/services/advertising-service/Dockerfile
    image: flamoral/advertising-service:latest
    container_name: flamoral-advertising-service
    environment:
      NODE_ENV: development
      PORT: 4013
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/flamoral
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      ANALYTICS_SERVICE_URL: http://analytics-service:4008
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "4013:4013"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics-service:
        condition: service_started
    networks:
      - flamoral-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4013/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  automation-service:
    build:
      context: ../../
      dockerfile: backend/services/automation-service/Dockerfile
    image: flamoral/automation-service:latest
    container_name: flamoral-automation-service
    environment:
      NODE_ENV: development
      PORT: 4014
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/flamoral
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-flamoral}:${RABBITMQ_PASSWORD:-flamoral_rabbit_pass}@rabbitmq:5672
      NOTIFICATION_SERVICE_URL: http://notification-service:4007
      MESSAGING_SERVICE_URL: http://messaging-service:4004
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "4014:4014"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4014/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  workflow-engine:
    build:
      context: ../../
      dockerfile: backend/services/workflow-engine/Dockerfile
    image: flamoral/workflow-engine:latest
    container_name: flamoral-workflow-engine
    environment:
      NODE_ENV: development
      PORT: 4015
      DATABASE_URL: postgresql://${POSTGRES_USER:-flamoral}:${POSTGRES_PASSWORD:-flamoral_dev_pass}@postgres:5432/flamoral
      REDIS_URL: redis://:${REDIS_PASSWORD:-flamoral_redis_pass}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-flamoral}:${RABBITMQ_PASSWORD:-flamoral_rabbit_pass}@rabbitmq:5672
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "4015:4015"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - flamoral-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
