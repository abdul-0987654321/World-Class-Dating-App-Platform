  # ===========================================================================
  # Monitoring - Prometheus (Production)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: flamoral-prod-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - flamoral-prod-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # Monitoring - Grafana (Production)
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: flamoral-prod-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=https://grafana.flamoral.app
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - flamoral-prod-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ===========================================================================
  # Tracing - Jaeger (Production)
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: flamoral-prod-jaeger
    restart: always
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    networks:
      - flamoral-prod-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # Nginx Reverse Proxy (Production with SSL)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: flamoral-prod-nginx
    restart: always
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - flamoral-prod-network
    depends_on:
      - api-gateway
      - realtime-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Production Deployment Notes
# =============================================================================
#
# 1. Image Registry:
#    - All images should be pulled from Azure Container Registry (ACR)
#    - Set ACR_LOGIN_SERVER and IMAGE_TAG environment variables
#    - Authenticate: az acr login --name flamoralacr8eq5eg
#
# 2. Environment Variables:
#    - Load from .env.production file
#    - Sensitive values should come from Azure Key Vault
#    - Use --env-file flag: docker-compose --env-file .env.production up
#
# 3. Resource Limits:
#    - All services have CPU and memory limits defined
#    - Adjust based on actual load testing results
#    - Monitor with docker stats
#
# 4. Health Checks:
#    - All services have health checks configured
#    - Services won't receive traffic until healthy
#    - Failed health checks trigger automatic restarts
#
# 5. Logging:
#    - JSON file driver with rotation
#    - Max 10MB per file, 3 files retained
#    - Consider external log aggregation (ELK, Azure Monitor)
#
# 6. Networking:
#    - Isolated production network
#    - Services communicate internally
#    - Only necessary ports exposed externally
#
# 7. SSL/TLS:
#    - Nginx handles SSL termination
#    - Place certificates in ../nginx/ssl/
#    - Update nginx.prod.conf with certificate paths
#
# 8. Scaling:
#    - Use docker-compose up --scale service-name=N
#    - Better: Deploy to Kubernetes for true production
#
# 9. Monitoring:
#    - Prometheus scrapes metrics from all services
#    - Grafana visualizes metrics
#    - Jaeger collects distributed traces
#
# 10. Backup & Recovery:
#     - Regular volume backups required
#     - Database backups handled externally (Azure)
#     - Document recovery procedures
#
# =============================================================================
# Commands
# =============================================================================
#
# Start all services:
#   docker-compose -f docker-compose.production.yml up -d
#
# View logs:
#   docker-compose -f docker-compose.production.yml logs -f [service-name]
#
# Stop all services:
#   docker-compose -f docker-compose.production.yml down
#
# Update service:
#   docker-compose -f docker-compose.production.yml up -d --no-deps --build [service-name]
#
# Check health:
#   docker-compose -f docker-compose.production.yml ps
#
# =============================================================================
