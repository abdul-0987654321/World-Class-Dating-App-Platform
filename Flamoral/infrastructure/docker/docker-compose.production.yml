version: '3.8'

# =============================================================================
# Flamoral Dating Platform - Production Docker Compose Configuration
# =============================================================================
# IMPORTANT: This file is for production-like testing only
# For actual production deployment, use Kubernetes (AKS)
#
# Usage:
#   docker-compose -f docker-compose.production.yml up -d
#
# Prerequisites:
#   - All services must have production-ready Dockerfiles
#   - Environment variables must be loaded from .env.production
#   - SSL certificates must be properly configured
#   - External services (Azure, AWS) must be configured
#
# Last Updated: 2025-12-11
# =============================================================================

networks:
  flamoral-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  prometheus-data:
  grafana-data:
  jaeger-data:

services:
  # ===========================================================================
  # API Gateway (Production Mode)
  # ===========================================================================
  api-gateway:
    image: ${ACR_LOGIN_SERVER}/flamoral-api-gateway:${IMAGE_TAG:-latest}
    container_name: flamoral-prod-api-gateway
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
    env_file:
      - ../../infrastructure/config/.env.production
    ports:
      - "4000:4000"
    networks:
      - flamoral-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '1.0'
          memory: 1024M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.flamoral.service=api-gateway"
      - "com.flamoral.environment=production"

