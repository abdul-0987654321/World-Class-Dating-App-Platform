groups:
  # ===========================================
  # Service Health Alerts
  # ===========================================
  - name: service-health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
          /
          sum(rate(http_requests_total[5m])) by (service)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} on service {{ $labels.service }}"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service))
          > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.service }}"
          description: "95th percentile latency is {{ $value }}s on service {{ $labels.service }}"

      - alert: HighLatencyCritical
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service))
          > 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical latency on {{ $labels.service }}"
          description: "99th percentile latency is {{ $value }}s on service {{ $labels.service }}"

  # ===========================================
  # Infrastructure Alerts
  # ===========================================
  - name: infrastructure
    rules:
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
          > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: CriticalCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
          > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
          > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes) * 100
          < 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is {{ $value }}% available on {{ $labels.instance }}"

      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[1h]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in the last hour"

      - alert: PodNotReady
        expr: |
          sum by(namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"})
          > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} is not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in {{ $labels.phase }} state for more than 15 minutes"

  # ===========================================
  # Database Alerts
  # ===========================================
  - name: database
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is down"

      - alert: PostgreSQLHighConnections
        expr: |
          pg_stat_activity_count / pg_settings_max_connections * 100
          > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL connection usage"
          description: "PostgreSQL connection usage is {{ $value }}%"

      - alert: PostgreSQLSlowQueries
        expr: |
          rate(pg_stat_statements_seconds_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow PostgreSQL queries detected"
          description: "Query execution time is abnormally high"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is down"

      - alert: RedisHighMemory
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes * 100
          > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value }}%"

  # ===========================================
  # Business Logic Alerts
  # ===========================================
  - name: business
    rules:
      - alert: HighMatchingQueueDepth
        expr: |
          matching_queue_depth > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High matching queue depth"
          description: "Matching queue has {{ $value }} pending items"

      - alert: LowMatchingRate
        expr: |
          rate(matches_created_total[1h]) < 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Low matching rate"
          description: "Match creation rate is {{ $value }} per hour"

      - alert: PaymentFailureRate
        expr: |
          sum(rate(payment_transactions_total{status="failed"}[5m]))
          /
          sum(rate(payment_transactions_total[5m]))
          > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value | humanizePercentage }}"

      - alert: MessageDeliveryDelay
        expr: |
          histogram_quantile(0.95, sum(rate(message_delivery_delay_seconds_bucket[5m])) by (le))
          > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Message delivery delay detected"
          description: "95th percentile message delivery delay is {{ $value }}s"

      - alert: UserRegistrationDrop
        expr: |
          rate(user_registrations_total[1h])
          < (rate(user_registrations_total[1h] offset 1d) * 0.5)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Significant drop in user registrations"
          description: "User registration rate dropped by more than 50% compared to yesterday"

  # ===========================================
  # Security Alerts
  # ===========================================
  - name: security
    rules:
      - alert: HighFailedLoginAttempts
        expr: |
          sum(rate(auth_login_attempts_total{status="failed"}[5m])) by (ip)
          > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High failed login attempts from {{ $labels.ip }}"
          description: "{{ $value }} failed login attempts per second from IP {{ $labels.ip }}"

      - alert: SuspiciousAPIActivity
        expr: |
          sum(rate(http_requests_total{status="403"}[5m])) by (client_ip)
          > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Suspicious API activity detected"
          description: "High rate of 403 responses for client {{ $labels.client_ip }}"

      - alert: CertificateExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400
          < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value }} days"

      - alert: CertificateExpiringCritical
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400
          < 7
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "SSL certificate expiring very soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value }} days"
