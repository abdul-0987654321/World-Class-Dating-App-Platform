################################################################################
# Flamoral Platform - Comprehensive Alert Configuration
################################################################################
# This file contains all alert rules and notification configurations for the
# Flamoral platform monitoring system.
#
# Components:
#   1. Prometheus Alert Rules
#   2. AlertManager Configuration
#   3. Notification Channels (Slack, Email, PagerDuty)
#   4. Alert Routing Rules
#   5. Inhibition Rules
#
# Usage:
#   kubectl apply -f alerts-config.yaml
################################################################################

---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
################################################################################
# Prometheus Alert Rules ConfigMap
################################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: flamoral-alert-rules
  namespace: monitoring
  labels:
    app: prometheus
    component: alert-rules
data:
  # Critical Application Alerts
  critical-alerts.yml: |
    groups:
    - name: critical_alerts
      interval: 30s
      rules:

      # Pod Crash Loop
      - alert: PodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total{namespace="flamoral"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
          component: kubernetes
          team: platform
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in the last 15 minutes."
          runbook_url: "https://docs.flamoral.com/runbooks/pod-crash-loop"
          action: "Check pod logs: kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }}"

      # Service Down
      - alert: ServiceDown
        expr: |
          up{job=~".*-service",namespace="flamoral"} == 0
        for: 2m
        labels:
          severity: critical
          component: service
          team: platform
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been unreachable for more than 2 minutes."
          runbook_url: "https://docs.flamoral.com/runbooks/service-down"
          action: "Check service status: kubectl get pods -n flamoral -l app={{ $labels.job }}"

      # High Error Rate
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_requests_total{status=~"5..",namespace="flamoral"}[5m])) by (service)
          /
          sum(rate(http_requests_total{namespace="flamoral"}[5m])) by (service)) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
          team: backend
        annotations:
          summary: "High error rate in {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} for service {{ $labels.service }}. This exceeds the 5% threshold."
          runbook_url: "https://docs.flamoral.com/runbooks/high-error-rate"
          dashboard_url: "https://grafana.flamoral.com/d/api-dashboard"

      # Certificate Expiring
      - alert: CertificateExpiringSoon
        expr: |
          (cert_manager_certificate_expiration_timestamp_seconds - time()) < (7 * 24 * 3600)
        for: 1h
        labels:
          severity: critical
          component: security
          team: platform
        annotations:
          summary: "TLS certificate {{ $labels.name }} expiring soon"
          description: "Certificate {{ $labels.name }} expires in {{ $value | humanizeDuration }}. Renewal needed urgently."
          runbook_url: "https://docs.flamoral.com/runbooks/certificate-renewal"
          action: "Check cert-manager: kubectl get certificate -n flamoral {{ $labels.name }}"

      # Database Connection Pool Exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          (pg_stat_activity_count / pg_settings_max_connections) > 0.95
        for: 5m
        labels:
          severity: critical
          component: database
          team: backend
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Database connections at {{ $value | humanizePercentage }} of maximum. Service degradation likely."
          runbook_url: "https://docs.flamoral.com/runbooks/db-connections"

      # Redis Down
      - alert: RedisDown
        expr: |
          redis_up{namespace="flamoral"} == 0
        for: 2m
        labels:
          severity: critical
          component: cache
          team: backend
        annotations:
          summary: "Redis is down"
          description: "Redis cache has been unreachable for more than 2 minutes. Session management and caching affected."
          runbook_url: "https://docs.flamoral.com/runbooks/redis-down"

  # Performance Alerts
  performance-alerts.yml: |
    groups:
    - name: performance_alerts
      interval: 1m
      rules:

      # High Response Time
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{namespace="flamoral"}[5m])) by (service, le)
          ) > 2
        for: 10m
        labels:
          severity: warning
          component: performance
          team: backend
        annotations:
          summary: "High response time for {{ $labels.service }}"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.service }}. Target is <2s."
          dashboard_url: "https://grafana.flamoral.com/d/performance-dashboard"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: |
          (sum(rate(container_cpu_usage_seconds_total{namespace="flamoral"}[5m])) by (pod)
          /
          sum(container_spec_cpu_quota{namespace="flamoral"}/container_spec_cpu_period{namespace="flamoral"}) by (pod)) > 0.9
        for: 10m
        labels:
          severity: warning
          component: resources
          team: platform
        annotations:
          summary: "High CPU usage in pod {{ $labels.pod }}"
          description: "CPU usage is {{ $value | humanizePercentage }} for pod {{ $labels.pod }}."
          action: "Consider scaling: kubectl scale deployment {{ $labels.deployment }} -n flamoral --replicas=X"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          (container_memory_working_set_bytes{namespace="flamoral"}
          /
          container_spec_memory_limit_bytes{namespace="flamoral"}) > 0.9
        for: 5m
        labels:
          severity: warning
          component: resources
          team: platform
        annotations:
          summary: "High memory usage in {{ $labels.pod }}"
          description: "Memory usage is {{ $value | humanizePercentage }} for pod {{ $labels.pod }}. OOM risk."

      # Slow Database Queries
      - alert: SlowDatabaseQueries
        expr: |
          rate(pg_stat_statements_mean_time_seconds{query!~".*pg_stat.*"}[5m]) > 1
        for: 10m
        labels:
          severity: warning
          component: database
          team: backend
        annotations:
          summary: "Slow database queries detected"
          description: "Average query time is {{ $value }}s. Performance degradation likely."
          dashboard_url: "https://grafana.flamoral.com/d/database-dashboard"

      # High Cache Miss Rate
      - alert: HighCacheMissRate
        expr: |
          (rate(redis_keyspace_misses_total{namespace="flamoral"}[5m])
          /
          (rate(redis_keyspace_hits_total{namespace="flamoral"}[5m]) + rate(redis_keyspace_misses_total{namespace="flamoral"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
          component: cache
          team: backend
        annotations:
          summary: "High Redis cache miss rate"
          description: "Cache miss rate is {{ $value | humanizePercentage }}. Cache efficiency degraded."

  # Resource Alerts
  resource-alerts.yml: |
    groups:
    - name: resource_alerts
      interval: 1m
      rules:

      # Node Disk Pressure
      - alert: NodeDiskPressure
        expr: |
          kube_node_status_condition{condition="DiskPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          component: infrastructure
          team: platform
        annotations:
          summary: "Node {{ $labels.node }} has disk pressure"
          description: "Node {{ $labels.node }} is running low on disk space."
          action: "Clean up disk space or add storage capacity"

      # Node Memory Pressure
      - alert: NodeMemoryPressure
        expr: |
          kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          component: infrastructure
          team: platform
        annotations:
          summary: "Node {{ $labels.node }} has memory pressure"
          description: "Node {{ $labels.node }} is running low on memory."
          action: "Scale down pods or add node capacity"

      # PVC Usage High
      - alert: PVCUsageHigh
        expr: |
          (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
        for: 10m
        labels:
          severity: warning
          component: storage
          team: platform
        annotations:
          summary: "PVC {{ $labels.persistentvolumeclaim }} usage high"
          description: "PVC is {{ $value | humanizePercentage }} full."
          action: "Expand PVC or clean up data"

  # Business Logic Alerts
  business-alerts.yml: |
    groups:
    - name: business_alerts
      interval: 2m
      rules:

      # Matching Queue Backlog
      - alert: MatchingQueueBacklog
        expr: |
          matching_queue_length{namespace="flamoral"} > 1000
        for: 10m
        labels:
          severity: warning
          component: matching
          team: backend
        annotations:
          summary: "Matching queue has backlog"
          description: "Matching queue has {{ $value }} pending items. User experience degraded."
          dashboard_url: "https://grafana.flamoral.com/d/matching-dashboard"

      # High WebSocket Disconnection Rate
      - alert: HighWebSocketDisconnectionRate
        expr: |
          rate(websocket_disconnections_total{namespace="flamoral"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: realtime
          team: backend
        annotations:
          summary: "High WebSocket disconnection rate"
          description: "WebSocket disconnection rate is {{ $value }}/s. Real-time features affected."

      # Failed Payment Rate High
      - alert: HighPaymentFailureRate
        expr: |
          (sum(rate(payment_transactions_total{status="failed",namespace="flamoral"}[10m]))
          /
          sum(rate(payment_transactions_total{namespace="flamoral"}[10m]))) > 0.1
        for: 5m
        labels:
          severity: warning
          component: payments
          team: backend
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value | humanizePercentage }}. Revenue impact."
          runbook_url: "https://docs.flamoral.com/runbooks/payment-failures"

      # User Registration Rate Drop
      - alert: UserRegistrationRateDrop
        expr: |
          rate(user_registrations_total{namespace="flamoral"}[30m]) <
          (rate(user_registrations_total{namespace="flamoral"}[30m] offset 1d) * 0.5)
        for: 30m
        labels:
          severity: warning
          component: auth
          team: growth
        annotations:
          summary: "User registration rate dropped significantly"
          description: "Registration rate is 50% lower than yesterday. Investigate onboarding issues."

---
################################################################################
# AlertManager Configuration
################################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: 'YOUR_SLACK_WEBHOOK_URL'

    # Email configuration
    smtp_smarthost: 'smtp.gmail.com:587'
    smtp_from: 'alerts@flamoral.com'
    smtp_auth_username: 'alerts@flamoral.com'
    smtp_auth_password: 'YOUR_SMTP_PASSWORD'
    smtp_require_tls: true

    # Route configuration
    route:
      receiver: 'default'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
      # Critical alerts - immediate notification
      - match:
          severity: critical
        receiver: 'critical-alerts'
        group_wait: 10s
        repeat_interval: 1h
        routes:
        - match:
            component: database
          receiver: 'database-team'
        - match:
            component: security
          receiver: 'security-team'

      # Warning alerts - less urgent
      - match:
          severity: warning
        receiver: 'warning-alerts'
        group_wait: 5m
        repeat_interval: 12h

      # Business alerts - notify growth team
      - match:
          team: growth
        receiver: 'growth-team'
        repeat_interval: 24h

    # Inhibition rules - suppress alerts
    inhibit_rules:
    # Suppress warning alerts when critical alert is firing
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'service']

    # Suppress high error rate when service is down
    - source_match:
        alertname: 'ServiceDown'
      target_match:
        alertname: 'HighErrorRate'
      equal: ['service']

    # Suppress individual pod alerts when node is down
    - source_match:
        alertname: 'NodeDown'
      target_match_re:
        alertname: '^Pod.*'
      equal: ['node']

    # Receiver configurations
    receivers:
    # Default receiver
    - name: 'default'
      slack_configs:
      - channel: '#flamoral-alerts'
        title: 'Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

    # Critical alerts - multiple channels
    - name: 'critical-alerts'
      slack_configs:
      - channel: '#flamoral-critical'
        title: ':fire: CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          *Action:* {{ range .Alerts }}{{ .Annotations.action }}{{ end }}
        send_resolved: true
        color: 'danger'

      email_configs:
      - to: 'oncall@flamoral.com,platform-team@flamoral.com'
        headers:
          Subject: 'CRITICAL ALERT: {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: red;">Critical Alert</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          {{ range .Alerts }}
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          {{ if .Annotations.runbook_url }}
          <p><a href="{{ .Annotations.runbook_url }}">Runbook</a></p>
          {{ end }}
          {{ end }}

      pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        description: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

    # Warning alerts
    - name: 'warning-alerts'
      slack_configs:
      - channel: '#flamoral-warnings'
        title: ':warning: Warning: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'warning'

    # Database team
    - name: 'database-team'
      slack_configs:
      - channel: '#database-alerts'
        title: 'Database Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Dashboard:* {{ .Annotations.dashboard_url }}
          {{ end }}
        send_resolved: true

      email_configs:
      - to: 'database-team@flamoral.com'
        headers:
          Subject: 'Database Alert: {{ .GroupLabels.alertname }}'

    # Security team
    - name: 'security-team'
      slack_configs:
      - channel: '#security-alerts'
        title: ':lock: Security Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'danger'

      email_configs:
      - to: 'security-team@flamoral.com'
        headers:
          Subject: 'SECURITY ALERT: {{ .GroupLabels.alertname }}'

    # Growth team
    - name: 'growth-team'
      slack_configs:
      - channel: '#growth-metrics'
        title: 'Growth Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

      email_configs:
      - to: 'growth-team@flamoral.com'
        headers:
          Subject: 'Growth Metric Alert: {{ .GroupLabels.alertname }}'

---
################################################################################
# AlertManager Deployment
################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.26.0
        args:
        - '--config.file=/etc/alertmanager/alertmanager.yml'
        - '--storage.path=/alertmanager'
        - '--cluster.advertise-address=0.0.0.0:9093'
        ports:
        - containerPort: 9093
          name: alertmanager
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: storage
          mountPath: /alertmanager
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  ports:
  - port: 9093
    targetPort: 9093
    name: alertmanager
  selector:
    app: alertmanager

---
################################################################################
# Secret for Sensitive Credentials (Template - Update with real values)
################################################################################
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
type: Opaque
stringData:
  slack-webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  smtp-password: "YOUR_SMTP_PASSWORD"
  pagerduty-service-key: "YOUR_PAGERDUTY_SERVICE_KEY"
  # Add to ExternalSecrets in production

---
################################################################################
# Configuration Instructions
################################################################################
#
# BEFORE DEPLOYING:
#
# 1. Update Slack Configuration:
#    - Replace YOUR_SLACK_WEBHOOK_URL with your Slack incoming webhook
#    - Create channels: #flamoral-alerts, #flamoral-critical, #flamoral-warnings
#    - Invite relevant team members to each channel
#
# 2. Update Email Configuration:
#    - Replace SMTP credentials with your email provider details
#    - Update recipient email addresses
#    - Test email delivery
#
# 3. Update PagerDuty Configuration (Optional):
#    - Replace YOUR_PAGERDUTY_SERVICE_KEY with your PagerDuty integration key
#    - Configure escalation policies in PagerDuty
#
# 4. Store Secrets Securely:
#    - Use Kubernetes Secrets or External Secrets Operator
#    - Never commit real credentials to version control
#    - Rotate credentials regularly
#
# 5. Test Alert Configuration:
#    kubectl apply -f alerts-config.yaml
#
#    # Trigger a test alert
#    kubectl run test-alert --image=busybox --restart=Never -- /bin/sh -c "exit 1"
#
#    # Verify alert received in Slack/Email
#
# 6. Customize Alert Rules:
#    - Adjust thresholds based on your application's baseline
#    - Add application-specific metrics and alerts
#    - Review and update regularly based on incidents
#
################################################################################
