# Sentry Configuration for Flamoral Dating Platform
# This file contains configuration for self-hosted Sentry or Sentry.io integration

---
# Sentry Integration Configuration
# For use with Sentry.io (recommended for production)

sentry_config:
  # Organization and project settings
  organization: flamoral
  projects:
    - name: flamoral-mobile-ios
      platform: react-native
      dsn: "https://YOUR_DSN_KEY@o0000000.ingest.sentry.io/0000000"
      environment: production

    - name: flamoral-mobile-android
      platform: react-native
      dsn: "https://YOUR_DSN_KEY@o0000000.ingest.sentry.io/0000000"
      environment: production

    - name: flamoral-web
      platform: javascript-react
      dsn: "https://YOUR_DSN_KEY@o0000000.ingest.sentry.io/0000000"
      environment: production

    - name: flamoral-backend
      platform: node
      dsn: "https://YOUR_DSN_KEY@o0000000.ingest.sentry.io/0000000"
      environment: production

  # Global Sentry settings
  settings:
    # Sample rate for performance monitoring (0.0 to 1.0)
    traces_sample_rate: 0.1

    # Sample rate for error events (0.0 to 1.0)
    sample_rate: 1.0

    # Enable performance monitoring
    enable_tracing: true

    # Enable profiling
    profiles_sample_rate: 0.1

    # Maximum breadcrumbs
    max_breadcrumbs: 100

    # Attach stack traces
    attach_stacktrace: true

    # Send default PII (Personally Identifiable Information)
    send_default_pii: false

    # Enable auto session tracking
    auto_session_tracking: true

    # Release health tracking
    enable_release_health: true

  # Error filtering and processing
  before_send:
    # Ignore errors from these domains
    ignore_errors:
      - "Script error"
      - "ResizeObserver loop limit exceeded"
      - "Non-Error promise rejection captured"

    # Ignore errors from these URLs
    deny_urls:
      - "chrome-extension://"
      - "moz-extension://"
      - "safari-extension://"

    # Only capture errors from these URLs
    allow_urls:
      - "flamoral.com"
      - "*.flamoral.com"

  # Performance monitoring
  performance:
    # Transaction sample rate by operation
    transaction_sample_rates:
      api: 0.5
      pageload: 0.3
      navigation: 0.2

    # Slow transaction threshold (in milliseconds)
    slow_transaction_threshold: 3000

    # Enable automatic instrumentation
    auto_instrumentation:
      - http
      - express
      - postgres
      - redis
      - mongodb

  # Integration settings
  integrations:
    # React Native specific
    react_native:
      enable_native_nagger: false
      enable_auto_breadcrumbs: true
      enable_auto_performance: true

    # Express integration
    express:
      capture_request_body: true

    # Database integrations
    postgres:
      capture_queries: true

    redis:
      capture_commands: true

    mongodb:
      capture_commands: true

  # Release management
  releases:
    # Automatically create releases
    auto_create: true

    # Upload source maps
    upload_source_maps: true

    # Source map upload settings
    source_maps:
      include: ["./build/**/*.map"]
      url_prefix: "~/static/js"
      ignore: ["node_modules"]

    # Associate commits with releases
    commit_tracking: true

    # Deploy tracking
    deploy_tracking: true

  # Alerting rules
  alerts:
    - name: High Error Rate
      conditions:
        - type: error_count
          threshold: 100
          interval: 1h
      actions:
        - type: slack
          channel: "#flamoral-critical"
        - type: pagerduty
          service: flamoral-mobile

    - name: New Issue
      conditions:
        - type: first_seen
      actions:
        - type: slack
          channel: "#flamoral-alerts"

    - name: Regressed Issue
      conditions:
        - type: regression
      actions:
        - type: slack
          channel: "#flamoral-alerts"
        - type: email
          recipients:
            - dev-team@flamoral.com

  # User feedback
  user_feedback:
    enabled: true
    auto_inject: true
    button_text: "Report Feedback"
    form_title: "Report a Bug"
    submit_button_text: "Submit"
    success_message: "Thank you for your feedback!"

  # Privacy and compliance
  privacy:
    # Scrub sensitive data
    scrub_data: true

    # Fields to scrub
    scrub_fields:
      - password
      - credit_card
      - ssn
      - api_key
      - secret
      - token
      - authorization

    # IP address anonymization
    anonymize_ip: true

    # Data retention period (in days)
    retention_days: 90

---
# Kubernetes Secret for Sentry DSNs
apiVersion: v1
kind: Secret
metadata:
  name: sentry-dsns
  namespace: flamoral-dating
  labels:
    app.kubernetes.io/part-of: flamoral-monitoring
type: Opaque
stringData:
  # Replace these with actual Sentry DSNs
  ios-dsn: "https://YOUR_IOS_DSN_KEY@o0000000.ingest.sentry.io/0000000"
  android-dsn: "https://YOUR_ANDROID_DSN_KEY@o0000000.ingest.sentry.io/0000000"
  web-dsn: "https://YOUR_WEB_DSN_KEY@o0000000.ingest.sentry.io/0000000"
  backend-dsn: "https://YOUR_BACKEND_DSN_KEY@o0000000.ingest.sentry.io/0000000"
  auth-token: "YOUR_SENTRY_AUTH_TOKEN"

---
# ConfigMap for Sentry SDK configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentry-sdk-config
  namespace: flamoral-dating
  labels:
    app.kubernetes.io/part-of: flamoral-monitoring
data:
  # React Native configuration
  sentry-react-native.json: |
    {
      "dsn": "$(SENTRY_DSN)",
      "environment": "production",
      "release": "$(APP_VERSION)",
      "dist": "$(BUILD_NUMBER)",
      "tracesSampleRate": 0.1,
      "profilesSampleRate": 0.1,
      "attachStacktrace": true,
      "autoSessionTracking": true,
      "enableNativeCrashHandling": true,
      "enableNativeNagger": false,
      "enableAutoPerformanceTracking": true,
      "maxBreadcrumbs": 100,
      "beforeSend": "filterSensitiveData",
      "integrations": [
        {
          "name": "ReactNativeTracing",
          "options": {
            "routingInstrumentation": true,
            "tracingOrigins": ["api.flamoral.com", "*.flamoral.com"]
          }
        },
        {
          "name": "HttpClient"
        },
        {
          "name": "ReactNativeInfo"
        }
      ]
    }

  # Node.js backend configuration
  sentry-node.json: |
    {
      "dsn": "$(SENTRY_DSN)",
      "environment": "production",
      "release": "$(APP_VERSION)",
      "tracesSampleRate": 0.1,
      "profilesSampleRate": 0.1,
      "attachStacktrace": true,
      "integrations": [
        "Http",
        "Express",
        "Postgres",
        "Redis",
        "Mongo"
      ],
      "beforeSend": "filterSensitiveData",
      "beforeBreadcrumb": "filterSensitiveBreadcrumbs"
    }

---
# Sentry Release Automation (GitHub Actions / CI/CD)
# This is a template for CI/CD integration
sentry_release_automation: |
  # .github/workflows/sentry-release.yml
  name: Sentry Release

  on:
    push:
      tags:
        - 'v*'

  jobs:
    sentry-release:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
          with:
            fetch-depth: 0

        - name: Create Sentry release
          uses: getsentry/action-release@v1
          env:
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG: flamoral
            SENTRY_PROJECT: flamoral-mobile-ios
          with:
            environment: production
            version: ${{ github.ref_name }}
            sourcemaps: './build'
            set_commits: auto

        - name: Create Sentry deploy
          run: |
            sentry-cli deploys new \
              --env production \
              --release ${{ github.ref_name }}
