---
# ConfigMap for Alertmanager notification templates
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: flamoral-monitoring
data:
  default.tmpl: |
    {{ define "__subject" }}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.SortedPairs.Values | join " " }}
    {{ end }}

    {{ define "__text_alert_list" }}
    {{ range . }}
    *Alert:* {{ .Labels.alertname }}
    {{ if .Labels.severity }}*Severity:* `{{ .Labels.severity }}`{{ end }}
    {{ if .Labels.service }}*Service:* {{ .Labels.service }}{{ end }}
    {{ if .Labels.instance }}*Instance:* {{ .Labels.instance }}{{ end }}
    {{ if .Annotations.summary }}*Summary:* {{ .Annotations.summary }}{{ end }}
    {{ if .Annotations.description }}*Description:* {{ .Annotations.description }}{{ end }}
    {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
    {{ end }}
    {{ end }}

    {{ define "slack.default.title" }}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}
    {{ end }}

    {{ define "slack.default.text" }}
    {{ if gt (len .Alerts.Firing) 0 }}
    *Firing Alerts:*
    {{ template "__text_alert_list" .Alerts.Firing }}
    {{ end }}
    {{ if gt (len .Alerts.Resolved) 0 }}
    *Resolved Alerts:*
    {{ template "__text_alert_list" .Alerts.Resolved }}
    {{ end }}
    {{ end }}

    {{ define "slack.critical.text" }}
    :rotating_light: *CRITICAL ALERT* :rotating_light:

    {{ if gt (len .Alerts.Firing) 0 }}
    *Firing Critical Alerts ({{ .Alerts.Firing | len }}):*
    {{ range .Alerts.Firing }}
    ---
    *Alert:* `{{ .Labels.alertname }}`
    {{ if .Labels.service }}*Service:* `{{ .Labels.service }}`{{ end }}
    {{ if .Labels.severity }}*Severity:* `{{ .Labels.severity }}`{{ end }}
    {{ if .Labels.instance }}*Instance:* `{{ .Labels.instance }}`{{ end }}
    {{ if .Labels.component }}*Component:* `{{ .Labels.component }}`{{ end }}

    {{ if .Annotations.summary }}*Summary:* {{ .Annotations.summary }}{{ end }}
    {{ if .Annotations.description }}*Description:* {{ .Annotations.description }}{{ end }}

    *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
    {{ if .Annotations.runbook_url }}
    *Runbook:* {{ .Annotations.runbook_url }}
    {{ end }}
    {{ end }}
    {{ end }}

    {{ if gt (len .Alerts.Resolved) 0 }}
    :white_check_mark: *Resolved Critical Alerts ({{ .Alerts.Resolved | len }}):*
    {{ range .Alerts.Resolved }}
    ---
    *Alert:* `{{ .Labels.alertname }}`
    {{ if .Labels.service }}*Service:* `{{ .Labels.service }}`{{ end }}
    *Resolved:* {{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}
    *Duration:* {{ (.EndsAt.Sub .StartsAt).Round 1000000000 }}
    {{ end }}
    {{ end }}

    *View Details:*
    • <https://prometheus.flamoral.com/alerts|Prometheus Alerts>
    • <https://grafana.flamoral.com|Grafana Dashboards>
    {{ end }}

    {{ define "slack.warning.text" }}
    :warning: *WARNING ALERT*

    {{ if gt (len .Alerts.Firing) 0 }}
    *Active Warnings ({{ .Alerts.Firing | len }}):*
    {{ range .Alerts.Firing }}
    • *{{ .Labels.alertname }}*{{ if .Labels.service }} - {{ .Labels.service }}{{ end }}
      {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
    {{ end }}
    {{ end }}

    {{ if gt (len .Alerts.Resolved) 0 }}
    :white_check_mark: *Resolved Warnings ({{ .Alerts.Resolved | len }}):*
    {{ range .Alerts.Resolved }}
    • *{{ .Labels.alertname }}*{{ if .Labels.service }} - {{ .Labels.service }}{{ end }}
    {{ end }}
    {{ end }}
    {{ end }}

    {{ define "slack.database.text" }}
    :database: *DATABASE ALERT*

    {{ if gt (len .Alerts.Firing) 0 }}
    *Firing Database Alerts ({{ .Alerts.Firing | len }}):*
    {{ range .Alerts.Firing }}
    ---
    *Alert:* `{{ .Labels.alertname }}`
    {{ if .Labels.database_type }}*Database Type:* {{ .Labels.database_type }}{{ end }}
    {{ if .Labels.instance }}*Instance:* `{{ .Labels.instance }}`{{ end }}
    {{ if .Labels.severity }}*Severity:* `{{ .Labels.severity }}`{{ end }}

    {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ end }}
    {{ if .Annotations.description }}
    *Details:* {{ .Annotations.description }}
    {{ end }}

    *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
    {{ if .Annotations.runbook_url }}
    *Runbook:* {{ .Annotations.runbook_url }}
    {{ end }}
    {{ end }}
    {{ end }}

    {{ if gt (len .Alerts.Resolved) 0 }}
    :white_check_mark: *Resolved ({{ .Alerts.Resolved | len }}):*
    {{ range .Alerts.Resolved }}
    • {{ .Labels.alertname }} - Duration: {{ (.EndsAt.Sub .StartsAt).Round 1000000000 }}
    {{ end }}
    {{ end }}
    {{ end }}

    {{ define "slack.security.text" }}
    :shield: *SECURITY ALERT*

    {{ if gt (len .Alerts.Firing) 0 }}
    *Active Security Alerts ({{ .Alerts.Firing | len }}):*
    {{ range .Alerts.Firing }}
    ---
    *Alert:* `{{ .Labels.alertname }}`
    {{ if .Labels.severity }}*Severity:* `{{ .Labels.severity }}`{{ end }}
    {{ if .Labels.service }}*Service:* {{ .Labels.service }}{{ end }}
    {{ if .Labels.ip }}*IP Address:* `{{ .Labels.ip }}`{{ end }}

    {{ if .Annotations.summary }}*Summary:* {{ .Annotations.summary }}{{ end }}
    {{ if .Annotations.description }}*Description:* {{ .Annotations.description }}{{ end }}

    *Detected:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
    {{ if .Annotations.runbook_url }}
    *Response Procedure:* {{ .Annotations.runbook_url }}
    {{ end }}
    {{ end }}
    {{ end }}

    {{ if gt (len .Alerts.Resolved) 0 }}
    :white_check_mark: *Resolved Security Alerts ({{ .Alerts.Resolved | len }}):*
    {{ range .Alerts.Resolved }}
    • {{ .Labels.alertname }} - Duration: {{ (.EndsAt.Sub .StartsAt).Round 1000000000 }}
    {{ end }}
    {{ end }}

    *Important:* Review security logs and take appropriate action if needed.
    {{ end }}

    {{ define "pagerduty.default.description" }}
    {{ .GroupLabels.alertname }}{{ if .GroupLabels.service }}: {{ .GroupLabels.service }}{{ end }}
    {{ end }}

  email.tmpl: |
    {{ define "email.default.subject" }}
    [Flamoral {{ .Status | toUpper }}] {{ .GroupLabels.alertname }}
    {{ end }}

    {{ define "email.default.html" }}
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { background-color: {{ if eq .Status "firing" }}#d32f2f{{ else }}#388e3c{{ end }}; color: white; padding: 20px; border-radius: 5px; }
        .alert { border-left: 4px solid {{ if eq .Status "firing" }}#d32f2f{{ else }}#388e3c{{ end }}; padding: 15px; margin: 15px 0; background-color: #f5f5f5; }
        .label { display: inline-block; background-color: #e0e0e0; padding: 3px 8px; border-radius: 3px; margin: 2px; font-size: 12px; }
        .critical { border-left-color: #b71c1c; }
        .warning { border-left-color: #f57c00; }
        .info { border-left-color: #0288d1; }
        .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ccc; font-size: 12px; color: #666; }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="header">
          <h1>{{ if eq .Status "firing" }}🚨 Alert Firing{{ else }}✅ Alert Resolved{{ end }}</h1>
          <p>{{ .GroupLabels.alertname }}</p>
        </div>

        {{ if gt (len .Alerts.Firing) 0 }}
        <h2>Firing Alerts ({{ .Alerts.Firing | len }})</h2>
        {{ range .Alerts.Firing }}
        <div class="alert {{ .Labels.severity }}">
          <h3>{{ .Labels.alertname }}</h3>
          {{ if .Labels.severity }}<span class="label">Severity: {{ .Labels.severity }}</span>{{ end }}
          {{ if .Labels.service }}<span class="label">Service: {{ .Labels.service }}</span>{{ end }}
          {{ if .Labels.instance }}<span class="label">Instance: {{ .Labels.instance }}</span>{{ end }}

          {{ if .Annotations.summary }}<p><strong>Summary:</strong> {{ .Annotations.summary }}</p>{{ end }}
          {{ if .Annotations.description }}<p><strong>Description:</strong> {{ .Annotations.description }}</p>{{ end }}

          <p><strong>Started:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}</p>
          {{ if .Annotations.runbook_url }}<p><strong>Runbook:</strong> <a href="{{ .Annotations.runbook_url }}">{{ .Annotations.runbook_url }}</a></p>{{ end }}
        </div>
        {{ end }}
        {{ end }}

        {{ if gt (len .Alerts.Resolved) 0 }}
        <h2>Resolved Alerts ({{ .Alerts.Resolved | len }})</h2>
        {{ range .Alerts.Resolved }}
        <div class="alert">
          <h3>{{ .Labels.alertname }}</h3>
          {{ if .Labels.service }}<span class="label">Service: {{ .Labels.service }}</span>{{ end }}
          <p><strong>Duration:</strong> {{ (.EndsAt.Sub .StartsAt).Round 1000000000 }}</p>
          <p><strong>Resolved:</strong> {{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}</p>
        </div>
        {{ end }}
        {{ end }}

        <div class="footer">
          <p>
            <a href="https://prometheus.flamoral.com/alerts">View in Prometheus</a> |
            <a href="https://grafana.flamoral.com">View in Grafana</a> |
            <a href="https://alertmanager.flamoral.com">View in Alertmanager</a>
          </p>
          <p>Flamoral Dating Platform - Production Monitoring</p>
        </div>
      </div>
    </body>
    </html>
    {{ end }}
