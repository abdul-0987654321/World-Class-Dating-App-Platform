---
# PersistentVolumeClaim for Jaeger storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-storage
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: flamoral-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: premium-ssd
  resources:
    requests:
      storage: 100Gi

---
# Jaeger All-in-One Deployment (for production, use separate components)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: flamoral-monitoring
    app.kubernetes.io/version: "1.51.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: flamoral-monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "14269"
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.51.0
        imagePullPolicy: IfNotPresent
        env:
        - name: COLLECTOR_ZIPKIN_HOST_PORT
          value: ":9411"
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: SPAN_STORAGE_TYPE
          value: badger
        - name: BADGER_EPHEMERAL
          value: "false"
        - name: BADGER_DIRECTORY_VALUE
          value: /badger/data
        - name: BADGER_DIRECTORY_KEY
          value: /badger/key
        - name: METRICS_STORAGE_TYPE
          value: prometheus
        - name: PROMETHEUS_SERVER_URL
          value: http://prometheus:9090
        - name: QUERY_BASE_PATH
          value: /
        ports:
        - name: jaeger-agent
          containerPort: 6831
          protocol: UDP
        - name: jaeger-compact
          containerPort: 6832
          protocol: UDP
        - name: jaeger-binary
          containerPort: 6833
          protocol: UDP
        - name: jaeger-configs
          containerPort: 5778
          protocol: TCP
        - name: jaeger-ui
          containerPort: 16686
          protocol: TCP
        - name: jaeger-collector
          containerPort: 14268
          protocol: TCP
        - name: jaeger-health
          containerPort: 14269
          protocol: TCP
        - name: zipkin
          containerPort: 9411
          protocol: TCP
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: storage-volume
          mountPath: /badger
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: jaeger-storage

---
# Jaeger Agent Service (for accepting traces from applications)
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: flamoral-monitoring
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  ports:
  - name: jaeger-agent-compact
    port: 6831
    targetPort: 6831
    protocol: UDP
  - name: jaeger-agent-binary
    port: 6832
    targetPort: 6832
    protocol: UDP
  - name: jaeger-agent-configs
    port: 5778
    targetPort: 5778
    protocol: TCP
  selector:
    app: jaeger

---
# Jaeger Collector Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: flamoral-monitoring
    app.kubernetes.io/component: collector
spec:
  type: ClusterIP
  ports:
  - name: jaeger-collector-http
    port: 14268
    targetPort: 14268
    protocol: TCP
  - name: jaeger-collector-grpc
    port: 14250
    targetPort: 14250
    protocol: TCP
  - name: zipkin
    port: 9411
    targetPort: 9411
    protocol: TCP
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP
  - name: otlp-http
    port: 4318
    targetPort: 4318
    protocol: TCP
  selector:
    app: jaeger

---
# Jaeger Query Service (UI)
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: flamoral-monitoring
    app.kubernetes.io/component: query
spec:
  type: ClusterIP
  ports:
  - name: jaeger-ui
    port: 16686
    targetPort: 16686
    protocol: TCP
  selector:
    app: jaeger

---
# Jaeger Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: flamoral-monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: jaeger-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - Jaeger'
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - jaeger.flamoral.com
    secretName: jaeger-tls
  rules:
  - host: jaeger.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jaeger-query
            port:
              number: 16686

---
# Secret for Jaeger basic auth
apiVersion: v1
kind: Secret
metadata:
  name: jaeger-basic-auth
  namespace: monitoring
type: Opaque
data:
  # Default: admin:flamoral_jaeger_2025
  auth: YWRtaW46JGFwcjEkQWxOb2tUZ0UkSGRLM2NHQUJKVy5jdnhGYVJ5Ly9VLwo=

