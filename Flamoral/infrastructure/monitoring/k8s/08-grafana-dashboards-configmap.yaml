---
# ConfigMap for Grafana Dashboards
# This ConfigMap contains references to all dashboard files
# Dashboard JSON files should be mounted from the existing dashboard files
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: flamoral-monitoring
data:
  # Note: The actual dashboard JSON files are in
  # DatingPlatform/infrastructure/monitoring/grafana/dashboards/
  # They should be mounted as a volume or included in the ConfigMap

  # Dashboard list (reference only)
  dashboards.txt: |
    Available Dashboards:
    1. dating-app-overview.json - Overall platform health and metrics
    2. api-dashboard.json - API Gateway performance
    3. database-dashboard.json - Database metrics and health
    4. infrastructure-overview.json - Infrastructure and Kubernetes metrics
    5. redis-websocket-dashboard.json - Redis and WebSocket metrics
    6. services-overview-dashboard.json - All microservices overview
    7. payment-revenue-dashboard.json - Payment and revenue metrics
    8. error-tracking-dashboard.json - Error rates and tracking
    9. security-events-dashboard.json - Security events and alerts
    10. user-activity-dashboard.json - User engagement and activity

---
# Additional dashboard configuration files will be created separately
# and mounted from the grafana/dashboards directory
