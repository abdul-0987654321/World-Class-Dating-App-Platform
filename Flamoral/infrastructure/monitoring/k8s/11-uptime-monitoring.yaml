---
# Blackbox Exporter for external uptime monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/part-of: flamoral-monitoring
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []
          method: GET
          no_follow_redirects: false
          fail_if_ssl: false
          fail_if_not_ssl: true
          preferred_ip_protocol: "ip4"

      http_post_2xx:
        prober: http
        timeout: 5s
        http:
          method: POST
          valid_status_codes: []
          headers:
            Content-Type: application/json

      tcp_connect:
        prober: tcp
        timeout: 5s

      icmp:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: "ip4"

      dns_query:
        prober: dns
        timeout: 5s
        dns:
          query_name: "flamoral.com"
          query_type: "A"

---
# Blackbox Exporter Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/part-of: flamoral-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
        app.kubernetes.io/name: blackbox-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9115"
    spec:
      containers:
      - name: blackbox-exporter
        image: prom/blackbox-exporter:v0.24.0
        imagePullPolicy: IfNotPresent
        args:
          - --config.file=/config/blackbox.yml
        ports:
        - name: http
          containerPort: 9115
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 9115
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9115
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: blackbox-exporter-config

---
# Blackbox Exporter Service
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/part-of: flamoral-monitoring
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9115
    targetPort: 9115
    protocol: TCP
  selector:
    app: blackbox-exporter

---
# Additional Prometheus scrape config for blackbox exporter
# Add this to prometheus ConfigMap under scrape_configs
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-blackbox-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: flamoral-monitoring
data:
  blackbox-scrape-config.yml: |
    # HTTP probes
    - job_name: 'blackbox-http'
      metrics_path: /probe
      params:
        module: [http_2xx]
      static_configs:
        - targets:
            # Main domains
            - https://flamoral.com
            - https://www.flamoral.com
            - https://api.flamoral.com

            # API endpoints
            - https://api.flamoral.com/health
            - https://api.flamoral.com/v1/health

            # Auth service
            - https://auth.flamoral.com/health

            # User service
            - https://users.flamoral.com/health

            # Matching service
            - https://matching.flamoral.com/health

            # Messaging service
            - https://messaging.flamoral.com/health

            # Media service
            - https://media.flamoral.com/health

            # Payment service
            - https://payments.flamoral.com/health

            # Monitoring endpoints
            - https://grafana.flamoral.com
            - https://prometheus.flamoral.com/-/healthy

      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: blackbox-exporter:9115

    # TCP probes
    - job_name: 'blackbox-tcp'
      metrics_path: /probe
      params:
        module: [tcp_connect]
      static_configs:
        - targets:
            - postgres.flamoral-dating.svc.cluster.local:5432
            - redis.flamoral-dating.svc.cluster.local:6379
            - mongodb.flamoral-dating.svc.cluster.local:27017
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: blackbox-exporter:9115

    # DNS probes
    - job_name: 'blackbox-dns'
      metrics_path: /probe
      params:
        module: [dns_query]
      static_configs:
        - targets:
            - flamoral.com
            - api.flamoral.com
            - auth.flamoral.com
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: blackbox-exporter:9115

---
# Additional alert rules for uptime monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-uptime-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: flamoral-monitoring
data:
  uptime-alerts.yml: |
    groups:
    - name: uptime
      interval: 30s
      rules:
      - alert: EndpointDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
          component: uptime
        annotations:
          summary: "Endpoint {{ $labels.instance }} is down"
          description: "Endpoint {{ $labels.instance }} has been down for more than 2 minutes."
          runbook_url: "https://runbooks.flamoral.com/EndpointDown"

      - alert: EndpointSlowResponse
        expr: probe_duration_seconds > 3
        for: 5m
        labels:
          severity: warning
          component: uptime
        annotations:
          summary: "Endpoint {{ $labels.instance }} is slow"
          description: "Endpoint {{ $labels.instance }} response time is {{ $value }}s."

      - alert: SSLCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 30
        for: 1h
        labels:
          severity: warning
          component: uptime
        annotations:
          summary: "SSL certificate expiring soon for {{ $labels.instance }}"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

      - alert: SSLCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
        for: 1h
        labels:
          severity: critical
          component: uptime
        annotations:
          summary: "SSL certificate expiring very soon for {{ $labels.instance }}"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}!"
          runbook_url: "https://runbooks.flamoral.com/SSLCertificateExpiring"

      - alert: HighHTTPErrorRate
        expr: (sum(rate(probe_http_status_code{code=~"5.."}[5m])) / sum(rate(probe_http_status_code[5m]))) * 100 > 5
        for: 5m
        labels:
          severity: critical
          component: uptime
        annotations:
          summary: "High HTTP error rate detected"
          description: "{{ $value }}% of HTTP probes are returning 5xx errors."
