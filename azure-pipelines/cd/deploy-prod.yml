# CD Pipeline - Deploy to Production
# Deploys all services to production with strict approval gates and rollback capabilities

trigger: none

pr: none

resources:
  pipelines:
    - pipeline: docker-build
      source: 'docker-build'
      trigger: none

variables:
  - group: flamoral-prod-variables
  - name: environment
    value: 'prod'
  - name: namespace
    value: 'flamoral-prod'
  - name: kubernetesServiceConnection
    value: 'flamoral-aks-prod'
  - name: containerRegistryUrl
    value: 'flamoralacr.azurecr.io'
  - name: imagePrefix
    value: 'flamoral'
  - name: imageTag
    value: '$(resources.pipeline.docker-build.runID)'
  - name: rollbackEnabled
    value: true

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: PreProductionChecklist
    displayName: 'Pre-Production Checklist'
    jobs:
      - job: VerifyPrerequisites
        displayName: 'Verify Prerequisites'
        steps:
          - task: Bash@3
            displayName: 'Check Docker images exist'
            inputs:
              targetType: 'inline'
              script: |
                echo "Verifying Docker images in ACR..."
                az acr login --name flamoralacr

                SERVICES=(
                  "auth-service" "user-service" "api-gateway"
                  "matching-service" "messaging-service" "payment-service"
                  "notification-service" "media-service" "moderation-service"
                  "analytics-service" "advertising-service" "realtime-service"
                  "nlp-service" "recommendation-service" "fraud-detection" "photo-analysis"
                )

                for service in "${SERVICES[@]}"; do
                  echo "Checking $(imagePrefix)/$service:$(imageTag)..."
                  az acr repository show-tags --name flamoralacr \
                    --repository $(imagePrefix)/$service --output table | grep $(imageTag) || exit 1
                done

                echo "All Docker images verified!"

          - task: Bash@3
            displayName: 'Verify test environment status'
            inputs:
              targetType: 'inline'
              script: |
                echo "Checking test environment health..."
                curl -f https://api-test.flamoral.com/health || exit 1
                echo "Test environment is healthy"

          - task: Bash@3
            displayName: 'Check for active incidents'
            inputs:
              targetType: 'inline'
              script: |
                echo "Checking for active incidents..."
                # This would integrate with your incident management system
                # For now, just a placeholder
                echo "No active incidents found"

  - stage: ManagerApproval
    displayName: 'Manager Approval'
    dependsOn: PreProductionChecklist
    jobs:
      - job: WaitForManagerApproval
        displayName: 'Wait for Engineering Manager Approval'
        pool: server
        timeoutInMinutes: 4320 # 3 days
        steps:
          - task: ManualValidation@0
            displayName: 'Engineering Manager Approval'
            inputs:
              notifyUsers: |
                engineering-manager@flamoral.com
                cto@flamoral.com
              instructions: |
                Please review the following before approving production deployment:

                1. All tests passed in Test environment
                2. No critical bugs reported
                3. Performance metrics are acceptable
                4. Security scans completed
                5. Business stakeholders notified

                Build: $(Build.BuildNumber)
                Image Tag: $(imageTag)
              onTimeout: 'reject'

  - stage: BackupProduction
    displayName: 'Backup Production Data'
    dependsOn: ManagerApproval
    jobs:
      - job: CreateProductionBackup
        displayName: 'Create Production Backups'
        steps:
          - task: AzureCLI@2
            displayName: 'Backup Production PostgreSQL'
            inputs:
              azureSubscription: 'flamoral-azure-subscription'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Creating PostgreSQL backup for Production..."
                TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                BACKUP_NAME="prod-pre-deploy-backup-$TIMESTAMP"

                az postgres server backup create \
                  --resource-group flamoral-prod-rg \
                  --server-name flamoral-postgres-prod \
                  --backup-name $BACKUP_NAME

                echo "##vso[task.setvariable variable=postgresBackupName;isOutput=true]$BACKUP_NAME"
                echo "PostgreSQL backup created: $BACKUP_NAME"

          - task: AzureCLI@2
            displayName: 'Backup Azure Storage'
            inputs:
              azureSubscription: 'flamoral-azure-subscription'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Creating snapshot of Azure Storage..."
                TIMESTAMP=$(date +%Y%m%d_%H%M%S)

                # Create blob snapshots
                az storage blob snapshot-all \
                  --account-name flamoralstorageprod \
                  --container-name user-media

                echo "Azure Storage snapshot created: $TIMESTAMP"

          - task: Bash@3
            displayName: 'Export current Kubernetes state'
            inputs:
              targetType: 'inline'
              script: |
                echo "Exporting current Kubernetes deployment state..."
                TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                BACKUP_DIR="k8s-backup-$TIMESTAMP"

                mkdir -p $BACKUP_DIR

                # Export all deployments
                kubectl get deployments -n $(namespace) -o yaml > $BACKUP_DIR/deployments.yaml
                kubectl get services -n $(namespace) -o yaml > $BACKUP_DIR/services.yaml
                kubectl get configmaps -n $(namespace) -o yaml > $BACKUP_DIR/configmaps.yaml
                kubectl get secrets -n $(namespace) -o yaml > $BACKUP_DIR/secrets.yaml

                tar -czf k8s-backup-$TIMESTAMP.tar.gz $BACKUP_DIR

                echo "Kubernetes state backed up to k8s-backup-$TIMESTAMP.tar.gz"

          - task: PublishBuildArtifacts@1
            displayName: 'Publish backup artifacts'
            inputs:
              PathtoPublish: 'k8s-backup-*.tar.gz'
              ArtifactName: 'production-backups'

  - stage: MaintenanceMode
    displayName: 'Enable Maintenance Mode'
    dependsOn: BackupProduction
    jobs:
      - deployment: EnableMaintenanceMode
        displayName: 'Enable Maintenance Mode'
        environment: 'flamoral-prod-maintenance'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: Kubernetes@1
                  displayName: 'Scale maintenance page'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    command: 'scale'
                    arguments: 'deployment/maintenance-page --replicas=3'

                - task: Bash@3
                  displayName: 'Update ingress to maintenance mode'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "Redirecting traffic to maintenance page..."
                      kubectl apply -f k8s/ingress/maintenance-ingress.yaml -n $(namespace)
                      sleep 30 # Wait for ingress to update

  - stage: DeployInfrastructure
    displayName: 'Deploy Infrastructure Services'
    dependsOn: MaintenanceMode
    jobs:
      - deployment: UpdateDatabases
        displayName: 'Update Database Services'
        environment: 'flamoral-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: KubernetesManifest@0
                  displayName: 'Update PostgreSQL configuration'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    manifests: |
                      k8s/base/postgres-configmap.yaml

                - task: KubernetesManifest@0
                  displayName: 'Update Redis configuration'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    manifests: |
                      k8s/base/redis-configmap.yaml

  - stage: DeployBlueGreen
    displayName: 'Blue-Green Deployment'
    dependsOn: DeployInfrastructure
    jobs:
      - deployment: DeployGreenEnvironment
        displayName: 'Deploy to Green Environment'
        environment: 'flamoral-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # Deploy all services to green environment
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'auth-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/auth-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'user-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/user-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'api-gateway-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/api-gateway'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'matching-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/matching-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'messaging-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/messaging-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'payment-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/payment-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'notification-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/notification-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'media-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/media-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'moderation-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/moderation-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'analytics-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/analytics-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'advertising-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/advertising-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'realtime-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/realtime-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'nlp-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/nlp-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'recommendation-service-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/recommendation-service'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'fraud-detection-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/fraud-detection'
                    imageTag: $(imageTag)

                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'photo-analysis-green'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/photo-analysis'
                    imageTag: $(imageTag)

  - stage: SmokeTestGreen
    displayName: 'Smoke Test Green Environment'
    dependsOn: DeployBlueGreen
    jobs:
      - job: TestGreenEnvironment
        displayName: 'Test Green Environment'
        steps:
          - task: Bash@3
            displayName: 'Health check green services'
            inputs:
              targetType: 'inline'
              script: |
                echo "Testing green environment endpoints..."

                # Internal testing of green environment
                GREEN_URL="http://api-gateway-green.$(namespace).svc.cluster.local"

                # Test critical endpoints
                curl -f $GREEN_URL/health || exit 1
                curl -f $GREEN_URL/api/auth/health || exit 1
                curl -f $GREEN_URL/api/users/health || exit 1

                echo "All green environment health checks passed!"

          - task: Bash@3
            displayName: 'Performance baseline check'
            inputs:
              targetType: 'inline'
              script: |
                echo "Running performance checks on green environment..."

                # Run quick load test
                k6 run --duration 60s --vus 10 tests/performance/smoke-test.js

                echo "Performance baseline check completed"

  - stage: TrafficSwitchApproval
    displayName: 'Approve Traffic Switch'
    dependsOn: SmokeTestGreen
    jobs:
      - job: WaitForTrafficSwitchApproval
        displayName: 'Approve Traffic Switch to Green'
        pool: server
        timeoutInMinutes: 60
        steps:
          - task: ManualValidation@0
            displayName: 'Approve Traffic Switch'
            inputs:
              notifyUsers: |
                sre@flamoral.com
                engineering-manager@flamoral.com
              instructions: |
                Green environment is ready. Approve to switch traffic.

                Smoke tests: Passed
                Performance tests: Passed

                This will switch production traffic to the new version.
              onTimeout: 'reject'

  - stage: SwitchTraffic
    displayName: 'Switch Traffic to Green'
    dependsOn: TrafficSwitchApproval
    jobs:
      - deployment: SwitchToGreen
        displayName: 'Switch Traffic to Green Environment'
        environment: 'flamoral-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: Kubernetes@1
                  displayName: 'Update service selectors to green'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    command: 'apply'
                    arguments: '-f k8s/service-mesh/green-traffic-switch.yaml'

                - task: Bash@3
                  displayName: 'Disable maintenance mode'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "Disabling maintenance mode..."
                      kubectl apply -f k8s/ingress/production-ingress.yaml -n $(namespace)
                      kubectl scale deployment/maintenance-page --replicas=0 -n $(namespace)

                - task: Bash@3
                  displayName: 'Gradual traffic shift'
                  inputs:
                    targetType: 'inline'
                    script: |
                      echo "Starting gradual traffic shift..."

                      # 10% traffic to green
                      kubectl apply -f k8s/service-mesh/canary-10.yaml
                      echo "10% traffic shifted. Waiting 5 minutes..."
                      sleep 300

                      # 50% traffic to green
                      kubectl apply -f k8s/service-mesh/canary-50.yaml
                      echo "50% traffic shifted. Waiting 5 minutes..."
                      sleep 300

                      # 100% traffic to green
                      kubectl apply -f k8s/service-mesh/canary-100.yaml
                      echo "100% traffic shifted to green environment!"

  - stage: MonitorProduction
    displayName: 'Monitor Production'
    dependsOn: SwitchTraffic
    jobs:
      - job: MonitorMetrics
        displayName: 'Monitor Production Metrics'
        steps:
          - task: Bash@3
            displayName: 'Monitor error rates'
            inputs:
              targetType: 'inline'
              script: |
                echo "Monitoring production metrics for 15 minutes..."

                for i in {1..15}; do
                  echo "Check $i/15..."

                  # Query Prometheus for error rates
                  ERROR_RATE=$(curl -s 'http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=rate(http_requests_total{status=~"5.."}[5m])' | jq '.data.result[0].value[1]')

                  if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
                    echo "Error rate too high: $ERROR_RATE"
                    exit 1
                  fi

                  sleep 60
                done

                echo "Production metrics stable!"

  - stage: CleanupBlueEnvironment
    displayName: 'Cleanup Blue Environment'
    dependsOn: MonitorProduction
    jobs:
      - job: ScaleDownBlue
        displayName: 'Scale Down Blue Environment'
        steps:
          - task: Kubernetes@1
            displayName: 'Scale down blue deployments'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: $(kubernetesServiceConnection)
              namespace: $(namespace)
              command: 'scale'
              arguments: 'deployment --selector=version=blue --replicas=0'

          - task: Bash@3
            displayName: 'Keep blue for rollback'
            inputs:
              targetType: 'inline'
              script: |
                echo "Blue environment scaled to 0 but kept for potential rollback"
                echo "Blue deployments will be removed after 24 hours if no issues"

  - stage: ProductionSummary
    displayName: 'Production Deployment Summary'
    dependsOn: CleanupBlueEnvironment
    condition: always()
    jobs:
      - job: GenerateReport
        displayName: 'Generate Production Report'
        steps:
          - task: Bash@3
            displayName: 'Production deployment summary'
            inputs:
              targetType: 'inline'
              script: |
                echo "==========================================="
                echo "PRODUCTION DEPLOYMENT SUMMARY"
                echo "==========================================="
                echo "Environment: Production"
                echo "Date: $(date)"
                echo "Build: $(Build.BuildNumber)"
                echo "Image Tag: $(imageTag)"
                echo "==========================================="
                echo ""
                echo "Deployment Strategy: Blue-Green"
                echo "Traffic Switch: Gradual (10% -> 50% -> 100%)"
                echo "Rollback Available: Yes (Blue environment ready)"
                echo ""
                echo "Services Deployed: 16"
                echo "  - Core Services: 3"
                echo "  - Business Services: 9"
                echo "  - Realtime Services: 1"
                echo "  - AI Services: 4"
                echo ""
                echo "Post-deployment monitoring: 15 minutes"
                echo "Status: SUCCESSFUL"
                echo ""
                echo "Production URL: https://api.flamoral.com"
                echo "==========================================="

          - task: AzureCLI@2
            displayName: 'Send deployment notification'
            inputs:
              azureSubscription: 'flamoral-azure-subscription'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Send notification to Teams/Slack
                echo "Sending deployment notification..."

                # This would integrate with your notification system
                # Placeholder for actual notification logic

          - task: SendEmail@1
            displayName: 'Email deployment report'
            inputs:
              to: 'engineering@flamoral.com;operations@flamoral.com;executives@flamoral.com'
              subject: 'Production Deployment Completed - Build $(Build.BuildNumber)'
              body: |
                Production deployment has been successfully completed.

                Build: $(Build.BuildNumber)
                Image Tag: $(imageTag)
                Deployment Time: $(date)

                All 16 services deployed using blue-green strategy.
                Traffic successfully switched with gradual rollout.
                Production monitoring shows stable metrics.

                Production URL: https://api.flamoral.com
