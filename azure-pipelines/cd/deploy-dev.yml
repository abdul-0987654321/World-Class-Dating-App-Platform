      - deployment: DeployAdvertisingService
        displayName: 'Deploy Advertising Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'advertising-service'
                    environment: $(environment)
