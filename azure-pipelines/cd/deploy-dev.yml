  - stage: DeployRealtimeServices
    displayName: 'Deploy Realtime Services'
    dependsOn: DeployBusinessServices
    jobs:
      - deployment: DeployRealtimeService
        displayName: 'Deploy Realtime Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
