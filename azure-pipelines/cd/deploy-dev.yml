      - deployment: DeployModerationService
        displayName: 'Deploy Moderation Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'moderation-service'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/moderation-service'
                    imageTag: $(imageTag)

      - deployment: DeployAnalyticsService
        displayName: 'Deploy Analytics Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'analytics-service'
