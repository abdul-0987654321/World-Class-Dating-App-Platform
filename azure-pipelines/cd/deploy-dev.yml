# CD Pipeline - Deploy to Development
# Deploys all services to the development environment

trigger: none

pr: none

resources:
  pipelines:
    - pipeline: docker-build
      source: 'docker-build'
      trigger:
        branches:
          include:
            - develop

variables:
  - group: flamoral-dev-variables
  - name: environment
    value: 'dev'
  - name: namespace
    value: 'flamoral-dev'
  - name: kubernetesServiceConnection
    value: 'flamoral-aks-dev'
  - name: containerRegistryUrl
    value: 'flamoralacr.azurecr.io'
  - name: imagePrefix
    value: 'flamoral'
  - name: imageTag
    value: '$(resources.pipeline.docker-build.runID)'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: DeployInfrastructure
    displayName: 'Deploy Infrastructure Services'
    jobs:
      - deployment: DeployDatabase
        displayName: 'Deploy Databases'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: KubernetesManifest@0
                  displayName: 'Deploy PostgreSQL'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    manifests: |
                      k8s/base/postgres-deployment.yaml
                      k8s/base/postgres-service.yaml

                - task: KubernetesManifest@0
                  displayName: 'Deploy Redis'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    manifests: |
                      k8s/base/redis-deployment.yaml
                      k8s/base/redis-service.yaml

                - task: KubernetesManifest@0
                  displayName: 'Deploy MongoDB'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    manifests: |
                      k8s/base/mongodb-deployment.yaml
                      k8s/base/mongodb-service.yaml

  - stage: DeployCoreServices
    displayName: 'Deploy Core Services'
    dependsOn: DeployInfrastructure
    jobs:
      - deployment: DeployAuthService
        displayName: 'Deploy Auth Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'auth-service'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/auth-service'
                    imageTag: $(imageTag)

      - deployment: DeployUserService
        displayName: 'Deploy User Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'user-service'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/user-service'
                    imageTag: $(imageTag)

      - deployment: DeployApiGateway
        displayName: 'Deploy API Gateway'
        environment: 'flamoral-dev'
        dependsOn:
          - DeployAuthService
          - DeployUserService
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'api-gateway'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/api-gateway'
                    imageTag: $(imageTag)

  - stage: DeployBusinessServices
    displayName: 'Deploy Business Services'
    dependsOn: DeployCoreServices
    jobs:
      - deployment: DeployMatchingService
        displayName: 'Deploy Matching Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'matching-service'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/matching-service'
                    imageTag: $(imageTag)

      - deployment: DeployMessagingService
        displayName: 'Deploy Messaging Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'messaging-service'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/messaging-service'
                    imageTag: $(imageTag)

      - deployment: DeployPaymentService
        displayName: 'Deploy Payment Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'payment-service'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/payment-service'
                    imageTag: $(imageTag)

      - deployment: DeployNotificationService
        displayName: 'Deploy Notification Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
