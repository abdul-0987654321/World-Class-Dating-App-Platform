      - deployment: DeployMediaService
        displayName: 'Deploy Media Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
