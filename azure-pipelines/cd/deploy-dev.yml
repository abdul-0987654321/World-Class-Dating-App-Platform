      - deployment: DeployFraudDetection
        displayName: 'Deploy Fraud Detection'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'fraud-detection'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/fraud-detection'
                    imageTag: $(imageTag)

      - deployment: DeployPhotoAnalysis
        displayName: 'Deploy Photo Analysis'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'photo-analysis'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/photo-analysis'
                    imageTag: $(imageTag)

  - stage: PostDeploymentTests
    displayName: 'Post-Deployment Tests'
    dependsOn:
      - DeployCoreServices
      - DeployBusinessServices
      - DeployRealtimeServices
      - DeployAIServices
    jobs:
      - job: SmokeTests
        displayName: 'Run Smoke Tests'
        steps:
          - task: Bash@3
            displayName: 'Health check all services'
            inputs:
              targetType: 'inline'
              script: |
                echo "Running smoke tests..."

                # Get service endpoints
                GATEWAY_URL="https://api-dev.flamoral.com"

                # Test API Gateway
                echo "Testing API Gateway..."
                curl -f $GATEWAY_URL/health || exit 1

                # Test Auth Service
                echo "Testing Auth Service..."
                curl -f $GATEWAY_URL/api/auth/health || exit 1

                # Test User Service
                echo "Testing User Service..."
                curl -f $GATEWAY_URL/api/users/health || exit 1

                echo "All smoke tests passed!"

          - task: Bash@3
            displayName: 'Performance baseline check'
            inputs:
              targetType: 'inline'
              script: |
                echo "Checking response times..."

                GATEWAY_URL="https://api-dev.flamoral.com"

                # Measure API Gateway response time
                time curl -f $GATEWAY_URL/health

                echo "Performance check completed"

  - stage: DeploymentSummary
    displayName: 'Deployment Summary'
    dependsOn: PostDeploymentTests
    condition: always()
    jobs:
      - job: GenerateReport
        displayName: 'Generate Deployment Report'
        steps:
          - task: Bash@3
            displayName: 'Deployment summary'
            inputs:
              targetType: 'inline'
              script: |
                echo "==================================="
                echo "Development Deployment Summary"
                echo "==================================="
                echo "Environment: $(environment)"
                echo "Namespace: $(namespace)"
                echo "Image Tag: $(imageTag)"
                echo "Date: $(date)"
                echo "==================================="
                echo ""
                echo "Services deployed:"
                echo "  - API Gateway"
                echo "  - Auth Service"
                echo "  - User Service"
                echo "  - Matching Service"
                echo "  - Messaging Service"
                echo "  - Payment Service"
                echo "  - Notification Service"
                echo "  - Media Service"
                echo "  - Moderation Service"
                echo "  - Analytics Service"
                echo "  - Advertising Service"
                echo "  - Realtime Service"
                echo "  - NLP Service"
                echo "  - Recommendation Service"
                echo "  - Fraud Detection"
                echo "  - Photo Analysis"
                echo ""
                echo "Total: 16 services deployed to Dev"
                echo "==================================="
