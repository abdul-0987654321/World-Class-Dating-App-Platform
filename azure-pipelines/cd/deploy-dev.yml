  - stage: DeployAIServices
    displayName: 'Deploy AI Services'
    dependsOn: DeployBusinessServices
    jobs:
      - deployment: DeployNLPService
        displayName: 'Deploy NLP Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'nlp-service'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/nlp-service'
                    imageTag: $(imageTag)

      - deployment: DeployRecommendationService
        displayName: 'Deploy Recommendation Service'
        environment: 'flamoral-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'recommendation-service'
                    environment: $(environment)
                    namespace: $(namespace)
