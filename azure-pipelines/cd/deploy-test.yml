# CD Pipeline - Deploy to Test/Staging
# Deploys all services to the test environment with manual approval

trigger: none

pr: none

resources:
  pipelines:
    - pipeline: docker-build
      source: 'docker-build'
      trigger:
        branches:
          include:
            - main

variables:
  - group: flamoral-test-variables
  - name: environment
    value: 'test'
  - name: namespace
    value: 'flamoral-test'
  - name: kubernetesServiceConnection
    value: 'flamoral-aks-test'
  - name: containerRegistryUrl
    value: 'flamoralacr.azurecr.io'
  - name: imagePrefix
    value: 'flamoral'
  - name: imageTag
    value: '$(resources.pipeline.docker-build.runID)'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: PreDeploymentApproval
    displayName: 'Pre-Deployment Approval'
    jobs:
      - job: WaitForApproval
        displayName: 'Wait for Manual Approval'
        pool: server
        timeoutInMinutes: 1440 # 24 hours
        steps:
          - task: ManualValidation@0
            displayName: 'Approve Test Deployment'
            inputs:
              notifyUsers: |
                devops@flamoral.com
                engineering@flamoral.com
              instructions: 'Please review the changes and approve deployment to Test environment'
              onTimeout: 'reject'

  - stage: BackupDatabase
    displayName: 'Backup Databases'
    dependsOn: PreDeploymentApproval
    jobs:
      - job: CreateBackup
        displayName: 'Create Database Backups'
        steps:
          - task: AzureCLI@2
            displayName: 'Backup PostgreSQL'
            inputs:
              azureSubscription: 'flamoral-azure-subscription'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Creating PostgreSQL backup for Test environment..."
                TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                BACKUP_NAME="test-backup-$TIMESTAMP"

                # Backup using Azure PostgreSQL built-in backup
                az postgres server backup create \
                  --resource-group flamoral-rg \
                  --server-name flamoral-postgres-test \
                  --backup-name $BACKUP_NAME

                echo "Backup created: $BACKUP_NAME"

          - task: Bash@3
            displayName: 'Backup MongoDB'
            inputs:
              targetType: 'inline'
              script: |
                echo "Creating MongoDB backup..."
                TIMESTAMP=$(date +%Y%m%d_%H%M%S)

                # Export MongoDB data
                kubectl exec -n $(namespace) deployment/mongodb -- \
                  mongodump --out /tmp/backup-$TIMESTAMP

                echo "MongoDB backup created"

  - stage: DeployInfrastructure
    displayName: 'Deploy Infrastructure Services'
    dependsOn: BackupDatabase
    jobs:
      - deployment: DeployDatabase
        displayName: 'Deploy Databases'
        environment: 'flamoral-test'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: KubernetesManifest@0
                  displayName: 'Deploy PostgreSQL'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    manifests: |
                      k8s/base/postgres-deployment.yaml
                      k8s/base/postgres-service.yaml

                - task: KubernetesManifest@0
                  displayName: 'Deploy Redis'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    manifests: |
                      k8s/base/redis-deployment.yaml
                      k8s/base/redis-service.yaml

                - task: KubernetesManifest@0
                  displayName: 'Deploy MongoDB'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    manifests: |
                      k8s/base/mongodb-deployment.yaml
                      k8s/base/mongodb-service.yaml

  - stage: DeployCoreServices
    displayName: 'Deploy Core Services'
    dependsOn: DeployInfrastructure
    jobs:
      - deployment: DeployAuthService
        displayName: 'Deploy Auth Service'
        environment: 'flamoral-test'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'auth-service'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/auth-service'
                    imageTag: $(imageTag)
                    waitForRollout: true

      - deployment: DeployUserService
        displayName: 'Deploy User Service'
        environment: 'flamoral-test'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'user-service'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/user-service'
                    imageTag: $(imageTag)
                    waitForRollout: true

      - deployment: DeployApiGateway
        displayName: 'Deploy API Gateway'
        environment: 'flamoral-test'
        dependsOn:
          - DeployAuthService
          - DeployUserService
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
                    serviceName: 'api-gateway'
                    environment: $(environment)
                    namespace: $(namespace)
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    imageRepository: '$(imagePrefix)/api-gateway'
                    imageTag: $(imageTag)
                    waitForRollout: true
                    healthCheckUrl: 'https://api-test.flamoral.com/health'

  - stage: DeployBusinessServices
    displayName: 'Deploy Business Services'
    dependsOn: DeployCoreServices
    jobs:
      - deployment: DeployMatchingService
        displayName: 'Deploy Matching Service'
        environment: 'flamoral-test'
