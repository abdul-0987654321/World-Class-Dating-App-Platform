      - deployment: DeployAnalyticsService
        displayName: 'Deploy Analytics Service'
        environment: 'flamoral-test'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../templates/k8s-deploy-template.yml
                  parameters:
