  - stage: IntegrationTests
    displayName: 'Integration Tests'
    dependsOn:
      - DeployCoreServices
      - DeployBusinessServices
      - DeployRealtimeServices
      - DeployAIServices
    jobs:
      - job: RunIntegrationTests
        displayName: 'Run Integration Tests'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '20.x'

          - script: |
              npm ci
              npm run test:integration
            displayName: 'Execute integration tests'
            env:
              TEST_ENV: test
              API_URL: https://api-test.flamoral.com

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results.xml'
              testRunTitle: 'Test Environment Integration Tests'

  - stage: PerformanceTests
    displayName: 'Performance Tests'
    dependsOn: IntegrationTests
    jobs:
      - job: LoadTesting
        displayName: 'Run Load Tests'
        steps:
          - task: Bash@3
            displayName: 'Install k6'
            inputs:
              targetType: 'inline'
              script: |
                sudo gpg -k
                sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
                echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
                sudo apt-get update
                sudo apt-get install k6

          - task: Bash@3
            displayName: 'Run performance tests'
            inputs:
              targetType: 'inline'
              script: |
                k6 run --out cloud tests/performance/load-test.js
            env:
              K6_CLOUD_TOKEN: $(k6CloudToken)

  - stage: SecurityTests
    displayName: 'Security Tests'
    dependsOn: IntegrationTests
    jobs:
      - job: PenetrationTesting
        displayName: 'Run Security Tests'
        steps:
          - task: Bash@3
            displayName: 'OWASP ZAP scan'
            inputs:
              targetType: 'inline'
              script: |
                docker run -t owasp/zap2docker-stable zap-baseline.py \
                  -t https://api-test.flamoral.com \
                  -r zap-report.html
            continueOnError: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish security scan results'
            inputs:
              PathtoPublish: 'zap-report.html'
              ArtifactName: 'security-reports'

  - stage: DeploymentSummary
    displayName: 'Deployment Summary'
    dependsOn:
      - IntegrationTests
      - PerformanceTests
      - SecurityTests
    condition: always()
    jobs:
      - job: GenerateReport
        displayName: 'Generate Deployment Report'
        steps:
          - task: Bash@3
            displayName: 'Test deployment summary'
            inputs:
              targetType: 'inline'
              script: |
                echo "==================================="
                echo "Test Environment Deployment Summary"
                echo "==================================="
                echo "Environment: $(environment)"
                echo "Namespace: $(namespace)"
                echo "Image Tag: $(imageTag)"
                echo "Date: $(date)"
                echo "==================================="
                echo ""
                echo "All 16 services deployed to Test"
                echo "Integration tests: Passed"
                echo "Performance tests: Completed"
                echo "Security tests: Completed"
                echo ""
                echo "Environment URL: https://api-test.flamoral.com"
                echo "==================================="

          - task: SendEmail@1
            displayName: 'Send deployment notification'
            inputs:
              to: 'devops@flamoral.com;qa@flamoral.com'
              subject: 'Test Deployment Completed - Build $(Build.BuildNumber)'
              body: 'Test environment has been successfully deployed. Please proceed with QA testing.'
