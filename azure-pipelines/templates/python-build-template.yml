# Python Build Template
# Reusable template for building Python AI services

parameters:
  - name: serviceName
    type: string
  - name: serviceDirectory
    type: string
  - name: pythonVersion
    type: string
    default: '3.11'
  - name: runTests
    type: boolean
    default: true
  - name: publishCoverage
    type: boolean
    default: true

steps:
  - task: UsePythonVersion@0
    displayName: 'Use Python ${{ parameters.pythonVersion }}'
    inputs:
      versionSpec: '${{ parameters.pythonVersion }}'
      addToPath: true

  - task: Cache@2
    displayName: 'Cache pip packages'
    inputs:
      key: 'python | "$(Agent.OS)" | ${{ parameters.serviceDirectory }}/requirements.txt'
      restoreKeys: |
        python | "$(Agent.OS)"
      path: $(PIP_CACHE_DIR)

  - script: |
      python -m pip install --upgrade pip setuptools wheel
    displayName: 'Upgrade pip and tools'

  - script: |
      cd ${{ parameters.serviceDirectory }}
      pip install -r requirements.txt
    displayName: 'Install dependencies for ${{ parameters.serviceName }}'

  - script: |
      pip install pylint flake8 black mypy
    displayName: 'Install linting tools'

  - script: |
      cd ${{ parameters.serviceDirectory }}
      black --check . || true
      flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
      pylint **/*.py --disable=all --enable=E,F || true
    displayName: 'Lint ${{ parameters.serviceName }}'
    continueOnError: true

  - ${{ if parameters.runTests }}:
    - script: |
        pip install pytest pytest-cov pytest-asyncio
      displayName: 'Install test dependencies'

    - script: |
        cd ${{ parameters.serviceDirectory }}
        pytest tests/ --cov=. --cov-report=xml --cov-report=html --junitxml=junit.xml
      displayName: 'Run tests for ${{ parameters.serviceName }}'
      continueOnError: false

    - task: PublishTestResults@2
      displayName: 'Publish test results for ${{ parameters.serviceName }}'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '${{ parameters.serviceDirectory }}/junit.xml'
        testRunTitle: '${{ parameters.serviceName }} Tests'
        mergeTestResults: true

    - ${{ if parameters.publishCoverage }}:
      - task: PublishCodeCoverageResults@1
        displayName: 'Publish code coverage for ${{ parameters.serviceName }}'
        condition: succeededOrFailed()
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '${{ parameters.serviceDirectory }}/coverage.xml'
          reportDirectory: '${{ parameters.serviceDirectory }}/htmlcov'

  - task: CopyFiles@2
    displayName: 'Copy source files for ${{ parameters.serviceName }}'
    inputs:
      SourceFolder: '${{ parameters.serviceDirectory }}'
      Contents: |
        **/*.py
        requirements.txt
      TargetFolder: '$(Build.ArtifactStagingDirectory)/${{ parameters.serviceName }}'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifacts for ${{ parameters.serviceName }}'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/${{ parameters.serviceName }}'
      ArtifactName: '${{ parameters.serviceName }}'
      publishLocation: 'Container'
