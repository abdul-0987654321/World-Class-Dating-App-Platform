# Go Build Template
# Reusable template for building Go services

parameters:
  - name: serviceName
    type: string
  - name: serviceDirectory
    type: string
  - name: goVersion
    type: string
    default: '1.21'
  - name: runTests
    type: boolean
    default: true
  - name: publishCoverage
    type: boolean
    default: true

steps:
  - task: GoTool@0
    displayName: 'Install Go ${{ parameters.goVersion }}'
    inputs:
      version: '${{ parameters.goVersion }}'

  - task: Cache@2
    displayName: 'Cache Go modules'
    inputs:
      key: 'go | "$(Agent.OS)" | ${{ parameters.serviceDirectory }}/go.sum'
      restoreKeys: |
        go | "$(Agent.OS)"
      path: $(go env GOMODCACHE)

  - script: |
      cd ${{ parameters.serviceDirectory }}
      go mod download
      go mod verify
    displayName: 'Download Go dependencies for ${{ parameters.serviceName }}'

  - script: |
      cd ${{ parameters.serviceDirectory }}
      go fmt ./...
      go vet ./...
    displayName: 'Format and vet ${{ parameters.serviceName }}'
    continueOnError: true

  - ${{ if parameters.runTests }}:
    - script: |
        cd ${{ parameters.serviceDirectory }}
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      displayName: 'Run tests for ${{ parameters.serviceName }}'
      continueOnError: false

    - script: |
        cd ${{ parameters.serviceDirectory }}
        go install github.com/axw/gocov/gocov@latest
        go install github.com/AlekSi/gocov-xml@latest
        gocov convert coverage.out | gocov-xml > coverage.xml
      displayName: 'Convert coverage to XML for ${{ parameters.serviceName }}'
      condition: succeededOrFailed()

    - ${{ if parameters.publishCoverage }}:
      - task: PublishCodeCoverageResults@1
        displayName: 'Publish code coverage for ${{ parameters.serviceName }}'
        condition: succeededOrFailed()
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '${{ parameters.serviceDirectory }}/coverage.xml'

  - script: |
      cd ${{ parameters.serviceDirectory }}
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -ldflags="-w -s" -o bin/${{ parameters.serviceName }} .
    displayName: 'Build ${{ parameters.serviceName }}'

  - task: CopyFiles@2
    displayName: 'Copy build artifacts for ${{ parameters.serviceName }}'
    inputs:
      SourceFolder: '${{ parameters.serviceDirectory }}/bin'
      Contents: '**'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/${{ parameters.serviceName }}'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifacts for ${{ parameters.serviceName }}'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/${{ parameters.serviceName }}'
      ArtifactName: '${{ parameters.serviceName }}'
      publishLocation: 'Container'
