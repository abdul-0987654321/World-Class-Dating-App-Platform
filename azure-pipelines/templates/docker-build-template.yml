# Docker Build Template
# Reusable template for building and pushing Docker images

parameters:
  - name: serviceName
    type: string
  - name: dockerfilePath
    type: string
  - name: buildContext
    type: string
    default: '.'
  - name: containerRegistry
    type: string
    default: 'flamoral-acr'
  - name: imageRepository
    type: string
  - name: tagWithBuildId
    type: boolean
    default: true
  - name: tagWithGitSha
    type: boolean
    default: true
  - name: additionalTags
    type: object
    default: []

steps:
  - task: Docker@2
    displayName: 'Login to Azure Container Registry'
    inputs:
      command: login
      containerRegistry: '${{ parameters.containerRegistry }}'

  - task: Bash@3
    displayName: 'Generate Docker tags for ${{ parameters.serviceName }}'
    name: dockerTags
    inputs:
      targetType: 'inline'
      script: |
        TAGS=""

        # Always add latest tag
        TAGS="$TAGS --tag $(containerRegistryUrl)/${{ parameters.imageRepository }}:latest"

        # Add build ID tag
        if [ "${{ parameters.tagWithBuildId }}" = "True" ]; then
          TAGS="$TAGS --tag $(containerRegistryUrl)/${{ parameters.imageRepository }}:$(Build.BuildId)"
        fi

        # Add git SHA tag
        if [ "${{ parameters.tagWithGitSha }}" = "True" ]; then
          GIT_SHA=$(git rev-parse --short HEAD)
          TAGS="$TAGS --tag $(containerRegistryUrl)/${{ parameters.imageRepository }}:$GIT_SHA"
        fi

        # Add branch name tag (sanitized)
        BRANCH_NAME=$(echo "$(Build.SourceBranchName)" | sed 's/[^a-zA-Z0-9._-]/-/g')
        TAGS="$TAGS --tag $(containerRegistryUrl)/${{ parameters.imageRepository }}:$BRANCH_NAME"

        echo "##vso[task.setvariable variable=tags;isOutput=true]$TAGS"
        echo "Docker tags: $TAGS"

  - task: Docker@2
    displayName: 'Build Docker image for ${{ parameters.serviceName }}'
    inputs:
      command: build
      dockerfile: '${{ parameters.dockerfilePath }}'
      buildContext: '${{ parameters.buildContext }}'
      arguments: |
        $(dockerTags.tags)
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        --build-arg VERSION=$(Build.BuildId)
        --build-arg VCS_REF=$(Build.SourceVersion)
      addPipelineData: true
      addBaseImageData: true

  - task: Docker@2
    displayName: 'Push Docker image for ${{ parameters.serviceName }}'
    inputs:
      command: push
      containerRegistry: '${{ parameters.containerRegistry }}'
      repository: '${{ parameters.imageRepository }}'
      tags: |
        latest
        $(Build.BuildId)

  - ${{ if parameters.tagWithGitSha }}:
    - task: Docker@2
      displayName: 'Push Docker image with Git SHA tag'
      inputs:
        command: push
        containerRegistry: '${{ parameters.containerRegistry }}'
        repository: '${{ parameters.imageRepository }}'
        tags: |
          $(git rev-parse --short HEAD)

  - task: Bash@3
    displayName: 'Scan Docker image with Trivy'
    continueOnError: true
    inputs:
      targetType: 'inline'
      script: |
        # Install Trivy
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy

        # Scan image
        trivy image --exit-code 0 --severity HIGH,CRITICAL \
          --format json --output trivy-report-${{ parameters.serviceName }}.json \
          $(containerRegistryUrl)/${{ parameters.imageRepository }}:$(Build.BuildId)

        # Generate HTML report
        trivy image --exit-code 0 --severity HIGH,CRITICAL \
          --format template --template "@contrib/html.tpl" --output trivy-report-${{ parameters.serviceName }}.html \
          $(containerRegistryUrl)/${{ parameters.imageRepository }}:$(Build.BuildId)

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Trivy scan results'
    condition: succeededOrFailed()
    inputs:
      PathtoPublish: 'trivy-report-${{ parameters.serviceName }}.html'
      ArtifactName: 'security-scans'
      publishLocation: 'Container'
