# Kubernetes Deployment Template
# Reusable template for deploying services to AKS

parameters:
  - name: serviceName
    type: string
  - name: environment
    type: string
  - name: namespace
    type: string
  - name: kubernetesServiceConnection
    type: string
  - name: imageRepository
    type: string
  - name: imageTag
    type: string
    default: '$(Build.BuildId)'
  - name: manifestsPath
    type: string
    default: 'k8s/base'
  - name: helmChart
    type: string
    default: ''
  - name: useHelm
    type: boolean
    default: false
  - name: healthCheckUrl
    type: string
    default: ''
  - name: waitForRollout
    type: boolean
    default: true

steps:
  - task: KubernetesManifest@0
    displayName: 'Create namespace if not exists'
    inputs:
      action: 'deploy'
      kubernetesServiceConnection: '${{ parameters.kubernetesServiceConnection }}'
      namespace: '${{ parameters.namespace }}'
      manifests: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${{ parameters.namespace }}

  - ${{ if eq(parameters.useHelm, false) }}:
    - task: replacetokens@5
      displayName: 'Replace tokens in manifests'
      inputs:
        rootDirectory: '${{ parameters.manifestsPath }}'
        targetFiles: '**/*.yaml'
        encoding: 'auto'
        tokenPattern: 'default'
        writeBOM: true
        actionOnMissing: 'warn'
        keepToken: false
        actionOnNoFiles: 'continue'
        enableTransforms: false
        enableRecursion: false
        useLegacyPattern: false
        enableTelemetry: true

    - task: KubernetesManifest@0
      displayName: 'Deploy ${{ parameters.serviceName }} to Kubernetes'
      inputs:
        action: 'deploy'
        kubernetesServiceConnection: '${{ parameters.kubernetesServiceConnection }}'
        namespace: '${{ parameters.namespace }}'
        manifests: |
          ${{ parameters.manifestsPath }}/${{ parameters.serviceName }}-deployment.yaml
          ${{ parameters.manifestsPath }}/${{ parameters.serviceName }}-service.yaml
        containers: |
          $(containerRegistryUrl)/${{ parameters.imageRepository }}:${{ parameters.imageTag }}

  - ${{ if eq(parameters.useHelm, true) }}:
    - task: HelmDeploy@0
      displayName: 'Deploy ${{ parameters.serviceName }} with Helm'
      inputs:
        connectionType: 'Kubernetes Service Connection'
        kubernetesServiceConnection: '${{ parameters.kubernetesServiceConnection }}'
        namespace: '${{ parameters.namespace }}'
        command: 'upgrade'
        chartType: 'FilePath'
        chartPath: '${{ parameters.helmChart }}'
        releaseName: '${{ parameters.serviceName }}-${{ parameters.environment }}'
        install: true
        waitForExecution: true
        arguments: |
          --set image.repository=$(containerRegistryUrl)/${{ parameters.imageRepository }}
          --set image.tag=${{ parameters.imageTag }}
          --set environment=${{ parameters.environment }}
          --create-namespace

  - ${{ if parameters.waitForRollout }}:
    - task: Kubernetes@1
      displayName: 'Wait for rollout of ${{ parameters.serviceName }}'
      inputs:
        connectionType: 'Kubernetes Service Connection'
        kubernetesServiceEndpoint: '${{ parameters.kubernetesServiceConnection }}'
        namespace: '${{ parameters.namespace }}'
        command: 'rollout'
        arguments: 'status deployment/${{ parameters.serviceName }} --timeout=5m'

  - task: Kubernetes@1
    displayName: 'Get deployment status for ${{ parameters.serviceName }}'
    inputs:
      connectionType: 'Kubernetes Service Connection'
      kubernetesServiceEndpoint: '${{ parameters.kubernetesServiceConnection }}'
      namespace: '${{ parameters.namespace }}'
      command: 'get'
      arguments: 'pods -l app=${{ parameters.serviceName }} -o wide'

  - ${{ if ne(parameters.healthCheckUrl, '') }}:
    - task: Bash@3
      displayName: 'Health check for ${{ parameters.serviceName }}'
      inputs:
        targetType: 'inline'
        script: |
          echo "Waiting for service to be healthy..."
          MAX_RETRIES=30
          RETRY_COUNT=0

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ parameters.healthCheckUrl }})
            if [ $HTTP_CODE -eq 200 ]; then
              echo "Service is healthy! HTTP Code: $HTTP_CODE"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES failed. HTTP Code: $HTTP_CODE. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Service health check failed after $MAX_RETRIES attempts"
          exit 1

  - task: Kubernetes@1
    displayName: 'Describe pods for debugging'
    condition: failed()
    inputs:
      connectionType: 'Kubernetes Service Connection'
      kubernetesServiceEndpoint: '${{ parameters.kubernetesServiceConnection }}'
      namespace: '${{ parameters.namespace }}'
      command: 'describe'
      arguments: 'pods -l app=${{ parameters.serviceName }}'
