# Checkov Security Scanning Configuration
# Dating Platform - SOC2 & GDPR Compliance

# Directories to scan
directory:
  - terraform/

# Skip paths
skip-path:
  - terraform/.terraform/
  - .git/

# Framework
framework:
  - terraform
  - terraform_plan
  - secrets

# Output format
output: cli
compact: false

# Soft fail initially - set to false for production
soft-fail: true

# Hard fail on critical security issues
hard-fail-on:
  - CKV_AZURE_88   # App Service should use latest TLS version
  - CKV_AZURE_13   # App Service should only be accessible over HTTPS
  - CKV_AZURE_114  # Storage accounts should have encryption at rest
  - CKV_AZURE_35   # Key Vault has soft delete enabled
  - CKV_AZURE_109  # SQL Server should have auditing enabled
  - CKV_AZURE_23   # SQL Server should have threat detection enabled

# Skip specific checks with justification
skip-check:
  # Development flexibility
  - CKV_AZURE_9    # NSG rules - managed separately
  - CKV_AZURE_12   # Network Watcher flow logs - implemented separately

  # Cost optimization for non-prod
  - CKV_AZURE_165  # Container Registry Premium SKU - Standard OK for dev/test
  - CKV_AZURE_168  # AKS paid tier - Free OK for dev/test

  # Design decisions
  - CKV2_AZURE_1   # Customer-managed keys - Platform keys OK for initial deployment
  - CKV2_AZURE_8   # Storage private link - configured separately
  - CKV2_AZURE_18  # Key Vault private link - configured for production

# Enable variable evaluation
evaluate-variables: true

# Download external modules
download-external-modules: true
