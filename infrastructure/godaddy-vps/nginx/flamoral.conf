#===============================================================================
# Flamoral Nginx Configuration
# Reverse proxy configuration for the Flamoral dating platform
#
# Domains:
#   - flamoral.com, www.flamoral.com → Frontend (localhost:5173)
#   - api.flamoral.com → API Gateway (localhost:4000)
#   - ws.flamoral.com → WebSocket Server (localhost:5000)
#
# Features:
#   - SSL termination with Let's Encrypt
#   - Security headers
#   - Gzip compression
#   - Rate limiting
#   - WebSocket support
#
# Author: Flamoral DevOps Team
# Version: 1.0.0
#===============================================================================

#-------------------------------------------------------------------------------
# Upstream Definitions
#-------------------------------------------------------------------------------

# Frontend application (Vite build served by serve or nginx)
upstream frontend {
    server 127.0.0.1:5173;
    keepalive 32;
}

# API Gateway
upstream api_gateway {
    server 127.0.0.1:4000;
    keepalive 64;
}

# WebSocket Server
upstream websocket {
    server 127.0.0.1:5000;
    keepalive 64;
}

# Backend microservices (for internal routing if needed)
upstream auth_service {
    server 127.0.0.1:4001;
}

upstream user_service {
    server 127.0.0.1:4002;
}

upstream matching_service {
    server 127.0.0.1:4003;
}

upstream messaging_service {
    server 127.0.0.1:4004;
}

upstream video_service {
    server 127.0.0.1:4005;
}

#-------------------------------------------------------------------------------
# Rate Limiting Zones (defined in nginx.conf, referenced here)
#-------------------------------------------------------------------------------
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

#-------------------------------------------------------------------------------
# HTTP to HTTPS Redirect
#-------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name flamoral.com www.flamoral.com api.flamoral.com ws.flamoral.com;

    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

#-------------------------------------------------------------------------------
# Main Frontend Server (flamoral.com, www.flamoral.com)
#-------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flamoral.com www.flamoral.com;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/flamoral.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flamoral.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security headers
    include /etc/nginx/snippets/security-headers.conf;

    # Logging
    access_log /var/log/flamoral/nginx/frontend-access.log main;
    error_log /var/log/flamoral/nginx/frontend-error.log;

    # Root for static files
    root /home/flamoral/app/frontend/dist;
    index index.html;

    # Connection limits
    limit_conn conn_limit 20;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Try local files first, then proxy to frontend server
        try_files $uri @frontend;
    }

    # Service worker - no cache
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri @frontend;
    }

    # Manifest - short cache
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri @frontend;
    }

    # Main application - SPA routing
    location / {
        try_files $uri $uri/ /index.html;

        # Proxy to frontend server if running in dev mode
        # proxy_pass http://frontend;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection 'upgrade';
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_cache_bypass $http_upgrade;
    }

    # Named location for proxying to frontend server
    location @frontend {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

#-------------------------------------------------------------------------------
# API Gateway Server (api.flamoral.com)
#-------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.flamoral.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/flamoral.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flamoral.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security headers (modified for API)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/flamoral/nginx/api-access.log main;
    error_log /var/log/flamoral/nginx/api-error.log;

    # Request size limits
    client_max_body_size 50m;
    client_body_buffer_size 16k;

    # Connection limits
    limit_conn conn_limit 30;

    # Gzip for API responses
    gzip on;
    gzip_types application/json;

    # CORS headers
    add_header 'Access-Control-Allow-Origin' 'https://flamoral.com' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'https://flamoral.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://api_gateway/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Authentication endpoints - strict rate limiting
    location ~ ^/api/v1/auth/(login|register|forgot-password) {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # File upload endpoints - increased limits
    location ~ ^/api/v1/(upload|media) {
        limit_req zone=api_limit burst=5 nodelay;

        client_max_body_size 100m;
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # All other API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # GraphQL endpoint (if used)
    location /graphql {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Catch-all for API
    location / {
        return 404 '{"error": "Not Found"}';
        add_header Content-Type application/json;
    }
}

#-------------------------------------------------------------------------------
# WebSocket Server (ws.flamoral.com)
#-------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ws.flamoral.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/flamoral.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flamoral.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logging
    access_log /var/log/flamoral/nginx/ws-access.log main;
    error_log /var/log/flamoral/nginx/ws-error.log;

    # Connection limits for WebSocket
    limit_conn conn_limit 50;

    # WebSocket connections
    location / {
        proxy_pass http://websocket;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Disable buffering for real-time
        proxy_buffering off;
        proxy_cache off;
    }

    # Socket.IO specific path
    location /socket.io/ {
        proxy_pass http://websocket;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Disable buffering
        proxy_buffering off;
        proxy_cache off;
    }

    # Health check
    location /health {
        access_log off;
        proxy_pass http://websocket/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

#-------------------------------------------------------------------------------
# Status Page (internal only)
#-------------------------------------------------------------------------------
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
