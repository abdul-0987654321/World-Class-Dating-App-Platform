---
# Load Balancer setup playbook
# Installs and configures Nginx as load balancer

- name: Setup Nginx Load Balancer
  hosts: staging_lb_servers:prod_lb_servers
  become: yes
  tasks:
    - name: Install Nginx
      apt:
        name:
          - nginx
          - nginx-extras
        state: present
        update_cache: yes

    - name: Remove default Nginx configuration
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Create Nginx configuration for dating app
      copy:
        dest: /etc/nginx/sites-available/dating-app
        content: |
          upstream backend_servers {
              least_conn;
              {% for host in groups[environment + '_app_servers'] %}
              server {{ hostvars[host]['ansible_host'] }}:{{ app_port }} max_fails=3 fail_timeout=30s;
              {% endfor %}
              keepalive 32;
          }

          upstream api_servers {
              least_conn;
              {% for host in groups[environment + '_app_servers'] %}
              server {{ hostvars[host]['ansible_host'] }}:{{ api_port }} max_fails=3 fail_timeout=30s;
              {% endfor %}
              keepalive 32;
          }

          # Rate limiting
          limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
          limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

          # SSL session cache
          ssl_session_cache shared:SSL:10m;
          ssl_session_timeout 10m;

          # HTTP to HTTPS redirect
          server {
              listen 80;
              server_name {{ app_domain }} www.{{ app_domain }};
              return 301 https://$server_name$request_uri;
          }

          # Main HTTPS server
          server {
              listen 443 ssl http2;
              server_name {{ app_domain }} www.{{ app_domain }};

              # SSL configuration
              ssl_certificate /etc/letsencrypt/live/{{ app_domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ app_domain }}/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers HIGH:!aNULL:!MD5;
              ssl_prefer_server_ciphers on;

              # Security headers
              add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-XSS-Protection "1; mode=block" always;
              add_header Referrer-Policy "no-referrer-when-downgrade" always;

              # Logging
              access_log /var/log/nginx/dating-app-access.log;
              error_log /var/log/nginx/dating-app-error.log;

              # Client settings
              client_max_body_size 50M;
              client_body_buffer_size 128k;

              # Timeouts
              proxy_connect_timeout 90;
              proxy_send_timeout 90;
              proxy_read_timeout 90;
              send_timeout 90;

              # Gzip compression
              gzip on;
              gzip_vary on;
              gzip_proxied any;
              gzip_comp_level 6;
              gzip_types text/plain text/css text/xml text/javascript
                         application/json application/javascript application/xml+rss
                         application/rss+xml font/truetype font/opentype
                         application/vnd.ms-fontobject image/svg+xml;

              # API endpoints
              location /api/ {
                  limit_req zone=api_limit burst=20 nodelay;

                  proxy_pass http://api_servers;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }

              # WebSocket endpoint
              location /socket.io/ {
                  proxy_pass http://api_servers;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "Upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 86400;
              }

              # Static files
              location /static/ {
                  alias /var/www/dating-app/static/;
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }

              # Frontend application
              location / {
                  proxy_pass http://backend_servers;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }

              # Health check endpoint
              location /health {
                  access_log off;
                  return 200 "healthy\n";
                  add_header Content-Type text/plain;
              }
          }
        mode: '0644'
      notify: Reload Nginx

    - name: Enable dating app site
      file:
        src: /etc/nginx/sites-available/dating-app
        dest: /etc/nginx/sites-enabled/dating-app
        state: link
      notify: Reload Nginx

    - name: Configure Nginx main settings
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: "{{ item.insertafter | default(omit) }}"
      loop:
        - { regexp: '^\s*worker_processes', line: '    worker_processes auto;' }
        - { regexp: '^\s*worker_connections', line: '        worker_connections 4096;' }
        - { regexp: '^\s*use epoll', line: '        use epoll;', insertafter: 'events' }
        - { regexp: '^\s*multi_accept', line: '        multi_accept on;', insertafter: 'events' }
      notify: Reload Nginx

    - name: Install Certbot for SSL
      apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: present
      when: ssl_enabled | default(true)

    - name: Obtain SSL certificate
      command: >
        certbot --nginx -d {{ app_domain }} -d www.{{ app_domain }}
        --non-interactive --agree-tos --email {{ certbot_email }}
      args:
        creates: "/etc/letsencrypt/live/{{ app_domain }}/fullchain.pem"
      when: ssl_enabled | default(true)

    - name: Setup SSL certificate renewal
      cron:
        name: "Renew SSL certificates"
        minute: "0"
        hour: "3"
        weekday: "1"
        job: "certbot renew --quiet --post-hook 'systemctl reload nginx'"
      when: ssl_enabled | default(true)

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded
