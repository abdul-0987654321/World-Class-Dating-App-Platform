---
# Monitoring setup playbook
# Installs Prometheus, Grafana, and exporters

- name: Setup Monitoring Stack
  hosts: prod_monitoring_servers
  become: yes
  tasks:
    # Install Prometheus
    - name: Create Prometheus user
      user:
        name: prometheus
        system: yes
        shell: /bin/false
        create_home: no

    - name: Create Prometheus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Download Prometheus
      get_url:
        url: https://github.com/prometheus/prometheus/releases/download/v2.45.0/prometheus-2.45.0.linux-amd64.tar.gz
        dest: /tmp/prometheus.tar.gz

    - name: Extract Prometheus
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Copy Prometheus binaries
      copy:
        src: "/tmp/prometheus-2.45.0.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: '0755'
        remote_src: yes
      loop:
        - prometheus
        - promtool

    - name: Configure Prometheus
      copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s
            external_labels:
              cluster: 'dating-app-prod'
              environment: 'production'

          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                      - localhost:9093

          rule_files:
            - "/etc/prometheus/rules/*.yml"

          scrape_configs:
            # Prometheus itself
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            # Node Exporter
            - job_name: 'node'
              static_configs:
                - targets:
                  {% for host in groups['production'] %}
                    - '{{ hostvars[host]['ansible_host'] }}:9100'
                  {% endfor %}

            # Docker Metrics
            - job_name: 'docker'
              static_configs:
                - targets:
                  {% for host in groups['prod_app_servers'] %}
                    - '{{ hostvars[host]['ansible_host'] }}:9323'
                  {% endfor %}

            # PostgreSQL Exporter
            - job_name: 'postgresql'
              static_configs:
                - targets:
                  {% for host in groups['prod_db_servers'] %}
                    - '{{ hostvars[host]['ansible_host'] }}:9187'
                  {% endfor %}

            # Redis Exporter
            - job_name: 'redis'
              static_configs:
                - targets:
                  {% for host in groups['prod_cache_servers'] %}
                    - '{{ hostvars[host]['ansible_host'] }}:9121'
                  {% endfor %}

            # Nginx Exporter
            - job_name: 'nginx'
              static_configs:
                - targets:
                  {% for host in groups['prod_lb_servers'] %}
                    - '{{ hostvars[host]['ansible_host'] }}:9113'
                  {% endfor %}

            # Application Metrics
            - job_name: 'dating-app'
              metrics_path: '/metrics'
              static_configs:
                - targets:
                  {% for host in groups['prod_app_servers'] %}
                    - '{{ hostvars[host]['ansible_host'] }}:{{ api_port }}'
                  {% endfor %}
        owner: prometheus
        group: prometheus
      notify: Restart Prometheus

    - name: Create Prometheus systemd service
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus/ \
            --web.console.templates=/etc/prometheus/consoles \
            --web.console.libraries=/etc/prometheus/console_libraries \
            --storage.tsdb.retention.time=90d \
            --web.listen-address=0.0.0.0:9090

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Prometheus

    # Install Grafana
    - name: Add Grafana APT key
      apt_key:
        url: https://packages.grafana.com/gpg.key
        state: present

    - name: Add Grafana repository
      apt_repository:
        repo: "deb https://packages.grafana.com/oss/deb stable main"
        state: present
        filename: grafana

    - name: Install Grafana
      apt:
        name: grafana
        state: present
        update_cache: yes

    - name: Configure Grafana
      copy:
        dest: /etc/grafana/grafana.ini
        content: |
          [server]
          http_port = {{ grafana_port }}
          domain = monitoring.{{ app_domain }}
          root_url = https://monitoring.{{ app_domain }}

          [database]
          type = postgres
          host = {{ db_host }}:{{ db_port }}
          name = grafana
          user = grafana
          password = {{ lookup('env', 'GRAFANA_DB_PASSWORD') }}

          [security]
          admin_user = admin
          admin_password = {{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}
          secret_key = {{ lookup('env', 'GRAFANA_SECRET_KEY') }}

          [auth]
          disable_login_form = false
          disable_signout_menu = false

          [auth.anonymous]
          enabled = false

          [smtp]
          enabled = true
          host = {{ lookup('env', 'SMTP_HOST') }}:587
          user = {{ lookup('env', 'SMTP_USER') }}
          password = {{ lookup('env', 'SMTP_PASSWORD') }}
          from_address = grafana@{{ app_domain }}
          from_name = Grafana

          [alerting]
          enabled = true
        mode: '0640'
        owner: root
        group: grafana
      notify: Restart Grafana

    - name: Ensure Prometheus is started and enabled
      service:
        name: prometheus
        state: started
        enabled: yes

    - name: Ensure Grafana is started and enabled
      service:
        name: grafana-server
        state: started
        enabled: yes

- name: Install Node Exporter on all hosts
  hosts: all
  become: yes
  tasks:
    - name: Download Node Exporter
      get_url:
        url: https://github.com/prometheus/node_exporter/releases/download/v1.6.1/node_exporter-1.6.1.linux-amd64.tar.gz
        dest: /tmp/node_exporter.tar.gz

    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Copy Node Exporter binary
      copy:
        src: /tmp/node_exporter-1.6.1.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        remote_src: yes

    - name: Create Node Exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Node Exporter

    - name: Ensure Node Exporter is started and enabled
      service:
        name: node_exporter
        state: started
        enabled: yes

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Prometheus
      service:
        name: prometheus
        state: restarted

    - name: Restart Grafana
      service:
        name: grafana-server
        state: restarted

    - name: Restart Node Exporter
      service:
        name: node_exporter
        state: restarted
