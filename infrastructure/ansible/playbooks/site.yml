---
# Main playbook for complete infrastructure setup
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/site.yml --limit=<environment>

- name: Setup Base System
  import_playbook: setup-base.yml

- name: Setup Docker
  import_playbook: setup-docker.yml

- name: Setup Database
  import_playbook: setup-database.yml

- name: Setup Redis Cache
  import_playbook: setup-redis.yml

- name: Setup Load Balancers
  import_playbook: setup-loadbalancer.yml

- name: Setup Monitoring
  import_playbook: setup-monitoring.yml

- name: Deploy Application
  import_playbook: deploy-application.yml
