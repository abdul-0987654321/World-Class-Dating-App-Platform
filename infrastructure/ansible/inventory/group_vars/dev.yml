---
# Development environment variables

environment: development
environment_tier: dev

# Application
app_debug: true
app_log_level: debug
api_base_url: https://api-dev.datingapp.com

# Database
db_host: dev-db-01
db_port: 5432
db_name: dating_app_dev
db_user: datingapp_dev
db_max_connections: 20

# Redis
redis_host: dev-redis-01
redis_port: 6379
redis_db: 0

# Resources
app_server_cpu: 2
app_server_memory: 4096
db_server_cpu: 2
db_server_memory: 8192

# Scaling
min_replicas: 1
max_replicas: 2

# Monitoring
datadog_enabled: false
newrelic_enabled: false

# Backup
backup_enabled: false
