---
# Ansible Inventory for Dating App Platform
# Defines all server groups and their configurations

all:
  children:
    # Development Environment
    dev:
      children:
        dev_app_servers:
          hosts:
            dev-app-01:
              ansible_host: 10.0.1.10
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-dev.pem
        dev_db_servers:
          hosts:
            dev-db-01:
              ansible_host: 10.0.1.20
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-dev.pem
              postgresql_version: "15"
        dev_cache_servers:
          hosts:
            dev-redis-01:
              ansible_host: 10.0.1.30
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-dev.pem

    # Staging Environment
    staging:
      children:
        staging_app_servers:
          hosts:
            staging-app-01:
              ansible_host: 10.0.2.10
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-staging.pem
            staging-app-02:
              ansible_host: 10.0.2.11
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-staging.pem
        staging_db_servers:
          hosts:
            staging-db-01:
              ansible_host: 10.0.2.20
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-staging.pem
              postgresql_version: "15"
            staging-db-02:
              ansible_host: 10.0.2.21
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-staging.pem
              postgresql_version: "15"
              postgresql_role: "replica"
        staging_cache_servers:
          hosts:
            staging-redis-01:
              ansible_host: 10.0.2.30
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-staging.pem
        staging_lb_servers:
          hosts:
            staging-lb-01:
              ansible_host: 10.0.2.40
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-staging.pem

    # Production Environment
    production:
      children:
        prod_app_servers:
          hosts:
            prod-app-01:
              ansible_host: 10.0.3.10
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
            prod-app-02:
              ansible_host: 10.0.3.11
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
            prod-app-03:
              ansible_host: 10.0.3.12
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
        prod_db_servers:
          hosts:
            prod-db-01:
              ansible_host: 10.0.3.20
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
              postgresql_version: "15"
              postgresql_role: "primary"
            prod-db-02:
              ansible_host: 10.0.3.21
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
              postgresql_version: "15"
              postgresql_role: "replica"
            prod-db-03:
              ansible_host: 10.0.3.22
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
              postgresql_version: "15"
              postgresql_role: "replica"
        prod_cache_servers:
          hosts:
            prod-redis-01:
              ansible_host: 10.0.3.30
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
              redis_role: "master"
            prod-redis-02:
              ansible_host: 10.0.3.31
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
              redis_role: "slave"
            prod-redis-03:
              ansible_host: 10.0.3.32
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
              redis_role: "slave"
        prod_lb_servers:
          hosts:
            prod-lb-01:
              ansible_host: 10.0.3.40
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
            prod-lb-02:
              ansible_host: 10.0.3.41
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem
        prod_monitoring_servers:
          hosts:
            prod-monitor-01:
              ansible_host: 10.0.3.50
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-prod.pem

    # Kubernetes Nodes
    k8s_cluster:
      children:
        k8s_masters:
          hosts:
            k8s-master-01:
              ansible_host: 10.0.4.10
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-k8s.pem
            k8s-master-02:
              ansible_host: 10.0.4.11
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-k8s.pem
            k8s-master-03:
              ansible_host: 10.0.4.12
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-k8s.pem
        k8s_workers:
          hosts:
            k8s-worker-01:
              ansible_host: 10.0.4.20
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-k8s.pem
            k8s-worker-02:
              ansible_host: 10.0.4.21
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-k8s.pem
            k8s-worker-03:
              ansible_host: 10.0.4.22
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-k8s.pem
            k8s-worker-04:
              ansible_host: 10.0.4.23
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-k8s.pem
            k8s-worker-05:
              ansible_host: 10.0.4.24
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/dating-app-k8s.pem

  # Global variables
  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_name: dating-app
    app_user: datingapp
    app_group: datingapp
    docker_version: "24.0"
    nodejs_version: "20.x"
