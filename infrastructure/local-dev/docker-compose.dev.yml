version: '3.8'

# LOCAL DEVELOPMENT ONLY
# This Docker Compose file is for local development environments only.
# DO NOT use this for production, staging, or any cloud deployment.
# Production infrastructure uses AWS services (EKS, Aurora PostgreSQL, ElastiCache, etc.) via Terraform.
#
# Service Port Mapping (per README.md):
# - API Gateway: 4000        - Auth Service: 3001
# - User Service: 3002       - Matching Service: 3003
# - Messaging Service: 5000  - Payment Service: 3005
# - Analytics Service: 3007  - Notification Service: 3008
# - Media Service: 3009      - Admin Service: 3010
# - Advertising Service: 3011 - Moderation Service: 3012
# - Automation Service: 3013 - Partnership Service: 3014

services:
  # ==================== Infrastructure ====================

  # PostgreSQL Database (simulates Aurora PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: flamoral-postgres-dev
    environment:
      POSTGRES_DB: flamoral
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flamoral-dev-network

  # Redis Cache (simulates ElastiCache)
  redis:
    image: redis:7-alpine
    container_name: flamoral-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flamoral-dev-network

  # MongoDB Database (simulates DocumentDB)
  mongodb:
    image: mongo:7
    container_name: flamoral-mongodb-dev
    environment:
      MONGO_INITDB_DATABASE: flamoral
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flamoral-dev-network

  # LocalStack (simulates AWS S3, SQS, SNS, SES)
  localstack:
    image: localstack/localstack:3.0
    container_name: flamoral-localstack-dev
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,sns,ses
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - flamoral-dev-network

  # Elasticsearch (optional - for search functionality)
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: flamoral-elasticsearch-dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - flamoral-dev-network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  localstack_data:
  elasticsearch_data:

networks:
  flamoral-dev-network:
    driver: bridge
    name: flamoral-dev-network
