# Default values for dating-app
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  environment: production
  domain: datingapp.com
  imagePullSecrets: []
  registry: docker.io

replicaCount: 3

image:
  pullPolicy: Always
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "dating-app-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 4000
  targetPort: 4000
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.datingapp.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dating-app-tls
      hosts:
        - api.datingapp.com

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - dating-app
          topologyKey: kubernetes.io/hostname

# Database configuration
database:
  enabled: true
  host: postgres-service
  port: 5432
  name: dating_app_production
  user: datingapp_prod

# Redis configuration
redis:
  enabled: true
  host: redis-service
  port: 6379
  db: 0

# Microservices
microservices:
  user:
    enabled: true
    replicas: 3
    port: 4001
  matching:
    enabled: true
    replicas: 3
    port: 4002
  media:
    enabled: true
    replicas: 3
    port: 4003
  messaging:
    enabled: true
    replicas: 3
    port: 4004
  notification:
    enabled: true
    replicas: 2
    port: 4005

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

# Persistence
persistence:
  enabled: true
  storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi
