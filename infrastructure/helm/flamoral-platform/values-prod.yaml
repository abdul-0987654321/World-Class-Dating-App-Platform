# Production Environment Values
# These values override the base values.yaml for production deployment

global:
  environment: production
  domain: flamoral.com
  imagePullPolicy: Always
  # ACR registry for production - also set via CI/CD --set global.imageRegistry=...
  imageRegistry: flamoralprodacr.azurecr.io
  # Image tag is set via CI/CD pipeline: --set global.image.tag=<version>

  # Azure Key Vault integration for secrets
  azureKeyVault:
    enabled: true
    name: "flamoral-prod-kv"
    tenantId: ""  # Set via Terraform output or --set
    clientId: ""  # Workload Identity client ID

services:
  apiGateway:
    replicaCount: 5
    autoscaling:
      minReplicas: 5
      maxReplicas: 50

  authService:
    replicaCount: 5
    autoscaling:
      minReplicas: 5
      maxReplicas: 30

  userService:
    replicaCount: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 20

  matchingService:
    replicaCount: 4
    autoscaling:
      minReplicas: 4
      maxReplicas: 25

  messagingService:
    replicaCount: 5
    autoscaling:
      minReplicas: 5
      maxReplicas: 40

  mediaService:
    replicaCount: 4
    env:
      S3_BUCKET: "flamoral-media-production"
      CDN_URL: "https://cdn.flamoral.com"

  paymentService:
    replicaCount: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 15
    podDisruptionBudget:
      enabled: true
      minAvailable: 2

  notificationService:
    replicaCount: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 20

  analyticsService:
    replicaCount: 2
    autoscaling:
      minReplicas: 2
      maxReplicas: 10

  moderationService:
    replicaCount: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 15

  realtimeService:
    replicaCount: 4
    autoscaling:
      minReplicas: 4
      maxReplicas: 30

  adminService:
    replicaCount: 2

  advertisingService:
    replicaCount: 2

  automationService:
    replicaCount: 2

  workflowEngine:
    replicaCount: 3

aiServices:
  recommendationService:
    replicaCount: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 10

  datingCoachService:
    replicaCount: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 15

  moderationAIService:
    replicaCount: 2
    autoscaling:
      minReplicas: 2
      maxReplicas: 8

postgresql:
  primary:
    persistence:
      size: 200Gi
    resources:
      requests:
        memory: 8Gi
        cpu: 4000m
      limits:
        memory: 16Gi
        cpu: 8000m
  readReplicas:
    replicaCount: 3
    persistence:
      size: 200Gi

redis:
  replica:
    replicaCount: 3
  master:
    persistence:
      size: 50Gi
  resources:
    requests:
      memory: 4Gi
      cpu: 2000m

mongodb:
  replicaCount: 3
  persistence:
    size: 100Gi
  resources:
    requests:
      memory: 4Gi
      cpu: 2000m

kafka:
  replicaCount: 3
  persistence:
    size: 100Gi
  resources:
    requests:
      memory: 4Gi
      cpu: 2000m
  zookeeper:
    replicaCount: 3

monitoring:
  prometheus:
    enabled: true
    server:
      retention: 30d
      persistentVolume:
        size: 200Gi
      resources:
        requests:
          memory: 8Gi
          cpu: 4000m

  grafana:
    enabled: true

tracing:
  jaeger:
    enabled: true

logging:
  loki:
    enabled: true
    loki:
      persistence:
        size: 100Gi
      resources:
        requests:
          memory: 2Gi
          cpu: 1000m

backups:
  enabled: true
  schedule: "0 2 * * *"
  retention: 30

networkPolicies:
  enabled: true

podSecurityPolicies:
  enabled: true
