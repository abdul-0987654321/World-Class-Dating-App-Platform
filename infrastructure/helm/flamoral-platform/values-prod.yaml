# Production environment values
global:
  environment: production
  image:
    pullPolicy: Always

# Production replica counts
services:
  apiGateway:
    replicaCount: 4
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi

  authService:
    replicaCount: 3

  userService:
    replicaCount: 3

  matchingService:
    replicaCount: 5
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi

  messagingService:
    replicaCount: 5
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi

  mediaService:
    replicaCount: 4
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi

  paymentService:
    replicaCount: 3

  notificationService:
    replicaCount: 3

  analyticsService:
    replicaCount: 3

  moderationService:
    replicaCount: 4

  adminService:
    replicaCount: 2

  webApp:
    replicaCount: 4

# Production ingress
ingress:
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:us-east-1:ACCOUNT_ID:regional/webacl/flamoral-waf/ID"
  hosts:
    - host: flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: webApp
    - host: www.flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: webApp
    - host: api.flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: apiGateway

# Production HPA
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# Production monitoring
serviceMonitor:
  enabled: true
  interval: 15s

# Network policies enforced
networkPolicy:
  enabled: true
