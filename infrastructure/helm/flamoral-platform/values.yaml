# Default values for flamoral-platform
global:
  imageRegistry: ""
  imagePullSecrets: []
  environment: development
  image:
    tag: latest
    pullPolicy: IfNotPresent

# Service configurations
services:
  apiGateway:
    enabled: true
    replicaCount: 2
    image:
      repository: flamoral/api-gateway
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
    service:
      type: ClusterIP
      port: 3000
    healthCheck:
      path: /health
      port: 3000

  authService:
    enabled: true
    replicaCount: 2
    image:
      repository: flamoral/auth-service
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    service:
      port: 3001

  userService:
    enabled: true
    replicaCount: 2
    image:
      repository: flamoral/user-service
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    service:
      port: 3002

  matchingService:
    enabled: true
    replicaCount: 3
    image:
      repository: flamoral/matching-service
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
    service:
      port: 3003

  messagingService:
    enabled: true
    replicaCount: 3
    image:
      repository: flamoral/messaging-service
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
    service:
      port: 3004

  mediaService:
    enabled: true
    replicaCount: 2
    image:
      repository: flamoral/media-service
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    service:
      port: 3005

  paymentService:
    enabled: true
    replicaCount: 2
    image:
      repository: flamoral/payment-service
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    service:
      port: 3006

  notificationService:
    enabled: true
    replicaCount: 2
    image:
      repository: flamoral/notification-service
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    service:
      port: 3007

  analyticsService:
    enabled: true
    replicaCount: 2
    image:
      repository: flamoral/analytics-service
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    service:
      port: 3008

  moderationService:
    enabled: true
    replicaCount: 2
    image:
      repository: flamoral/moderation-service
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
    service:
      port: 3009

  adminService:
    enabled: true
    replicaCount: 1
    image:
      repository: flamoral/admin-service
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    service:
      port: 3010

  webApp:
    enabled: true
    replicaCount: 2
    image:
      repository: flamoral/web-app
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 64Mi
    service:
      port: 80

# Ingress configuration
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: ""
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: webApp
    - host: api.flamoral.com
      paths:
        - path: /
          pathType: Prefix
          service: apiGateway

# Pod security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# HPA configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Redis (external)
redis:
  enabled: false
  # Use AWS ElastiCache instead

# Monitoring
serviceMonitor:
  enabled: true
  interval: 30s

# Network policies
networkPolicy:
  enabled: true
