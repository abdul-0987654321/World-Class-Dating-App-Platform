# =============================================================================
# Flamoral Dating Platform - Helm Values
# =============================================================================
# Global configuration for all microservices
# =============================================================================

global:
  environment: dev
  imageRegistry: flamoralacr8eq5eg.azurecr.io
  imageTag: latest
  imagePullSecrets:
    - name: acr-secret
  slot: blue

# Common settings
common:
  enabled: false

# =============================================================================
# Microservices Configuration
# =============================================================================

# API Gateway
apiGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: flamoral/api-gateway
    tag: ""  # Uses global.imageTag if empty
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    NODE_ENV: production
    PORT: "3000"

# Auth Service
authService:
  enabled: true
  replicaCount: 2
  image:
    repository: flamoral/auth-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# User Service
userService:
  enabled: true
  replicaCount: 2
  image:
    repository: flamoral/user-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3002
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Matching Service
matchingService:
  enabled: true
  replicaCount: 2
  image:
    repository: flamoral/matching-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3003
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Messaging Service
messagingService:
  enabled: true
  replicaCount: 2
  image:
    repository: flamoral/messaging-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3004
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Media Service
mediaService:
  enabled: true
  replicaCount: 2
  image:
    repository: flamoral/media-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3005
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Payment Service
paymentService:
  enabled: true
  replicaCount: 2
  image:
    repository: flamoral/payment-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3006
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Notification Service
notificationService:
  enabled: true
  replicaCount: 2
  image:
    repository: flamoral/notification-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3007
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Analytics Service
analyticsService:
  enabled: true
  replicaCount: 1
  image:
    repository: flamoral/analytics-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3008
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Moderation Service
moderationService:
  enabled: true
  replicaCount: 1
  image:
    repository: flamoral/moderation-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3009
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Advertising Service
advertisingService:
  enabled: true
  replicaCount: 1
  image:
    repository: flamoral/advertising-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3010
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Realtime Service (Go)
realtimeService:
  enabled: true
  replicaCount: 2
  image:
    repository: flamoral/realtime-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# =============================================================================
# Ingress Configuration
# =============================================================================

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/websocket-services: "flamoral-realtime-service"
  hosts:
    - host: api.flamoral.app
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
  tls:
    - secretName: flamoral-tls
      hosts:
        - api.flamoral.app

# =============================================================================
# Autoscaling Configuration
# =============================================================================

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# =============================================================================
# Pod Disruption Budget
# =============================================================================

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# =============================================================================
# Service Account
# =============================================================================

serviceAccount:
  create: true
  annotations: {}
  name: ""

# =============================================================================
# Pod Security
# =============================================================================

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# =============================================================================
# Resource Defaults
# =============================================================================

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# =============================================================================
# Health Probes
# =============================================================================

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# =============================================================================
# Node Selection
# =============================================================================

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - flamoral
          topologyKey: kubernetes.io/hostname
