replicaCount: 3

image:
  # NEVER use 'latest' in production - use semantic version or git SHA
  tag: ""  # Must be set during deployment: --set image.tag=$GITHUB_SHA

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

ingress:
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/limit-rps: "50"
  hosts:
    - host: api.flamoral.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - api.flamoral.com

env:
  - name: NODE_ENV
    value: "production"
  - name: LOG_LEVEL
    value: "warn"
