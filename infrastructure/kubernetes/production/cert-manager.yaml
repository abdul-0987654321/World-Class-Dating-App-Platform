# Cert-Manager Configuration for Automatic SSL/TLS Certificate Management

# Install cert-manager using Helm:
# helm repo add jetstack https://charts.jetstack.io
# helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set installCRDs=true

# Let's Encrypt Production Issuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ssl-admin@flamoral.com
    privateKeySecretRef:
      name: letsencrypt-production-private-key
    solvers:
    - http01:
        ingress:
          class: nginx
    - dns01:
        azureDNS:
          clientID: "${AZURE_CLIENT_ID}"
          clientSecretSecretRef:
            name: azuredns-config
            key: client-secret
          subscriptionID: "${AZURE_SUBSCRIPTION_ID}"
          tenantID: "${AZURE_TENANT_ID}"
          resourceGroupName: "production-dating-app-rg"
          hostedZoneName: flamoral.com
          environment: AzurePublicCloud
---
# Let's Encrypt Staging Issuer (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ssl-admin@flamoral.com
    privateKeySecretRef:
      name: letsencrypt-staging-private-key
    solvers:
    - http01:
        ingress:
          class: nginx
---
# Wildcard Certificate for *.flamoral.com
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-datingapp-com
  namespace: flamoral
spec:
  secretName: wildcard-datingapp-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.flamoral.com"
  dnsNames:
  - "*.flamoral.com"
  - flamoral.com
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days before expiry
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 4096
    rotationPolicy: Always
  usages:
  - digital signature
  - key encipherment
  - server auth
---
# API Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-datingapp-com
  namespace: flamoral
spec:
  secretName: api-datingapp-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: api.flamoral.com
  dnsNames:
  - api.flamoral.com
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days before expiry
  privateKey:
    algorithm: RSA
    size: 4096
  usages:
  - digital signature
  - key encipherment
  - server auth
---
# Web App Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: www-datingapp-com
  namespace: flamoral
spec:
  secretName: www-datingapp-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: www.flamoral.com
  dnsNames:
  - www.flamoral.com
  - flamoral.com
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days before expiry
  privateKey:
    algorithm: RSA
    size: 4096
  usages:
  - digital signature
  - key encipherment
  - server auth
---
# Azure DNS Configuration Secret (for DNS-01 challenge)
apiVersion: v1
kind: Secret
metadata:
  name: azuredns-config
  namespace: cert-manager
type: Opaque
stringData:
  client-secret: "${AZURE_DNS_CLIENT_SECRET}"
---
# Certificate Renewal Monitoring
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: cert-manager
spec:
  groups:
  - name: cert-manager
    interval: 60s
    rules:
    - alert: CertificateExpiryWarning
      expr: certmanager_certificate_expiration_timestamp_seconds - time() < 604800
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Certificate {{ $labels.name }} expiring soon"
        description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} will expire in less than 7 days"

    - alert: CertificateExpiryCritical
      expr: certmanager_certificate_expiration_timestamp_seconds - time() < 259200
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: "Certificate {{ $labels.name }} expiring very soon"
        description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} will expire in less than 3 days"

    - alert: CertificateRenewalFailed
      expr: certmanager_certificate_ready_status{condition="False"} == 1
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: "Certificate {{ $labels.name }} renewal failed"
        description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} failed to renew"
