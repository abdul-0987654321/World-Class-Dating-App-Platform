# Production Resource Quotas and Priority Classes

# Critical Priority Class
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: critical-priority
value: 1000000
globalDefault: false
description: "Critical production workloads that must not be evicted"
---
# High Priority Class
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 100000
globalDefault: false
description: "High priority production workloads"
---
# Normal Priority Class
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: normal-priority
value: 10000
globalDefault: true
description: "Normal priority production workloads"
---
# Low Priority Class
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority
value: 1000
globalDefault: false
description: "Low priority workloads that can be preempted"
---
# Production Compute Resource Quota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: dating-app-production
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    limits.cpu: "200"
    limits.memory: 400Gi
  scopeSelector:
    matchExpressions:
    - operator: In
      scopeName: PriorityClass
      values:
      - critical-priority
      - high-priority
      - normal-priority
---
# Production Storage Resource Quota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: storage-resources
  namespace: dating-app-production
spec:
  hard:
    requests.storage: 2Ti
    persistentvolumeclaims: "20"
---
# Production Object Count Quota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: object-counts
  namespace: dating-app-production
spec:
  hard:
    configmaps: "100"
    persistentvolumeclaims: "20"
    replicationcontrollers: "50"
    secrets: "100"
    services: "50"
    services.loadbalancers: "3"
    services.nodeports: "0"
---
# Critical Workload Resource Quota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: critical-pods
  namespace: dating-app-production
spec:
  hard:
    pods: "50"
    requests.cpu: "50"
    requests.memory: 100Gi
  scopeSelector:
    matchExpressions:
    - operator: In
      scopeName: PriorityClass
      values:
      - critical-priority
---
# Best Effort Pods Quota (limit background jobs)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: besteffort-pods
  namespace: dating-app-production
spec:
  hard:
    pods: "5"
  scopes:
  - BestEffort
