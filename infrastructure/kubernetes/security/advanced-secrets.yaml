  azure-storage-key: "YOUR_AZURE_STORAGE_KEY"
  azure-storage-connection-string: "DefaultEndpointsProtocol=https;AccountName=datingappstorage;AccountKey=YOUR_KEY;EndpointSuffix=core.windows.net"
  azure-container-name: "media"

---
apiVersion: v1
