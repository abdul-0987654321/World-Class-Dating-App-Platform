# Advanced Secrets Management Configuration
# IMPORTANT: Use sealed-secrets, external-secrets, or Vault in production
# This is a template file for reference only
---
apiVersion: v1
kind: Secret
metadata:
  name: dating-app-database-secrets
  namespace: dating-app
type: Opaque
stringData:
  postgres-username: "datingapp_prod"
  postgres-password: "CHANGE_ME_IN_PRODUCTION"
  postgres-database: "dating_app_production"
  connection-string: "postgresql://datingapp_prod:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/dating_app_production?sslmode=require"

---
apiVersion: v1
kind: Secret
metadata:
  name: dating-app-redis-secrets
  namespace: dating-app
type: Opaque
stringData:
  redis-password: "CHANGE_ME_IN_PRODUCTION"
  redis-url: "redis://:CHANGE_ME_IN_PRODUCTION@redis-service:6379/0"

---
apiVersion: v1
kind: Secret
metadata:
  name: dating-app-jwt-secrets
  namespace: dating-app
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET_AT_LEAST_32_CHARS"
  jwt-refresh-secret: "CHANGE_ME_IN_PRODUCTION_USE_DIFFERENT_SECRET_AT_LEAST_32_CHARS"
  jwt-private-key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_ACTUAL_PRIVATE_KEY
    -----END RSA PRIVATE KEY-----
  jwt-public-key: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_ACTUAL_PUBLIC_KEY
    -----END PUBLIC KEY-----

---
apiVersion: v1
kind: Secret
metadata:
  name: dating-app-encryption-secrets
  namespace: dating-app
type: Opaque
stringData:
  encryption-key: "CHANGE_ME_32_CHARACTER_STRING!!"
  encryption-algorithm: "aes-256-gcm"
  encryption-iv: "CHANGE_ME_16_CHARS_!!"

---
apiVersion: v1
kind: Secret
