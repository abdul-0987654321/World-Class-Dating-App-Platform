    -----BEGIN CERTIFICATE-----
    YOUR_TLS_CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    YOUR_TLS_PRIVATE_KEY
    -----END PRIVATE KEY-----

---
# External Secrets Operator Configuration (Recommended for Production)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: dating-app-secret-store
  namespace: dating-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dating-app-external-secrets
  namespace: dating-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dating-app-secret-store
    kind: SecretStore
  target:
    name: dating-app-secrets-from-aws
    creationPolicy: Owner
  data:
  - secretKey: db-password
    remoteRef:
      key: dating-app/database/password
  - secretKey: redis-password
    remoteRef:
      key: dating-app/redis/password
  - secretKey: jwt-secret
    remoteRef:
      key: dating-app/jwt/secret
  - secretKey: stripe-secret-key
    remoteRef:
      key: dating-app/stripe/secret-key
