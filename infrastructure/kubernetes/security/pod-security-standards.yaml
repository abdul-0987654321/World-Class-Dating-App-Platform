# Pod Security Standards for Flamoral Dating Platform
# Kubernetes 1.25+ - Replaces deprecated PodSecurityPolicy
# Documentation: https://kubernetes.io/docs/concepts/security/pod-security-standards/

---
# Apply Pod Security Standards at namespace level
# Production namespace - Restricted security standard
apiVersion: v1
kind: Namespace
metadata:
  name: dating-app-production
  labels:
    # Enforce restricted Pod Security Standard
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    # Audit mode - logs violations without blocking
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    # Warn mode - returns warnings to users
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    environment: production
    app: flamoral

---
# Staging namespace - Restricted security standard
apiVersion: v1
kind: Namespace
metadata:
  name: dating-app-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    environment: staging
    app: flamoral

---
# Development namespace - Baseline security standard (less restrictive)
apiVersion: v1
kind: Namespace
metadata:
  name: dating-app-dev
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
    environment: development
    app: flamoral

---
# Logging namespace - Baseline (elasticsearch requires some privileges)
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

---
# Monitoring namespace - Baseline
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

---
# Security context constraints for production workloads
# Example deployment with restricted security context
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-restricted-deployment
  namespace: flamoral
spec:
  replicas: 3
  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
    spec:
      # Service account with least privilege
      serviceAccountName: example-app
      automountServiceAccountToken: true

      # Security context at pod level
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: app
        image: flamoralprodacr.azurecr.io/example-image:${IMAGE_TAG}

        # Security context at container level
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

        # Resource limits
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"

        # Volume mounts for writable directories
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}

---
# NetworkPolicy to complement Pod Security Standards
# Deny all traffic by default, allow only explicit connections
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: flamoral
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Allow production pods to communicate with DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: flamoral
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53

---
# OPA Gatekeeper ConstraintTemplate for enforcing security standards
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsprestricted
spec:
  crd:
    spec:
      names:
        kind: K8sPSPRestricted
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsprestricted

        violation[{"msg": msg}] {
          not input.review.object.spec.securityContext.runAsNonRoot
          msg := "Containers must run as non-root user"
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not container.securityContext.allowPrivilegeEscalation == false
          msg := sprintf("Container %v must set allowPrivilegeEscalation to false", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not has_dropped_all_capabilities(container)
          msg := sprintf("Container %v must drop all capabilities", [container.name])
        }

        has_dropped_all_capabilities(container) {
          container.securityContext.capabilities.drop[_] == "ALL"
        }

---
# Apply the constraint to production namespace
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPSPRestricted
metadata:
  name: psp-restricted-production
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    namespaces:
      - dating-app-production
      - dating-app-staging

---
# ResourceQuota to prevent resource exhaustion attacks
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: flamoral
spec:
  hard:
    requests.cpu: "50"
    requests.memory: 100Gi
    limits.cpu: "100"
    limits.memory: 200Gi
    persistentvolumeclaims: "20"
    pods: "100"

---
# LimitRange to enforce default security-focused resource constraints
apiVersion: v1
kind: LimitRange
metadata:
  name: production-limitrange
  namespace: flamoral
spec:
  limits:
  - max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "100m"
      memory: "64Mi"
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "200m"
      memory: "256Mi"
    type: Container
