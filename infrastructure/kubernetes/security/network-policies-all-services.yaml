# =============================================================================
# Comprehensive Network Policies for All 17 Flamoral Services
# Implements zero-trust network segmentation with least-privilege access
# =============================================================================

---
# Default Deny All Ingress Traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-ingress
  namespace: flamoral-dating
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Default Deny All Egress Traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-egress
  namespace: flamoral-dating
spec:
  podSelector: {}
  policyTypes:
  - Egress

---
# =============================================================================
# API GATEWAY - Entry point for all external traffic
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-policy
  namespace: flamoral-dating
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from NGINX Ingress Controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  # Allow Prometheus scraping
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Route to all backend services
  - to:
    - podSelector:
        matchLabels:
          app: auth-service
    ports:
    - protocol: TCP
      port: 3002
  - to:
    - podSelector:
        matchLabels:
          app: user-service
    ports:
    - protocol: TCP
      port: 3001
  - to:
    - podSelector:
        matchLabels:
          app: matching-service
    ports:
    - protocol: TCP
      port: 3003
  - to:
    - podSelector:
        matchLabels:
          app: messaging-service
    ports:
    - protocol: TCP
      port: 3004
  - to:
    - podSelector:
        matchLabels:
          app: media-service
    ports:
    - protocol: TCP
      port: 3005
  - to:
    - podSelector:
        matchLabels:
          app: payment-service
    ports:
    - protocol: TCP
      port: 3006
  - to:
    - podSelector:
        matchLabels:
          app: notification-service
    ports:
    - protocol: TCP
      port: 3007
  - to:
    - podSelector:
        matchLabels:
          app: analytics-service
    ports:
    - protocol: TCP
      port: 3008
  - to:
    - podSelector:
        matchLabels:
          app: moderation-service
    ports:
    - protocol: TCP
      port: 3009
  - to:
    - podSelector:
        matchLabels:
          app: realtime-service
    ports:
    - protocol: TCP
      port: 3010
  - to:
    - podSelector:
        matchLabels:
          app: admin-service
    ports:
    - protocol: TCP
      port: 3011
  - to:
    - podSelector:
        matchLabels:
          app: advertising-service
    ports:
    - protocol: TCP
      port: 3012
  - to:
    - podSelector:
        matchLabels:
          app: automation-service
    ports:
    - protocol: TCP
      port: 3013
  - to:
    - podSelector:
        matchLabels:
          app: workflow-engine
    ports:
    - protocol: TCP
      port: 3014
  - to:
    - podSelector:
        matchLabels:
          app: policy-service
    ports:
    - protocol: TCP
      port: 3015
  - to:
    - podSelector:
        matchLabels:
          app: verification-service
    ports:
    - protocol: TCP
      port: 3016
  # Redis for rate limiting and caching
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53

