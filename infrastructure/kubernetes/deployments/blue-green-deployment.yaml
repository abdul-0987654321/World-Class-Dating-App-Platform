# Blue-Green Deployment Configuration for Dating App
# Enables zero-downtime deployments with instant rollback capability
---
# Blue Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-blue
  namespace: flamoral
  labels:
    app: api-gateway
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
      version: blue
  template:
    metadata:
      labels:
        app: api-gateway
        version: blue
        prometheus-scrape: "true"
    spec:
      containers:
      - name: api-gateway
        image: flamoralprodacr.azurecr.io/api-gateway:${IMAGE_TAG}

        ports:
        - containerPort: 4000
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: VERSION
          value: "blue"
        - name: DEPLOYMENT_TYPE
          value: "blue"
        envFrom:
        - configMapRef:
            name: dating-app-config-production
        - secretRef:
            name: dating-app-secrets
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 5

---
# Green Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-green
  namespace: flamoral
  labels:
    app: api-gateway
    version: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
      version: green
  template:
    metadata:
      labels:
        app: api-gateway
        version: green
        prometheus-scrape: "true"
    spec:
      containers:
      - name: api-gateway
        image: flamoralprodacr.azurecr.io/api-gateway:${IMAGE_TAG}
        ports:
        - containerPort: 4000
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: VERSION
          value: "green"
        - name: DEPLOYMENT_TYPE
          value: "green"
        envFrom:
        - configMapRef:
            name: dating-app-config-production
        - secretRef:
            name: dating-app-secrets
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 5

---
# Service that can switch between blue and green
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: flamoral
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
    version: blue  # Change to 'green' to switch traffic
  ports:
  - port: 4000
    targetPort: 4000
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics

---
# Blue service (for direct access during testing)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-blue
  namespace: flamoral
  labels:
    app: api-gateway
    version: blue
spec:
  type: ClusterIP
  selector:
    app: api-gateway
    version: blue
  ports:
  - port: 4000
    targetPort: 4000
    name: http

---
# Green service (for direct access during testing)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-green
  namespace: flamoral
  labels:
    app: api-gateway
    version: green
spec:
  type: ClusterIP
  selector:
    app: api-gateway
    version: green
  ports:
  - port: 4000
    targetPort: 4000
    name: http

---
# Ingress for Blue environment (testing)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-blue-ingress
  namespace: flamoral
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - blue.api.flamoral.com
    secretName: api-blue-tls
  rules:
  - host: blue.api.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-blue
            port:
              number: 4000

---
# Ingress for Green environment (testing)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-green-ingress
  namespace: flamoral
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - green.api.flamoral.com
    secretName: api-green-tls
  rules:
  - host: green.api.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-green
            port:
              number: 4000

---
# ServiceMonitor for Prometheus (Blue)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway-blue
  namespace: flamoral
  labels:
    app: api-gateway
    version: blue
spec:
  selector:
    matchLabels:
      app: api-gateway
      version: blue
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics

---
# ServiceMonitor for Prometheus (Green)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway-green
  namespace: flamoral
  labels:
    app: api-gateway
    version: green
spec:
  selector:
    matchLabels:
      app: api-gateway
      version: green
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics

---
# PodDisruptionBudget for Blue
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-blue-pdb
  namespace: flamoral
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
      version: blue

---
# PodDisruptionBudget for Green
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-green-pdb
  namespace: flamoral
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
      version: green
