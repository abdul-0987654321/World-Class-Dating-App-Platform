# ServiceMonitor resources for Flamoral services
# These configure Prometheus to scrape metrics from each service
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flamoral-web
  namespace: monitoring
  labels:
    app: flamoral-web
    release: prometheus
    team: platform-engineering
spec:
  jobLabel: flamoral-web
  namespaceSelector:
    matchNames:
      - flamoral
  selector:
    matchLabels:
      app: flamoral-web
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - targetLabel: service
          replacement: flamoral-web

