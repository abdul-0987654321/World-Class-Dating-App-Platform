# Custom Grafana Dashboard ConfigMap for Flamoral
# This dashboard includes:
# - Request rate per service
# - Error rate (5xx responses)
# - Response latency (p50, p95, p99)
# - Pod memory/CPU usage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-flamoral-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: grafana
data:
