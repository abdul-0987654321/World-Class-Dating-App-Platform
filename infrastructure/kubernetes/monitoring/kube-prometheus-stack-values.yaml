# Flamoral Production Prometheus Stack Helm Values
# helm install prometheus prometheus-community/kube-prometheus-stack \
#   --namespace monitoring \
#   -f kube-prometheus-stack-values.yaml

# Global settings
fullnameOverride: "flamoral-prometheus"
namespaceOverride: "monitoring"

# Common labels for all resources
commonLabels:
  environment: production
  platform: flamoral
  team: platform-engineering

# Default rules configuration
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # AKS managed etcd
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false  # AKS managed
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# Alertmanager configuration
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/slack-webhook-url

    route:
      receiver: 'slack-notifications'
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Critical alerts - immediate PagerDuty notification
        - match:
            severity: critical
          receiver: 'pagerduty-critical'
          group_wait: 0s
          repeat_interval: 15m
          continue: true

        # Critical alerts also go to Slack
        - match:
            severity: critical
          receiver: 'slack-critical'
          group_wait: 0s
          repeat_interval: 30m

        # High severity alerts
        - match:
            severity: high
          receiver: 'slack-alerts'
          repeat_interval: 2h

        # Warning alerts
        - match:
            severity: warning
          receiver: 'slack-warnings'
          repeat_interval: 6h

    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#flamoral-alerts'
            send_resolved: true
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'

      - name: 'slack-critical'
        slack_configs:
          - channel: '#flamoral-critical'
            send_resolved: true
            title: 'CRITICAL: {{ .GroupLabels.alertname }}'
            text: |
              *Alert:* {{ .GroupLabels.alertname }}
              *Namespace:* {{ .GroupLabels.namespace }}
              *Service:* {{ .GroupLabels.service }}
              {{ range .Alerts }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ end }}

      - name: 'slack-alerts'
        slack_configs:
          - channel: '#flamoral-alerts'
            send_resolved: true
            title: 'Alert: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

      - name: 'slack-warnings'
        slack_configs:
          - channel: '#flamoral-warnings'
            send_resolved: true
            title: 'Warning: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

      - name: 'pagerduty-critical'
        pagerduty_configs:
          - service_key_file: /etc/alertmanager/secrets/pagerduty-service-key
            severity: critical
            description: '{{ .GroupLabels.alertname }}'

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace']

      - source_match:
          severity: 'high'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace']

  alertmanagerSpec:
    replicas: 2
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-premium
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    podAntiAffinity: "soft"

    secrets:
      - alertmanager-secrets

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: alertmanager-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Alertmanager Authentication Required"
    hosts:
      - alertmanager.flamoral.com
    paths:
      - /
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.flamoral.com

# Grafana configuration
grafana:
  enabled: true

  adminPassword: "FlamoralAdmin123!"  # Change this or use secret

  replicas: 2

  image:
    repository: grafana/grafana
    tag: 10.2.3

  persistence:
    enabled: true
    storageClassName: managed-premium
    accessModes: ["ReadWriteOnce"]
    size: 20Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Grafana configuration
  grafana.ini:
    server:
      root_url: https://monitoring.flamoral.com
      serve_from_sub_path: false

    security:
      disable_gravatar: true
      cookie_secure: true
      cookie_samesite: strict

    auth:
      disable_login_form: false
      disable_signout_menu: false

    auth.anonymous:
      enabled: false

    analytics:
      reporting_enabled: false
      check_for_updates: false

    snapshots:
      external_enabled: false

    users:
      allow_sign_up: false
      allow_org_create: false
      auto_assign_org: true
      auto_assign_org_role: Viewer

    log:
      mode: console
      level: info

    alerting:
      enabled: true
      execute_alerts: true

    unified_alerting:
      enabled: true

  # Additional data sources
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.logging:80
      isDefault: false
      editable: false

  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'grafana-dashboards'
          orgId: 1
          folder: 'Kubernetes'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes
        - name: 'flamoral-dashboards'
          orgId: 1
          folder: 'Flamoral'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/flamoral

  # Import standard dashboards by ID
  dashboards:
    kubernetes:
      # Kubernetes cluster monitoring (via Prometheus)
      kubernetes-cluster:
        gnetId: 315
        revision: 3
        datasource: Prometheus

      # NGINX Ingress Controller
      nginx-ingress:
        gnetId: 9614
        revision: 1
        datasource: Prometheus

      # Kubernetes / Compute Resources / Cluster
      k8s-resources-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus

      # Kubernetes / Compute Resources / Namespace (Pods)
      k8s-resources-namespace:
        gnetId: 7250
        revision: 1
        datasource: Prometheus

      # Node Exporter Full
      node-exporter:
        gnetId: 1860
        revision: 31
        datasource: Prometheus

  # ConfigMaps for custom dashboards
  dashboardsConfigMaps:
    flamoral: "grafana-flamoral-dashboards"

  # Sidecar for dashboard auto-loading
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folder: /var/lib/grafana/dashboards
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource

  # Plugins
  plugins:
    - grafana-piechart-panel
    - grafana-worldmap-panel
    - redis-datasource
    - grafana-clock-panel

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    hosts:
      - monitoring.flamoral.com
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-tls
        hosts:
          - monitoring.flamoral.com

  # Pod anti-affinity for HA
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - grafana
            topologyKey: kubernetes.io/hostname

# Prometheus configuration
prometheus:
  enabled: true

  prometheusSpec:
    # Retention configuration
    retention: 7d
    retentionSize: "45GB"

    # Scrape interval
    scrapeInterval: 15s
    evaluationInterval: 15s

    # Resources
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-premium
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Replicas for HA
    replicas: 2

    # External labels
    externalLabels:
      cluster: flamoral-prod-aks
      environment: production

    # Pod anti-affinity for HA
    podAntiAffinity: "soft"

    # ServiceMonitor selectors - monitor all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # PodMonitor selectors
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    # PrometheusRule selectors
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # Additional scrape configs
    additionalScrapeConfigs:
      # Scrape pods with prometheus.io annotations
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - flamoral
                - default
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: service

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Prometheus Authentication Required"
    hosts:
      - prometheus.flamoral.com
    paths:
      - /
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.flamoral.com

# Prometheus Operator
prometheusOperator:
  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# kube-state-metrics
kubeStateMetrics:
  enabled: true

# Node exporter
nodeExporter:
  enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 100Mi

# Disable components not available in AKS
kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

kubeProxy:
  enabled: true
  service:
    enabled: true
    port: 10249
    targetPort: 10249

# Additional PrometheusRule for Flamoral-specific alerts
additionalPrometheusRulesMap:
  flamoral-alerts:
    groups:
      # Application Alerts
      - name: flamoral.application
        interval: 30s
        rules:
          # High Error Rate (>5% 5xx responses)
          - alert: FlamoralHighErrorRate
            expr: |
              (
                sum(rate(http_requests_total{namespace="flamoral",status=~"5.."}[5m])) by (service)
                /
                sum(rate(http_requests_total{namespace="flamoral"}[5m])) by (service)
              ) > 0.05
            for: 5m
            labels:
              severity: critical
              namespace: flamoral
            annotations:
              summary: "High error rate in {{ $labels.service }}"
              description: "Service {{ $labels.service }} has error rate of {{ $value | humanizePercentage }} (threshold: 5%)"
              runbook_url: "https://runbooks.flamoral.com/high-error-rate"

          # Service Down
          - alert: FlamoralServiceDown
            expr: up{namespace="flamoral"} == 0
            for: 2m
            labels:
              severity: critical
              namespace: flamoral
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "Service {{ $labels.job }} has been unreachable for more than 2 minutes"
              runbook_url: "https://runbooks.flamoral.com/service-down"

          # High Response Latency (p95 > 2s)
          - alert: FlamoralHighLatency
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket{namespace="flamoral"}[5m])) by (service, le)
              ) > 2
            for: 10m
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "High response latency in {{ $labels.service }}"
              description: "Service {{ $labels.service }} p95 latency is {{ $value }}s (threshold: 2s)"

          # Pod Restart Alert
          - alert: FlamoralPodRestart
            expr: |
              increase(kube_pod_container_status_restarts_total{namespace="flamoral"}[1h]) > 3
            for: 5m
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "Pod {{ $labels.pod }} restarting frequently"
              description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour"
              runbook_url: "https://runbooks.flamoral.com/pod-restart"

      # Infrastructure Alerts
      - name: flamoral.infrastructure
        interval: 30s
        rules:
          # High Memory Usage (>80%)
          - alert: FlamoralHighMemoryUsage
            expr: |
              (
                container_memory_working_set_bytes{namespace="flamoral"}
                /
                container_spec_memory_limit_bytes{namespace="flamoral"}
              ) > 0.8
            for: 10m
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "High memory usage in {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of memory limit"
              runbook_url: "https://runbooks.flamoral.com/high-memory"

          # Critical Memory Usage (>90%)
          - alert: FlamoralCriticalMemoryUsage
            expr: |
              (
                container_memory_working_set_bytes{namespace="flamoral"}
                /
                container_spec_memory_limit_bytes{namespace="flamoral"}
              ) > 0.9
            for: 5m
            labels:
              severity: critical
              namespace: flamoral
            annotations:
              summary: "Critical memory usage in {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of memory limit - OOMKill risk"

          # High CPU Usage
          - alert: FlamoralHighCPUUsage
            expr: |
              (
                sum(rate(container_cpu_usage_seconds_total{namespace="flamoral"}[5m])) by (pod)
                /
                sum(kube_pod_container_resource_limits{namespace="flamoral",resource="cpu"}) by (pod)
              ) > 0.8
            for: 15m
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "High CPU usage in {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of CPU limit"

          # Certificate Expiry Warning (7 days)
          - alert: FlamoralCertificateExpiringSoon
            expr: |
              (probe_ssl_earliest_cert_expiry - time()) / 86400 < 7
            for: 1h
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "TLS certificate expiring soon"
              description: "TLS certificate for {{ $labels.instance }} expires in {{ $value | humanize }} days"
              runbook_url: "https://runbooks.flamoral.com/certificate-expiry"

          # Certificate Expiry Critical (3 days)
          - alert: FlamoralCertificateExpiringCritical
            expr: |
              (probe_ssl_earliest_cert_expiry - time()) / 86400 < 3
            for: 30m
            labels:
              severity: critical
              namespace: flamoral
            annotations:
              summary: "TLS certificate expiring very soon!"
              description: "TLS certificate for {{ $labels.instance }} expires in {{ $value | humanize }} days - IMMEDIATE ACTION REQUIRED"

      # Kubernetes Alerts
      - name: flamoral.kubernetes
        interval: 30s
        rules:
          # Deployment Replicas Mismatch
          - alert: FlamoralDeploymentReplicasMismatch
            expr: |
              kube_deployment_spec_replicas{namespace="flamoral"}
              !=
              kube_deployment_status_replicas_available{namespace="flamoral"}
            for: 15m
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "Deployment {{ $labels.deployment }} has unhealthy replicas"
              description: "Deployment {{ $labels.deployment }} desired replicas do not match available replicas"

          # HPA at Max Capacity
          - alert: FlamoralHPAMaxedOut
            expr: |
              kube_horizontalpodautoscaler_status_current_replicas{namespace="flamoral"}
              ==
              kube_horizontalpodautoscaler_spec_max_replicas{namespace="flamoral"}
            for: 30m
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "HPA {{ $labels.horizontalpodautoscaler }} at max capacity"
              description: "HPA {{ $labels.horizontalpodautoscaler }} is at maximum replicas - consider increasing max"

          # PVC Usage High
          - alert: FlamoralPVCUsageHigh
            expr: |
              (
                kubelet_volume_stats_used_bytes{namespace="flamoral"}
                /
                kubelet_volume_stats_capacity_bytes{namespace="flamoral"}
              ) > 0.85
            for: 10m
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} usage high"
              description: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

      # Business Metrics Alerts
      - name: flamoral.business
        interval: 1m
        rules:
          # Low Active Users
          - alert: FlamoralLowActiveUsers
            expr: |
              sum(increase(flamoral_active_users_total[1h])) < 100
            for: 1h
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "Low active user count"
              description: "Only {{ $value }} active users in the last hour (expected: >100)"

          # High Message Failure Rate
          - alert: FlamoralHighMessageFailureRate
            expr: |
              (
                sum(rate(flamoral_messages_failed_total[5m]))
                /
                sum(rate(flamoral_messages_total[5m]))
              ) > 0.01
            for: 10m
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "High message failure rate"
              description: "Message failure rate is {{ $value | humanizePercentage }}"

          # WebSocket Connection Issues
          - alert: FlamoralWebSocketIssues
            expr: |
              rate(flamoral_websocket_disconnects_total[5m]) > 10
            for: 10m
            labels:
              severity: warning
              namespace: flamoral
            annotations:
              summary: "High WebSocket disconnect rate"
              description: "{{ $value }} WebSocket disconnections per second"
