# Kustomization for Flamoral Monitoring Stack
# Apply with: kubectl apply -k infrastructure/kubernetes/monitoring/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

commonLabels:
  app.kubernetes.io/part-of: flamoral-monitoring
  environment: production
  team: platform-engineering

resources:
  - service-monitors.yaml
  - grafana-flamoral-dashboard.yaml
  - grafana-ingress.yaml
  # Note: alertmanager-secrets.yaml should be applied separately with actual values
  # - alertmanager-secrets.yaml

# The main kube-prometheus-stack is installed via Helm
# These are additional resources that extend the base installation
