# Grafana Ingress for monitoring.flamoral.com
# This is configured separately in case you want to apply it independently
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  labels:
    app: grafana
    environment: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - monitoring.flamoral.com
      secretName: grafana-tls
  rules:
    - host: monitoring.flamoral.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flamoral-prometheus-grafana
                port:
                  number: 80

---
# Prometheus Ingress (optional - for direct access)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: monitoring
  labels:
    app: prometheus
    environment: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Basic auth for security
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Prometheus Authentication Required"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - prometheus.flamoral.com
      secretName: prometheus-tls
  rules:
    - host: prometheus.flamoral.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flamoral-prometheus-prometheus
                port:
                  number: 9090

---
# Alertmanager Ingress (optional - for direct access)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager-ingress
  namespace: monitoring
  labels:
    app: alertmanager
    environment: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Basic auth for security
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: alertmanager-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Alertmanager Authentication Required"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - alertmanager.flamoral.com
      secretName: alertmanager-tls
  rules:
    - host: alertmanager.flamoral.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flamoral-prometheus-alertmanager
                port:
                  number: 9093
