---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: flamoral-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: flamoralprodacr.azurecr.io/auth-service:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          value: "postgresql.flamoral-prod.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "flamoral"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: DB_PASSWORD
        - name: REDIS_HOST
          value: "redis-master.flamoral-prod.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: JWT_SECRET
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: JWT_ACCESS_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: JWT_REFRESH_SECRET
        - name: INTERNAL_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: INTERNAL_SERVICE_KEY
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: flamoral-prod
spec:
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001
---
