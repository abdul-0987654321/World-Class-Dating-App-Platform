# ============================================================================
# AI Services VPAs (in flamoral-ai namespace)
# ============================================================================

# AI Recommendation Service
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ai-recommendation-vpa
  namespace: flamoral-ai
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-recommendation-service
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
    - containerName: ai-recommendation
      minAllowed:
        cpu: 1000m
        memory: 2Gi
      maxAllowed:
        cpu: 8000m
        memory: 16Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits

