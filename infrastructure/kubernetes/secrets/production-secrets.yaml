# =============================================================================
# Flamoral Dating Platform - Production Secrets Template
# =============================================================================
# SECURITY CRITICAL: This file is a template showing structure only
#
# IMPORTANT INSTRUCTIONS:
# 1. NEVER commit actual secrets to version control
# 2. ALL sensitive values MUST be stored in Azure Key Vault
# 3. Use Azure Key Vault CSI Driver or External Secrets Operator
# 4. For local testing only, create secrets manually with kubectl
#
# Recommended Approaches (in order of preference):
# 1. Azure Key Vault with AAD Pod Identity/Workload Identity
# 2. External Secrets Operator with Azure Key Vault
# 3. Sealed Secrets for GitOps workflow
# 4. Manual kubectl create secret (for testing only)
#
# Last Updated: 2025-12-11
# =============================================================================

---
# Example of how to reference Azure Key Vault Secrets
# This is the RECOMMENDED approach for production
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: flamoral-production-secrets
  namespace: flamoral
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""  # Add your User Assigned Identity Client ID
    keyvaultName: "flamoral-prod-kv"
    cloudName: "AzurePublicCloud"
    tenantId: ""  # Add your Azure Tenant ID
    objects: |
      array:
        # Database Credentials
        - |
          objectName: DB-PASSWORD
          objectType: secret
          objectVersion: ""
        - |
          objectName: DATABASE-URL
          objectType: secret
          objectVersion: ""
        - |
          objectName: DB-READ-REPLICA-1-URL
          objectType: secret
          objectVersion: ""
        - |
          objectName: DB-READ-REPLICA-2-URL
          objectType: secret
          objectVersion: ""

        # Service Database URLs
        - |
          objectName: USER-SERVICE-DATABASE-URL
          objectType: secret
          objectVersion: ""
        - |
          objectName: AUTH-SERVICE-DATABASE-URL
          objectType: secret
          objectVersion: ""
        - |
          objectName: MATCHING-SERVICE-DATABASE-URL
          objectType: secret
          objectVersion: ""
        - |
          objectName: ANALYTICS-SERVICE-DATABASE-URL
          objectType: secret
          objectVersion: ""
        - |
          objectName: PAYMENT-SERVICE-DATABASE-URL
          objectType: secret
          objectVersion: ""
        - |
          objectName: ADMIN-SERVICE-DATABASE-URL
          objectType: secret
          objectVersion: ""

        # MongoDB
        - |
          objectName: MONGODB-URI
          objectType: secret
          objectVersion: ""

        # Redis
        - |
          objectName: REDIS-PASSWORD
          objectType: secret
          objectVersion: ""
        - |
          objectName: REDIS-URL
          objectType: secret
          objectVersion: ""

        # Message Queue
        - |
          objectName: AZURE-SERVICE-BUS-CONNECTION-STRING
          objectType: secret
          objectVersion: ""

        # JWT Secrets
        - |
          objectName: JWT-SECRET
          objectType: secret
          objectVersion: ""
        - |
          objectName: JWT-ACCESS-SECRET
          objectType: secret
          objectVersion: ""
        - |
          objectName: JWT-REFRESH-SECRET
          objectType: secret
          objectVersion: ""

        # Service Authentication
        - |
          objectName: SERVICE-API-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: SESSION-SECRET
          objectType: secret
          objectVersion: ""

        # OAuth Secrets
        - |
          objectName: GOOGLE-CLIENT-SECRET
          objectType: secret
          objectVersion: ""
        - |
          objectName: FACEBOOK-APP-SECRET
          objectType: secret
          objectVersion: ""
        - |
          objectName: APPLE-PRIVATE-KEY
          objectType: secret
          objectVersion: ""

        # Payment Gateway
        - |
          objectName: STRIPE-SECRET-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: STRIPE-WEBHOOK-SECRET
          objectType: secret
          objectVersion: ""

        # Email Service
        - |
          objectName: SENDGRID-API-KEY
          objectType: secret
          objectVersion: ""

        # SMS Service
        - |
          objectName: TWILIO-AUTH-TOKEN
          objectType: secret
          objectVersion: ""

        # Azure Storage
        - |
          objectName: AZURE-STORAGE-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: AZURE-STORAGE-CONNECTION-STRING
          objectType: secret
          objectVersion: ""

        # Azure Cognitive Services
        - |
          objectName: AZURE-FACE-API-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: AZURE-CONTENT-MODERATOR-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: AZURE-COMPUTER-VISION-KEY
          objectType: secret
          objectVersion: ""

        # Agora (Video/Voice)
        - |
          objectName: AGORA-APP-CERTIFICATE
          objectType: secret
          objectVersion: ""
        - |
          objectName: AGORA-CUSTOMER-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: AGORA-CUSTOMER-SECRET
          objectType: secret
          objectVersion: ""

        # Firebase
        - |
          objectName: FIREBASE-PRIVATE-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: FCM-SERVER-KEY
          objectType: secret
          objectVersion: ""

        # Error Tracking
        - |
          objectName: SENTRY-DSN
          objectType: secret
          objectVersion: ""

        # AI Services
        - |
          objectName: AI-MODEL-API-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: OPENAI-API-KEY
          objectType: secret
          objectVersion: ""

        # Monitoring
        - |
          objectName: APPLICATION-INSIGHTS-CONNECTION-STRING
          objectType: secret
          objectVersion: ""
        - |
          objectName: APPLICATION-INSIGHTS-INSTRUMENTATION-KEY
          objectType: secret
          objectVersion: ""

        # Search Service
        - |
          objectName: ELASTICSEARCH-PASSWORD
          objectType: secret
          objectVersion: ""

        # Analytics
        - |
          objectName: MIXPANEL-TOKEN
          objectType: secret
          objectVersion: ""
        - |
          objectName: SEGMENT-WRITE-KEY
          objectType: secret
          objectVersion: ""

        # Geolocation
        - |
          objectName: GOOGLE-MAPS-API-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: MAPBOX-ACCESS-TOKEN
          objectType: secret
          objectVersion: ""

        # Support Services
        - |
          objectName: ZENDESK-API-TOKEN
          objectType: secret
          objectVersion: ""

        # Alerting
        - |
          objectName: PAGERDUTY-INTEGRATION-KEY
          objectType: secret
          objectVersion: ""
        - |
          objectName: SLACK-WEBHOOK-URL
          objectType: secret
          objectVersion: ""

        # Azure Key Vault (for nested scenarios)
        - |
          objectName: KEY-VAULT-CLIENT-SECRET
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: flamoral-production-secrets
      type: Opaque
      data:
        - objectName: DB-PASSWORD
          key: DB_PASSWORD
        - objectName: DATABASE-URL
          key: DATABASE_URL
        - objectName: REDIS-PASSWORD
          key: REDIS_PASSWORD
        - objectName: REDIS-URL
          key: REDIS_URL
        - objectName: JWT-SECRET
          key: JWT_SECRET
        - objectName: JWT-ACCESS-SECRET
          key: JWT_ACCESS_SECRET
        - objectName: JWT-REFRESH-SECRET
          key: JWT_REFRESH_SECRET
        - objectName: SERVICE-API-KEY
          key: SERVICE_API_KEY
        - objectName: SESSION-SECRET
          key: SESSION_SECRET
        - objectName: STRIPE-SECRET-KEY
          key: STRIPE_SECRET_KEY
        - objectName: STRIPE-WEBHOOK-SECRET
          key: STRIPE_WEBHOOK_SECRET
        - objectName: SENDGRID-API-KEY
          key: SENDGRID_API_KEY
        - objectName: TWILIO-AUTH-TOKEN
          key: TWILIO_AUTH_TOKEN
        - objectName: AZURE-STORAGE-KEY
          key: AZURE_STORAGE_KEY
        - objectName: AZURE-STORAGE-CONNECTION-STRING
          key: AZURE_STORAGE_CONNECTION_STRING
        - objectName: OPENAI-API-KEY
          key: OPENAI_API_KEY
        - objectName: SENTRY-DSN
          key: SENTRY_DSN

---
# Alternative: Manual Secret Creation (FOR TESTING ONLY - NOT FOR PRODUCTION)
# This is provided as a reference for local testing
# Use the Azure Key Vault approach shown above for production
#
# To create manually (DO NOT commit the actual values file):
# kubectl create secret generic flamoral-production-secrets \
#   --from-env-file=.env.production.secrets \
#   --namespace=flamoral-prod \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# Example structure (DO NOT USE THIS IN PRODUCTION):
# apiVersion: v1
# kind: Secret
# metadata:
#   name: flamoral-production-secrets
#   namespace: flamoral
# type: Opaque
# stringData:
#   DB_PASSWORD: "*** NEVER COMMIT ACTUAL VALUES ***"
#   DATABASE_URL: "*** STORE IN AZURE KEY VAULT ***"
#   # ... other secrets

---
# External Secrets Operator Alternative
# If using External Secrets Operator instead of CSI Driver
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-production-secrets
  namespace: flamoral
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: flamoral-production-secrets
    creationPolicy: Owner
  data:
    # Database
    - secretKey: DB_PASSWORD
      remoteRef:
        key: DB-PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE-URL

    # Redis
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS-PASSWORD
    - secretKey: REDIS_URL
      remoteRef:
        key: REDIS-URL

    # JWT Secrets
    - secretKey: JWT_SECRET
      remoteRef:
        key: JWT-SECRET
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: JWT-ACCESS-SECRET
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: JWT-REFRESH-SECRET

    # Service Authentication
    - secretKey: SERVICE_API_KEY
      remoteRef:
        key: SERVICE-API-KEY
    - secretKey: SESSION_SECRET
      remoteRef:
        key: SESSION-SECRET

    # Payment
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: STRIPE-SECRET-KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: STRIPE-WEBHOOK-SECRET

    # Communications
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: SENDGRID-API-KEY
    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: TWILIO-AUTH-TOKEN

    # Azure Services
    - secretKey: AZURE_STORAGE_KEY
      remoteRef:
        key: AZURE-STORAGE-KEY
    - secretKey: AZURE_STORAGE_CONNECTION_STRING
      remoteRef:
        key: AZURE-STORAGE-CONNECTION-STRING
    - secretKey: AZURE_SERVICE_BUS_CONNECTION_STRING
      remoteRef:
        key: AZURE-SERVICE-BUS-CONNECTION-STRING

    # AI Services
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OPENAI-API-KEY
    - secretKey: AI_MODEL_API_KEY
      remoteRef:
        key: AI-MODEL-API-KEY

    # Monitoring
    - secretKey: SENTRY_DSN
      remoteRef:
        key: SENTRY-DSN
    - secretKey: APPLICATION_INSIGHTS_CONNECTION_STRING
      remoteRef:
        key: APPLICATION-INSIGHTS-CONNECTION-STRING

---
# SecretStore for External Secrets Operator
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-store
  namespace: flamoral
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultUrl: "https://flamoral-prod-kv.vault.azure.net"
      identityId: ""  # Add your Managed Identity Client ID

---
# =============================================================================
# Usage Instructions
# =============================================================================
#
# Approach 1: Azure Key Vault CSI Driver (Recommended)
# ------------------------------------------------------
# 1. Install CSI Driver:
#    helm repo add csi-secrets-store-provider-azure \
#      https://azure.github.io/secrets-store-csi-driver-provider-azure/charts
#    helm install csi-secrets-store-provider-azure/csi-secrets-store-provider-azure \
#      --generate-name --namespace kube-system
#
# 2. Enable Managed Identity on AKS
# 3. Grant Key Vault access to the managed identity
# 4. Update the SecretProviderClass with your values
# 5. Mount secrets in deployment using volumeMount
#
# Approach 2: External Secrets Operator
# --------------------------------------
# 1. Install External Secrets Operator:
#    helm repo add external-secrets https://charts.external-secrets.io
#    helm install external-secrets external-secrets/external-secrets \
#      --namespace external-secrets-system --create-namespace
#
# 2. Create SecretStore (shown above)
# 3. Create ExternalSecret (shown above)
# 4. Secrets are automatically synced from Azure Key Vault
#
# Approach 3: Manual Secret Management (Testing Only)
# ----------------------------------------------------
# 1. Create a .env.production.secrets file with actual values
# 2. kubectl create secret generic flamoral-production-secrets \
#      --from-env-file=.env.production.secrets \
#      --namespace=flamoral-prod
# 3. DELETE the .env.production.secrets file immediately
# 4. NEVER commit secrets to version control
#
# =============================================================================
# Verification
# =============================================================================
#
# Check secrets exist:
#   kubectl get secrets -n flamoral-prod
#
# Verify secret keys (DO NOT view values in production):
#   kubectl describe secret flamoral-production-secrets -n flamoral-prod
#
# Test secret access from pod:
#   kubectl run test-pod --rm -it --image=busybox \
#     --overrides='{"spec":{"serviceAccountName":"flamoral-sa"}}' \
#     -- sh
#
# =============================================================================
