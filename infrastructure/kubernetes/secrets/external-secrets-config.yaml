apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: flamoral-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-database-secrets
  namespace: flamoral-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: database-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: flamoral/prod/database
        property: password
    - secretKey: DB_USER
      remoteRef:
        key: flamoral/prod/database
        property: username
    - secretKey: DATABASE_URL
      remoteRef:
        key: flamoral/prod/database
        property: connection_string
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-redis-secrets
  namespace: flamoral-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: redis-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: flamoral/prod/redis
        property: auth_token
    - secretKey: REDIS_URL
      remoteRef:
        key: flamoral/prod/redis
        property: connection_string
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-jwt-secrets
  namespace: flamoral-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: jwt-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: flamoral/prod/jwt
        property: access_secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: flamoral/prod/jwt
        property: refresh_secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-api-secrets
  namespace: flamoral-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: flamoral/prod/stripe
        property: secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: flamoral/prod/stripe
        property: webhook_secret
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: flamoral/prod/sendgrid
        property: api_key
    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: flamoral/prod/twilio
        property: auth_token
    - secretKey: SENTRY_DSN
      remoteRef:
        key: flamoral/prod/sentry
        property: dsn
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flamoral-cognito-secrets
  namespace: flamoral-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: cognito-secrets
    creationPolicy: Owner
  data:
    - secretKey: COGNITO_CLIENT_ID
      remoteRef:
        key: flamoral/prod/cognito
        property: client_id
    - secretKey: COGNITO_CLIENT_SECRET
      remoteRef:
        key: flamoral/prod/cognito
        property: client_secret
