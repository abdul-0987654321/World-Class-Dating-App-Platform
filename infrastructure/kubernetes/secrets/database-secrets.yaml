# =============================================================================
# Flamoral Dating Platform - Database Secrets Configuration
# =============================================================================
# This file contains Kubernetes secret templates for PostgreSQL and Redis.
# NOTE: In production, use External Secrets Operator with Azure Key Vault
#       (see external-secrets-config.yaml) instead of plain secrets.
#
# For manual deployment, replace placeholders and apply:
#   kubectl apply -f database-secrets.yaml -n flamoral
# =============================================================================

---
# PostgreSQL Credentials Secret
# Contains connection details for Azure Database for PostgreSQL
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: flamoral
  labels:
    app.kubernetes.io/name: postgres-credentials
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flamoral-platform
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "PostgreSQL connection credentials for Flamoral services"
    azure.database.server: "flamoral-prod-db"
type: Opaque
stringData:
  # Database server configuration
  host: "flamoral-prod-db.postgres.database.azure.com"
  port: "5432"
  username: "flamoraladmin"
  # IMPORTANT: Replace with actual password from Azure portal or Key Vault
  password: "${POSTGRES_PASSWORD}"
  ssl-mode: "require"

  # Default database
  database: "flamoral_users"

  # Per-service connection strings
  # Auth Service Database
  auth-database-url: "postgresql://flamoraladmin:${POSTGRES_PASSWORD}@flamoral-prod-db.postgres.database.azure.com:5432/flamoral_auth?sslmode=require"

  # User Service Database
  users-database-url: "postgresql://flamoraladmin:${POSTGRES_PASSWORD}@flamoral-prod-db.postgres.database.azure.com:5432/flamoral_users?sslmode=require"

  # Matching Service Database
  matching-database-url: "postgresql://flamoraladmin:${POSTGRES_PASSWORD}@flamoral-prod-db.postgres.database.azure.com:5432/flamoral_matching?sslmode=require"

  # Messaging Service Database
  messaging-database-url: "postgresql://flamoraladmin:${POSTGRES_PASSWORD}@flamoral-prod-db.postgres.database.azure.com:5432/flamoral_messaging?sslmode=require"

  # Generic connection string (used as DATABASE_URL)
  connection-string: "postgresql://flamoraladmin:${POSTGRES_PASSWORD}@flamoral-prod-db.postgres.database.azure.com:5432/flamoral_users?sslmode=require"

---
# Redis Credentials Secret
# Contains connection details for Azure Cache for Redis
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: flamoral
  labels:
    app.kubernetes.io/name: redis-credentials
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: flamoral-platform
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Redis connection credentials for Flamoral services"
    azure.cache.name: "flamoral-prod-redis"
type: Opaque
stringData:
  # Redis server configuration
  host: "flamoral-prod-redis.redis.cache.windows.net"
  port: "6380"
  # IMPORTANT: Replace with actual key from Azure portal or Key Vault
  password: "${REDIS_PRIMARY_KEY}"
  tls-enabled: "true"

  # Connection string format for node-redis / ioredis
  connection-string: "rediss://:${REDIS_PRIMARY_KEY}@flamoral-prod-redis.redis.cache.windows.net:6380"

  # Alternative format for some libraries
  url: "rediss://:${REDIS_PRIMARY_KEY}@flamoral-prod-redis.redis.cache.windows.net:6380"

---
# ConfigMap for non-sensitive database configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: flamoral
  labels:
    app.kubernetes.io/name: database-config
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: flamoral-platform
data:
  # PostgreSQL Configuration
  POSTGRES_HOST: "flamoral-prod-db.postgres.database.azure.com"
  POSTGRES_PORT: "5432"
  POSTGRES_SSL_MODE: "require"
  POSTGRES_USER: "flamoraladmin"

  # Database names per service
  AUTH_DATABASE: "flamoral_auth"
  USERS_DATABASE: "flamoral_users"
  MATCHING_DATABASE: "flamoral_matching"
  MESSAGING_DATABASE: "flamoral_messaging"

  # Redis Configuration
  REDIS_HOST: "flamoral-prod-redis.redis.cache.windows.net"
  REDIS_PORT: "6380"
  REDIS_TLS_ENABLED: "true"

  # Connection pool settings
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  DB_CONNECTION_TIMEOUT: "30000"
  DB_IDLE_TIMEOUT: "10000"

  # Redis settings
  REDIS_MAX_RETRIES: "3"
  REDIS_RETRY_DELAY: "1000"
  REDIS_CONNECT_TIMEOUT: "10000"
