apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: flamoral
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: nginx-config
        configMap:
          name: api-gateway-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: flamoral
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      upstream auth_backend {
        server auth-service:3011;
      }
      upstream messaging_backend {
        server messaging-service:3003;
      }

      server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
          return 200 'OK';
          add_header Content-Type text/plain;
        }

        # Auth service routes
        location /api/v1/auth/ {
          proxy_pass http://auth_backend/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth service health
        location = /api/v1/auth/health {
          proxy_pass http://auth_backend/health;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
        }

        # Messaging service routes
        location /api/v1/messages {
          proxy_pass http://messaging_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }

        location /api/v1/conversations {
          proxy_pass http://messaging_backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support for realtime messaging
        location /socket.io {
          proxy_pass http://messaging_backend;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default - serve static files or return 404
        location / {
          return 404 '{"error": "Not Found"}';
          add_header Content-Type application/json;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: flamoral
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
