apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service
  namespace: flamoral
  labels:
    app: messaging-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messaging-service
  template:
    metadata:
      labels:
        app: messaging-service
    spec:
      containers:
      - name: messaging-service
        image: flamoralprodacr.azurecr.io/messaging-service:${IMAGE_TAG}
        ports:
        - containerPort: 3003
        env:
        - name: PORT
          value: "3003"
        - name: NODE_ENV
          value: "production"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: COSMOS_ENDPOINT
          value: "https://flamoral-cosmos.documents.azure.com:443/"
        - name: COSMOS_KEY
          valueFrom:
            secretKeyRef:
              name: cosmos-secrets
              key: COSMOS_KEY
        - name: COSMOS_DATABASE_ID
          value: "Flamoral"
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: JWT_ACCESS_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-service
  namespace: flamoral
spec:
  selector:
    app: messaging-service
  ports:
  - port: 3003
    targetPort: 3003
  type: ClusterIP
