---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: flamoral
---
# ConfigMap for Web App
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-config
  namespace: flamoral
data:
  default.conf: |
    server {
        listen 80;
        server_name flamoral.com www.flamoral.com;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location /api/ {
            proxy_pass http://api-gateway.flamoral.svc.cluster.local/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flamoral - Find Your Perfect Match</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
            }
            .container {
                text-align: center;
                padding: 40px;
                max-width: 600px;
            }
            .logo {
                font-size: 4rem;
                margin-bottom: 20px;
            }
            h1 {
                font-size: 3rem;
                margin-bottom: 20px;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            }
            p {
                font-size: 1.25rem;
                margin-bottom: 30px;
                opacity: 0.9;
            }
            .btn {
                display: inline-block;
                padding: 15px 40px;
                background: white;
                color: #667eea;
                text-decoration: none;
                border-radius: 50px;
                font-weight: bold;
                font-size: 1.1rem;
                transition: transform 0.3s, box-shadow 0.3s;
            }
            .btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            }
            .features {
                display: flex;
                justify-content: center;
                gap: 30px;
                margin-top: 40px;
                flex-wrap: wrap;
            }
            .feature {
                background: rgba(255,255,255,0.1);
                padding: 20px;
                border-radius: 15px;
                width: 150px;
            }
            .feature-icon {
                font-size: 2rem;
                margin-bottom: 10px;
            }
            .status {
                margin-top: 40px;
                padding: 10px 20px;
                background: rgba(0,255,0,0.2);
                border-radius: 20px;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="logo">💕</div>
            <h1>Flamoral</h1>
            <p>Where meaningful connections begin. Discover your perfect match with our intelligent matching algorithm.</p>
            <a href="#" class="btn">Coming Soon</a>
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🔒</div>
                    <div>Verified Profiles</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">💬</div>
                    <div>Real-time Chat</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📹</div>
                    <div>Video Calls</div>
                </div>
            </div>
            <div class="status">✓ Platform Live</div>
        </div>
    </body>
    </html>
---
# Web App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flamoral-web
  namespace: flamoral
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flamoral-web
  template:
    metadata:
      labels:
        app: flamoral-web
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: config
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: web-app-config
---
# Web App Service
apiVersion: v1
kind: Service
metadata:
  name: flamoral-web
  namespace: flamoral
spec:
  selector:
    app: flamoral-web
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
# NOTE: API Gateway is defined in infrastructure/kubernetes/services/all-services-manifests.yaml
# This file only contains web app and ingress resources
---
# Ingress with TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flamoral-ingress
  namespace: flamoral
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - flamoral.com
    - www.flamoral.com
    - api.flamoral.com
    secretName: flamoral-tls
  rules:
  - host: flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flamoral-web
            port:
              number: 80
  - host: www.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flamoral-web
            port:
              number: 80
  - host: api.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
