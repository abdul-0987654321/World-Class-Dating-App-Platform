---
# Backend Services Production Deployment
# Cluster: flamoral-prod-aks (westus2)
# ACR: flamoralprodacr.azurecr.io
# Namespace: flamoral
---
# Auth Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: flamoral
  labels:
    app: auth-service
    team: backend
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        team: backend
        version: v1.0.0
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: auth-service
        image: flamoralprodacr.azurecr.io/auth-service:v1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3001
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
# Auth Service ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: flamoral
  labels:
    app: auth-service
    team: backend
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: http
    protocol: TCP
    name: http
---
