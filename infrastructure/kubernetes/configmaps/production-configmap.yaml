apiVersion: v1
kind: ConfigMap
metadata:
  name: flamoral-config
  namespace: flamoral-prod
  labels:
    app: flamoral
    environment: production
data:
  # Environment
  NODE_ENV: "production"
  ENVIRONMENT: "prod"

  # API Configuration
  API_HOST: "api.flamoral.app"
  WEB_URL: "https://flamoral.app"
  API_URL: "https://api.flamoral.app"

  # AWS Region
  AWS_REGION: "us-east-1"

  # Database - Aurora PostgreSQL
  DB_HOST: "flamoral-prod-aurora.cluster-xxxxxxxxxxxx.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "flamoral_prod"
  DB_POOL_MIN: "5"
  DB_POOL_MAX: "20"

  # Cache - ElastiCache Redis
  REDIS_HOST: "flamoral-prod-redis.xxxxxxxxxxxx.use1.cache.amazonaws.com"
  REDIS_PORT: "6379"
  REDIS_TLS: "true"

  # AWS S3 Storage
  AWS_S3_BUCKET_MEDIA: "flamoral-prod-media"
  AWS_S3_BUCKET_PHOTOS: "flamoral-prod-photos"
  AWS_S3_BUCKET_VIDEOS: "flamoral-prod-videos"

  # AWS Cognito
  COGNITO_USER_POOL_ID: "us-east-1_xxxxxxxxx"
  COGNITO_REGION: "us-east-1"

  # AWS SQS Queues
  AWS_SQS_MATCHING_QUEUE: "flamoral-prod-matching"
  AWS_SQS_NOTIFICATIONS_QUEUE: "flamoral-prod-notifications"
  AWS_SQS_MODERATION_QUEUE: "flamoral-prod-moderation"

  # AWS SNS Topics
  AWS_SNS_ALERTS_TOPIC: "arn:aws:sns:us-east-1:xxxxxxxxxxxx:flamoral-prod-alerts"

  # CloudFront CDN
  CDN_URL: "https://cdn.flamoral.app"
  CLOUDFRONT_DISTRIBUTION_ID: "EXXXXXXXXXX"

  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"

  # Feature Flags
  FEATURE_AI_MATCHING: "true"
  FEATURE_VIDEO_CALLS: "true"
  FEATURE_TRAVEL_MODE: "true"
  FEATURE_DATING_COACH: "true"
  FEATURE_GAMIFICATION: "true"

  # Session
  SESSION_MAX_AGE: "86400000"

  # File Upload Limits
  MAX_FILE_SIZE: "10485760"
  MAX_PHOTO_COUNT: "10"
  MAX_VIDEO_SIZE: "52428800"

  # WebSocket
  WS_HEARTBEAT_INTERVAL: "30000"
  WS_HEARTBEAT_TIMEOUT: "60000"

  # CORS
  CORS_ORIGIN: "https://flamoral.app,https://www.flamoral.app"
  CORS_CREDENTIALS: "true"
