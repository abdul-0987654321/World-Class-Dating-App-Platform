---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: flamoral-dating
  labels:
    app: auth-service
    component: backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: flamoral-dating
  labels:
    app: auth-service
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3002"
  REDIS_HOST: "redis-cluster.flamoral-dating.svc.cluster.local"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres-primary.flamoral-dating.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "flamoral_auth"
  JAEGER_AGENT_HOST: "jaeger-agent.monitoring.svc.cluster.local"
  JAEGER_AGENT_PORT: "6831"
  METRICS_PORT: "9090"
  TOKEN_EXPIRY: "3600"
  REFRESH_TOKEN_EXPIRY: "604800"
  MAX_LOGIN_ATTEMPTS: "5"
  LOCKOUT_DURATION: "900"

---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: flamoral-dating
  labels:
    app: auth-service
type: Opaque
stringData:
  POSTGRES_USER: "flamoral_auth"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  JWT_REFRESH_SECRET: "CHANGE_ME_IN_PRODUCTION"
  ENCRYPTION_KEY: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  OAUTH_GOOGLE_CLIENT_ID: "CHANGE_ME_IN_PRODUCTION"
  OAUTH_GOOGLE_CLIENT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  OAUTH_FACEBOOK_CLIENT_ID: "CHANGE_ME_IN_PRODUCTION"
  OAUTH_FACEBOOK_CLIENT_SECRET: "CHANGE_ME_IN_PRODUCTION"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: flamoral-dating
  labels:
    app: auth-service
    version: v1
    component: backend
spec:
  replicas: 5
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        version: v1
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: auth-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - auth-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: auth-service
        image: flamoralprodacr.azurecr.io/auth-service:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3002
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: auth-service-config
        - secretRef:
            name: auth-service-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: flamoral-dating
  labels:
    app: auth-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - port: 3002
    targetPort: http
    protocol: TCP
    name: http
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: auth-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: flamoral-dating
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: auth-service

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-network-policy
  namespace: flamoral-dating
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: flamoral-dating
    ports:
    - protocol: TCP
      port: 3002
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
  - ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
