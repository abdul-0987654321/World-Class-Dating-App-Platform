# ============================================================================
# API GATEWAY
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: flamoral-dating
  labels:
    app: api-gateway

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: flamoral-dating
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_HOST: "redis-cluster.flamoral-dating.svc.cluster.local"
  METRICS_PORT: "9090"
  RATE_LIMIT_WINDOW: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  CORS_ORIGINS: "https://flamoral.com,https://app.flamoral.com"
  USER_SERVICE_URL: "http://user-service:3001"
  AUTH_SERVICE_URL: "http://auth-service:3002"
  MATCHING_SERVICE_URL: "http://matching-service:3003"
  MESSAGING_SERVICE_URL: "http://messaging-service:3004"
  MEDIA_SERVICE_URL: "http://media-service:3005"
  PAYMENT_SERVICE_URL: "http://payment-service:3006"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3007"

---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: flamoral-dating
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME"
  API_KEY: "CHANGE_ME"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: flamoral-dating
  labels:
    app: api-gateway
    version: v1
spec:
  replicas: 5
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: api-gateway
      containers:
      - name: api-gateway
        image: flamoral/api-gateway:latest
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: flamoral-dating
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    name: http
  - port: 443
    targetPort: 3000
    name: https
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: api-gateway

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: flamoral-dating
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway

---
# ============================================================================
# REALTIME SERVICE (WebSocket)
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: realtime-service
  namespace: flamoral-dating
  labels:
    app: realtime-service

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: realtime-service-config
  namespace: flamoral-dating
data:
  NODE_ENV: "production"
  PORT: "3010"
  WS_PORT: "8080"
  REDIS_HOST: "redis-cluster.flamoral-dating.svc.cluster.local"
  METRICS_PORT: "9090"
  MAX_CONNECTIONS_PER_POD: "10000"

---
apiVersion: v1
kind: Secret
metadata:
  name: realtime-service-secrets
  namespace: flamoral-dating
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-service
  namespace: flamoral-dating
  labels:
    app: realtime-service
    version: v1
spec:
  replicas: 4
  selector:
    matchLabels:
      app: realtime-service
  template:
    metadata:
      labels:
        app: realtime-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: realtime-service
      containers:
      - name: realtime-service
        image: flamoral/realtime-service:latest
        ports:
        - containerPort: 3010
          name: http
        - containerPort: 8080
          name: websocket
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: realtime-service-config
        - secretRef:
            name: realtime-service-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3010
          initialDelaySeconds: 15
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: realtime-service
  namespace: flamoral-dating
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
  - port: 8080
    targetPort: 8080
    name: websocket
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: realtime-service

