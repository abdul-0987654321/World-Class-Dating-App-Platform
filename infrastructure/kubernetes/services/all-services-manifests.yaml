# Flamoral Dating Platform - Complete Kubernetes Manifests for All Services
# This file contains manifests for: notification, media, payment, analytics, moderation,
# api-gateway, realtime, admin, advertising, automation, workflow-engine services

---
# ============================================================================
# NOTIFICATION SERVICE
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: flamoral-dating
  labels:
    app: notification-service

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: flamoral-dating
data:
  NODE_ENV: "production"
  PORT: "3007"
  REDIS_HOST: "redis-cluster.flamoral-dating.svc.cluster.local"
  POSTGRES_HOST: "postgres-primary.flamoral-dating.svc.cluster.local"
  POSTGRES_DB: "flamoral_notifications"
  METRICS_PORT: "9090"
  FCM_ENABLED: "true"
  APNS_ENABLED: "true"
  EMAIL_ENABLED: "true"
  SMS_ENABLED: "true"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"

---
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  namespace: flamoral-dating
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  FCM_SERVER_KEY: "CHANGE_ME"
  APNS_KEY_ID: "CHANGE_ME"
  APNS_TEAM_ID: "CHANGE_ME"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASS: "CHANGE_ME"
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: flamoral-dating
  labels:
    app: notification-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: notification-service
      containers:
      - name: notification-service
        image: flamoral/notification-service:latest
        ports:
        - containerPort: 3007
          name: http
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: notification-service-config
        - secretRef:
            name: notification-service-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3007
          initialDelaySeconds: 15
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: flamoral-dating
spec:
  type: ClusterIP
  ports:
  - port: 3007
    targetPort: 3007
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: notification-service

---
# ============================================================================
# MEDIA SERVICE
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-service
  namespace: flamoral-dating
  labels:
    app: media-service

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: media-service-config
  namespace: flamoral-dating
data:
  NODE_ENV: "production"
  PORT: "3005"
  REDIS_HOST: "redis-cluster.flamoral-dating.svc.cluster.local"
  POSTGRES_HOST: "postgres-primary.flamoral-dating.svc.cluster.local"
  POSTGRES_DB: "flamoral_media"
  METRICS_PORT: "9090"
  S3_BUCKET: "flamoral-media-production"
  S3_REGION: "us-east-1"
  CDN_URL: "https://cdn.flamoral.com"
  MAX_FILE_SIZE: "10485760"
  ALLOWED_TYPES: "image/jpeg,image/png,image/webp,video/mp4"
  IMAGE_OPTIMIZATION: "true"
  THUMBNAIL_SIZES: "150x150,300x300,600x600"

---
apiVersion: v1
kind: Secret
metadata:
  name: media-service-secrets
  namespace: flamoral-dating
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  CLOUDFLARE_API_KEY: "CHANGE_ME"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: flamoral-dating
  labels:
    app: media-service
    version: v1
spec:
  replicas: 4
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: media-service
      containers:
      - name: media-service
        image: flamoral/media-service:latest
        ports:
        - containerPort: 3005
          name: http
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: media-service-config
        - secretRef:
            name: media-service-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3005
          initialDelaySeconds: 20
          periodSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: flamoral-dating
spec:
  type: ClusterIP
  ports:
  - port: 3005
    targetPort: 3005
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: media-service

---
# ============================================================================
# PAYMENT SERVICE
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: flamoral-dating
  labels:
    app: payment-service

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: flamoral-dating
data:
  NODE_ENV: "production"
  PORT: "3006"
  REDIS_HOST: "redis-cluster.flamoral-dating.svc.cluster.local"
  POSTGRES_HOST: "postgres-primary.flamoral-dating.svc.cluster.local"
  POSTGRES_DB: "flamoral_payments"
  METRICS_PORT: "9090"
  STRIPE_WEBHOOK_PATH: "/webhooks/stripe"
  APPLE_WEBHOOK_PATH: "/webhooks/apple"
  GOOGLE_WEBHOOK_PATH: "/webhooks/google"

---
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secrets
  namespace: flamoral-dating
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  STRIPE_SECRET_KEY: "CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "CHANGE_ME"
  APPLE_SHARED_SECRET: "CHANGE_ME"
  GOOGLE_SERVICE_ACCOUNT: "CHANGE_ME"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: flamoral-dating
  labels:
    app: payment-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: payment-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: payment-service
        image: flamoral/payment-service:latest
        ports:
        - containerPort: 3006
          name: http
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: payment-service-config
        - secretRef:
            name: payment-service-secrets
        resources:
          requests:
            memory: "768Mi"
            cpu: "500m"
          limits:
            memory: "1.5Gi"
            cpu: "1500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3006
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3006
          initialDelaySeconds: 15
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: flamoral-dating
spec:
  type: ClusterIP
  ports:
  - port: 3006
    targetPort: 3006
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: payment-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service-pdb
  namespace: flamoral-dating
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payment-service

