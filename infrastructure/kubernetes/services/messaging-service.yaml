---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: messaging-service
  namespace: flamoral-dating
  labels:
    app: messaging-service
    component: backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: messaging-service-config
  namespace: flamoral-dating
  labels:
    app: messaging-service
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3004"
  REDIS_HOST: "redis-cluster.flamoral-dating.svc.cluster.local"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres-primary.flamoral-dating.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "flamoral_messaging"
  MONGODB_HOST: "mongodb.flamoral-dating.svc.cluster.local"
  MONGODB_PORT: "27017"
  MONGODB_DB: "flamoral_messages"
  JAEGER_AGENT_HOST: "jaeger-agent.monitoring.svc.cluster.local"
  JAEGER_AGENT_PORT: "6831"
  METRICS_PORT: "9090"
  KAFKA_BROKERS: "kafka-0.kafka-headless.flamoral-dating.svc.cluster.local:9092,kafka-1.kafka-headless.flamoral-dating.svc.cluster.local:9092"
  MAX_MESSAGE_LENGTH: "2000"
  MESSAGE_RETENTION_DAYS: "90"

---
apiVersion: v1
kind: Secret
metadata:
  name: messaging-service-secrets
  namespace: flamoral-dating
  labels:
    app: messaging-service
type: Opaque
stringData:
  POSTGRES_USER: "flamoral_messaging"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  MONGODB_USER: "flamoral_messaging"
  MONGODB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  ENCRYPTION_KEY: "CHANGE_ME_IN_PRODUCTION"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service
  namespace: flamoral-dating
  labels:
    app: messaging-service
    version: v1
    component: backend
spec:
  replicas: 5
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: messaging-service
  template:
    metadata:
      labels:
        app: messaging-service
        version: v1
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: messaging-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - messaging-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: messaging-service
        image: flamoralprodacr.azurecr.io/messaging-service:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3004
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: messaging-service-config
        - secretRef:
            name: messaging-service-secrets
        resources:
          requests:
            memory: "768Mi"
            cpu: "500m"
          limits:
            memory: "1.5Gi"
            cpu: "1500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: messaging-service
  namespace: flamoral-dating
  labels:
    app: messaging-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
  - port: 3004
    targetPort: http
    protocol: TCP
    name: http
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: messaging-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: messaging-service-pdb
  namespace: flamoral-dating
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: messaging-service

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: messaging-service-network-policy
  namespace: flamoral-dating
spec:
  podSelector:
    matchLabels:
      app: messaging-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: flamoral-dating
    ports:
    - protocol: TCP
      port: 3004
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
    ports:
    - protocol: TCP
      port: 27017
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - podSelector:
        matchLabels:
          app: notification-service
    ports:
    - protocol: TCP
      port: 3007
  - ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
