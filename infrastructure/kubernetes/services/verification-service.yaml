# =============================================================================
# Verification Service - Kubernetes Manifests
# Handles identity verification, photo verification, and trust badges
# =============================================================================

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verification-service
  namespace: flamoral-dating
  labels:
    app: verification-service
    component: backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verification-service-config
  namespace: flamoral-dating
  labels:
    app: verification-service
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3016"
  REDIS_HOST: "redis-cluster.flamoral-dating.svc.cluster.local"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres-primary.flamoral-dating.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "flamoral_verification"
  JAEGER_AGENT_HOST: "jaeger-agent.monitoring.svc.cluster.local"
  JAEGER_AGENT_PORT: "6831"
  METRICS_PORT: "9090"
  # Azure AI Services Configuration
  AZURE_FACE_API_ENDPOINT: "https://flamoral-face.cognitiveservices.azure.com/"
  AZURE_CONTENT_MODERATOR_ENDPOINT: "https://flamoral-moderator.cognitiveservices.azure.com/"
  # Verification Settings
  FACE_MATCH_THRESHOLD: "0.85"
  LIVENESS_CHECK_ENABLED: "true"
  ID_DOCUMENT_TYPES: "passport,driver_license,national_id"
  VERIFICATION_EXPIRY_DAYS: "365"
  MAX_VERIFICATION_ATTEMPTS: "3"

---
apiVersion: v1
kind: Secret
metadata:
  name: verification-service-secrets
  namespace: flamoral-dating
  labels:
    app: verification-service
type: Opaque
stringData:
  POSTGRES_USER: "flamoral_verification"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  AZURE_FACE_API_KEY: "CHANGE_ME_IN_PRODUCTION"
  AZURE_CONTENT_MODERATOR_KEY: "CHANGE_ME_IN_PRODUCTION"
  ENCRYPTION_KEY: "CHANGE_ME_IN_PRODUCTION"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification-service
  namespace: flamoral-dating
  labels:
    app: verification-service
    version: v1
    component: backend
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: verification-service
  template:
    metadata:
      labels:
        app: verification-service
        version: v1
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: verification-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - verification-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: verification-service
        image: flamoralprodacr.azurecr.io/verification-service:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3016
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: verification-service-config
        - secretRef:
            name: verification-service-secrets
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DATABASE_URL
              optional: true
        - name: AZURE_FACE_API_KEY
          valueFrom:
            secretKeyRef:
              name: flamoral-azure-secrets
              key: AZURE_FACE_API_KEY
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: cache
        emptyDir: {}
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "flamoral-azure-keyvault"

---
apiVersion: v1
kind: Service
metadata:
  name: verification-service
  namespace: flamoral-dating
  labels:
    app: verification-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
  - port: 3016
    targetPort: http
    protocol: TCP
    name: http
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: verification-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: verification-service-pdb
  namespace: flamoral-dating
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: verification-service

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verification-service-network-policy
  namespace: flamoral-dating
spec:
  podSelector:
    matchLabels:
      app: verification-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 3016
  - from:
    - podSelector:
        matchLabels:
          app: user-service
    ports:
    - protocol: TCP
      port: 3016
  - from:
    - podSelector:
        matchLabels:
          app: moderation-service
    ports:
    - protocol: TCP
      port: 3016
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: media-service
    ports:
    - protocol: TCP
      port: 3005
  # Allow HTTPS egress for Azure Cognitive Services
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
  - ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: verification-service-hpa
  namespace: flamoral-dating
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: verification-service
  minReplicas: 3
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: verification_requests_per_second
      target:
        type: AverageValue
        averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
