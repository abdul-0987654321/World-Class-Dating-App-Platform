# =============================================================================
# Policy Service - Kubernetes Manifests
# Handles privacy policy, terms of service, and regulatory compliance
# =============================================================================

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-service
  namespace: flamoral-dating
  labels:
    app: policy-service
    component: backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: policy-service-config
  namespace: flamoral-dating
  labels:
    app: policy-service
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3015"
  REDIS_HOST: "redis-cluster.flamoral-dating.svc.cluster.local"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres-primary.flamoral-dating.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "flamoral_policies"
  JAEGER_AGENT_HOST: "jaeger-agent.monitoring.svc.cluster.local"
  JAEGER_AGENT_PORT: "6831"
  METRICS_PORT: "9090"
  CACHE_TTL: "3600"
  POLICY_VERSIONS_RETAINED: "10"

---
apiVersion: v1
kind: Secret
metadata:
  name: policy-service-secrets
  namespace: flamoral-dating
  labels:
    app: policy-service
type: Opaque
stringData:
  POSTGRES_USER: "flamoral_policies"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-service
  namespace: flamoral-dating
  labels:
    app: policy-service
    version: v1
    component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: policy-service
  template:
    metadata:
      labels:
        app: policy-service
        version: v1
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: policy-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - policy-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: policy-service
        image: flamoralacr.azurecr.io/policy-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3015
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: policy-service-config
        - secretRef:
            name: policy-service-secrets
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flamoral-database-secrets
              key: DATABASE_URL
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "flamoral-azure-keyvault"

---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
  namespace: flamoral-dating
  labels:
    app: policy-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
  - port: 3015
    targetPort: http
    protocol: TCP
    name: http
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: policy-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: policy-service-pdb
  namespace: flamoral-dating
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: policy-service

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-service-network-policy
  namespace: flamoral-dating
spec:
  podSelector:
    matchLabels:
      app: policy-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 3015
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policy-service-hpa
  namespace: flamoral-dating
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: policy-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
