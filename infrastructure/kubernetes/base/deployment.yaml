apiVersion: apps/v1
kind: Deployment
metadata:
  name: flamoral-api
  labels:
    app: flamoral
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flamoral
      component: api
  template:
    metadata:
      labels:
        app: flamoral
        component: api
    spec:
      serviceAccountName: flamoral-api-sa
      containers:
        - name: api
          image: ${ECR_REGISTRY}/flamoral-api:${IMAGE_TAG}
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: flamoral-config
            - secretRef:
                name: database-secrets
            - secretRef:
                name: redis-secrets
            - secretRef:
                name: jwt-secrets
            - secretRef:
                name: api-secrets
            - secretRef:
                name: cognito-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - flamoral
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: flamoral-api
  labels:
    app: flamoral
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: flamoral
    component: api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flamoral-api-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/flamoral-api-role
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flamoral-api-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: ${ACM_CERTIFICATE_ARN}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - host: api.flamoral.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flamoral-api
                port:
                  number: 80
