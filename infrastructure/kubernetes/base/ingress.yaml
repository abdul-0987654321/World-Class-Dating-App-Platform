apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flamoral-ingress
  namespace: flamoral
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # SSL/TLS Configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

    # Rate Limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"

    # Proxy Configuration
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"

    # CORS Configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://flamoral.com,https://www.flamoral.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Request-ID,X-Correlation-ID"

    # WebSocket Support
    nginx.ingress.kubernetes.io/websocket-services: "api-gateway,realtime-service"

    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Strict-Transport-Security (HSTS)
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

      # X-Frame-Options: Prevents clickjacking
      add_header X-Frame-Options "DENY" always;

      # X-Content-Type-Options: Prevents MIME type sniffing
      add_header X-Content-Type-Options "nosniff" always;

      # X-XSS-Protection: Legacy XSS protection
      add_header X-XSS-Protection "1; mode=block" always;

      # Referrer-Policy
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;

      # Content Security Policy
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: ws: https://api.flamoral.com; media-src 'self' blob: data: https:; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests; block-all-mixed-content;" always;

      # Permissions-Policy
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self), usb=(), magnetometer=(), accelerometer=(), gyroscope=(), ambient-light-sensor=(), autoplay=(self), fullscreen=(self), picture-in-picture=(self), display-capture=(), document-domain=(), encrypted-media=(self), midi=(), sync-xhr=(), interest-cohort=()" always;

      # X-Permitted-Cross-Domain-Policies
      add_header X-Permitted-Cross-Domain-Policies "none" always;

      # X-Download-Options
      add_header X-Download-Options "noopen" always;

      # Cross-Origin-Embedder-Policy
      add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

      # Cross-Origin-Opener-Policy
      add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

      # Cross-Origin-Resource-Policy
      add_header Cross-Origin-Resource-Policy "same-site" always;

      # Remove server identification headers
      more_clear_headers Server;
      more_clear_headers X-Powered-By;
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - flamoral.com
    - www.flamoral.com
    - api.flamoral.com
    secretName: flamoral-tls
  rules:
  - host: flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: realtime-service
            port:
              number: 80
  - host: www.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
  - host: api.flamoral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
