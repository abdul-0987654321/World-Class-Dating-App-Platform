# IMPORTANT: This is a template file.
# In production, secrets should be managed using sealed-secrets, external-secrets, or vault
# Never commit actual secrets to version control

apiVersion: v1
kind: Secret
metadata:
  name: dating-app-secrets
  namespace: dating-app
type: Opaque
stringData:
  # Database Credentials
  DB_USER: "datingapp_prod"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Redis Password
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # JWT Secret
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET"
  JWT_REFRESH_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET"

  # Encryption Keys
  ENCRYPTION_KEY: "CHANGE_ME_32_CHARACTER_STRING"

  # Third-party API Keys
  AWS_ACCESS_KEY_ID: "YOUR_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "YOUR_AWS_SECRET_KEY"
  AZURE_STORAGE_CONNECTION_STRING: "YOUR_AZURE_CONNECTION_STRING"

  # Sendgrid/Email
  SENDGRID_API_KEY: "YOUR_SENDGRID_API_KEY"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  SMTP_PASSWORD: "YOUR_SENDGRID_API_KEY"

  # Stripe
  STRIPE_SECRET_KEY: "YOUR_STRIPE_SECRET_KEY"
  STRIPE_WEBHOOK_SECRET: "YOUR_STRIPE_WEBHOOK_SECRET"

  # Twilio
  TWILIO_ACCOUNT_SID: "YOUR_TWILIO_ACCOUNT_SID"
  TWILIO_AUTH_TOKEN: "YOUR_TWILIO_AUTH_TOKEN"

  # Firebase
  FIREBASE_PROJECT_ID: "YOUR_FIREBASE_PROJECT_ID"
  FIREBASE_PRIVATE_KEY: "YOUR_FIREBASE_PRIVATE_KEY"
  FIREBASE_CLIENT_EMAIL: "YOUR_FIREBASE_CLIENT_EMAIL"

  # Social OAuth
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"
  FACEBOOK_APP_ID: "YOUR_FACEBOOK_APP_ID"
  FACEBOOK_APP_SECRET: "YOUR_FACEBOOK_APP_SECRET"
