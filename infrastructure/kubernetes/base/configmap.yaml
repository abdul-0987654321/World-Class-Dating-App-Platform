apiVersion: v1
kind: ConfigMap
metadata:
  name: dating-app-config
  namespace: flamoral
data:
  NODE_ENV: "production"
  APP_NAME: "dating-app-platform"
  LOG_LEVEL: "info"
  TZ: "UTC"

  # Database Configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "dating_app_production"
  DB_MAX_CONNECTIONS: "200"
  DB_POOL_SIZE: "20"

  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # Service URLs
  USER_SERVICE_URL: "http://user-service:4001"
  MATCHING_SERVICE_URL: "http://matching-service:4002"
  MEDIA_SERVICE_URL: "http://media-service:4003"
  MESSAGING_SERVICE_URL: "http://messaging-service:4004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:4005"

  # API Gateway
  API_GATEWAY_PORT: "4000"
  ENABLE_CORS: "true"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"

  # Monitoring
  ENABLE_METRICS: "true"
  METRICS_PORT: "9090"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: flamoral
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 4096;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;

        gzip on;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        include /etc/nginx/conf.d/*.conf;
    }
