apiVersion: batch/v1
kind: Job
metadata:
  name: init-database
  namespace: flamoral
  labels:
    app: flamoral
    component: db-init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init-db
          image: postgres:15-alpine
          command: ["sh", "-c"]
          args:
            - |
              psql "$DATABASE_URL?sslmode=require" -f /sql/init.sql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: sql-scripts
              mountPath: /sql
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: sql-scripts
          configMap:
            name: init-db-sql
