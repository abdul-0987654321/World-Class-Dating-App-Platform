apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  namespace: dating-app
  labels:
    app: flamoral
    component: migration
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: flamoral
        component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: flamoralprodacr.azurecr.io/migration:${IMAGE_TAG}
          imagePullPolicy: Always
          command: ["npm", "run", "migrate:latest"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_PASSWORD
            - name: DB_SSL
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: acr-secret
---
apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration-rollback
  namespace: dating-app
  labels:
    app: flamoral
    component: migration-rollback
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: flamoral
        component: migration-rollback
    spec:
      restartPolicy: Never
      containers:
        - name: migration-rollback
          image: flamoralprodacr.azurecr.io/migration:${IMAGE_TAG}
          imagePullPolicy: Always
          command: ["npm", "run", "migrate:rollback"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DB_PASSWORD
            - name: DB_SSL
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: acr-secret
