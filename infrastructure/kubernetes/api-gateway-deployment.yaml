apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: flamoral-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: flamoralprodacr.azurecr.io/api-gateway:v1.0.0
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: JWT_SECRET
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: JWT_ACCESS_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: JWT_REFRESH_SECRET
        - name: INTERNAL_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: flamoral-secrets
              key: INTERNAL_SERVICE_KEY
        - name: AUTH_SERVICE_URL
          value: "http://auth-service.flamoral-prod.svc.cluster.local:3001"
        - name: USER_SERVICE_URL
          value: "http://user-service.flamoral-prod.svc.cluster.local:3002"
        - name: MATCHING_SERVICE_URL
          value: "http://matching-service.flamoral-prod.svc.cluster.local:3003"
        - name: MESSAGING_SERVICE_URL
          value: "http://messaging-service.flamoral-prod.svc.cluster.local:3004"
        - name: REDIS_HOST
          value: "redis-master.flamoral-prod.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: flamoral-prod
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 3000
