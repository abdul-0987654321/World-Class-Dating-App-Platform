# Matching Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: flamoral
  labels:
    app: flamoral
    component: matching-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flamoral
      component: matching-service
  template:
    metadata:
      labels:
        app: flamoral
        component: matching-service
    spec:
      containers:
        - name: matching-service
          image: 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/matching-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3003"
            - name: SERVICE_NAME
              value: "matching-service"
            - name: REDIS_HOST
              value: "redis.flamoral.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: flamoral
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: 3003
  selector:
    app: flamoral
    component: matching-service
---
# Messaging Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service
  namespace: flamoral
  labels:
    app: flamoral
    component: messaging-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flamoral
      component: messaging-service
  template:
    metadata:
      labels:
        app: flamoral
        component: messaging-service
    spec:
      # Allow graceful shutdown with enough time
      terminationGracePeriodSeconds: 30
      containers:
        - name: messaging-service
          image: 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/messaging-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3004"
            - name: SERVICE_NAME
              value: "messaging-service"
            - name: REDIS_HOST
              value: "redis.flamoral.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            # Shutdown timeout should be less than terminationGracePeriodSeconds
            - name: SHUTDOWN_TIMEOUT_MS
              value: "25000"
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Liveness probe: Check if the process is alive
          # Uses /health endpoint which responds quickly even during startup
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            # Give service time to start HTTP server (increased from 30)
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # Readiness probe: Check if service can handle traffic
          # Uses /ready endpoint which checks DB connectivity
          readinessProbe:
            httpGet:
              path: /ready
              port: 3004
            # Allow more time for Cosmos DB initialization
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1
          # Startup probe: Give more time for initial startup
          # This prevents liveness probe from killing during slow startup
          startupProbe:
            httpGet:
              path: /health
              port: 3004
            # Allow up to 120 seconds for initial startup (30 * 4 seconds)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-service
  namespace: flamoral
spec:
  type: ClusterIP
  ports:
    - port: 3004
      targetPort: 3004
  selector:
    app: flamoral
    component: messaging-service
