apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: flamoral
  labels:
    app: flamoral
    component: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flamoral
      component: auth-service
  template:
    metadata:
      labels:
        app: flamoral
        component: auth-service
    spec:
      containers:
        - name: auth-service
          image: 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: SERVICE_NAME
              value: "auth-service"
            - name: REDIS_HOST
              value: "redis.flamoral.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_URL
              value: "redis://redis.flamoral.svc.cluster.local:6379"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: DATABASE_URL
          envFrom:
            - secretRef:
                name: auth-service-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: flamoral
  labels:
    app: flamoral
    component: auth-service
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: flamoral
    component: auth-service
