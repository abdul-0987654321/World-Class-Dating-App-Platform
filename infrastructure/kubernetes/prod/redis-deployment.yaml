apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: flamoral
  labels:
    app: flamoral
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flamoral
      component: redis
  template:
    metadata:
      labels:
        app: flamoral
        component: redis
    spec:
      containers:
        - name: redis
          image: public.ecr.aws/docker/library/redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: flamoral
  labels:
    app: flamoral
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: flamoral
    component: redis
