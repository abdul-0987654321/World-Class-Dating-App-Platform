# IMPORTANT: This file uses ExternalSecrets to pull secrets from AWS Secrets Manager
# DO NOT hardcode actual credentials here
# Actual secrets are managed in AWS Secrets Manager: flamoral/prod/*

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: flamoral
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: flamoral/prod/database
        property: url
    - secretKey: DB_HOST
      remoteRef:
        key: flamoral/prod/database
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: flamoral/prod/database
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: flamoral/prod/database
        property: name
    - secretKey: DB_USER
      remoteRef:
        key: flamoral/prod/database
        property: user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: flamoral/prod/database
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: flamoral/prod/jwt
        property: secret
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: flamoral/prod/jwt
        property: access_secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: flamoral/prod/jwt
        property: refresh_secret
    - secretKey: INTERNAL_SERVICE_KEY
      remoteRef:
        key: flamoral/prod/services
        property: internal_key
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: flamoral/prod/redis
        property: password
    - secretKey: TOTP_ENCRYPTION_MASTER_KEY
      remoteRef:
        key: flamoral/prod/encryption
        property: totp_master_key
    - secretKey: TOTP_ENCRYPTION_KEY_SALT
      remoteRef:
        key: flamoral/prod/encryption
        property: totp_salt
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: flamoral/prod/encryption
        property: message_key
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: flamoral/prod/services
        property: token
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: flamoral/prod/sendgrid
        property: api_key
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: flamoral/prod/stripe
        property: secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: flamoral/prod/stripe
        property: webhook_secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-secrets
  namespace: flamoral
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: flamoral/prod/jwt
        property: secret
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: flamoral/prod/jwt
        property: access_secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: flamoral/prod/jwt
        property: refresh_secret
    - secretKey: DATABASE_URL
      remoteRef:
        key: flamoral/prod/database
        property: url
    - secretKey: DB_HOST
      remoteRef:
        key: flamoral/prod/database
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: flamoral/prod/database
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: flamoral/prod/database
        property: name
    - secretKey: DB_USER
      remoteRef:
        key: flamoral/prod/database
        property: user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: flamoral/prod/database
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-secrets
  namespace: flamoral
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: database-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: flamoral/prod/database
        property: url
---
# ClusterSecretStore configuration for AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
