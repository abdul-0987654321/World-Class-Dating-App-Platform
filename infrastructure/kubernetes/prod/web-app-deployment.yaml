apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: flamoral
  labels:
    app: flamoral
    component: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flamoral
      component: web-app
  template:
    metadata:
      labels:
        app: flamoral
        component: web-app
    spec:
      containers:
        - name: web-app
          image: 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/web-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: flamoral
  labels:
    app: flamoral
    component: web-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: flamoral
    component: web-app
