apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: flamoral
  labels:
    app: flamoral
    component: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flamoral
      component: user-service
  template:
    metadata:
      labels:
        app: flamoral
        component: user-service
    spec:
      containers:
        - name: user-service
          image: 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3002"
            - name: SERVICE_NAME
              value: "user-service"
            - name: REDIS_HOST
              value: "redis.flamoral.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: flamoral
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
  selector:
    app: flamoral
    component: user-service
