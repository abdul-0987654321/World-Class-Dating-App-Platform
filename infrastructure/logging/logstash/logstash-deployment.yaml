---
# Logstash ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: flamoral-logging
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    path.config: /usr/share/logstash/pipeline
    xpack.monitoring.enabled: true
    xpack.monitoring.elasticsearch.hosts: ["http://elasticsearch-client:9200"]

  pipelines.yml: |
    - pipeline.id: main
      path.config: "/usr/share/logstash/pipeline/main.conf"
      pipeline.workers: 4
      pipeline.batch.size: 125
      pipeline.batch.delay: 50

---
# Logstash Pipeline ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: flamoral-logging
data:
  main.conf: |
    input {
      # Beats input
      beats {
        port => 5044
        ssl => false
      }

      # HTTP input for direct log shipping
      http {
        port => 8080
        codec => json
      }

      # Kafka input for high-volume logs
      kafka {
        bootstrap_servers => "kafka:9092"
        topics => ["application-logs"]
        group_id => "logstash-consumer"
        codec => json
      }
    }

    filter {
      # Parse JSON logs
      if [message] =~ /^\{.*\}$/ {
        json {
          source => "message"
        }
      }

      # Add timestamp
      if ![timestamp] {
        ruby {
          code => "event.set('timestamp', Time.now.utc)"
        }
      }

      # Parse common log formats
      if [service] == "nginx" or [service] == "ingress" {
        grok {
          match => {
            "message" => '%{IPORHOST:clientip} - %{USER:ident} \[%{HTTPDATE:timestamp}\] "(?:%{WORD:method} %{NOTSPACE:request}(?: HTTP/%{NUMBER:httpversion})?|%{DATA:rawrequest})" %{NUMBER:response} (?:%{NUMBER:bytes}|-)'
          }
        }
        date {
          match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
          target => "@timestamp"
        }
      }

      # Extract trace context
      if [headers][x-trace-id] {
        mutate {
          add_field => { "trace_id" => "%{[headers][x-trace-id]}" }
        }
      }

      if [headers][x-span-id] {
        mutate {
          add_field => { "span_id" => "%{[headers][x-span-id]}" }
        }
      }

      # Extract user context
      if [user_id] {
        mutate {
          convert => { "user_id" => "string" }
        }
      }

      # Normalize log levels
      if [level] {
        mutate {
          uppercase => ["level"]
        }
      }

      # Add environment labels
      mutate {
        add_field => {
          "environment" => "production"
          "cluster" => "flamoral-k8s"
        }
      }

      # Parse error stack traces
      if [error][stack] {
        mutate {
          gsub => [
            "[error][stack]", "\n", " | "
          ]
        }
      }

      # Add geolocation for IP addresses
      if [clientip] {
        geoip {
          source => "clientip"
          target => "geoip"
        }
      }

      # Performance metrics extraction
      if [duration] {
        mutate {
          convert => { "duration" => "float" }
        }
      }

      # Remove unnecessary fields
      mutate {
        remove_field => ["headers", "beat", "input", "agent", "ecs", "host"]
      }
    }

    output {
      # Output to Elasticsearch
      elasticsearch {
        hosts => ["http://elasticsearch-client:9200"]
        index => "flamoral-%{[service]}-%{+YYYY.MM.dd}"
        template_name => "flamoral-logs"
        manage_template => false
      }

      # Output to stdout for debugging (disable in production)
      # stdout {
      #   codec => rubydebug
      # }

      # Output metrics to Prometheus
      prometheus {
        port => 9198
      }
    }

---
# Logstash Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: flamoral-logging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.0
          ports:
            - containerPort: 5044
              name: beats
            - containerPort: 8080
              name: http
            - containerPort: 9600
              name: monitoring
            - containerPort: 9198
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
          env:
            - name: LS_JAVA_OPTS
              value: "-Xmx1g -Xms1g"
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch-client:9200"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: logstash-config
            items:
              - key: logstash.yml
                path: logstash.yml
              - key: pipelines.yml
                path: pipelines.yml
        - name: pipeline
          configMap:
            name: logstash-pipeline

---
# Logstash Service
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: flamoral-logging
spec:
  selector:
    app: logstash
  ports:
    - port: 5044
      targetPort: 5044
      name: beats
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9600
      targetPort: 9600
      name: monitoring
    - port: 9198
      targetPort: 9198
      name: metrics
  type: ClusterIP

---
# Logstash HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logstash-hpa
  namespace: flamoral-logging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logstash
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
