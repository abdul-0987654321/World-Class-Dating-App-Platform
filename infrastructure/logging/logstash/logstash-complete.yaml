# Complete Logstash Configuration for Dating App
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: logging
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    path.config: /usr/share/logstash/pipeline
    xpack.monitoring.enabled: true
    xpack.monitoring.elasticsearch.hosts: ["http://elasticsearch:9200"]
    xpack.monitoring.elasticsearch.username: elastic
    xpack.monitoring.elasticsearch.password: ${ELASTICSEARCH_PASSWORD}
    queue.type: persisted
    queue.max_bytes: 1gb

  pipelines.yml: |
    - pipeline.id: main
      path.config: "/usr/share/logstash/pipeline/main.conf"
      pipeline.workers: 4
      pipeline.batch.size: 500
      pipeline.batch.delay: 50

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: logging
data:
  main.conf: |
    input {
      # Beats input for Filebeat
      beats {
        port => 5044
        codec => json
      }

      # Syslog input
      syslog {
        port => 5000
        codec => json_lines
      }

      # HTTP input for direct log shipping
      http {
        port => 8080
        codec => json
      }

      # Kafka input for high-volume logs
      kafka {
        bootstrap_servers => "kafka:9092"
        topics => ["dating-app-logs"]
        consumer_threads => 4
        codec => json
      }
    }

    filter {
      # Parse JSON logs
      if [message] =~ /^\{.*\}$/ {
        json {
          source => "message"
          target => "parsed"
        }
      }

      # Extract log level
      if [parsed][level] {
        mutate {
          add_field => { "log_level" => "%{[parsed][level]}" }
        }
      }

      # Extract service name
      if [kubernetes][labels][app] {
        mutate {
          add_field => { "service" => "%{[kubernetes][labels][app]}" }
        }
      }

      # Parse timestamps
      date {
        match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
        target => "@timestamp"
      }

      # Extract HTTP request information
      if [parsed][http] {
        mutate {
          add_field => {
            "http_method" => "%{[parsed][http][method]}"
            "http_status" => "%{[parsed][http][status_code]}"
            "http_url" => "%{[parsed][http][url]}"
          }
        }
      }

      # Extract user information
      if [parsed][user_id] {
        mutate {
          add_field => { "user_id" => "%{[parsed][user_id]}" }
        }
      }

      # Extract request ID for tracing
      if [parsed][request_id] {
        mutate {
          add_field => { "request_id" => "%{[parsed][request_id]}" }
        }
      }

      # Calculate response time categories
      if [parsed][duration_ms] {
        ruby {
          code => "
            duration = event.get('[parsed][duration_ms]').to_i
            if duration < 100
              event.set('response_time_category', 'fast')
            elsif duration < 1000
              event.set('response_time_category', 'medium')
            elsif duration < 5000
              event.set('response_time_category', 'slow')
            else
              event.set('response_time_category', 'very_slow')
            end
          "
        }
      }

      # Detect errors and add tags
      if [log_level] in ["ERROR", "FATAL", "error", "fatal"] {
        mutate {
          add_tag => ["error"]
        }
      }

      # Extract error information
      if [parsed][error] {
        mutate {
          add_field => {
            "error_type" => "%{[parsed][error][type]}"
            "error_message" => "%{[parsed][error][message]}"
          }
        }
      }

      # Add geolocation for IP addresses
      if [parsed][client_ip] {
        geoip {
          source => "[parsed][client_ip]"
          target => "geoip"
        }
      }

      # User agent parsing
      if [parsed][user_agent] {
        useragent {
          source => "[parsed][user_agent]"
          target => "user_agent_parsed"
        }
      }

      # Mask sensitive data
      mutate {
        gsub => [
          "message", "password=[^&\s]+", "password=***MASKED***",
          "message", "token=[^&\s]+", "token=***MASKED***",
          "message", "api_key=[^&\s]+", "api_key=***MASKED***",
          "message", "\"password\":\"[^\"]+\"", "\"password\":\"***MASKED***\"",
          "message", "\"token\":\"[^\"]+\"", "\"token\":\"***MASKED***\""
        ]
      }

      # Add environment tags
      mutate {
        add_field => {
          "environment" => "production"
          "cluster" => "dating-app-k8s"
        }
      }

      # Remove unnecessary fields
      mutate {
        remove_field => ["host", "agent", "ecs", "input", "log"]
      }
    }

    output {
      # Main Elasticsearch output
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        user => "elastic"
        password => "${ELASTICSEARCH_PASSWORD}"
        index => "dating-app-logs-%{+YYYY.MM.dd}"
        document_type => "_doc"
        manage_template => true
        template_name => "dating-app-logs"
        template_overwrite => true
      }

      # Separate index for errors
      if "error" in [tags] {
        elasticsearch {
          hosts => ["http://elasticsearch:9200"]
          user => "elastic"
          password => "${ELASTICSEARCH_PASSWORD}"
          index => "dating-app-errors-%{+YYYY.MM.dd}"
          document_type => "_doc"
        }
      }

      # Separate index for audit logs
      if [service] == "user-service" and [log_level] == "AUDIT" {
        elasticsearch {
          hosts => ["http://elasticsearch:9200"]
          user => "elastic"
          password => "${ELASTICSEARCH_PASSWORD}"
          index => "dating-app-audit-%{+YYYY.MM.dd}"
          document_type => "_doc"
        }
      }

      # Debug output (comment out in production)
      # stdout { codec => rubydebug }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
  labels:
    app: logstash
spec:
  replicas: 3
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:8.10.2
        ports:
        - containerPort: 5044
          name: beats
        - containerPort: 5000
          name: syslog
        - containerPort: 8080
          name: http
        - containerPort: 9600
          name: monitoring
        env:
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-credentials
              key: password
        - name: LS_JAVA_OPTS
          value: "-Xmx2g -Xms2g"
        volumeMounts:
        - name: config
          mountPath: /usr/share/logstash/config/logstash.yml
          subPath: logstash.yml
        - name: config
          mountPath: /usr/share/logstash/config/pipelines.yml
          subPath: pipelines.yml
        - name: pipeline
          mountPath: /usr/share/logstash/pipeline
        - name: data
          mountPath: /usr/share/logstash/data
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /
            port: 9600
          initialDelaySeconds: 90
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 9600
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: logstash-config
      - name: pipeline
        configMap:
          name: logstash-pipeline
      - name: data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: logging
  labels:
    app: logstash
spec:
  type: ClusterIP
  ports:
  - port: 5044
    targetPort: 5044
    name: beats
  - port: 5000
    targetPort: 5000
    name: syslog
  - port: 8080
    targetPort: 8080
    name: http
  - port: 9600
    targetPort: 9600
    name: monitoring
  selector:
    app: logstash

---
# Filebeat DaemonSet for collecting logs from all pods
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: logging
  labels:
    app: filebeat
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.10.2
        args: [
          "-c", "/etc/filebeat.yml",
          "-e",
        ]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: ELASTICSEARCH_HOST
          value: "elasticsearch"
        - name: ELASTICSEARCH_PORT
          value: "9200"
        - name: LOGSTASH_HOST
          value: "logstash"
        - name: LOGSTASH_PORT
          value: "5044"
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 500Mi
        volumeMounts:
        - name: config
          mountPath: /etc/filebeat.yml
          readOnly: true
          subPath: filebeat.yml
        - name: data
          mountPath: /usr/share/filebeat/data
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: varlog
          mountPath: /var/log
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: filebeat-config
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: varlog
        hostPath:
          path: /var/log
      - name: data
        hostPath:
          path: /var/lib/filebeat-data
          type: DirectoryOrCreate

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: logging
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/*.log
      processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
          - logs_path:
              logs_path: "/var/log/containers/"

    - type: log
      enabled: true
      paths:
        - /var/log/*.log

    processors:
    - add_cloud_metadata: ~
    - add_docker_metadata: ~
    - add_kubernetes_metadata: ~

    output.logstash:
      hosts: ["${LOGSTASH_HOST}:${LOGSTASH_PORT}"]
      worker: 2
      bulk_max_size: 2048
      timeout: 30s

    logging.level: info
    logging.to_files: true
    logging.files:
      path: /var/log/filebeat
      name: filebeat
      keepfiles: 7
      permissions: 0644

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: logging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
- apiGroups: [""]
  resources:
  - namespaces
  - pods
  - nodes
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: logging
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
