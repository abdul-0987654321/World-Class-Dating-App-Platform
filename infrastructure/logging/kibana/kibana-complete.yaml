    {"type":"visualization","id":"error-count-by-service","attributes":{"title":"Error Count by Service","visState":"{\"title\":\"Error Count by Service\",\"type\":\"pie\",\"params\":{\"addLegend\":true,\"addTooltip\":true,\"isDonut\":false},\"aggs\":[{\"id\":\"1\",\"enabled\":true,\"type\":\"count\",\"schema\":\"metric\",\"params\":{}},{\"id\":\"2\",\"enabled\":true,\"type\":\"terms\",\"schema\":\"segment\",\"params\":{\"field\":\"service.keyword\",\"size\":10,\"order\":\"desc\",\"orderBy\":\"1\"}}],\"listeners\":{}}","uiStateJSON":"{}","description":"","version":1,"kibanaSavedObjectMeta":{"searchSourceJSON":"{\"index\":\"dating-app-logs-*\",\"query\":{\"query\":\"\",\"language\":\"lucene\"},\"filter\":[]}"}}}

  api-performance-dashboard.ndjson: |
    {"type":"dashboard","id":"dating-app-api-performance","attributes":{"title":"Dating App - API Performance Logs","description":"Dashboard for monitoring API performance through logs","panelsJSON":"[{\"version\":\"8.10.2\",\"gridData\":{\"x\":0,\"y\":0,\"w\":12,\"h\":15,\"i\":\"1\"},\"panelIndex\":\"1\",\"embeddableConfig\":{},\"panelRefName\":\"panel_1\"},{\"version\":\"8.10.2\",\"gridData\":{\"x\":12,\"y\":0,\"w\":12,\"h\":15,\"i\":\"2\"},\"panelIndex\":\"2\",\"embeddableConfig\":{},\"panelRefName\":\"panel_2\"},{\"version\":\"8.10.2\",\"gridData\":{\"x\":0,\"y\":15,\"w\":24,\"h\":15,\"i\":\"3\"},\"panelIndex\":\"3\",\"embeddableConfig\":{},\"panelRefName\":\"panel_3\"}]","optionsJSON":"{\"useMargins\":true,\"hidePanelTitles\":false}","version":1,"timeRestore":true,"timeTo":"now","timeFrom":"now-1h","refreshInterval":{"pause":false,"value":10000}}}

  user-activity-dashboard.ndjson: |
