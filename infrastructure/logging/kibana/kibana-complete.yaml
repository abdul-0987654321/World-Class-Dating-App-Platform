---
# Kibana Saved Searches
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-saved-searches
  namespace: logging
data:
  searches.ndjson: |
    {"type":"search","id":"all-errors","attributes":{"title":"All Errors","description":"All error level logs","columns":["@timestamp","service","message","error_type"],"sort":[["@timestamp","desc"]],"version":1,"kibanaSavedObjectMeta":{"searchSourceJSON":"{\"index\":\"dating-app-logs-*\",\"query\":{\"query\":\"log_level: (ERROR OR FATAL)\",\"language\":\"kuery\"},\"filter\":[],\"highlightAll\":true,\"version\":true}"}}}

    {"type":"search","id":"slow-requests","attributes":{"title":"Slow API Requests","description":"API requests slower than 1 second","columns":["@timestamp","service","http_method","http_url","duration_ms","response_time_category"],"sort":[["duration_ms","desc"]],"version":1,"kibanaSavedObjectMeta":{"searchSourceJSON":"{\"index\":\"dating-app-logs-*\",\"query\":{\"query\":\"duration_ms > 1000\",\"language\":\"kuery\"},\"filter\":[],\"highlightAll\":true,\"version\":true}"}}}

    {"type":"search","id":"5xx-errors","attributes":{"title":"5xx HTTP Errors","description":"All 5xx server errors","columns":["@timestamp","service","http_method","http_url","http_status","message"],"sort":[["@timestamp","desc"]],"version":1,"kibanaSavedObjectMeta":{"searchSourceJSON":"{\"index\":\"dating-app-logs-*\",\"query\":{\"query\":\"http_status >= 500 AND http_status < 600\",\"language\":\"kuery\"},\"filter\":[],\"highlightAll\":true,\"version\":true}"}}}

    {"type":"search","id":"authentication-failures","attributes":{"title":"Authentication Failures","description":"Failed authentication attempts","columns":["@timestamp","user_id","client_ip","message","geoip.country_name"],"sort":[["@timestamp","desc"]],"version":1,"kibanaSavedObjectMeta":{"searchSourceJSON":"{\"index\":\"dating-app-logs-*\",\"query\":{\"query\":\"message: (\\\"authentication failed\\\" OR \\\"login failed\\\" OR \\\"invalid credentials\\\")\",\"language\":\"kuery\"},\"filter\":[],\"highlightAll\":true,\"version\":true}"}}}

---
# Index Patterns
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-index-patterns
  namespace: logging
data:
  patterns.ndjson: |
    {"type":"index-pattern","id":"dating-app-logs-*","attributes":{"title":"dating-app-logs-*","timeFieldName":"@timestamp","fields":"[]","fieldFormatMap":"{}","typeMeta":"{}"}}

    {"type":"index-pattern","id":"dating-app-errors-*","attributes":{"title":"dating-app-errors-*","timeFieldName":"@timestamp","fields":"[]","fieldFormatMap":"{}","typeMeta":"{}"}}

    {"type":"index-pattern","id":"dating-app-audit-*","attributes":{"title":"dating-app-audit-*","timeFieldName":"@timestamp","fields":"[]","fieldFormatMap":"{}","typeMeta":"{}"}}

---
# Alert Rules (Watcher)
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-alert-rules
  namespace: logging
data:
  high-error-rate-alert.json: |
    {
      "trigger": {
        "schedule": {
          "interval": "5m"
        }
      },
      "input": {
        "search": {
          "request": {
            "indices": ["dating-app-logs-*"],
            "body": {
              "query": {
                "bool": {
                  "filter": [
                    {
                      "range": {
                        "@timestamp": {
                          "gte": "now-5m"
                        }
                      }
                    },
                    {
                      "terms": {
                        "log_level": ["ERROR", "FATAL"]
                      }
                    }
                  ]
                }
              },
              "aggs": {
                "error_count": {
                  "value_count": {
                    "field": "@timestamp"
                  }
                }
              }
            }
          }
        }
      },
      "condition": {
        "compare": {
          "ctx.payload.aggregations.error_count.value": {
            "gt": 100
          }
        }
      },
      "actions": {
        "send_email": {
          "email": {
            "to": "alerts@datingapp.com",
            "subject": "High Error Rate Alert",
            "body": "Error count exceeded threshold: {{ctx.payload.aggregations.error_count.value}} errors in the last 5 minutes"
          }
        },
        "log_action": {
          "logging": {
            "text": "High error rate detected: {{ctx.payload.aggregations.error_count.value}} errors"
          }
        }
      }
    }

  slow-query-alert.json: |
    {
      "trigger": {
        "schedule": {
          "interval": "10m"
        }
      },
      "input": {
        "search": {
          "request": {
            "indices": ["dating-app-logs-*"],
            "body": {
              "query": {
                "bool": {
                  "filter": [
                    {
                      "range": {
                        "@timestamp": {
                          "gte": "now-10m"
                        }
                      }
                    },
                    {
                      "range": {
                        "duration_ms": {
                          "gte": 5000
                        }
                      }
                    }
                  ]
                }
              },
              "aggs": {
                "slow_queries": {
                  "terms": {
                    "field": "http_url.keyword",
                    "size": 10
                  }
                }
              }
            }
          }
        }
      },
      "condition": {
        "compare": {
          "ctx.payload.hits.total": {
            "gt": 50
          }
        }
      },
      "actions": {
        "send_email": {
          "email": {
            "to": "performance@datingapp.com",
            "subject": "Slow Query Alert",
            "body": "{{ctx.payload.hits.total}} slow queries detected in the last 10 minutes"
          }
        }
      }
    }
