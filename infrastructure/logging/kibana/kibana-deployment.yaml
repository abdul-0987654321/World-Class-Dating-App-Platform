---
# Kibana ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: flamoral-logging
data:
  kibana.yml: |
    server.name: kibana
    server.host: "0.0.0.0"
    elasticsearch.hosts: ["http://elasticsearch-client:9200"]

    # Monitoring
    monitoring.ui.container.elasticsearch.enabled: true

    # Server settings
    server.basePath: ""
    server.rewriteBasePath: false

    # Logging
    logging.dest: stdout
    logging.silent: false
    logging.quiet: false
    logging.verbose: false

    # Security (disable for now, enable with X-Pack)
    xpack.security.enabled: false

    # Reporting
    xpack.reporting.enabled: true

    # Telemetry
    telemetry.enabled: false
    telemetry.optIn: false

---
# Kibana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: flamoral-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.11.0
          ports:
            - containerPort: 5601
              name: http
          volumeMounts:
            - name: config
              mountPath: /usr/share/kibana/config
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch-client:9200"
            - name: SERVER_NAME
              value: "kibana"
            - name: SERVER_HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: kibana-config

---
# Kibana Service
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: flamoral-logging
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601
      name: http
  type: ClusterIP

---
# Kibana Index Patterns and Dashboards
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-dashboards
  namespace: flamoral-logging
data:
  import-dashboards.sh: |
    #!/bin/bash

    # Wait for Kibana to be ready
    until curl -s http://kibana:5601/api/status | grep -q '"level":"available"'; do
      echo "Waiting for Kibana..."
      sleep 5
    done

    echo "Kibana is ready, importing index patterns and dashboards..."

    # Create index pattern for all services
    curl -X POST "http://kibana:5601/api/saved_objects/index-pattern/flamoral-*" \
      -H 'kbn-xsrf: true' \
      -H 'Content-Type: application/json' \
      -d '{
        "attributes": {
          "title": "flamoral-*",
          "timeFieldName": "@timestamp"
        }
      }'

    # Set default index pattern
    curl -X POST "http://kibana:5601/api/kibana/settings/defaultIndex" \
      -H 'kbn-xsrf: true' \
      -H 'Content-Type: application/json' \
      -d '{"value":"flamoral-*"}'

    echo "Index patterns created successfully"

  # Dashboard: Application Errors
  error-dashboard.json: |
    {
      "title": "Application Errors",
      "description": "Dashboard showing application errors and exceptions",
      "panels": [
        {
          "title": "Error Count by Service",
          "type": "histogram",
          "query": "level:ERROR OR level:FATAL"
        },
        {
          "title": "Top Error Messages",
          "type": "table",
          "query": "level:ERROR"
        },
        {
          "title": "Error Timeline",
          "type": "line",
          "query": "level:ERROR"
        },
        {
          "title": "Error Distribution by Type",
          "type": "pie",
          "query": "level:ERROR"
        }
      ]
    }

  # Dashboard: API Performance
  api-dashboard.json: |
    {
      "title": "API Performance",
      "description": "Dashboard showing API request metrics and performance",
      "panels": [
        {
          "title": "Request Rate",
          "type": "line",
          "query": "service:api-gateway OR service:*-service"
        },
        {
          "title": "Response Time Distribution",
          "type": "histogram",
          "query": "duration:*"
        },
        {
          "title": "Status Code Distribution",
          "type": "pie",
          "query": "status_code:*"
        },
        {
          "title": "Slowest Endpoints",
          "type": "table",
          "query": "duration:>1000",
          "sort": "duration:desc"
        },
        {
          "title": "4xx Errors",
          "type": "table",
          "query": "status_code:[400 TO 499]"
        },
        {
          "title": "5xx Errors",
          "type": "table",
          "query": "status_code:[500 TO 599]"
        }
      ]
    }

  # Dashboard: User Activity
  user-activity-dashboard.json: |
    {
      "title": "User Activity",
      "description": "Dashboard showing user activity and engagement",
      "panels": [
        {
          "title": "Active Users",
          "type": "metric",
          "query": "user_id:*"
        },
        {
          "title": "User Actions Timeline",
          "type": "line",
          "query": "user_id:* AND action:*"
        },
        {
          "title": "Top User Actions",
          "type": "pie",
          "query": "action:*"
        },
        {
          "title": "User Engagement by Time",
          "type": "heatmap",
          "query": "user_id:*"
        }
      ]
    }

  # Dashboard: System Health
  system-health-dashboard.json: |
    {
      "title": "System Health",
      "description": "Dashboard showing overall system health and metrics",
      "panels": [
        {
          "title": "Log Volume",
          "type": "line",
          "query": "*"
        },
        {
          "title": "Log Level Distribution",
          "type": "pie",
          "query": "level:*"
        },
        {
          "title": "Service Availability",
          "type": "table",
          "query": "service:*"
        },
        {
          "title": "Critical Issues",
          "type": "table",
          "query": "level:FATAL OR level:CRITICAL"
        },
        {
          "title": "Warnings",
          "type": "table",
          "query": "level:WARN OR level:WARNING"
        }
      ]
    }

  # Dashboard: Security Events
  security-dashboard.json: |
    {
      "title": "Security Events",
      "description": "Dashboard showing security-related events and alerts",
      "panels": [
        {
          "title": "Failed Login Attempts",
          "type": "line",
          "query": "event:login_failed OR message:*failed*login*"
        },
        {
          "title": "Suspicious Activities",
          "type": "table",
          "query": "level:WARN AND (message:*suspicious* OR message:*unauthorized*)"
        },
        {
          "title": "Authentication Events",
          "type": "pie",
          "query": "event:auth* OR message:*authentication*"
        },
        {
          "title": "Access Denied",
          "type": "table",
          "query": "status_code:403 OR message:*access*denied*"
        },
        {
          "title": "Security Alerts by IP",
          "type": "table",
          "query": "level:WARN AND clientip:*"
        }
      ]
    }

---
# Job to import Kibana dashboards
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-import-dashboards
  namespace: flamoral-logging
spec:
  template:
    spec:
      containers:
        - name: import-dashboards
          image: curlimages/curl:latest
          command: ["/bin/sh", "/scripts/import-dashboards.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: kibana-dashboards
            defaultMode: 0755
      restartPolicy: OnFailure
  backoffLimit: 5
