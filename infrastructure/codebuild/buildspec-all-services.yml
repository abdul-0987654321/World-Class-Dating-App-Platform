version: 0.2

env:
  shell: bash
  variables:
    REGISTRY: "992382449461.dkr.ecr.us-east-1.amazonaws.com"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 992382449461.dkr.ecr.us-east-1.amazonaws.com
      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo "IMAGE_TAG=$IMAGE_TAG" >> /tmp/env.sh
      - echo "Building with tag $IMAGE_TAG"
      - ls -la backend/services/api-gateway/

  build:
    commands:
      - source /tmp/env.sh || export IMAGE_TAG=latest
      - echo "Build started on $(date) with tag $IMAGE_TAG"
      - echo "Current directory and contents:"
      - pwd
      - ls -la

      # Build API Gateway
      - echo "Building api-gateway..."
      - docker build -t 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/api-gateway:$IMAGE_TAG -t 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/api-gateway:latest -f backend/services/api-gateway/Dockerfile .

      # Build Web App
      - echo "Building web-app..."
      - docker build -t 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/web-app:$IMAGE_TAG -t 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/web-app:latest -f apps/web-app/Dockerfile apps/web-app/

  post_build:
    commands:
      - source /tmp/env.sh || export IMAGE_TAG=latest
      - echo "Build completed on $(date)"
      - echo "Pushing Docker images..."
      - docker push 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/api-gateway:$IMAGE_TAG
      - docker push 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/api-gateway:latest
      - docker push 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/web-app:$IMAGE_TAG
      - docker push 992382449461.dkr.ecr.us-east-1.amazonaws.com/flamoral/web-app:latest
      - echo "Build and push complete!"
      - docker images

cache:
  paths:
    - '/root/.npm/**/*'
