version: 0.2

env:
  variables:
    ECR_REGISTRY: "992382449461.dkr.ecr.us-east-1.amazonaws.com"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo "Building with tag $IMAGE_TAG"

  build:
    commands:
      - echo Build started on `date`

      # Build API Gateway
      - echo "Building api-gateway..."
      - docker build -t $ECR_REGISTRY/flamoral/api-gateway:$IMAGE_TAG -t $ECR_REGISTRY/flamoral/api-gateway:latest -f backend/services/api-gateway/Dockerfile .

      # Build Auth Service
      - echo "Building auth-service..."
      - docker build -t $ECR_REGISTRY/flamoral/auth-service:$IMAGE_TAG -t $ECR_REGISTRY/flamoral/auth-service:latest -f backend/services/auth-service/Dockerfile .

      # Build User Service
      - echo "Building user-service..."
      - docker build -t $ECR_REGISTRY/flamoral/user-service:$IMAGE_TAG -t $ECR_REGISTRY/flamoral/user-service:latest -f backend/services/user-service/Dockerfile .

      # Build Matching Service
      - echo "Building matching-service..."
      - docker build -t $ECR_REGISTRY/flamoral/matching-service:$IMAGE_TAG -t $ECR_REGISTRY/flamoral/matching-service:latest -f backend/services/matching-service/Dockerfile .

      # Build Messaging Service
      - echo "Building messaging-service..."
      - docker build -t $ECR_REGISTRY/flamoral/messaging-service:$IMAGE_TAG -t $ECR_REGISTRY/flamoral/messaging-service:latest -f backend/services/messaging-service/Dockerfile .

      # Build Notification Service
      - echo "Building notification-service..."
      - docker build -t $ECR_REGISTRY/flamoral/notification-service:$IMAGE_TAG -t $ECR_REGISTRY/flamoral/notification-service:latest -f backend/services/notification-service/Dockerfile .

      # Build Media Service
      - echo "Building media-service..."
      - docker build -t $ECR_REGISTRY/flamoral/media-service:$IMAGE_TAG -t $ECR_REGISTRY/flamoral/media-service:latest -f backend/services/media-service/Dockerfile .

      # Build Payment Service
      - echo "Building payment-service..."
      - docker build -t $ECR_REGISTRY/flamoral/payment-service:$IMAGE_TAG -t $ECR_REGISTRY/flamoral/payment-service:latest -f backend/services/payment-service/Dockerfile .

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing Docker images...

      # Push all images
      - docker push $ECR_REGISTRY/flamoral/api-gateway:$IMAGE_TAG
      - docker push $ECR_REGISTRY/flamoral/api-gateway:latest
      - docker push $ECR_REGISTRY/flamoral/auth-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/flamoral/auth-service:latest
      - docker push $ECR_REGISTRY/flamoral/user-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/flamoral/user-service:latest
      - docker push $ECR_REGISTRY/flamoral/matching-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/flamoral/matching-service:latest
      - docker push $ECR_REGISTRY/flamoral/messaging-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/flamoral/messaging-service:latest
      - docker push $ECR_REGISTRY/flamoral/notification-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/flamoral/notification-service:latest
      - docker push $ECR_REGISTRY/flamoral/media-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/flamoral/media-service:latest
      - docker push $ECR_REGISTRY/flamoral/payment-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/flamoral/payment-service:latest

      - echo "All images pushed successfully!"

artifacts:
  files:
    - infrastructure/kubernetes/prod/**/*

cache:
  paths:
    - '/root/.npm/**/*'
