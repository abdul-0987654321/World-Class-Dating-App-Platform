# Trivy Configuration
# Security scanner for vulnerabilities and misconfigurations

format: table
output: results.txt
severity:
  - CRITICAL
  - HIGH
  - MEDIUM

# Vulnerability scanning
vuln:
  type:
    - os
    - library
  ignore-unfixed: false
  skip-dirs:
    - node_modules
    - .git
    - test
    - tests
    - __tests__
    - coverage
    - dist
    - build

# Secret scanning
secret:
  config: trivy-secret.yaml

# Misconfig scanning (IaC)
misconfiguration:
  scanners:
    - terraform
    - dockerfile
    - kubernetes
    - helm
  severity:
    - CRITICAL
    - HIGH
    - MEDIUM
  skip-dirs:
    - node_modules
    - .git

# License scanning
license:
  full: true
  ignored:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
  forbidden:
    - GPL-3.0
    - AGPL-3.0

# Cache settings
cache:
  dir: .trivycache
  ttl: 24h

# Database
db:
  repository: ghcr.io/aquasecurity/trivy-db
  light: false

# Rego policies (custom rules)
rego:
  policy: security/policies
  data: security/policies/data
  namespaces:
    - users
    - custom.dating

# Exit codes
exit-code: 1

# Ignore file
ignorefile: .trivyignore
