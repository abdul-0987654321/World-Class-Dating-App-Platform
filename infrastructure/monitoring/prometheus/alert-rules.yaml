---
# Prometheus Alert Rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: flamoral-monitoring
data:
  # Application Alerts
  application-alerts.yml: |
    groups:
      - name: application
        interval: 30s
        rules:
          # High Error Rate
          - alert: HighErrorRate
            expr: |
              sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
              /
              sum(rate(http_requests_total[5m])) by (service)
              > 0.05
            for: 5m
            labels:
              severity: critical
              component: application
            annotations:
              summary: "High error rate detected in {{ $labels.service }}"
              description: "{{ $labels.service }} has error rate of {{ $value | humanizePercentage }} (threshold: 5%)"

          # High Response Time
          - alert: HighResponseTime
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le)
              ) > 2
            for: 10m
            labels:
              severity: warning
              component: application
            annotations:
              summary: "High response time in {{ $labels.service }}"
              description: "{{ $labels.service }} 95th percentile response time is {{ $value }}s"

          # Service Down
          - alert: ServiceDown
            expr: up{job=~".*-service"} == 0
            for: 2m
            labels:
              severity: critical
              component: application
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "{{ $labels.job }} has been down for more than 2 minutes"

          # High Request Rate
          - alert: HighRequestRate
            expr: |
              sum(rate(http_requests_total[5m])) by (service) > 1000
            for: 5m
            labels:
              severity: warning
              component: application
            annotations:
              summary: "High request rate in {{ $labels.service }}"
              description: "{{ $labels.service }} is receiving {{ $value }} requests/second"

          # Database Connection Pool Exhausted
          - alert: DatabaseConnectionPoolExhausted
            expr: |
              (database_pool_active_connections / database_pool_max_connections) > 0.9
            for: 5m
            labels:
              severity: critical
              component: database
            annotations:
              summary: "Database connection pool near exhaustion"
              description: "{{ $labels.service }} database connection pool is {{ $value | humanizePercentage }} full"

  # Infrastructure Alerts
  infrastructure-alerts.yml: |
    groups:
      - name: infrastructure
        interval: 30s
        rules:
          # Node CPU Usage
          - alert: HighNodeCPU
            expr: |
              100 - (avg by (node) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 10m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "High CPU usage on {{ $labels.node }}"
              description: "Node {{ $labels.node }} CPU usage is {{ $value }}%"

          # Node Memory Usage
          - alert: HighNodeMemory
            expr: |
              (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 10m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "High memory usage on {{ $labels.node }}"
              description: "Node {{ $labels.node }} memory usage is {{ $value }}%"

          # Disk Space Low
          - alert: DiskSpaceLow
            expr: |
              (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
            for: 5m
            labels:
              severity: critical
              component: infrastructure
            annotations:
              summary: "Low disk space on {{ $labels.node }}"
              description: "Node {{ $labels.node }} has only {{ $value }}% disk space available"

          # Pod CPU Throttling
          - alert: PodCPUThrottling
            expr: |
              rate(container_cpu_cfs_throttled_seconds_total[5m]) > 0.5
            for: 10m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "Pod {{ $labels.pod }} is being CPU throttled"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is experiencing CPU throttling"

          # Pod Memory Usage
          - alert: PodHighMemory
            expr: |
              (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
            for: 5m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "Pod {{ $labels.pod }} high memory usage"
              description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of memory limit"

  # Database Alerts
  database-alerts.yml: |
    groups:
      - name: database
        interval: 30s
        rules:
          # PostgreSQL Down
          - alert: PostgreSQLDown
            expr: pg_up == 0
            for: 2m
            labels:
              severity: critical
              component: database
            annotations:
              summary: "PostgreSQL is down"
              description: "PostgreSQL instance {{ $labels.instance }} has been down for more than 2 minutes"

          # High Database Connections
          - alert: HighDatabaseConnections
            expr: |
              (pg_stat_database_numbackends / pg_settings_max_connections) > 0.8
            for: 5m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "High number of database connections"
              description: "PostgreSQL has {{ $value | humanizePercentage }} of max connections in use"

          # Database Replication Lag
          - alert: DatabaseReplicationLag
            expr: pg_replication_lag > 10
            for: 5m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "Database replication lag detected"
              description: "Replication lag is {{ $value }} seconds"

          # Slow Queries
          - alert: SlowQueries
            expr: |
              rate(pg_stat_activity_max_tx_duration[5m]) > 30
            for: 10m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "Slow database queries detected"
              description: "Average query duration is {{ $value }}s"

          # Database Deadlocks
          - alert: DatabaseDeadlocks
            expr: |
              rate(pg_stat_database_deadlocks[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "Database deadlocks detected"
              description: "Database is experiencing {{ $value }} deadlocks per second"

  # Redis Alerts
  redis-alerts.yml: |
    groups:
      - name: redis
        interval: 30s
        rules:
          # Redis Down
          - alert: RedisDown
            expr: redis_up == 0
            for: 2m
            labels:
              severity: critical
              component: cache
            annotations:
              summary: "Redis is down"
              description: "Redis instance {{ $labels.instance }} has been down for more than 2 minutes"

          # High Redis Memory Usage
          - alert: RedisHighMemory
            expr: |
              (redis_memory_used_bytes / redis_memory_max_bytes) > 0.9
            for: 5m
            labels:
              severity: warning
              component: cache
            annotations:
              summary: "Redis memory usage high"
              description: "Redis is using {{ $value | humanizePercentage }} of max memory"

          # Redis Rejected Connections
          - alert: RedisRejectedConnections
            expr: |
              rate(redis_rejected_connections_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
              component: cache
            annotations:
              summary: "Redis rejecting connections"
              description: "Redis is rejecting {{ $value }} connections per second"

  # Business Metrics Alerts
  business-alerts.yml: |
    groups:
      - name: business
        interval: 1m
        rules:
          # Low Match Rate
          - alert: LowMatchRate
            expr: |
              rate(matches_created_total[15m]) < 10
            for: 30m
            labels:
              severity: warning
              component: business
            annotations:
              summary: "Low match creation rate"
              description: "Only {{ $value }} matches created per minute (expected: >10)"

          # High User Registration Failure
          - alert: HighRegistrationFailure
            expr: |
              (rate(user_registration_failed_total[10m]) / rate(user_registration_attempts_total[10m])) > 0.1
            for: 15m
            labels:
              severity: warning
              component: business
            annotations:
              summary: "High user registration failure rate"
              description: "Registration failure rate is {{ $value | humanizePercentage }}"

          # Message Delivery Failure
          - alert: MessageDeliveryFailure
            expr: |
              rate(messages_failed_total[5m]) > 5
            for: 10m
            labels:
              severity: warning
              component: business
            annotations:
              summary: "High message delivery failure rate"
              description: "{{ $value }} messages failing per second"

          # WebSocket Connection Drops
          - alert: HighWebSocketDrops
            expr: |
              rate(websocket_disconnects_total[5m]) > 50
            for: 10m
            labels:
              severity: warning
              component: realtime
            annotations:
              summary: "High WebSocket disconnect rate"
              description: "{{ $value }} WebSocket disconnections per second"

  # Kubernetes Alerts
  kubernetes-alerts.yml: |
    groups:
      - name: kubernetes
        interval: 30s
        rules:
          # Pod Crash Looping
          - alert: PodCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total[15m]) > 0
            for: 15m
            labels:
              severity: critical
              component: kubernetes
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is restarting {{ $value }} times per minute"

          # Deployment Replicas Mismatch
          - alert: DeploymentReplicasMismatch
            expr: |
              kube_deployment_spec_replicas != kube_deployment_status_replicas_available
            for: 10m
            labels:
              severity: warning
              component: kubernetes
            annotations:
              summary: "Deployment {{ $labels.deployment }} replicas mismatch"
              description: "Deployment {{ $labels.deployment }} has {{ $value }} available replicas (expected: {{ $labels.spec_replicas }})"

          # HPA at Max Capacity
          - alert: HPAMaxedOut
            expr: |
              kube_hpa_status_current_replicas == kube_hpa_spec_max_replicas
            for: 15m
            labels:
              severity: warning
              component: kubernetes
            annotations:
              summary: "HPA {{ $labels.hpa }} has reached max replicas"
              description: "HPA {{ $labels.hpa }} is at maximum capacity with {{ $value }} replicas"

          # Persistent Volume Usage High
          - alert: PersistentVolumeUsageHigh
            expr: |
              (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
            for: 5m
            labels:
              severity: warning
              component: kubernetes
            annotations:
              summary: "PV {{ $labels.persistentvolumeclaim }} usage high"
              description: "PV {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
