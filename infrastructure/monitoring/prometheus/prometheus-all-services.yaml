  - job_name: 'ai-services'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - flamoral-ai
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true

remote_write:
  - url: "https://prometheus-long-term-storage.flamoral.com/api/v1/write"
    queue_config:
      capacity: 10000
      max_shards: 50
