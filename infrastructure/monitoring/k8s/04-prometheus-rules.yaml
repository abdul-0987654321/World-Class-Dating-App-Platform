---
# ConfigMap for Prometheus Alert Rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: flamoral-monitoring
data:
  # Infrastructure Alerts
  infrastructure-alerts.yml: |
    groups:
    - name: infrastructure
      interval: 30s
      rules:
      - alert: NodeDown
        expr: up{job="kubernetes-nodes"} == 0
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Node {{ $labels.node }} is down"
          description: "Kubernetes node {{ $labels.node }} has been down for more than 5 minutes."
          runbook_url: "https://runbooks.flamoral.com/NodeDown"

      - alert: NodeHighCPU
        expr: (100 - (avg by (node) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 85
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Node {{ $labels.node }} has high CPU usage"
          description: "Node {{ $labels.node }} CPU usage is {{ $value }}% for more than 10 minutes."

      - alert: NodeHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Node {{ $labels.node }} has high memory usage"
          description: "Node {{ $labels.node }} memory usage is {{ $value }}% for more than 10 minutes."

      - alert: NodeDiskSpaceRunningOut
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Node {{ $labels.node }} disk space running out"
          description: "Node {{ $labels.node }} has only {{ $value }}% disk space available."

      - alert: NodeDiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
        for: 1m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Node {{ $labels.node }} disk space critical"
          description: "Node {{ $labels.node }} has only {{ $value }}% disk space available!"
          runbook_url: "https://runbooks.flamoral.com/DiskSpaceCritical"

  # Service Alerts
  service-alerts.yml: |
    groups:
    - name: services
      interval: 30s
      rules:
      - alert: ServiceDown
        expr: up{job=~".*-service"} == 0
        for: 2m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 2 minutes."
          runbook_url: "https://runbooks.flamoral.com/ServiceDown"

      - alert: HighErrorRate
        expr: (sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service)) * 100 > 5
        for: 5m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} has {{ $value }}% error rate for more than 5 minutes."
          runbook_url: "https://runbooks.flamoral.com/HighErrorRate"

      - alert: HighErrorRateWarning
        expr: (sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service)) * 100 > 2
        for: 10m
        labels:
          severity: warning
          component: service
        annotations:
          summary: "Elevated error rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} has {{ $value }}% error rate."

      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 10m
        labels:
          severity: warning
          component: service
        annotations:
          summary: "Slow response time on {{ $labels.service }}"
          description: "Service {{ $labels.service }} p95 response time is {{ $value }}s for more than 10 minutes."

      - alert: VerySlowResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 5
        for: 5m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "Very slow response time on {{ $labels.service }}"
          description: "Service {{ $labels.service }} p95 response time is {{ $value }}s!"
          runbook_url: "https://runbooks.flamoral.com/SlowResponseTime"

  # API Gateway Alerts
  api-gateway-alerts.yml: |
    groups:
    - name: api_gateway
      interval: 30s
      rules:
      - alert: APIGatewayDown
        expr: up{job="api-gateway"} == 0
        for: 1m
        labels:
          severity: critical
          service: api-gateway
        annotations:
          summary: "API Gateway is down"
          description: "API Gateway has been down for more than 1 minute. Users cannot access the platform!"
          runbook_url: "https://runbooks.flamoral.com/APIGatewayDown"

      - alert: APIGatewayHighLatency
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="api-gateway"}[5m])) by (le)) > 3
        for: 5m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: "API Gateway has high latency"
          description: "API Gateway p99 latency is {{ $value }}s."

      - alert: APIGatewayHighThroughput
        expr: sum(rate(http_requests_total{service="api-gateway"}[5m])) > 10000
        for: 10m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: "API Gateway handling high traffic"
          description: "API Gateway is handling {{ $value }} requests/sec. Consider scaling."

  # Auth Service Alerts
  auth-alerts.yml: |
    groups:
    - name: auth_service
      interval: 30s
      rules:
      - alert: AuthServiceDown
        expr: up{job="auth-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: auth-service
        annotations:
          summary: "Auth Service is down"
          description: "Auth Service has been down for more than 1 minute. Users cannot login!"
          runbook_url: "https://runbooks.flamoral.com/AuthServiceDown"

      - alert: HighLoginFailureRate
        expr: (sum(rate(login_attempts_total{status="failed"}[5m])) / sum(rate(login_attempts_total[5m]))) * 100 > 20
        for: 5m
        labels:
          severity: warning
          service: auth-service
        annotations:
          summary: "High login failure rate"
          description: "Login failure rate is {{ $value }}%. Possible credential stuffing attack."

      - alert: VeryHighLoginFailureRate
        expr: (sum(rate(login_attempts_total{status="failed"}[5m])) / sum(rate(login_attempts_total[5m]))) * 100 > 50
        for: 2m
        labels:
          severity: critical
          service: auth-service
        annotations:
          summary: "Very high login failure rate"
          description: "Login failure rate is {{ $value }}%! Likely under attack!"
          runbook_url: "https://runbooks.flamoral.com/BruteForceAttack"

      - alert: JWTTokenGenerationSlow
        expr: histogram_quantile(0.95, rate(jwt_generation_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: auth-service
        annotations:
          summary: "JWT token generation is slow"
          description: "JWT token generation p95 is {{ $value }}s."

  # Payment Service Alerts
  payment-alerts.yml: |
    groups:
    - name: payment_service
      interval: 30s
      rules:
      - alert: PaymentServiceDown
        expr: up{job="payment-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: payment-service
        annotations:
          summary: "Payment Service is down"
          description: "Payment Service has been down for more than 1 minute!"
          runbook_url: "https://runbooks.flamoral.com/PaymentServiceDown"

      - alert: HighPaymentFailureRate
        expr: (sum(rate(payment_transactions_total{status="failed"}[10m])) / sum(rate(payment_transactions_total[10m]))) * 100 > 10
        for: 5m
        labels:
          severity: critical
          service: payment-service
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value }}%. Revenue is being impacted!"
          runbook_url: "https://runbooks.flamoral.com/PaymentFailures"

      - alert: PaymentProcessingSlow
        expr: histogram_quantile(0.95, rate(payment_processing_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
          service: payment-service
        annotations:
          summary: "Payment processing is slow"
          description: "Payment processing p95 is {{ $value }}s. Users experiencing delays."

      - alert: StripeWebhookFailures
        expr: sum(rate(stripe_webhook_errors_total[5m])) > 1
        for: 3m
        labels:
          severity: critical
          service: payment-service
        annotations:
          summary: "Stripe webhook failures detected"
          description: "Stripe webhooks are failing at {{ $value }} errors/sec. Subscription updates may be delayed!"
          runbook_url: "https://runbooks.flamoral.com/StripeWebhookFailures"

  # Database Alerts
  database-alerts.yml: |
    groups:
    - name: databases
      interval: 30s
      rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          component: database
          database_type: postgresql
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL database {{ $labels.instance }} is down!"
          runbook_url: "https://runbooks.flamoral.com/PostgreSQLDown"

      - alert: PostgreSQLTooManyConnections
        expr: (pg_stat_database_numbackends / pg_settings_max_connections) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: database
          database_type: postgresql
        annotations:
          summary: "PostgreSQL has too many connections"
          description: "PostgreSQL {{ $labels.instance }} is using {{ $value }}% of max connections."

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_stat_statements_mean_exec_time[5m]) > 1000
        for: 10m
        labels:
          severity: warning
          component: database
          database_type: postgresql
        annotations:
          summary: "PostgreSQL has slow queries"
          description: "PostgreSQL {{ $labels.instance }} average query time is {{ $value }}ms."

      - alert: PostgreSQLReplicationLag
        expr: pg_replication_lag_seconds > 60
        for: 5m
        labels:
          severity: critical
          component: database
          database_type: postgresql
        annotations:
          summary: "PostgreSQL replication lag detected"
          description: "PostgreSQL replication lag is {{ $value }}s on {{ $labels.instance }}!"
          runbook_url: "https://runbooks.flamoral.com/PostgreSQLReplicationLag"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          component: cache
          cache_type: redis
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is down!"
          runbook_url: "https://runbooks.flamoral.com/RedisDown"

      - alert: RedisHighMemoryUsage
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
          component: cache
          cache_type: redis
        annotations:
          summary: "Redis high memory usage"
          description: "Redis {{ $labels.instance }} memory usage is {{ $value }}%."

      - alert: RedisConnectionsHigh
        expr: redis_connected_clients > 9000
        for: 5m
        labels:
          severity: warning
          component: cache
          cache_type: redis
        annotations:
          summary: "Redis has many connections"
          description: "Redis {{ $labels.instance }} has {{ $value }} connections."

      - alert: MongoDBDown
        expr: mongodb_up == 0
        for: 1m
        labels:
          severity: critical
          component: database
          database_type: mongodb
        annotations:
          summary: "MongoDB is down"
          description: "MongoDB instance {{ $labels.instance }} is down!"
          runbook_url: "https://runbooks.flamoral.com/MongoDBDown"

  # Messaging Service Alerts
  messaging-alerts.yml: |
    groups:
    - name: messaging_service
      interval: 30s
      rules:
      - alert: MessagingServiceDown
        expr: up{job="messaging-service"} == 0
        for: 2m
        labels:
          severity: critical
          service: messaging-service
        annotations:
          summary: "Messaging Service is down"
          description: "Messaging Service has been down for more than 2 minutes!"
          runbook_url: "https://runbooks.flamoral.com/MessagingServiceDown"

      - alert: MessageDeliveryFailureRate
        expr: (sum(rate(messages_sent_total{status="failed"}[5m])) / sum(rate(messages_sent_total[5m]))) * 100 > 5
        for: 5m
        labels:
          severity: critical
          service: messaging-service
        annotations:
          summary: "High message delivery failure rate"
          description: "Message delivery failure rate is {{ $value }}%!"

      - alert: MessageQueueBacklog
        expr: message_queue_depth > 10000
        for: 10m
        labels:
          severity: warning
          service: messaging-service
        annotations:
          summary: "Message queue has large backlog"
          description: "Message queue has {{ $value }} pending messages."

      - alert: WebSocketConnectionsHigh
        expr: websocket_connections_active > 50000
        for: 5m
        labels:
          severity: warning
          service: messaging-service
        annotations:
          summary: "High number of WebSocket connections"
          description: "{{ $value }} active WebSocket connections. Consider scaling."

  # Media Service Alerts
  media-alerts.yml: |
    groups:
    - name: media_service
      interval: 30s
      rules:
      - alert: MediaServiceDown
        expr: up{job="media-service"} == 0
        for: 2m
        labels:
          severity: critical
          service: media-service
        annotations:
          summary: "Media Service is down"
          description: "Media Service has been down for more than 2 minutes!"

      - alert: MediaUploadFailureRate
        expr: (sum(rate(media_uploads_total{status="failed"}[5m])) / sum(rate(media_uploads_total[5m]))) * 100 > 10
        for: 5m
        labels:
          severity: warning
          service: media-service
        annotations:
          summary: "High media upload failure rate"
          description: "Media upload failure rate is {{ $value }}%."

      - alert: MediaProcessingQueueBacklog
        expr: media_processing_queue_depth > 1000
        for: 10m
        labels:
          severity: warning
          service: media-service
        annotations:
          summary: "Media processing queue backlog"
          description: "Media processing queue has {{ $value }} pending items."

      - alert: BlobStorageErrors
        expr: sum(rate(blob_storage_errors_total[5m])) > 5
        for: 5m
        labels:
          severity: critical
          service: media-service
        annotations:
          summary: "Blob storage errors detected"
          description: "Blob storage is experiencing {{ $value }} errors/sec!"
          runbook_url: "https://runbooks.flamoral.com/BlobStorageErrors"

  # Security Alerts
  security-alerts.yml: |
    groups:
    - name: security
      interval: 30s
      rules:
      - alert: SuspiciousLoginActivity
        expr: sum(rate(login_attempts_total{status="failed"}[1m])) by (ip) > 10
        for: 2m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Suspicious login activity from {{ $labels.ip }}"
          description: "IP {{ $labels.ip }} has {{ $value }} failed login attempts/sec."

      - alert: RateLimitExceeded
        expr: sum(rate(rate_limit_exceeded_total[5m])) by (service, endpoint) > 100
        for: 5m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Rate limit exceeded on {{ $labels.service }}/{{ $labels.endpoint }}"
          description: "{{ $value }} rate limit violations/sec. Possible abuse."

      - alert: UnauthorizedAccessAttempts
        expr: sum(rate(http_requests_total{status="401"}[5m])) > 50
        for: 5m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "High number of unauthorized access attempts"
          description: "{{ $value }} unauthorized access attempts/sec detected."

      - alert: ModerationQueueBacklog
        expr: moderation_queue_depth > 5000
        for: 30m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Moderation queue has large backlog"
          description: "Moderation queue has {{ $value }} pending items."
