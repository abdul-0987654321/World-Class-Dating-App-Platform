# Service Level Objectives (SLOs) and Service Level Indicators (SLIs)
# for Dating App Platform

apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-definitions
  namespace: monitoring
data:
  slos.yaml: |
    # ====================================
    # API Service SLOs
    # ====================================
    api_service:
      # Availability SLO
      availability:
        slo: 99.95  # 99.95% uptime
        sli:
          metric: "sum(up{job='dating-api'}) / count(up{job='dating-api'}) * 100"
          window: "30d"
        error_budget: 0.05  # 0.05% downtime allowed
        error_budget_minutes: 21.6  # per month

      # Latency SLO
      latency:
        slo: 99  # 99% of requests < 500ms
        threshold: 500  # milliseconds
        sli:
          metric: "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job='dating-api'}[5m])) by (le))"
          window: "30d"

      # Success Rate SLO
      success_rate:
        slo: 99.9  # 99.9% success rate
        sli:
          metric: "sum(rate(http_requests_total{job='dating-api',code=~'2..'}[5m])) / sum(rate(http_requests_total{job='dating-api'}[5m])) * 100"
          window: "30d"
        error_budget: 0.1

    # ====================================
    # Database SLOs
    # ====================================
    database_service:
      # Availability SLO
      availability:
        slo: 99.99  # 99.99% uptime
        sli:
          metric: "up{job='postgres'}"
          window: "30d"

      # Query Performance SLO
      query_performance:
        slo: 95  # 95% of queries < 100ms
        threshold: 100  # milliseconds
        sli:
          metric: "histogram_quantile(0.95, sum(rate(pg_stat_statements_mean_exec_time_bucket[5m])) by (le))"
          window: "30d"

      # Connection Pool SLO
      connection_pool:
        slo: 80  # Connection pool < 80% utilized
        threshold: 80  # percent
        sli:
          metric: "pg_stat_activity_count / pg_settings_max_connections * 100"
          window: "24h"

    # ====================================
    # Messaging Service SLOs
    # ====================================
    messaging_service:
      # Delivery SLO
      message_delivery:
        slo: 99.99  # 99.99% message delivery
        sli:
          metric: "sum(messages_delivered_total) / sum(messages_sent_total) * 100"
          window: "30d"

      # Latency SLO
      message_latency:
        slo: 99  # 99% of messages delivered < 1s
        threshold: 1000  # milliseconds
        sli:
          metric: "histogram_quantile(0.99, sum(rate(message_delivery_duration_bucket[5m])) by (le))"
          window: "30d"

    # ====================================
    # Matching Service SLOs
    # ====================================
    matching_service:
      # Accuracy SLO
      match_accuracy:
        slo: 90  # 90% of matches result in interaction
        sli:
          metric: "sum(match_interactions_total) / sum(matches_generated_total) * 100"
          window: "7d"

      # Latency SLO
      match_generation_latency:
        slo: 95  # 95% of match generations < 2s
        threshold: 2000  # milliseconds
        sli:
          metric: "histogram_quantile(0.95, sum(rate(match_generation_duration_bucket[5m])) by (le))"
          window: "24h"

    # ====================================
    # User Experience SLOs
    # ====================================
    user_experience:
      # Page Load Time
      page_load_time:
        slo: 95  # 95% of page loads < 3s
        threshold: 3000  # milliseconds
        sli:
          metric: "histogram_quantile(0.95, sum(rate(page_load_duration_bucket[5m])) by (le))"
          window: "24h"

      # Mobile App Crash Rate
      crash_rate:
        slo: 99.5  # < 0.5% crash rate
        threshold: 0.5  # percent
        sli:
          metric: "(sum(app_crashes_total) / sum(app_sessions_total)) * 100"
          window: "7d"

---
# PrometheusRule for SLO Monitoring
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-alerts
  namespace: monitoring
spec:
  groups:
  - name: slo_violations
    interval: 30s
    rules:
    # API Availability SLO
    - alert: APIAvailabilitySLOViolation
      expr: |
        (
          sum(up{job="dating-api"}) / count(up{job="dating-api"}) * 100
        ) < 99.95
      for: 5m
      labels:
        severity: critical
        slo: availability
        service: api
      annotations:
        summary: "API Availability SLO Violation"
        description: "API availability is {{ $value }}%, below SLO of 99.95%"
        runbook_url: "https://wiki.datingapp.com/runbooks/api-availability"

    # API Latency SLO
    - alert: APILatencySLOViolation
      expr: |
        histogram_quantile(0.99,
          sum(rate(http_request_duration_seconds_bucket{job="dating-api"}[5m])) by (le)
        ) > 0.5
      for: 10m
      labels:
        severity: warning
        slo: latency
        service: api
      annotations:
        summary: "API Latency SLO Violation"
        description: "P99 latency is {{ $value }}s, above SLO of 500ms"
        runbook_url: "https://wiki.datingapp.com/runbooks/api-latency"

    # API Success Rate SLO
    - alert: APISuccessRateSLOViolation
      expr: |
        (
          sum(rate(http_requests_total{job="dating-api",code=~"2.."}[5m])) /
          sum(rate(http_requests_total{job="dating-api"}[5m]))
        ) < 0.999
      for: 5m
      labels:
        severity: critical
        slo: success_rate
        service: api
      annotations:
        summary: "API Success Rate SLO Violation"
        description: "API success rate is {{ $value | humanizePercentage }}, below SLO of 99.9%"
        runbook_url: "https://wiki.datingapp.com/runbooks/api-errors"

    # Database Availability SLO
    - alert: DatabaseAvailabilitySLOViolation
      expr: up{job="postgres"} < 1
      for: 1m
      labels:
        severity: critical
        slo: availability
        service: database
      annotations:
        summary: "Database Availability SLO Violation"
        description: "Database is unavailable"
        runbook_url: "https://wiki.datingapp.com/runbooks/database-down"

    # Error Budget Burn Rate
    - alert: ErrorBudgetBurnRateHigh
      expr: |
        (
          1 - (sum(rate(http_requests_total{job="dating-api",code=~"2.."}[1h])) /
               sum(rate(http_requests_total{job="dating-api"}[1h])))
        ) > (0.001 * 14.4)  # Burning budget 14.4x faster than allowed
      for: 5m
      labels:
        severity: critical
        slo: error_budget
        service: api
      annotations:
        summary: "Error Budget Burning Too Fast"
        description: "Error budget is being consumed at {{ $value }}x the sustainable rate"
        runbook_url: "https://wiki.datingapp.com/runbooks/error-budget"

    # Message Delivery SLO
    - alert: MessageDeliverySLOViolation
      expr: |
        (
          sum(rate(messages_delivered_total[5m])) /
          sum(rate(messages_sent_total[5m]))
        ) < 0.9999
      for: 10m
      labels:
        severity: warning
        slo: delivery
        service: messaging
      annotations:
        summary: "Message Delivery SLO Violation"
        description: "Message delivery rate is {{ $value | humanizePercentage }}, below SLO of 99.99%"
        runbook_url: "https://wiki.datingapp.com/runbooks/message-delivery"

---
# Recording Rules for SLI Metrics
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sli-recording-rules
  namespace: monitoring
spec:
  groups:
  - name: sli_metrics
    interval: 30s
    rules:
    # API Success Rate (5m window)
    - record: sli:api:success_rate:5m
      expr: |
        sum(rate(http_requests_total{job="dating-api",code=~"2.."}[5m])) /
        sum(rate(http_requests_total{job="dating-api"}[5m]))

    # API Success Rate (30d window)
    - record: sli:api:success_rate:30d
      expr: |
        sum(rate(http_requests_total{job="dating-api",code=~"2.."}[30d])) /
        sum(rate(http_requests_total{job="dating-api"}[30d]))

    # API P99 Latency
    - record: sli:api:latency:p99
      expr: |
        histogram_quantile(0.99,
          sum(rate(http_request_duration_seconds_bucket{job="dating-api"}[5m])) by (le)
        )

    # API P95 Latency
    - record: sli:api:latency:p95
      expr: |
        histogram_quantile(0.95,
          sum(rate(http_request_duration_seconds_bucket{job="dating-api"}[5m])) by (le)
        )

    # API P50 Latency
    - record: sli:api:latency:p50
      expr: |
        histogram_quantile(0.50,
          sum(rate(http_request_duration_seconds_bucket{job="dating-api"}[5m])) by (le)
        )

    # API Availability
    - record: sli:api:availability
      expr: |
        sum(up{job="dating-api"}) / count(up{job="dating-api"})

    # Error Budget Remaining (30d)
    - record: sli:api:error_budget_remaining:30d
      expr: |
        1 - (
          (1 - sli:api:success_rate:30d) / 0.001
        )

    # Cache Hit Rate
    - record: sli:cache:hit_rate
      expr: |
        sum(rate(redis_keyspace_hits_total[5m])) /
        (sum(rate(redis_keyspace_hits_total[5m])) + sum(rate(redis_keyspace_misses_total[5m])))

    # Database Connection Pool Utilization
    - record: sli:database:connection_pool_utilization
      expr: |
        pg_stat_activity_count / pg_settings_max_connections
