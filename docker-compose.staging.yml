version: '3.8'

services:
  # PostgreSQL Database for Moderation Service
  postgres-moderation:
    image: postgres:15-alpine
    container_name: flamoral-postgres-moderation-staging
    environment:
      POSTGRES_DB: flamoral_moderation_staging
      POSTGRES_USER: ${POSTGRES_USER:-flamoral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres-moderation-staging-data:/var/lib/postgresql/data
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flamoral"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: flamoral-redis-staging
    ports:
      - "6380:6379"
    volumes:
      - redis-staging-data:/data
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Moderation Service
  moderation-service:
    build:
      context: ./backend/services/moderation-service
      dockerfile: Dockerfile
    container_name: flamoral-moderation-service-staging
    environment:
      NODE_ENV: staging
      PORT: 3005
      DATABASE_URL: postgres://flamoral:${POSTGRES_PASSWORD}@postgres-moderation:5432/flamoral_moderation_staging
      REDIS_URL: redis://redis:6379

      # AWS Rekognition
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # Azure Content Moderator
      AZURE_CONTENT_MODERATOR_KEY: ${AZURE_CONTENT_MODERATOR_KEY}
      AZURE_CONTENT_MODERATOR_ENDPOINT: ${AZURE_CONTENT_MODERATOR_ENDPOINT}

      # Moderation Thresholds
      AUTO_REJECT_THRESHOLD: ${AUTO_REJECT_THRESHOLD:-0.90}
      AUTO_FLAG_THRESHOLD: ${AUTO_FLAG_THRESHOLD:-0.70}

      # User Sanctions
      SUSPENSION_VIOLATION_COUNT: ${SUSPENSION_VIOLATION_COUNT:-3}
      BAN_VIOLATION_COUNT: ${BAN_VIOLATION_COUNT:-5}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

    ports:
      - "3005:3005"
    depends_on:
      postgres-moderation:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    volumes:
      - ./backend/services/moderation-service/logs:/app/logs

  # Media Service
  media-service:
    build:
      context: ./backend/services/media-service
      dockerfile: Dockerfile
    container_name: flamoral-media-service-staging
    environment:
      NODE_ENV: staging
      PORT: 3004

      # Moderation Service URL
      MODERATION_SERVICE_URL: http://moderation-service:3005

      # Azure Blob Storage
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-media-staging}

      # Database
      DATABASE_URL: ${MEDIA_SERVICE_DATABASE_URL}

    ports:
      - "3004:3004"
    depends_on:
      - moderation-service
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ./backend/services/user-service
      dockerfile: Dockerfile
    container_name: flamoral-user-service-staging
    environment:
      NODE_ENV: staging
      PORT: 3001

      # Moderation Service URL
      MODERATION_SERVICE_URL: http://moderation-service:3005

      # Database
      DATABASE_URL: ${USER_SERVICE_DATABASE_URL}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "3001:3001"
    depends_on:
      - moderation-service
    networks:
      - flamoral-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend Web App
  frontend-web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile.staging
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3001}
        REACT_APP_MEDIA_SERVICE_URL: ${REACT_APP_MEDIA_SERVICE_URL:-http://localhost:3004}
        REACT_APP_MODERATION_SERVICE_URL: ${REACT_APP_MODERATION_SERVICE_URL:-http://localhost:3005}
    container_name: flamoral-frontend-web-staging
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - media-service
      - moderation-service
    networks:
      - flamoral-staging
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: flamoral-nginx-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/staging.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend-web
      - user-service
      - media-service
      - moderation-service
    networks:
      - flamoral-staging
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: flamoral-prometheus-staging
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-staging-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - flamoral-staging
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: flamoral-grafana-staging
    ports:
      - "3010:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-staging-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - flamoral-staging
    restart: unless-stopped

networks:
  flamoral-staging:
    driver: bridge

volumes:
  postgres-moderation-staging-data:
  redis-staging-data:
  prometheus-staging-data:
  grafana-staging-data:
